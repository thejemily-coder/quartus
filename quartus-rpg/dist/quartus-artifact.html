<title>Quartus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #0c0a09; --bg2: #14110f; --panel: #1a1613; --line: #2b2520;
  --text: #e6dcc8; --dim: #9a9080; --ember: #c9772f; --blood: #a03232; --gold: #c2a25a;
  --good: #8fb07a; --bad: #c46a5a;
  --fs: 1.22rem;
}
:root[data-skin="parchment"] {
  color-scheme: light;
  --bg: #e9dfc8; --bg2: #e1d5ba; --panel: #efe6d1; --line: #c9b992;
  --text: #2a2118; --dim: #6b5d48; --ember: #9a4f14; --blood: #7c1f1f; --gold: #7a5d1e;
  --good: #4c6b3a; --bad: #8a3a2c;
}
:root[data-size="s"] { --fs: 1.08rem; }
:root[data-size="l"] { --fs: 1.42rem; }

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--text); font-family: 'EB Garamond', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: var(--fs); line-height: 1.62; min-height: 100vh;
  background: radial-gradient(ellipse at 50% -10%, var(--bg2), var(--bg) 70%) fixed;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, .small, .place, .epnum, .btn, .who, .tag { font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif; }

#bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 8px 16px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
#bar .brand { letter-spacing: .38em; font-size: .8rem; color: var(--dim); font-family: 'Cormorant Garamond', serif; font-weight: 600; }
#povbar { flex: 1; display: flex; gap: 10px; align-items: center; justify-content: center; min-height: 1.5em; }
.povname { font-family: 'Cormorant Garamond', serif; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: .9rem; }
#bar nav { display: flex; gap: 2px; }
#bar nav button { background: none; border: 0; padding: 6px 9px; color: var(--dim); font-size: .85rem; letter-spacing: .06em; font-family: 'Cormorant Garamond', serif; text-transform: uppercase; }
#bar nav button:hover { color: var(--text); }

.stage { max-width: 40rem; margin: 0 auto; padding: 28px 18px 90px; }
.small { text-transform: uppercase; letter-spacing: .24em; font-size: .72rem; color: var(--dim); font-weight: 600; }
.quiet { color: var(--dim); font-style: italic; }

.place { font-variant: small-caps; letter-spacing: .18em; color: var(--dim); font-size: .85rem; margin-bottom: 4px; }
.scene { border-left: 2px solid var(--pov, var(--line)); padding-left: 18px; }
.stitle { margin: 0 0 14px; font-weight: 600; font-size: 1.5rem; letter-spacing: .02em; }
.scene p { margin: 0 0 1.05em; }
.scene p.drop::first-letter { font-family: 'Cormorant Garamond', serif; font-size: 3.1em; float: left; line-height: .82; padding: 6px 9px 0 0; color: var(--pov, var(--gold)); font-weight: 600; }
.say .who { font-variant: small-caps; letter-spacing: .08em; color: var(--gold); font-weight: 700; margin-right: .3em; }
.say { padding-left: 1em; text-indent: -1em; }
.epigraph { font-style: italic; color: var(--dim); text-align: center; margin: 1.4em 1em; }
.subhead { font-size: 1.15rem; letter-spacing: .08em; font-variant: small-caps; color: var(--gold); margin: 1.3em 0 .4em; font-weight: 600; }
hr { border: 0; border-top: 1px solid var(--line); margin: 1.4em 25%; }

.rise { animation: rise .7s both; }
:root[data-motion="off"] .rise { animation: none; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.choices { display: flex; flex-direction: column; gap: 8px; margin-top: 1.6em; }
.choice {
  display: flex; gap: 12px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
  padding: 11px 14px; line-height: 1.4; transition: border-color .15s, background .15s;
}
.choice:hover:not(:disabled), .choice:focus-visible { border-color: var(--pov, var(--ember)); background: color-mix(in srgb, var(--panel) 80%, var(--pov, var(--ember)) 8%); outline: none; }
.choice .num { color: var(--dim); font-family: 'Cormorant Garamond', serif; min-width: 1.1em; }
.choice .tag { color: var(--pov, var(--ember)); text-transform: uppercase; letter-spacing: .1em; font-size: .78em; }
.choice .hint { color: var(--dim); font-size: .85em; }
.choice.locked { opacity: .45; cursor: not-allowed; }

.btn {
  background: var(--panel); border: 1px solid var(--line); padding: 9px 20px; letter-spacing: .14em; text-transform: uppercase; font-size: .85rem; font-weight: 600;
  border-radius: 2px; transition: border-color .15s, color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--ember); color: var(--ember); }
.btn.primary { border-color: var(--ember); color: var(--ember); }
.btn.sm { padding: 5px 12px; font-size: .75rem; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

.card { text-align: center; padding: 8vh 0 4vh; }
.card h1 { font-size: 2.6rem; font-weight: 500; letter-spacing: .08em; margin: .2em 0 .4em; }
.card h2 { font-size: 2rem; font-weight: 500; letter-spacing: .06em; margin: .3em 0; }
.epnum { letter-spacing: .5em; text-transform: uppercase; color: var(--ember); margin-top: 1.4em; font-size: .9rem; }
.logline { color: var(--dim); font-style: italic; max-width: 28rem; margin: 0 auto 2em; }
.chcard h2 { color: var(--pov); }
.recap { text-align: left; max-width: 30rem; margin: 2em auto; }
.recap ul { padding-left: 1.1em; color: var(--dim); }
.card .btn { margin-top: 1.4em; }
.deathcard h2 { color: var(--blood); }
.cast { max-width: 24rem; margin: 1.5em auto; }
.castrow { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); color: var(--pov); }
.castrow.dead { text-decoration: line-through; color: var(--dim); }

.checkcard .dice { display: flex; gap: 14px; justify-content: center; margin: 1em 0; }
.die { width: 3.2rem; height: 3.2rem; line-height: 3.1rem; border: 1px solid var(--gold); font-size: 1.7rem; border-radius: 6px; background: var(--panel); animation: tumble .6s both; }
:root[data-motion="off"] .die { animation: none; }
@keyframes tumble { from { transform: rotate(-200deg) scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
.checkcard .verdict { font-size: 1.8rem; font-variant: small-caps; letter-spacing: .12em; margin-top: .4em; }
.checkcard.win .verdict { color: var(--good); } .checkcard.loss .verdict { color: var(--bad); }

.duel { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 14px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); }
.duel .side:last-child { text-align: right; } .duel .vs { color: var(--dim); }
.round { margin: 0 0 .8em; padding-left: 12px; border-left: 1px solid var(--line); }
.pips { display: inline-flex; gap: 3px; vertical-align: middle; flex-wrap: wrap; max-width: 100%; }
#povbar .pips { flex-wrap: nowrap; flex: none; }
.pips i { width: 9px; height: 9px; border: 1px solid var(--blood); border-radius: 50%; }
.pips i.on { background: var(--blood); }
.pips.foe i { border-color: var(--gold); } .pips.foe i.on { background: var(--gold); }
.pips.sm i { width: 6px; height: 6px; }

#toasts { position: fixed; top: 52px; right: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 30; pointer-events: none; }
.toast { background: var(--panel); border: 1px solid var(--line); padding: 7px 12px; font-size: .9rem; font-style: italic; animation: rise .4s both; transition: opacity .6s; max-width: 18rem; }
.toast.good { border-color: var(--good); } .toast.bad { border-color: var(--bad); } .toast.item, .toast.clue { border-color: var(--gold); }
.toast.out { opacity: 0; }

#modal, #title { position: fixed; inset: 0; display: none; z-index: 20; }
#modal.open { z-index: 60; display: flex; align-items: flex-start; justify-content: center; background: rgba(0,0,0,.65); overflow: auto; padding: 5vh 12px; }
#title.open { display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 40; overflow: auto; }
.sheet { background: var(--bg); border: 1px solid var(--line); max-width: 36rem; width: 100%; padding: 22px 24px 28px; position: relative; }
.sheet h2 { margin: 0 0 .3em; font-weight: 500; letter-spacing: .08em; }
.x { position: absolute; top: 6px; right: 10px; background: none; border: 0; font-size: 1.6rem; color: var(--dim); }
.tabs, .seg { display: flex; gap: 4px; flex-wrap: wrap; margin: .6em 0; }
.tabs button, .seg button { background: none; border: 1px solid var(--line); padding: 5px 12px; font-family: 'Cormorant Garamond', serif; letter-spacing: .08em; text-transform: uppercase; font-size: .8rem; }
.tabs .on, .seg .on { border-color: var(--ember); color: var(--ember); }
.member { border-left: 2px solid var(--pov); padding: 4px 0 4px 12px; margin: 1em 0; }
.member .mh { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; } .member .ep { color: var(--dim); font-style: italic; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; font-size: .9rem; color: var(--dim); text-transform: capitalize; margin: 4px 0; } .stats b { color: var(--text); }
.blurb { font-size: .95rem; color: var(--dim); margin: .4em 0 0; }
.bonds { list-style: none; padding: 0; } .bonds li { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid var(--line); }
.bonds .pos { color: var(--good); } .bonds .neg { color: var(--bad); }
.slot { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
textarea { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); font-family: monospace; font-size: .75rem; }

.titlecard { text-align: center; max-width: 34rem; padding: 24px; }
.titlecard h1 { font-size: clamp(3rem, 14vw, 5.4rem); letter-spacing: .3em; margin: .1em 0 .05em .3em; font-weight: 500; }
.gate { margin: 2em 0 1em; font-size: .92rem; color: var(--dim); text-align: left; }
.gate input { margin-right: 6px; }
.tmenu { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.foot { margin-top: 2em; font-size: .9rem; }

@media (max-width: 520px) { .stage { padding: 18px 14px 80px; } .scene { padding-left: 12px; } #bar .brand { display: none; } #bar { padding: 8px 8px; gap: 4px; } #bar nav button { padding: 6px 5px; font-size: .72rem; } #povbar .pips i { width: 5px; height: 5px; } #povbar { gap: 6px; justify-content: flex-start; } }

.syncnote { font-size: .85rem; color: var(--dim); margin: 1.4em 0 0; }
.syncnote.on { color: var(--good); }
.sheet .syncnote { margin: .4em 0 .8em; padding: 8px 10px; border: 1px solid var(--line); }
.sheet .syncnote.on { border-color: var(--good); }
.slot > div:first-child { min-width: 0; }
.slot > div:last-child { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; flex: none; }

</style>
<div id="app">
  <header id="bar">
    <span class="brand">QUARTUS</span>
    <div id="povbar"></div>
    <nav>
      <button id="btn-journal">Journal</button>
      <button id="btn-saves">Saves</button>
      <button id="btn-settings">Settings</button>
      <button id="btn-menu">Menu</button>
    </nav>
  </header>
  <main id="stage" class="stage" aria-live="polite"></main>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal"></div>
  <div id="title"></div>
</div>
<script>
/* js/engine.js */
/* QUARTUS — narrative engine. Pure logic: no DOM access, so it can be tested headlessly. */
(function (root) {
  'use strict';
  var Q = root.Q = root.Q || {};

  Q.VERSION = 1;
  Q.chars = {};      // POV definitions (see data/world.js)
  Q.npcs = {};       // NPC registry: id -> {name, role}
  Q.scenes = {};     // every scene, all episodes
  Q.episodes = {};   // by episode number
  Q.rng = Math.random;
  Q.toasts = [];     // ephemeral UI notifications, drained by the UI
  Q.TOTAL_EPISODES = 10;

  /* ---------- registration ---------- */
  Q._parts = {};
  // Episodes may be split across files: Q.part(n, scenes) per file, then Q.defineEpisode(meta) last.
  Q.part = function (n, scenes) {
    var p = Q._parts[n] = Q._parts[n] || {};
    Object.keys(scenes).forEach(function (k) {
      if (p[k]) throw new Error('Duplicate scene id in part: ' + k);
      p[k] = scenes[k];
    });
  };
  Q.defineEpisode = function (ep) { ep.scenes = Q._parts[ep.num] || {}; Q.addEpisode(ep); };

  Q.addEpisode = function (ep) {
    Object.keys(ep.scenes).forEach(function (id) {
      if (Q.scenes[id]) throw new Error('Duplicate scene id: ' + id);
      ep.scenes[id].id = id;
      ep.scenes[id].ep = ep.num;
      Q.scenes[id] = ep.scenes[id];
    });
    Q.episodes[ep.num] = ep;
  };

  /* ---------- state ---------- */
  Q.newState = function () {
    var S = {
      v: Q.VERSION, ep: 1, ci: -1, scene: null, pov: null,
      mode: 'ep_title', md: null,
      f: {}, rel: {}, met: {}, chars: {}, items: {}, clues: {},
      omens: 0, echoes: [], chron: [], visited: {}, deaths: []
    };
    Object.keys(Q.chars).forEach(function (id) {
      var c = Q.chars[id];
      if (c.guest) return;
      S.chars[id] = {
        alive: true, hp: c.hp, maxHp: c.hp, fortune: 1,
        stats: JSON.parse(JSON.stringify(c.stats)), coin: c.coin || 0
      };
    });
    Q.beginEpisode(S, 1);
    return S;
  };

  Q.beginEpisode = function (S, n) {
    var ep = Q.episodes[n];
    S.ep = n; S.ci = -1; S.scene = null; S.mode = 'ep_title';
    Object.keys(S.chars).forEach(function (id) {
      var c = S.chars[id];
      if (!c.alive) return;
      if (n > 1) c.hp = Math.min(c.maxHp, c.hp + 4);
      c.fortune = 1;
    });
    if (ep.setup) ep.setup(Q.ctx(S));
    var prev = S.echoes.filter(function (e) { return e.ep === n - 1; }).slice(-6);
    S.md = { recap: n > 1 ? prev.map(function (e) { return e.text; }) : [] };
  };

  /* ---------- context passed to scene functions ---------- */
  Q.ctx = function (S) {
    var s = {
      S: S, f: S.f,
      get pov() { return S.pov; },
      get omens() { return S.omens; },
      alive: function (id) { return !!(S.chars[id] && S.chars[id].alive); },
      char: function (id) { return S.chars[id || S.pov]; },
      hp: function (id) { var c = S.chars[id || S.pov]; return c ? c.hp : 0; },
      visits: function (id) { return S.visited[id] || 0; },
      seen: function (id) { return (S.visited[id] || 0) > 0; },
      has: function (id) { return !!S.items[id]; },
      hasClue: function (id) { return !!S.clues[id]; },
      met: function (id) { return !!S.met[id]; },
      rel: function (npc, who) { return S.rel[relKey(S, npc, who)] || 0; },
      addRel: function (npc, n, who) {
        var k = relKey(S, npc, who);
        var old = S.rel[k] || 0, nv = Math.max(-5, Math.min(5, old + n));
        S.rel[k] = nv; S.met[k.split('>')[1]] = true;
        if (nv !== old) toast((n > 0 ? '+ ' : '− ') + npcName(k.split('>')[1]) + ' will remember that.', n > 0 ? 'good' : 'bad');
      },
      meet: function (npc) { S.met[npc] = true; },
      give: function (id, text) { if (!S.items[id]) { S.items[id] = text; toast('Gained: ' + text.split(' — ')[0], 'item'); } },
      take: function (id) { delete S.items[id]; },
      clue: function (id, text) { if (!S.clues[id]) { S.clues[id] = text; toast('A whisper noted.', 'clue'); } },
      omen: function (n) { S.omens = Math.max(0, S.omens + (n === undefined ? 1 : n)); },
      hurt: function (n, who) { var c = S.chars[who || S.pov]; if (!c) return; c.hp = Math.max(1, c.hp - n); toast('Wounded (−' + n + ')', 'bad'); },
      heal: function (n, who) { var c = S.chars[who || S.pov]; if (!c) return; c.hp = Math.min(c.maxHp, c.hp + n); },
      pay: function (n, who) { var c = S.chars[who || S.pov]; if (c) c.coin = Math.max(0, c.coin + n); },
      boost: function (stat, n, who) { var c = S.chars[who || S.pov]; if (c) { c.stats[stat] = Math.max(0, c.stats[stat] + n); toast(cap(stat) + (n > 0 ? ' +' : ' ') + n, 'good'); } },
      kill: function (who, cause) {
        var c = S.chars[who]; if (!c || !c.alive) return;
        c.alive = false; c.hp = 0;
        S.deaths.push({ who: who, ep: S.ep, cause: cause || '' });
        S.chron.push({ ep: S.ep, text: Q.chars[who].name + ' died. ' + (cause || '') });
      },
      echo: function (text) { S.echoes.push({ ep: S.ep, text: text }); },
      stat: function (name, who) { return effStat(S, name, who || S.pov); }
    };
    return s;
  };

  function relKey(S, npc, who) { return npc.indexOf('>') >= 0 ? npc : (who || S.pov) + '>' + npc; }
  function npcName(id) { return (Q.npcs[id] && Q.npcs[id].name) || (Q.chars[id] && Q.chars[id].name) || id; }
  function cap(x) { return x.charAt(0).toUpperCase() + x.slice(1); }
  function toast(text, kind) { Q.toasts.push({ text: text, kind: kind || '' }); }
  Q.npcName = npcName;

  function effStat(S, name, who) {
    var c = S.chars[who]; if (!c) return 0;
    var v = c.stats[name] || 0;
    if (c.hp <= 3 && name === 'blade') v -= 1;
    if (c.hp <= 1) v -= 1;
    return Math.max(0, v);
  }

  /* declarative effects: set, rel, omens, hurt, heal, coin, give, take, clue, echo, kill, boost, meet, fx */
  Q.applyFx = function (s, o) {
    if (!o) return;
    var k;
    if (o.set) for (k in o.set) s.f[k] = o.set[k];
    if (o.rel) for (k in o.rel) s.addRel(k, o.rel[k]);
    if (o.meet) o.meet.forEach(function (n) { s.meet(n); });
    if (o.omens) s.omen(o.omens);
    if (o.hurt) s.hurt(o.hurt);
    if (o.heal) s.heal(o.heal);
    if (o.coin) s.pay(o.coin);
    if (o.give) for (k in o.give) s.give(k, o.give[k]);
    if (o.take) o.take.forEach(function (i) { s.take(i); });
    if (o.clue) for (k in o.clue) s.clue(k, o.clue[k]);
    if (o.boost) for (k in o.boost) s.boost(k, o.boost[k]);
    if (o.echo) s.echo(o.echo);
    if (o.kill) { if (typeof o.kill === 'string') s.kill(o.kill); else s.kill(o.kill.who, o.kill.cause); }
    if (o.fx) o.fx(s);
  };

  /* ---------- dice ---------- */
  function d6() { return 1 + Math.floor(Q.rng() * 6); }
  Q.diffName = function (dc) { return dc <= 7 ? 'Easy' : dc <= 9 ? 'Fair' : dc <= 11 ? 'Hard' : 'Dire'; };

  function rollCheck(S, spec, who) {
    var s = Q.ctx(S);
    var base = effStat(S, spec.stat, who), mod = 0, why = [];
    (spec.mods || []).forEach(function (m) {
      if (!m.if || m.if(s)) { mod += m.n; why.push((m.n > 0 ? '+' : '') + m.n + ' ' + m.why); }
    });
    var a = d6(), b = d6();
    var total = a + b + base + mod;
    var crit = (a === 6 && b === 6), fumble = (a === 1 && b === 1);
    var success = crit || (!fumble && total >= spec.dc);
    return { dice: [a, b], base: base, mod: mod, why: why, total: total, success: success, crit: crit, fumble: fumble };
  }

  /* ---------- flow ---------- */
  Q.goto = function (S, id) {
    var guard = 0, sc;
    for (;;) {
      sc = Q.scenes[id];
      if (!sc) throw new Error('Missing scene: ' + id);
      if (++guard > 20) throw new Error('Route loop at ' + id);
      S.scene = id;
      S.visited[id] = (S.visited[id] || 0) + 1;
      if (sc.pov) S.pov = sc.pov;
      var s = Q.ctx(S);
      Q.applyFx(s, sc);
      if (sc.route) { id = sc.route(s); continue; }
      break;
    }
    if (sc.combat) {
      var e = sc.combat.enemy;
      S.mode = 'combat';
      S.md = { hp: e.hp, maxHp: e.hp, off: false, wary: false, round: 0, log: [], over: null };
    } else {
      S.mode = 'scene'; S.md = null;
    }
  };

  function anyoneAlive(S) {
    return Object.keys(S.chars).some(function (id) { return S.chars[id].alive; });
  }

  function nextChapter(S) {
    var ep = Q.episodes[S.ep];
    if (!anyoneAlive(S)) { S.mode = 'gameover'; S.md = null; S.scene = null; return; }
    for (;;) {
      S.ci++;
      if (S.ci >= ep.chapters.length) { S.mode = 'ep_end'; S.md = null; S.scene = null; return; }
      var ch = ep.chapters[S.ci], s = Q.ctx(S);
      if (ch.if && !ch.if(s)) continue;
      var chosen = ch;
      var pc = S.chars[ch.pov];
      if (pc && !pc.alive) { if (ch.deadAlt) chosen = ch.deadAlt; else continue; }
      S.pov = chosen.pov;

/* QUARTUS — save storage.
   Cloud mode (inside a claude.ai artifact): saves and preferences live in the player's private
   db subtree (data/users/<id>/...), so they follow the player's account across browsers and devices.
   Local mode (standalone page, signed-out viewer, or no write access): localStorage only.

    if (St.ready) return St.ready;

        var db = await within(window.claude.use('db'), 12000);

      return St.mode;
    })();

  };

      'Then he feels the cold side of the bed, and the draft.',
      'His wife is standing in the open doorway with her back to him. Hild. Barefoot on the flagstones, nightshift soaked to the knee, black hair loose down her spine. The yard behind her is lit by a moon the color of tallow, too low and too large, and the well-rope in the yard hangs dripping, as though something has just been drawn up and put back.',

    place: 'Highgarrow — the Great Hall, Jubilee Feast',
    text: [
      'There are eight hundred places laid in the Great Hall and Lady Ysolde Carrow has counted every one, because that is what she does when she is frightened. It steadies her. Eight hundred places. Sixty-one tables. A hundred and four candelabra, three-quarters of them lit with beeswax that Carrow wool paid for.',
      'The Princess Maud’s hand is on her wrist. Not gripping — Maud Verrin does not grip; Maud *rests*, the way an anchor rests on the bed of a harbor.',
      '“Two things before the king is carried in,” says the Princess. She is fifty-four and as tall as a man, with a face like a closed door and hair braided in a single heavy rope the color of iron filings. She has never in her life raised her voice. She has never had to. “Lord Perrin Ashby has failed to deliver the salt-revenue accounts for two quarters. He is, I gather, very fond of dining beside beautiful widows. And Ser Corbin Dray lost to a bastard in front of the whole realm this morning, and is drinking in his chambers, and I would very much like to know what he says when he is drunk and humiliated and *grateful* to be comforted.”',
      'She does not blink on the last word.',
      '“Master Hargreave the apothecary sends his regards, by the way. He is well. He asks if you are.”',
      'Ysolde’s smile does not move. She has had a great deal of practice. Master Hargreave sold her a very small bottle two winters ago, which her second husband, a large and charmless man called Lord Thorne, swallowed in a cup of mulled wine and died of in a most convenient fashion. She has never once told anyone. The Princess has known from the beginning.'

    fx: function (s) { s.f.y_leash = true; s.meet('maud'); },

      { tag: 'Bargain', label: '“And when I deliver, the apothecary’s letter returns to me. Not in a year. Tonight.”', check: { stat: 'guile', dc: 10, pass: 'e1_y1b', fail: 'e1_y1c', label: 'Guile' } },
      { tag: 'Ambition', label: 'Smile and say nothing. Think, very calmly, about the Princess’s throat, and about what the realm would look like if she were not standing in it.', goto: 'e1_y2', set: { y_regicidal: true } }

    text: [

      '“Not tonight,” Maud says. “But before harvest-tide. If what you bring me is worth more than the paper.” She pats Ysolde’s wrist twice, like a dog’s flank. “You have a spine, Carrow. I had wondered where you kept it.”'

      'He is brought in a chair on poles, like a relic, four stewards to bear him. They have wrapped him in furs although it is high summer and the hall is an oven. What shows of him is yellowed and waxen and tiny, the skin on the backs of his hands so thin it looks like candle-paper; but his eyes are open, wide-set and wet and the color of slate after rain, and they move.',

      'It is set before the king with a ritual care that no one comments on. Quill leans in, murmurs. The king’s stewards do the rest. And Aldous the Long, who has eaten nothing in public for a decade, takes a pinch of whatever is in the cellar between his thumb and forefinger and touches it to his tongue, the way another man might sip a very good wine.',

  e1_y5s: {

    text: [
      'She takes the jug out of his hand and sets it down on the window-ledge with the care of a woman putting down something fragile, and then she turns and puts her palm flat in the middle of his chest and feels his heart go off like a startled bird.',
      '“Ysolde—” he says, with the shocked relief of a man who has been waiting a whole day for someone to touch him on purpose.',
      'She kisses him. He tastes of wine and iron and something sweeter underneath; the split lip is warm and soft against her mouth, and he makes a low sound that is half apology. His hands are huge and shake slightly when they find the laces at her back. She lets him fumble; it is better when they fumble. She finishes the knots herself and steps out of the gown and stands in her shift in the firelight, thin-wristed and amused, and watches his breath go ragged.',
      'He is a fighter; he is graceful even in this. He lifts her onto the narrow bed as though she weighed nothing and then, a moment later, lets her take the weight of him and the control of him, rolling him under her with a hand pressed to the bruise on his ribs so that he gasps and then laughs and then stops laughing. She has done this with men for coin and men for safety and men for sport, and once, at nineteen, for love. She had forgotten the fourth kind, the kind where you are surprised to find you enjoy it. She takes her time. She learns what makes him arch and what makes him say her name in that cracked, boyish voice, and she keeps it up until the narrow bed is creaking and the window has fogged and neither of them is thinking about the Princess at all.',

  e1_y6: {
    clue: { fourth_rider: 'Ser Corbin Dray: Marden’s hunting-party was FOUR riders, though none would admit it. The fourth wore grey, no one remembered him joining, and he did not come back. When they pulled Prince Marden from the Hollin Ford he was bone-dry, with white on his lips.' },
    text: [
      '“There were four of us,” says Corbin Dray. “Everybody says three. Marden, myself, Piers the squire. But there were four on the road. A man in a grey hood, riding the near-left. He had been with us two days, and I would have sworn on my sword that I had never seen him arrive. Nobody remembered him joining, and when I asked, Marden said, *Corbin, he has always been with us.* And I knew *that* was true. That was the awful thing. I knew it was true.”',
      '“At the Hollin Ford, the grey man dismounted. Marden got down too. It was as if they had agreed it. The grey man put out his hand and Marden *took* it, the way a child takes your hand to be led to bed. They walked in. We shouted. We — I could not move, Ysolde. I swear. It was not fear. It was *courtesy*. It was like interrupting prayers.”',
      '“Marden came up on the far bank, an hour after. Alone. We pulled him out and he was dry. Dry as chalk. His hair, his boots, his *eyelashes*. Not a drop on him. And white on his lips, like frost, like the crust on a salted fish. He was dead. He had been dead, I think, a long time before the ford.”',
      'He looks at his hands.',
      '“The Princess’s steward told us to say a fall. A heart. I said it. I’ve said it for six months. I have never said it without tasting salt.”'
    ],
    next: 'e1_y7'
  },

  e1_y7: {

        'A salt-cellar the size of a fist. A sealed jar. A man who ate nothing but *memory*. A rider in grey who had always been there. *Four.*',
        'Midnight comes with the sound of a great dry rustle, ten thousand drunken revelers falling silent at the same instant, as if a hand had passed over a lamp.',

Q.part(1, {

  e1_m1: {
    place: 'Highgarrow — Cathedral of the Threefold Hand',
    text: [
      'Compline on the night of the Jubilee, and the Cathedral of the Hand is so full that the wax drips on the penitents.',
      'Sister Maren Vosk stands in the choir stalls with her psalter open to a page she is not reading and watches the nave fill with the realm’s best and worst: guildsmen in their chains, ladies of the court under veils, wool-merchants, knights, a hundred foreign envoys who have clearly never been inside a church with a ceiling this high. Three hundred candles burn above the altar. And over all of it hangs the Threefold Hand, forty feet of gilded oak: the first three fingers raised in blessing — Maker, Warden, Lamp — and the fourth, as always, folded down into the palm. *The Hidden Hand*, the catechism says. *That which God keeps for Himself.* She has recited that line ten thousand times. She has never before wondered what a god would need to keep.',
      'High above the vault, in the cathedral tower, the three great bells hang in their cradles — Maker, Warden, Lamp — and beside them a fourth cradle, empty of rope and clapper, as it has been for as long as there have been records. The Silent Bell, they call it. The bell that waits. A child’s joke, a mason’s oddity, a kind of fossil in the stone.',
      'At the Kiss of Peace, a bent, ink-stained hand takes hers in the crowd and presses something into it.',
      'Brother Anselm is seventy-one and nearly blind and has kept the Cathedral’s archive since before she took her vows. He is the one man in the building who has ever answered her questions as if they were questions. He does not look at her. He moves on down the row, murmuring, “Peace, Sister. Peace.”',
      'She waits until the Gloria to unfold the paper. His handwriting, always crabbed, is a spider’s scrawl tonight.',
      '*The archive. After the third bell of night. Bring your key. Tell no one — not even the Chandler.*'
    ],
    choices: [
      { tag: 'Secrecy', label: 'Burn the note in the nearest candle. Tell no one.', goto: 'e1_m2' },
      { tag: 'Obedience', label: 'Tell High Chandler Venn, as the Rule requires of any Sister who is asked to keep a secret from her superiors.', goto: 'e1_m1v', set: { m_told_venn: true }, rel: { venn: 1 } }
    ]
  },
  e1_m1v: {
    text: [
      'High Chandler Orsolo Venn is seated in the first stall of the Order of the Lamp, a spare, soft-spoken man of fifty with a tonsure like a pale coin and a way of listening that makes you feel unburdened. He is the head of the Candlemen: the Lamp’s inquisitors, the men who carry the taper to the hedge-witch’s door and to the heretic’s pyre. He has never once, in her hearing, raised his voice.',
      'She whispers it in the lull before the Nunc Dimittis. He nods slowly, and his eyes are warm and tired. “How tender of Anselm,” he says. “Go, child. He is old, and the old grow fond of mysteries. Listen to what he shows you, and come to me after. We will not scold him.” He touches her sleeve, lightly. “You were right to tell me.”',

  e1_m2: {
    place: 'The Cathedral archive — the lower stacks',
    text: [
      'The Cathedral’s archive is a long vaulted cellar under the north transept, and it is always cold, and tonight it smells of beeswax and old vellum and something under both, like wet stone. Anselm is waiting at the end of the third aisle in the light of one candle. He has the look of a man who has not slept, and has not been warm, and has not decided whether to be afraid.',
      '“Lock the door, Sister. Both bolts.”',
      'She locks it. He does not speak until she has done so. Then he lays a single sheet of vellum on the reading-desk, torn at one edge as though ripped from a bound book, and holds the candle over it with a trembling hand.',
      'It is a page from the *Roll of the Saints*, the oldest of the Church’s calendars. Three names are written in a monk’s clear hand, each with a title and a date.',
      '*Hollis the Meek, Year 7.*',
      '*Brannoch of the Marsh, Year 107.*',
      '*Saint Ysmay the Wept, Year 207.*',

      'It is four hundred and twelve steps to the bell-chamber. Anselm climbs them without stopping, one hand on the wall, one hand clutching the page to his chest, a blind old man who knows every stone in his body’s bell. Maren climbs behind him with the candle, counting out of habit. By the three hundredth step the walls have begun to *hum*, a faint, high singing in the stone, like a finger on the rim of a glass.',

    text: [
      'The cellar smells of oak shavings and old hops and, underneath, the sweet rot of the tanneries, which gets into everything in Mudgate: bread, bedding, blood. Corr Anwen has lived with it for seven weeks and has stopped noticing, except at night, when he lies awake and misses the smell of peat-smoke so badly it feels like a tooth.',
      'The lad on the pallet is nineteen, perhaps. A squire’s cropped hair, a squire’s rope-callused hands; the rest of him is a wreck. Corr fished him out of the tannery sluice four nights ago, half-drowned, with three cracked ribs and a shoulder out of its socket. Those he has set. What he cannot fix is the fever.',
      'The boy’s sweat dries as it runs. That is the wrong of it. It leaves a fine pale crust on his skin, glittering in the lamplight like frost on a stone, and when Corr wipes it away with a wet cloth it tastes — he has tried it, the way he has tried most things — of the sea.',
      'There are two ways to do this. There is the way Mudgate’s bone-setters have always done it: willow-bark, cold cloths, patience, prayer. And there is the way his grandmother did it, the Dunmarch way, the way that the Church of the Threefold Hand has burned women for.',
      'The boy’s name is Piers. He has said it once, in his sleep, and then gripped Corr’s wrist and said something else, a word Corr has not heard since he was six years old.'
    ],
    choices: [

      'The boy’s ribs speak first, in their small, broken voices. The shoulder, sore. The long bones of the leg. And underneath them all, in the *marrow*, the place no priest has ever thought to look, something else is speaking. Not a sound. A *rhythm*. A slow, patient, enormous beat, like a tide a thousand miles away.',

    text: [
      'Near eleven the boy opens his eyes.',
      'They are red-rimmed and enormous, and for a moment they look at nothing, and then at Corr, and the terror in them goes out in a long shudder, like a drowning man finding the bottom. “You’re the one with the cold hands,” he rasps. “From the sluice.”',
      '“Corr,” says Corr. “Easy. You’re in a cooper’s cellar. You’re safe.” He is not at all sure that is true.',
      '“Piers,” says the boy. “Squire to Prince Marden. I — He’s dead. Isn’t he. Oh, Maker. He’s been dead six months and no one will say how.”',
      'And then, in a scraped, sleepless whisper, Piers tells him. There were four riders on the hunt. A man in grey, nobody’s man, who was simply *there*, who rode beside the Prince for two days without once being introduced. At the Hollin Ford the grey man dismounted and put out his hand, and the Prince took it as a child takes a hand, and *let himself be led*. They walked into the water. They did not come up. And an hour later, Marden was walking out of the far bank with his clothes and hair completely dry, and his eyes open, and his mouth white with salt, and never said a word, and was dead before the ford was out of sight.',
      '“The Princess’s steward said, *you will say it was a fall.* Ser Corbin said it. I said it. For six months. And then I couldn’t. I ran. I ran to the sluice because the water in the sluice was *wet*.”',
      'The boy is weeping. Corr holds his shoulder. Out of his shirt, with a trembling hand, Piers pulls a ring on a cord, a heavy gold signet stamped with a sun in splendor, scratched and dented, still faintly tinged with white along the band.',

  e1_c3: {
    place: 'Mudgate — a cooper’s cellar',
    text: [
      'The bell rings.',
      'Corr is a bone-setter from the marsh, and he has been in cities long enough to know the sound of every kind of bell they make. Church bells. Guild bells. Hanging bells. Plague-bells. This is none of them. It comes up through the cobbles and the cellar floor and the legs of his stool; it comes through the *boy*, who arches off the pallet like a hooked fish and *opens his mouth*.',

      'It is the Dunmarch verse. The one with the last line. The one the Church’s version leaves out — *four for the field where the barley grows*, they sing it, in Highgarrow, with a hundred sweet voices — and which Corr has not heard in his whole life from any mouth but his grandmother’s.',
      'The white blooms across Piers’s lips and down his throat like frost on a window. His back bows. His eyes go wide with something that is not terror but an enormous, appalled *recognition*.',
      'Then he is only a boy, lying very still, and he is dead.',
      'Corr sits with his hand over his mouth. In his marrow, in the long bones of his own arms, the great slow beat that he heard in Piers’s breastbone is *answering*. He can feel it, as he has never felt anything. Somewhere under him, very far down, something has turned over in its sleep, and *noted* that he exists.',
      'And overhead, in the street, a woman begins to scream, and dogs begin to howl, and hobnails ring on stone. *Candlemen*. Boots, and the soft clink of the little brass tapers they carry, and a man’s voice saying, quite calmly, “Every door.”'

    text: [
      'The man’s name is Corr Anwen. Wystan does not at first believe him, then does, which is irritating.',
      'It comes out in a few ragged minutes, in a marsh accent that thickens as he speaks. A hunt-party of four; a rider in grey; a ford and an outstretched hand. A Prince walking into the water as if he were being led to bed. A body that came up dry. A boy who cried *it’s counting* and then died of it, on this very pallet, with the same terrible white frost on his lips. Piers’s words, scratched out of him with the last of his breath. *Give it to Garrick. Tell him it’s counting.*',
      'It is a mad story. It is exactly the story the squire’s fever would have told. It is also, uncomfortably, the same story that Prince Garrick said he didn’t believe, in a tent, at dusk, while pouring wine with a hand that would not stay steady.',

  e2_w5: {

    text: function (s) {

      return [
        'Prince Garrick has not slept. He is sitting at the head of a trestle table in the long hall of Marcher House, with the shutters closed against the dawn and a map of the realm weighted down with daggers, and he looks up when Wystan comes in with the mud of the sluice still on him and the sight goes through his face like a blade.',

  e2_w6h: {
    fx: function (s) { s.addRel('garrick', 1); s.echo('Wystan told Prince Garrick the truth about Marden’s death — as impossible as it sounded.'); },
    text: [
      'He tells it in order, in the plain voice of a man giving evidence, the way he was taught: the rider in grey, the ford, the dry body, the squire’s last words. He does not shade it. He watches it land.',

  e2_w6d: {

    text: [
      'It is the first lie he has ever told the Prince and it comes out so smoothly that it frightens him. *The steward. Maud’s steward, Garrick. The boy said it with his last breath.*',

/* Episode 2 — Maren: The Chandler's Kindness */
Q.part(2, {

  e2_m1: {
    place: 'The Cathedral — the chapter-house of the Lamp',
    text: function (s) {
      return [
        'They bury Brother Anselm at dawn, in the clerics’ yard, under a plain stone, with Venn himself reading the Lamp’s farewell. There are fewer mourners than there should be. A good many of the Cathedral’s clerks have not come to work this morning, and the ones who have look as though they have been awake all night, listening.',
        'Afterward the High Chandler asks her to walk with him. He is gentle about it. He is always gentle. The chapter-house of the Lamp is a long low room with shuttered windows, a rack of snuffing-rods along one wall, and an enormous plain table, and on the table, laid out like exhibits, are the contents of a dead man’s desk.',
        s.f.m_page_given ? '“I want you to know,” says Venn, “how much it meant to me that you brought me the page. It is not an easy thing to bring your superior a grief.”'
          : s.f.m_page_lost ? '“I read the page you did not give me,” says Venn, quite kindly. “I understand why you didn’t. I should like you to know I do not hold it against you.”'
          : s.f.m_seal ? '“The seal is the seal,” says Venn. “I respect it, and I have not forgotten it.”'

  e2_m1d: {

  e2_m2: {

    text: function (s) {

      return [
        key ? 'With the key, the lower stacks are only cold. She turns the iron in the lock and the door that was always locked swings back, and the smell of the sealed room comes out to meet her: dust, vellum, tallow, and under all of it the damp mineral breath of a place that has not been breathed in for a very long time.'

  e2_m3a: {
    clue: { rhyme_four: 'The Church’s counting-rhyme ends “four for the field where the barley grows.” An older Dunmarch variant, in Anselm’s own marginal hand, ends: “four for the one who is sleeping below — count him last, and don’t let him know.”' },
    text: [
      'The heretic shelf is a single low case, bound in chains that Anselm cut years ago, and it is full of children’s books.',
      'They are the cheap kind, hand-copied for hedge-schools, with crude ink drawings of crowns and swords and lamps in the margins. The Church sings the counting-rhyme at every harvest festival: *one for the crown, and two for the sword, three for the lamp, and the Lord is the Lord, four for the field where the barley grows, and a good year’s harvest for all God knows.*',
      'But in the third book down, in Anselm’s own crabbed hand, in the margin, in a different color of ink, are four other lines.',
      '*Four for the one who is sleeping below — count him last, and don’t let him know.*',
      'Under it, in a smaller hand, as though to himself: *Dunmarch. Older than the barley. The Church sang this for two hundred years before it was ordered changed. Who ordered it? Why does a god’s reserve need a sleeper?*',

  e2_m3b: {

    text: [
      'The Reliquary Register is a great calf-bound ledger with a clasp, kept on a lectern near the door, and its entries are the dry, loving, precise Old Tongue of men who have counted the bones of the saints for a thousand years. She turns pages. *Hollis the Meek: three finger-bones and a rib, in silver. Brannoch: the left thumb, in crystal, displayed on the Feast of the Lamp.*',
      'And then: *Ysmay the Wept, martyred in Year 207, in the Vigil. Reliquary sealed Year 207. Opened by order of the Archprelate Aurelian, Year 208, for the translation of her relics to the north transept.*',
      'In a different hand, much smaller, much later, beneath: *The reliquary was found to contain no bone. Not ash. Not dust. It was full to the lid with salt. Grey, coarse, crystalline. Archprelate Aurelian forbade further inquiry. The reliquary was re-sealed in the north crypt, where it remains.*',
      'She reads the entry three times. Below it, in the same small hand: *The first two reliquaries, I am told, were also salt.*',

  e2_m4: {
    place: 'The Cathedral archive — the lower stacks',
    text: [
      'It is not Venn. She knows the step before she sees the man; it is soft, hesitant, unaccustomed to stairs that do not have a carpet. Lamplight finds a pale face in a cleric’s plain black. Prince Edric Verrin is forty-seven and looks twice that this morning. He has the Verrin cheekbones and none of the Verrin bulk, and the long, drawn, luminous look of a man who has been fasting for three days and has stopped noticing.',
      '“Sister Vosk,” he says. “I beg your pardon. I was told Brother Anselm kept something for me.”',
      'She recognizes him with a jolt. The Church’s candidate. The gentlest of the king’s three living children and, if the court is to be believed, the one the old man likes least. He is carrying a small waxed packet, tied with black thread.',
      '“He wrote to me,” says Edric. “Last week. I had asked him a question, after Marden died. He said he would answer in person, after the Jubilee. He did not say why it could not be in a letter.” He looks down at the packet in his hands. “It came this morning. It is not an answer. It is only a key.”'
    ],
    choices: [

  e2_m5a: {
    clue: { edric_warning: 'Prince Edric: each of the king’s children was told privately, at sixteen, that there would come a year when “the realm would be asked.” None understood. Marden took it hardest, and went to the Archprelate for an answer. Marden died.' },
    text: [
      'Edric sits down on a stack of unread ledgers with a weariness he hasn’t the energy to hide.',
      '“When I was sixteen,” he says, “my father sent for me. Alone. He said nothing about the succession, or my mother, or the Church I was to be given to. He took my hand, which he had never done, and said that there would come a year when *the realm would be asked*. And I would know it when it came. He told Garrick, the same. And Maud. And Marden — Marden was the one who could not let it be.” He turns the black-threaded packet in his fingers. “Marden went to the Archprelate to ask what it meant. That was, I think, a month before the hunt. He came back looking like a man who has been shown his own grave, and said only: *Edric, it is counting.*”',
      'He is quite calm. He is also, she sees, trembling very slightly all over, as if a wind were blowing that only he could feel.',
      '“I do not know what the question is,” he says. “I only know that Marden was the first of my father’s children to ask it, and he is dead. And I am afraid I am the next.”'

  e2_m5b: {
    text: [
      'He sees it. He is a gentle man but he has lived all his life at court, and he knows what it looks like when someone holds a door shut with her back. He does not push.',
      '“I understand,” says Edric, with a tired smile. “It is wise. I would not trust a prince either.” He rises, leaves the packet on the lectern. “Keep the key. If you decide you can say what you know, I am at the Hospice of Saint Orrin, at the foot of the hill, with the sick. I go there when I cannot bear the palace.”',
      'He leaves her alone with the lamp and the key and the cold, which is, she thinks, rather what she asked for.'
    ],
    fx: function (s) { s.give('anselm_key', 'A small iron key from Brother Anselm, left for Prince Edric — it opens something in the north crypt.'); },
    next: 'e2_m6'

  e2_m5c: {
    clue: { anselm_key: 'Anselm’s key opens the north crypt, where the reliquaries of the saints are kept — the third of them is Ysmay’s.' },
    fx: function (s) { s.give('anselm_key', 'A small iron key from Brother Anselm, left for Prince Edric — it opens something in the north crypt.'); },
    text: [
      'She tells him. All of it: the note at Compline, the torn page, the three dates a hundred years apart, the bell with no clapper and the chiseled word, the sound that was not a sound, the old man’s last breath. It takes a long time, because she keeps stopping to be sure she has the numbers right.',
      'Edric does not interrupt. When it is over he sits very still, and then he does something she does not expect: he kneels, there on the cold stone floor of the archive, and puts his forehead against the edge of the reading desk, and says a prayer under his breath in the old Lamp-form, a prayer she has never heard a prince say.',
      '“Thank you,” he says, when he looks up. His eyes are wet. “I thought I was going mad.” He gives her the packet. “Take this. If it opens something, I would rather you opened it than I. I am a great deal better at kneeling than at going down stairs.”'

  e2_m6: {
    place: 'The Cathedral — the north gallery',
    text: function (s) {
      return [
        'The bells ring Sext and nobody comes. That is how she knows something is wrong. The Cathedral is never empty at midday.',
        'She goes up to the north gallery, the long open arcade that overlooks the great square, and stops at the rail with her hand over her mouth.',
        'They are filling the square. From every street. Barefoot, in nightshirts and shifts and, here and there, in a good doublet with the points undone, as if a man had been taken from his dinner. Farmers from the east. Children. A whole choir of old women, shawled, with their hands folded. They come in without jostling and arrange themselves in neat rows, in the sun, facing the tower, and they stand.',
        'Nobody speaks. Nobody moves. The wind stirs their loosened hair.',
        s.f.miller_held ? 'At the front, a lean man in a miller’s apron is on his knees beside a woman whom he is holding up by the arms. He is begging a Candleman for water. The woman’s eyes are open, and she is looking up at the bell-tower with an expression of fond, bottomless patience.'
          : 'At the front stand a miller and his wife, hand in hand, wet to the knee. He is awake. His face is the color of tallow. She is not.',

  e2_m7: {

    text: function (s) {
      return [
        s.f.m_in_square ? 'Down among them the silence is a thing she can feel, like heat from a stove. The salt-smell is faint but unmistakable. She walks between the rows and none of them turns to look at her.'

Q.part(2, {

  e2_y1: {
    place: 'Highgarrow — the Throne Hall',
    text: [
      'The Long King holds an audience at ten of the morning, and nobody can remember when he last did that.',
      'The court assembles in a silence of fine fabrics. Ysolde stands in the second rank in a plain grey gown with her hair pinned flat, very much the dutiful widow, with Princess Maud’s cold shoulder a yard in front of her and her own sleepless night under her eyes like a bruise. She has not slept. She has bathed twice and still has the faint ghost of Corbin Dray’s soap on her skin.',
      'They bring him in on the same chair, in the same furs. In daylight he is smaller and worse: a husk with eyes in it. Physician Quill is at his shoulder. The silver salt-cellar is set on the arm of the chair, beside his hand.',
      'He does not sit still. He sits with his head cocked toward the east, listening, as though the great hall had a window onto something that the rest of them cannot see.',
      '“My children,” says Aldous the Long, and the voice is a leaf on a stone. “I have been ninety-five years in the world. I would have you know that I intend to remain in it. But the realm is owed a name, and it shall have one. At the Feast of the Lamp, at harvest-tide, I shall name the one who sits after me.” A rustle goes through the hall like a wind through a field. “And then,” says the king, with a small private smile, “the realm shall be asked.”',
      'Nobody knows what that means. Nobody asks. Garrick’s chair on the dais is empty. Prince Edric stands pale and rigid at the far end, with his eyes closed.',
      'The old man’s gaze drifts down the hall and, once again, stops on Ysolde.'
    ],
    fx: function (s) { s.omen(0); s.f.heir_deadline = true; },
    choices: [
      { tag: 'Maud', label: 'Watch Princess Maud. See what she does with her hands when the king says “asked.”', goto: 'e2_y1a' },
      { tag: 'The King', label: 'Meet the old man’s eye and don’t look away. Let him see you looking.', goto: 'e2_y1b' },
      { tag: 'Quill', label: 'Watch the physician, who has just noticed that the king noticed *you*.', goto: 'e2_y1c' }
    ]
  },
  e2_y1a: {

      'The Princess’s face does not move. Her hands, folded before her in a gilt cup of watered wine, tighten until the knuckles are the color of bone. It takes two heartbeats. Then she relaxes them one finger at a time, with a tremendous deliberate effort, like a woman putting down a snake.',

      '“Tell me,” she says, “about Ser Corbin.”'

      { tag: 'Guile', label: 'Tell her he was too drunk to say anything useful. Keep the fourth rider for yourself.', check: { stat: 'guile', dc: 9, pass: 'e2_y2b', fail: 'e2_y2c', label: 'Guile' } },

  e2_y2a: {
    text: [
      'Maud listens as she always does, without moving, the pen still. She does not ask a single question. When Ysolde reaches the ford, the dry body, the grey rider’s outstretched hand, the pen dips, once, onto the paper, leaving a blot like a drop of blood.',
      '“Foolish boy,” says Maud softly. “I told him to say *fall*.”',
      'Not *there was no such rider*. Not *you have been misled*. *I told him to say fall.* She has known. She has always known. She sits with her ink-stained hand and her closed face and Ysolde, who has spent her whole life reading rooms, realizes that she is looking at the most frightened woman in the palace.',

  e2_y2b: {

    text: [

  e2_y2d: {

    text: [
      'She lays the little twist of paper on the writing-table and opens it with one finger. A pinch of grey crystals, dull in the north light.',
      'The Princess goes white. It is not a dramatic thing, no gasp, no step back. It is as if someone had drawn a sheet of cold water through her. She looks at the salt for a long time and when she speaks, her voice is quite flat.',

  e2_y3: {
    place: 'Highgarrow — the Lady Alys’s chambers',
    text: [
      '“There is a girl,” says the Princess, “who is going to be a problem.”',
      'Lady Alys Verrin is nineteen, motherless, the only child of the dead Prince Marden, and the only grandchild of the king. She is, in the hard arithmetic of the court, the single most valuable piece on the board: a girl with her father’s eyes and her grandfather’s blood and no friends in the palace who are not for sale. Garrick’s people are circling. Edric’s, in a different manner, are circling too.',
      '“She lives in the east wing. She does not eat. She has been writing to somebody and will not say who. Be her friend, Ysolde. I do not much care how.”',
      'The east wing smells of cold ashes and old flowers. Alys is sitting on the floor of her father’s bedchamber, which she has not let anyone redecorate, with a small black wooden box open in her lap. She is slight and fierce, brown-haired, ink-stained, with the wide, burnt-out, stubborn look of a girl who has not slept since the autumn. She looks up as Ysolde enters, and slides the lid of the box shut.',
      '“Whose are you?” she says. “Aunt Maud’s, or Uncle Garrick’s?”'

    choices: [

  e2_y4: {
    place: 'Highgarrow — Wax Street, the apothecaries’ row',
    text: function (s) {
      return [
        'It is dusk when she reaches Master Hargreave’s shop, and the shutters are already half up, and a hand-cart is waiting in the lane, loaded with crates.',
        'He is packing. He is a plump, pink, careful man of sixty, with the soft hands of a scholar and the nervous, darting eyes of a man who has been looking over his shoulder for a week. He drops a bottle at the sight of her. It does not break. He does not pick it up.',
        '“My lady,” he says, “I would so much rather you had not come.”',
        s.has('kingsalt') ? 'She has the pinch of grey in her sleeve. She sets it on the counter between them without a word and unfolds the paper.' : 'She has no salt, only questions. She asks them anyway.',
        s.has('kingsalt')
          ? 'Hargreave leans over it with a jeweler’s loupe and does not touch it. For a long time he says nothing. Then he straightens, and he is a different color.'
          : 'Hargreave listens, and goes grey, and sits down on a crate.',
        '“It isn’t salt,” he says. “I’ve ground salt for forty years, and I’ve never seen salt do that. Look under the glass. Every crystal is a little four-sided pyramid. *Four sides*, my lady. Salt grows in cubes. Everything that comes out of the sea grows in cubes.” He swallows. “That is not from any sea. That is not from any *mine*. It’s from—” He cannot finish it.',

      ];

    clue: { maud_poison: 'Master Hargreave made four vials of nightshade cordial for Princess Maud — to poison the king. The king drank them all and nothing happened. Physician Quill tasted each and was untouched.' },
    choices: [
      { tag: 'Mercy', label: 'Give him thirty crowns and send him north on the morning cart. The leash was never his fault.', req: function (s) { return s.S.chars.ysolde.coin >= 30; }, goto: 'e2_y5a', set: { y_hargreave: 'fled' }, coin: -30, echo: 'Ysolde paid Master Hargreave to flee the city — and kept the page that damned the Princess.' },
      { tag: 'Cold', label: 'Take the ledger page. Promise him nothing. Let him make his own luck.', goto: 'e2_y5b', set: { y_hargreave: 'left' } },
      { tag: 'Poison', label: 'Accept a cup of his cordial, and pour him one. He is the only man who can swear to what you did to Lord Thorne.', check: { stat: 'guile', dc: 9, pass: 'e2_y5c', fail: 'e2_y5d', label: 'Guile' } }
    ]

  e2_y5a: {
    fx: function (s) { s.addRel('maud', 0); s.f.y_maud_ledger = true; },
    text: [
      'She counts out the coin onto the counter and watches his hand go to it like a sleepwalker’s. He does not thank her. He only says, “The ledger. I kept a copy. I always keep a copy; it’s a vice,” and takes a loose page from a drawer: three months of entries in a fine copperplate hand. *H.R.H. Princess M. — nightshade, 4 oz. — sweet cordial, to be delivered to the Princess’s own steward.* Dates, quantities, and, at the foot, a signature that is not a signature but the Princess’s unmistakable seal.',
      'It is enough to hang the second-most powerful woman in the realm. And, a small cold voice in the back of Ysolde’s head adds, it is enough to buy back a good deal of a poisoner’s freedom.',
      '“Go north,” she says. “Don’t write.” And he is the first person in her life, she realizes, whom she has ever done a kindness for that had nothing in it for her.'

  e2_y5b: {
    fx: function (s) { s.f.y_maud_ledger = true; },
    text: [
      'She takes the page from the drawer before he has offered it. He does not protest. He only looks at her with his round, wet, hurt face, like a dog that has been kicked by someone it had trusted.',
      '“They’ve been asking after me,” he says. “The Lamp. They have the *list*, my lady.”',
      '“I am sure you will think of something,” says Ysolde, and goes out into the dusk with a page of damning copperplate folded in her bodice, and does not look back at the cart in the lane.'

  e2_y5c: {

    text: [
      'It is a very old trick and he does not see it. He is a poisoner; the one thing a poisoner never believes is that anyone can poison *him*. She turns her back, the cups clink, and a few drops from the vial in her glove fall into the amber. She puts the right one in his hand.',

  e2_y5d: {

      'He does not shout. He is not a brave man, but he is a quiet one, and he stands there with his round face crumpled in the lamplight and says, “I should have known. I *made* you.” She has the ledger page out of the drawer before he has finished the sentence. She is out the door before he has finished the thought.',

  e2_y5: {
    place: 'Highgarrow — Wax Street',
    text: function (s) {
      return [
        'Night, and the streets are strangely thin. The Jubilee crowds have gone, or been taken in; shutters are closed on every side. She walks back toward the palace with the ledger page against her ribs and her mind running, running, a clerk adding sums.',
        'Maud tried to murder the king. Twice. Maud, who has run the realm for ten years like a woman keeping house, who has never done a rash thing in her life, tried to murder her own father with a nursery cordial and watched him *drink it*. What would it take, she wonders, to make a woman like that do such a thing? And the answer is a door she does not want to open.',

Q.part(2, {

  e2_c1: {
    place: 'Highgarrow — Marcher House, Tanners’ Hill',
    text: function (s) {
      var rep = s.f.w_reported;
      return [
        'They have given him a stool, a cup of small beer, and a clean shirt, and none of it is any comfort. The long hall of Marcher House is full of big men with the Marcher black on their shoulders, and at the head of the table sits the biggest of them all: Prince Garrick Verrin, Lord of the North, with his chin on his fist and a dead boy’s ring in front of him, regarding Corr as one might regard a horse of dubious provenance.',
        'The knight is standing at the Prince’s shoulder, the one who was in the cellar, and he will not meet Corr’s eye. His left arm is bound. He looks like a man who has been awake for a day and a half and has not liked what he has done with it.',
        rep === 'shaded' ? '“Well?” says Garrick. “My man tells me the boy named my sister’s steward before he died. You were there. Say it.” He does not raise his voice. He does not need to. The knight’s knuckles have gone white on the back of a chair.'
          : rep === 'honest' ? '“My man tells me,” says Garrick, “that you were there when the lad died. That you have a story. That I am not going to like it.” He nods at the stool. “Go on, then.”'

  e2_c2t: {
    text: function (s) {

        'When he is done there is a very long silence. Then Prince Garrick turns, slowly, to the knight at his shoulder.',

        'The knight says nothing. He does not look away. After a long moment Garrick lets out a breath and sits back, and for a moment he looks every one of his fifty-eight years.',
        '“Because you thought it was what I wanted to hear,” he says. “Because it *was.* Maker help me.” He drags a hand down his face. “The host is already on the road. I cannot call it back in a night. But, Hale — if you ever lie to me again, I’ll have your tongue for a standard.”'
      ] : [
        'He tells it simply, in his marsh voice, to the wooden table. The ford, the hand, the dry body, the squire’s last whisper, *it’s counting*. He tells it the way you tell a thing that is true and cannot help you.',

        '“Maud’s agent,” he says at last. “Some creature of hers, in a grey cloak. That is the sensible reading.” He does not sound as though he believes it. “But you tell it straight. I like that. I shall keep you close, bonesetter. I may have more questions.”'

      '“You will have to forgive me, my lord,” says Corr slowly. “What I saw is not a thing my people say in rooms with swords in them. It would be like asking you to say your wife’s name in a tavern.” He folds his hands. “I will tell it to a man who will *hear* it. Not to one who has already decided.”',

  e2_c3: {

    text: [
      'They give him a pallet in a store-room off the kitchens, with a guard at the door, and he lies on it with his eyes open and listens to the house settle.',
      'He cannot sleep, and it is not the guard, and it is not the pallet. It is the *count*. All day, since the cooper’s cellar, it has been there, like a tooth that aches only when you stop thinking about it: a slow low pressure, a deep patient tide, rising and falling in the long bones of his arms. He knows what it is. He has felt it once before, as a boy, when his grandmother died and the old women of the marsh sat in a ring around her bed and *counted her out*.',

  e2_c3b: {
    text: [

  e2_c4: {

    text: function (s) {
      var w = s.f.c_with_wystan;
      return [
        'They are still there.',
        'Nine hundred, perhaps a thousand, standing in the night in their neat unbroken rows, with the torches of the Candlemen guttering around the edge of the square like a necklace. Not one of them has sat. Not one of them has sat down in a day and a night. A few have fallen; there are little knots of Candlemen around them, lifting them onto litters, carrying them away to the hospice. The rest *stand*.',
        w ? 'Wystan stops at his shoulder and says, in a voice with no color in it, “Sweet Maker.”' : 'He has never been so alone in a crowd.',
        'And Corr can *hear* them. That is the thing he cannot explain. A thousand sleeping chests, a thousand slow tides, rising and falling together like a field of barley, and underneath, so deep it is barely a thing at all, the great slow beat that he heard in a dying boy’s marrow, now spread across a thousand bodies like a net.',
        s.f.miller_followed
          ? 'At the front, a miller sits on the cobbles with his head in his hands. His wife stands beside him, barefoot, wet to the knee. He looks up as Corr passes. “You,” he says, and then, in a whisper: “You know. Don’t you. You *know* what this is.”'
          : 'At the front, a miller kneels beside his wife, who is standing perfectly rigid with her eyes open, and he has tied his own belt around her wrist and around his, and is crying quietly, steadily, the way a man does when he has been crying for a day. He looks up at Corr and says, in a cracked voice, “Please. Can you wake her? The priests say it is a holy thing. It is not a holy thing.”',

    },

      { tag: 'Walk on', label: 'Say you can’t. Not here, not with the Candlemen at the edge of the square. Tell him you are sorry.', goto: 'e2_c5c', set: { c_walked_on: true } }

  e2_c5a: {
    set: { c_hild_woke: true },
    fx: function (s) { s.omen(1); s.addRel('hild', 1); s.echo('Corr counted the miller’s wife awake in the great square, before a thousand sleepers.'); },
    text: [
      'It is not a thing you do quickly. It is something between a prayer and a surgery. Palm flat over the breastbone, three fingers spread, listening *down* through the layers of her, past the bone and the marrow to the place where the beat begins. It is there, as it was in the boy: a great slow patient hook, set deep.',
      'He does what his grandmother taught him. He counts *against* it. One, and two, and three — he does not go to four; he *never* goes to four — and the hook slackens and the tide turns in the woman’s chest, and she draws a long, shuddering, ragged breath like a swimmer breaking the surface.',
      'Her eyes focus. She looks at the man kneeling over her and at the sky and at the miller, her husband, who is making a noise like a sob and a laugh at the same time.',

        h += '<h3 class="subhead" style="color:' + povColor(p) + '">' + esc(Q.chars[p].short) + '</h3><ul class="bonds">' + rows.map(function (k) {
          var n = S.rel[k], id = k.split('>')[1];
          return '<li><span>' + esc(Q.npcName(id)) + '</span><span class="b' + (n > 0 ? ' pos' : n < 0 ? ' neg' : '') + '">' + lab(n) + '</span></li>';
        }).join('') + '</ul>';
      });
      if (!any) h += '<p class="quiet">No one has yet decided what they think of you.</p>';
    } else if (tab === 'whispers') {
      var cl = Object.keys(S.clues);
      h += cl.length ? '<ul>' + cl.map(function (c) { return '<li>' + md(S.clues[c]) + '</li>'; }).join('') + '</ul>' : '<p class="quiet">You have heard nothing worth writing down. Yet.</p>';
    } else {
      var eps = {};
      S.echoes.forEach(function (e) { (eps[e.ep] = eps[e.ep] || []).push(e.text); });
      var ks = Object.keys(eps);
      h += ks.length ? ks.map(function (k) { return '<h3 class="subhead">Episode ' + k + '</h3><ul>' + eps[k].map(function (t) { return '<li>' + md(t) + '</li>'; }).join('') + '</ul>'; }).join('') : '<p class="quiet">Nothing has been decided that cannot be undone.</p>';
    }
    openModal(h + '</div>');
  }

  function saves() {
    openModal('<h2>Saves</h2><p class="quiet">Loading…</p>');
    Promise.all([Store.get('slot1'), Store.get('slot2'), Store.get('slot3'), Store.get('auto')]).then(function (recs) {
      var d = Store.describe();
      var h = '<h2>Saves</h2><p class="syncnote ' + (d.cloud ? 'on' : '') + '">' + (d.cloud ? '☁ ' : '') + esc(d.text) + '</p><p class="quiet">The game autosaves after every step. Manual slots are for branching your own story.</p>';
      [1, 2, 3].forEach(function (n) {
        var r = recs[n - 1];
        h += '<div class="slot"><div><b>Slot ' + n + '</b><div class="quiet">' + (r ? esc(r.label) + ' — ' + new Date(r.t).toLocaleString() : 'Empty') + '</div></div><div>' +
          (S ? '<button class="btn sm" data-do="save" data-slot="slot' + n + '">Save</button>' : '') +
          (r ? '<button class="btn sm" data-do="load" data-slot="slot' + n + '">Load</button>' : '') + '</div></div>';
      });
      var a = recs[3];
      h += '<div class="slot"><div><b>Autosave</b><div class="quiet">' + (a ? esc(a.label) + ' — ' + new Date(a.t).toLocaleString() : 'Empty') + '</div></div><div>' + (a ? '<button class="btn sm" data-do="load" data-slot="auto">Load</button>' : '') + '</div></div>';
      h += '<h3 class="subhead">Save code</h3><p class="quiet">A save code is plain text you can paste anywhere. Use it as a backup, or to move a game between accounts.</p><textarea id="codebox" rows="3" ' + (S ? '' : 'placeholder="Paste a save code here"') + '></textarea><div class="row">' + (S ? '<button class="btn sm" data-do="export">Show my code</button>' : '') + '<button class="btn sm" data-do="import">Load from code</button></div><div id="codemsg" class="quiet"></div>';
      openModal(h);
    });
  }

  function settingsModal() {
    function seg(name, opts, cur) { return '<div class="seg">' + opts.map(function (o) { return '<button data-do="' + name + '" data-v="' + o[0] + '" class="' + (cur === o[0] ? 'on' : '') + '">' + o[1] + '</button>'; }).join('') + '</div>'; }
    openModal('<h2>Settings</h2><h3 class="subhead">Text size</h3>' + seg('size', [['s', 'Small'], ['m', 'Medium'], ['l', 'Large']], settings.size) +
      '<h3 class="subhead">Theme</h3>' + seg('theme', [['night', 'Night'], ['parchment', 'Parchment']], settings.theme) +
      '<h3 class="subhead">Motion</h3>' + seg('motion', [['x', settings.motion ? 'Fades on — click to turn off' : 'Fades off — click to turn on']], 'x'));
  }

  $('#btn-journal').addEventListener('click', function () { if (S) journal('cast'); });
  $('#btn-saves').addEventListener('click', saves);
  $('#btn-settings').addEventListener('click', settingsModal);
  $('#btn-menu').addEventListener('click', showTitle);

  /* ---------- title screen ---------- */
  var titleAuto = null;
  function showTitle() {
    var a = titleAuto;
    var t = $('#title');
    var d = Store.describe();
    var checked = ($('#adult') ? $('#adult').checked : adult);
    t.innerHTML = '<div class="titlecard"><div class="small">A drama in ten episodes</div><h1>' + esc(Q.GAME_TITLE) + '</h1><div class="small">' + esc(Q.SEASON_NAME) + '</div>' +
      '<div class="gate"><label><input type="checkbox" id="adult"' + (checked ? ' checked' : '') + '> I am 18 or older, and I understand this story contains graphic violence, explicit sexual content, cruelty, and religious and political atrocity.</label></div>' +
      '<div class="tmenu"><button class="btn primary" id="t-new"' + (checked ? '' : ' disabled') + '>New Game</button>' +
      (a ? '<button class="btn" id="t-cont"' + (checked ? '' : ' disabled') + '>Continue <span class="quiet">' + esc(a.label) + '</span></button>' : '') +
      '<button class="btn" id="t-saves">Saves</button><button class="btn" id="t-set">Settings</button></div>' +
      '<p class="syncnote ' + (d.cloud ? 'on' : '') + '">' + (d.cloud ? '☁ Cloud saves on' : (Store.ready && Store.mode === 'local' && Store.reason ? 'Saves on this device only' : 'Checking saves…')) + '</p>' +
      '<p class="quiet foot">Choices carry across episodes. Characters can die, and they stay dead.</p></div>';
    t.classList.add('open');
    $('#adult').onchange = function () {
      adult = this.checked; applySettings(true);
      $('#t-new').disabled = !this.checked; if ($('#t-cont')) $('#t-cont').disabled = !this.checked;
    };
    $('#t-new').onclick = function () {
      if (!a) { S = Q.newState(); hideTitle(); render(); return; }
      openModal('<h2>Start a new game?</h2><p>Your autosave (' + esc(a.label) + ') will be replaced as you play. Manual save slots are not touched.</p><div class="row"><button class="btn primary" data-do="newok">Start new game</button><button class="btn" data-do="cancel">Keep my game</button></div>');
    };
    if ($('#t-cont')) $('#t-cont').onclick = function () { S = a.state; hideTitle(); render(); };
    $('#t-saves').onclick = saves; $('#t-set').onclick = settingsModal;
  }
  function hideTitle() { $('#title').classList.remove('open'); }

  applySettings(false);
  showTitle();
  // Connect to cloud saves in the background, then refresh the title screen and preferences.
  Store.onChange = function () { if ($('#title').classList.contains('open')) showTitle(); };
  Store.init().then(function () {
    return Promise.all([Store.getPrefs(), Store.get('auto')]);
  }).then(function (r) {
    mergePrefs(r[0]); applySettings(false);
    titleAuto = r[1];
    if ($('#title').classList.contains('open')) showTitle();
  }).catch(function () { if ($('#title').classList.contains('open')) showTitle(); });
  // Local mirror is available immediately, before the cloud answers.
  (function () { try { var a = JSON.parse(localStorage.getItem('quartus.save.auto')); if (a && !titleAuto) { titleAuto = a; showTitle(); } } catch (e) {} })();
  window.Q.dbg = function () { return S; };
})();

</script>
