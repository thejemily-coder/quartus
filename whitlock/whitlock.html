<style>

}

/* ================================================================

const SERIES_TEXT = `SERIES: WHITLOCK — an interactive prestige-TV college drama.
SETTING: Whitlock University (est. 1791), an old-money private university in Alder Falls, a small snowy town in the Berkshires of western Massachusetts. Gothic towers, ivy, legacies vs. scholarship kids. Present day: phones, group chats, Instagram, TikTok, read receipts, screenshots as weapons.
KEY PLACES: Lowell House (oldest dorm; Cal has a coveted single on the 3rd floor — his father pulled strings); Elm Row (fraternity row; Sigma Kappa Rho "the Rho" is the oldest house, a mansion whose alumni include senators and felons); Kappa Lambda sorority house; Whitaker Commons (student center built with Cal's grandfather's money — his name is literally on the building); The Whitlock Herald (student paper, basement of Pruitt Hall); Kessler Rink (varsity hockey); the Tamsin Lake boathouse (rowing); Marlowe Theater (drama dept.); Fennimore Library; The Anchor (townie bar on Mill Street owned by Gus Moretti); Dot's Diner; the town of Alder Falls itself, where locals resent the school.
WORLDS: Greek life is central (Rho rush/pledging: hazing, loyalty, brotherhood, rot); also the Herald, varsity athletics, theater/arts, and the townies.
PROTAGONIST: CAL WHITAKER, 18, freshman. Third-generation legacy and black sheep: he got in on the name and everyone knows it. Charming screwup — funny, magnetic, avoidant, self-sabotaging; easy to love, hard to rely on. Smart, doesn't try (a professor will see through him; academic probation is possible). Secret gifts: he is a genuinely gifted writer (notebooks no one has read) and reads people uncannily — he knows what they want to hear, a superpower and a curse. Vices: lies easily (small smoothing lies that stack); runs when it's real (bolts when someone gets close or things get serious). Central wound: his mother Claire walked out when he was eleven; his cold, powerful father Richard raised him (mostly via housekeepers and St. Anselm's boarding school in New Hampshire) and expects him to be a credit. The school is Dad's turf. Cal is straight.
FATHER: RICHARD WHITAKER, 51, Whitlock '93, Rho alum, trustee, Boston finance. Magnetic, emotionally unavailable; calls rarely and always wants something. Expects Cal to pledge the Rho.
MOTHER: CLAIRE WHITAKER, 49, a writer, left when Cal was 11. Whereabouts unknown to Cal. She can surface offscreen (a text, a voicemail, a sighting) when the show decides.
PILOT: Move-in day. Cal arrives alone in a car service; Dad was supposed to come and didn't. By sunset he's at a party.

    if(S.db){
      try{ const s = await this.ref(k).get(); return s.exists ? structuredClone(s.data()) : null; }
      catch(e){ if(e?.code==='unavailable'){ await sleep(400+Math.random()*700); const s = await this.ref(k).get(); return s.exists ? structuredClone(s.data()) : null; } throw e; }
    }
    try{ const v = localStorage.getItem('whitlock:'+k); return v ? JSON.parse(v) : null; }catch{ return null; }

  set(k, obj){
    const data = JSON.parse(JSON.stringify(obj));
    const prev = this.q[k] || Promise.resolve();
    const p = prev.catch(()=>{}).then(async () => {
      if(S.db){
        try{ await this.ref(k).set(data); }
        catch(e){
          if(e?.code==='unavailable'){ await sleep(500+Math.random()*800); await this.ref(k).set(data); }

  },
  async wipe(){
    if(S.db){

async function ask(agentKey, prompt, label){
  if(!S.sample) throw {code:'sampling_unavailable'};
  const ag = AGENTS[agentKey];
  roomSet(agentKey, {status:'working', label, chars:0, t0:Date.now()});
  const ctl = new AbortController();
  try{

/* ================================================================

   ================================================================ */
function addCast(list){
  for(const n of list||[]){
    if(!n?.id || !n.name) continue;
    const id = slug(n.id);
    if(!S.canon.cast[id]) S.canon.cast[id] = {id, name:n.name, role:n.role||'', age:n.age, descriptor:n.descriptor||'', introduced:false, metCal:false, moments:[]};
  }
}
function normalizeBible(b){
  b = (b && typeof b==='object') ? b : {};
  b.arcs = Array.isArray(b.arcs) ? b.arcs : [];
  b.arcs.forEach((a,i) => { a.id = slug(a.id || ('arc-'+i)); a.cluesPlanted = arr(a.cluesPlanted); a.status = a.status || 'dormant'; });
  b.newCast = Array.isArray(b.newCast) ? b.newCast : [];
  b.newCast.forEach(n => n.id = slug(n.id || n.name));
  b.seasons = b.seasons || {};
  b.notes = b.notes || [];
  return b;
}
function mergeArcs(list){
  for(const a of list||[]){
    if(!a?.id) continue; const id = slug(a.id);
    if(S.bible.arcs.some(x=>x.id===id)) continue;
    S.bible.arcs.push({...a, id, cluesPlanted:arr(a.cluesPlanted), status:a.status||'dormant'});
  }
}
function mergeBibleUpdate(u){
  for(const a of u.arcs||[]){
    const cur = S.bible.arcs.find(x=>x.id===slug(a.id)); if(!cur) continue;
    if(a.status && cur.status!=='closed'){
      if(a.status==='closed') cur.closedAt = epLabel();
      cur.status = a.status;
    }
    if(a.progress) cur.progress = a.progress;
    if(a.reveal) cur.reveal = a.reveal;
    for(const c of arr(a.cluesPlanted)) if(!cur.cluesPlanted.includes(c)) cur.cluesPlanted.push(c);
  }
  mergeArcs(u.newArcs);
  if(Array.isArray(u.newCast)){ S.bible.newCast.push(...u.newCast.filter(n=>n?.id).map(n=>({...n, id:slug(n.id)}))); addCast(u.newCast); }
  const sp = S.bible.seasons[S.state.season];
  if(sp && Array.isArray(u.outline)){
    for(const o of u.outline){ const e = Number(o.e); if(!(e > S.state.ep)) continue; const i = sp.episodes.findIndex(x=>Number(x.e)===e); if(i>=0) sp.episodes[i] = {...sp.episodes[i], ...o, e}; else sp.episodes.push({...o, e}); }
  }
  if(u.privateNotes) S.bible.notes = [...(S.bible.notes||[]), `${epLabel()}: ${u.privateNotes}`].slice(-12);
}
function mergeLedger(p, label){
  const c = S.canon, F = S.facts;
  for(const x of p.cast||[]){
    if(!x?.id) continue; const id = slug(x.id); if(id==='cal') continue;
    const cur = c.cast[id] || {id, moments:[], introduced:false, metCal:false};
    if(x.name) cur.name = x.name; if(x.role) cur.role = x.role; if(x.age) cur.age = x.age;
    if(x.descriptor && !cur.descriptor) cur.descriptor = x.descriptor;
    if(x.introduced !== false){ if(!cur.introduced) cur.firstSeen = label; cur.introduced = true; }
    if(x.metCal){ if(!cur.metCal) cur.metAt = label; cur.metCal = true; }
    if(x.impression) cur.impression = x.impression;
    if(x.moment) cur.moments = [...(cur.moments||[]), `${label}: ${x.moment}`].slice(-10);
    if(!cur.name) cur.name = id;
    c.cast[id] = cur;
  }
  for(const f of p.facts||[]){ if(!f?.t) continue; F.facts.push({id:'f'+(F.next++), t:f.t, k:arr(f.k), a:arr(f.a), aud:f.aud!==false, pub:!!f.pub, ep:label}); }
  for(const l of p.learned||[]){ const f = F.facts.find(z=>z.id===l.id); if(f) f.k = [...new Set([...f.k, ...arr(l.k)])]; }
  c.threads = c.threads || [];
  for(const t of p.threads||[]){
    if(!t) continue; const cur = t.id && c.threads.find(z=>z.id===t.id);
    if(cur){ if(t.t) cur.t = t.t; if(t.state) cur.state = t.state; }
    else if(t.t) c.threads.push({id: t.id ? slug(t.id) : ('t'+(c.threads.length+1)), t:t.t, state:t.state||'open', ep:label});
  }
  c.threads = c.threads.filter(t=>t.state!=='closed').concat(c.threads.filter(t=>t.state==='closed').slice(-20));
  c.locations = [...new Set([...(c.locations||[]), ...arr(p.locations)])];
  if(/^\d{4}-\d{2}-\d{2}$/.test(p.date||'')) S.state.date = p.date;
  F.events = [...(F.events||[]), ...arr(p.events).map(t=>({ep:label, t}))].slice(-120);
}
const okBlock = b => b && typeof b==='object' && typeof b.t==='string';
function normBlocks(x){ return (Array.isArray(x) ? x : []).filter(okBlock); }
function normalizeAct(act, k){
  if(!act || !Array.isArray(act.beats) || !act.beats.length) throw {code:'invalid_json', message:'Act had no beats'};
  act.act = k;
  act.bridge = (act.bridge && typeof act.bridge==='object' && !Array.isArray(act.bridge)) ? act.bridge : {};
  for(const key of Object.keys(act.bridge)) act.bridge[key] = normBlocks(act.bridge[key]);
  act.outro = normBlocks(act.outro);
  const seen = new Set();
  act.beats.forEach((b,i) => {
    if(!b.id || seen.has(b.id)) b.id = 'b'+(i+1); seen.add(b.id);
    b.blocks = normBlocks(b.blocks);
    b.choices = (Array.isArray(b.choices)?b.choices:[]).filter(c=>c && c.label);
    const cs = new Set();
    b.choices.forEach((c,j) => { if(!c.id || cs.has(c.id)) c.id = b.id+'c'+(j+1); cs.add(c.id); c.reaction = normBlocks(c.reaction); c.remember = c.remember||''; });
    if(!b.choices.length) b.choices = [{id:b.id+'c1', label:'Keep going.', reaction:[], remember:''}];
  });
  return act;
}
function applyPatches(act, patches){
  let n = 0;
  for(const p of patches||[]){
    try{
      let target;
      if(p.part==='outro') target = act.outro;
      else if(p.part==='bridge') target = act.bridge?.[p.bridgeKey];
      else { const b = act.beats.find(x=>x.id===p.beat); if(!b) continue;
        target = p.part==='reaction' ? b.choices.find(c=>c.id===p.choice)?.reaction : b.blocks; }
      if(!Array.isArray(target)) continue;
      const i = Number(p.index); if(!(i>=0 && i<=target.length)) continue;
      if(p.block===null){ if(i<target.length){ target.splice(i,1); n++; } }
      else if(okBlock(p.block)){ if(i<target.length) target[i] = p.block; else target.push(p.block); n++; }
    }catch{}
  }
  return n;
}

/* ---------- transcripts ---------- */
function actShownBlocks(k){
  const act = S.acts[k]; if(!act) return [];
  const out = [], picks = S.state.picks?.[k] || {};
  if(k>1){ const prev = S.acts[k-1]; const lb = prev?.beats[prev.beats.length-1]; const pk = lb && S.state.picks?.[k-1]?.[lb.id]; if(pk && act.bridge?.[pk]) out.push(...act.bridge[pk]); }
  for(const b of act.beats){
    out.push(...b.blocks);
    const pk = picks[b.id]; if(!pk) break;
    const c = b.choices.find(x=>x.id===pk);
    if(c){ out.push({t:'pick', text:c.label}); out.push(...c.reaction); }
  }
  const lb = act.beats[act.beats.length-1];
  if(picks[lb.id]) out.push(...act.outro);
  return out;
}
function blocksToText(blocks){
  return blocks.map(b => {
    switch(b.t){
      case 'slug': return '\n' + (b.cut ? 'CUTAWAY — ' : '') + b.text;
      case 'a': return b.text;
      case 'line': return `${(b.name||b.who||'').toUpperCase()}${b.paren?' '+b.paren:''}: ${b.text}`;
      case 'texts': return `[TEXTS — ${b.thread}${b.onCal?' (Cal\'s phone)':''}] ` + (b.msgs||[]).map(m=>`${m.from}: ${m.text}`).join(' | ');
      case 'music': return `♪ ${b.song} — ${b.artist}`;
      case 'card': return `— ${b.text} —`;
      case 'pick': return `▶ CAL CHOOSES: ${b.text}`;
      default: return b.text || '';
    }
  }).join('\n');
}

/* ================================================================
   PIPELINE (resumable; every step persists before moving on)
   ================================================================ */
async function runPipeline(){
  if(S.running || !S.state) return;
  if(!S.sample){ S.err = describeErr({code:'sampling_unavailable'}); render(); return; }
  S.running = true; S.err = null; render();
  try{
    for(let guard=0; guard<12; guard++){
      const st = S.state.stage;
      if(st==='new') await stepBible();
      else if(st==='season_plan') await stepSeason();
      else if(st==='plan') await stepPlan();
      else if(st==='write') await stepWrite();
      else if(st==='wrap') await stepWrap();
      else if(st==='between') await stepBetween();
      else break;
      render();
    }
  }catch(e){ console.warn(e); S.err = describeErr(e); }
  finally{ S.running = false; render(); }
}
async function stepBible(){
  const b = await ask('showrunner', pBible(), 'Writing the secret series bible');
  S.bible = normalizeBible(b);
  addCast(S.bible.newCast);
  await Store.set('bible', S.bible); await Store.set('canon', S.canon);
  S.state.stage = 'season_plan'; await saveState();
}
async function stepSeason(){
  const out = await ask('showrunner', pSeason(), `Breaking Season ${S.state.season}`);
  const eps = Array.isArray(out?.episodes) ? out.episodes : [];
  if(eps.length < 5) throw {code:'invalid_json', message:'Season outline too short'};
  S.bible.seasons[S.state.season] = {title:out.title||`Season ${S.state.season}`, logline:out.logline||'', seasonArc:out.seasonArc||'', episodes:eps.map((x,i)=>({...x, e:Number(x.e)||i+1}))};
  mergeArcs(out.newArcs);
  if(Array.isArray(out.newCast)){ S.bible.newCast.push(...out.newCast.filter(n=>n?.id).map(n=>({...n,id:slug(n.id)}))); addCast(out.newCast); }
  await Store.set('bible', S.bible); await Store.set('canon', S.canon);
  if(S.state.season===1 && S.state.ep===1) S.state.date = seasonWindow(1).startISO;
  S.state.stage = 'plan'; await saveState();
}
async function stepPlan(){
  const plan = await ask('planner', pPlan(), `Breaking ${epLabel()}`);
  if(!plan || !Array.isArray(plan.acts) || !plan.acts.length) throw {code:'invalid_json', message:'Plan missing acts'};
  plan.acts = plan.acts.slice(0,4).map((a,i)=>({...a, n:i+1, beats:Array.isArray(a.beats)?a.beats:[]}));
  plan.title = plan.title || 'Untitled';
  plan.introduce = arr(plan.introduce).map(slug);
  S.plan = plan; S.acts = {};
  await Store.set('plan-'+epKey(), plan);
  Object.assign(S.state, {stage:'write', act:1, beat:0, picks:{}, epStarted:false, phoneReplies:[], ledgerQueue:[]});
  if(/^\d{4}-\d{2}-\d{2}$/.test(plan.dateStart||'')) S.state.date = plan.dateStart;
  await saveState(); applySeason();
}
async function stepWrite(){
  await ensureAct(S.state.act);
  S.state.stage = 'play'; await saveState();
  prefetchCheck();
}
function ensureAct(k){
  if(S.acts[k]) return Promise.resolve(S.acts[k]);
  if(S.jobs['act'+k]) return S.jobs['act'+k];
  const ep = epKey();
  const p = (async () => {
    let act = await Store.get(`act-${ep}-${k}`);
    if(!act){
      const draft = normalizeAct(await ask('writer', pAct(k), `Drafting Act ${NUM[k]}`), k);
      try{
        const ed = await ask('editor', pEdit(k, draft), `Checking Act ${NUM[k]}`);
        const n = applyPatches(draft, ed?.patches);
        draft.audit = {issues:(ed?.issues||[]).length, fixed:n};
        roomSet('editor', {status:'done', label: n ? `Fixed ${n} continuity slip${n>1?'s':''} in Act ${NUM[k]}` : `Act ${NUM[k]} is clean`});
      }catch(e){ if(['not_granted','sampling_disabled','session_expired','rate_limited'].includes(e?.code)) throw e; draft.audit = {skipped:true}; }
      act = draft;
      if(epKey()!==ep) return act;
      await Store.set(`act-${ep}-${k}`, act);
    }
    if(epKey()===ep) S.acts[k] = act;
    return act;
  })();
  S.jobs['act'+k] = p;
  p.then(()=>{ S.soften=false; render(); }, ()=>{}).finally(()=>{ if(S.jobs['act'+k]===p) delete S.jobs['act'+k]; });
  return p;
}
function prefetchCheck(){
  if(!S.plan || S.state.stage!=='play') return;
  const k = S.state.act, act = S.acts[k]; if(!act || k >= S.plan.acts.length || S.acts[k+1] || S.jobs['act'+(k+1)]) return;
  const picked = Object.keys(S.state.picks?.[k]||{}).length;
  if(picked >= act.beats.length-1 || act.beats.length < 2){
    ensureAct(k+1).catch(e => { S.prefetchErr = e; });
  }
}
function queueLedger(k){
  S.state.ledgerQueue = S.state.ledgerQueue || [];
  if(S.state.ledgerQueue.some(x=>x.ep===epKey() && x.act===k)) return;
  S.state.ledgerQueue.push({ep:epKey(), label:epLabel(), act:k, text:clip(blocksToText(actShownBlocks(k)), 60000)});
}
let ledgerP = null;
function drainLedger(){
  if(ledgerP) return ledgerP;
  ledgerP = (async () => {
    while((S.state.ledgerQueue||[]).length){
      const item = S.state.ledgerQueue[0];
      const p = await ask('ledger', pLedger(item), `Logging ${item.label} Act ${NUM[item.act]}`);
      mergeLedger(p||{}, item.label);
      await Store.set('canon', S.canon); await Store.set('facts', S.facts);
      S.state.ledgerQueue.shift(); await saveState();
    }
  })().finally(()=>{ ledgerP = null; });
  return ledgerP;
}
function collectPhone(k){
  const blocks = actShownBlocks(k).filter(b=>b.t==='texts' && (b.onCal || (b.msgs||[]).some(m=>m.from==='cal')));
  for(const b of blocks){
    const key = slug(b.thread||'unknown');
    const th = S.phone.threads[key] || (S.phone.threads[key] = {name:b.thread||'Unknown', msgs:[]});
    for(const m of b.msgs||[]) th.msgs.push({me:m.from==='cal', from:m.from, text:m.text, ep:epLabel()});
    th.last = Date.now();
  }
  if(blocks.length) Store.set('phone', S.phone);
}
async function stepWrap(){
  await drainLedger();
  const w = await ask('recap', pWrap(), `Cutting ${epLabel()}`);
  const entry = {key:epKey(), label:epLabel(), season:S.state.season, ep:S.state.ep, title:S.plan.title, logline:w.logline||S.plan.logline||'', recap:w.recap||'', previously:arr(w.previously), date:S.state.date,
    music:(S.plan.music||[]).slice(-1)[0]||null};
  S.guide.eps = S.guide.eps.filter(e=>e.key!==entry.key).concat(entry);
  await Store.set('guide', S.guide);
  const tx = []; S.plan.acts.forEach((_,i)=>{ tx.push({t:'actcard', text:`Act ${NUM[i+1]}`}); tx.push(...actShownBlocks(i+1)); });
  await Store.set('tx-'+epKey(), {title:S.plan.title, label:epLabel(), blocks:tx});
  if(w.calNow){ S.canon.calNow = w.calNow; await Store.set('canon', S.canon); }
  S.state.interlude = (Array.isArray(w.phone)?w.phone:[]).filter(t=>t && t.name && Array.isArray(t.options) && t.options.length).slice(0,4)
    .map((t,i)=>({...t, i, msgs:arr(t.msgs), options:t.options.slice(0,4).map((o,j)=>({id:'r'+(j+1), text:String(o?.text ?? o)}))}));
  S.state.interPicks = {};
  S.state.stage = 'credits'; await saveState();
}
async function stepBetween(){
  await drainLedger();
  S.state.between = S.state.between || {};
  if(!S.state.between.bible){
    const u = await ask('showrunner', pBibleUpdate(), `Steering the arcs after ${epLabel()}`);
    mergeBibleUpdate(u||{});
    await Store.set('bible', S.bible);
    S.state.between.bible = true; await saveState();
  }
  if(S.state.ep >= 10){
    if(!S.state.between.compact){
      const cmp = await ask('ledger', pCompact(), `Closing the books on Season ${S.state.season}`);
      if(cmp?.seasonSummary) S.facts.summaries[S.state.season] = cmp.seasonSummary;
      if(Array.isArray(cmp?.keep) && cmp.keep.length > S.facts.facts.length*0.3){
        const byId = new Map(S.facts.facts.map(f=>[f.id,f]));
        S.facts.facts = cmp.keep.map(x=>{ const f = byId.get(x.id); if(!f) return null; if(x.t) f.t = x.t; if(Array.isArray(x.k)&&x.k.length) f.k = arr(x.k); return f; }).filter(Boolean);
      }
      if(Array.isArray(cmp?.events)) S.facts.events = cmp.events.map(t=>({ep:`Season ${S.state.season}`, t:String(t)}));
      await Store.set('facts', S.facts);
      S.state.between.compact = true; await saveState();
    }
    if(S.state.season >= FINAL_SEASON){ S.state.stage = 'finale'; S.state.between = {}; await saveState(); return; }
    S.state.season++; S.state.ep = 1; S.state.stage = 'season_plan';
    S.state.date = seasonWindow(S.state.season).startISO;
  } else { S.state.ep++; S.state.stage = 'plan'; }
  S.state.between = {}; S.state.interlude = null; S.acts = {}; S.plan = null;
  await saveState(); applySeason();
}

function describeErr(e){
  const code = e?.code || 'upstream_error';
  if(code==='refused') S.soften = true;
  const copy = {
    sampling_unavailable:"The writers need Claude, and this view can't reach it. Open the game on claude.ai while signed in.",
    not_granted:"Claude access was declined for this page, so the writers can't work. Reload the page and choose Allow when asked.",
    sampling_disabled:"Claude isn't available on this account right now.",
    rate_limited:"You've hit a usage limit. Wait a while, then retry. Your progress is saved.",
    session_expired:"Your claude.ai session expired. Sign in again, then retry.",
    refused:"The writers balked at a scene. Retry, and they'll handle the most graphic moment with a cut.",
    invalid_json:"A script came back garbled. Retry to have it rewritten.",
    empty_completion:"A draft came back empty. Retry.",
    prompt_too_large:"The story context got too big to send. Retry; if it keeps happening, the ledger needs compacting.",
    cancelled:"The draft was stopped.",
  }[code] || "The connection dropped mid-draft. Retry when you're ready.";
  return {code, copy};
}

async function newGame(){
  S.state = {v:1, stage:'new', season:1, ep:1, act:1, beat:0, picks:{}, date:'2026-08-24', created:Date.now(), rev:0, ledgerQueue:[], phoneReplies:[]};
  S.canon = {cast:{}, threads:[], locations:[], calNow:''};
  CAST_SEED.forEach(c => S.canon.cast[c.id] = {...c, introduced:false, metCal:false, moments:[]});
  S.facts = {facts:FACT_SEED.map((f,i)=>({id:'f'+(i+1), ep:'backstory', aud:false, ...f})), next:FACT_SEED.length+1, events:[], summaries:{}};
  S.guide = {eps:[]}; S.phone = {threads:{}}; S.bible = null; S.acts = {}; S.plan = null;
  await Promise.all([Store.set('canon',S.canon), Store.set('facts',S.facts), Store.set('guide',S.guide), Store.set('phone',S.phone)]);
  await saveState(); applySeason(); S.tab='story';
  runPipeline();
}
async function pick(k, beatId, choiceId){
  if(S.state.stage!=='play' || k!==S.state.act) return;
  const act = S.acts[k]; const idx = act.beats.findIndex(b=>b.id===beatId);
  if(idx!==S.state.beat) return;
  S.state.picks[k] = S.state.picks[k] || {};
  if(S.state.picks[k][beatId]) return;
  S.state.picks[k][beatId] = choiceId;
  S.scrollTo = 'pick-'+k+'-'+beatId;
  saveState(); render(); prefetchCheck();
}
async function cont(){
  const k = S.state.act, act = S.acts[k];
  if(!act) return;
  if(S.state.beat < act.beats.length-1){ S.state.beat++; S.scrollTo = 'beat-'+k+'-'+act.beats[S.state.beat].id; saveState(); render(); return; }
  queueLedger(k); collectPhone(k);
  if(k < S.plan.acts.length){
    S.state.act = k+1; S.state.beat = 0; S.state.stage = S.acts[k+1] ? 'play' : 'write';
    S.scrollTo = 'act-'+(k+1);
    await saveState(); render();
    drainLedger().catch(()=>{});
    if(S.state.stage==='write') runPipeline(); else prefetchCheck();
  } else {
    S.state.stage = 'wrap'; await saveState(); render(); runPipeline();
  }
}
async function startEpisode(){ S.state.epStarted = true; await saveState(); window.scrollTo({top:0}); render(); prefetchCheck(); }
async function interReply(i, optId){
  const t = S.state.interlude?.[i]; if(!t || S.state.interPicks[i]) return;
  const o = t.options.find(x=>x.id===optId) || t.options[0];
  S.state.interPicks[i] = o.id;
  S.state.phoneReplies = [...(S.state.phoneReplies||[]), {from:t.from, name:t.name, msgs:t.msgs, reply:o.text}];
  const key = slug(t.name);
  const th = S.phone.threads[key] || (S.phone.threads[key] = {name:t.name, msgs:[]});
  t.msgs.forEach(m => th.msgs.push({me:false, from:t.from, text:m, ep:epLabel()}));
  th.msgs.push({me:true, from:'cal', text:o.text, ep:epLabel()}); th.last = Date.now();
  Store.set('phone', S.phone); await saveState(); render();
}
async function finishInterlude(){ S.state.stage = 'between'; await saveState(); render(); runPipeline(); }
async function resetAll(){
  S.confirmReset = false;
  await Store.wipe();
  Object.assign(S, {state:null, canon:null, facts:null, bible:null, guide:null, phone:null, plan:null, acts:{}, room:{}, err:null});
  applySeason(); S.tab = 'story'; render(); toast('Erased. A new Whitlock awaits.');
}

function avatar(id, name, size=44){
  let h = 2166136261; for(const ch of String(id)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const h1 = h % 360, h2 = (h1 + 35 + (h>>9)%150) % 360, h3 = (h2 + 60 + (h>>17)%90) % 360, ang = (h>>5) % 360;
  const ini = String(name||id).replace(/^(Prof\.|Dr\.)\s*/,'').split(/\s+/).map(w=>w[0]).filter(Boolean).slice(0,2).join('').toUpperCase();
  return `<span class="av" aria-hidden="true" style="--h1:${h1};--h2:${h2};--h3:${h3};--ang:${ang}deg;width:${size}px;height:${size}px;font-size:${size*.42}px">${esc(ini)}</span>`;
}
function blockHTML(b){
  switch(b.t){
    case 'slug': return `<div class="slug${b.cut?' cut':''}">${esc(b.text)}</div>`;
    case 'a': return `<p class="a">${esc(b.text)}</p>`;
    case 'line': return `<div class="ln"><span class="who">${esc(b.name || nameOf(b.who))}</span>${b.paren?`<span class="par">${esc(b.paren)}</span>`:''}<p class="say">${esc(b.text)}</p></div>`;
    case 'texts': return `<div class="phone" role="group" aria-label="Text messages"><div class="th">${esc(b.thread)}</div>${(b.msgs||[]).map(m=>`<div class="bub${m.from==='cal'?' me':''}">${m.from!=='cal' && !b.thread?.toLowerCase().includes(nameOf(m.from).toLowerCase().split(' ')[0]) ? `<small>${esc(nameOf(m.from))}</small>`:''}${esc(m.text)}</div>`).join('')}</div>`;
    case 'music': return `<div class="music">${esc(b.song)} — ${esc(b.artist)}</div>`;
    case 'card': return `<div class="cardline">${esc(b.text)}</div>`;
    case 'actcard': return `<div class="actcard">${esc(b.text)}</div>`;
    case 'pick': return `<div class="chosen">Cal chose<b>${esc(b.text)}</b></div>`;
    default: return b.text ? `<p class="a">${esc(b.text)}</p>` : '';
  }
}
function nameOf(id){ if(!id) return ''; if(id==='cal') return 'Cal'; const c = S.canon?.cast?.[id]; return c ? c.name.replace(/^Prof\.\s*/,'').split(' ')[0] : String(id); }
const blocksHTML = bs => (bs||[]).map(blockHTML).join('');

function roomHTML(){
  const order = ['showrunner','planner','writer','editor','ledger','recap'];
  return order.map(k => {
    const a = AGENTS[k], r = S.room[k] || {};
    const st = r.status || 'idle';
    const pct = st==='done' ? 100 : st==='working' ? Math.min(95, Math.round(100*(r.chars||0)/a.expect)) : 0;
    const label = st==='working' ? (r.chars ? `${r.label} · ${Math.round(r.chars/1000)}k` : `${r.label} · thinking`) : (r.label || a.job);
    return `<div class="agent"><span class="nm">${esc(a.name)}</span><span class="st ${st}">${st==='idle'?'Standing by':st==='working'?'Working':st==='done'?'Done':'Stopped'}</span><span class="md">${esc(TIER_LABEL[a.tier])} · ${esc(label)}</span><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join('');
}
function pillHTML(){
  const w = Object.entries(S.room).find(([,r])=>r.status==='working');
  return w ? `<span class="pill"><i></i>${esc(AGENTS[w[0]].name)} · ${esc(w[1].label||'')}</span>` : '';

function playHTML(){
  const st = S.state, plan = S.plan, out = [];
  out.push(`<div class="col script">`);
  for(let k=1; k<=st.act; k++){
    const act = S.acts[k];
    if(k>1) out.push(`<div class="actcard" id="act-${k}">Act ${NUM[k]}</div>`);
    if(!act) break;
    const picks = st.picks?.[k] || {};
    if(k>1){ const prev = S.acts[k-1], lb = prev.beats[prev.beats.length-1], pk = st.picks?.[k-1]?.[lb.id]; if(pk && act.bridge?.[pk]) out.push(blocksHTML(act.bridge[pk])); }
    const upto = k < st.act ? act.beats.length-1 : st.beat;
    for(let i=0; i<=upto && i<act.beats.length; i++){
      const b = act.beats[i], pk = picks[b.id];
      out.push(`<div id="beat-${k}-${b.id}"></div>`);
      out.push(blocksHTML(b.blocks));
      if(pk){
        const c = b.choices.find(x=>x.id===pk) || {label:'', reaction:[]};
        out.push(`<div class="chosen" id="pick-${k}-${b.id}">Cal chose<b>${esc(c.label)}</b></div>`);
        out.push(blocksHTML(c.reaction));
        if(c.remember) out.push(`<div class="remember">${esc(c.remember)}</div>`);
        if(k===1 && i===0) out.push(`<div class="titlecard"><div class="mk">Whitlock</div><div class="eyebrow">Season ${st.season} · Episode ${st.ep}</div><h2>${esc(plan.title)}</h2></div>`);
      } else if(k===st.act){
        out.push(`<div class="choices" role="group" aria-label="What does Cal do?">${b.choices.map((c,j)=>`<button class="choice" data-pick="${k}|${esc(b.id)}|${esc(c.id)}"><span>${String.fromCharCode(65+j)}</span>${esc(c.label)}</button>`).join('')}</div>`);
      }
    }
    const lb = act.beats[act.beats.length-1];
    if(picks[lb.id]) out.push(blocksHTML(act.outro));
  }
  const cur = S.acts[st.act];
  if(st.stage==='play' && cur){
    const b = cur.beats[st.beat];
    if(st.picks?.[st.act]?.[b.id]){
      const last = st.beat === cur.beats.length-1;
      const lastAct = st.act === plan.acts.length;
      out.push(`<button class="btn cont" data-do="cont">${last ? (lastAct ? 'End of episode' : `Act ${NUM[st.act+1]}`) : 'Continue'}</button>`);

  if(st.stage==='wrap') out.push(`<div class="titlecard"><div class="mk">Whitlock</div><h2>End of episode</h2></div>` + waitPanel('Cutting the episode.', 'Post-production'));
  out.push(`</div>`);
  return out.join('');
}

function episodesHTML(){
  if(!S.state || !S.guide?.eps?.length) return emptyHTML('No episodes yet', 'Finished episodes appear here with recaps and full scripts.');
  const bySeason = {};
  S.guide.eps.forEach(e => (bySeason[e.season] = bySeason[e.season] || []).push(e));
  return Object.entries(bySeason).map(([s, eps]) => `<section class="season col"><div class="eyebrow">${esc(YEARS[seasonWindow(+s).yi])} year · ${esc(seasonWindow(+s).sem)}</div><h2>Season ${s}${S.bible?.seasons?.[s]?.title?`: <i>${esc(S.bible.seasons[s].title)}</i>`:''}</h2>
    ${eps.map(e=>`<div class="ep"><div class="n">E${e.ep}</div><div><h3>${esc(e.title)}</h3><p>${esc(e.logline)}</p></div>
      <details><summary>Recap</summary><p>${esc(e.recap)}</p><button class="linkbtn" data-read="${esc(e.key)}">Read the full script</button></details></div>`).join('')}</section>`).join('');
}
function phoneHTML(){
  const th = Object.entries(S.phone?.threads||{}).sort((a,b)=>(b[1].last||0)-(a[1].last||0));
  if(!th.length) return emptyHTML('No messages', "Texts Cal sends and receives in the story land here.");
  const sel = S.phoneSel && S.phone.threads[S.phoneSel] ? S.phoneSel : th[0][0];
  const t = S.phone.threads[sel];
  let lastEp = '';
  return `<div class="threads"><div class="tlist">${th.map(([k,v])=>`<button class="titem" data-thread="${esc(k)}" aria-current="${k===sel}">${avatar(k,v.name,32)}<span>${esc(v.name)}</span></button>`).join('')}</div>
    <div class="convo">${t.msgs.map(m=>{ const mark = m.ep!==lastEp ? `<div class="epmark">${esc(m.ep)}</div>` : ''; lastEp = m.ep; return mark + `<div class="bub${m.me?' me':''}">${esc(m.text)}</div>`; }).join('')}</div></div>`;
}
function calendarHTML(){
  if(!S.state) return emptyHTML('Late August', 'The calendar starts on move-in day.');
  const w = seasonWindow(S.state.season), base = (w.yi*7);
  const ev = EVENTS[w.sem].map(([md, name]) => {
    const iso = `${w.year}-${md}`; return {iso, name, done: iso < S.state.date};
  });
  return `<div class="stack col" style="max-width:56rem">
    <div><div class="eyebrow">${esc(YEARS[w.yi])} year · ${esc(w.sem)} ${w.sem==='Summer'?'':'semester'}</div><div class="bigdate">${esc(fmtDate(S.state.date,{weekday:'long',month:'long',day:'numeric'}))}</div><p class="muted">Season ${S.state.season}${S.bible?.seasons?.[S.state.season]?.title?` · ${esc(S.bible.seasons[S.state.season].title)}`:''} · Episode ${S.state.ep} of 10</p></div>
    <div class="strip">${SEASON_TEMPLATE.map((t,i)=>{ const n = base+i+1; const cls = n===S.state.season?'cur':n<S.state.season?'past':''; return `<div class="sblock ${cls}"><b>S${n}</b><span>${esc(t.sem)}</span><span class="muted">${esc(t.label)}</span></div>`; }).join('')}</div>
    <div class="panel"><div class="eyebrow" style="margin-bottom:.6rem">This ${w.sem==='Summer'?'summer':'semester'}</div><ul class="events">${ev.map(e=>`<li class="${e.done?'done':''}"><span>${esc(fmtDate(e.iso,{month:'short',day:'numeric'}))}</span>${esc(e.name)}</li>`).join('')}</ul></div>
    <div class="panel"><div class="eyebrow" style="margin-bottom:.6rem">Places Cal has been</div><p class="a">${(S.canon.locations||[]).length ? S.canon.locations.map(esc).join(' · ') : '<span class="muted">Nowhere yet. Places appear as the story visits them.</span>'}</p></div>
  </div>`;
}
function extrasHTML(){
  const closed = (S.bible?.arcs||[]).filter(a=>a.status==='closed' && a.reveal);
  return `<div class="stack col">
    <section class="stack"><div><div class="eyebrow">Unlocked secrets</div><h2 style="font-size:2rem">Behind the scenes</h2></div>
      ${closed.length ? closed.map(a=>`<div class="secret"><div class="eyebrow">${esc(a.scope||'')} arc · closed ${esc(a.closedAt||'')}</div><h3>${esc(a.title||a.id)}</h3><p class="a">${esc(a.reveal)}</p>${a.cluesPlanted?.length?`<div class="eyebrow">Clues you saw</div><ul>${a.cluesPlanted.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}</div>`).join('')
      : `<p class="muted">Each hidden storyline unlocks here after it resolves on-screen, with the clues that pointed to it. Nothing has resolved yet.</p>`}
    </section>
    <section class="panel"><div class="eyebrow" style="margin-bottom:.6rem">The writers' room</div><div class="room" id="room">${roomHTML()}</div>
      <p class="fine" style="margin:.8rem 0 0">Every act is drafted by the head writer, then audited by the continuity editor against the ledger of who knows what. The script coordinator updates that ledger after every act.</p></section>
    <section class="panel stack"><div><div class="eyebrow">Saving</div><p class="a">${S.local ? 'Saves are kept in this browser only, because this view has no account storage.' : 'Every choice saves to your claude.ai account automatically, so you can pick up on any device.'}</p></div>
      ${S.state ? (S.confirmReset ? `<div class="break"><p class="a">This erases Cal's whole story, the secret bible and every save. It can't be undone.</p><div class="row"><button class="btn warn" data-do="reset">Erase and start over</button><button class="btn ghost" data-do="noreset">Keep playing</button></div></div>`
        : `<div><button class="btn ghost" data-do="askreset">Start over</button></div>`) : ''}
    </section></div>`;
}
function emptyHTML(t, s){ return `<div class="col stack" style="padding-top:2rem"><h2 style="font-size:2.2rem;font-style:italic">${esc(t)}</h2><p class="muted">${esc(s)}</p></div>`; }

async function openReader(key){
  const r = $('#reader');
  r.hidden = false; r.innerHTML = `<div class="col"><p class="muted">Loading script…</p></div>`;
  const tx = await Store.get('tx-'+key).catch(()=>null);
  r.innerHTML = `<div class="col script"><div class="row" style="justify-content:space-between"><div class="eyebrow">${esc(tx?.label||'')}</div><button class="btn ghost" data-do="closereader">Close</button></div>
    <div class="titlecard"><div class="mk">Whitlock</div><h2>${esc(tx?.title||'Script unavailable')}</h2></div>${tx ? blocksHTML(tx.blocks) : ''}<button class="btn ghost cont" data-do="closereader">Close</button></div>`;
  r.scrollTop = 0;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-do],[data-pick],[data-reply],[data-thread],[data-read]');
  if(!t) return;
  if(t.dataset.tab){ S.tab = t.dataset.tab; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.pick){ const [k,b,c] = t.dataset.pick.split('|'); pick(Number(k), b, c); return; }
  if(t.dataset.reply){ const [i,o] = t.dataset.reply.split('|'); interReply(Number(i), o); return; }
  if(t.dataset.thread){ S.phoneSel = t.dataset.thread; render(); return; }
  if(t.dataset.read){ openReader(t.dataset.read); return; }
  const d = t.dataset.do;
  if(d==='new'){ t.disabled = true; newGame(); }
  else if(d==='retry'){ S.err = null; if(S.state?.stage==='play'){ prefetchCheck(); render(); } else runPipeline(); }
  else if(d==='cont'){ t.disabled = true; cont(); }
  else if(d==='start') startEpisode();
  else if(d==='tophone'){ S.state.stage = 'phone'; saveState(); render(); window.scrollTo({top:0}); }
  else if(d==='finishphone'){ t.disabled = true; finishInterlude(); }
  else if(d==='askreset'){ S.confirmReset = true; render(); }
  else if(d==='noreset'){ S.confirmReset = false; render(); }
  else if(d==='reset') resetAll();
  else if(d==='closereader'){ $('#reader').hidden = true; }
});

/* ---------- ambience ---------- */
function makeGrain(){
  try{
    const c = document.createElement('canvas'); c.width = c.height = 140; const x = c.getContext('2d');
    const img = x.createImageData(140,140);
    for(let i=0;i<img.data.length;i+=4){ const v = Math.random()*255|0; img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255; }
    x.putImageData(img,0,0);
    document.documentElement.style.setProperty('--grain', `url(${c.toDataURL()})`);
  }catch{}
}
let driftRAF = 0;
function startDrift(){
  const cv = document.getElementById('drift'); if(!cv) return;
  cancelAnimationFrame(driftRAF);
  const ctx = cv.getContext('2d'); const dpr = Math.min(2, devicePixelRatio||1);
  const size = () => { cv.width = cv.clientWidth*dpr; cv.height = cv.clientHeight*dpr; };
  size();
  const col = getComputedStyle(document.documentElement).getPropertyValue('--ac').trim() || '#a86d14';
  const P = Array.from({length:38}, () => ({x:Math.random(), y:Math.random(), r:1+Math.random()*2.6, v:.00025+Math.random()*.0007, w:Math.random()*6.28}));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const draw = () => {
    if(!document.body.contains(cv)) return;
    if(cv.width !== cv.clientWidth*dpr) size();
    ctx.clearRect(0,0,cv.width,cv.height); ctx.fillStyle = col;
    for(const p of P){
      if(!reduce){ p.y += p.v; p.w += .01; if(p.y > 1.05){ p.y = -.05; p.x = Math.random(); } }
      ctx.globalAlpha = .18 + .22*Math.sin(p.w)**2;
      ctx.beginPath(); ctx.ellipse((p.x + Math.sin(p.w)*.01)*cv.width, p.y*cv.height, p.r*dpr*1.6, p.r*dpr, p.w, 0, 6.283); ctx.fill();
    }
    if(!reduce) driftRAF = requestAnimationFrame(draw);
  };
  draw();
}

/* ---------- boot ---------- */
async function loadAll(){
  S.state = await Store.get('state');
  if(!S.state) return;
  [S.canon, S.facts, S.bible, S.guide, S.phone] = await Promise.all(['canon','facts','bible','guide','phone'].map(k=>Store.get(k)));
  S.canon = S.canon || {cast:{}, threads:[], locations:[]};
  S.facts = S.facts || {facts:[], next:1, events:[], summaries:{}};
  S.facts.summaries = S.facts.summaries || {};
  S.guide = S.guide || {eps:[]}; S.phone = S.phone || {threads:{}};
  if(S.bible) S.bible = normalizeBible(S.bible);
  if(['write','play','wrap','credits','phone'].includes(S.state.stage)){
    S.plan = await Store.get('plan-'+epKey());
    if(!S.plan){ S.state.stage = 'plan'; }
    else for(let k=1;k<=S.plan.acts.length;k++){ const a = await Store.get(`act-${epKey()}-${k}`); if(a) S.acts[k] = a; }
    if(S.state.stage==='play' && !S.acts[S.state.act]) S.state.stage = 'write';
  }
}
function watchRemote(){
  if(!S.db) return;
  try{
    S.db.doc(`data/users/${S.uid}/state`).onSnapshot(snap => {
      if(!snap.exists || snap.metadata.hasPendingWrites) return;
      const d = snap.data();
      if(S.state && (d.rev||0) > (S.state.rev||0) && d.updated !== S.state.updated){
        $('#banner').innerHTML = `<div class="banner">Cal's story moved forward on another device.<button data-do="reload" onclick="location.reload()">Reload</button></div>`;
      }
    }, () => {});
  }catch{}
}
async function boot(){
  makeGrain(); applySeason();
  const c = window.claude;
  if(c?.use){
    const [sample, db, user] = await Promise.all([c.use('sample'), c.use('db'), c.use('user')]);
    S.sample = sample;
    if(db && user){ const id = await user.id(); if(id){ S.db = db; S.uid = id; S.local = false; } }
  }
  try{ await loadAll(); }catch(e){ console.warn(e); toast("Couldn't load your save. Check your connection and reload."); }
  applySeason(); S.ready = true; render(); watchRemote();
  // Claude is only called after a click (Play, a choice, or "Bring in the writers"), never on load.
}
boot();
</script>
