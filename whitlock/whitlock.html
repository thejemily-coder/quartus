<style>
/* Layout: a single script-width reading column, like a script on a nightstand. Sticky masthead on top, tab bar (bottom on phones).
   The palette follows the in-story calendar: gold (Aug–Sep), ember (Oct–Nov), frost (Dec–Feb), thaw (Mar–May), tide (Jun–Jul). */
:root{
  --bg:#f4efe1; --sf:#fbf8ef; --ink:#2a2418; --mu:#6f6450; --ac:#a86d14; --ac2:#4f6b3a; --ln:#ddd3bb; --on:#fffaf0;
  --display:"Instrument Serif","Didot","Bodoni 72",Georgia,serif;
  --body:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --mono:"Courier Prime","Courier New",ui-monospace,monospace;
  --col:42rem;
}
:root[data-season="ember"]{--bg:#f2e9e4;--sf:#fbf5f1;--ink:#2b1714;--mu:#76564f;--ac:#8e2b23;--ac2:#b5611a;--ln:#e2d1c9;--on:#fff6f2}
:root[data-season="frost"]{--bg:#edf1f5;--sf:#f8fafc;--ink:#142130;--mu:#536779;--ac:#2c5a88;--ac2:#6d8199;--ln:#d2dce6;--on:#f5f9ff}
:root[data-season="thaw"]{--bg:#f0f2e8;--sf:#fafbf4;--ink:#1c2419;--mu:#5c6855;--ac:#47733a;--ac2:#8b5f99;--ln:#d8dcca;--on:#f8fff4}
:root[data-season="tide"]{--bg:#f5f0ea;--sf:#fffdf9;--ink:#1d2426;--mu:#5b686b;--ac:#c04a33;--ac2:#25797e;--ln:#e5dcd2;--on:#fff8f4}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#16130c;--sf:#201b12;--ink:#efe6d0;--mu:#a69878;--ac:#e1aa4a;--ac2:#93b277;--ln:#3a3224;--on:#1b160c;color-scheme:dark}
  :root[data-season="ember"]:not([data-theme="light"]){--bg:#170d0c;--sf:#22130f;--ink:#f2e1d9;--mu:#b38f85;--ac:#e0705c;--ac2:#e6a057;--ln:#40261f;--on:#1a0c0a}
  :root[data-season="frost"]:not([data-theme="light"]){--bg:#0b1119;--sf:#121b26;--ink:#e3ecf4;--mu:#8ea3b8;--ac:#86b8ea;--ac2:#a9bacd;--ln:#243344;--on:#0b1119}
  :root[data-season="thaw"]:not([data-theme="light"]){--bg:#10140e;--sf:#171d14;--ink:#e6ecdf;--mu:#9aa88f;--ac:#93c77c;--ac2:#cda6da;--ln:#2c3627;--on:#10140e}
  :root[data-season="tide"]:not([data-theme="light"]){--bg:#0d1415;--sf:#142022;--ink:#eaf1f1;--mu:#93a7a8;--ac:#f28d72;--ac2:#62c6c8;--ln:#243537;--on:#0d1415}
}
:root[data-theme="dark"]{--bg:#16130c;--sf:#201b12;--ink:#efe6d0;--mu:#a69878;--ac:#e1aa4a;--ac2:#93b277;--ln:#3a3224;--on:#1b160c;color-scheme:dark}
:root[data-theme="dark"][data-season="ember"]{--bg:#170d0c;--sf:#22130f;--ink:#f2e1d9;--mu:#b38f85;--ac:#e0705c;--ac2:#e6a057;--ln:#40261f;--on:#1a0c0a}
:root[data-theme="dark"][data-season="frost"]{--bg:#0b1119;--sf:#121b26;--ink:#e3ecf4;--mu:#8ea3b8;--ac:#86b8ea;--ac2:#a9bacd;--ln:#243344;--on:#0b1119}
:root[data-theme="dark"][data-season="thaw"]{--bg:#10140e;--sf:#171d14;--ink:#e6ecdf;--mu:#9aa88f;--ac:#93c77c;--ac2:#cda6da;--ln:#2c3627;--on:#10140e}
:root[data-theme="dark"][data-season="tide"]{--bg:#0d1415;--sf:#142022;--ink:#eaf1f1;--mu:#93a7a8;--ac:#f28d72;--ac2:#62c6c8;--ln:#243537;--on:#0d1415}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.62;transition:background-color .8s ease,color .8s ease;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:var(--grain,none);opacity:.07;mix-blend-mode:multiply;z-index:50}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body::before{mix-blend-mode:screen;opacity:.05}}
:root[data-theme="dark"] body::before{mix-blend-mode:screen;opacity:.05}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:4px}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.mast-in{max-width:64rem;margin:0 auto;padding-block:.6rem;padding-inline:16px;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.mark{font-family:var(--display);font-size:1.5rem;letter-spacing:.32em;text-transform:uppercase;line-height:1;padding-top:.15rem}
.now{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;color:var(--mu);text-transform:uppercase;display:flex;gap:.8rem;flex-wrap:wrap;min-width:0}
.now b{color:var(--ink);font-weight:700}
.tabs{margin-left:auto;display:flex;gap:.15rem}
.tab{border:0;background:none;padding:.35rem .6rem;border-radius:999px;font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);cursor:pointer}
.tab[aria-current="page"]{color:var(--on);background:var(--ink)}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]:hover{color:var(--on)}
.dot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:var(--ac);vertical-align:.08em;margin-left:.25rem}
.pill{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);display:flex;align-items:center;gap:.4rem}
.pill i{width:.45rem;height:.45rem;border-radius:50%;background:var(--ac);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (max-width:720px){
  .mast{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:var(--sf);border-top:1px solid var(--ln);padding:.4rem .25rem calc(.4rem + env(safe-area-inset-bottom,0px));z-index:30}
  .tab{padding:.45rem .35rem;font-size:.66rem}
  main{padding-bottom:5rem}
  .mark{font-size:1.25rem}
}

main{max-width:64rem;margin:0 auto;padding-inline:16px;padding-block:1.5rem 4rem}
.col{max-width:var(--col);margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.muted{color:var(--mu)}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--ink);background:var(--ink);color:var(--on);padding:.7rem 1.2rem;border-radius:999px;font-family:var(--mono);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:transform .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.warn{background:var(--ac);border-color:var(--ac);color:var(--on)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

/* title screen */
.hero{position:relative;min-height:min(78vh,44rem);display:grid;place-items:center;text-align:center;overflow:hidden;border-radius:4px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;display:grid;gap:1.2rem;justify-items:center;padding:2rem 0}
.hero h1{font-size:clamp(3.2rem,13vw,8.5rem);letter-spacing:.2em;line-height:.9;text-transform:uppercase;margin-right:-.2em}
.hero .sub{font-family:var(--display);font-style:italic;font-size:clamp(1.15rem,3vw,1.6rem);color:var(--mu);max-width:30rem}
.hero .crest{font-family:var(--mono);font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ac)}
.fine{font-size:.88rem;color:var(--mu);max-width:34rem;margin:0 auto}

/* script blocks */
.script{display:grid;gap:.95rem}
.slug{font-family:var(--mono);font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding-top:1.1rem;margin-top:.4rem;border-top:1px solid var(--ln)}
.slug.cut{color:var(--ac2)}

.a{margin:0}
.ln{display:grid;gap:.1rem;padding-left:clamp(.8rem,4vw,2.2rem)}
.ln .who{font-family:var(--mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ac)}
.ln .par{font-style:italic;color:var(--mu);font-size:.95rem}
.ln .say{margin:0}
.cardline{font-family:var(--mono);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mu);text-align:center;display:flex;align-items:center;gap:1rem}
.cardline::before,.cardline::after{content:"";flex:1;height:1px;background:var(--ln)}
.music{font-style:italic;color:var(--ac2);font-size:.95rem}
.music::before{content:"♪ ";font-style:normal}
.phone{border:1px solid var(--ln);background:var(--sf);border-radius:18px;padding:.8rem;display:grid;gap:.4rem;max-width:24rem;width:100%;justify-self:center}
.phone .th{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-align:center;padding-bottom:.3rem;border-bottom:1px solid var(--ln)}
.bub{max-width:82%;padding:.45rem .75rem;border-radius:16px;font-size:.95rem;line-height:1.4;background:var(--bg);justify-self:start;overflow-wrap:anywhere}
.bub.me{justify-self:end;background:var(--ac);color:var(--on)}
.bub small{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.chosen{font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);border-left:2px solid var(--ac);padding-left:.7rem}
.chosen b{color:var(--ink);text-transform:none;font-family:var(--body);font-size:1rem;letter-spacing:0;font-weight:600;display:block}
.remember{font-style:italic;color:var(--ac);font-size:.95rem;display:flex;gap:.5rem;align-items:center}
.remember::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--ac);flex:none}
.choices{display:grid;gap:.55rem;margin-top:.4rem}
.choice{text-align:left;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:.8rem 1rem;cursor:pointer;font-size:1rem;line-height:1.4;transition:border-color .15s ease,transform .15s ease;display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:baseline}
.choice:hover{border-color:var(--ac);transform:translateX(3px)}
.choice span{font-family:var(--mono);font-size:.74rem;color:var(--ac)}
.choice[disabled]{opacity:.5;transform:none;cursor:default}
.cont{justify-self:center;margin-top:.6rem}
.titlecard{margin:1.6rem 0;padding:3rem 1rem;text-align:center;background:var(--ink);color:var(--bg);border-radius:3px;display:grid;gap:.6rem;position:relative;overflow:hidden}
.titlecard .eyebrow{color:color-mix(in srgb,var(--bg) 65%,var(--ink))}
.titlecard h2{font-size:clamp(2.2rem,7vw,3.6rem);font-style:italic;line-height:1.05}
.titlecard .mk{font-family:var(--display);letter-spacing:.4em;text-transform:uppercase;font-size:.95rem}
.actcard{font-family:var(--display);font-size:1.6rem;font-style:italic;text-align:center;color:var(--mu);margin:1.6rem 0 .4rem}

/* panels */
.panel{border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:1.1rem 1.2rem}
.room{display:grid;gap:.7rem}
.agent{display:grid;grid-template-columns:1fr auto;gap:.15rem .8rem;align-items:baseline}
.agent .nm{font-weight:600}
.agent .md{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.agent .st{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);grid-row:span 2;align-self:center}
.agent .st.working{color:var(--ac)}
.agent .st.done{color:var(--ac2)}
.agent .st.error{color:var(--ac)}
.bar{grid-column:1/-1;height:3px;background:var(--ln);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .4s ease}
.prev{display:grid;gap:.6rem;font-family:var(--mono);font-size:.88rem;line-height:1.5}
.prev p{margin:0;padding-left:.8rem;border-left:2px solid var(--ln)}
.break{border:1px dashed var(--ac);border-radius:12px;padding:1.1rem 1.2rem;display:grid;gap:.6rem}
.break h3{font-size:1.5rem;font-style:italic}

/* cast */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,18rem),1fr));gap:1rem}
.person{border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:1rem;display:grid;gap:.6rem;align-content:start;min-width:0}
.person header{display:flex;gap:.8rem;align-items:center}
.person h3{font-size:1.45rem;line-height:1.1}
.person .role{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.person p{margin:0;font-size:.95rem}
.person ul{margin:0;padding-left:1.1rem;font-size:.88rem;color:var(--mu)}
.chip{display:inline-block;font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ln);border-radius:999px;padding:.1rem .5rem;color:var(--mu)}
.av{flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-style:italic;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35);font-size:1.15rem;
  background:radial-gradient(circle at 30% 26%,hsl(var(--h1) 80% 74% / .95),transparent 58%),conic-gradient(from var(--ang),hsl(var(--h2) 52% 42%),hsl(var(--h1) 58% 54%),hsl(var(--h3) 50% 36%),hsl(var(--h2) 52% 42%))}
.cal-card{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:start}
@media (max-width:520px){.cal-card{grid-template-columns:1fr}}

/* episodes */
.season{display:grid;gap:.5rem;margin-bottom:2rem}
.season h2{font-size:2rem}
.ep{border-top:1px solid var(--ln);padding:.8rem 0;display:grid;grid-template-columns:3.2rem 1fr;gap:.2rem .9rem}
.ep .n{font-family:var(--mono);font-size:.8rem;color:var(--mu);padding-top:.3rem}
.ep h3{font-size:1.4rem;font-style:italic}
.ep p{margin:.2rem 0 0;font-size:.95rem}
.ep details{grid-column:2}
.ep summary{cursor:pointer;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.linkbtn{border:0;background:none;padding:0;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* phone tab */
.threads{display:grid;grid-template-columns:minmax(0,16rem) minmax(0,1fr);gap:1rem}
@media (max-width:720px){.threads{grid-template-columns:1fr}}
.tlist{display:grid;gap:.3rem;align-content:start}
.titem{border:1px solid transparent;background:none;text-align:left;padding:.55rem .6rem;border-radius:10px;cursor:pointer;display:flex;gap:.6rem;align-items:center;min-width:0}
.titem[aria-current="true"]{border-color:var(--ln);background:var(--sf)}
.titem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.convo{display:grid;gap:.4rem;border:1px solid var(--ln);background:var(--sf);border-radius:18px;padding:1rem;align-content:start;min-height:12rem}
.epmark{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-align:center;margin:.5rem 0}

/* calendar */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.4rem}
@media (max-width:640px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sblock{border:1px solid var(--ln);border-radius:10px;padding:.6rem;display:grid;gap:.15rem;font-size:.85rem;min-width:0}
.sblock b{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase}
.sblock.cur{border-color:var(--ac);background:var(--sf);box-shadow:inset 0 -3px 0 var(--ac)}
.sblock.past{opacity:.55}
.events{display:grid;gap:.3rem;padding:0;margin:0;list-style:none}
.events li{display:grid;grid-template-columns:7.5rem 1fr;gap:.6rem;font-size:.95rem}
.events li span{font-family:var(--mono);font-size:.75rem;color:var(--mu);padding-top:.2rem;font-variant-numeric:tabular-nums}
.events li.done{color:var(--mu);text-decoration:line-through;text-decoration-color:var(--ln)}
.bigdate{font-family:var(--display);font-size:clamp(2.4rem,8vw,4rem);line-height:1}

.stack{display:grid;gap:1.4rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on);padding:.6rem 1rem;border-radius:999px;font-family:var(--mono);font-size:.75rem;letter-spacing:.05em;z-index:60;max-width:calc(100% - 32px)}
.banner{background:var(--ac);color:var(--on);padding:.6rem 16px;text-align:center;font-family:var(--mono);font-size:.78rem;display:flex;gap:.8rem;justify-content:center;align-items:center;flex-wrap:wrap}
.banner button{border:1px solid var(--on);background:none;color:var(--on);border-radius:999px;padding:.2rem .7rem;cursor:pointer}
.reader{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-inline:16px;padding-block:calc(1rem + env(safe-area-inset-top,0px)) 4rem}
.secret{border-left:3px solid var(--ac2);padding-left:1rem;display:grid;gap:.4rem}
.secret h3{font-size:1.5rem;font-style:italic}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.copyrow{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.copyrow code{font-family:var(--mono);font-size:.9rem;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:.55rem .8rem;flex:1;min-width:0;overflow-wrap:anywhere;user-select:all}
</style>

<script>
"use strict";
/* Whitlock player. Episodes are pre-written branching scripts published next to this page
   (episodes/index.json + episodes/sNNeNN.json). Every choice is recorded to the artifact's
   database so the writers' room can read it and write the next episode to follow from it. */

const YEARS = ['Freshman','Sophomore','Junior','Senior'];
const SEASON_TEMPLATE = [
  {sem:'Fall', label:'Late Aug – Sept'}, {sem:'Fall', label:'October'}, {sem:'Fall', label:'Nov – Finals'},
  {sem:'Spring', label:'Jan – Feb'}, {sem:'Spring', label:'Late Feb – Mar'}, {sem:'Spring', label:'Apr – May'},
  {sem:'Summer', label:'June – Aug'},
];
const EVENTS = {
  Fall:[['08-24','Move-in day'],['09-03','Rho rush week begins'],['09-08','Convocation on the Quad'],['10-17','Head of the Tamsin regatta'],['10-31','Halloween on Elm Row'],['11-25','Thanksgiving break'],['12-08','Reading period'],['12-12','Finals'],['12-20','Winter break']],
  Spring:[['01-19','Spring semester begins'],['02-07','Winter Carnival'],['02-14',"Valentine's Day"],['03-14','Spring break'],['04-18','Spring Fling'],['05-10','Senior Week'],['05-24','Commencement']],
  Summer:[['06-01','Summer in Alder Falls'],['07-04','Fourth of July on the lake'],['08-20','Last week of summer']],
};
const CAL_DEFAULT = "Charming screwup with his grandfather's name on the student center. Funny, magnetic, avoidant. Smart, doesn't try. Lies easily; runs when it's real.";
const ASK_TEXT = "Write the next Whitlock episode.";
const NUM = ['','One','Two','Three','Four'];

const S = {db:null, local:true, idx:null, eps:{}, prog:null, plays:{}, tab:'story', ready:false, phoneSel:null, loadErr:null};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const slug = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'x';
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(()=>t.hidden = true, 4200); }

/* ---------- storage: the artifact's database (follows the player across devices), else this browser ---------- */
const Store = {
  q:{},
  async get(path){
    if(S.db){
      try{ const s = await S.db.doc(path).get(); return s.exists ? structuredClone(s.data()) : null; }
      catch(e){ if(e?.code==='unavailable'){ await sleep(400+Math.random()*700); const s = await S.db.doc(path).get(); return s.exists ? structuredClone(s.data()) : null; } throw e; }
    }
    try{ const v = localStorage.getItem('whitlock:'+path); return v ? JSON.parse(v) : null; }catch{ return null; }
  },
  set(path, obj){
    const data = JSON.parse(JSON.stringify(obj));
    const p = (this.q[path] || Promise.resolve()).catch(()=>{}).then(async () => {
      if(S.db){
        try{ await S.db.doc(path).set(data); }
        catch(e){
          if(e?.code==='unavailable'){ await sleep(500+Math.random()*800); await S.db.doc(path).set(data); }
          else { toast("Couldn't save that choice. Check your connection; your next choice will try again."); throw e; }
        }
      } else { try{ localStorage.setItem('whitlock:'+path, JSON.stringify(data)); }catch{ toast('This browser blocked saving.'); } }
    });
    this.q[path] = p; return p;
  }
};
function saveProg(){ S.prog.rev = (S.prog.rev||0) + 1; S.prog.updated = Date.now(); return Store.set('progress/main', S.prog); }
function savePlay(id){ const p = S.plays[id]; p.updated = Date.now(); return Store.set('plays/'+id, p); }

/* ---------- episodes ---------- */
async function fetchJSON(url){ const r = await fetch(url, {cache:'no-store'}); if(!r.ok) throw new Error(url+' '+r.status); return r.json(); }
async function loadEp(id){
  if(S.eps[id]) return S.eps[id];
  const meta = S.idx.episodes.find(e=>e.id===id); if(!meta) return null;
  S.eps[id] = await fetchJSON('episodes/'+(meta.file || id+'.json'));
  return S.eps[id];
}
const inIndex = id => S.idx?.episodes.some(e=>e.id===id);
function nextId(id){
  const m = /^s(\d+)e(\d+)$/.exec(id); const s = +m[1], e = +m[2];
  return e >= 10 ? `s${pad(s+1)}e01` : `s${pad(s)}e${pad(e+1)}`;
}
const parseId = id => { const m = /^s(\d+)e(\d+)$/.exec(id||'s01e01'); return {season:+m[1], ep:+m[2]}; };
const labelOf = id => { const {season, ep} = parseId(id); return `S${season}E${ep}`; };

/* ---------- flags & conditions ---------- */
function cond(c){
  if(!c) return true;
  const f = S.prog.flags || {};
  return Object.entries(c).every(([k,v]) => (f[k] ?? false) === v);
}
const vis = bs => (bs||[]).filter(b => cond(b.if));

/* ---------- the play loop ---------- */
const ep = () => S.prog ? S.eps[S.prog.cur] : null;
const play = () => S.plays[S.prog.cur] || (S.plays[S.prog.cur] = {id:S.prog.cur, path:[], phone:{}, finished:false, started:Date.now()});
function resolve(id){
  const e = ep(); let guard = 0;
  while(e.nodes[id]?.route && guard++ < 25){
    const r = e.nodes[id].route.find(x => cond(x.if)) || e.nodes[id].route[e.nodes[id].route.length-1];
    id = r?.next;
  }
  return e.nodes[id] ? id : null;
}
function enter(id){
  const to = resolve(id);
  if(!to){ toast('This scene is missing from the episode file. Tell Claude what happened.'); return false; }
  play().path.push({n:to});
  S.prog.node = to;
  return true;
}
async function startEpisode(){
  S.prog.stage = 'play';
  if(!play().path.length) enter(ep().start);
  if(ep().date) S.prog.date = ep().date;
  applySeason();
  await Promise.all([savePlay(S.prog.cur), saveProg()]);
  window.scrollTo({top:0}); render();
}
function choose(nodeId, cid){
  const p = play(), last = p.path[p.path.length-1];
  if(S.prog.stage!=='play' || !last || last.n!==nodeId || last.c) return;
  const node = ep().nodes[nodeId], c = (node.choices||[]).find(x=>x.id===cid);
  if(!c) return;
  last.c = c.id; last.label = c.label; last.at = Date.now();
  if(c.set) Object.assign(S.prog.flags, c.set);
  if(c.remember) last.remember = c.remember;
  S.scrollTo = 'pick-'+(p.path.length-1);
  savePlay(S.prog.cur); saveProg(); render();
}
async function cont(){
  const p = play(), last = p.path[p.path.length-1], node = ep().nodes[last.n];
  if(node.choices && !last.c) return;
  if(node.end){ S.prog.stage = 'credits'; await saveProg(); window.scrollTo({top:0}); render(); return; }
  const c = last.c ? node.choices.find(x=>x.id===last.c) : null;
  const nx = c?.next || node.next;
  if(!nx || !enter(nx)){ S.prog.stage = 'credits'; await saveProg(); render(); return; }
  S.scrollTo = 'node-'+(p.path.length-1);
  savePlay(S.prog.cur); saveProg(); render();
}
function reply(i, oid){
  const t = ep().phone?.[i]; const p = play();
  if(!t || p.phone[i]) return;
  const o = t.options.find(x=>x.id===oid); if(!o) return;
  p.phone[i] = {id:o.id, text:o.text, from:t.from||slug(t.name), name:t.name};
  savePlay(S.prog.cur); render();
}
async function finishEpisode(){
  const p = play(); p.finished = true; p.finishedAt = Date.now();
  if(ep()?.dateEnd || ep()?.date) S.prog.date = ep().dateEnd || ep().date;
  S.prog.done = [...new Set([...(S.prog.done||[]), S.prog.cur])];
  await savePlay(S.prog.cur);
  const nx = nextId(S.prog.cur);
  S.prog.cur = nx; S.prog.node = null;
  S.prog.stage = inIndex(nx) ? 'intro' : 'waiting';
  if(inIndex(nx)) await loadEp(nx).catch(()=>null);
  await saveProg(); window.scrollTo({top:0}); render();
}

/* ---------- derived views ---------- */
function castNow(){
  const cur = ep() || lastPlayedEp(); if(!cur) return [];
  const p = S.plays[cur.id];
  const seenNodes = new Set((p?.path||[]).map(x=>x.n));
  const finished = p?.finished;
  const list = (cur.cast||[]).map(c=>({...c}));
  for(const c of cur.castNew||[]) if(finished || seenNodes.has(c.node)) { const i = list.findIndex(x=>x.id===c.id); if(i>=0) list[i] = {...list[i], ...c}; else list.push({...c, firstSeen:labelOf(cur.id)}); }
  return list;
}
function lastPlayedEp(){ const d = S.prog?.done||[]; return d.length ? S.eps[d[d.length-1]] : null; }
function curDate(){ return S.prog?.date || ep()?.date || '2026-08-24'; }
function seasonInfo(n){ const yi = Math.floor((n-1)/7), t = SEASON_TEMPLATE[(n-1)%7]; return {...t, yi, year: 2026 + yi + ((n-1)%7 >= 3 ? 1 : 0)}; }
function paletteFor(iso){
  const m = Number(String(iso||'').slice(5,7)) || 8;
  if(m===8||m===9) return 'gold'; if(m===10||m===11) return 'ember'; if(m===12||m<=2) return 'frost'; if(m<=5) return 'thaw'; return 'tide';
}
function applySeason(){ document.documentElement.dataset.season = paletteFor(curDate()); }
function fmtDate(iso, opt){ try{ return new Date(iso+'T12:00:00').toLocaleDateString('en-US', opt||{weekday:'short',month:'short',day:'numeric'}); }catch{ return iso; } }

/* ================================================================
   RENDERING
   ================================================================ */
function avatar(id, name, size=44){
  let h = 2166136261; for(const ch of String(id)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const h1 = h % 360, h2 = (h1 + 35 + (h>>9)%150) % 360, h3 = (h2 + 60 + (h>>17)%90) % 360, ang = (h>>5) % 360;
  const ini = String(name||id).replace(/^(Prof\.|Dr\.)\s*/,'').split(/\s+/).map(w=>w[0]).filter(Boolean).slice(0,2).join('').toUpperCase();
  return `<span class="av" aria-hidden="true" style="--h1:${h1};--h2:${h2};--h3:${h3};--ang:${ang}deg;width:${size}px;height:${size}px;font-size:${size*.42}px">${esc(ini)}</span>`;
}
function nameOf(id, e){ if(!id) return ''; if(id==='cal') return 'Cal'; const c = [...(e?.cast||[]), ...(e?.castNew||[])].find(x=>x.id===id); return c ? c.name.replace(/^Prof\.\s*/,'').split(' ')[0] : String(id); }
function blockHTML(b, e){
  switch(b.t){
    case 'slug': return `<div class="slug${b.cut?' cut':''}">${esc(b.text)}</div>`;
    case 'a': return `<p class="a">${esc(b.text)}</p>`;
    case 'line': return `<div class="ln"><span class="who">${esc(b.name || nameOf(b.who, e))}</span>${b.paren?`<span class="par">${esc(b.paren)}</span>`:''}<p class="say">${esc(b.text)}</p></div>`;
    case 'texts': return `<div class="phone" role="group" aria-label="Text messages"><div class="th">${esc(b.thread)}</div>${(b.msgs||[]).map(m=>`<div class="bub${m.from==='cal'?' me':''}">${m.from!=='cal' && (b.msgs||[]).some(x=>x.from!=='cal' && x.from!==m.from) ? `<small>${esc(nameOf(m.from, e))}</small>` : ''}${esc(m.text)}</div>`).join('')}</div>`;
    case 'music': return `<div class="music">${esc(b.song)} — ${esc(b.artist)}</div>`;
    case 'card': return `<div class="cardline">${esc(b.text)}</div>`;
    default: return b.text ? `<p class="a">${esc(b.text)}</p>` : '';
  }
}
const blocksHTML = (bs, e) => vis(bs).map(b=>blockHTML(b, e)).join('');

function renderNow(){
  const n = $('#now');
  if(!S.prog){ n.innerHTML = `<span>Whitlock University · Alder Falls, Mass.</span>`; return; }
  const {season, ep:e} = parseId(S.prog.cur);
  const t = ep() && ['play','credits','phone'].includes(S.prog.stage) ? ` · <b>“${esc(ep().title)}”</b>` : '';
  n.innerHTML = `<span><b>S${season} · E${e}</b>${t}</span><span>${esc(fmtDate(curDate()))}</span>`;
}
function render(){
  renderNow();
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.tab===S.tab ? 'page' : 'false'));
  if(!S.ready) return;
  const m = $('#main');
  m.innerHTML = S.tab==='story' ? storyHTML() : S.tab==='cast' ? castHTML() : S.tab==='episodes' ? episodesHTML()
    : S.tab==='phone' ? phoneHTML() : S.tab==='calendar' ? calendarHTML() : extrasHTML();
  if($('#drift')) startDrift();
  if(S.scrollTo){ const el = document.getElementById(S.scrollTo); S.scrollTo = null; if(el) requestAnimationFrame(()=>el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'})); }
}

function askBox(){
  return `<div class="panel stack"><div><div class="eyebrow">To get the next episode</div><p class="a">Paste this to Claude. The writers' room reads the choices you made and writes what happens next.</p></div>
    <div class="copyrow"><code id="asktext">${esc(ASK_TEXT)}</code><button class="btn ghost" data-do="copyask">Copy</button></div></div>`;
}
function storyHTML(){
  if(S.loadErr) return `<div class="col stack" style="padding-top:2rem"><h2 style="font-size:2rem;font-style:italic">The episodes didn't load.</h2><p class="a">${esc(S.loadErr)}</p><div><button class="btn" data-do="reload">Try again</button></div></div>`;
  const st = S.prog.stage;
  if(st==='waiting') return waitingHTML();
  if(st==='intro') return introHTML();
  if(st==='credits') return creditsHTML();
  if(st==='phone') return interludeHTML();
  return playHTML();
}
function introHTML(){
  const e = ep(); const {season, ep:n} = parseId(S.prog.cur);
  if(!e) return waitingHTML();
  const pilot = season===1 && n===1;
  const sTitle = S.idx.seasons?.[season]?.title;
  if(pilot) return `<section class="hero"><canvas id="drift" aria-hidden="true"></canvas><div class="hero-in">
    <div class="crest">Whitlock University · Est. 1791</div><h1>Whitlock</h1>
    <p class="sub">Cal Whitaker's name is on the building. That's the problem.</p>
    <div class="row" style="justify-content:center"><button class="btn" data-do="start">Play the pilot</button></div>
    <p class="fine">A choice-driven college drama, played one episode at a time. Every choice is saved for good, ${S.local ? 'in this browser' : 'to your claude.ai account, so you can pick up on any device'}. The writers read your choices before they write the next episode.</p>
  </div></section>`;
  return `<div class="col stack">
    ${(e.previously||[]).length ? `<div class="stack"><div class="eyebrow">Previously on</div><h2 style="font-size:2.4rem;letter-spacing:.2em;text-transform:uppercase">Whitlock</h2><div class="prev">${e.previously.map(p=>`<p>${esc(p)}</p>`).join('')}</div></div>` : ''}
    <div class="titlecard"><div class="mk">Whitlock</div><div class="eyebrow">Season ${season} · Episode ${n}${sTitle?` · ${esc(sTitle)}`:''}</div><h2>${esc(e.title)}</h2></div>
    <div class="row" style="justify-content:center"><button class="btn" data-do="start">Play episode</button></div>
    <p class="fine" style="text-align:center">${esc(fmtDate(e.date,{weekday:'long',month:'long',day:'numeric'}))} · ${esc(YEARS[seasonInfo(season).yi])} year</p></div>`;
}
function waitingHTML(){
  const {season, ep:n} = parseId(S.prog.cur);
  const newSeason = n===1 && season>1;
  return `<div class="col stack">
    <div class="titlecard"><div class="mk">Whitlock</div><div class="eyebrow">${newSeason ? `Season ${season-1} has ended` : `Season ${season} · Episode ${n}`}</div><h2>${newSeason ? `Season ${season} is in the writers' room` : 'In the writers\' room'}</h2></div>
    <p class="a">Your choices from ${esc(labelOf((S.prog.done||[]).slice(-1)[0]||''))} are saved. The next episode will follow from them, including the texts Cal sent.</p>
    ${askBox()}</div>`;
}
function playHTML(){
  const e = ep(), p = play(), out = [`<div class="col script">`];
  let act = 0;
  p.path.forEach((entry, i) => {
    const node = e.nodes[entry.n]; if(!node) return;
    if(node.act && node.act!==act){ if(i>0) out.push(`<div class="actcard">Act ${NUM[node.act]||node.act}</div>`); act = node.act; }
    out.push(`<div id="node-${i}"></div>`);
    out.push(blocksHTML(node.blocks, e));
    const last = i === p.path.length-1;
    if(entry.c){
      const c = node.choices.find(x=>x.id===entry.c) || {label:entry.label, reaction:[]};
      out.push(`<div class="chosen" id="pick-${i}">Cal chose<b>${esc(c.label)}</b></div>`);
      out.push(blocksHTML(c.reaction, e));
      if(c.remember) out.push(`<div class="remember">${esc(c.remember)}</div>`);
    } else if(last && node.choices){
      const cs = node.choices.filter(c=>cond(c.if));
      out.push(`<div class="choices" role="group" aria-label="What does Cal do?">${cs.map((c,j)=>`<button class="choice" data-pick="${esc(entry.n)}|${esc(c.id)}"><span>${String.fromCharCode(65+j)}</span>${esc(c.label)}</button>`).join('')}</div>`);
    }
    if(entry.n===e.titleAfter && (entry.c || !last || !node.choices)) out.push(`<div class="titlecard"><div class="mk">Whitlock</div><div class="eyebrow">Season ${e.season} · Episode ${e.ep}</div><h2>${esc(e.title)}</h2></div>`);
    if(last && (entry.c || !node.choices)) out.push(`<button class="btn cont" data-do="cont">${node.end ? 'End of episode' : 'Continue'}</button>`);
  });
  out.push(`</div>`);
  return out.join('');
}
function creditsHTML(){
  const e = ep();
  return `<div class="col stack">
    <div class="titlecard"><div class="mk">Whitlock</div><div class="eyebrow">${esc(labelOf(e.id))} · End of episode</div><h2>${esc(e.title)}</h2>${e.music?.song?`<div class="eyebrow">♪ ${esc(e.music.song)} — ${esc(e.music.artist)}</div>`:''}</div>
    ${e.ep===10 ? `<div class="cardline">Season ${e.season} will return</div>` : ''}
    <p class="a" style="text-align:center">${(e.phone||[]).length ? "Cal's phone is buzzing." : 'Your choices are saved.'}</p>
    <div class="row" style="justify-content:center">${(e.phone||[]).length ? `<button class="btn" data-do="tophone">Check Cal's phone</button>` : `<button class="btn" data-do="finish">Finish the episode</button>`}</div></div>`;
}
function interludeHTML(){
  const e = ep(), p = play(), it = e.phone || [];
  const done = it.every((_,i)=>p.phone[i]);
  return `<div class="col stack"><div><div class="eyebrow">After ${esc(labelOf(e.id))}</div><h2 style="font-size:2.2rem;font-style:italic">${it.length} new message${it.length===1?'':'s'}</h2><p class="muted">Cal's replies carry into the next episode.</p></div>
    ${it.map((t,i)=>`<div class="convo">
      <div class="th" style="display:flex;gap:.6rem;align-items:center;font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)">${avatar(t.from||t.name, t.name, 28)}${esc(t.name)}</div>
      ${(t.msgs||[]).map(m=>`<div class="bub">${esc(m)}</div>`).join('')}
      ${p.phone[i] ? `<div class="bub me">${esc(p.phone[i].text)}</div>` :
        `<div class="choices">${t.options.map((o,j)=>`<button class="choice" data-reply="${i}|${esc(o.id)}"><span>${String.fromCharCode(65+j)}</span>${esc(o.text)}</button>`).join('')}</div>`}
    </div>`).join('')}
    <div class="row" style="justify-content:center"><button class="btn" data-do="finish" ${done?'':'disabled'}>${done?'Put the phone down':'Reply to everyone first'}</button></div></div>`;
}

function castHTML(){
  const people = castNow();
  const e = ep() || lastPlayedEp();
  const {season} = parseId(S.prog.cur);
  return `<div class="stack">
    <div class="panel cal-card">${avatar('cal','Cal Whitaker',72)}<div><div class="eyebrow">Our protagonist</div><h2 style="font-size:2rem">Cal Whitaker</h2><div class="role" style="font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)">${esc(YEARS[seasonInfo(season).yi])} · Lowell House · Legacy</div><p class="a" style="margin-top:.5rem">${esc(e?.calNow || CAL_DEFAULT)}</p></div></div>
    ${people.length ? `<div class="grid">${people.map(c=>`<article class="person"><header>${avatar(c.id,c.name)}<div><h3>${esc(c.name)}</h3><div class="role">${esc(c.role||'')}</div></div></header>
      ${c.metCal===false ? `<div><span class="chip">Cal hasn't met them</span></div>` : ''}
      <p>${esc(c.impression || '')}</p>${c.firstSeen?`<div class="role">First seen ${esc(c.firstSeen)}</div>`:''}</article>`).join('')}</div>`
      : `<p class="muted">The cast appears here as they turn up on screen.</p>`}</div>`;
}
function episodesHTML(){
  const shown = S.idx.episodes.filter(x => (S.prog.done||[]).includes(x.id) || x.id===S.prog.cur);
  if(!shown.length) return emptyHTML('No episodes yet', 'Episodes appear here as you play them.');
  const by = {}; shown.forEach(x => (by[x.season] = by[x.season] || []).push(x));
  return Object.entries(by).map(([s, list]) => `<section class="season col"><div class="eyebrow">${esc(YEARS[seasonInfo(+s).yi])} year · ${esc(seasonInfo(+s).sem)}</div><h2>Season ${s}${S.idx.seasons?.[s]?.title?`: <i>${esc(S.idx.seasons[s].title)}</i>`:''}</h2>
    ${list.map(x => { const done = (S.prog.done||[]).includes(x.id); return `<div class="ep"><div class="n">E${x.ep}</div><div><h3>${esc(x.title)}</h3><p>${esc(x.logline||'')}</p></div>
      ${done ? `<details><summary>Recap</summary><p>${esc(x.recap || 'The recap arrives with the next episode.')}</p><button class="linkbtn" data-read="${esc(x.id)}">Read the episode as you played it</button></details>` : `<div style="grid-column:2"><span class="chip">${S.prog.stage==='play'?'Now playing':'Up next'}</span></div>`}</div>`; }).join('')}</section>`).join('');
}
function threads(){
  const th = {};
  const add = (name, m, epId) => { const k = slug(name); (th[k] = th[k] || {name, msgs:[], last:0}).msgs.push({...m, ep:labelOf(epId)}); th[k].last++; };
  const ids = [...(S.prog.done||[])]; if(S.plays[S.prog.cur]) ids.push(S.prog.cur);
  for(const id of ids){
    const e = S.eps[id], p = S.plays[id]; if(!e || !p) continue;
    for(const entry of p.path){
      const node = e.nodes[entry.n]; if(!node) continue;
      const c = entry.c ? node.choices.find(x=>x.id===entry.c) : null;
      for(const b of [...vis(node.blocks), ...vis(c?.reaction)]) if(b.t==='texts' && (b.onCal || (b.msgs||[]).some(m=>m.from==='cal')))
        for(const m of b.msgs||[]) add(b.thread||'Unknown', {me:m.from==='cal', text:m.text}, id);
    }
    (e.phone||[]).forEach((t,i) => { if(!p.phone[i]) return; (t.msgs||[]).forEach(m => add(t.name, {me:false, text:m}, id)); add(t.name, {me:true, text:p.phone[i].text}, id); });
  }
  return th;
}
function phoneHTML(){
  const th = Object.entries(threads()).sort((a,b)=>b[1].last-a[1].last);
  if(!th.length) return emptyHTML('No messages', 'Texts Cal sends and receives in the story land here.');
  const sel = th.some(([k])=>k===S.phoneSel) ? S.phoneSel : th[0][0];
  const t = th.find(([k])=>k===sel)[1];
  let lastEp = '';
  return `<div class="threads"><div class="tlist">${th.map(([k,v])=>`<button class="titem" data-thread="${esc(k)}" aria-current="${k===sel}">${avatar(k,v.name,32)}<span>${esc(v.name)}</span></button>`).join('')}</div>
    <div class="convo">${t.msgs.map(m=>{ const mark = m.ep!==lastEp ? `<div class="epmark">${esc(m.ep)}</div>` : ''; lastEp = m.ep; return mark + `<div class="bub${m.me?' me':''}">${esc(m.text)}</div>`; }).join('')}</div></div>`;
}
function calendarHTML(){
  const {season, ep:n} = parseId(S.prog.cur), w = seasonInfo(season), base = w.yi*7, date = curDate();
  const ev = EVENTS[w.sem].map(([md, name]) => ({iso:`${w.year}-${md}`, name})).map(x => ({...x, done: x.iso < date}));
  const places = [...new Set([...(S.prog.done||[]), S.prog.stage==='play'?S.prog.cur:null].filter(Boolean).flatMap(id => S.eps[id]?.places || []))];
  return `<div class="stack col" style="max-width:56rem">
    <div><div class="eyebrow">${esc(YEARS[w.yi])} year · ${esc(w.sem)}${w.sem==='Summer'?'':' semester'}</div><div class="bigdate">${esc(fmtDate(date,{weekday:'long',month:'long',day:'numeric'}))}</div><p class="muted">Season ${season}${S.idx.seasons?.[season]?.title?` · ${esc(S.idx.seasons[season].title)}`:''} · Episode ${n} of 10</p></div>
    <div class="strip">${SEASON_TEMPLATE.map((t,i)=>{ const k = base+i+1; return `<div class="sblock ${k===season?'cur':k<season?'past':''}"><b>S${k}</b><span>${esc(t.sem)}</span><span class="muted">${esc(t.label)}</span></div>`; }).join('')}</div>
    <div class="panel"><div class="eyebrow" style="margin-bottom:.6rem">This ${w.sem==='Summer'?'summer':'semester'}</div><ul class="events">${ev.map(x=>`<li class="${x.done?'done':''}"><span>${esc(fmtDate(x.iso,{month:'short',day:'numeric'}))}</span>${esc(x.name)}</li>`).join('')}</ul></div>
    <div class="panel"><div class="eyebrow" style="margin-bottom:.6rem">Places Cal has been</div><p class="a">${places.length ? places.map(esc).join(' · ') : '<span class="muted">Places appear as the story visits them.</span>'}</p></div></div>`;
}
function extrasHTML(){
  const un = S.idx.unlocked || [];
  return `<div class="stack col">
    <section class="stack"><div><div class="eyebrow">Unlocked secrets</div><h2 style="font-size:2rem">Behind the scenes</h2></div>
      ${un.length ? un.map(a=>`<div class="secret"><div class="eyebrow">${esc(a.scope||'')} arc · closed ${esc(a.closedAt||'')}</div><h3>${esc(a.title)}</h3><p class="a">${esc(a.reveal)}</p>${a.clues?.length?`<div class="eyebrow">Clues you saw</div><ul>${a.clues.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}</div>`).join('')
        : `<p class="muted">Each hidden storyline unlocks here after it resolves on screen, along with the clues that pointed to it. Nothing has resolved yet.</p>`}</section>
    ${askBox()}
    <section class="panel"><div class="eyebrow" style="margin-bottom:.6rem">The writers' room</div>
      <div class="room">${[['Showrunner','Opus','Keeps the secret bible and season plans; turns your choices into where the arcs go next'],['Head writer','Opus','Writes each branching episode in full'],['Continuity editor','Sonnet','Checks every branch against the record of who knows what'],['Script coordinator','Sonnet','Logs what you chose and what it changed']].map(([n,m,j])=>`<div class="agent"><span class="nm">${n}</span><span class="st done">${m}</span><span class="md">${j}</span></div>`).join('')}</div>
      <p class="fine" style="margin:.8rem 0 0">Episodes are written ahead of time and play without waiting. The writers work between episodes, not while you play.</p></section>
    <section class="panel stack"><div><div class="eyebrow">Saving</div><p class="a">${S.local ? 'Choices are saved in this browser only, because this view has no account storage. If the writers can\'t see your choices, copy them below and paste them to Claude.' : 'Every choice saves to your claude.ai account as you make it, and the writers read it from there.'}</p></div>
      <div><button class="btn ghost" data-do="export">Copy my choices</button></div></section></div>`;
}
function emptyHTML(t, s){ return `<div class="col stack" style="padding-top:2rem"><h2 style="font-size:2.2rem;font-style:italic">${esc(t)}</h2><p class="muted">${esc(s)}</p></div>`; }

async function openReader(id){
  const r = $('#reader'); r.hidden = false; r.innerHTML = `<div class="col"><p class="muted">Loading…</p></div>`;
  const e = await loadEp(id).catch(()=>null), p = S.plays[id];
  const out = [];
  if(e && p){
    let act = 0;
    p.path.forEach((entry,i) => {
      const node = e.nodes[entry.n]; if(!node) return;
      if(node.act && node.act!==act){ if(i>0) out.push(`<div class="actcard">Act ${NUM[node.act]||node.act}</div>`); act = node.act; }
      out.push(blocksHTML(node.blocks, e));
      if(entry.c){ const c = node.choices.find(x=>x.id===entry.c) || {label:entry.label, reaction:[]}; out.push(`<div class="chosen">Cal chose<b>${esc(c.label)}</b></div>`, blocksHTML(c.reaction, e)); if(c.remember) out.push(`<div class="remember">${esc(c.remember)}</div>`); }
      if(entry.n===e.titleAfter) out.push(`<div class="titlecard"><div class="mk">Whitlock</div><h2>${esc(e.title)}</h2></div>`);
    });
  }
  r.innerHTML = `<div class="col script"><div class="row" style="justify-content:space-between"><div class="eyebrow">${esc(labelOf(id))} · as you played it</div><button class="btn ghost" data-do="closereader">Close</button></div>${out.join('') || '<p class="muted">This episode is unavailable.</p>'}<button class="btn ghost cont" data-do="closereader">Close</button></div>`;
  r.scrollTop = 0;
}
async function copyText(text, fallbackEl){
  try{ await navigator.clipboard.writeText(text); toast('Copied.'); }
  catch{ if(fallbackEl){ const rg = document.createRange(); rg.selectNodeContents(fallbackEl); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); toast('Selected. Copy it with your keyboard or menu.'); } }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-do],[data-pick],[data-reply],[data-thread],[data-read]');
  if(!t) return;
  if(t.dataset.tab){ S.tab = t.dataset.tab; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.pick){ const [n,c] = t.dataset.pick.split('|'); choose(n, c); return; }
  if(t.dataset.reply){ const [i,o] = t.dataset.reply.split('|'); reply(+i, o); return; }
  if(t.dataset.thread){ S.phoneSel = t.dataset.thread; render(); return; }
  if(t.dataset.read){ openReader(t.dataset.read); return; }
  const d = t.dataset.do;
  if(d==='start') startEpisode();
  else if(d==='cont'){ t.disabled = true; cont(); }
  else if(d==='tophone'){ S.prog.stage = 'phone'; saveProg(); window.scrollTo({top:0}); render(); }
  else if(d==='finish'){ t.disabled = true; finishEpisode(); }
  else if(d==='copyask') copyText(ASK_TEXT, $('#asktext'));
  else if(d==='export'){ const data = JSON.stringify({progress:S.prog, plays:S.plays}); const box = document.createElement('pre'); box.textContent = data; box.style.cssText='white-space:pre-wrap;word-break:break-all;font-size:.7rem;max-height:8rem;overflow:auto'; t.after(box); copyText('Whitlock choices: ' + data, box); }
  else if(d==='closereader') $('#reader').hidden = true;
  else if(d==='reload') location.reload();
});

/* ---------- ambience ---------- */
function makeGrain(){
  try{
    const c = document.createElement('canvas'); c.width = c.height = 140; const x = c.getContext('2d');
    const img = x.createImageData(140,140);
    for(let i=0;i<img.data.length;i+=4){ const v = Math.random()*255|0; img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255; }
    x.putImageData(img,0,0); document.documentElement.style.setProperty('--grain', `url(${c.toDataURL()})`);
  }catch{}
}
let driftRAF = 0;
function startDrift(){
  const cv = document.getElementById('drift'); if(!cv) return;
  cancelAnimationFrame(driftRAF);
  const ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio||1);
  const size = () => { cv.width = cv.clientWidth*dpr; cv.height = cv.clientHeight*dpr; }; size();
  const col = getComputedStyle(document.documentElement).getPropertyValue('--ac').trim() || '#a86d14';
  const P = Array.from({length:38}, () => ({x:Math.random(), y:Math.random(), r:1+Math.random()*2.6, v:.00025+Math.random()*.0007, w:Math.random()*6.28}));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const draw = () => {
    if(!document.body.contains(cv)) return;
    if(cv.width !== cv.clientWidth*dpr) size();
    ctx.clearRect(0,0,cv.width,cv.height); ctx.fillStyle = col;
    for(const p of P){
      if(!reduce){ p.y += p.v; p.w += .01; if(p.y > 1.05){ p.y = -.05; p.x = Math.random(); } }
      ctx.globalAlpha = .18 + .22*Math.sin(p.w)**2;
      ctx.beginPath(); ctx.ellipse((p.x + Math.sin(p.w)*.01)*cv.width, p.y*cv.height, p.r*dpr*1.6, p.r*dpr, p.w, 0, 6.283); ctx.fill();
    }
    if(!reduce) driftRAF = requestAnimationFrame(draw);
  };
  draw();
}

/* ---------- boot ---------- */
function watchRemote(){
  if(!S.db) return;
  try{
    S.db.doc('progress/main').onSnapshot(snap => {
      if(!snap.exists || snap.metadata.hasPendingWrites) return;
      const d = snap.data();
      if(S.prog && (d.rev||0) > (S.prog.rev||0)) $('#banner').innerHTML = `<div class="banner">Cal's story moved forward on another device.<button data-do="reload">Reload</button></div>`;
    }, () => {});
  }catch{}
}
async function boot(){
  makeGrain(); applySeason();
  const c = window.claude;
  if(c?.use){ const db = await c.use('db'); if(db){ S.db = db; S.local = false; } }
  try{
    S.idx = await fetchJSON('episodes/index.json');
    S.prog = await Store.get('progress/main');
    if(!S.prog) S.prog = {cur:S.idx.episodes[0]?.id || 's01e01', node:null, stage:'intro', flags:{}, done:[], rev:0, created:Date.now()};
    S.prog.flags = S.prog.flags || {}; S.prog.done = S.prog.done || [];
    if(S.prog.stage==='waiting' && inIndex(S.prog.cur)) S.prog.stage = 'intro';
    const ids = [...S.prog.done, S.prog.cur].filter(inIndex);
    await Promise.all(ids.map(id => loadEp(id)));
    const plays = await Promise.all(ids.map(id => Store.get('plays/'+id)));
    ids.forEach((id,i) => { if(plays[i]) S.plays[id] = plays[i]; });
    if(['play','credits','phone'].includes(S.prog.stage) && !ep()) S.prog.stage = 'intro';
    if(S.prog.stage==='intro' && !inIndex(S.prog.cur)) S.prog.stage = 'waiting';
  }catch(e){ console.warn(e); S.loadErr = "Check your connection and try again. If it keeps happening, tell Claude the episode files didn't load."; S.prog = S.prog || {cur:'s01e01', stage:'intro', flags:{}, done:[]}; }
  applySeason(); S.ready = true; render(); watchRemote();
}
boot();
</script>
