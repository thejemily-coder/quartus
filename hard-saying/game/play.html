holic Mass: arms crossed like a Baptist, came back from the blessing pink and quiet. Programmed herself into my phone. (Hoodie status: hers.) Pi Lam’s barn party: carried upstairs by her new sisters, glorious and wrecked. Called Lena a mother over the banister. Said sorry at the sign of peace, at her second Mass."},{"kind":"person","id":"kevin","title":"Kevin Tran","text":"Kevin Tran. Goes to daily Mass, saves you a seat with a Bible. Has a sister, Tina, in dental school, who flossed in the womb. Lies to his mom about orgo in Vietnamese. Drives his mother’s Odyssey at sixty-five, not sixty-six. His dad has two nail-salon supply stores in San Jose and has never had a Labor Day. Brought six pairs of gloves to a beach cleanup. Mouthed every word of Joey’s first reading from the second pew. Somebody coached Joey; I can guess who."}],"choices":[{"text":"Wave back at Becca.","tag":"Sincerity","set":{"e6_mass":"wave","rel.becca.warmth":"+1","trait.sincerity":"+1"},"response":["He lifts a hand and waves back, a real wave, and Becca beams like he’s answered something. She points at him over the heads of the people filing out and mouths a word across the aisle. It’s probably *Friday*. The question mark is still on her face when the crowd takes her out the door.","Beside him Lena is very busy finding the sleeve of her own cardigan on Laney."],"goto":"s13b"},{"text":"Tell Laney she did beautifully, in Mrs. Fitch’s bulletin voice.","tag":"Wit","set":{"e6_mass":"laney","rel.laney.warmth":"+1","trait.wit":"+1","rel.laney.trust":"+1"},"response":["He leans down to her ear and gives it the full Mrs. Fitch, every word read off an invisible slip: “You are doing beautifully.” Laney goes pink to the hairline. “Sugar,” she says, “I *know*.”","On her other side, Lena keeps her eyes on the recessional."],"goto":"s13b"},{"text":"Stay kneeling after.","tag":"Control","set":{"e6_mass":"kneel","soul.grace":"+1","trait.control":"+1"},"response":["He stays down on the kneeler while the church empties around him, hoodies and backpacks, the candles guttering in the draft from the doors. The last guitar chord rings in the hull and quits. He prays the way he always has, short and plain, to Someone in the next room: *Nonna. Danny. Gina. Her. Me, if there’s any left over.*","When he gets up and goes out, Lena and Laney are under the olive tree in the dark, Laney’s head on Lena’s shoulder, waiting for him."],"goto":"s13b"}]},"s13b":{"slug":"SUNDAY · 11:48 PM · DELGADO HALL, ROOM 412","music":"The Avett Brothers — “Murder in the City”","body":["Theo is asleep on top of his comforter in his clothes for the second time today. On his MacBook a clip from tonight’s Emmys plays over and over with the sound off — Neil Patrick Harris in a tux, arms wide, mouthing a joke the room can’t hear.","Jack sits at the desk with Hale’s Williams open under the lamp. Beside one of Hale’s pencilled *No.*s he has made his first mark in the book, in pencil, a quarter inch below it: *No.* Now the page disagrees with Bernard Williams twice. Danny’s letter goes inside the Hopkins, which comes off the desk and goes into the milk crate under the bed to wait for October. Then a sheet of lined paper.",{"type":"doc","title":"Lined paper, Delgado 412","if":"e6_letter==\"read\" && e6_gina_name || e6_letter==\"her\" && e6_gina_name","text":"D —\nGina said your name to the girl. The girl looked away first. Gina wants that on the record.\nThe veil girl says you’re welcome.\nGina knows her name now. Lena. Don’t tell Nonna. She likes ‘the nun.’\nOhio State 38–0. Dad yelled at the TV in a good way. (Ma’s words.)\nThe Pacific smells like salt and kelp and money. Tell Reggie.\nI’ll send the Hopkins. Ma’s right, it’s poems. Read it anyway.\n—the Professor"},{"type":"doc","title":"Lined paper, Delgado 412","if":"e6_letter==\"read\" && !e6_gina_name || e6_letter==\"her\" && !e6_gina_name","text":"D —\nGina said your name to the girl. The girl looked away first. Gina wants that on the record.\nThe veil girl says you’re welcome.\nOhio State 38–0. Dad yelled at the TV in a good way. (Ma’s words.)\nThe Pacific smells like salt and kelp and money. Tell Reggie.\nI’ll send the Hopkins. Ma’s right, it’s poems. Read it anyway.\n—the Professor"},{"type":"doc","title":"Lined paper, Delgado 412","if":"e6_letter==\"kept\" && e6_gina_name","text":"D —\nGina said your name to the girl. The girl looked away first. Gina wants that on the record.\nThe veil girl asked what you were going to tell Gina. I didn’t read her your letter. It’s yours.\nGina knows her name now. Lena. Don’t tell Nonna. She likes ‘the nun.’\nOhio State 38–0. Dad yelled at the TV in a good way. (Ma’s words.)\nThe Pacific smells like salt and kelp and money. Tell Reggie.\nI’ll send the Hopkins. Ma’s right, it’s poems. Read it anyway.\n—the Professor"},{"type":"doc","title":"Lined paper, Delgado 412","if":"e6_letter==\"kept\" && !e6_gina_name","text":"D —\nGina said your name to the girl. The girl looked away first. Gina wants that on the record.\nThe veil girl asked what you were going to tell Gina. I didn’t read her your letter. It’s yours.\nOhio State 38–0. Dad yelled at the TV in a good way. (Ma’s words.)\nThe Pacific smells like salt and kelp and money. Tell Reggie.\nI’ll send the Hopkins. Ma’s right, it’s poems. Read it anyway.\n—the Professor"},"He leaves Danny’s own line out of it; it’s Danny’s. Nonna he leaves for Ma to tell, on a Sunday, across a table, in the room with the vending machines.","He addresses the envelope in block capitals from memory — the name, the number, the institution, the town — and presses hard enough that the letters stand up on the back. The RAZR lies open on the desk beside it with the screen dark. There’s nothing from her tonight, and the phone can stay dark.","He folds the letter in three, along the lines, and runs his thumbnail down each crease. Across the room the clip starts over, arms wide, silent, and Theo breathes in, slow, and out, slow, and keeps on doing it."],"end":true} const LS_KEY = 'hard-saying-save-v1', LS_THEME = 'hard-saying-theme';
const SEASON_WORDS = ['Zero', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'];
const EP_WORDS = ['Zero', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen', 'Twenty', 'Twenty-One', 'Twenty-Two'];
const DEFAULTS = { 'resolve.jack': 7, 'resolve.lena': 7 };
const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));
const EP = Object.fromEntries(EPISODES.map(e => [e.id, e]));

function fresh() {
  return { v: 1, updatedAt: 0, vars: {}, journal: {}, keys: [], log: [], logs: {}, completed: [], cur: null, checkpoint: null, started: null };
}
let S = fresh();
let ui = { drawer: null, tab: 'person', confirm: null, whisper: null };

/* ---------- state helpers ---------- */
function get(name) { return name in S.vars ? S.vars[name] : (name in DEFAULTS ? DEFAULTS[name] : 0) }
function applySet(set) {
  for (const [k, v] of Object.entries(set || {})) {
    if (typeof v === 'string' && /^[+-]\d+$/.test(v)) {
      let n = (Number(get(k)) || 0) + parseInt(v, 10);
      if (k.startsWith('resolve.')) n = Math.max(0, Math.min(10, n));
      S.vars[k] = n;
    } else S.vars[k] = v;
  }
}
function lit(s) {
  s = s.trim();
  if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
  if (s === 'true') return true; if (s === 'false') return false;
  return s.replace(/^["'“”]|["'“”]$/g, '');
}
function atom(a) {
  a = a.trim();
  const m = a.match(/^(!?)([A-Za-z_][\w.]*)\s*(?:(==|!=|>=|<=|>|<)\s*(.+))?$/);
  if (!m) return false;
  const v = get(m[2]);
  if (!m[3]) return m[1] ? !v : !!v;
  const r = lit(m[4]);
  switch (m[3]) { case '==': return v == r; case '!=': return v != r; case '>=': return v >= r; case '<=': return v <= r; case '>': return v > r; case '<': return v < r }
}
function test(expr) { if (!expr) return true; return expr.split('||').some(d => d.split('&&').every(atom)) }

function addJournal(list, epId) {
  for (const j of list || []) {
    if (!test(j.if)) continue;
    const key = j.kind + ':' + (j.id || j.title);
    const prev = S.journal[key];
    S.journal[key] = { kind: j.kind, title: j.title, text: j.text, ep: epId, t: prev ? prev.t : Date.now(), u: Date.now() };
  }
}

/* ---------- text ---------- */
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }
function fmt(s) { return esc(s).replace(/\*([^*\n]+)\*/g, '<em>$1</em>') }
function renderItems(items) {
  let h = '';
  for (const b of items || []) {
    if (typeof b === 'string') { h += `<p>${fmt(b)}</p>`; continue }
    if (!b || typeof b !== 'object') continue;
    if (!b.type) { const ok = test(b.if); const t = ok ? b.text : b.else; if (t) h += `<p>${fmt(t)}</p>`; continue }
    if (b.if && !test(b.if)) continue;
    if (b.type === 'break') h += `<div class="brk" aria-hidden="true">· · ·</div>`;
    else if (b.type === 'sms') h += `<div class="ins"><div class="phone" role="figure" aria-label="Text message"><div class="phone-top"><span>Inbox</span><span>${esc(b.time || '')}</span></div><div class="lcd"><span class="from">${esc(b.from)}:</span>${esc(b.text)}</div></div></div>`;
    else if (b.type === 'fb') h += `<div class="ins"><div class="fb" role="figure" aria-label="Facebook post"><span class="nm">${esc(b.name)}</span> ${fmt(b.text)}${b.meta ? `<div class="meta">${esc(b.meta)}</div>` : ''}</div></div>`;
    else if (b.type === 'aim') h += `<div class="ins"><div class="aim" role="figure" aria-label="AIM away message"><div class="tb">Away Message — ${esc(b.name)}</div><div class="bd">${fmt(b.text)}</div></div></div>`;
    else if (b.type === 'doc') h += `<div class="ins"><div class="doc" role="figure">${b.title ? `<h4>${esc(b.title)}</h4>` : ''}<div>${fmt(b.text)}</div></div></div>`;
  }
  return h;
}

/* ---------- persistence ---------- */
const sync = { db: null, ref: null, mode: 'local', busy: false, dirty: false, timer: null };
function readLocal() { try { const t = localStorage.getItem(LS_KEY); return t ? JSON.parse(t) : null } catch { return null } }
function writeLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)) } catch {} }
function save() { S.updatedAt = Date.now(); writeLocal(); queueRemote() }
function queueRemote() { if (!sync.ref) return; clearTimeout(sync.timer); sync.timer = setTimeout(pushRemote, 700) }
function remoteBody() {
  const cur = S.cur && EP[S.cur.ep];
  return {
    updatedAt: S.updatedAt,
    summary: { current: S.cur ? { ep: S.cur.ep, scene: S.cur.scene, stage: S.cur.stage, title: cur ? cur.title : '' } : null, completed: S.completed },
    state: S
  };
}
async function pushRemote() {
  if (!sync.ref) return;
  if (sync.busy) { sync.dirty = true; return }
  sync.busy = true; sync.dirty = false;
  try { await sync.ref.set(remoteBody()); setSync('account') }
  catch (e) {
    if (e && e.code === 'invalid_argument') { sync.ref = null; setSync('local') }
    else if (e && e.code === 'unavailable') { sync.dirty = true }
    else setSync('error');
  }
  sync.busy = false;
  if (sync.dirty && sync.ref) setTimeout(pushRemote, 1200);
}
async function archiveLog(epId, entries) {
  if (!sync.ref) return;
  try { await sync.db.doc('saves/main/log/' + epId).set({ ep: epId, entries, updatedAt: Date.now() }) } catch {}
}
function setSync(m) { sync.mode = m; const el = $('syncline'); if (el) el.textContent = syncText() }
function syncText() {
  return { account: 'Saved to your Claude account · follows you across browsers', local: 'Saved in this browser only', error: 'Account save failed · saved in this browser', checking: 'Connecting to your save…' }[sync.mode];
}
async function initRemote() {
  if (!window.claude || !window.claude.use) { setSync('local'); return }
  setSync('checking');
  try {
    const db = await window.claude.use('db');
    if (!db) { setSync('local'); return }
    sync.db = db;
    const ref = db.doc('saves/main');
    const snap = await ref.get();
    sync.ref = ref;
    if (snap.exists) {
      const r = snap.data();
      if (r && r.state && (r.updatedAt || 0) > (S.updatedAt || 0)) { S = Object.assign(fresh(), clone(r.state)); writeLocal(); render() }
      else if ((S.updatedAt || 0) > (r.updatedAt || 0)) pushRemote();
      setSync('account');
    } else if (S.updatedAt) { await pushRemote() } else setSync('account');
  } catch (e) { sync.ref = null; setSync('local') }
}

/* ---------- flow ---------- */
function epIndex(id) { return EPISODES.findIndex(e => e.id === id) }
function nextEpisode() { return EPISODES.find(e => !S.completed.includes(e.id)) }
function inProgress() { return S.cur && !S.completed.includes(S.cur.ep) && EP[S.cur.ep] ? S.cur : null }

function startEpisode(id) {
  const ep = EP[id];
  S.checkpoint = { ep: id, vars: clone(S.vars), journal: clone(S.journal), keys: clone(S.keys), log: clone(S.log) };
  const prev = (ep.previously || []).filter(p => test(p.if));
  S.cur = { ep: id, stage: prev.length ? 'previously' : 'card', scene: null, applied: null, choice: null };
  if (!S.started) S.started = Date.now();
  save(); render(true);
}
function restartEpisode() {
  const c = S.checkpoint; if (!c || !S.cur || c.ep !== S.cur.ep) return;
  S.vars = c.vars; S.journal = c.journal; S.keys = c.keys; S.log = c.log;
  S.cur = null; ui.confirm = null; closeDrawer(); startEpisode(c.ep);
}
function enterScene(id) {
  const ep = EP[S.cur.ep], sc = ep.scenes[id];
  S.cur.scene = id; S.cur.stage = 'scene'; S.cur.choice = null;
  if (S.cur.applied !== id) { applySet(sc.set); addJournal(sc.journal, ep.id); S.cur.applied = id }
  ui.whisper = null;
  save(); render(true);
}
function choose(i) {
  const ep = EP[S.cur.ep], sc = ep.scenes[S.cur.scene], c = visibleChoices(sc)[i];
  if (!c) return;
  applySet(c.set); addJournal(c.journal, ep.id);
  S.log.push({ ep: ep.id, scene: S.cur.scene, choice: c.text, key: c.key || null, t: Date.now() });
  if (c.key) S.keys.push({ ep: ep.id, text: c.key });
  if (!c.response || !c.response.length) { enterScene(c.goto); if (c.cue) { ui.whisper = c.cue; render(false) } return }
  S.cur.stage = 'response'; S.cur.choice = { text: c.text, response: c.response, cue: c.cue || null, goto: c.goto };
  ui.whisper = c.cue || null;
  save(); render(false);
  const r = $('resp'); if (r) r.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
}
function visibleChoices(sc) { return (sc.choices || []).filter(c => test(c.if)) }
function endEpisode() {
  const id = S.cur.ep;
  if (!S.completed.includes(id)) S.completed.push(id);
  const entries = S.log.filter(l => l.ep === id);
  S.logs[id] = entries; S.log = S.log.filter(l => l.ep !== id);
  S.checkpoint = null; S.cur.stage = 'end';
  save(); archiveLog(id, entries); render(true);
}

/* ---------- render ---------- */
function epTag(ep) { return `S${ep.season} · E${ep.episode}` }
function render(top) {
  closeDrawerIfStale();
  const st = $('stage'), cur = inProgress() || (S.cur && S.cur.stage === 'end' ? S.cur : null);
  $('duel').hidden = true;
  if (!ui.view && cur) ui.view = 'play';
  if (ui.view !== 'play' || !cur) { $('eplabel').textContent = ''; st.innerHTML = titleScreen(); bindTitle(); if (top) scrollTo(0, 0); return }
  const ep = EP[cur.ep];
  $('eplabel').textContent = `${epTag(ep)} — ${ep.title}`;
  if (cur.stage === 'previously') st.innerHTML = previously(ep);
  else if (cur.stage === 'card') st.innerHTML = titleCard(ep);
  else if (cur.stage === 'end') st.innerHTML = endCard(ep);
  else { ui.anim = !!top; st.innerHTML = sceneView(ep, cur) }
  bindStage();
  if (top) scrollTo(0, 0);
}
function titleScreen() {
  const ip = inProgress(), nx = nextEpisode();
  let btns = '';
  if (ip) btns += `<button class="go" data-a="resume">Continue · ${epTag(EP[ip.ep])}</button>`;
  else if (nx) btns += `<button class="go" data-a="start" data-ep="${nx.id}">${S.completed.length ? 'Play' : 'Begin'} · ${epTag(nx)} “${esc(nx.title)}”</button>`;
  else btns += `<p class="note">You’re caught up. The writers’ room is working on the next episode — tell Claude when you’re ready for it.</p>`;
  const rows = EPISODES.map(e => {
    const done = S.completed.includes(e.id), now = ip && ip.ep === e.id;
    return `<div class="eprow"><span class="n">${epTag(e)}</span><span class="t">${esc(e.title)}</span><span class="s ${done ? 'done' : ''}">${done ? 'Watched' : now ? 'In progress' : 'New'}</span></div>`;
  }).join('');
  return `<section class="title-screen fade">
    <div class="kicker">A drama in episodes · Fall 2009</div>
    <h1 class="show" style="margin-top:18px">The Hard <i>Saying</i></h1>
    <p class="verse">“This is a hard saying; who can listen to it?”<small>John 6:60</small></p>
    <div class="menu">${btns}</div>
    <div class="eplist">${rows}</div>
    <div class="sync" id="syncline">${syncText()}</div>
  </section>`;
}
function previously(ep) {
  const lines = (ep.previously || []).filter(p => test(p.if));
  return `<section class="prev fade"><div class="kicker">Previously on</div><h2>The Hard Saying</h2>
    <ul>${lines.map(l => `<li>${fmt(l.text)}</li>`).join('')}</ul>
    <button class="go" data-a="card">Continue</button></section>`;
}
function titleCard(ep) {
  return `<section class="card fade">
    <div class="epno">Season ${SEASON_WORDS[ep.season] || ep.season} · Episode ${EP_WORDS[ep.episode] || ep.episode}</div>
    <h2 class="eptitle">${esc(ep.title)}</h2>
    <div class="dates">${esc(ep.dates || '')}</div>
    <p class="log">${fmt(ep.logline || '')}</p>
    <div><button class="go" data-a="begin">Roll episode</button></div></section>`;
}
function duelHud(ep, sc) {
  const d = sc.duel && ep.duels && ep.duels[sc.duel];
  const el = $('duel');
  if (!d) { el.hidden = true; return }
  const pips = n => { n = Math.max(0, Math.min(5, Number(n) || 0)); return Array.from({ length: 5 }, (_, i) => `<span class="pip ${i < n ? 'on' : ''}"></span>`).join('') };
  el.innerHTML = `<div class="duel-in"><div class="duel-title">Argument · ${esc(d.title)} <span>— ${esc(d.topic || '')}</span></div>
    ${['rigor', 'wit', 'heart'].map(a => `<div class="meter">${a}<span class="pips" aria-label="${a} ${get('duel.' + sc.duel + '.' + a)}">${pips(get('duel.' + sc.duel + '.' + a))}</span></div>`).join('')}</div>`;
  el.hidden = false;
}
function sceneView(ep, cur) {
  const sc = ep.scenes[cur.scene];
  if (!sc) return `<p class="empty">This scene is missing. Open the menu to restart the episode.</p>`;
  duelHud(ep, sc);
  let h = `<article class="${ui.anim ? 'fade' : ''}"><div class="chyron">${esc(sc.slug)}</div>`;
  if (sc.music) h += `<div class="cue">${esc(sc.music)}</div>`;
  h += `<div class="prose">${renderItems(sc.body)}</div>`;
  if (cur.stage === 'response' && cur.choice) {
    h += `<div id="resp" class="${ui.anim ? '' : 'fade'}"><div class="chosen">${esc(cur.choice.text)}</div>`;
    if (ui.whisper) h += `<div class="whisper">${esc(ui.whisper)}</div>`;
    h += `<div class="prose response">${renderItems(cur.choice.response)}</div>`;
    h += `<button class="go" data-a="goto">Continue</button></div>`;
  } else {
    if (ui.whisper) h += `<div class="whisper">${esc(ui.whisper)}</div>`;
    const ch = visibleChoices(sc);
    if (ch.length) h += `<div class="choices" role="group" aria-label="What does Jack do?">${ch.map((c, i) => `<button class="choice" data-a="choose" data-i="${i}">${c.tag ? `<span class="tag">${esc(c.tag)}</span>` : ''}<span>${fmt(c.text)}</span></button>`).join('')}</div>`;
    else if (sc.end) h += `<button class="go" data-a="end">End of episode</button>`;
    else if (sc.next) h += `<button class="go" data-a="next">Continue</button>`;
  }
  return h + `</article>`;
}
function endCard(ep) {
  const keys = (S.logs[ep.id] || []).filter(l => l.key);
  const nx = nextEpisode();
  return `<section class="endc fade">
    <div class="kicker">${epTag(ep)} · End of episode</div>
    <h2 style="margin-top:10px">${esc(ep.title)}</h2>
    ${keys.length ? `<div class="sect"><h5>What you chose</h5><ul>${keys.map(k => `<li><span>${fmt(k.key)}</span></li>`).join('')}</ul></div>` : ''}
    ${ep.endCard && ep.endCard.tag ? `<p class="tagline">${fmt(ep.endCard.tag)}</p>` : ''}
    ${ep.endCard && ep.endCard.nextTime && ep.endCard.nextTime.length ? `<div class="next-time"><div class="kicker" style="margin-bottom:12px">Next time on The Hard Saying</div>${ep.endCard.nextTime.map(t => `<p>${fmt(t)}</p>`).join('')}</div>` : ''}
    <div class="sect"><p class="note">This episode is locked in. ${nx ? '' : 'When you’re ready for the next one, tell Claude: the writers’ room will read your save and build the next episode on the path you took.'}</p>
    <div class="row">${nx ? `<button class="go" data-a="start" data-ep="${nx.id}">Play ${epTag(nx)}</button>` : ''}<button class="ghost" data-a="title">Title screen</button><button class="ghost" data-a="journal">Open journal</button></div></div>
  </section>`;
}
function bindTitle() {
  $('stage').querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === 'resume') { ui.view = 'play'; render(true) }
    if (a === 'start') { ui.view = 'play'; startEpisode(b.dataset.ep) }
  });
}
function bindStage() {
  $('stage').querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a, ep = EP[S.cur.ep];
    if (a === 'card') { S.cur.stage = 'card'; save(); render(true) }
    else if (a === 'begin') enterScene(ep.start);
    else if (a === 'choose') choose(Number(b.dataset.i));
    else if (a === 'goto') { const g = S.cur.choice.goto; enterScene(g) }
    else if (a === 'next') enterScene(ep.scenes[S.cur.scene].next);
    else if (a === 'end') endEpisode();
    else if (a === 'start') { ui.view = 'play'; startEpisode(b.dataset.ep) }
    else if (a === 'title') { ui.view = 'title'; render(true) }
    else if (a === 'journal') openDrawer('journal');
  });
}

/* ---------- drawer: journal + menu ---------- */
function openDrawer(kind) { ui.drawer = kind; ui.confirm = null; drawDrawer(); $('drawer').hidden = false; $('scrim').hidden = false; $('drawer').focus?.() }
function closeDrawer() { ui.drawer = null; $('drawer').hidden = true; $('scrim').hidden = true }
function closeDrawerIfStale() { if (ui.drawer) drawDrawer() }
function drawDrawer() {
  const d = $('drawer');
  if (ui.drawer === 'journal') {
    const tabs = [['person', 'People'], ['clue', 'Clues'], ['note', 'Notes'], ['story', 'Story so far']];
    let body = '';
    if (ui.tab === 'story') {
      const byEp = {};
      for (const k of S.keys) (byEp[k.ep] = byEp[k.ep] || []).push(k.text);
      body = Object.keys(byEp).length ? Object.entries(byEp).map(([e, ks]) => `<div class="sect"><h5>${EP[e] ? epTag(EP[e]) + ' · ' + esc(EP[e].title) : esc(e)}</h5>${ks.map(t => `<div class="entry"><p>${fmt(t)}</p></div>`).join('')}</div>`).join('') : `<p class="empty">Nothing yet. Your biggest choices collect here.</p>`;
    } else {
      const items = Object.values(S.journal).filter(j => j.kind === ui.tab).sort((a, b) => b.u - a.u);
      body = items.length ? items.map(j => `<div class="entry"><h4>${esc(j.title)}</h4><div class="src">${EP[j.ep] ? epTag(EP[j.ep]) : ''}</div><p>${fmt(j.text)}</p></div>`).join('') : `<p class="empty">${{ person: 'No one yet. People Jack meets get a page here.', clue: 'No clues yet. Keep your eyes open.', note: 'No notes yet.' }[ui.tab]}</p>`;
    }
    d.innerHTML = `<div class="dhead"><h3>Jack’s Journal</h3><button class="bar-btn" data-d="close">Close</button></div>
      <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${ui.tab === k}" data-tab="${k}">${l}</button>`).join('')}</div>${body}`;
  } else {
    const ip = inProgress();
    const canRestart = ip && S.checkpoint && S.checkpoint.ep === ip.ep;
    d.innerHTML = `<div class="dhead"><h3>Menu</h3><button class="bar-btn" data-d="close">Close</button></div>
      <div class="sect"><h5>Display</h5><div class="row"><button class="ghost" data-d="theme" data-v="dark">Dark</button><button class="ghost" data-d="theme" data-v="light">Light</button><button class="ghost" data-d="theme" data-v="">Match device</button></div></div>
      <div class="sect"><h5>Episode</h5>${canRestart ? `<p class="note">You can replay ${epTag(EP[ip.ep])} from its beginning until you finish it. Once it ends, it’s locked.</p>
        ${ui.confirm === 'restart' ? `<div class="confirm"><p>Restart ${epTag(EP[ip.ep])}? Everything you chose in this episode is undone.</p><div class="row"><button class="go" style="margin:0" data-d="restart-yes">Restart episode</button><button class="ghost" data-d="cancel">Keep playing</button></div></div>` : `<button class="ghost" data-d="restart">Restart this episode</button>`}` : `<p class="note">No episode in progress. Finished episodes are locked.</p>`}</div>
      <div class="sect"><h5>Save</h5><p class="note" id="syncline2">${syncText()}</p>
        <p class="note">Backup code: copy it to move your save by hand if your account save is unavailable.</p>
        <div class="row"><button class="ghost" data-d="copy">Copy save code</button><button class="ghost" data-d="import">Paste a save code</button></div>
        ${ui.confirm === 'import' ? `<div class="confirm"><p>Paste a save code. It replaces your current progress.</p><textarea id="impcode" aria-label="Save code"></textarea><div class="row" style="margin-top:8px"><button class="go" style="margin:0" data-d="import-yes">Load save</button><button class="ghost" data-d="cancel">Cancel</button></div><p class="note" id="impmsg"></p></div>` : ''}
        ${ui.confirm === 'copied' ? `<p class="note">Copied.</p>` : ''}${ui.confirm === 'copyfail' ? `<textarea readonly aria-label="Save code">${esc(saveCode())}</textarea>` : ''}</div>`;
  }
  d.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; drawDrawer() });
  d.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    const a = b.dataset.d;
    if (a === 'close') closeDrawer();
    else if (a === 'theme') { setTheme(b.dataset.v) }
    else if (a === 'restart') { ui.confirm = 'restart'; drawDrawer() }
    else if (a === 'restart-yes') restartEpisode();
    else if (a === 'cancel') { ui.confirm = null; drawDrawer() }
    else if (a === 'copy') { navigator.clipboard.writeText(saveCode()).then(() => { ui.confirm = 'copied'; drawDrawer() }, () => { ui.confirm = 'copyfail'; drawDrawer() }) }
    else if (a === 'import') { ui.confirm = 'import'; drawDrawer() }
    else if (a === 'import-yes') {
      try { const s = JSON.parse(decodeURIComponent(escape(atob($('impcode').value.trim())))); if (!s || s.v !== 1) throw 0; S = Object.assign(fresh(), s); save(); ui.view = 'title'; closeDrawer(); render(true) }
      catch { $('impmsg').textContent = 'That code didn’t load. Copy the whole code and try again.' }
    }
  });
}
function saveCode() { return btoa(unescape(encodeURIComponent(JSON.stringify(S)))) }
function setTheme(v) {
  if (v) document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem(LS_THEME, v) } catch {}
}

$('home').onclick = () => { ui.view = 'title'; closeDrawer(); render(true) };
$('jbtn').onclick = () => ui.drawer === 'journal' ? closeDrawer() : openDrawer('journal');
$('mbtn').onclick = () => ui.drawer === 'menu' ? closeDrawer() : openDrawer('menu');
$('scrim').onclick = closeDrawer;
addEventListener('keydown', e => { if (e.key === 'Escape' && ui.drawer) closeDrawer() });

function start(data) {
  try { const t = localStorage.getItem(LS_THEME); if (t === null) setTheme('dark'); else if (t) setTheme(t) } catch { setTheme('dark') }
  const local = readLocal();
  if (data && data.S) S = Object.assign(fresh(), data.S);
  else if (local) S = Object.assign(fresh(), local);
  ui.view = 'title';
  render(true);
  initRemote();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) { try { hot.snapshot(() => ({ S })) } catch {} }
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
</script>
