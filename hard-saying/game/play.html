she hitches up the tote and looks west, toward Seacliff and Bid Day. “Somebody has to be across the street.”"}],"goto":"s13"},{"text":"“What does that one owe?”","tag":"Candor","set":{"e5_evan":"owe","trait.candor":"+1"},"response":["Evan stops with one hand on the Carhartt. He looks at Jack properly, and for a second it seems he might answer. “Purity of heart is to will one thing,” he says. “I’ve never managed two.”",{"if":"e5_duel_personal && !e5_apologized","text":"Lena and Jack climb out into the four-thirty light. At the top of the steps she hitches up the tote and looks west, toward Seacliff and Bid Day. “Somebody has to be across the street, Mr. Costigan.”","else":"Lena and Jack climb out into the four-thirty light. At the top of the steps she hitches up the tote and looks west, toward Seacliff and Bid Day. “Somebody has to be across the street.”"}],"goto":"s13"},{"text":"Go.","tag":"Control","set":{"e5_evan":"go","trait.control":"+1"},"response":["Jack shoulders his bag and takes the stairs.",{"if":"e5_duel_personal && !e5_apologized","text":"Lena and Jack climb out into the four-thirty light. At the top of the steps she hitches up the tote and looks west, toward Seacliff and Bid Day. “Somebody has to be across the street, Mr. Costigan.”","else":"Lena and Jack climb out into the four-thirty light. At the top of the steps she hitches up the tote and looks west, toward Seacliff and Bid Day. “Somebody has to be across the street.”"}],"goto":"s13"}],"journal":[{"kind":"note","id":"assignment","title":"Designated antagonists","if":"e5_duel_personal && !e5_apologized","text":"Two pages a week, bled on in red. Week two, hers: “That a Broken Statue Is Still Herakles,” with my sentence on page two. Mine: “That God Is the One Who Pays.” She kept it. This week Hale said it out loud: prove the thing you least believe you can prove. Mine: “That the Lucky Man Owes Nothing.” Hers: “That There Is Such a Thing as Luck.” Her whole review of mine, Thursday in section: “Fine.”"},{"kind":"note","id":"assignment","title":"Designated antagonists","if":"!e5_duel_personal || e5_apologized","text":"Two pages a week, bled on in red. Week two, hers: “That a Broken Statue Is Still Herakles,” with my sentence on page two. Mine: “That God Is the One Who Pays.” She kept it. This week Hale said it out loud: prove the thing you least believe you can prove. Mine: “That the Lucky Man Owes Nothing.” Hers: “That There Is Such a Thing as Luck.” Her red on mine: “You don’t believe a word of this. It’s your best paper.”"},{"kind":"person","id":"evan","title":"Evan Marsh (TA)","text":"Thursday section, Hollis 108. Kierkegaard. Kind to the scared ones, murder on the lazy ones. Smokes American Spirits. Rides a bike. Came back from PERSONAL grayer. Told us we’d left out a driver."}]},"s13":{"slug":"THURSDAY · 5:04 PM · SEACLIFF ROAD, ACROSS FROM PI LAMBDA CHI","music":"Beyoncé — “Single Ladies (Put a Ring on It)”","body":["At five o’clock on Bid Day, Seacliff Road is louder than Sully’s was at the final gun. Pi Lambda Chi has every window open and two speakers wired to the porch rail playing “Single Ladies,” and by the look of the actives it has been playing since noon. Forty women in white are on the lawn, screaming at nothing yet.",{"if":"e2_friday==\"margot\"","text":"Across the road, on the bluff side, seventy feet above the rocks, is the bench where Margot ran her stakeout two weeks ago, and Margot is on it again.","else":"Across the road, on the bluff side, seventy feet above the rocks, there’s a bench, and Margot is on it, back for the sequel to the stakeout he skipped two weeks ago to walk Laney to this same porch."},"She has a stack of today’s *Tide* on her knee, folded open to page three.",{"type":"doc","title":"The Marisol Tide · Thursday, September 17, 2009 · Page 3","text":"RITES OF PASSAGE\nA week inside sorority recruitment on Seacliff Road, where the dress code is a test and the test is a dress\nBy Margot Lindqvist\n\n…The chapter’s philanthropy is children’s literacy. Its recruitment budget exceeds its philanthropy budget by a factor this reporter is still confirming.\n\n…Two male control subjects, observed from a public bench, could not name a single shade of pink between them. Both are Catholic. This reporter does not believe that is a coincidence.","if":"e2_friday==\"margot\""},{"type":"doc","title":"The Marisol Tide · Thursday, September 17, 2009 · Page 3","text":"RITES OF PASSAGE\nA week inside sorority recruitment on Seacliff Road, where the dress code is a test and the test is a dress\nBy Margot Lindqvist\n\n…The chapter’s philanthropy is children’s literacy. Its recruitment budget exceeds its philanthropy budget by a factor this reporter is still confirming.\n\n…Of two male control subjects recruited for this story, one defected to escort duty before the first chant. The other, observed from a public bench, could not name a single shade of pink. Both are Catholic. This reporter does not believe that is a coincidence.","if":"e2_friday!=\"margot\""},"She has the Moleskine out for the follow-up, and on the porch an active in a headset, with a clipboard of her own, has been glaring at her across Seacliff for ten minutes with a pure, professional hatred. Margot looks right back, and writes the glare down.","Lena is at the other end of the bench, in a blue sundress with small white flowers on it — “I can cry in this one, I tested it” — and her mascara, she wants him to know, is waterproof. “Laney said wear something you can cry in. I extended it to the face.” She has her boots planted and her hands knotted in her lap, and she is watching the top of the road as if something is coming in off the Gulf.","At nine minutes past five a whoop goes up from the far end of Seacliff and the new members come down the road at a dead run: sixty girls in matching pink T-shirts that say PI LAM RODEO, bandanas at their throats, cowboy hats, boots that have never been introduced to a horse. Laney, who is from Texas, will be telling everyone who holds still, for the rest of the semester, that the theme is cultural theft. She is out in front anyway in a pink straw cowboy hat, copper hair coming loose behind her. On the porch steps Sloane Kittredge has the clipboard and is calling names like a ring announcer.","Laney hits the porch and screams, and is screamed at, and screams back, and is passed hand to hand across a crush of white dresses — and then she turns around, finds the bench, and comes straight back across Seacliff at a sprint in wedge heels, through a gap between a Jetta and a surf van, holding the hat on with one hand. She goes into Lena first. They’re both crying at once, Lena’s waterproof holding up, Laney’s not, Laney saying “I *know*, I *know*” into Lena’s hair as though Lena had said anything. Then she lets go and gets Jack around the neck. “FIREMAN.”",{"if":"e5_wed==\"pref\"","text":"Into his collar, quieter, before she lets go: “You stayed till I slept.”","else":"She pulls back and smacks him on the chest. “Where were you last night? I needed a man to hold the carnitas.”"},"Margot has the pen up. “On the record?” Laney puts the hat back on and squares it. “Sugar, I *am* the record.” Two actives come across the road and take her back by the elbows, lifeguards bringing in a swimmer who didn’t want saving, and Laney goes, waving over her shoulder with the hand that isn’t holding her hat on.","Lena watches her go with the heels of both hands under her eyes. “She ran to me first,” she says, to the bench in general. “In front of Sloane Kittredge and the whole chapter. Did y’all see that?” Margot, writing: “Observed.” “Nobody runs back across the road. You get your hat and your sisters and you go in.” She sits back down on the bench. “She’s going to be insufferable,” she says, with enormous satisfaction.","Behind them a champagne-gold convertible comes down Seacliff slow with the top down. Theo lifts one hand off the wheel without turning his head, and keeps going west."],"journal":[{"kind":"person","id":"laney","title":"Laney Price","if":"e5_wed==\"pref\"","text":"Laney Price. Pi Lam, as of Thursday: ran back across Seacliff in a pink cowboy hat to Lena first. The night before, on the floor of 217 in a white dress, she asked what happens if they look at her and see. First Catholic Mass: arms crossed like a Baptist, came back from the blessing pink and quiet. Programmed herself into my phone. (Hoodie status: hers.)"},{"kind":"person","id":"laney","title":"Laney Price","if":"e5_wed!=\"pref\"","text":"Laney Price. Pi Lam, as of Thursday: ran back across Seacliff in a pink cowboy hat to Lena first. First Catholic Mass: arms crossed like a Baptist, came back from the blessing pink and quiet. Programmed herself into my phone. (Hoodie status: hers.)"}],"choices":[{"text":"The pageant wave back. Wrist, wrist, elbow, elbow.","tag":"Wit","set":{"e5_bidday":"wave","rel.laney.warmth":"+1","trait.wit":"+1"},"response":["He gives it to her across Seacliff, the full Miss Teen Dallas County, every count of it. On the porch Laney stops dead in the crush, turns, and returns it perfectly, with the hat, and holds the smile at him until a sister pulls her inside.","Margot caps her pen, squares the stack of *Tides* under her arm, and leaves for deadline. Then it’s just Jack and Lena on the bench, with the sea working at the rocks below and the porch across the road still screaming."],"goto":"s13b"},{"text":"“Go be adored, Price.”","tag":"Sincerity","set":{"e5_bidday":"adored","rel.laney.warmth":"+1","rel.laney.trust":"+1","trait.sincerity":"+1"},"response":["He has to shout it across the road. She hears it anyway. From the top step Laney swings round and points at him with her whole arm, a game-show host with the contestant who just won the car, and keeps pointing till the door takes her.","Margot caps her pen, squares the stack of *Tides* under her arm, and leaves for deadline. Then it’s just Jack and Lena on the bench, with the sea working at the rocks below and the porch across the road still screaming."],"goto":"s13b"},{"text":"Blow Sloane a kiss on Laney’s behalf.","if":"trait.charm>=8","tag":"Charm","set":{"e5_bidday":"sloane","rel.laney.warmth":"+1","trait.charm":"+1"},"response":["He kisses his palm and sends it across Seacliff to the steps. Sloane Kittredge doesn’t look up from the clipboard. “The Catholic,” she says, in a voice that carries, and checks something off. Laney, three feet from her, puts both hands over her face and screams into them.","Margot caps her pen, squares the stack of *Tides* under her arm, and leaves for deadline. Then it’s just Jack and Lena on the bench, with the sea working at the rocks below and the porch across the road still screaming."],"goto":"s13b"}]},"s13b":{"slug":"THURSDAY · 5:20 PM · THE BLUFF BENCH, SEACLIFF ROAD","body":["The sun has come down to the end of the road, and the sea under the bluff has gone hammered and bright. Pi Lam has tried something with a great deal of bass and gone back to Beyoncé. Lena runs a knuckle under each eye and checks it. “Holding,” she reports, of the mascara, and puts her hands back in her lap.",{"if":"e5_duel_personal && !e5_apologized","text":"They’ve been sitting a polite foot apart since Margot left, and the one time she spoke to him it was “Mr. Costigan.” Three days of that now. She’s very good at it."},"At 5:20 the RAZR goes off in his pocket. He tips the cracked screen until it lights: a number he doesn’t have saved, long, out of state, and he knows it anyway. He opens it. Across the road the speakers drop out between songs, and into the gap the recorded woman comes flat and loud enough for the whole bench: “This is a prepaid call from — Danny — an inmate at Trumbull Correctional Institution.” The name in the middle is in his brother’s own voice, hurried, dropped into the space she leaves for it.","Her eyes stay on the porch, on the girls in white and the girls in pink straw hats, and her hand goes up to the medal and holds it.",{"if":"e5_duel_personal && !e5_apologized","text":"Monday stops here. Whatever it was, it doesn’t reach as far as a man taking a call from a prison: she stays exactly where she is, a foot away, keeping the bench with him."},"The recording wants to know if he accepts. His thumb is on the key."],"choices":[{"text":"Stay on the bench. Take it here.","tag":"Sincerity","set":{"e5_call":"stay","trait.sincerity":"+1","soul.grace":"+1"},"goto":"s13c"},{"text":"Walk down to the bluff stairs. Take it alone.","tag":"Control","set":{"e5_call":"walk","trait.control":"+1","soul.grace":"+1","resolve.jack":"+1","e5_danny_gina":true},"goto":"s13d"}]},"s13c":{"slug":"THURSDAY · 5:21 PM · THE BLUFF BENCH, SEACLIFF ROAD","music":"Fleet Foxes — “Blue Ridge Mountains”","body":["He presses the key and stays where he is.","“*Professor.*” His brother, a little out of breath, a room full of men behind him and a steel door somewhere that buzzes and slams. The earpiece is loud enough that Lena could hear it if she wanted to, and she is looking very carefully at the porch. “Got your letter. *Sixty-six degrees. Green on top and gray underneath.*” Danny says it by heart. “I read it to Reggie in the next bunk. Reggie’s from Portsmouth. Never seen nothing bigger than the Ohio River. He wants to know does it smell.” “Like kelp.” “I don’t know what that is, Professor, and neither does Reggie.”","A pause with a television in it. “Hey. You never write when there’s nothing to say.” Another. “Somebody tell you to?” Jack looks at the water. “A guy at work.” “Tell him thanks.” Then, lighter, sounding like himself: “Book’s in the mailroom. *Brideshead.* They read it before I do. Some C.O. has got it on his lunch break right now, finding out how it ends.”","Across the road the porch hits the chorus and sixty women scream the *oh-oh-oh* at the sky, and Danny stops. “Where are you, a zoo?” “Sorority thing.” A silence, and then, enormously scandalized and enormously pleased: “*Professor.*”",{"if":"e5_gina_advice==\"mom\"","text":"“Called the house last night,” Danny says, a step quieter. “Gina picked up. Ma got on after.” He doesn’t say what either of them told him, and Jack can hear him choosing not to."},{"if":"e5_gina_advice==\"nun\"","text":"“Called the house last night,” Danny says, a step quieter. “Gina picked up. Asked me was the nun real, and wouldn’t tell me what nun.” He doesn’t say what else she told him, and Jack can hear him choosing not to."},{"if":"e5_gina_advice==\"dui\"","text":"“Called the house last night,” Danny says, a step quieter. “Gina picked up. She sounded like she was loading something.” He doesn’t say what she told him, and Jack can hear him choosing not to."},{"if":"e5_gina_advice!=\"mom\" && e5_gina_advice!=\"nun\" && e5_gina_advice!=\"dui\"","text":"“Called the house last night,” Danny says, a step quieter. “Gina picked up.” He doesn’t say what she told him, and Jack can hear him choosing not to."},"Then, quick, getting the important thing in before the money runs out: “Hey. Is the veil girl there?”","Beside him, Lena’s head turns from the porch, slowly, all the way around."],"choices":[{"text":"Hand Lena the phone.","tag":"Sincerity","cue":"Danny will remember that.","set":{"e5_danny":"hand","danny_met_lena":true,"rel.lena.trust":"+1","rel.lena.warmth":"+1","trait.sincerity":"+1"},"key":"Lena said hello to your brother.","response":["He holds the RAZR out to her. She looks at it, and then at him, and then she takes it in both hands, like something hot and something holy, and puts it to her ear. “Hi, Danny.”","On the line Danny goes quiet, which Jack has heard maybe twice in his life. Then, low, delighted: “Oh, she’s *real*.” “I’m real,” Lena says. And Danny, slower, like he’s turning it over: “So you’re the one who asked my name.”"],"goto":"s13e"},{"text":"Hold it between you.","tag":"Charm","set":{"e5_danny":"between","danny_met_lena":true,"rel.lena.warmth":"+1","soul.restraint":"+1","trait.charm":"+1"},"key":"Lena said hello to your brother.","response":["He tips the phone off his ear and holds it in the air between them, and she leans in until the RAZR is between their two heads and her hair is against his ear, warm from the sun and smelling of something sweet she must have borrowed from Laney. “Hi, Danny.”","On the line Danny goes quiet, which Jack has heard maybe twice in his life. Then, low, delighted: “Oh, she’s *real*.” “I’m real,” Lena says. And Danny, slower, like he’s turning it over: “So you’re the one who asked my name.”"],"goto":"s13e"},{"text":"“She’s here.”","tag":"Candor","set":{"e5_danny":"here","danny_met_lena":true,"rel.lena.trust":"+1","trait.candor":"+1"},"key":"Lena said hello to your brother.","response":["“She’s here,” Jack says, and before he can offer it, Lena has her hand out, palm up, for the phone. He gives it to her. “Hi, Danny.”","On the line Danny goes quiet, which Jack has heard maybe twice in his life. Then, low, delighted: “Oh, she’s *real*.” “I’m real,” Lena says. And Danny, slower, like he’s turning it over: “So you’re the one who asked my name.”"],"goto":"s13e"}]},"s13d":{"slug":"THURSDAY · 5:21 PM · THE BLUFF STAIRS, BELOW SEACLIFF ROAD","music":"Fleet Foxes — “Blue Ridge Mountains”","body":["He presses the key and stands up. “Back in a minute.” Lena nods at the porch. Twenty yards down Seacliff the bluff stairs go over the edge, weathered wooden steps switchbacking down the face through ice plant and wild fennel to the sand, the rail gone silver with salt. He goes down a flight and a half and sits on the landing. Below him the gulls are working the wet line of the beach. Above him, against the sky, there’s the bench and a shape on it with its hands in its lap.","“*Professor.*” His brother, out of breath, a room full of men behind him and a steel door somewhere that buzzes and slams. “Got your letter. *Sixty-six degrees. Green on top and gray underneath.* I read it to Reggie in the next bunk. Reggie’s from Portsmouth. Never seen nothing bigger than the Ohio River. He wants to know does it smell.” “Like kelp.” “I don’t know what that is, Professor, and neither does Reggie.”","A pause with a television in it. “You never write when there’s nothing to say. Somebody tell you to?” Jack watches a gull walk off with something it shouldn’t have. “A guy at work.” “Tell him thanks.” The book is in the mailroom, Danny says; they read it before he does, and some C.O. is finding out how it ends on his lunch break. Up on the road the porch hits the chorus, sixty women screaming at the sky, and it comes right down the bluff. “Where are you, a zoo?” “Sorority thing.” “*Professor.*”","“Called the house last night,” Danny says, a step quieter. “Gina picked up. Said everything’s fine, which is how I know it ain’t. She’s been saying fine since she was four.” He waits. “You know something.”","Up on the road nobody can hear him. Down here there’s nobody but the gulls. So Jack tells him: religion class, the corporal works of mercy up on the board like a grocery list, *visit the imprisoned*, Ashley Vrabel, everybody laughing, Mrs. D saying *ladies* and going on to bury the dead.","For a while there’s only the television on Danny’s end, and somebody laughing at it.","“The class expert,” Danny says finally. “On me.” A breath that doesn’t go all the way in. “She shouldn’t have to carry me to school, Professor. She’s fifteen.” Then, harder: “What’d you tell her?”",{"if":"e5_gina_advice==\"nun\" || e5_gina_advice==\"name\"","text":"“To say your name. Just ‘Danny.’ Then look at the girl till she looks away.” Nothing on the line. Then: “My name,” Danny says. “Okay. Yeah. Okay.”"},{"if":"e5_gina_advice==\"dui\"","text":"“To ask the girl how her dad’s DUI is going.” Danny laughs, one bark, loud enough that somebody on his end tells him to shut up. Then, quieter: “Tell her don’t. She’s better than the Vrabels. Somebody in this family’s got to be.”"},{"if":"e5_gina_advice==\"sowhat\"","text":"“That she gets to be your sister anyway.” Nothing on the line. “Yeah,” Danny says, rough. “Yeah. She does.”"},{"if":"e5_gina_advice==\"mom\"","text":"“To tell Ma.” “Good.” Danny almost laughs. “Mrs. D’s never seen Ma in her work shoes.”"},"“Tell her she did good,” Danny says. “Going back in the next day. That’s the hard part, Professor. Tell her I said.” “I’ll tell her.”","Then, quick, getting the important thing in before the money runs out: “Hey. Is the veil girl there?”","Jack looks up the stairs at the bench."],"choices":[{"text":"“She’s up on the bench.”","tag":"Sincerity","set":{"e5_danny":"bench","trait.sincerity":"+1"},"key":"You took your brother’s call alone on the bluff stairs.","response":["“Then what are you doing down here, Professor?” It’s their mother’s voice, exactly, coming out of a prison phone, and the only honest answer to it is a long one."],"goto":"s13e"},{"text":"“Which one?”","tag":"Wit","set":{"e5_danny":"which","trait.wit":"+1"},"key":"You took your brother’s call alone on the bluff stairs.","response":["“There’s more than one?” A whoop, and somebody on Danny’s end telling him to keep it down. “Ma’s gonna need a chart.”"],"goto":"s13e"},{"text":"“Yeah. She’s here.”","tag":"Candor","set":{"e5_danny":"yeah","trait.candor":"+1"},"key":"You took your brother’s call alone on the bluff stairs.","response":["Danny is quiet a second. Then, gently, like goodnight through a bedroom door: “Tell her I said hey.”"],"goto":"s13e"}]},"s13e":{"slug":"THURSDAY · 5:34 PM · THE BLUFF BENCH, SEACLIFF ROAD","body":[{"if":"danny_met_lena","text":"“Hold on,” Danny says. “Say something else.” “Something else,” Lena says, and on the line there’s a pause while he listens. “You’re the New Orleans one. I can hear it from here. He says you argue like a prosecutor” — loud enough for Jack to hear his own letter from two weeks ago coming back to him through a prison phone. Lena sits up straighter on the bench. “Defense, actually,” she says. “I’m going to be defense.” And Danny laughs, and it’s the old one, the one from the driveway on Glenwood with his head under the hood of somebody’s Buick, the one Jack had stopped expecting to hear again. Jack has to look at the sea for a while. “Gina says Nonna’s got you down as a nun,” Danny says. “Your grandmother,” Lena tells him, “has been misinformed.” She listens to something that makes her smile at her own knees. Then she hands the phone back, warm. “The *veil girl*.” She lets him suffer exactly one second. “I’ve been called worse in Latin.”"},{"if":"!danny_met_lena && e5_danny==\"yeah\"","text":"“Tell her I said hey,” Danny says again, in case it didn’t take. “And next time you take a girl to a zoo, Professor, you buy her a pretzel. Ma raised you.”"},{"if":"!danny_met_lena && e5_danny!=\"yeah\"","text":"“Tell her I said hey,” Danny says. “And next time you take a girl to a zoo, Professor, you buy her a pretzel. Ma raised you.”"},"Then the recorded woman, right on top of him: “You have one minute remaining.” Danny talks faster. “Professor, listen — tell Gina — ”","Click.","Not even the dial tone yet: a click, and then a hiss, and then nothing at all. Across the road the porch is still playing Beyoncé.",{"if":"!danny_met_lena","text":"Jack sits on the landing with the dead phone until a gull lands on the rail and looks at him. Then he climbs. Lena watches him come up the last flight. “He says hey,” Jack says, and Lena says “Hey” back, very quietly, out toward the water, as if it might get there. “He got cut off. ‘Tell Gina — ’ and then the machine.”"},{"if":"e5_duel_personal && !e5_apologized && danny_met_lena","text":"“Tell Gina what?” Lena says. “I don’t know.” “Then you ask him next time, Jack.” It’s the first time she’s said his name since the olive tree."},{"if":"e5_duel_personal && !e5_apologized && !danny_met_lena","text":"“Tell Gina what?” Lena says. “I don’t know.” “Then you ask him next time, Mr. Costigan.” She says the *Mr.* more gently than she has all week, but she says it."},{"if":"!e5_duel_personal || e5_apologized","text":"“Tell Gina what?” Lena says. “I don’t know.” “Then you ask him next time.”"},"She doesn’t touch him. She sits with him while the sun gets lower over the water and the porch runs through its handful of songs again from the top — forty women groaning at the first bars of “Single Ladies” and singing every word anyway — the two of them watching the girls in pink hats go in and out of the front door, until it’s twenty past six and he has to go get La Flaca off the rack and ride to the Anchor for his Thursday shift. When he stands, she lifts a hand from her lap — go, ride safe — and stays where she is, watching the porch."],"journal":[{"kind":"person","id":"danny","title":"Danny","if":"danny_met_lena","text":"My brother. Trumbull Correctional. Calls me Professor. Ma brought him the good socks. *Brideshead* went to him through Driftwood, margins erased; it’s in the mailroom, and they read it before he does. The ocean letter got there; he read it to Reggie in the next bunk. Lena knows. She asked his name. On the bluff bench she said hi to him and told him she’s going to be defense, and he laughed like he used to. The system cut him off at ‘tell Gina — .’"},{"kind":"person","id":"danny","title":"Danny","if":"!danny_met_lena","text":"My brother. Trumbull Correctional. Calls me Professor. Ma brought him the good socks. *Brideshead* went to him through Driftwood, margins erased; it’s in the mailroom, and they read it before he does. The ocean letter got there; he read it to Reggie in the next bunk. Lena knows. She asked his name. He says hey. On the bluff stairs I told him about Gina and the class-expert thing; he said tell her she did good, going back in the next day. The system cut him off at ‘tell Gina — .’"},{"kind":"person","id":"lena","title":"Lena Broussard","if":"danny_met_lena","text":"New Orleans. Two seventeen. Classics. Hale paired us for the semester. Makes a roux like she’s taking a vow and expects you to keep up. Her father sells Gulf shrimp — Broussard’s Seafood, Banks Street. Boyfriend: Wes Arceneaux — Tulane, civil engineering, the boat at sixteen. Calls at 8:04 on the dot. Her grandmother, Lucille Guidry, died in the storm in ’05; they buried her in November, in the good dress. The medal came back to her mother in a plastic bag. She has never asked her mother one question. The year after, she went to Mass every morning to yell at God, and somewhere in there it stopped being a fight. Paints a mean fleur-de-lis. Said hi to Danny. Says she’s going to be defense."},{"kind":"person","id":"lena","title":"Lena Broussard","if":"!danny_met_lena","text":"New Orleans. Two seventeen. Classics. Hale paired us for the semester. Makes a roux like she’s taking a vow and expects you to keep up. Her father sells Gulf shrimp — Broussard’s Seafood, Banks Street. Boyfriend: Wes Arceneaux — Tulane, civil engineering, the boat at sixteen. Calls at 8:04 on the dot. Her grandmother, Lucille Guidry, died in the storm in ’05; they buried her in November, in the good dress. The medal came back to her mother in a plastic bag. She has never asked her mother one question. The year after, she went to Mass every morning to yell at God, and somewhere in there it stopped being a fight. Paints a mean fleur-de-lis."}],"next":"s14"},"s14":{"slug":"FRIDAY · 2:10 AM · DELGADO HALL, THE FRONT STEPS","music":"Iron & Wine — “Passing Afternoon”","body":["The Thursday shift lets him go at twenty past one. Tonight Gloria rated a long-haul trucker to his face, *lemon meringue — all air*, and the trucker tipped her five dollars for it. At midnight Rudy put a plate of eggs on the steel by the Hobart and pointed at it with the spatula until the dish man ate. At close Gloria made him take the last slice of the lemon meringue home in foil, “for the ride,” and it’s in La Flaca’s basket now, all air. The RAZR charger came out from behind the machine furred with lint and smelling of bleach, and it’s coiled in his back pocket beside the O’Connor. La Flaca got him up Mission and out Ocean Road in the cold, her coaster brakes complaining at every grade.","Delgado at ten past two. Through the lobby glass Marcus is asleep at the front desk again, organic chemistry this week, rising and falling on his chest. Jack sits down on the front steps instead of going in. The gold went down the drain on Tuesday — the last fleck of it came out of his eyebrow in the fourth-floor shower — and his face is just his face.","*Do you think the lucky one sleeps, Mr. Costigan?* He’s had four nights to come up with a better answer than the one he gave in Hollis 302. He’s still working on it.","At 2:10 the horn comes up off the bluff. Two long, one short, one long: the long notes low and patient, the short one a hitch in the middle, the last held out over the water until the fog takes the end of it. Then the freight itself, steel on steel down in the dark below the Lagoon, and the concrete step under him taking a share of the weight. Jack counts under his breath, the way he has since he was six, one car into the next, alone this time. The twenties. The forties. The sound goes on up the coast and thins and is gone.","Sixty.","At 2:14 the RAZR goes in his pocket.",{"type":"sms","from":"Lena","text":"Sixty-one. No second engine tonight. Goodnight, Jack. —L.","time":"2:14 AM"},"He keeps the phone open in his hand. Then he leans back on his elbows and looks up the face of the building. Every window on the second floor is dark, and one of them is open."],"choices":[{"text":"Text back: “61”","tag":"Sincerity","set":{"e5_freight":"61","trait.sincerity":"+1"},"response":[{"type":"sms","from":"Jack","text":"61","time":"2:15 AM"},"Up on the second floor, the open window stays open."],"goto":"s14b","key":"You texted Lena back: 61."},{"text":"Text back: “engines dont count”","tag":"Wit","set":{"e5_freight":"engines","trait.wit":"+1"},"response":[{"type":"sms","from":"Jack","text":"engines dont count","time":"2:15 AM"},{"type":"sms","from":"Lena","text":"They do in New Orleans. —L.","time":"2:15 AM"}],"goto":"s14b","key":"You told Lena engines don’t count."},{"text":"Close the phone. Listen to the end of it.","tag":"Control","set":{"e5_freight":"listen","trait.control":"+1"},"response":["He folds the RAZR shut and listens. The last of the freight is a long way north by now, more a pressure in the air than a sound, and then not even that; then just the surf down under the bluff, and the quiet coming back up it behind the train, one street at a time, until it reaches the steps."],"goto":"s14b","key":"You closed the phone and listened to the freight go."}]},"s14b":{"slug":"FRIDAY · 2:16 AM · DELGADO HALL, THE FRONT STEPS","body":["He goes in. Marcus doesn’t wake; organic chemistry goes up and down. The elevator takes its time getting to four. The lounge is dark, the whiteboard a pale square on the far wall, and under the door of 412 there’s no light at all, Theo’s screen off, Theo a long shape under the comforter. Jack doesn’t turn on the lamp. He sets the O’Connor on the desk beside the Hopkins, and lays the RAZR next to them, open to her text, and lies down on top of the blanket in his clothes. The screen keeps her lit for the fifteen seconds it’s allowed — *Goodnight, Jack. —L.* — and then it goes dark, and he lies there with his eyes open, listening to the building breathe."],"end":true}}},{"id":"S1E06","season":1,"episode":6,"showTitle":"The Hard Saying","title":"Welcome","dates":"Friday, September 18 – Sunday, September 20, 2009","logline":"A fire alarm at three in the morning, a chastity talk with a slideshow, a beach cleanup that is absolutely not a date — and after a barn party, Lena asks to be walked home the long way.","previously":[{"text":"At Sully’s, Lena painted a gold fleur-de-lis on your cheekbone. “It means home, Costigan. It means we came back.”","if":"e5_paint==\"meaning\""},{"text":"Hale asked whether luck can make a man guilty. You said the unlucky driver owes everything — that nobody gets to take it for him.","if":"e5_ferocity"},{"text":"A girl in Gina’s religion class called her the class expert on visiting the imprisoned. Lena said: tell her to say his name.","if":"e5_gina_lena"},{"text":"Laney got Pi Lam. She ran back across Seacliff to Lena first."},{"text":"On the bluff bench your brother called from Trumbull, and Lena said hi to him. Then the system cut him off: “Tell Gina — .”","if":"danny_met_lena"},{"text":"At 2:14 a.m.: “Sixty-one. No second engine tonight. Goodnight, Jack.”"}],"cast":[{"id":"lena","name":"Lena Broussard","role":"The girl on the porch","tracked":true},{"id":"theo","name":"Theo Vance","role":"Roommate, Room 412","tracked":true},{"id":"laney","name":"Laney Price","role":"Lena’s roommate","tracked":true},{"id":"margot","name":"Margot Lindqvist","role":"Third floor, Delgado","tracked":true},{"id":"kevin","name":"Kevin Tran","role":"Down the hall, Room 420","tracked":true},{"id":"osei","name":"Fr. Gabriel Osei","role":"Newman Center chaplain","tracked":true},{"id":"hale","name":"Prof. Adrian Hale","role":"Philosophy, Marisol","tracked":true},{"id":"julian","name":"Julian Park-Ellis","role":"A guy with a guitar","tracked":true},{"id":"evan","name":"Evan Marsh","role":"TA, PHIL 1, Thursday section","tracked":true},{"id":"becca","name":"Becca Lindell","role":"Newman regular","tracked":true},{"id":"frank","name":"Frank Costigan","role":"Jack’s father","tracked":false},{"id":"maria","name":"Maria Costigan","role":"Jack’s mother","tracked":false},{"id":"nonna","name":"Carmela Rinaldi","role":"Jack’s grandmother","tracked":false},{"id":"gina","name":"Gina Costigan","role":"Jack’s sister","tracked":false},{"id":"rosie","name":"Rosie Costigan","role":"Jack’s sister","tracked":false},{"id":"priya","name":"Priya Raman","role":"4th-floor RA","tracked":false},{"id":"rafi","name":"Rafi Ochoa","role":"Second floor","tracked":false},{"id":"doug","name":"Doug Pruitt","role":"Room 420","tracked":false},{"id":"joey","name":"Joey Abruzzo","role":"Newman regular","tracked":false},{"id":"tyler","name":"Tyler Brandt","role":"Newman missionary","tracked":false},{"id":"fitch","name":"Dolores Fitch","role":"Newman secretary","tracked":false},{"id":"sloane","name":"Sloane Kittredge","role":"Pi Lambda Chi","tracked":false},{"id":"gloria","name":"Gloria Mendes","role":"The Anchor, nights","tracked":false},{"id":"rudy","name":"Rudy Salcedo","role":"Line cook, the Anchor","tracked":false},{"id":"caleb","name":"Caleb Hargrove","role":"PHIL 9H","tracked":false},{"id":"yusuf","name":"Yusuf Noorzai","role":"PHIL 9H","tracked":false},{"id":"wes","name":"Wes Arceneaux","role":"Lena’s boyfriend, Tulane","tracked":false},{"id":"tess","name":"Tess Fontenot","role":"Lena’s sister","tracked":false},{"id":"richard","name":"Richard Vance","role":"Theo’s father","tracked":false},{"id":"brynn","name":"Brynn Vance","role":"Richard’s wife","tracked":false},{"id":"caroline","name":"Caroline Ashby Vance","role":"Theo’s mother","tracked":false},{"id":"poppy","name":"Poppy Vance","role":"Theo’s sister","tracked":false},{"id":"danny","name":"Danny Costigan","role":"Jack’s brother","tracked":false},{"id":"remy","name":"Remy Broussard","role":"Lena’s brother","tracked":false},{"id":"nora","name":"Nora Calloway","role":"Name on a brass plate","tracked":false},{"id":"dale","name":"Dale Wisniewski","role":"A Lions fan at Sully’s","tracked":false},{"id":"peter","name":"Peter Haddad","role":"Newman president","tracked":false},{"id":"kenzie","name":"Kenzie Rourke","role":"Newman cantor","tracked":false},{"id":"bridget","name":"Bridget McNulty","role":"Newman missionary","tracked":false},{"id":"ray","name":"Ray Ochoa","role":"Rafi’s father","tracked":false}],"duels":{},"start":"s01","endCard":{"tag":"“We’d have to be something first, Costigan.”","nextTime":["“Dearly beloved. We are gathered here today to bury a cigarette.”","ALARM WILL SOUND. (It won’t.)","“Bring pie, Costigan. The good pie.”","“This stopped being a game an hour ago.”"]},"scenes":{"s01":{"slug":"FRIDAY · 3:12 AM · DELGADO HALL, THE FRONT LAWN","set":{"rel.laney.warmth":"+1"},"body":["Fifty-eight minutes after *Goodnight, Jack*, Delgado Hall goes off. It’s the goose again, the same flat, outraged horn as the first time, strobes stuttering down every hallway, three hundred and ten freshmen coming down the stairwells in whatever they sleep in. Jack wasn’t asleep, which saves him a step. He goes down the east stairs in yesterday’s flannel and yesterday’s jeans, still smelling faintly of the Hobart, the RAZR shut in his pocket on a text he hasn’t deleted and isn’t going to.","Out on the lawn the fog has come in off the Lagoon to the knee, and it beads on everything wool: sweaters, blankets, one girl’s entire Snuggie. The tide is out, and the Lagoon smells like the back room of a bait shop. The eucalyptus drips. Over in the Anacapa lot the sodium lamps have gone orange in the fog, and everybody standing under them looks jaundiced.","On the lobby steps Priya stands in her Fremont High hoodie with the air horn in one hand and, held over her head in the other like a picket sign for a strike with one member, a single laminate: THE LAWN IS NOT A SOCIAL EVENT. She says nothing. She has said it all in writing.","The roll call is Kevin’s. Clipboard, navy quarter-zip zipped to the sternum over plaid pajama pants, a flag-football voice that carries without yelling. “Pruitt?” Nothing. At the far end of the building Doug Pruitt stands barefoot on the wet concrete with his pillow under his arm. “Pruitt’s here.” Kevin gets to Jack and takes him in from the sneakers up. “Costigan. Present, and fully dressed, at three in the morning.” The pen makes its check. “I don’t ask questions, bro. I just take attendance.”","Margot is off by herself at the edge of the lamplight in a black peacoat over black, visibly not cold, the Moleskine open. She doesn’t look up when he stops beside her. She writes, and tilts the page so he can read it by strobe: ALARM 2. “Eighteen days,” she says. “That’s not a schedule. That’s a person.” She clicks the pen shut and goes back to the crowd, working through it methodically, face by face, left to right.","Theo comes out among the last, barefoot in the navy silk robe, with the gray camera bag on one shoulder and the black one on the other and nothing in his hands. “No espresso machine?” “It’s insured.”","“FIREMAN.”","Laney comes across the lawn with her arms already up. She’s been home two hours from her first night as a Pi Lam, and it shows in the best way: Thursday’s pink PI LAM RODEO tee under the gray Cardinal Mooney hoodie that stopped being Jack’s at the first alarm, the hoodie to her knees, and on top of everything the pink straw cowboy hat, tipped back. “They were *lucky*, fireman,” she says, and gets him around the neck. “You *said*.” She lets go to turn a slow circle on the wet grass, one hand on the hat. “I was adored, sugar. *Professionally*.” Then she takes the hat off, sets it on Jack’s head, squares it with both thumbs and pats the crown. “Hold this.” And she’s off into the fog, yelling somebody’s name.","The hat is still on his head when Lena finds him. The black WHO DAT shirt, the oatmeal cardigan buttoned one hole off, Keds with the laces dragging, her hair up in a knot she did in the dark. She looks at the hat. Then she looks at him under it. “Goodnight,” she says, “was premature.”","She tucks her hands up into the cardigan sleeves. “Becca Lindell wrote on your wall.” He and Lena have been Facebook friends since the first week of classes, and Becca’s post has been up since Tuesday at 12:41 a.m., two exclamation points and a smiley face, for anybody who cared to look. Somebody cared to look. “It’s a beach cleanup, Jack. It is not a date. Bring gloves.”"],"journal":[{"kind":"note","id":"alarm","title":"Fire alarms, 3 a.m.","text":"Alarm 1, Monday the 31st, 3:07: everybody on the lawn in what they sleep in; Theo saved the espresso machine; Margot wrote ‘ALARM 1’ like it was a case number. Alarm 2, Friday the 18th, 3:12: eighteen days. Margot says that’s not a schedule, it’s a person. She’s keeping a log."}],"choices":[{"text":"“Gloves are a big step for me.”","tag":"Wit","set":{"e6_alarm":"gloves","rel.lena.friction":"+1","trait.wit":"+1"},"response":["“Then you’re not ready, Costigan.” She tucks her chin down into the cardigan collar and hums one bar of the Who Dat at the fog.","At 3:36 the strobes quit and the whole building squeaks back across the grass toward the doors. Laney goes in leaning her whole weight on Lena, a parade float being towed home by a much smaller car, and on the way past she lifts her hat off Jack’s head without looking at him and puts it back on her own."],"goto":"s02"},{"text":"“Are you going?”","tag":"Sincerity","set":{"e6_alarm":"going","rel.lena.warmth":"+1","trait.sincerity":"+1"},"response":["“I’m Newman. I’ll be picking up Las Olas’s sins with tongs.” She considers the fog. “They hand out those grabber sticks. I intend to get one before Joey Abruzzo does, or he’ll grab people.”","At 3:36 the strobes quit and the lawn squeaks back inside. Laney comes out of the fog and drapes herself over Lena from behind, every ounce, and Lena takes it without breaking stride. Going past, Laney lifts the hat off Jack’s head, no look, no thank-you, and puts it back where it belongs."],"goto":"s02"},{"text":"“It’s not a date.”","tag":"Candor","set":{"e6_alarm":"notdate","trait.candor":"+1"},"response":["“I know. I’m the one who said so.” She looks out at the fog. If there’s more coming, the strobes quit at 3:36 before it gets there, and the lawn starts squeaking back across the grass toward the doors.","Laney arrives out of nowhere and hangs her whole weight off Lena’s shoulders, and Lena walks her toward the doors like that, a girl wearing a girl. On the way past, Laney lifts the hat off Jack’s head without a glance and puts it back on her own."],"goto":"s02"}]},"s02":{"slug":"FRIDAY · 2:30 PM · HOLLIS 314","body":[{"type":"doc","title":"From: Adrian Hale · To: John Costigan · Thu, Sep 17, 2009, 11:58 PM · Subject: Friday","text":"Mr. Costigan — Friday, 2:30, my office. Bring the O’Connor in your back pocket; I want to see what a man underlines in it. —A.H."},"It went to him alone: no cc line, no seminar. For a man who has never once located the BCC field, that’s practically a sealed letter.","Hollis 314 is at the end of the third-floor hall, behind a door with a pebbled-glass pane and HALE in gold leaf that’s been flaking since the second Clinton administration. Inside, the window is the whole Pacific, blue to the top of the glass, the kelp beds dark under the swell. The carpet is a green nobody chose, with a wine stain by the desk in the exact shape of Italy, boot and all. There are shelves, but the books have left them. They stand in stacks on the floor, knee-high, waist-high, with streets between them and one avenue to the desk: a city with no planning board. On the hook behind the door hangs a leash, and there’s no dog.","Hale is in the linen jacket, the wine on the cuff gone the brown of an old map, his reading glasses pushed up into the silver hair. He doesn’t get up. He holds out one hand, palm up, and it takes Jack a second to understand it isn’t for shaking.","He goes through the O’Connor with a licked thumb for every page, as if it were the racing form, and Jack sits across the desk and watches the most famous atheist in California read his margins. Hale reads them out loud. “‘NO.’ ‘Coward.’ ‘Okay, *fine*.’” He looks up over the pages with open delight. “You write in the margins like a man shouting at a referee.” He turns a page. “So did I.”","Then he reaches behind him without looking, into a stack that ought to fall over and doesn’t, and comes out with a paperback: Bernard Williams, *Moral Luck*, Cambridge, 1981, the spine gone soft as an old shirt. He opens it on the desk. Pencil, all down the margins, in a hand thirty years younger than the one across the desk. *No.* Three pages on: *Bernard, really.* “Bring it back,” Hale says, “with your margins in it.”","Jack takes the Benedict holy card out of the O’Connor, where it has been keeping the Misfit’s place since Sunday, and slides it into the Williams. Hale watches the Pope go into Bernard Williams and keeps his face perfectly still. The Williams goes in Jack’s back pocket, where it fits as if it were built for one.","Hale sits back. The chair complains. He folds his hands on his stomach and considers Jack, pleasantly, as if he were a first edition he hadn’t decided to buy. Then, gently, as if asking the time: “You said no. The lucky one doesn’t sleep.” The glasses stay up in his hair. “How would you know, at eighteen?”"],"journal":[{"kind":"person","id":"hale","title":"Prof. Adrian Hale","text":"Wrote *The Consolations of Disbelief*. Wrote me a postcard. Walked into Hollis 302 at 1:07 with wine on his cuff and asked us to prove we have souls. Saw my face at the Anchor before he could put it to the nine pages. Called me a spaniel. Some nights he drinks alone in the Anchor’s back booth after midnight and says Housman to the window. Tips like he’s apologizing. Wrote his doctorate on moral luck. Asked me if the lucky one sleeps. Lent me his own copy of Williams’s *Moral Luck*, his Oxford pencil arguing with Williams in the margins on a first-name basis. Wants it back with mine in it."}],"choices":[{"text":"“My brother’s in prison.”","if":"trait.sincerity>=25","tag":"Sincerity","cue":"Hale will remember that.","set":{"e6_hale":"danny","e6_hale_danny":true,"rel.hale.warmth":"+2","soul.honesty":"+1","trait.sincerity":"+1"},"key":"You told Hale your brother is in prison.","response":["He gives Hale the version he gives anybody who gets one. A fight. A guy got hurt bad. Five years. Danny pleaded.","For once nothing clever is waiting on Hale’s face. What arrives first is plain decency, and it’s a while before anything follows it in. People ask how long. Hale asks, “What do you send him?” “A book a month. Used. They make me erase the margins.”","Hale takes the glasses down out of his hair and holds them by one arm. “Erased,” he says. Then: “That is the most obscene thing I’ve heard this week, and I have read the Baucus draft.” Somewhere under the window a lawnmower starts up and quits. “Thank you for telling me, Mr. Costigan.” He puts the glasses back up on his head, where he’ll lose them by five."],"goto":"s02b"},{"text":"“My dad’s been laid off since June. I know what a man looks like who doesn’t sleep.”","tag":"Candor","set":{"e6_hale":"shift","rel.hale.warmth":"+1","trait.candor":"+1"},"response":["Hale looks at him across the stacks. “Do you,” he says, and leaves it a statement. He doesn’t push. The pen stays where it’s lying on the blotter. He looks out at the water, and Jack looks at the leash on the hook, and the garage on Glenwood Avenue sits in the room with them, the radio on low, a man in a folding chair at two in the morning.","Then Hale asks what Jack made of Williams’s lorry driver, and they talk about that instead."],"goto":"s02b"},{"text":"“I read ahead.”","tag":"Wit","set":{"e6_hale":"wit","trait.wit":"+1"},"response":["“Nobody reads ahead in my class, Mr. Costigan. They read *around*.” He lets Jack have it. He tips back in the complaining chair and enjoys it openly, and the enjoyment is the price: Jack gets out from under the question, and Hale gets to watch him do it."],"goto":"s02b"},{"text":"“It’s a seminar, Professor. I argued the side.”","tag":"Control","set":{"e6_hale":"side","rel.hale.friction":"+1","trait.control":"+1"},"response":["“No,” Hale says, “you didn’t.” And then, as if he hadn’t said it, he’s off on Gauguin: Williams’s Gauguin, who leaves a wife and five children for Tahiti, and if the paintings are bad he’s a shit, and if they’re good he’s still a shit but a justified one, and nothing he decided on the dock decides which. “Justified by the weather, Mr. Costigan. Isn’t that monstrous? I’ve loved it for thirty years.”","He talks for a full minute, beautifully, and never once looks at Jack."],"goto":"s02b"}]},"s02b":{"slug":"FRIDAY · 3:58 PM · HOLLIS HALL, THE FRONT STEPS","body":["At four minutes to four Hale gets up, which he hasn’t done in an hour and a half, and walks Jack to the door through the streets of books. He stops with one hand on the frame.",{"if":"e6_hale==\"wit\" || e6_hale==\"side\"","text":"“Miss Broussard was here at two,” he says. “She also didn’t want to talk about why.”","else":"“Miss Broussard was here at two,” he says. “She didn’t want to talk about why.”"},"“Her paper is the best thing a freshman has handed me in ten years. You’ll not tell her I said so. She’d be unbearable.” The door is already closing. “And she’d be right.”","Outside, the Hollis steps are warm through his jeans. Bougainvillea comes down over the arcade in a magenta landslide, and below it the Commons is full of four o’clock sun, a Frisbee, a kid asleep under the *Tide*. The RAZR has been buzzing in his back pocket for twenty minutes. He opens it to the angle where the screen works.",{"type":"sms","from":"THEO VANCE (IMPORTANT)","text":"412. Made you something. Come look. Bring nothing. —T.V.","time":"3:41 PM"},{"type":"sms","from":"(503) 555-0193","text":"I NEED A PALLBEARER. MISSION ST. NOW. —M","time":"3:58 PM"},"A Portland number he never saved, because she has never once used it on him. The Nokia doesn’t do lowercase, and neither does Margot."],"choices":[{"text":"Back to 412. Theo made something.","tag":"Go","set":{"e6_fri":"theo"},"goto":"s03a"},{"text":"Mission Street. Somebody has to carry the coffin.","tag":"Go","set":{"e6_fri":"margot"},"goto":"s03b"}]},"s03a":{"slug":"FRIDAY · 4:05 PM · DELGADO HALL, ROOM 412","body":["Theo is cross-legged on his bed in a gray cashmere sweater with the MacBook Pro on his knees, the 5D’s card reader trailing off one side of it and the iPhone tethered to the other, and on the screen is a timeline in Final Cut, stripes of color stacked up like a layer cake. He doesn’t look up. “Sit. Not on the bed. The bed is the edit bay.”","It’s called WEEK ONE, in a title card Theo has spent longer on than any paper: the beach below the bluff that first Friday, firelight, Laney informing the Pacific *who dat*; Sully’s on Sunday, the brass bell, Laney on the table in sequins. The cuts land on the beat. A shot of Kevin catching a falling fry holds exactly as long as it’s funny and not one frame longer. Theo is good at this. Jack can tell how good by how hard he’s working to look bored. “It’s for a class,” Theo says. “What class?” “The class I’m taking in my room.”","Jack takes Theo’s grandfather’s cufflinks out of the top drawer, where they’ve been since Sunday, gold, plain, heavy for their size, and sets them on Theo’s desk. Theo glances over. “Keep them for the Eagles.” “They’re your grandfather’s.” “He’d have liked the Eagles less.” Jack leaves them on the desk anyway, side by side, where Theo can look at them or not.",{"type":"sms","from":"Gina","text":"i said it. danny. she looked away first. then she said something to kelsey and they laughed anyway. but she looked away FIRST. tell the nun","time":"4:12 PM"},"He reads it standing up. Then he turns the RAZR around and holds it out, and Theo takes his hands off the keyboard. “A girl at school said something about Danny,” Jack says. “Gina said his name back.” Theo reads to the end. “Your sister,” he says, “is a killer.” Then the eyebrow. “The nun?” “Nonna’s word. Same girl as the veil girl.”","Theo’s face lights up for about a second: the nun and the veil girl, one girl. Then it goes, and what replaces it is shorter. “Has she met him?” “Thursday. On the bench. She said hi.” Theo nods once. “Good.”","He drags the playhead without asking. “Forty seconds. I was going to wait till it was finished.” He drops it to quarter speed. Sully’s, halftime, from table height: the iPhone propped against the ketchup the whole time, apparently, while Jack thought Theo was just sitting there with his chin on his fist. Lena leaning across the booth with Laney’s gold pencil. Her hand along Jack’s jaw, her thumb at the corner of his mouth. The stroke of gold going on, slow as poured honey at this speed. And Jack, on a laptop screen in Room 412, holding absolutely still, the way you hold still when a bird has landed on you and you’d like it to stay.","Theo freezes it on a frame. “Freeze-frame,” he says. “Very Antoine Doinel. Look at your face, Costigan.” Jack looks. He’d rather not have. Theo keeps his eyes on the screen. “What are you doing?”"],"journal":[{"kind":"person","id":"gina","title":"Gina","text":"My sister. Fifteen, a sophomore at Ursuline. Texts in lowercase like punctuation costs extra. A girl in religion class called her the class expert on visiting the imprisoned. Dad turned the radio back on. Nonna told the altar society I went to confession. Gina wants to know if the nun is real. Said Danny’s name back to the girl. The girl looked away first. Then laughed with Kelsey anyway. Gina wants the first part on the record."}],"choices":[{"text":"“I don’t know.”","tag":"Sincerity","cue":"Theo will remember that.","set":{"e6_theo_cut":"dontknow","rel.theo.trust":"+1","resolve.jack":"+1","trait.sincerity":"+1"},"key":"You told Theo you don’t know what you’re doing.","response":["Theo nods slowly. “Okay,” he says. “That’s the right answer. It’s also the worst one.” He saves the cut, Command-S, the little wheel turning, and closes the file.","Then he’s himself again, stretching until his spine cracks. “Sloane Kittredge has invited me to a barn. Tomorrow night, Pi Lam, Laney’s first party as a sister. I’ll be wearing hay.” “I work till one.” “Then come at one. Barns don’t close.”"],"goto":"s04"},{"text":"“She’s taken, Theo. I’m not doing anything.”","tag":"Candor","set":{"e6_theo_cut":"taken","trait.candor":"+1"},"response":["“That’s what I mean,” Theo says, and closes the laptop with one finger. The screen goes, and the room is only the room again, late sun lying across the crucifix over Jack’s bed.","Theo lies back on the edit bay. “Sloane Kittredge has invited me to a barn. Tomorrow night, Pi Lam, Laney’s first party as a sister. I’ll be wearing hay.” “I work till one.” “Then come at one.” He’s already back in the timeline. “Barns don’t close.”"],"goto":"s04"},{"text":"“Making you a star.”","tag":"Wit","set":{"e6_theo_cut":"star","rel.theo.warmth":"+1","trait.wit":"+1"},"response":["Theo laughs and scrubs back to the top, to the title card, and lets WEEK ONE run again from the beginning, Laney and the Pacific, the bell at Sully’s, every frame of it where he left it. “You’ll need representation,” he says, watching his own cut with frank love.","“Sloane Kittredge has invited me to a barn, by the way. Tomorrow night, Pi Lam, Laney’s first party as a sister. I’ll be wearing hay.” “I work till one.” “Then come at one. Barns don’t close.”"],"goto":"s04"}]},"s03b":{"slug":"FRIDAY · 4:20 PM · MISSION STREET, HARBOR SMOKE & CIGAR","body":["Harbor Smoke & Cigar has never been within a mile of the harbor. It’s at the near end of Mission Street, where the road comes off Ocean Road past the campus gate, in a stucco strip between a laundromat and a tattoo parlor called Neptune’s. It’s three miles. La Flaca gets him there in twenty minutes, the coaster brake shrieking at every light on Mission.","Inside it’s cedar and cold and dim, the humidors along one wall glowing like aquariums, a bell over the door that goes on faintly ringing after it shuts. Margot is at the counter in black with the peacoat over her arm and a coin purse open on the glass. The clerk, sixties, cardigan, reading glasses on a chain, has been selling her cloves since August, and today he speaks to her softly, as if there’s been a death. “Tuesday,” he says. “The twenty-second. After that it’s menthol or nothing. Congress.” He sets a carton on the glass and rests his palm flat on top of it. “That’s the last Djarum Black between here and San Luis Obispo.”","Margot pays to the cent: bills unfolded from the coin purse one at a time, then quarters, then two dimes, then a nickel she has to dig for. The clerk waits with his hands folded. She takes the carton, turns, and hands it to Jack. “At shoulder height,” she says. “You’re a pallbearer. Conduct yourself.”","Out on the sidewalk she gives him the arrangements. “The wake is Tuesday. The Delgado roof, at sundown. Bring the other Catholic.” She checks the sky. “Rosh Hashanah starts tonight, incidentally. My father observes it as a seminar. There’s a reading list. There’s an apple.” The RAZR has had a text in it since somewhere on Ocean Road. He gets it out.",{"type":"sms","from":"Gina","text":"i said it. danny. she looked away first. then she said something to kelsey and they laughed anyway. but she looked away FIRST. tell the nun","time":"4:12 PM"},"Margot reads it upside down off the RAZR while he’s still reading it right side up, and says nothing about it at all.","She’s going to the chastity talk at Newman tonight. “For the *Tide*,” she says. “There’s no faith page. There will be.” They start for the bus stop at the corner, bearing the carton like a very small casket, at a height she keeps correcting with one finger. Halfway there, without changing her tone in the slightest, she says, “Why wait?” He looks at her. She keeps her eyes on the street. “Actually. Not the pamphlet.”"],"journal":[{"kind":"person","id":"gina","title":"Gina","text":"My sister. Fifteen, a sophomore at Ursuline. Texts in lowercase like punctuation costs extra. A girl in religion class called her the class expert on visiting the imprisoned. Dad turned the radio back on. Nonna told the altar society I went to confession. Gina wants to know if the nun is real. Said Danny’s name back to the girl. The girl looked away first. Then laughed with Kelsey anyway. Gina wants the first part on the record."}],"choices":[{"text":"Give her the real case. No pamphlet.","tag":"Sincerity","set":{"e6_margot_wait":"case","rel.margot.trust":"+1","rel.margot.warmth":"+1","trait.sincerity":"+1"},"response":["So he gives her his own. That the body isn’t a rental. That he isn’t scared of wanting: the wanting is *good*, the wanting is the whole point, it’s about the best thing anybody ever made, and that’s exactly why you don’t hand it out on Mission Street like a flyer for somebody’s band. That he’d like it to mean what it says when he finally says it. He hears himself getting loud on a public sidewalk at four in the afternoon with a carton of clove cigarettes held at shoulder height, and keeps going anyway.","Margot hears him out the whole way to the bus stop. There she takes the carton back. “Lena said the same thing,” she says, “with more Latin.” So they’ve had this one out without him. He finds he’d have paid to watch."],"goto":"s04"},{"text":"“Half the time I don’t know if I can.”","tag":"Candor","cue":"Margot will remember that.","set":{"e6_margot_wait":"cant","rel.margot.trust":"+2","soul.honesty":"+1","resolve.jack":"+1","trait.candor":"+1"},"key":"You told Margot the truth: half the time you don’t know if you can wait.","response":["Margot says nothing. They reach the stop. The bus comes in and kneels at the curb with a long hydraulic sigh, and opens, and waits, and nobody gets on, and the driver gives them a look and closes up and pulls away.","Margot watches it go. “That’s honest,” she says. “From a Catholic. On the subject.” She doesn’t write it down. She takes the carton back out of his hands, carefully, at shoulder height, and holds it against her coat while they wait for the next one."],"goto":"s04"},{"text":"“Cloves are banned in four days. Some of us plan ahead.”","tag":"Wit","set":{"e6_margot_wait":"joke","rel.margot.warmth":"+1","trait.wit":"+1"},"response":["Margot nearly laughs. He watches it get as far as the corner of her mouth and get turned back at the border. “Coward,” she says, almost fondly.","At the bus stop she takes the carton back and holds it against her chest, squared and level, like a folded flag."],"goto":"s04"}]},"s04":{"slug":"FRIDAY · 7:30 PM · NEWMAN HOUSE, THE LOUNGE","music":"Jason Mraz & Colbie Caillat — “Lucky”","body":["Newman House smells like burnt coffee and powdered sugar. Forty folding chairs face a bedsheet thumbtacked over the shelves of donated books, and a borrowed projector balanced on the ping-pong table — net still dead — throws the title slide up onto it, slightly purple at the edges: LOVE IS PATIENT: OUR CHASTITY STORY, and under that, in a cursive font somebody chose on purpose, *Love is patient and kind. — 1 Cor 13:4.* The 1994 plaid couch has been shoved against the wall to make room. Mrs. Fitch’s lemon bars sit by the door on a paper doily, each one squared off to the next.","Tyler Brandt works the door with a linebacker’s receiving line: a fist bump, a shoulder squeeze, a name. “Brother.” He keeps Jack’s fist a second to make sure it took. “Bridget’s on tech. Sit anywhere. Sit close.” Bridget is a soft-spoken woman in a Franciscan University sweatshirt at the laptop, clicking a test slide forward and back, forward and back, very carefully.",{"if":"e6_fri==\"margot\"","text":"Margot came in with him. She takes the aisle seat two down from Kevin Tran with her canvas tote on her lap and the carton of Djarum Blacks inside it, her hands folded on top, like the bereaved in the front pew.","else":"Margot arrives at 7:34, alone, in the black peacoat, with a reporter’s notebook and a pen she clicks once in the doorway — “For the *Tide*” — and takes the aisle seat two down from Kevin Tran as if it had her name on it."},"Lena is in the back row in the oatmeal cardigan, two lemon bars on a napkin on her knee. She moves her bag off the chair beside her without looking up, and Jack sits in it.","Peter Haddad tells it in his lector voice, in a polo shirt, the clicker in one hand and the other in his pocket, already a congressman. Kenzie Rourke stands beside him, kind and pretty, in a cardigan the projector turns lavender. A Steubenville youth conference, summer 2007: two thousand teenagers and a praise band in a gym in a town Jack has driven through, which is hard to picture anybody falling in love in. Peter saw her across the gym during adoration. “I knew,” he says. “And we chose to wait.” Bridget clicks. Disneyland: the two of them in front of the castle in mouse ears, sunburned and younger, and up through the laptop speakers come Jason Mraz and Colbie Caillat, harmonizing about how lucky they are. Somebody in the third row says *aww* without irony. Kenzie’s cousin’s wedding: Kenzie in sage chiffon, Peter in a rented vest. Peter explains custody of the eyes. He demonstrates it, looking at the floor.","Joey Abruzzo’s hand has been up since the castle. “Is it a sin to think about a girl in a mantilla?” A pause, in which Joey’s face reaches for precision. “*Generally.*” Two rows up a guy in a Cabrillo Hall shirt turns around in his chair to look at Lena. Lena looks back at him until he faces front.","Becca Lindell is front and center with a spiral notebook, a braid down her back as thick as a bell rope. “How do you stay friends with your own body?” she asks. “I grew up around animals. Bodies aren’t the enemy. I don’t want to treat mine like it is.” It is a real question, and Kenzie answers it before Peter can, and well: you feed it and you rest it and you thank it, and you tell it no sometimes, the way you tell anybody you love no. Then Peter lifts the clicker. “And guys —” he aims it at the room — “your future wife is out there *right now*.”","Kevin smiles all the way through that, the whole big smile. Two seats down from him, Margot isn’t looking at the bedsheet. She’s looking at Kevin.","Lena leans an inch toward Jack and says, low, out of the side of her mouth, “It’s true, and they’re selling it like a timeshare.” “Two nights in Orlando,” Jack says, “if you sit through the presentation.”","Q&A. Margot stands. She crosses to the shelf, takes down the lounge’s donated Bible — an Ignatius RSV with a Newman bookplate inside the cover — finds the page without hunting for it, and reads aloud in the voice of a flight attendant doing the exits. “*Wives, be subject to your husbands, as to the Lord. For the husband is the head of the wife as Christ is the head of the church… As the church is subject to Christ, so let wives also be subject in everything to their husbands.*” She keeps a finger in the page. “Kenzie. Do you plan to submit?”","The room makes a sound like a held breath at a free throw. Kenzie crosses the carpet, takes the Bible from Margot — gently, the way you’d take a baby from a stranger — and reads back up the page. “*Be subject to one another out of reverence for Christ.*” Then down it. “*Husbands, love your wives, as Christ loved the church and gave himself up for her.*” She closes it on her own finger. “So yes. I’ll submit to a man exactly as far as he’s already laying his life down for me. And I’ll know how far that is, because he’ll have been doing it every day before anybody asked me.” Margot looks at her. “That’s a better answer than the text deserves,” she says, and sits.","Peter steps in to close it, warm and practical; he has fielded this at three Newman retreats. “Practically? When we can’t agree, I make the call. Prayerfully.”","Kenzie’s smile holds exactly where it is. Her eyes go to the carpet. The silence after that is the long, specific silence of forty Catholics who have all heard the same thing, and it goes on until Kevin Tran is on his feet with Mrs. Fitch’s plate from the door. “Okay! Who’d like to submit to a lemon bar?” The room breaks, grateful, and the plate goes down the row.","Lena turns her head. Jack is already looking at her. The Sunday before either of them left home, August twenty-third, every Catholic church in the country read the same second reading, and it was this one. “Back home,” Jack says, “Father Bruno skipped the homily on it.” “Ours didn’t,” Lena says. They look at each other across an argument with no floor in it. “Not tonight,” she says. “Not tonight,” he says. Up front, Tyler claps once. “Time for one more!”"],"journal":[{"kind":"note","id":"talk","title":"Love Is Patient","text":"Peter Haddad and Kenzie Rourke, Newman’s it couple, tell their chastity story with a slideshow: Steubenville, 2007; Disneyland; a cousin’s wedding. Margot read them Ephesians. Kenzie answered with verse 25, better than the text deserved. Peter makes the call. Prayerfully."}],"choices":[{"text":"Raise your hand. “What do you do when you fall?”","if":"trait.candor>=18","tag":"Candor","cue":"Kenzie will remember that.","set":{"e6_talk":"fall","e6_asked_fall":true,"rel.lena.trust":"+1","trait.candor":"+1"},"key":"At the chastity talk you asked Peter and Kenzie what they do when they fall.","journal":[{"kind":"note","id":"talk","title":"Love Is Patient","text":"Peter Haddad and Kenzie Rourke, Newman’s it couple, tell their chastity story with a slideshow: Steubenville, 2007; Disneyland; a cousin’s wedding. Margot read them Ephesians. Kenzie answered with verse 25, better than the text deserved. Peter makes the call. Prayerfully. I asked what they do when they fall. Peter said they haven’t had to find out. Kenzie looked at her hands."}],"response":["He puts his hand up from the back row and asks it: what do you do when you fall. Every folding chair in the room creaks around to look at him.","Peter doesn’t need a second. He smiles, warm, immediate, the clicker easy in his hand. “By God’s grace, we haven’t had to find out.” His thumb keeps working the clicker button after he’s said it, and the slide doesn’t change. Beside him Kenzie looks down at her hands.","When Jack faces front again Lena is studying him. Tyler is already thanking everybody for coming."],"goto":"s04b"},{"text":"Lean over. “Margot’s going to need a bigger whiteboard.”","tag":"Wit","set":{"e6_talk":"whisper","rel.lena.warmth":"+1","trait.wit":"+1"},"response":["Lena has just taken a bite of lemon bar. She makes a small sound through her nose and folds forward over the napkin with her whole body, shoulders going, eyes squeezed shut, while powdered sugar comes down the front of the oatmeal cardigan like a light snow. She gets one hand flat over her mouth and with the other hits Jack in the arm, hard, and keeps her face turned away from him so he can’t see what it’s doing.","Up front, Joey’s index card is getting answered over the top of her. “Is CatholicMatch like a —” “No,” says Peter. When Lena finally sits up she brushes at the cardigan in short, furious strokes and doesn’t look at Jack for the rest of the evening, and the sugar is still in the cable knit when Tyler starts stacking chairs."],"goto":"s04b"},{"text":"Watch Kenzie while Peter takes the last question.","tag":"Sincerity","set":{"e6_talk":"kenzie","soul.grace":"+1","trait.sincerity":"+1"},"response":["The last question is Joey’s, off an index card. “Is CatholicMatch like a —” “No,” says Peter, and gets a laugh, and runs with it.","Jack watches Kenzie instead. She stands a half step behind Peter with the Bible still closed on her finger, smiling when the room laughs, and between laughs her face empties out the way a face does at the end of a double shift. She keeps the smile ready for the next laugh, and it comes, and she puts the smile on for it, and she is so tired that for a second Jack has to look at the bedsheet instead."],"goto":"s04b"}]},"s04b":{"slug":"FRIDAY · 9:04 PM · NEWMAN HOUSE, THE FRONT STEPS","body":["Becca catches him in the doorway with the spiral notebook against her chest and a pen behind her ear. “Nine a.m. Campus Point. You’re on my team.” She taps the notebook where his name presumably is. “I put you down.” And she’s gone back inside to help Bridget wind up the extension cord before he can tell her he owns no gloves.","Out on the steps the Grove is all creak and menthol in the dark. Margot lights a clove — four days left of legal — and points it at Lena. “My problem isn’t the theology. The theology I can at least footnote. My problem is that every slide was about a girl as a present. Wrapped. Kept nice. Commodified — yes, I said commodified, I’m in college. Handed to the right man on the right day so he can open her. Which means the girls who don’t make it to the day are damaged goods, and you know who pays for that? Not Peter. Peter gets forgiven by the third slide. And the one sentence they aimed at the boys was about a girl. *Your future wife is out there.* Not one slide about what the boys do.”","“You’re right about the boys,” Lena says at once. “And you’re right about who pays. I went to an all-girls school, Margot, I watched who paid.” She comes down a step to be level with her. “You’re wrong about the present. Nobody *unwraps* you. *Gaudium et spes*, twenty-four: man cannot fully find himself except through a sincere gift of himself. *Of* himself, Margot. The self does the giving, when she decides to, because it’s hers — that’s the whole point of calling it a gift. The slideshow got that wrong, and you took the slideshow’s word for it.” Margot exhales clove at the eucalyptus. “I’m quoting you.” “Spell Broussard right.”",{"if":"e6_fri==\"margot\"","text":"Margot reaches into the tote and lays the carton across Jack’s forearms. “Pallbearer duties resume Tuesday.” Then she and Lena go down the steps together toward Ocean Road, still at it, the clove smoke going on ahead of them, and Jack stands under the porch light holding twenty packs of contraband at shoulder height, as instructed.","else":"Then she and Lena go down the steps together toward Ocean Road, still at it, the clove smoke going on ahead of them. Behind Jack, Mrs. Fitch turns off the lounge lights one switch at a time and asks Bridget whether anybody has seen her doily."}],"next":"s05"},"s05":{"slug":"SATURDAY · 8:52 AM · CAMPUS POINT, THE BEACH","music":"Kings of Leon — “Use Somebody”","set":{"rel.kevin.warmth":"+1"},"body":["The marine layer sits on Campus Point like a lid. Low tide has pulled the water back a long way and left a wrack line the length of the beach: kelp in brown ropes, sand fleas going up off it in little bursts, bottle caps, a pink flip-flop, a snarl of fishing line with the hook still in it, and cigarette butts by the hundred, ground into the sand like seeds. Some of them are Reds. Jack picks those up first.","Forty volunteers in matching gray shirts — ST. BRENDAN’S · CARE FOR CREATION — stand around five-gallon buckets with trash grabbers, and somewhere in one of the buckets Joey Abruzzo’s iPod speaker is playing Kings of Leon, the bucket making it sound like a stadium in a cave. It’s the state’s Coastal Cleanup Day too; Becca registered the site, and the tally card is clipped to her clipboard under the sign-in sheet.","Becca has the clipboard and a whistle she does with her teeth and her tongue, no hands, that could move a herd off a county road. Before she can get to Jack with the spare gloves, Kevin Tran is in front of him holding out a pair of gray canvas work gloves, new, the price sticker still on the cuff. “I brought six,” Kevin says. “I’m a planner.” Becca arrives a step behind with a pink pair held out. “Next time,” she says, and makes a note.","She does the pairings off the clipboard. Kevin with Bridget, who has her sleeves rolled and a bucket on each arm. Lena with Joey, thirty yards down the sand. Becca with Jack. “Seating chart,” she says, without a blush.","So he works beside Becca Lindell for two hours, and it is not a date, and she treats it like one with total, cheerful frankness. She asks how many kids he wants, and when he says he’s never thought about a number she tells him hers. “Seven. Or nine.” She bags a Styrofoam cup. “Odd numbers, so there’s a tiebreaker.” “What are they voting on?” “Everything. Dinner. Names. Whether Dad gets to sell the truck.” Five brothers and two sisters, and the oldest sister’s the one you’d be scared of. A ranch on the Rathdrum road. A calf she pulled at twelve, in February, in the dark, by flashlight, her arm in to the shoulder and her father holding the light and saying *pull* and *wait* and *pull*. She tells it the way other girls tell the plot of a movie. Then she asks him about his prayer life, and she asks it like a person, not like Tyler. “What do you pray when you can’t think?” “Hail Mary,” Jack says. “It runs on its own.” Becca nods. “Glory Be, for me. It’s short. You can get through it while a cow’s kicking you.”","Thirty yards down, Joey’s voice carries without trying: Dunwoodie, a girl from Cabrillo with a nose ring, Dunwoodie again. Lena is in sight the whole time, a fixed point in the long gray morning, bending, straightening, her hair tied up in a cotton scarf against the damp.","Near the bluff, in the kelp, something small and clear catches the light — collapsed, glistening, the size of a fist. Jack has been reading about the moon jellies that wash up after a spring tide. He gets it with the grabber, carefully, so as not to tear it, and lifts it up to show her.","It is not a jellyfish. It is, unmistakably, Friday night on Las Olas.","Becca looks at it on the end of his grabber. Then she reaches over, takes it off the jaws with her gloved hand, and drops it in her bag. “I’ve pulled a calf,” she says. “Give it here.” Thirty yards down the beach, Lena, who saw the whole thing, sits straight down in the wet sand, laughing, while Joey asks what’s funny.","Later she comes up the beach toward the buckets with a full bag over her shoulder and sand on the seat of her jeans, and doesn’t slow down. “*Caritas in Veritate,* forty-eight,” she says, passing. “The Pope says the beach is a gift.” “Forty-eight through fifty-one,” says Jack, who has the encyclical in a milk crate under his bed. Lena considers the grabber in his hand, and what it was holding an hour ago. “He’s right about the beach,” she says. “I’ll give him the beach.” She keeps going.","At noon the fog starts to lift and Becca blows the whistle. They rinse the grabbers at the waterline, shin-deep, the Pacific so cold it aches in the ankle bones, sand going out from under their heels with every wave. Becca wrings out the hem of her shirt and looks at him sideways with the water around them. “How’d you get the scar?”"],"choices":[{"text":"“I walked into the Pacific Ocean.”","tag":"Wit","set":{"scar_told_becca":"pacific","rel.becca.warmth":"+1","trait.wit":"+1"},"key":"You told Becca the scar came from walking into the Pacific.","response":["Becca looks down at the Pacific Ocean, which is currently around both their shins. She looks at his eyebrow. She looks at the Pacific again.","“That’s a lie,” she says. “Is it a nice lie?” She lets a wave go past. “Because I don’t mind a nice one, as long as I get the real one later.”"],"goto":"s06"},{"text":"The Franciscan who plays dirty in pickup.","if":"trait.charm>=9","tag":"Charm","set":{"scar_told_becca":"franciscan","rel.becca.warmth":"+1","trait.charm":"+1"},"key":"You told Becca a Franciscan gave you the scar in a pickup game.","response":["He gives her the friar: a brown habit hiked up into a rope belt, sandals on blacktop, an elbow he never saw coming. Becca’s whole face opens.","“My brother Eli lost a front tooth to a Benedictine,” she says. “Church picnic. Volleyball. Father Anselm. He still says he was going for the ball.” She shakes water off the grabber. “It’s always the monks. Nobody warns you about the monks.”"],"goto":"s06"},{"text":"“A fight. A long time ago.”","tag":"Candor","set":{"scar_told_becca":"fight","rel.becca.trust":"+1","soul.honesty":"+1","trait.candor":"+1"},"key":"You told Becca part of the truth: a fight, a long time ago.","response":["She takes it straight, like everything else this morning. She nods once, a short ranch nod, and rinses the grabber jaws in the next wave.","“Okay,” Becca says. They walk up out of the water with their jeans dark to the knee, and she bumps his shoulder with hers, once, going up the sand."],"goto":"s06"},{"text":"“Long story.”","tag":"Control","set":{"scar_told_becca":"none","trait.control":"+1"},"response":["Becca isn’t put off in the slightest. She tucks the clipboard under her arm, out of the spray.","“I like long stories,” she says. “I grew up with no TV and ten people at dinner. Later.” And she writes something on the back of the tally card that he can’t read from where he’s standing."],"goto":"s06","key":"Becca asked about the scar. You said it was a long story."}]},"s06":{"slug":"SATURDAY · 12:40 PM · ST. BRENDAN’S COURTYARD","body":["The Welcome BBQ is a rented propane grill, a folding table of hot dogs and burgers and veggie patties sweating in their plastic, two watermelons, a Costco sheet cake that says WELCOME HOME in blue gel, lemonade in orange coolers, and name tags on masking tape. In the shade of the olive tree a sophomore with a guitar is working through “All Are Welcome” for the third time, with feeling.","Fr. Osei has the grill, clerical shirt, sleeves rolled, the rubber boots on. He raises the tongs for silence and begins the grace, and halfway through it the 1962 sprinkler under the olive tree coughs twice and comes on full, and soaks the potato salad, the guitarist and the front of the line. Osei finishes the grace without hurrying. Then he looks at the sprinkler with great affection. “Even the sprinkler is Catholic,” he says. “It could not wait for the Amen.”","Tyler finds Jack in the line, wet to the elbow. “Coffee. This week. Your prayer life.” “Wednesday,” Jack says, and Tyler fist-bumps him like Jack has signed with his team.","Mrs. Fitch has a table of her own by the rectory steps, the lemon bars in rows, and when Jack comes around the end of the line with two hot dogs she has company: Lena with a paper plate, Bridget, a pair of nursing girls, and Becca, sunburned along the part of her hair, with her back to him. “I told my mother this was a date,” Becca is telling the table, cheerfully, cutting a lemon bar in half with a plastic knife. “She’s very happy. She’s lighting a candle in Coeur d’Alene.” Mr
