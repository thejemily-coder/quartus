says, “and I’ll do the windows.” The kitchen goes very still. Richard turns in the doorway with his eyebrows up, and then he laughs, pointing at Jack with the BlackBerry. “This one I like.” He comes back, peels a second hundred off the clip, and tucks it in on top of the first. Jack has two hundred dollars in his shirt pocket and a problem, and the problem is standing at the island holding half an orange and not looking at him."],"goto":"s10b"}]},"s10b":{"slug":"SUNDAY · 5:58 PM · THE VANCE HOUSE, THE DECK","body":["They all end up out on the deck to see him off, as if he were a relative. The Range Rover backs up the drive with Steely Dan coming out of it again. Brynn waves from the passenger side with her whole arm, a real wave, and Lena waves back. Richard doesn’t look up from the BlackBerry. The hedge closes behind them. The dinner is in the Colony.","Margot looks at the Nokia. “Six minutes, fourteen seconds.” Theo nods, his hands in his pockets, his eyes on the empty drive. “He’s slipping.”",{"type":"doc","title":"Margot’s Moleskine, open on the rail","text":"R. VANCE. Arr. 5:52. Dep. 5:58.\n6:14.\nCalls son: Teddy.\nGuests’ names learned: 4 of 5. Used: 4.\nOne (1) attempt to tip a guest.\nDenise Okafor, Story Dept., 19 yrs."},"Then Laney walks up behind Theo, puts both hands flat between his shoulder blades, and shoves him into the pool in his four-hundred-dollar T-shirt.",{"if":"e3_hundred==\"theo\"","text":"He goes in sideways and enormous, and Richard Vance’s hundred goes in with him, in the front pocket of his jeans.","else":"He goes in sideways and enormous, sunglasses and all."},"He comes up laughing — a real laugh, all the way out, water streaming off his hair — and then he stops swimming and turns over and floats on his back in the middle of the pool with his arms out, in his clothes, looking straight up at the sky, smoke-yellow, one plane crossing it very high. He stays there. Nobody calls to him. The pump hums.","“Somebody had to,” Laney says, to no one, and sits down on the edge with her feet in the water.","Kevin goes inside and comes back with a towel, a big one, white, and folds it once and leaves it on the coping at the shallow end, where Theo will find it when he wants it, and goes back in."],"journal":[{"kind":"person","id":"richard","title":"Richard Vance","text":"Theo’s father. Learned everybody’s name in one pass but mine; thought I came with the caterer. Calls him Teddy. Stayed six minutes, fourteen seconds. Margot timed it."}],"next":"s11"},"s11":{"slug":"SUNDAY · 9:10 PM · THE VANCE HOUSE, THE DECK","duel":"labor","set":{"duel.labor.lena":3},"body":["The fire pit on Richard’s deck burns gas up through blue glass, which Lena calls a sin against firewood and sits beside anyway, knees up under the cardigan, last night’s pie on the arm of her chair. A waning moon is coming up over the shoulder of the Santa Monica Mountains, orange with smoke, a day or two past full. Below the boards the Pacific is black and loud, all sound and no sight.","She sets the plate down. “Costigan.” Talk around the fire dies in stages. “I owe you a Sunday.” She looks at the moon, then back at him. “It’s Sunday.” Laney wants to know the score. “He’s up two–nothing on the season,” Lena says, pushing her sleeves to the elbow, “and I don’t care for it.”","Margot appoints herself moderator, Nokia stopwatch up. “Four rounds. Ninety seconds. I’m grading for coherence and complicity.” Laney is ring girl, with a pool noodle over one shoulder and the cardboard flap off Kevin’s case of Arrowhead, ROUND 1 in Sharpie. Kevin keeps score on his BlackBerry. Theo is still in the jeans he went into the pool in three hours ago, his hair gone stiff with chlorine. “Changing would be a concession,” he says, and rises to make a presentation.",{"if":"e3_hundred==\"kept\"","text":"He plucks the folded bill out of the *Brideshead* on the arm of Jack’s chair, flattens it on the teak with the side of his hand, and weights it with a citronella glass. “Exhibit A.”"},{"if":"e3_hundred==\"returned\"","text":"He holds an empty palm up to the firelight. “Exhibit A has left the building. It’s back in my father’s pocket. He was thrilled.”"},{"if":"e3_hundred==\"theo\"","text":"He peels a sodden hundred out of the front pocket of the jeans and lays it on the teak beside the fire, where it begins, faintly, to steam. “Exhibit A. It’s been through the pool.”"},{"if":"e3_hundred==\"two\"","text":"He holds out his hand until Jack surrenders the money, then fans the two hundreds on the teak like a hand of cards he intends to win with. “Exhibit A. And its little brother.”"},"Lena leans forward into the blue light, elbows on her knees, and opens.","“You were *tipped*, Costigan. How does it feel to be labor?”"],"next":"s11a"},"s11a":{"slug":"SUNDAY · 9:14 PM · THE VANCE HOUSE, THE FIRE PIT","duel":"labor","body":["Laney walks the cardboard once around the fire pit in a slow pageant circuit, noodle on her shoulder like a parasol. Margot says “Go.”","Lena doesn’t need notes. She pushes her sleeves the rest of the way up and goes. “Leo the Thirteenth, *Rerum Novarum*, 1891, section forty-five. A tip is a gift. A wage is a debt. You can’t owe a man a gift, and you can’t gift him what you owe him. Leo says there’s a law older than any bargain two men can make: a wage has to be enough to keep a frugal, decent worker alive. And if need or fear makes a man take worse, he is — and I’m quoting a pope — *the victim of force and injustice*.” She points at his shirt pocket, where the money was. “Go stand at the Anchor at closing and watch the waitresses count the jar. Every dollar in it is a decision somebody made over pie about whether she’s a person tonight.”",{"if":"e3_hundred==\"two\"","text":"“Two hundred dollars isn’t a wage, Costigan. It isn’t even a gift. He tipped you before he looked at you. Mr. Vance paid you like weather.”","else":"“A hundred dollars isn’t a wage, Costigan. It isn’t even a gift. He tipped you before he looked at you. Mr. Vance paid you like weather.”"}],"choices":[{"text":"Leo says the worker owes a fair day’s work and keeps his hands off the boss’s property. Section twenty. Justice runs both ways.","tag":"Press","set":{"duel.labor.rigor":"+1"},"response":["“You want to explain the dignity of labor to *me*? On Labor Day?” “It’s Sunday.” “It’s Labor Day *weekend*, Costigan, and I’m counting it.” She doesn’t break stride. “Granted. The Anchor’d fire you for a chipped cup and be right. Both ways, yes. It just never seems to run *uphill* on its own.” She takes the point and keeps walking with it, as if he’d handed her his coat."],"goto":"s11b"},{"text":"“It was the best-paid pot in the history of pots.”","tag":"Riposte","set":{"duel.labor.wit":"+1","rel.lena.warmth":"+1"},"response":["She laughs, caught clean, and points at him across the blue glass with the laugh still on her face. “Which is my *point*. A hundred dollars for one pot is a crazy man’s number. Nobody can feed a family on crazy.” Laney applauds with the noodle."],"goto":"s11b","if":"e3_hundred!=\"returned\" && e3_hundred!=\"two\""},{"text":"“It was the best-paid pot in the history of pots. Twice.”","if":"e3_hundred==\"two\"","tag":"Riposte","set":{"duel.labor.wit":"+1","rel.lena.warmth":"+1"},"response":["She laughs, caught clean, and points at him across the blue glass with the laugh still on her face. “Which is my *point*. Two hundred dollars for one pot is a crazy man’s number. Nobody can feed a family on crazy.” Laney applauds with the noodle."],"goto":"s11b"},{"text":"“I was the best-paid pot in the history of pots for about four seconds.”","if":"e3_hundred==\"returned\"","tag":"Riposte","set":{"duel.labor.wit":"+1","rel.lena.warmth":"+1"},"response":["She laughs, caught clean, and points at him across the blue glass with the laugh still on her face. “And then you handed it back, which is my *point*. You could afford four seconds of pride because somebody pays you on Tuesday. The man who can’t has to say *thank you, sir*.” Laney applauds with the noodle."],"goto":"s11b"},{"text":"“He paid me like furniture. You’re right.”","tag":"Concede","set":{"duel.labor.heart":"+1","rel.lena.trust":"+1"},"response":["She has the next paragraph loaded — he can see it lined up behind her teeth — and suddenly there’s nobody standing where she meant to hit. She closes her mouth. She looks at him differently, a half-second’s worth. Margot, unblinking, consults the Nokia. “Concession at forty-one seconds,” she says."],"goto":"s11b"},{"text":"Benedict wants gift *inside* the economy — gratuitousness. *Caritas in Veritate*, thirty-six. A tip is the gift.","tag":"Reframe","set":{"duel.labor.rigor":"+1","rel.lena.friction":"+1","duel.labor.lena":"+1"},"response":["“Your own pope, Broussard. July. Gratuitousness and the logic of gift have to find their place *within* normal economic activity. A tip is the gift.”","Kevin is typing a point for Broussard before she opens her mouth. “*Inside* it, Costigan.” She’s had this one loaded since July. “Not *instead* of it. Section six of the same letter: you can’t *give* a man what’s yours until you’ve given him what’s his. You don’t get to tip your way out of a wage.”"],"goto":"s11b"}]},"s11b":{"slug":"SUNDAY · 9:19 PM · THE VANCE HOUSE, THE FIRE PIT","duel":"labor","body":["ROUND 2, says the Arrowhead box, going by at knee height.","Lena turns her chair to face him square. “*Caritas in Veritate*, section twenty-five. Your pope, Costigan, your favorite, your theologian with the nice shoes — not some Jesuit in Berkeley. He says the calls the Church has made since *Rerum Novarum* for workers’ associations that can defend their rights *must therefore be honoured today even more than in the past*. Even more. In July. With the whole world falling down.” She holds up one hand. “There’s a man on Banks Street named Mr. Alcide who shucked oysters for forty-one years at a place with tablecloths. No union. When his hands went, they gave him a ham at Christmas and his stool to somebody’s nephew in January. That’s what *honoured* looks like when nobody at the table has the standing to say the word.”",{"if":"e2_union","text":"She smiles, which is never good news. “And Hale called it Monday, in front of God and Yusuf. We formed a union. Are you going to bust it?”"}],"choices":[{"text":"The Jobs Bank: men on full wages doing crosswords in a room, suspended last winter because even the UAW couldn’t defend it to Congress.","tag":"Press","set":{"duel.labor.rigor":"+1","rel.lena.friction":"+1"},"response":["“It’s bingo with a pension,” Jack adds, because it’s right there. Theo, from the end of the deck: “*Ooh*.”","Lena gives him the program in one breath — indefensible, she says, and they knew it, which is why they let it go — and refuses the rest in the next. “One bad parish doesn’t refute the Church, Costigan. You of all people know that.”"],"goto":"s11c"},{"text":"“Does Broussard’s Seafood have a union?”","tag":"Riposte","set":{"duel.labor.wit":"+1","duel.labor.lena":"+1"},"response":["Lena laughs so hard she has to put her pie down. “Lord, *no*. Daddy would sooner unionize the crawfish. He pays his shuckers over scale and they eat at our table on Christmas Eve, and you can quit a union.” She lets it sit, wiping her eye with a knuckle. Kevin is already scoring it. “Nobody quits a Broussard. That’s all a union is, Costigan: a family for men whose boss won’t set them a place.”"],"goto":"s11c"},{"text":"Subsidiarity. *Quadragesimo Anno*, seventy-nine: don’t hand to the big what the small can do. The national union is the big.","tag":"Reframe","set":{"duel.labor.rigor":"+1"},"response":["She grants the principle with one nod. “Pius is right. So go small. A man alone on an assembly line can’t sit across a table from General Motors; that’s the small thing failing, so you go up exactly one step. The local. The local’s a *parish*, Costigan. Your argument’s with headquarters.” She has taken his premise and walked it somewhere he didn’t send it, and Margot makes a small appreciative noise she will later deny."],"goto":"s11c"},{"text":"“My father would kiss you on the mouth for that paragraph.”","tag":"Concede","set":{"duel.labor.heart":"+1","rel.lena.warmth":"+1"},"response":["“Tell him to get in line behind Dorothy Day.” It’s quick and it gets its laugh. But her eyes stay on him across the fire a little after the laugh is over."],"goto":"s11c"}]},"s11c":{"slug":"SUNDAY · 9:25 PM · THE VANCE HOUSE, THE FIRE PIT","duel":"labor","body":["ROUND 3. Laney holds the cardboard over her head this time, like a girl at a prizefight in a movie.","Lena doesn’t get up. “Four years ago last week my city went under, and the federal government took days to find it. Days. People on roofs writing on the shingles with house paint. The first people on Banks Street with gloves and bleach were a youth group from a parish in Minnesota, in a school bus, with a priest who’d never seen a crawfish. Not the government. *Minnesota*.” Her voice stays even; that’s how Jack knows to listen. “Then last winter Washington found — Kevin?” “Seventeen billion in December,” Kevin says, eyes on the BlackBerry. “A lot more since.” “Tens of billions for two car companies inside six months. I’m *for* it, Costigan. I’m just noting where they keep their compassion.”","Margot, unasked: “Observation. Both your parties read the encyclicals the way Theo reads a menu, for the parts they already wanted. The right takes the paragraphs on property, the left takes the paragraphs on the wage, and nobody reads the one where the Pope says they’re both wrong. Carry on.”","Jack has spent the night arguing with the part of his head that goes to Mass. The bailout isn’t in an encyclical. It’s on the kitchen table on Glenwood Avenue, and it’s been there since June."],"choices":[{"text":"“The bailout saved GM, not the men. The CEOs flew in on jets. My father got a letter. Twenty-six years at Lordstown.”","tag":"Press","set":{"duel.labor.rigor":"+1","e3_told_lena_frank":true},"response":["“Laid off since June,” he says. For one breath the deck goes quiet. Margot says nothing and lets the clock run.","Lena doesn’t make it a moment. She makes it an argument. “Then you agree with me,” she says, level. “They saved the company and not the men. You just got there by way of the jets.”"],"goto":"s11d","key":"You told Lena your father’s been laid off since June."},{"text":"“My dad’s been laid off since June. He drove me twenty-four hundred miles to see the Pacific once.”","tag":"Open up","set":{"duel.labor.heart":"+1","rel.lena.trust":"+1","e3_told_lena_frank":true},"response":["For one breath the deck goes quiet, and there’s only the ocean his father came all that way to look at, going over in the dark. Margot, who has had *Cobalts* in a Moleskine since the first night, stops the clock.","Lena doesn’t make it a moment. She makes it an argument. “Then he knows exactly what it’s worth,” she says, “and so do you. So argue like it.” And she waits for him — Lena Broussard, in a duel, waits."],"goto":"s11d","key":"You told Lena your father’s been laid off since June."},{"text":"“The Cobalt was a bad car. I say that with love. My father built it with love too. Until June.”","tag":"Riposte","set":{"duel.labor.wit":"+1","e3_told_lena_frank":true},"response":["Theo laughs, then hears *until June* and stops. Margot thumbs the Nokia off.","Lena doesn’t laugh. She makes it an argument. “Then don’t let anybody tell you it was the car,” she says. “It was never the car.”"],"goto":"s11d","key":"You told Lena your father’s been laid off since June."},{"text":"“Next round.” Keep him out of it.","tag":"Control","set":{"trait.control":"+1","e3_told_lena_frank":false,"duel.labor.lena":"+1"},"response":["Lena looks at him over the fire, a long look, and then goes around him like water around a piling. “Fine. Yusuf’s father, then.” She was on the cloister walk; she heard it. “GM and Toyota built cars together in Fremont for twenty-five years. The bailout saved GM, and this summer GM walked out on Fremont, and on the twenty-seventh of August Toyota said they’re closing it. Yusuf called that job the load-bearing wall of the house. Nobody bailed out *that* wall.” She takes the round on someone else’s father, and Jack lets her have it."],"goto":"s11d"}]},"s11d":{"slug":"SUNDAY · 9:31 PM · THE VANCE HOUSE, THE FIRE PIT","duel":"labor","body":["ROUND 4, and Laney, sensing the room, walks it around without a word.","Lena is quiet, which is new. Her hand goes to the gold medal at her throat and turns it once on its chain while she looks into the fire, and when she speaks she has slowed down. “John Paul. *Laborem Exercens*, section six. Work is for man, not man for work. The dignity of work lives in the one doing it, not in the job. You can’t lay that off. Mr. Alcide still has a shucker’s hands. Nobody gets to fire *those*.” She lets go of the medal.",{"if":"e3_told_lena_frank","text":"“Your father didn’t lose his dignity in June, Costigan. General Motors lost *him*.” Then, plainly, as if she actually wants to know: “What did he make?”","else":"“Yusuf’s father didn’t lose his dignity at NUMMI. NUMMI lost *him*.” She tilts her head. “And yours, Costigan? You’re from Youngstown, and you just skipped a round you were winning.”"}],"choices":[{"text":"“Twenty-six years of cars. Sunday gravy. A garage you could eat off of.”","tag":"Concede","if":"e3_told_lena_frank","set":{"duel.labor.heart":"+2","rel.lena.trust":"+1"},"response":["He hears himself say it and doesn’t take any of it back. Lena doesn’t make a joke. After a second she says, “That’s what I mean,” very quietly, and nods at Margot to call it, and wins the round looking as though she would rather have lost it."],"goto":"s11v","cue":"Lena will remember that."},{"text":"“Cobalts. Twenty-six years. Laid off in June. You win.”","tag":"Concede","if":"!e3_told_lena_frank","key":"You told Lena about your father, and gave her the round.","set":{"duel.labor.heart":"+2","rel.lena.trust":"+1","e3_told_lena_frank":true},"response":["He gives it to her flat, all of it at once, like a man emptying his pockets at a desk. Lena takes the round and doesn’t pick it up. “I didn’t want it like that,” she says. Then, honest to the last: “I’ll take it. I didn’t want it like that.”"],"goto":"s11v","cue":"Lena will remember that."},{"text":"“Dignity doesn’t make the mortgage. A job does.”","tag":"Press","key":"You lost the labor duel to Lena on her Sunday.","set":{"duel.labor.rigor":"+1","duel.labor.lena":"+1"},"response":["“John Paul again,” he says. “*Centesimus Annus*, forty-eight. When the State takes over what people owe each other, you get more offices and less human energy. A union can turn into that too: a pension office with a parking lot. The contract that priced Lordstown out of building cars was signed by the men you’re canonizing.” Kevin, very quietly, gives him the point.","“No. *Justice* makes the mortgage.” She’s on her feet now, the cardigan off one shoulder, the Pacific going off under the deck like applause. “And John Paul wrote that after ten years of standing behind a union with ten million members in Gdańsk, Costigan. Read the whole paragraph.” Laney thumps the noodle on the boards three times. “That’s why I’m for the union, and so are you. You’ll just vote like you’re not.”"],"goto":"s11v"},{"text":"“If you’re done canonizing the working man, he’d like his dignity back by Thursday.”","tag":"Riposte","key":"You lost the labor duel to Lena, and made her laugh doing it.","set":{"duel.labor.wit":"+1","rel.lena.warmth":"+1"},"response":["She laughs into her sleeve and points at him with the other hand until she can talk, and wins the round anyway. “Thursday’s fine. Tell him he can pick it up at the union hall. They’re open late.”"],"goto":"s11v"},{"text":"“Easy to preach labor from a family business.”","tag":"Personal","cue":"Lena will remember that.","key":"You told Lena it was easy to preach labor from a family business.","set":{"duel.labor.wit":"+1","rel.lena.trust":"-1","rel.lena.friction":"+2","resolve.jack":"-1","e3_duel_personal":true},"response":["The fire hisses. Lena sets her plate down on the deck carefully, so that it makes no sound at all. She is polite. Every consonant is in its place.","“Broussard’s took five feet of water, Mr. Costigan. My daddy and his brothers rebuilt it with their hands. The house too.”","Nothing more."],"goto":"s11v","if":"!e3_told_lena_frank"},{"text":"“Easy to preach labor from a family business.”","tag":"Personal","cue":"Lena will remember that.","key":"You told Lena it was easy to preach labor from a family business.","set":{"duel.labor.wit":"+1","rel.lena.trust":"-2","rel.lena.friction":"+2","resolve.jack":"-1","e3_duel_personal":true},"response":["The fire hisses. Lena sets her plate down on the deck carefully, so that it makes no sound at all. She is polite. Every consonant is in its place.","“I asked you a real question, Mr. Costigan.” A pause. “Broussard’s took five feet of water. My daddy and his brothers rebuilt it with their hands. The house too.”","Nothing more."],"goto":"s11v","if":"e3_told_lena_frank"}]},"s11v":{"slug":"SUNDAY · 9:38 PM · THE VANCE HOUSE, THE DECK","duel":"labor","set":{"resolve.lena":8},"body":["Margot stops the Nokia. Kevin reads off the BlackBerry like a man announcing a birth: “Broussard. That’s two–one on the season.”",{"if":"e3_duel_personal","text":"She wins, and she is gracious about it. She thanks the moderator and the ring girl, and she is perfectly pleasant to Mr. Costigan for two more hours, which he wouldn’t wish on anyone. At midnight, crossing behind his chair on her way in, she drops a dry towel on his head without breaking stride. It’s as close to forgiveness as tonight is going to get."},{"if":"!e3_duel_personal && duel.labor.heart>=3","text":"She wins and won’t take it. “We’re even, Youngstown,” she says, which by Kevin’s count they are not, and nobody corrects her. Later she cuts the last slice of the peach pie, sets it on the arm of his chair without a word, and goes back around to her side of the fire."},{"if":"!e3_duel_personal && duel.labor.rigor>=3 && duel.labor.heart<=2","text":"She wins on points. She stands, rolls her sleeves back down one at a time, and steals Hale’s line with the boredom and the cut glass both: “That was very nearly an argument, Costigan.” Margot, consulting the Nokia: “Broussard, by a minute forty.” Kevin, consulting his columns: “You took every point, Costigan. She took the room.”"},{"if":"!e3_duel_personal && duel.labor.wit>=2 && duel.labor.rigor<=2 && duel.labor.heart<=2","text":"She wins, and Laney rises from her chaise and crowns her Miss Congeniality, bending the pool noodle into a hoop on her head, and teaches her the pageant wave on the spot. “Wrist, wrist, elbow, elbow. Smile like your daddy’s in the front row, sugar.” Lena does it at the Pacific, perfectly, to a standing ovation from Theo, who stays seated. “The judges liked your jokes,” Margot tells Jack, “and her logic.”"},{"if":"!e3_duel_personal && duel.labor.wit<=1 && duel.labor.rigor<=2 && duel.labor.heart<=2","text":"Margot calls it for Broussard, on coherence. Lena accepts with a magnanimous hand. “Put it on the board, Kevin.” “There’s no board.” “There will be,” says Margot."},{"if":"e3_told_lena_frank && !e3_duel_personal","text":"Later, when the others have gone in, Lena asks him one plain question across the fire. “Is he okay?” “He’s good.” She looks at him over the blue glass as if she’s weighing the word. Then she lets him keep it."},"The moon clears the mountains and goes white, and down on the sand the tide comes in under it, up to the foot of the stairs."],"next":"s12"},"s12":{"slug":"MONDAY · 7:12 AM · THE VANCE HOUSE, KITCHEN","set":{"resolve.jack":"-1","knows_danny_theo":true},"body":["Labor Day comes in gray. The marine layer has the beach again, pressed to the glass, and the house is quiet enough that Jack can hear the refrigerator’s compressor and, under it, the surf. He’s at the sink with last night’s glasses, because there are glasses and there is a sink: wine glasses from the fire pit with a red line dried in the bottom of each, a coffee mug of Margot’s, two Arrowhead bottles.","Theo is at the island in the navy silk robe from the fire alarm, with an espresso and his hair flattened on one side. He has picked up a dish towel from somewhere and is drying one wine glass, slowly, turning it in the towel as if he’s read about this. “I slept,” he says, though Jack hasn’t asked. “Eleven-forty to six-fifty. Left side. I dreamed about Rossellini.” Jack doesn’t say anything. Theo turns the glass.","The RAZR buzzes on the counter by the coffee, rattling against the marble. A number Jack doesn’t have saved, long, out of state. The screen only lights when he tips it. He dries his hand on his jeans and opens it to a recording, a woman’s voice, flat and loud in the quiet kitchen: “This is a prepaid call from — ” and then a gap, and into the gap a voice Jack knows better than his own, saying its own name: “*Danny.*” And the woman again: “ — an inmate at Trumbull Correctional Institution. This call is from a correctional facility and is subject to monitoring and recording. To accept this call, press — ”","Theo is three feet away with the towel in one hand and the glass in the other. Jack presses the key.","“*Professor.*” There it is: Glenwood Avenue in a voice, gravel and laughing, a little out of breath like he just came in from somewhere. “You up? It’s ten o’clock. Ma put money on it, so don’t make me talk to myself.” Jack says, “I’m up,” and his voice works. Behind Danny there’s a room full of other men’s voices and a television and a door that buzzes and bangs. “Ma came yesterday. Brought the good socks. The gray ones, the wool. Spent ten minutes at the desk telling the C.O. they’re not contraband, they’re *socks*. She won.” A laugh. “She says there’s a veil girl.” “There’s a girl in my class who wears a veil to Mass.” “That’s what I said, Professor. A veil girl.”",{"if":"e2_told_dad_job","text":"“And you wash dishes. Dad told her. *Dad* told her.” Danny lets that sit, so Jack can hear how big it is. “Dad don’t tell her nothing. So he’s proud. So don’t be a pussy about it.”"},{"if":"e2_wrote_danny","text":"“Dad says you wrote. It ain’t come.” “Thursday. I mailed it Thursday.” “Mail’s slow in here. They read it first. Some guy in the mailroom’s gonna know your business before me.”"},"The tap is still running. Jack doesn’t turn it off. His free hand has found the St. Michael medal through his T-shirt and is holding it, the edge of it pressing into his thumb. “Where are you?” Danny says. “It sounds like money.” Jack looks at the kitchen: the steel, the glass, the Carrara, the gray ocean past the glass, Theo standing in all of it in a silk robe drying one glass forever. “Malibu.” “Get *out*.” A whoop, and somebody on Danny’s end tells him to keep it down, and he says something back Jack can’t hear. Then he’s close to the phone again, and quieter. “Describe it.”"],"choices":[{"text":"Describe the ocean, plainly.","tag":"Sincerity","set":{"trait.sincerity":"+1","soul.grace":"+1","e3_danny":"ocean"},"response":["So he does. He turns to the glass and tells his brother what’s there. It’s gray right now, with fog lying on it low. Under the fog it’s green close in and blue farther out, and there’s a line where it meets the sky that you can’t find, you keep looking and you can’t. It’s cold, colder than Lake Glacier in May. The house is right on top of it, and all night you can hear it under the floor, coming in and going out, like somebody breathing in the next room.","On the other end nobody says anything. The television, the door buzzing. Then Danny, quiet: “Okay. Okay.” A breath. “Keep that one.”"],"goto":"s12b"},{"text":"Describe Malibu as a crime scene: the labeled fridge, the Oscar by the toilet.","tag":"Wit","set":{"trait.wit":"+1","e3_danny":"funny"},"response":["“Okay. Victim’s a refrigerator. Every container in it labeled, same handwriting: R.V., Monday, Do Not. Do not *what*, Danny. It doesn’t say. We have no suspects. Then you go down the hall to take a leak, and there’s an Academy Award on the shelf next to the hand towels. A real one. I picked it up. It weighs about what a kid’s bowling ball weighs.”","And Danny is laughing — the big one, from the stomach, the one that used to come up the stairs on Glenwood at two in the morning when he thought everybody was asleep, the one Jack hasn’t heard since — and Jack keeps talking so it won’t stop. The Oscar has a little gold sword. The man who owns the Oscar has a hedge cut with a ruler. Danny laughs until somebody on his end tells him to shut up, and he tells them to shut up, and keeps laughing."],"goto":"s12b"},{"text":"Hand the phone to Theo: “Say hi to my brother.”","tag":"Charm","key":"You let Theo talk to Danny.","set":{"trait.charm":"+1","rel.theo.trust":"+1","rel.theo.warmth":"+1","e3_danny":"theo_hi"},"response":["Jack holds the RAZR out across the counter. “Say hi to my brother.” Theo looks at the phone. Then he puts the glass down and takes it, dish towel and all, and puts it to his ear, and the earpiece is loud enough in the quiet kitchen that Jack hears both halves.","“Who’s this?” “The roommate.” “He any good?” Theo looks at Jack over the phone for a second. “He’s a menace.” Danny laughs, low. “Yeah. He is.” Then, in a different voice, the one he used to use at the top of the driveway when Jack was nine and going somewhere on a bike: “Look out for him.” Theo doesn’t say anything clever. He hands the phone back."],"goto":"s12b"}]},"s12b":{"slug":"MONDAY · 7:31 AM · THE VANCE HOUSE, KITCHEN","body":["The recorded woman cuts in over whatever Danny is saying: “You have one minute remaining.” Danny talks faster. “Go to Mass. Eat something. Don’t be a pussy, Professor. Tell the veil girl I said — ”","And then it’s a dial tone, steady and stupid, in a kitchen in Malibu. Jack holds the RAZR to his ear until the dial tone becomes the other noise, the one that tells you to hang up, and then he closes it. He reaches over and turns off the tap.","Theo hasn’t moved. Jack has watched Theo fill every silence on the fourth floor of Delgado Hall for a week — with a pitch, a logline, a story about a director, a bottle — and he doesn’t fill this one. He doesn’t ask what Danny did. He stands at the island in the silk robe with the gray light on him and waits, which Jack has never once seen him do.",{"if":"e3_danny==\"theo_hi\"","text":"He’s still holding the dish towel he took the phone with."}],"choices":[{"text":"Tell it plain: “He’s in Trumbull. Five years. A fight — a guy got hurt bad. Three more to go, maybe less.”","tag":"Candor","key":"You told Theo where your brother is.","set":{"trait.candor":"+1","soul.honesty":"+1","rel.theo.trust":"+1","e3_danny_told":"plain"},"response":["“He’s in Trumbull,” Jack says. “It’s a state prison, outside Warren. Five years. A fight — a guy got hurt bad. He pleaded. Three more to go, maybe less.” It’s what his mother says at St. Brigid’s when anybody asks, and he says it the same way she does, and stops.","Theo asks one question. “What does he read?” “Whatever I send.” Theo nods, as if that answers something he’d been wondering about for a while, and folds the dish towel in thirds and lays it on the counter."],"goto":"s12c"},{"text":"“He’s at a very exclusive school in Ohio.”","tag":"Wit","key":"You told Theo your brother was at a very exclusive school in Ohio.","set":{"trait.wit":"+1","e3_danny_told":"joke"},"response":["“He’s at a very exclusive school in Ohio,” Jack says. “Hard to get into. Harder to get out of.” Theo leaves the joke where it is. “Then I’ll send an application fee.” And then, short, with nothing on it: “I heard the recording, Costigan. It’s okay. I’m nobody.”"],"goto":"s12c"},{"text":"“Don’t tell anybody. Not yet.”","tag":"Sincerity","cue":"Theo will remember that.","key":"You asked Theo to keep it.","set":{"trait.sincerity":"+1","rel.theo.trust":"+2","e3_danny_told":"keep"},"response":["“Don’t tell anybody,” Jack says. “Not yet.” Theo looks at him across the island. “I’m good at that.” A pause. “Better than you’d think.” He picks up his espresso, finds it cold, and drinks it."],"goto":"s12c"}],"journal":[{"kind":"person","id":"danny","title":"Danny","text":"My brother. Trumbull Correctional. Calls me Professor. Ma brought him the good socks."}]},"s12c":{"slug":"MONDAY · 7:40 AM · THE VANCE HOUSE, KITCHEN","body":["Theo goes to the machine on the back counter, the big steel one with two dials and a pressure gauge, the one in his father’s kitchen, and makes an espresso the way he does everything with his hands: fast, exact, without looking. Grind, tamp, the hiss. He sets the cup down in front of Jack on its saucer. “You can touch this one,” he says. “It’s my father’s.”",{"if":"e2_alarm==\"hoodie\"","text":"Laney yawns into the kitchen in the Mooney hoodie and bare feet, a pink satin sleep mask pushed up on her forehead, her hair in a copper knot. “Who called so early, fireman? I heard a phone. I was *dreaming*.”","else":"Laney yawns into the kitchen in a camisole and bare feet, a pink satin sleep mask pushed up on her forehead, her hair in a copper knot. “Who called so early, fireman? I heard a phone. I was *dreaming*.”"},"Theo answers before Jack can open his mouth. “His bookie. The Browns are a long-term investment.” “Aw,” says Laney, with real sympathy. “Sugar.” She pats Jack’s arm on her way past, opens the refrigerator, considers the R.V. containers, closes it, and takes a peach from the bowl instead, satisfied in every particular.","Jack takes the cup. He takes the Marlboros out of the Carhartt on the back of the stool. He goes out through the glass door and across the deck, past the pool with the towel still folded on the coping, to the top of the beach stairs, where the fog is starting to come apart."],"journal":[{"kind":"person","id":"theo","title":"Theo Vance","text":"Roommate. Drives his grandfather’s car like a getaway. His father calls him Teddy and stays six minutes. Heard my brother’s voice and didn’t ask."}],"next":"s13"},"s13":{"slug":"MONDAY · 8:05 AM · THE VANCE HOUSE, THE BEACH STAIRS","body":["By eight the marine layer is lifting off Broad Beach in pieces, and the light coming through it has no shadows in it, like the inside of a shell. Jack sits on the weathered stairs below the deck with Theo’s espresso on the step beside him and the Marlboros open on his knee. He has been not lighting one for the life of an espresso. The RAZR is in his pocket, folded shut.","*Describe it*, Danny said. It’s gray this morning. He’d have to start there.","Behind him the screen door slides, and Lena comes down the stairs: a navy one-piece that has clearly had a life before her, the oatmeal cardigan over it, unbuttoned, a striped towel over one shoulder, her Keds hooked on one finger. The tin is in the cardigan pocket. She is soft and gold and entirely at ease in her own skin at eight in the morning, and Jack, who was raised right and is not made of wood, looks at the ocean.","She stops two steps above him and looks at the pack, the cup, his face. She doesn’t ask. Whatever she sees there, she stands on the step with it a moment."],"choices":[{"text":"Light it anyway.","tag":"Reckless","key":"You gave Lena’s reliquary its second relic.","set":{"trait.reckless":"+1","soul.restraint":"-1","reliquary":"+1","jack_cigs":"+1","e3_stairs":"lit","resolve.jack":"-1"},"response":["He lights it. He gets the first drag, the one that goes all the way down to the place it’s for, and then her hand is there and the cigarette isn’t, and she’s stubbing it out on the step between his feet as if she’s done it all her life. The tin comes out of the cardigan with a little hinge-click, the Lighthouse cigarette lying in it on its bed of paper, and she lays No. 2 beside it, uncaps a pen with her teeth, and writes the slip against her bare knee.",{"type":"doc","title":"A slip of paper, folded into the tin","text":"No. 2 · 9/7/09 · Malibu · before breakfast, on a holiday."},"She snaps the lid and looks at him longer than confiscation takes. “At this rate I’m going to need a bigger tin,” she says, “and they only sell this size in *Buellton*.”"],"goto":"s13b"},{"text":"Put the pack away before she reaches him.","tag":"Control","key":"You put the pack away before Lena reached you.","set":{"trait.control":"+1","soul.restraint":"+1","resolve.jack":"+1","e3_stairs":"pocketed"},"response":["He closes the lid and puts the pack in his back pocket, behind the *Brideshead*, before she’s off the last step. She sees it go. She sits down beside him with a thump, digs the tin out of her cardigan and shakes it at him, one lonely cigarette sliding end to end inside like a bead in a rattle. “I brought the tin and *everything*.”"],"goto":"s13b"},{"text":"Hold one out to her, unlit: “For the collection.”","tag":"Sincerity","key":"You offered Lena a cigarette for her collection, and she turned it down.","set":{"trait.sincerity":"+1","rel.lena.warmth":"+1","e3_stairs":"offered"},"response":["He shakes one out and holds it up to her, filter first. “For the collection.” She looks at it, and at him, and doesn’t take it. “Donations aren’t relics, Costigan. They’re *tithes*.” Then her own line from the Hollis steps, in mint condition: “Where’s the sport?” She takes his wrist instead — the hand with the cigarette in it — and pulls him down the last step onto the cold sand."],"goto":"s13b"}]},"s13b":{"slug":"MONDAY · 8:20 AM · BROAD BEACH, THE WATER’S EDGE","body":["Down at the water the sand is packed hard and cold under their feet, and the beach belongs to them, a man with a golden retriever a quarter mile east, and the gulls. Lena drops the towel, folds the cardigan on top of it with the tin inside, and stands with her toes on the line where the foam gives up.","“Sixty-six degrees,” she says. “Kevin looked it up for me this morning, on his BlackBerry, and then he looked at *me* like I’d asked him to look up my obituary.” She regards the Pacific with deep personal suspicion. “This is the Gulf’s mean cousin. The one who went off to boarding school and came back talking funny.”",{"if":"e3_duel_personal","text":"She hasn’t called him anything yet this morning: not Costigan, not Youngstown, not Mr. anything. Whatever she’s saving it for, she’s still saving it."},"Then she looks at him instead, properly, with her red-pen face on. “You look like somebody’s Monday.”"],"choices":[{"text":"“Family stuff. It’s good, actually. Mostly.”","tag":"Candor","set":{"trait.candor":"+1","rel.lena.trust":"+1","e3_lena_monday":"family"},"response":["She doesn’t push. She looks at him a second more and lets it be exactly what he said it was. “Okay.” Then she nods at the water. “Then you need the Pacific. It’s a sacrament for Protestants.”"],"goto":"s13c"},{"text":"“The Browns.”","tag":"Wit","set":{"trait.wit":"+1","rel.lena.warmth":"+1","e3_lena_monday":"browns"},"response":["“Lord.” She puts a hand on his arm in sympathy, briefly, as at a wake. “That’s a *grief*. Get in the water.”"],"goto":"s13c"},{"text":"“Race you.” And go.","tag":"Reckless","set":{"trait.reckless":"+1","rel.lena.heat":"+1","e3_lena_monday":"race"},"response":["He’s off before the words are out, and she’s past him by the second stride, because she has put a hand in the middle of his back going by and shoved. “*Cheater*.” “*Catholic*,” she yells, and hits the water first."],"goto":"s13c"},{"text":"“I was out of line last night. About your father. Your family.”","if":"e3_duel_personal","tag":"Candor","cue":"Lena will remember that.","key":"You apologized to Lena for what you said about her family.","set":{"trait.candor":"+1","soul.honesty":"+1","rel.lena.trust":"+1","rel.lena.friction":"-1","e3_apologized_personal":true},"response":["She looks at him for a long moment with the Pacific going over behind her. “Apology noted, Mr. Costigan.” Then she turns to the water and wades in to the knee, and says over her shoulder, without looking back, “Costigan. Get in. It’s worse if you wait.”"],"goto":"s13c"}]},"s13c":{"slug":"MONDAY · 8:24 AM · BROAD BEACH, THE WATER","body":["The cold takes his breath at the knees and the rest of it at the waist. Lena goes under once and comes up shrieking, hair streaming, swearing by saints she invents on the spot — Saint Frigidaire, abbot; Blessed Somebody of the Icebox — and Jack laughs so hard he takes in a mouthful of the Pacific.","Then a wave stands up out of nowhere, green and glassy along the top, and breaks across both of them, and she comes off her feet straight into him. He catches her by the elbows. For a second they’re chest-deep in the Pacific holding on, her hands flat on his forearms, salt caught in her eyelashes, his St. Michael gone cold against his sternum, both of them laughing too hard to stand up properly. He can feel the whole cold ocean except for the few inches where she is. He knows exactly what the next second is. He has known since a porch light went out on Seacliff Road.","He lets go first.","His hands keep the shape of her elbows for a while under the water, and the ocean is very cold, and he minds both of those things a great deal. Then she ducks under and comes up streaming and yells at the sky about it, and he’s laughing again, and the laughing is the realest thing that has happened to him since the phone buzzed on the marble. She lies back and floats with her arms out and her hair fanned on the swell, and gives the gray sky the Who Dat at full volume, *who dat say dey gonna beat dem Saints*, to an audience of one golden retriever, who barks back.","Jack treads water and starts the letter in his head. *Sixty-six degrees. Green at the top of the waves, gray underneath. It sounds like a truck going by that never finishes going by. A girl from New Orleans hates it.*","Out of the water she wraps herself in the cardigan, teeth going, wet wool and salt, and stands over him where he’s collapsed on the towel, and delivers her review of the Pacific Ocean. “Four out of ten. Like your marionberry.” “My dad would complain.” “About the ocean?” “About the rating. He’d give it a three. He gives everything a three.” “Your daddy,” Lena says, dripping on him, “would be *right*.”",{"if":"e3_told_lena_frank && !e3_duel_personal || e3_told_lena_frank && e3_apologized_personal","text":"She sits down beside him on the towel, knees up, and adds, lightly, to the water, that she’d like to meet a man who’d give the whole Pacific Ocean a three. She leaves it there. So does he."},"Up on the deck Kevin appears at the rail waving a spatula over his head, which means breakfast. The marine layer is burning off from the east. Neither of them moves yet."],"next":"s14"},"s14":{"slug":"MONDAY · 1:10 PM · US-101 NORTH, THE ODYSSEY","music":"Bruce Springsteen — “Factory”","body":["They left Broad Beach at noon. Everyone is in the van except Theo, who is in the SL, and Laney, who at the bottom of the drive handed Kevin her three suitcases one by one and climbed into the two-seater beside Theo. “A girl can arrive in a minivan, sugar,” she told Kevin, tying a scarf over her hair. “She *leaves* in somebody’s car.” On the back glass of the Odyssey, in shoe polish, the countdown says 6 DAYS. Lena did it in the drive this morning with her wet hair dripping on the bumper.","At one o’clock Kevin switched over to KNX for the news, and they all heard it: the President in Cincinnati this morning, at the AFL-CIO’s Labor Day picnic, talking about health care and the unions and the dignity of work, and a crowd behind him that sounded, through the static on the Oxnard plain, like a parish festival when the band comes on. Then Kevin plugged in his iPod and put on Springsteen: the early-morning whistle, the men walking out in the morning light. “My dad likes the Boss,” Kevin says now, eyes on the road, ten and two. “He thinks he’s a Republican.”","Jack laughs, and Kevin looks pleased, and then, still watching the road: “My dad’s stores are open today. He has two. Nail-salon supply, in San Jose — polish, acetone, the chairs. He’s never had a Labor Day.” Kevin shrugs with one shoulder. “He says Labor Day is for people with bosses.” It’s the most Kevin has ever said about his father, and he says it the way he says everything, sunny, at sixty-five miles an hour, and then he changes lanes.",{"type":"sms","from":"LANEY (FIREMAN’S FAVORITE)","text":"FIREMAN!!! there is a CASSETTE in this car. theodore says its an adapter. i am being kidnapped by 1985 ;) tell kevin i love him xoxo","time":"1:14 PM"},"Margot rides shotgun with the Moleskine on her knee and *Nickel and Dimed* face-down on the dash. She has been quiet since Malibu, which for Margot is a kind of buildup. Somewhere past Oxnard she turns around in her seat. “Here’s what I can’t get past. Your Church loves unions in its encyclicals. Leo, Pius, John Paul, now Benedict — workers’ associations are a natural right, to be honoured even more than in the past, very moving. And then it fights them in its own hospitals and its own schools. Nurses. Teachers. Janitors. In writing it’s Dorothy Day. In the parking lot it’s management.”","Jack opens his mouth. Across the aisle, Lena, who has been half asleep against the window with her cardigan pulled up to her chin, doesn’t open her eyes. “She’s right,” Lena says. “Write that down, Margot. It’ll never happen again.” Margot uncaps the pen and then, for once, doesn’t use it. Lena is asleep before Margot has put the cap back on, her head against the glass, the tin making its small dry sound in her cardigan pocket every time Kevin takes a curve, her Keds crossed on the back of Margot’s seat.",{"type":"sms","from":"Gina","text":"obama was on the radio from cincinnati. dad yelled at it but nicely. hes still in the garage. happy labor day i guess","time":"11:02 AM"},"He reads it now, two hours late, with the screen tipped to catch the light. It’s after four on Glenwood Avenue, and Jack can see it from here: the Silverado is in the drive because there’s nowhere to drive it. The garage door is up, the radio on the workbench, his father on the stool with his hands empty. Kevin’s iPod has gone around and started the song over. Springsteen is singing about his father walking through the factory gates in the rain."],"choices":[{"text":"Call Dad.","tag":"Sincerity","cue":"Your father will remember that.","key":"You called your father on Labor Day.","set":{"trait.sincerity":"+1","resolve.jack":"+1","e3_labor_call":"called","rel.kevin.warmth":"+1"},"response":["Frank picks up on the fourth ring. Jack can hear the garage before he hears his father: the radio low, a ballgame, the scrape of the stool. “Yeah.” “Happy Labor Day, Dad.” “Don’t.” A pause with the radio in it, a long one, the length of an at-bat. Jack waits it out. He learned that in the cab of the Silverado, across twenty-four hundred miles.","“You working tomorrow?” his father says finally. “Tuesday. Seven to one.” “Good.” And Frank hangs up first, the way he always does, as though long distance were still a dollar a minute. Jack holds the phone in his lap with the screen gone dark and the Boss still going, and doesn’t mind."],"goto":"s15"},{"text":"Text Gina: tell him happy Labor Day.","tag":"Candor","set":{"trait.candor":"+1","e3_labor_call":"texted"},"response":["T9 fights him for every word. *tell dad happy labor day. from me.* He sends it and closes the phone and watches the last of the Oxnard plain go by, the strawberry fields in their long rows with the pickers bent over them, out in the sun on the holiday.",{"type":"sms","from":"Gina","text":"he said dont. then he said tell him good","time":"1:31 PM"}],"goto":"s15"},{"text":"Put the phone away and watch the coast.","tag":"Control","set":{"trait.control":"+1","e3_labor_call":"none"},"response":["He closes the RAZR and puts it in the Carhartt and watches the coast come back to them: Ventura, the Rincon, Santa Barbara in its haze. At Gaviota they go into the tunnel the other direction and come out into gold hills, and in the middle row Lena sleeps through all of it."],"goto":"s15"}],"journal":[{"kind":"person","id":"kevin","title":"Kevin Tran","text":"Kevin Tran. Goes to daily Mass, saves you a seat with a Bible. Has a sister, Tina, in dental school, who flossed in the womb. Lies to his mom about orgo in Vietnamese. Drives his mother’s Odyssey at sixty-five, not sixty-six. His dad has two nail-salon supply stores in San Jose and has never had a Labor Day."}]},"s15":{"slug":"MONDAY · 11:52 PM · DELGADO HALL, ROOM 412","body":["412 smells like itself again: espresso, Theo’s cologne, eucalyptus coming in through the cracked window, and under all of it, faintly, a weekend of chlorine and woodsmoke in their clothes on the floor. The fog is back. The radiator ticks.",{"if":"e2_has_bike","text":"La Flaca is chained to the radiator pipe in the fourth-floor hall where Jack left her, and in their absence she has been served. A fresh laminate hangs from her handlebars on a loop of yarn: BICYCLES ARE NOT RESIDENTS. (THIS MEANS YOU, 412.) Priya has drawn a small, furious bicycle in the corner, with eyebrows."},{"if":"e2_books==\"loan\" && e3_terms==\"tab\"","text":"Before bed Theo goes to the espresso machine and takes the Post-it down slowly, like a man lowering a flag. He tears it carefully along the line between them, folds the top half — *IOU 1 PIE (TBD) —J.C.* — and puts it in his wallet. The bottom half goes back on the machine, smoothed down: *+ 1 MALIBU —T.V.* “Paid,” he says, tapping his wallet. Then, tapping the machine: “Open.”"},{"if":"e2_books==\"loan\" && e3_terms!=\"tab\"","text":"Before bed Theo goes to the espresso machine and takes the Post-it down slowly, like a man lowering a flag — *IOU 1 PIE (TBD) —J.C.* — and folds it once and puts it in his wallet, behind the black card, in the slot where most men keep a photo. “Paid,” he says."},"The Dell is open on Jack’s desk, fan whining, the browser on Facebook because that’s where the browser always is.",{"if":"e2_becca==\"yes\"","type":"fb","name":"Becca Lindell","text":"Becca Lindell wants to be friends on Facebook. SEE YOU THE 19TH!!","meta":"Friend Requests · Confirm · Not Now"},{"if":"!e3_duel_personal && e3_sunday==\"getty\"","type":"sms","from":"Lena","text":"Two–one. On Wednesday it’s Herakles against Gage, so bring something red you can afford to lose. —L.","time":"11:40 PM"},{"if":"!e3_duel_personal && e3_sunday!=\"getty\"","type":"sms","from":"Lena","text":"Two–one. On Wednesday I bleed on Gage, so bring something red you can afford to lose. —L.","time":"11:40 PM"},{"if":"e3_duel_personal","type":"sms","from":"Lena","text":"Two–one. Wednesday, as assigned. —L.","time":"11:40 PM"},{"if":"e3_roux==\"stirred\" && !e3_duel_personal || e3_roux==\"stirred\" && e3_apologized_personal","type":"sms","from":"Lena","text":"Also: thank you for stirring.","time":"11:41 PM"},"Complete sentences. Punctuation. An em-dash, which on an LG keyboard she has to go looking for. He reads it with the RAZR’s screen tipped to the one angle where it lights, and closes the phone, and opens it and reads it again, and doesn’t answer yet, because anything he can type on T9 tonight will lose.","Theo turns off the lamp. The dark in 412 is never really dark: the laptop’s standby light, the hall light under the door, the Grove gone blue-black in the window. Nobody says anything for a while, and Jack thinks Theo’s asleep, until Theo says, to the ceiling —",{"if":"e3_danny_told==\"joke\"","text":"“Costigan. The exclusive school in Ohio.” A pause. “Do they let them have books?”","else":"“Costigan.” A pause. “What’s he reading?”"},"Jack looks at the ceiling too. “Whatever I send. One a month. Used. They won’t let him have anything with writing in it, so I erase the margins and put my notes on a separate sheet.” It’s more than he’s said about it out loud to anybody at Marisol, and he gets through it without stopping, and Theo lets him finish.","“Send him the Waugh,” Theo says. “It’s mine,” Jack says. “I’ll buy you another,” says Theo.",{"if":"e3_hundred==\"kept\"","text":"Richard Vance’s hundred is still folded in it, at the place where the holy card isn’t. Jack doesn’t mention that, and Theo, who watched it go in, doesn’t either."},"The sheets rustle across the room and Theo turns over toward the wall. Down on the bluff the Surfliner went through hours ago. At 2:10 the freight horn comes up off the tracks, long and low and two-toned, and Jack, home, lies on his back in the dark and counts the cars."],"journal":[{"kind":"note","id":"ledger","title":"The ledger","text":"Pie: paid. Bus fare: paid, with compliments. Richard Vance’s hundred: in *Brideshead*.","if":"e3_hundred==\"kept\""},{"kind":"note","id":"ledger","title":"The ledger","text":"Pie: paid. Bus fare: paid, with compliments. Two hundred of Richard Vance’s dollars, and a problem.","if":"e3_hundred==\"two\""},{"kind":"note","id":"ledger","title":"The ledger","text":"Pie: paid. Bus fare: paid, with compliments. Richard Vance’s hundred: returned.","if":"e3_hundred==\"returned\""},{"kind":"note","id":"ledger","title":"The ledger","text":"Pie: paid. Bus fare: paid, with compliments. Richard Vance’s hundred: Theo’s, for the gas. It’s been through the pool.","if":"e3_hundred==\"theo\""},{"kind":"note","id":"malibu","title":"+ 1 Malibu","text":"The bottom half of the pie Post-it, still on the espresso machine in Theo’s hand. Theo says it’s open. I believe him.","if":"e2_books==\"loan\" && e3_terms==\"tab\""},{"kind":"note","id":"record","title":"Duels with Lena","text":"Two–one. She paid her Sunday."}],"end":true}}}];

function fresh() {
  return { v: 1, updatedAt: 0, vars: {}, journal: {}, keys: [], log: [], logs: {}, completed: [], cur: null, checkpoint: null, started: null };
}
let S = fresh();

/* ---------- state helpers ---------- */
function get(name) { return name in S.vars ? S.vars[name] : (name in DEFAULTS ? DEFAULTS[name] : 0) }
function applySet(set) {
  for (const [k, v] of Object.entries(set || {})) {
    if (typeof v === 'string' && /^[+-]\d+$/.test(v)) {
      let n = (Number(get(k)) || 0) + parseInt(v, 10);
      if (k.startsWith('resolve.')) n = Math.max(0, Math.min(10, n));
      S.vars[k] = n;
    } else S.vars[k] = v;
  }
}
function lit(s) {
  s = s.trim();
  if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
  if (s === 'true') return true; if (s === 'false') return false;
  return s.replace(/^["'“”]|["'“”]$/g, '');
}
function atom(a) {
  a = a.trim();
  const m = a.match(/^(!?)([A-Za-z_][\w.]*)\s*(?:(==|!=|>=|<=|>|<)\s*(.+))?$/);
  if (!m) return false;
  const v = get(m[2]);
  if (!m[3]) return m[1] ? !v : !!v;
  const r = lit(m[4]);
  switch (m[3]) { case '==': return v == r; case '!=': return v != r; case '>=': return v >= r; case '<=': return v <= r; case '>': return v > r; case '<': return v < r }
}
function test(expr) { if (!expr) return true; return expr.split('||').some(d => d.split('&&').every(atom)) }

function addJournal(list, epId) {
  for (const j of list || []) {
    if (!test(j.if)) continue;
    const key = j.kind + ':' + (j.id || j.title);
    const prev = S.journal[key];
    S.journal[key] = { kind: j.kind, title: j.title, text: j.text, ep: epId, t: prev ? prev.t : Date.now(), u: Date.now() };
  }
}

/* ---------- text ---------- */
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }
function fmt(s) { return esc(s).replace(/\*([^*\n]+)\*/g, '<em>$1</em>') }
function renderItems(items) {
  let h = '';
  for (const b of items || []) {
    if (typeof b === 'string') { h += `<p>${fmt(b)}</p>`; continue }
    if (!b || typeof b !== 'object') continue;
    if (!b.type) { const ok = test(b.if); const t = ok ? b.text : b.else; if (t) h += `<p>${fmt(t)}</p>`; continue }
    if (b.if && !test(b.if)) continue;
    if (b.type === 'break') h += `<div class="brk" aria-hidden="true">· · ·</div>`;
    else if (b.type === 'sms') h += `<div class="ins"><div class="phone" role="figure" aria-label="Text message"><div class="phone-top"><span>Inbox</span><span>${esc(b.time || '')}</span></div><div class="lcd"><span class="from">${esc(b.from)}:</span>${esc(b.text)}</div></div></div>`;
    else if (b.type === 'fb') h += `<div class="ins"><div class="fb" role="figure" aria-label="Facebook post"><span class="nm">${esc(b.name)}</span> ${fmt(b.text)}${b.meta ? `<div class="meta">${esc(b.meta)}</div>` : ''}</div></div>`;
    else if (b.type === 'aim') h += `<div class="ins"><div class="aim" role="figure" aria-label="AIM away message"><div class="tb">Away Message — ${esc(b.name)}</div><div class="bd">${fmt(b.text)}</div></div></div>`;
    else if (b.type === 'doc') h += `<div class="ins"><div class="doc" role="figure">${b.title ? `<h4>${esc(b.title)}</h4>` : ''}<div>${fmt(b.text)}</div></div></div>`;
  }
  return h;
}

/* ---------- persistence ---------- */
const sync = { db: null, ref: null, mode: 'local', busy: false, dirty: false, timer: null };
function readLocal() { try { const t = localStorage.getItem(LS_KEY); return t ? JSON.parse(t) : null } catch { return null } }
function writeLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)) } catch {} }
function save() { S.updatedAt = Date.now(); writeLocal(); queueRemote() }
function queueRemote() { if (!sync.ref) return; clearTimeout(sync.timer); sync.timer = setTimeout(pushRemote, 700) }
function remoteBody() {
  const cur = S.cur && EP[S.cur.ep];
  return {
    updatedAt: S.updatedAt,
    summary: { current: S.cur ? { ep: S.cur.ep, scene: S.cur.scene, stage: S.cur.stage, title: cur ? cur.title : '' } : null, completed: S.completed },
    state: S
  };
}
async function pushRemote() {
  if (!sync.ref) return;
  if (sync.busy) { sync.dirty = true; return }
  sync.busy = true; sync.dirty = false;
  try { await sync.ref.set(remoteBody()); setSync('account') }
  catch (e) {
    if (e && e.code === 'invalid_argument') { sync.ref = null; setSync('local') }
    else if (e && e.code === 'unavailable') { sync.dirty = true }
    else setSync('error');
  }
  sync.busy = false;
  if (sync.dirty && sync.ref) setTimeout(pushRemote, 1200);
}
async function archiveLog(epId, entries) {
  if (!sync.ref) return;
  try { await sync.db.doc('saves/main/log/' + epId).set({ ep: epId, entries, updatedAt: Date.now() }) } catch {}
}
function setSync(m) { sync.mode = m; const el = $('syncline'); if (el) el.textContent = syncText() }
function syncText() {
  return { account: 'Saved to your Claude account · follows you across browsers', local: 'Saved in this browser only', error: 'Account save failed · saved in this browser', checking: 'Connecting to your save…' }[sync.mode];
}
async function initRemote() {
  if (!window.claude || !window.claude.use) { setSync('local'); return }
  setSync('checking');
  try {
    const db = await window.claude.use('db');
    if (!db) { setSync('local'); return }
    sync.db = db;
    const ref = db.doc('saves/main');
    const snap = await ref.get();
    sync.ref = ref;
    if (snap.exists) {
      const r = snap.data();
      if (r && r.state && (r.updatedAt || 0) > (S.updatedAt || 0)) { S = Object.assign(fresh(), clone(r.state)); writeLocal(); render() }
      else if ((S.updatedAt || 0) > (r.updatedAt || 0)) pushRemote();
      setSync('account');
    } else if (S.updatedAt) { await pushRemote() } else setSync('account');
  } catch (e) { sync.ref = null; setSync('local') }
}

/* ---------- flow ---------- */
function epIndex(id) { return EPISODES.findIndex(e => e.id === id) }
function nextEpisode() { return EPISODES.find(e => !S.completed.includes(e.id)) }
function inProgress() { return S.cur && !S.completed.includes(S.cur.ep) && EP[S.cur.ep] ? S.cur : null }

function startEpisode(id) {
  const ep = EP[id];
  S.checkpoint = { ep: id, vars: clone(S.vars), journal: clone(S.journal), keys: clone(S.keys), log: clone(S.log) };
  const prev = (ep.previously || []).filter(p => test(p.if));
  S.cur = { ep: id, stage: prev.length ? 'previously' : 'card', scene: null, applied: null, choice: null };
  if (!S.started) S.started = Date.now();
  save(); render(true);
}
function restartEpisode() {
  const c = S.checkpoint; if (!c || !S.cur || c.ep !== S.cur.ep) return;
  S.vars = c.vars; S.journal = c.journal; S.keys = c.keys; S.log = c.log;
  S.cur = null; ui.confirm = null; closeDrawer(); startEpisode(c.ep);
}
function enterScene(id) {
  const ep = EP[S.cur.ep], sc = ep.scenes[id];
  S.cur.scene = id; S.cur.stage = 'scene'; S.cur.choice = null;
  if (S.cur.applied !== id) { applySet(sc.set); addJournal(sc.journal, ep.id); S.cur.applied = id }
  ui.whisper = null;
  save(); render(true);
}
function choose(i) {
  const ep = EP[S.cur.ep], sc = ep.scenes[S.cur.scene], c = visibleChoices(sc)[i];
  if (!c) return;
  applySet(c.set); addJournal(c.journal, ep.id);
  S.log.push({ ep: ep.id, scene: S.cur.scene, choice: c.text, key: c.key || null, t: Date.now() });
  if (c.key) S.keys.push({ ep: ep.id, text: c.key });
  if (!c.response || !c.response.length) { enterScene(c.goto); if (c.cue) { ui.whisper = c.cue; render(false) } return }
  S.cur.stage = 'response'; S.cur.choice = { text: c.text, response: c.response, cue: c.cue || null, goto: c.goto };
  ui.whisper = c.cue || null;
  save(); render(false);
  const r = $('resp'); if (r) r.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
}
function visibleChoices(sc) { return (sc.choices || []).filter(c => test(c.if)) }
function endEpisode() {
  const id = S.cur.ep;
  if (!S.completed.includes(id)) S.completed.push(id);
  const entries = S.log.filter(l => l.ep === id);
  S.logs[id] = entries; S.log = S.log.filter(l => l.ep !== id);
  S.checkpoint = null; S.cur.stage = 'end';
  save(); archiveLog(id, entries); render(true);
}

/* ---------- render ---------- */
function epTag(ep) { return `S${ep.season} · E${ep.episode}` }
function render(top) {
  closeDrawerIfStale();
  const st = $('stage'), cur = inProgress() || (S.cur && S.cur.stage === 'end' ? S.cur : null);
  $('duel').hidden = true;
  if (!ui.view && cur) ui.view = 'play';
  if (ui.view !== 'play' || !cur) { $('eplabel').textContent = ''; st.innerHTML = titleScreen(); bindTitle(); if (top) scrollTo(0, 0); return }
  const ep = EP[cur.ep];
  $('eplabel').textContent = `${epTag(ep)} — ${ep.title}`;
  if (cur.stage === 'previously') st.innerHTML = previously(ep);
  else if (cur.stage === 'card') st.innerHTML = titleCard(ep);
  else if (cur.stage === 'end') st.innerHTML = endCard(ep);
  else { ui.anim = !!top; st.innerHTML = sceneView(ep, cur) }
  bindStage();
  if (top) scrollTo(0, 0);
}
function titleScreen() {
  const ip = inProgress(), nx = nextEpisode();
  let btns = '';
  if (ip) btns += `<button class="go" data-a="resume">Continue · ${epTag(EP[ip.ep])}</button>`;
  else if (nx) btns += `<button class="go" data-a="start" data-ep="${nx.id}">${S.completed.length ? 'Play' : 'Begin'} · ${epTag(nx)} “${esc(nx.title)}”</button>`;
  else btns += `<p class="note">You’re caught up. The writers’ room is working on the next episode — tell Claude when you’re ready for it.</p>`;
  const rows = EPISODES.map(e => {
    const done = S.completed.includes(e.id), now = ip && ip.ep === e.id;
    return `<div class="eprow"><span class="n">${epTag(e)}</span><span class="t">${esc(e.title)}</span><span class="s ${done ? 'done' : ''}">${done ? 'Watched' : now ? 'In progress' : 'New'}</span></div>`;
  }).join('');
  return `<section class="title-screen fade">
    <div class="kicker">A drama in episodes · Fall 2009</div>
    <h1 class="show" style="margin-top:18px">The Hard <i>Saying</i></h1>
    <p class="verse">“This is a hard saying; who can listen to it?”<small>John 6:60</small></p>
    <div class="menu">${btns}</div>
    <div class="eplist">${rows}</div>
    <div class="sync" id="syncline">${syncText()}</div>
  </section>`;
}
function previously(ep) {
  const lines = (ep.previously || []).filter(p => test(p.if));
  return `<section class="prev fade"><div class="kicker">Previously on</div><h2>The Hard Saying</h2>
    <ul>${lines.map(l => `<li>${fmt(l.text)}</li>`).join('')}</ul>
    <button class="go" data-a="card">Continue</button></section>`;
}
function titleCard(ep) {
  return `<section class="card fade">
    <div class="epno">Season ${SEASON_WORDS[ep.season] || ep.season} · Episode ${EP_WORDS[ep.episode] || ep.episode}</div>
    <h2 class="eptitle">${esc(ep.title)}</h2>
    <div class="dates">${esc(ep.dates || '')}</div>
    <p class="log">${fmt(ep.logline || '')}</p>
    <div><button class="go" data-a="begin">Roll episode</button></div></section>`;
}
function duelHud(ep, sc) {
  const d = sc.duel && ep.duels && ep.duels[sc.duel];
  const el = $('duel');
  if (!d) { el.hidden = true; return }
  const pips = n => { n = Math.max(0, Math.min(5, Number(n) || 0)); return Array.from({ length: 5 }, (_, i) => `<span class="pip ${i < n ? 'on' : ''}"></span>`).join('') };
  el.innerHTML = `<div class="duel-in"><div class="duel-title">Argument · ${esc(d.title)} <span>— ${esc(d.topic || '')}</span></div>
    ${['rigor', 'wit', 'heart'].map(a => `<div class="meter">${a}<span class="pips" aria-label="${a} ${get('duel.' + sc.duel + '.' + a)}">${pips(get('duel.' + sc.duel + '.' + a))}</span></div>`).join('')}</div>`;
  el.hidden = false;
}
function sceneView(ep, cur) {
  const sc = ep.scenes[cur.scene];
  if (!sc) return `<p class="empty">This scene is missing. Open the menu to restart the episode.</p>`;
  duelHud(ep, sc);
  let h = `<article class="${ui.anim ? 'fade' : ''}"><div class="chyron">${esc(sc.slug)}</div>`;
  if (sc.music) h += `<div class="cue">${esc(sc.music)}</div>`;
  h += `<div class="prose">${renderItems(sc.body)}</div>`;
  if (cur.stage === 'response' && cur.choice) {
    h += `<div id="resp" class="${ui.anim ? '' : 'fade'}"><div class="chosen">${esc(cur.choice.text)}</div>`;
    if (ui.whisper) h += `<div class="whisper">${esc(ui.whisper)}</div>`;
    h += `<div class="prose response">${renderItems(cur.choice.response)}</div>`;
    h += `<button class="go" data-a="goto">Continue</button></div>`;
  } else {
    if (ui.whisper) h += `<div class="whisper">${esc(ui.whisper)}</div>`;
    const ch = visibleChoices(sc);
    if (ch.length) h += `<div class="choices" role="group" aria-label="What does Jack do?">${ch.map((c, i) => `<button class="choice" data-a="choose" data-i="${i}">${c.tag ? `<span class="tag">${esc(c.tag)}</span>` : ''}<span>${fmt(c.text)}</span></button>`).join('')}</div>`;
    else if (sc.end) h += `<button class="go" data-a="end">End of episode</button>`;
    else if (sc.next) h += `<button class="go" data-a="next">Continue</button>`;
  }
  return h + `</article>`;
}
function endCard(ep) {
  const keys = (S.logs[ep.id] || []).filter(l => l.key);
  const nx = nextEpisode();
  return `<section class="endc fade">
    <div class="kicker">${epTag(ep)} · End of episode</div>
    <h2 style="margin-top:10px">${esc(ep.title)}</h2>
    ${keys.length ? `<div class="sect"><h5>What you chose</h5><ul>${keys.map(k => `<li><span>${fmt(k.key)}</span></li>`).join('')}</ul></div>` : ''}
    ${ep.endCard && ep.endCard.tag ? `<p class="tagline">${fmt(ep.endCard.tag)}</p>` : ''}
    ${ep.endCard && ep.endCard.nextTime && ep.endCard.nextTime.length ? `<div class="next-time"><div class="kicker" style="margin-bottom:12px">Next time on The Hard Saying</div>${ep.endCard.nextTime.map(t => `<p>${fmt(t)}</p>`).join('')}</div>` : ''}
    <div class="sect"><p class="note">This episode is locked in. ${nx ? '' : 'When you’re ready for the next one, tell Claude: the writers’ room will read your save and build the next episode on the path you took.'}</p>
    <div class="row">${nx ? `<button class="go" data-a="start" data-ep="${nx.id}">Play ${epTag(nx)}</button>` : ''}<button class="ghost" data-a="title">Title screen</button><button class="ghost" data-a="journal">Open journal</button></div></div>
  </section>`;
}
function bindTitle() {
  $('stage').querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === 'resume') { ui.view = 'play'; render(true) }
    if (a === 'start') { ui.view = 'play'; startEpisode(b.dataset.ep) }
  });
}
function bindStage() {
  $('stage').querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a, ep = EP[S.cur.ep];
    if (a === 'card') { S.cur.stage = 'card'; save(); render(true) }
    else if (a === 'begin') enterScene(ep.start);
    else if (a === 'choose') choose(Number(b.dataset.i));
    else if (a === 'goto') { const g = S.cur.choice.goto; enterScene(g) }
    else if (a === 'next') enterScene(ep.scenes[S.cur.scene].next);
    else if (a === 'end') endEpisode();
    else if (a === 'start') { ui.view = 'play'; startEpisode(b.dataset.ep) }
    else if (a === 'title') { ui.view = 'title'; render(true) }
    else if (a === 'journal') openDrawer('journal');
  });
}

/* ---------- drawer: journal + menu ---------- */
function openDrawer(kind) { ui.drawer = kind; ui.confirm = null; drawDrawer(); $('drawer').hidden = false; $('scrim').hidden = false; $('drawer').focus?.() }
function closeDrawer() { ui.drawer = null; $('drawer').hidden = true; $('scrim').hidden = true }
function closeDrawerIfStale() { if (ui.drawer) drawDrawer() }
function drawDrawer() {
  const d = $('drawer');
  if (ui.drawer === 'journal') {
    const tabs = [['person', 'People'], ['clue', 'Clues'], ['note', 'Notes'], ['story', 'Story so far']];
    let body = '';
    if (ui.tab === 'story') {
      const byEp = {};
      for (const k of S.keys) (byEp[k.ep] = byEp[k.ep] || []).push(k.text);
      body = Object.keys(byEp).length ? Object.entries(byEp).map(([e, ks]) => `<div class="sect"><h5>${EP[e] ? epTag(EP[e]) + ' · ' + esc(EP[e].title) : esc(e)}</h5>${ks.map(t => `<div class="entry"><p>${fmt(t)}</p></div>`).join('')}</div>`).join('') : `<p class="empty">Nothing yet. Your biggest choices collect here.</p>`;
    } else {
      const items = Object.values(S.journal).filter(j => j.kind === ui.tab).sort((a, b) => b.u - a.u);
      body = items.length ? items.map(j => `<div class="entry"><h4>${esc(j.title)}</h4><div class="src">${EP[j.ep] ? epTag(EP[j.ep]) : ''}</div><p>${fmt(j.text)}</p></div>`).join('') : `<p class="empty">${{ person: 'No one yet. People Jack meets get a page here.', clue: 'No clues yet. Keep your eyes open.', note: 'No notes yet.' }[ui.tab]}</p>`;
    }
    d.innerHTML = `<div class="dhead"><h3>Jack’s Journal</h3><button class="bar-btn" data-d="close">Close</button></div>
      <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${ui.tab === k}" data-tab="${k}">${l}</button>`).join('')}</div>${body}`;
  } else {
    const ip = inProgress();
    const canRestart = ip && S.checkpoint && S.checkpoint.ep === ip.ep;
    d.innerHTML = `<div class="dhead"><h3>Menu</h3><button class="bar-btn" data-d="close">Close</button></div>
      <div class="sect"><h5>Display</h5><div class="row"><button class="ghost" data-d="theme" data-v="dark">Dark</button><button class="ghost" data-d="theme" data-v="light">Light</button><button class="ghost" data-d="theme" data-v="">Match device</button></div></div>
      <div class="sect"><h5>Episode</h5>${canRestart ? `<p class="note">You can replay ${epTag(EP[ip.ep])} from its beginning until you finish it. Once it ends, it’s locked.</p>
        ${ui.confirm === 'restart' ? `<div class="confirm"><p>Restart ${epTag(EP[ip.ep])}? Everything you chose in this episode is undone.</p><div class="row"><button class="go" style="margin:0" data-d="restart-yes">Restart episode</button><button class="ghost" data-d="cancel">Keep playing</button></div></div>` : `<button class="ghost" data-d="restart">Restart this episode</button>`}` : `<p class="note">No episode in progress. Finished episodes are locked.</p>`}</div>
      <div class="sect"><h5>Save</h5><p class="note" id="syncline2">${syncText()}</p>
        <p class="note">Backup code: copy it to move your save by hand if your account save is unavailable.</p>
        <div class="row"><button class="ghost" data-d="copy">Copy save code</button><button class="ghost" data-d="import">Paste a save code</button></div>
        ${ui.confirm === 'import' ? `<div class="confirm"><p>Paste a save code. It replaces your current progress.</p><textarea id="impcode" aria-label="Save code"></textarea><div class="row" style="margin-top:8px"><button class="go" style="margin:0" data-d="import-yes">Load save</button><button class="ghost" data-d="cancel">Cancel</button></div><p class="note" id="impmsg"></p></div>` : ''}
        ${ui.confirm === 'copied' ? `<p class="note">Copied.</p>` : ''}${ui.confirm === 'copyfail' ? `<textarea readonly aria-label="Save code">${esc(saveCode())}</textarea>` : ''}</div>`;
  }
  d.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; drawDrawer() });
  d.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    const a = b.dataset.d;
    if (a === 'close') closeDrawer();
    else if (a === 'theme') { setTheme(b.dataset.v) }
    else if (a === 'restart') { ui.confirm = 'restart'; drawDrawer() }
    else if (a === 'restart-yes') restartEpisode();
    else if (a === 'cancel') { ui.confirm = null; drawDrawer() }
    else if (a === 'copy') { navigator.clipboard.writeText(saveCode()).then(() => { ui.confirm = 'copied'; drawDrawer() }, () => { ui.confirm = 'copyfail'; drawDrawer() }) }
    else if (a === 'import') { ui.confirm = 'import'; drawDrawer() }
    else if (a === 'import-yes') {
      try { const s = JSON.parse(decodeURIComponent(escape(atob($('impcode').value.trim())))); if (!s || s.v !== 1) throw 0; S = Object.assign(fresh(), s); save(); ui.view = 'title'; closeDrawer(); render(true) }
      catch { $('impmsg').textContent = 'That code didn’t load. Copy the whole code and try again.' }
    }
  });
}
function saveCode() { return btoa(unescape(encodeURIComponent(JSON.stringify(S)))) }
function setTheme(v) {
  if (v) document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem(LS_THEME, v) } catch {}
}

$('home').onclick = () => { ui.view = 'title'; closeDrawer(); render(true) };
$('jbtn').onclick = () => ui.drawer === 'journal' ? closeDrawer() : openDrawer('journal');
$('mbtn').onclick = () => ui.drawer === 'menu' ? closeDrawer() : openDrawer('menu');
$('scrim').onclick = closeDrawer;
addEventListener('keydown', e => { if (e.key === 'Escape' && ui.drawer) closeDrawer() });

function start(data) {
  try { const t = localStorage.getItem(LS_THEME); if (t === null) setTheme('dark'); else if (t) setTheme(t) } catch { setTheme('dark') }
  const local = readLocal();
  if (data && data.S) S = Object.assign(fresh(), data.S);
  else if (local) S = Object.assign(fresh(), local);
  ui.view = 'title';
  render(true);
  initRemote();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) { try { hot.snapshot(() => ({ S })) } catch {} }
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
</script>
