<style>
/* Layout: one reading column under a thin broadcast bar; full-bleed night for title cards; period artifacts as inset objects. */
:root {
  --night: #12151c;      /* fog at 2 a.m. */

  --ink: #e8e1d3;        /* lamplit page */
  --ink-dim: #a39b8c;

  --votive-dim: #8a6a33;

  --fb-blue: #3b5998; --fb-bg: #ffffff; --fb-ink: #333333; --fb-meta: #7f7f7f; --fb-line: #d8dfea;
  --aim-bg: #fff8c9; --aim-ink: #2b2b2b; --aim-bar: #1f4fa3; --aim-bar-ink: #ffffff;

  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --night: #f2eee6; --night-2: #e8e2d6; --ink: #1f1c18; --ink-dim: #6b6458; --rule: #d3cbbb;
  --votive: #9a6a14; --votive-dim: #c9a868; --wound: #a3423c; color-scheme: light } }
:root[data-theme="light"] {
  --night: #f2eee6; --night-2: #e8e2d6; --ink: #1f1c18; --ink-dim: #6b6458; --rule: #d3cbbb;
  --votive: #9a6a14; --votive-dim: #c9a868; --wound: #a3423c; color-scheme: light }

* { box-sizing: border-box }

em { font-style: italic }

  border: 1px solid var(--rule); border-radius: 2px; padding: 5px 10px; color: var(--ink) }

.fade { animation: fade .45s ease both }

.chyron { font-family: var(--util); text-transform: uppercase; letter-spacing: .2em; font-size: .82rem; font-weight: 500;
  color: var(--ink-dim); display: flex; gap: 10px; align-items: baseline; margin: 6px 0 22px }
.chyron::before { content: ""; width: 26px; height: 2px; background: var(--votive); flex: none; transform: translateY(-3px) }

@keyframes glow { 0% { opacity: 0 } 30% { opacity: 1 } 100% { opacity: .85 } }
.brk { text-align: center; color: var(--votive-dim); letter-spacing: 1em; margin: 1.6em 0; font-size: .9rem }

/* Choices */
.choices { display: grid; gap: 10px; margin-top: 1.6em }

  font-family: var(--body); font-size: 1.04rem; line-height: 1.45; display: flex; gap: 12px; align-items: baseline; transition: border-color .15s, background .15s }
.choice:hover { border-color: var(--votive); background: color-mix(in srgb, var(--votive) 7%, transparent) }
.choice .tag { font-family: var(--util); text-transform: uppercase; letter-spacing: .14em; font-size: .72rem; color: var(--votive);
  border: 1px solid var(--votive-dim); padding: 1px 6px; border-radius: 2px; flex: none; transform: translateY(-1px) }
.go { margin-top: 1.6em; background: var(--votive); color: var(--night); border: 0; border-radius: 2px; padding: 11px 22px;
  font-family: var(--util); text-transform: uppercase; letter-spacing: .18em; font-size: .9rem; font-weight: 600 }
.go:hover { filter: brightness(1.08) }
.ghost { background: none; border: 1px solid var(--rule); color: var(--ink); border-radius: 2px; padding: 10px 18px;
  font-family: var(--util); text-transform: uppercase; letter-spacing: .16em; font-size: .85rem }
.ghost:hover { border-color: var(--votive); color: var(--votive) }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }

/* Period inserts */
.ins { margin: 1.4em 0 }
.phone { background: var(--phone); color: var(--phone-ink); border-radius: 18px; padding: 12px 12px 14px; max-width: 18rem; box-shadow: 0 6px 18px rgba(0,0,0,.35) }
.phone-top { display: flex; justify-content: space-between; font-family: var(--util); letter-spacing: .1em; font-size: .72rem; text-transform: uppercase; padding: 0 4px 8px; opacity: .8 }
.lcd { background: var(--lcd-bg); color: var(--lcd-ink); font-family: var(--lcd); font-size: 1.32rem; line-height: 1.15; padding: 10px 12px; border-radius: 4px;
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.18); overflow-wrap: anywhere }
.lcd .from { display: block; border-bottom: 1px dashed currentColor; margin-bottom: 6px; padding-bottom: 2px; opacity: .85 }

.card { min-height: 62vh; display: grid; place-content: center; text-align: center; gap: 14px }

.prev ul, .endc ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px }

.endc li::before { content: ""; width: 7px; height: 7px; background: var(--votive); flex: none; transform: translateY(-2px) }
.next-time { margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--rule) }
.next-time p { font-family: var(--display); font-style: italic; margin: 0 0 .5em; color: var(--ink-dim) }
.tagline { font-family: var(--display); font-style: italic; font-size: 1.3rem; margin: 28px 0 }
.note { color: var(--ink-dim); font-size: .95rem }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20 }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(30rem, 100%); background: var(--night-2); z-index: 21; overflow-y: auto;
  border-left: 1px solid var(--rule); padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 18px }
.drawer h3 { font-family: var(--display); font-style: italic; font-weight: 400; font-size: 1.7rem; margin: 0 }
.dhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 1px solid var(--rule) }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; font-family: var(--util); text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; color: var(--ink-dim) }
.tab[aria-selected="true"] { color: var(--votive); border-color: var(--votive) }
.entry { padding: 12px 0; border-bottom: 1px solid var(--rule) }
.entry h4 { margin: 0 0 4px; font-family: var(--util); text-transform: uppercase; letter-spacing: .1em; font-size: .9rem; font-weight: 600 }
.entry .src { font-family: var(--util); letter-spacing: .1em; font-size: .7rem; color: var(--ink-dim); text-transform: uppercase }
.entry p { margin: 4px 0 0; font-size: 1rem }
.empty { color: var(--ink-dim); font-style: italic }
.confirm { border: 1px solid var(--wound); padding: 14px; margin-top: 12px }
.confirm p { margin: 0 0 10px }
textarea { width: 100%; min-height: 7rem; background: var(--night); color: var(--ink); border: 1px solid var(--rule); font-family: var(--lcd); font-size: 1rem; padding: 8px }

</style>

<script>
const EPISODES = [{"id":"S1E01","season":1,"episode":1,"showTitle":"The Hard Saying","title":"Lip Service","dates":"Saturday, August 29 – Sunday, August 30, 2009","logline":"A Youngstown kid arrives at the most godless beach in California and meets the one girl on the back porch who’s as unimpressed as he is.","previously":[],"cast":[{"id":"lena","name":"Lena Broussard","role":"The girl on the porch","tracked":true},{"id":"theo","name":"Theo Vance","role":"Roommate, Room 412","tracked":true},{"id":"laney","name":"Laney Price","role":"Lena’s roommate","tracked":true},{"id":"margot","name":"Margot Lindqvist","role":"Third floor, Delgado","tracked":true},{"id":"kevin","name":"Kevin Tran","role":"Down the hall, Room 420","tracked":true},{"id":"osei","name":"Fr. Gabriel Osei","role":"Newman Center chaplain","tracked":true},{"id":"hale","name":"Prof. Adrian Hale","role":"Philosophy, Marisol","tracked":true},{"id":"julian","name":"Julian Park-Ellis","role":"A guy with a guitar","tracked":true},{"id":"frank","name":"Frank Costigan","role":"Jack’s father","tracked":false},{"id":"maria","name":"Maria Costigan","role":"Jack’s mother","tracked":false},{"id":"nonna","name":"Carmela Rinaldi","role":"Jack’s grandmother","tracked":false},{"id":"gina","name":"Gina Costigan","role":"Jack’s sister","tracked":false},{"id":"priya","name":"Priya Raman","role":"4th-floor RA","tracked":false},{"id":"rafi","name":"Rafi Ochoa","role":"Second floor","tracked":false},{"id":"doug","name":"Doug Pruitt","role":"Room 420","tracked":false},{"id":"joey","name":"Joey Abruzzo","role":"Newman regular","tracked":false},{"id":"tyler","name":"Tyler Brandt","role":"Newman missionary","tracked":false},{"id":"fitch","name":"Dolores Fitch","role":"Newman secretary","tracked":false},{"id":"sloane","name":"Sloane Kittredge","role":"Pi Lambda Chi","tracked":false},{"id":"gloria","name":"Gloria Mendes","role":"The Anchor, nights","tracked":false}],"duels":{"lipservice":{"title":"On Lip Service","opponent":"lena","topic":"Whether keeping the outward forms without the heart is hypocrisy — or how a heart gets made."}},"start":"s01","endCard":{"tag":"Whites in HOT. Darks in COLD. MEDALS OFF.","nextTime":["“One soul, Mr. Costigan. Show me where you keep it.”","“You’re in *this* class? Of course you’re in this class.”","“Four out of ten? Hon, you’re hired.”","“Full moon, Costigan. LA is three hours. Get in the car.”","“In a Relationship.”"]},"scenes":{"s01":{"slug":"SATURDAY · 6:52 AM · CALIFORNIA STATE ROUTE 1, NORTH OF MARISOL","music":"Bruce Springsteen — “Youngstown”","body":["The defroster in the Silverado only works on high, so the cab is either a sauna or a meat locker, and for the last four hundred miles Frank Costigan has chosen sauna. The windshield sweats anyway. Beyond it the world has been erased — a white wall of marine fog with the yellow center line running into it like a fuse — and the St. Christopher on the visor clip swings every time the road bends, which on Highway 1 is always.","They are 2,400 miles from Glenwood Avenue; his father has announced the number at every fill-up since Indiana, the way other men say the rosary. Rust blooms over the rear wheel wells like a rash, and the left blinker has been dead since Bush’s first term, so Frank signals by sticking his arm out the window like a man hailing a cab in 1955. They came down out of Flagstaff in the dark — Barstow, then Bakersfield, gas at $2.99, which Frank took personally — on Folgers from a dented green Thermos, and no, at every exit, Jack could not drive.","*The Moviegoer* lies face down on Jack’s knee, a postcard from Oxford for a bookmark; he hasn’t turned a page since the mountains. The only CD in the truck is Springsteen, and the song is the one about their town. Now, as the fog thins to gauze, Frank sings along to the part about the furnaces — under his breath, half a step flat, a man who sings Sinatra in the garage and nowhere else on earth. He catches Jack watching, punches the CD out like it insulted his mother, and turns the dial to AM.","AM is a man in Boston standing in the rain. Crowds outside Mission Church since before dawn, umbrellas three deep, the motorcade on its way; the family, the President, a cardinal; the senator’s funeral Mass. Then the same voice slides without a seam from one sorrow to the next — *…and in New Orleans today, four years after Katrina…* — and Frank turns it down to a murmur. Jack is watching the fog.","“They’re burying Teddy today,” Frank says. He drives for a while. “He was our guy.” Another mile. “And he was wrong about the babies.”","That’s the eulogy. That’s the whole of Costigan politics, too — the union and the Church, the JFK picture in Nonna’s hallway next to the Sacred Heart, and the long silence at the kitchen table every November after everybody has voted and nobody will say how. Jack loves him for saying it, and loves him more for being unable to say one thing past it.","Then the fog tears. It doesn’t lift, it tears, like wet paper, and through the hole there’s a slope of gold grass falling away and below it a band of hammered pewter that goes out to the edge of the world and keeps going. Frank swerves into a gravel turnout without signaling, not that he could. His father gets out. He leaves the engine running and the door open and the dinger dinging, walks to the guardrail in his UAW Local 1112 windbreaker with his hands in his pockets, and stands there.","Jack gets out too but stays by the truck. The air tastes of salt and something green and rotten, and there’s the sound nobody warned him about — less a noise than a pressure, the whole Pacific breathing against the rocks below. Frank is fifty-one, twenty-six years on the line at Lordstown, and has never stood at the edge of anything this big that wasn’t a layoff. Jack has never seen an ocean either, but he’s eighteen; he’ll have time. He doesn’t say a word. Jack watches his father look at an ocean, and suspects some of those miles were for this.","When Frank comes back he doesn’t get in. He leans on the hood and takes an envelope out of the windbreaker — St. Brigid of Kildare School, the parish crest in the corner, gone soft from riding against his chest the whole width of the country — and holds it out.",{"type":"doc","title":"Envelope, St. Brigid of Kildare School, in Mom’s handwriting","text":"JACKIE —\nFor BOOKS. Not pizza. Not cigarettes, I wasn’t born yesterday.\nCall Nonna Sunday after Mass. She waits by the phone.\nLove, Mom\n(Nonna says buy a coat.)"},"“Three hundred and forty,” Frank says. “Two hundred’s from your nonna. Hundred’s from your mother. Forty’s from me — don’t tell your mother there’s a forty.”","Jack counts it anyway, because he is his father’s son: seventeen twenties, soft as cloth. He knows the SUB pay runs out in October. And he knows that behind the bench seat of this truck, where there was nothing at all in Youngstown, there is now a pillow from the hall closet and the brown afghan off the couch, folded small, the way you fold something you don’t want anybody asking about. Nobody has asked.","Frank looks at the water again. “Your brother wanted me to tell you something.” He takes his time with it. “He said — and I’m quoting — ‘Tell the Professor don’t be a pussy.’”","He laughs, a big one, and it catches on something halfway up and turns into a cough, and he coughs it into his fist and keeps his eyes on the Pacific like it might try something. Jack’s hand has found the St. Michael medal under his T-shirt. He holds on to it the way you hold a bus strap on a hard corner. The gulls go on without them."],"journal":[{"kind":"person","id":"frank","title":"Dad","text":"Frank Costigan. Twenty-six years on the line at Lordstown, laid off since June. Drove me 2,400 miles because two plane tickets cost more than the truck is worth. Saw the Pacific for the first time today. Didn’t say anything. That’s how you know."}],"choices":[{"text":"“Thanks for driving me, Dad. All of it.”","tag":"Sincerity","set":{"trait.sincerity":"+1","soul.honesty":"+1","e1_dad_thanked":true},"response":["“It’s a truck,” Frank says. “It drives.” He finds something very interesting about the guardrail.","Then, not looking at Jack: “Your grandfather would’ve liked this. He’d have hated it. But he’d have liked it.” He gets back in the truck and shuts the door twice, because it takes two."],"goto":"s02"},{"text":"“It’s just Lake Erie with a tan.”","tag":"Wit","set":{"trait.wit":"+1","e1_dad_joked":true},"response":["Frank barks — the real laugh, the garage laugh, the one that usually needs a Stroh’s to get it out. “Don’t let your mother hear you. She thinks Erie’s a resort.”","He wipes his eyes and says the wind out here is really something, and Jack agrees that the wind is really something."],"goto":"s02"},{"text":"“Take the money back. You need it more than I need California.”","tag":"Candor","set":{"trait.candor":"+1","soul.honesty":"+1","e1_offered_money_back":true},"response":["Frank’s face comes down like a garage door. “Don’t you ever say that.” Low, not loud; Frank Costigan has never once needed loud. “Not after what it — ”","He stops. Whatever the end of that sentence is, he puts it back wherever he keeps it. He presses the envelope flat against Jack’s chest with two fingers and holds it there until Jack takes it. “You’re here. That’s what it was for. Don’t waste it.”"],"goto":"s02"}]},"s02":{"slug":"SATURDAY · 9:20 AM · DELGADO HALL, ANACAPA COMPLEX","music":"Phoenix — “1901”","body":["By nine-twenty the fog is coming off the Lagoon in long white rags, and the egrets standing in the shallows look like they were placed there by the admissions office. The whole campus smells like a cough drop a cat slept on. That’s eucalyptus, an orientation leader in a teal T-shirt informs Jack, unprompted, walking backward; you get used to it. Everyone here walks backward. Everyone here is in a teal T-shirt.","The Anacapa complex is chaos with a color scheme. A mother sobbing into a Bed Bath & Beyond bag while her son, dying, holds her shower caddy. A father assembling a futon frame upside down with the serene confidence of a man who has never read an instruction in his life. Somebody’s speakers are playing Phoenix out of a third-floor window, that bright, jangling song that’s been on every college station since spring, and it sounds like the first day of something.","Over all of it, Delgado Hall: five stories of 1967 concrete with a grid of narrow windows facing the water, a building that looks like a parking garage that went to college. Jack loves it on sight. It looks like home.","Frank noses the Silverado into the loading zone, under a sign that says 15 MINUTES, where two orientation leaders with clipboards are already shaking their heads. He gets out and puts a hand over his heart. “Ladies, I’m from Ohio. I’m going to need you to forgive me in advance.” Jack has seen this work on nuns and on a state trooper outside Erie. It works on OLs.","The mini-fridge is the problem; it weighs what a mini-fridge weighs, plus the cans of Nonna’s tomatoes his mother hid inside it. They are wrestling it up the front steps, Frank swearing in a low murmur composed mostly of saints, when a kid comes out through the doors — sun-dark, salt-stiff hair, flip-flops, a surfboard under one arm and a skateboard under the other — leans both boards against the wall without a word, and picks up the other end. At the fourth floor he sets it down outside 412, says, “No stress, boss,” and is gone before Frank can get his wallet out. Frank stands in the hallway holding a five, deeply offended by California.","It’s on the third trip down — Jack with a milk crate of paperbacks, Frank carrying the lamp Nonna bought at Big Lots — that Jack sees her.","Across the Commons Lawn, much too far to hear a word: a girl in a yellow sundress and beat-up brown cowboy boots, holding a lamp shaped like a pelican, arguing with a campus parking officer beside a car with its hazards blinking. She’s losing. The ticket book is out; the pelican is wobbling. Then — he can’t see what changes. She says something, using the pelican as a visual aid. Her honey-brown hair has come loose and the sun has found the gold in it, and the officer’s pen stops moving. She laughs with her whole head tipped back, the laugh of somebody who has never once been embarrassed by her own laugh, and the officer, against every instinct of his profession, tears the ticket in half. She pats his arm, tucks the pelican under one arm like a football, and walks into the crowd of teal shirts and minivans, and the crowd closes over her, and she’s gone.","Jack is standing in the middle of the sidewalk holding a milk crate full of dead philosophers.","Beside him, Frank shifts Nonna’s lamp to his other hand. “Close your mouth,” he says. “You’ll catch flies.”"],"journal":[{"kind":"note","id":"pelican","title":"Pelican girl","text":"A girl across the quad won an argument with a parking cop while holding a lamp shaped like a pelican. I didn’t catch her name. I didn’t catch anything. Dad says close your mouth."}],"choices":[{"text":"“I’m going to marry that girl.”","tag":"Reckless","set":{"trait.reckless":"+1","e1_marry_joke":true},"response":["“Your grandfather said that about your nonna,” Frank says. “At a dance at St. Anthony’s. She threw a shoe at him.”","“Did he marry her?”","“She threw the other one at the wedding.” He starts up the steps. “Costigans don’t get the easy ones, Jackie. Get the door.”"],"goto":"s03"},{"text":"Pick up the next box.","tag":"Control","set":{"trait.control":"+1"},"response":["“Atta boy,” Frank says, in the voice that means *atta boy, don’t*, and Jack carries the crate up the steps and doesn’t look back.","He does, actually. Once. From the window on the second-floor landing, where there’s nothing left to see but teal shirts and a dad still losing to a futon."],"goto":"s03"},{"text":"“Nice lamp.”","tag":"Wit","set":{"trait.wit":"+1"},"response":["“That’s a pelican, Jackie.”","“That’s what makes it nice.”","Frank considers him with the face he uses for the Browns’ draft picks. Then he looks at the place in the crowd where she used to be, and the corner of his mouth goes. “Get the door, Romeo.”"],"goto":"s03"}]},"s03":{"slug":"SATURDAY · 10:05 AM · DELGADO HALL, ROOM 412","music":"MGMT — “Time to Pretend”","body":["Room 412 is already half moved in, by nobody Jack can see. The left side has been done by professionals: a 42-inch flat-screen with its cords zip-tied into a neat braid; an espresso machine the size and color of a small sports car; a bed made with hospital corners in white sheets so heavy they look poured. Over the bed, framed, a movie poster — a man in a suit with a gun, the title in red, *Point Blank*, 1967. On the desk a MacBook Pro, and propped against it a card on cream stock so heavy it stands up on its own.",{"type":"doc","title":"Card, heavy cream stock, propped against the laptop","text":"Theodore Vance arrives approx. 11.\nPlease don’t touch the espresso machine.\n—J. (Mr. Vance’s office)"},"*Theodore Vance, Los Angeles*, said the housing email, and nothing else, and Jack has spent the summer building a Theodore Vance out of that — pale, asthmatic, possibly a cellist. He does his own side in twenty minutes, because there isn’t much of it. Three flannels and the gray Cardinal Mooney hoodie. Danny’s jacket on the hook behind the door, too big in the shoulders. The St. Anthony candle, contraband, rolled in a pair of socks at the back of the closet. Forty-one paperbacks in a milk crate, shelved by argument rather than author. Frank rests his eyes on the bare mattress, boots off the end.","At ten-forty the door bangs open and a voice says, “I’m early. Nobody panic. I’m as shocked as you are.”","Theodore Vance is not a cellist. He is tall and tanned and golden in a way Jack has only seen on magazines at the Giant Eagle checkout — blond hair arranged to look slept on, expensively; sunglasses on indoors; an iced coffee the size of a paint can. A gray T-shirt with a hole at the collar that somehow makes the hole look like a decision. Jeans that fit like they were negotiated by lawyers. A heavy steel watch with a black face. Before he’s said hello to anybody he has slotted his iPhone into a speaker dock on the dresser and filled 412 with synthesizers: a song Jack half-knows from somebody’s older brother’s car, bright and doomed, about getting rich and dying young and calling it a plan.","Then he turns and takes in the milk crate, the flannels, the man sitting up on the mattress, and smiles. Jack understands at once that the smile is a professional instrument and that he is currently being played on it, and finds he doesn’t mind.","“John Costigan. Youngstown, Ohio.” Theo points at him with the iced coffee. “Only interesting line in the whole housing email. Theo. Nobody calls me Theodore unless I’m in trouble, and I try to keep that to weekends. And you’re going to tell me about the eyebrow. Not yet. I like to save things.” He turns before Jack can answer and puts out his hand. “Mr. Costigan. Sir.”","Theo asks about the truck — he saw it in the loading zone, the green Silverado, what year, how many miles (“Two-twelve,” Frank says), *God bless* — and then his eyes drop to the windbreaker. “Local 1112. That’s Lordstown. You build the Cobalt.” He catches Jack’s look. “I looked up Youngstown after the housing email. Occupational hazard.”","Frank, who walked into this room prepared to dislike everything in it, says, “Built.”","“Built,” Theo agrees, and doesn’t flinch, and doesn’t do the sad head-tilt Jack has been getting from strangers since June. “Your local gave back everything they asked for in ’07, and more this spring to keep the doors open, and they laid you off anyway. That’s not a business plan. That’s a mugging with a press release.” He shrugs. “My father runs a studio. I know what a studio does to a union. Same playbook, better catering.”","Frank studies him. Then he says, “What’s your old man drive?” and Theo says, “A Bentley he’s ashamed of,” and Frank laughs out loud. He nods at the watch. “That a Rolex?” “My grandfather’s,” Theo says, and for once doesn’t elaborate. “He’d have liked you. He hated everybody.” And that’s it, it’s over: Jack has lost his father to Los Angeles in about ninety seconds.","Theo’s phone buzzes in the dock and the song cuts out mid-swagger. He glances at the screen, and his face goes dark — a light switched off in a back room — and comes back on so fast Jack can’t be sure he saw it. “My mother,” Theo announces, “is in La Cañada, which is currently on fire. I need a witness.” He hands Jack the phone. The screen says *Mom*.",{"type":"sms","from":"Mom","text":"the sky is ORANGE. ash in the pool","time":"10:52 AM"},{"type":"sms","from":"Mom","text":"Pierre says we should go. should i take the dogs or the Hockney","time":"10:52 AM"},"“The dogs,” Theo says, taking the phone back. “Obviously the dogs.” He considers. “Unless it’s the swimming-pool one.”","He goes to the window to call her, and for a few seconds his voice belongs to somebody else — lower, younger, careful. *Mom. Hey. No — listen to me. Just put them in the car.* A kid’s voice. Jack looks at the floor so as not to be in the room for it. Then Theo says, “Pierre is a life coach, Mother, he is not the fire department,” and he’s back, hanging up, grinning, and the song picks up where it left off.","Frank, who has had enough of California for one morning, goes down to move the truck before the teal girls change their minds.","So Jack hangs Nonna’s crucifix: olive wood from a parish pilgrimage to the Holy Land in 1988, the corpus worn pale at the feet where her thumb has touched it since before he was born. He finds a seam between cinderblocks where the mortar gives and drives the nail with his father’s hammer. It isn’t big. It looks big in here, across from the poured sheets and the man with the gun.","Theo watches it go up. He looks at it longer than Jack expects — not the way people look at a crucifix to make a point, but the way you’d look at somebody across a room when you aren’t sure you know them. Then he takes a long pull of iced coffee.","“Is he staying?” he says. “He seems like a lot.” And before Jack can answer: “Also. The eyebrow. Now. I’ve been patient for a quarter of an hour, which is a personal best.”"],"journal":[{"kind":"person","id":"theo","title":"Theo Vance","text":"Roommate. Los Angeles. Arrived with his grandfather’s watch, a movie poster and an espresso machine nobody is allowed to touch. His mom might be on fire. He talked to my dad like he’d known him for years. I can’t tell yet if he’s the best thing that’s going to happen to me here or the worst. Possibly both by Tuesday."}],"choices":[{"text":"“He stays. He was here first. You can have the wall over your bed for your Kubrick.” Then the eyebrow: a hockey puck.","tag":"Wit","set":{"trait.wit":"+1","rel.theo.warmth":"+1","scar_told_theo":"puck","e1_crucifix_up":true},"response":["“Phantoms game,” Jack says. “Ninth grade. Front row, behind the glass, except there was a gap in the glass.”","“And the puck hit you.”","“I was the puck.”","Theo stares at him for what feels like a full reel. “*Point Blank* is Boorman, Costigan,” he says at last. “But I’ll allow it.” And he takes off his sunglasses for the first time — green eyes, a little bloodshot, older than the rest of his face — and looks at Jack like a director at an audition who has just stopped taking notes."],"goto":"s04"},{"text":"“He stays. Problem?” Then the eyebrow: Sister Mary Clement.","tag":"Candor","set":{"trait.candor":"+1","rel.theo.trust":"+1","scar_told_theo":"nun","e1_crucifix_up":true},"response":["“Sister Mary Clement,” Jack says. “Third grade. Wooden ruler with a metal edge. She was aiming for my soul.”","Theo raises the iced coffee to the crucifix like a toast. “No problem. I’ve always wanted a chaperone.” The sunglasses stay pointed at it a little long; Jack can’t see the eyes behind them, only where the lenses are aimed. Then Theo is asking, with total seriousness, whether nuns are still legally allowed to hit people, “because I have a list, and several of them are in the industry.”"],"goto":"s04"},{"text":"Hang it a little lower, so it’s “not watching your side.” Then the eyebrow: a swan.","tag":"Charm","set":{"trait.charm":"+1","rel.theo.warmth":"+1","scar_told_theo":"swan","e1_crucifix_up":true},"response":["Jack pulls the nail, finds a softer seam lower down, and rehangs it facing the door instead of the poured sheets. “There. Not watching your side.”","“And the eyebrow?”","“A swan. Mill Creek Park. Don’t ask.”","“I have to ask. It’s a moral obligation.”","“It had a family, Theo. It had *reasons*.”","Theo laughs with his head back, sunglasses sliding down his nose, then stops and just looks at him. “Costigan,” he says, “I think we’re going to be very happy together.” It sounds like a line. Jack waits for the turn, the topper, and it doesn’t come, and he’s surprised to find it isn’t a joke."],"goto":"s04"}]},"s04":{"slug":"SATURDAY · 12:40 PM · DELGADO HALL, LOADING ZONE","body":["By twelve-forty the fog has burned off as if it had never been, and the sky over the Lagoon is a blue so clean it looks fake — a blue for a postcard of somewhere nobody actually lives. The Silverado idles in the loading zone with the driver’s door open. Frank has the road atlas spread on the hood, a Rand McNally held together with packing tape, the Ohio page worn soft as an old dollar, and he’s walking Jack through the route home, which is the route here, backward.","“Forty the whole way to Oklahoma City. Four days, if I don’t dawdle.” He folds the atlas along creases older than Jack. “I’m staying with a guy in Flagstaff.”","Jack is fairly sure there’s no guy in Flagstaff. He’s seen the pillow and the afghan. He knows his father will sleep in this cab at rest stops from here to Ohio with his boots on and the doors locked, to save the motel money, and will tell Maria on the phone that the guy in Flagstaff says hello. Jack doesn’t say anything. Some men don’t have much left that they can still be given.","“Okay.” Frank has a list. He’s been working on it since Missouri. He delivers it with his eyes on the truck. “Call your mother. Call your nonna — she’s got the phone by the bed now, she’ll pick up, God help you. Go to Mass. Don’t let the Californians make you soft.” He leaves a little room before the last one, the way you’d leave room at a table. “Write your brother. He reads ’em twice.”","Then he leans into the cab and unclips the St. Christopher from the visor. It has been there since before Jack was born; the enamel is worn clean off the saint’s face, and the child on his shoulder is just a bump. Frank puts it in Jack’s palm and closes Jack’s fingers over it with his own. Then he looks at it there, and opens Jack’s hand again, and takes it back.","“Never mind,” he says, and clips it back on the visor. “I need him more than you.”","That’s what finally does it. There’s nothing left on the list. They are standing in a loading zone in California, two Costigan men with the engine running, and they are going to have to do something with their bodies."],"choices":[{"text":"Hug him. Say it. “I love you, Dad.”","tag":"Sincerity","cue":"Frank will remember that.","key":"You told your father you loved him in a parking lot in California.","set":{"trait.sincerity":"+1","soul.honesty":"+1","e1_hugged_dad":true},"response":["Jack just steps in and does it — the windbreaker crackling, the smell of Folgers and diesel and the Lava soap his father has scrubbed with every day of Jack’s life. “I love you, Dad.”","Frank goes still. Then his arms come up, and he holds on a second longer than a Costigan should, one hand flat between Jack’s shoulder blades, and says into Jack’s hair, “Yeah. Okay. Yeah.” He gets in the truck fast.","The Silverado pulls out onto Lagoon Road with the bad muffler announcing it to every egret on the water, Frank’s arm out the window where the left blinker ought to be. Jack stands in the loading zone with $340 in his pocket until a minivan leans on its horn."],"goto":"s05"},{"text":"Handshake. Steady. Man to man.","tag":"Control","key":"You shook your father’s hand goodbye.","set":{"trait.control":"+1"},"response":["Jack puts out his hand and Frank takes it. The calluses. The old ridge of scar across the knuckles from the line accident in ’91, the one Jack used to trace with a fingertip during long homilies. “Good,” Frank says. “Good grip.”","At the last second he pulls Jack in by the hand and claps him once on the back, hard enough to hurt, hard enough that Jack will feel it under his shirt the rest of the afternoon.","Then the Silverado pulls out onto Lagoon Road, bad muffler and all, Frank’s arm out the window because the left blinker doesn’t work. Jack stands in the loading zone with $340 in his pocket until a minivan honks at him, twice, the second time with feeling."],"goto":"s05"},{"text":"“Dad — about Danny — ”","tag":"Candor","key":"You tried to talk to your father about Danny.","set":{"trait.candor":"+1","soul.honesty":"+1","e1_asked_about_danny":true},"response":["Frank’s face shuts. Not slowly — all at once, like a breaker tripping. “We don’t,” he says. “Not here. That’s done.”","The minivans go by. Frank looks off at the Lagoon until he’s ready, and when he speaks again it’s softer. “Write him. That’s what you do. You write him.” He hugs Jack then, quick and rough, a hand on the back of his neck, and lets go before either of them can make anything of it.","The Silverado pulls out onto Lagoon Road, the muffler going, Frank’s arm out the window in place of the left blinker. Jack stands in the loading zone with $340 in his pocket and the word *done* in his ears until a minivan honks at him."],"goto":"s05"}]},"s05":{"slug":"SATURDAY · 4:00 PM · DELGADO HALL, 4TH FLOOR LOUNGE","body":["Jack’s phone buzzes as he sits down. He has to tilt the RAZR to the light to read it; the screen only works at an angle, like a person.",{"type":"sms","from":"Gina","text":"dad called from a gas station he says ur roommate is a movie star?? nonna wants 2 know r there any catholics there i said just u","time":"3:58 PM"},"The fourth-floor lounge has a whiteboard, a carpet the color of a bruise, and windows onto the Grove that don’t open. Thirty-odd freshmen sit in a horseshoe of orange plastic chairs wearing color-coded name tags. Jack’s says JOHN C. · 412 in bubble letters; he has crossed out JOHN and written JACK, and the RA watched him do it, and he’s fairly sure it’s going in a file.","The RA’s own tag says PRIYA (RA) · 401 and, smaller, ASK ME ANYTHING (WITHIN REASON). She is small and fast, with a binder on her hip, a laminated agenda in her hand, and an air horn on a lanyard around her neck. “The air horn,” she says, before anyone can ask, “is for emergencies only. Emergencies include fire, flood, and microwaving fish.”",{"type":"doc","title":"DELGADO 4 · FLOOR MEETING #1 (laminated)","text":"1. Welcome!!\n2. Community Standards (per the Residential Life Handbook)\n3. Quiet Hours: Sun–Thu 10 PM / Fri–Sat 1 AM\n4. Fire Safety & YOU\n5. Icebreaker: Two Truths and a Lie!\n6. Questions (within reason)"},"Jack takes inventory. Across the horseshoe, a big soft kid in a World of Warcraft T-shirt — DOUG P. · 420 — with a laugh like a leaf blower, who says *duuude* about everything, including the agenda. Beside him, same room: KEVIN T. Compact, gym-built, crew cut, a navy quarter-zip zipped exactly to the sternum, sitting like a team captain at a booster dinner. He has a big easy smile that never quite reaches his eyes. He is the only person in the room who has brought a pen.","Theo arrives late with a fresh iced coffee and no name tag, says, “Don’t stop on my account,” and lies down flat on the carpet in the middle of the horseshoe with his sunglasses on, like a chalk outline that brought a drink. Priya drops a name tag on his chest without breaking her sentence. It says THEODORE V. He sighs like a man receiving a diagnosis.","The rules come at speed. No candles — Jack thinks of the St. Anthony candle in its sock and arranges his face into something Presbyterian. No hot plates, no pets, “and a fish is a pet, I don’t care what your mom said.” Quiet hours. The roof: “The door on five says ALARM WILL SOUND. It is alarmed.” A pause. “I know it isn’t alarmed. Pretend.”","Then she sets the agenda face down and doesn’t look at it again, and the laminate has gone out of her voice. “Last thing. Nobody goes to the Point after dark.” She goes around the horseshoe meeting everybody’s eyes, one at a time, Jack’s included, Theo’s sunglasses included. “That’s not a Res Life rule. That’s mine. I will know.”","Doug puts his hand up. “What’s the Point?”","“It’s a cliff,” Priya says. “Next.”","Next is Two Truths and a Lie. Priya models it — “I’m a biochem major, I have three jobs, I love my job” — and nobody can tell which is the lie, possibly including Priya. Kevin stands up for his, which nobody else has done. “Kevin Tran. San Jose. Okay.” He claps once, like a huddle breaking. “I’m pre-med. I’m an only child. I’ve never been to a party.”","The room guesses the party, loudly; nobody built like that has never been to a party. Kevin grins and shakes his head. “I’ve got a sister. She’d kill me for that.” He steers the laughter like a man who knows exactly where the brakes are.","When it comes around to the carpet, Theo doesn’t sit up. “Theo. Los Angeles. My condolences.” He addresses the ceiling tiles. “My father has an Oscar. I’ve been to rehab. I’ve never been in love.”","A silence; then somebody laughs; then the whole room is laughing, because he said it like a weather report. Priya waits it out. “So which one’s the lie?”","“I’m not telling.”","“That’s not how the game works.”","Theo lifts the iced coffee an inch off his chest, a toast to the acoustic tile. “It’s how *my* game works.”","The room loves it. Doug is going like a leaf blower; even Priya is laughing, with her mouth shut. Jack laughs too. Across the horseshoe, Kevin Tran is the one person not laughing. He’s looking at his pen.","“Blue tag,” Priya says, pointing at Jack without consulting anything. “Jack-not-John. Go.”"],"journal":[{"kind":"person","id":"kevin","title":"Kevin Tran","text":"420, down the hall. Pre-med from San Jose. Smiles like a team captain. Claims he’s never been to a party. Has a sister who’d kill him over the party thing."},{"kind":"person","id":"priya","title":"Priya (RA)","text":"Laminates things. Owns an air horn. Has one rule she doesn’t laminate."},{"kind":"note","id":"the_point","title":"The Point","text":"A cliff, according to Priya. “Next.” Nobody goes there after dark. Her rule, not the school’s."}],"choices":[{"text":"“I’ve never seen the ocean before today. I can recite the Baltimore Catechism. I’ve been in a bar fight in Erie, Pennsylvania.”","tag":"Wit","set":{"trait.wit":"+1","rel.kevin.warmth":"+1","e1_catechism_kevin":true},"response":["The floor votes catechism, overwhelmingly; a girl in a Tegan and Sara shirt says that isn’t a thing a person can physically do. So Jack does it. “Who made you? God made me. Why did God make you?” — and from across the horseshoe, before he can get there, Kevin Tran says it with him, in the sing-song of a kid who had it drilled into him early by somebody who meant it: *God made me to know Him, to love Him, and to serve Him in this world, and to be happy with Him forever in the next.*","They stop at the same time. They look at each other across a horseshoe of strangers and one guy lying on the carpet, and Jack watches it land on Kevin’s face in the same instant it lands on his own: *oh. You too.*","“So which one’s the lie?” Priya says.","“The bar fight,” Jack says. It’s the one he’d rather not have said. Doug looks genuinely let down."],"goto":"s06"},{"text":"Dad’s truck. The ocean. And where Danny is.","tag":"Candor","cue":"Theo noticed.","key":"You told the floor your brother is in prison.","set":{"trait.candor":"+1","soul.honesty":"+1","rel.theo.trust":"+1","e1_twotruths_danny":true},"response":["“My dad drove me 2,400 miles in a truck,” Jack says. “I’d never seen the ocean before today. My brother’s in prison.”","It comes out easier than he meant it to, and the room has no idea what to do with it. A weird little silence, the kind with a hum in it. Then Doug laughs — a big honest bark of relief, because obviously, *duuude*, that’s the lie — and a couple of people laugh with him, not sure why.","“Which one’s the lie?” Priya asks.","“The truck,” Jack says. “I flew.”","Priya writes something on her clipboard. Then she looks at what she wrote, and crosses it out.","Later, walking back down the hall, Theo falls into step beside him with THEODORE V. still stuck to his shirt. He doesn’t say anything until they’re at the door of 412. “The truck was true, wasn’t it.” Jack gets his key out. “All of it was.” Theo nods, and doesn’t make a joke. It’s the first time since ten-forty this morning."],"goto":"s06"},{"text":"“I’m going to be a priest. I’m going to be a philosopher. I’m going to be extremely good at beer pong.”","tag":"Charm","set":{"trait.charm":"+1","rel.theo.warmth":"+1"},"response":["The floor votes *priest* as the lie, by acclamation, a girl in the back calling out, “*Look* at him,” which Jack decides to take as a compliment. Priya opens her mouth to rule.","From the carpet, Theo raises one finger without sitting up. “He’s going to be all three,” he says. “In that order.” He considers the ceiling. “Reversed.”","And across the horseshoe Kevin Tran laughs — a real one, surprised out of him, a short helpless snort he catches with the back of his hand and can’t quite put away. It isn’t the laugh he gave the room before. Jack hears the difference, doesn’t know yet what to make of it, and decides to like him anyway."],"goto":"s06"}]},"s06":{"slug":"SATURDAY · 9:48 PM · SEACLIFF ROAD, LAS OLAS","body":["Jack had a plan: Percy until his eyes gave out, eight hours on a mattress that crackles like a bag of chips, the 11:30 at St. Brendan’s in the navy blazer. Theo had a counterplan, delivered from the doorway of 412 in a shirt that cost more than the mattress. “Pray for me tonight. Preemptively. Like a flu shot.”","The moon is up, fat and lopsided, a few days short of full, and the Grove is all creak and menthol, eucalyptus bark hanging off the trunks like shed skin. Then the trees stop and Las Olas starts, like walking out of a church into a carnival: couches on roofs, bikes heaped against fences, jasmine so thick on the chain-link it’s practically a sound. Fog comes in at ankle height, as if the ocean sent it ahead to take names.","Theo narrates like a tour guide in hell. “On your left, Pi Lambda Chi, best porch on the Central Coast. On your right, Sigma Rho. Lacrosse. Don’t make eye contact. They can smell Ohio.” Jack keeps meaning to like him less and failing, like a diet.",{"type":"sms","from":"Gina","text":"dad called again from arizona. he says ur roommate has a coffee machine ur not allowed to touch. is that a metaphor","time":"8:41 PM"},"He finds it an hour late, and doesn’t answer, because his father is somewhere in Arizona in the dark with a pillow behind the seat.","Seacliff Road runs west along the bluff until it quits, and the last house before the dark is a shingled two-story gone silver with salt, every window lit, bass coming through the walls like a heartbeat. Beyond it, to the north, the black hump of the Point, and on top of that a squat white lighthouse with no light in it. “The Lighthouse,” Theo says. “Californians are a literal people.”","At the end of the driveway a man stands by the fence, not going in. Older than everybody by a decade: wire glasses, gray at the temples, a Carhartt like Jack’s but worse, a bike leaning on the chain-link. He’s smoking an American Spirit and looking at the house like a math problem he’s been stuck on for months. Jack notices him because he’s the only thing on Seacliff Road not moving. Theo walks a little faster going past. Eager for the party, Jack figures. “Keep up, Costigan. They’ll drink it all.”","On the front steps Theo produces a silver flask engraved *R.V.* “My father’s. He hasn’t noticed it’s gone.” He unscrews the cap and holds it out with a little bow."],"journal":[{"kind":"note","id":"driveway","title":"The guy at the end of the driveway","text":"Older than everybody. Smoking, watching the house, not going in. A bike against the fence."}],"choices":[{"text":"Take a pull.","tag":"Reckless","set":{"trait.reckless":"+1","rel.theo.warmth":"+1","e1_flask":true},"response":["It goes down like a warm hand on the back of his neck. “That’s Macallan,” Jack says, when he can. “That’s the eighteen. That’s a car payment.” Theo takes it back, delighted with him. “That’s a *Tuesday*.”"],"goto":"s06f"},{"text":"“I’m good. Somebody has to remember this.”","tag":"Control","set":{"trait.control":"+1","resolve.jack":"+1","rel.theo.trust":"+1"},"response":["Theo isn’t offended. If anything he looks moved. “A designated rememberer. I love it. You’ll be my alibi.” He drinks for both of them and doesn’t ask again, which Jack likes him for."],"goto":"s06f"},{"text":"Light a Marlboro Red instead.","set":{"jack_cigs":"+1"},"response":["Theo watches him cup the flame against the wind off the water. “Oh, you’re *that* kind of Catholic.” “I’m quitting.” “Since when?” Jack blows smoke toward the Point. “Since I started.”"],"goto":"s06f"}]},"s06f":{"slug":"SATURDAY · 10:02 PM · THE LIGHTHOUSE, FRONT HALL","body":[{"type":"doc","title":"Taped to the front door","text":"THE LIGHTHOUSE · EST. WHENEVER. NO GLASS ON THE DECK. NO PUKING IN THE HYDRANGEAS (THEY HAVE BEEN THROUGH ENOUGH). THE HOT TUB IS DEAD. STOP ASKING. — THE MANAGEMENT"},"Inside, the heat hits like a dryer door. Michael Jackson is coming off a laptop balanced on the coat rack, “Rock with You” on a tribute playlist that sounds like it’s been running since June, and under him the real bass thuds up from deeper in the house, knocking the surf photos crooked. A kid is asleep standing up against the coats, upright as a horse. A girl is crying, happily, into a lime Jell-O mold she holds like a baby. Theo is already gone, a blond head moving toward the kitchen and the hollow pock of a ball hitting a cup.","Jack stands at the foot of the stairs with the fog still beaded on his jacket. Three ways to go."],"choices":[{"text":"The kitchen, where Theo went (and the beer pong).","tag":"Go","set":{"e1_route":"kitchen"},"goto":"s07a"},{"text":"The living room, where a redhead is dancing on a coffee table.","tag":"Go","set":{"e1_route":"living"},"goto":"s07b"},{"text":"Back outside to the front yard, where it’s quieter.","tag":"Go","set":{"e1_route":"front"},"goto":"s07c"}]},"s07a":{"slug":"SATURDAY · 10:06 PM · THE LIGHTHOUSE, KITCHEN","body":["The linoleum holds on to his shoes. A keg sweats in a trash can full of ice. At the tap two guys are having the conversation the whole country is having: “Coroner called it a homicide yesterday, man.” “Propofol.” “*Propofol*, man.” Theo has already taken over the beer pong like a man who just bought the casino.","Cross-legged on the counter by the toaster sits the kid with the surfboard who carried the mini-fridge up this morning, a fishing-tackle box open on his knees. “Fridge guy. Vitamins? Anything to take the edge off, boss. I’m 204. Weed. Addy for midterms. Not Xanax, though.” He closes one tray gently, as if something’s asleep in it. “I don’t do Xanax anymore.” “Anymore?” “Long story, boss. My abuela says the devil’s patient, so be faster.” He holds out a hand. “Rafi.”","Kevin Tran comes in the back door in his navy quarter-zip, towing a kid in a Yankees cap. “Jack! Joey, this is Jack, he’s on my floor.” Joey shakes his hand like he’s starting a lawnmower. “Joey Abruzzo. Staten Island. Jack what?” “Costigan.” “Costigan. Irish. Anything else in there?” “My mother’s a Rinaldi.” “RINALDI. Half counts! That’s the good half.”","Then Theo is there, ping-pong ball in hand. He and Kevin were both at the floor meeting this afternoon, at opposite ends of the room. “Theo.” “Kevin.” The handshake goes a second long. Theo, of all people, just says, “Hey.” Then he’s himself again: “Kevin’s my partner. Kevin’s a doctor.” “Pre-med.” “Pre-*fun*.” Jack says, “I thought you’d never been to a party.” Kevin’s smile doesn’t move. “I’m not at one. I’m chaperoning Joey. Designated adult. It’s like designated driver, but for his soul.”"],"journal":[{"kind":"person","id":"rafi","title":"Rafi (204)","text":"Second floor. Surfer. Sells ‘vitamins’ out of a tackle box. Calls everybody boss. Doesn’t do Xanax anymore. ‘Anymore.’"}],"choices":[{"text":"Play beer pong with Theo.","tag":"Reckless","set":{"trait.reckless":"+1","resolve.jack":"-1","rel.theo.warmth":"+1","e1_beerpong":true},"response":["Point-guard hands turn out to be good for exactly one thing at a party. Theo is a joyful, shameless cheat; he mentions his mother’s backyard is on fire at the precise moment the other team shoots. They win three games running. Jack is two beers in and feels great, and then notices that he feels great, which is the Costigan in him, checking the locks.","Theo, lining up a shot without looking at him: “There’s a back porch. Go be tragic. I’ll find you.” The kitchen is a laundromat now, all heat and elbows. Jack follows the cold coming in under the back door."],"goto":"s08"},{"text":"Ask Kevin if he’s going to Mass tomorrow.","tag":"Sincerity","set":{"trait.sincerity":"+1","rel.kevin.warmth":"+1","rel.kevin.trust":"+1"},"response":["Kevin’s eyes go to Theo and away, quick as a blink. Quietly: “11:30. St. Brendan’s. I signed up to lector next week. Pray for the congregation.” “I’m going to ALL of them,” Joey says. “He’s going to be a priest,” Kevin says. “I’m going to be a priest! Also, is that girl looking at me?” She is not.","Theo, lining up a shot without looking at him: “There’s a back porch. Go be tragic. I’ll find you.” The kitchen is a laundromat now, all heat and elbows. Jack follows the cold coming in under the back door."],"goto":"s08"},{"text":"Ask Rafi what’s in the tackle box for a man who’s quitting smoking.","tag":"Wit","set":{"trait.wit":"+1"},"response":["Rafi considers it with a pharmacist’s gravity. “Gum, boss. Nicorette. I’m a full-service pharmacy.” He actually hands Jack a piece and won’t take a dollar for it. “Courtesy, boss. Quitting’s hard. I’ve watched people try.”","Theo, lining up a shot without looking at him: “There’s a back porch. Go be tragic. I’ll find you.” The kitchen is a laundromat now, all heat and elbows. Jack follows the cold coming in under the back door."],"goto":"s08"}]},"s07b":{"slug":"SATURDAY · 10:06 PM · THE LIGHTHOUSE, LIVING ROOM","music":"The Black Eyed Peas — “I Gotta Feeling”","body":["The Black Eyed Peas are promising everybody a good night at a volume that makes it a threat, and the room believes them. On the coffee table, in a white sundress and pearls, a redhead is dancing like it’s the last night before they close the bars forever: copper hair, porcelain skin, a laugh that goes through the speakers and out the other side.","She spots him in the doorway, hops down, gets him by the medal chain, which nobody has ever done, and reels him in. “St. Michael? Black hair, blue eyes, look at you. Sugar, you look like a sad Irish poem. Dance with me or I’m calling your mother.” “You don’t have my mother’s number.” “I will by Tuesday. Delaney Price. Highland Park, Texas. Future Pi Lam, current disaster.”","She chases a small white pill with a Jell-O shot. “Doctor’s orders,” she says, catching him looking. “Literally. I have a note. It’s notarized.” Then, over the bass: “My roommate’s out back. Judging everyone. She’s Catholic.” A look at his medal; a wicked smile. “Y’all would *hate* each other.”","On the stairs a guy with a guitar is playing “Skinny Love” for three girls on the steps below him, the Bon Iver song Gina played until the CD skipped. Warm brown skin, short dark hair, a gray cardigan; a calm face, his own key, six feet above the party. Then the bass rolls over him."],"journal":[{"kind":"person","id":"laney","title":"Laney Price","text":"Highland Park, Texas. Future Pi Lam, current disaster (her words). Has a note for her pills. Danced on a coffee table to the Black Eyed Peas like it was a sacrament. Her roommate is out back, judging everyone."}],"choices":[{"text":"Dance with her. Badly. Commit.","tag":"Charm","set":{"trait.charm":"+1","rel.laney.warmth":"+1","e1_met_laney_early":true},"response":["He dances like a CYO point guard at a cousin’s wedding: all footwork and elbows, nothing a nun couldn’t watch. Laney screams with joy. For two minutes he forgets to be anybody in particular. When the song breaks she takes his face in both hands and kisses his cheek, hard, and leaves a print. “You’re going to be my favorite. Don’t tell anybody, it’ll go to your head.”","“Go find my roommate,” Laney says, already turning back to her table. “Back porch. Tell her I love her and she’s a coward.”"],"goto":"s08"},{"text":"“What was that you just took?”","tag":"Candor","set":{"trait.candor":"+1","rel.laney.trust":"+1","rel.laney.friction":"+1","e1_met_laney_early":true},"response":["Her smile doesn’t move, which is its own answer. “Sugar, I like you, so I’m going to pretend you didn’t ask me that like my mother.” Then, pageant-bright: “It’s for flying. I’m flying.” She dances off, but she looks back at him once over a stranger’s shoulder, like a pageant judge revising a score.","A song later she’s at his elbow. She stamps a kiss on his cheek, hard, no explanation, and turns him by the shoulders toward the back of the house. “Go find my roommate,” Laney says, already turning back to her table. “Back porch. Tell her I love her and she’s a coward.”"],"goto":"s08"},{"text":"“I’m not sad. I’m Irish. It’s a different thing.”","tag":"Wit","set":{"trait.wit":"+1","rel.laney.warmth":"+1","e1_met_laney_early":true},"response":["“Oh, *you’re* trouble.” She hands him a Jell-O shot like a prize. He doesn’t drink it; he tucks it into his shirt pocket “for later,” and she laughs so hard she has to hold on to the bookcase. Then she stamps a kiss on his cheek, hard, and spins him toward the back of the house.","“Go find my roommate,” Laney says, already turning back to her table. “Back porch. Tell her I love her and she’s a coward.”"],"goto":"s08"}]},"s07c":{"slug":"SATURDAY · 10:06 PM · THE LIGHTHOUSE, FRONT YARD","body":["Out front the fog is up to his knees. Cross-legged on the hood of an old Volvo wagon sits a girl in black from collar to boots: white-blonde hair cut blunt at the jaw, glasses thick enough to stop a bullet, a clove cigarette in one hand and a Moleskine in the other.","She doesn’t look up. “Don’t come any closer. I’m doing an ethnography of the mating rituals of the American undergraduate. You’re a data point. Hold still.” He comes closer anyway. He can read the page upside down.",{"type":"doc","title":"Moleskine, open on the hood","text":"FIELD NOTES — 8/29/09 — “THE LIGHTHOUSE,” LAS OLAS. 22:01 Male in pastel polo performs keg stand. Applause sparse but sincere. 22:06 Male, approx. 18. Black hair, overdue for a cut. St. Michael medal. Paperback in back pocket (prop?). Approaching."},"Her eyes go to the medal. “St. Michael. Patron saint of what, bouncers?” “Paratroopers. Police. Grocers.” “*Grocers.*” “It’s a big job.” Now she looks at him, top to bottom, and writes something down. “You’re a Catholic at a kegger. Which one of us is the anthropologist?”","He asks for a clove. She looks at him like he’s asked for a kidney. “They’re an endangered species. The FDA kills them on September twenty-second. I’m rationing.” She exhales a smell like Christmas on fire. “Margot. Portland. Third floor of Delgado. You’re fourth; you got in the elevator this morning with a crucifix sticking out of a milk crate. Don’t tell me your name. I’ll learn it if you become relevant.”","Down at the end of the driveway, the man by the fence is gone, and so is the bike."],"journal":[{"kind":"person","id":"margot","title":"Margot","text":"Portland. Third floor, Delgado. All black, Doc Martens, cloves. Doing an ‘ethnography’ of the party. Called me a data point. Says the dangerous Catholics are the fun ones."}],"choices":[{"text":"“You’re doing an ethnography in Doc Martens. I think you’re the one in costume.”","tag":"Wit","set":{"trait.wit":"+1","rel.margot.warmth":"+1","rel.margot.friction":"+1","e1_met_margot_early":true},"response":["Without looking up she writes something down. “Noted.” He reads it upside down: *funny; dangerous.* She underlines *dangerous*.","“You’re going to be one of those Catholics who’s fun,” Margot says. “Those are the dangerous ones.” She tips her head at the side of the house. “Go around back. I did the porch at nine-thirty. There’s a girl out there who’s as unimpressed as you are. You’ll either kill each other or I’ll get a chapter out of it.”"],"goto":"s08"},{"text":"“The Church invented the university. You’re welcome.”","tag":"Candor","set":{"trait.candor":"+1","rel.margot.friction":"+1","rel.margot.trust":"+1","e1_met_margot_early":true},"response":["“And then burned the people who did science in it.” “Bruno was burned for theology, not astronomy.” “Oh, good. Say that slowly so I can quote you.” “Nobody burned Galileo.” “No. They made an old man kneel and swear the Earth doesn’t move, then kept him under house arrest until he died. Your institution made a genius lie on his knees. I’d call that worse.” Jack opens his mouth and finds nothing in it he’s proud of. She’s enjoying this and hiding it badly.","“You’re going to be one of those Catholics who’s fun,” Margot says. “Those are the dangerous ones.” She tips her head at the side of the house. “Go around back. I did the porch at nine-thirty. There’s a girl out there who’s as unimpressed as you are. You’ll either kill each other or I’ll get a chapter out of it.”"],"goto":"s08"},{"text":"Sit on the bumper and ask what she’s found so far.","tag":"Sincerity","set":{"trait.sincerity":"+1","rel.margot.warmth":"+1","rel.margot.trust":"+1","e1_met_margot_early":true},"response":["She checks the question for traps, then flips back a page and reads in a nature-documentary voice. “Male, nineteen, has said ‘bro’ more often than he has blinked; appears to be in love with the keg. Female, eighteen, has told several men she’s ‘not usually like this.’ All of them believed her.” Jack laughs out loud, the real one, the one that embarrasses him. Margot almost smiles, then puts it away fast, like something she caught herself doing in public.","“You’re going to be one of those Catholics who’s fun,” Margot says. “Those are the dangerous ones.” She tips her head at the side of the house. “Go around back. I did the porch at nine-thirty. There’s a girl out there who’s as unimpressed as you are. You’ll either kill each other or I’ll get a chapter out of it.”"],"goto":"s08"}]},"s08":{"slug":"SATURDAY · 10:31 PM · THE LIGHTHOUSE, BACK PORCH","music":"Grizzly Bear — “Two Weeks”","set":{"resolve.lena":6},"body":["The back deck has survived thirty years of parties and looks it: boards gone soft as driftwood, a hot tub under a blue tarp, chili-pepper lights with half the peppers dead. Past the rail, ice plant runs out to a chain-link fence, and past the fence there is only fog and the ocean working at the foot of the bluff. North, the Point is a black shoulder, the old light on top white and blind. Somebody inside has changed the music. Through the slider it comes thinned and lovely and wrong for a keg party: a piano knocking politely on the same bright chords, falsettos rising over it like birds off a wire.",{"if":"e1_route==\"kitchen\"","text":"He’s holding a Natty Light he doesn’t want, and behind him through the glass Theo’s laugh goes off like a car alarm."},{"if":"e1_beerpong","text":"Two beers sit warm in his chest. He feels terrific, and he’s keeping an eye on that."},{"if":"e1_route==\"living\"","text":"His cheek still stings where Laney stamped it, and he has a message to deliver."},{"if":"e1_route==\"front\"","text":"His jacket smells like cloves, like he’s come from a very strange Christmas."},"He finds the rail. The girl is already on it.","She’s up with her back to a post and her boots crossed at the ankle, brown cowboy boots beat up soft as gloves, and it takes him a second to understand he’s seen those boots before. Blue sundress tonight. An oatmeal cardigan against the fog, worn through at the elbows. Honey-brown hair coming loose in the wet air, streaked lighter by some sun that isn’t this one. Golden skin with a whole summer still on it. A red cup she isn’t drinking so much as supervising. At her throat, a gold medal rubbed almost smooth. The pelican girl.","She doesn’t look at him. “If you’re going to throw up, the hydrangeas have suffered enough.” “I read the sign,” Jack says. “I’m a rule follower.” “You’re at a keg party on a cliff.” “I didn’t say which rules.”",{"if":"e1_route==\"living\"","text":"“Your roommate says she loves you,” he tells her, “and you’re a coward.” She closes her eyes. “Laney found you.” “Laney found me.” “Laney finds everybody. It’s like being found by weather.” Her eyes go to his cheek, stay a second, come away. He can’t tell what she’s decided."},{"if":"e1_route==\"front\"","text":"“Margot sent me.” “I don’t know a Margot.” “All black. Cloves. Ethnography.” “Oh, the *Swede*. She asked me to rate the party on a scale of one to Gomorrah.”"},{"if":"e1_flask","text":"She sniffs once without turning her head. “Single malt. Not yours.” “How do you know?” “Nobody who owns that jacket buys that scotch. It’s too big for you in the shoulders.” Jack doesn’t say anything about the jacket. She lets him not say it."},"Through the slider the party is an aquarium nobody’s cleaning. She nods at it. “Pastel polo. By the fridge.” They’re making it up; that’s the game, and neither of them has to explain it. “Sigma Rho legacy,” Jack says. “Two DUIs. His mother calls him ‘my prince.’” “His *father* calls him ‘the prince,’” she says, “and means it as an insult.” “He’s going to run for Congress.” “In Louisiana he’d win. We’d throw him a parade and indict him after.” “What a jagoff.” She turns her head, finally, and her eyes in the porch light are amber, warm and entirely unimpressed. “A *what*?” “Technical term. Western Pennsylvania and points west.” She tries it in her mouth, “jagoff,” like a sommelier with a wine she can’t place, and keeps it.","After that it goes fast. The Jell-O girl, still crying, now spoon-feeding it to a boy. (“Most romantic thing I’ve seen in California.” “It’s lime. Nobody’s ever loved anybody over lime.”) The philosophy major on the couch explaining Nietzsche to a girl visibly composing a grocery list. (“Eggs,” the girl on the rail murmurs, doing her face. “Paper towels. A new life.” “He’s on eternal recurrence.” “Lord. He’s going to recur all night.”)",{"if":"e1_met_laney_early","text":"Laney on the coffee table, conducting the room with a Jell-O shot. (“Is she always —” “Yes. We’ve been roommates about a day and it’s been a *decade*.”) She says it the way you talk about weather you love.","else":"Jack opens his mouth about the redhead on the coffee table and the girl says, without looking, “Careful. That’s my roommate.” He closes it. She lets him sweat exactly as long as it’s funny."},"Then two kids who clearly met tonight are kissing against the refrigerator with the grim efficiency of people filling out a form, and for once neither of them has a joke ready. “Lord,” she says finally. “They look like they’re doing their taxes.” “Somebody has to file in the morning.” “Nobody files,” she tells her cup. “That’s the point. It just gets lost.” Then her boot is tapping the post again in time to the falsettos. She’s going to dance with her roommate later, she informs him, and he is not invited.","Something buzzes in her cardigan pocket. She takes out a phone, the kind that opens like a book onto a little keyboard, looks at the screen, silences it and sets it face-down on the rail. She doesn’t explain. He doesn’t ask. The ocean fills the space where somebody would.","Then she turns the scalpel on him, slowly, a long look from his shoes up, the way his nonna inspects a chicken at the butcher’s. “Rust Belt. Parish school. Black hair your mother’s been after you to cut since June. Somebody broke that nose for you — a basketball, or a boy bigger than you — no, don’t tell me. Good with your hands, terrible with your feelings. Paperback in your back pocket so people will ask what you’re reading. You’re hoping I’ll ask.” “Are you going to?” “Absolutely not.” “Youngstown,” he says. “Ohio. You were close.” “Youngstown.” She says it back slowly, tasting it, like a dish she isn’t sure she’d order again.","The phone buzzes against the wood. She doesn’t look at it.","He gets one back. “You were arguing with a parking cop this morning. Holding a lamp.” “You were *watching*?” “Everybody was watching. It was shaped like a pelican.” “I won.” “I know. I was there.” Something in her face says she likes having been seen winning, and hates that he was the one who saw.","Her eyes go to his left eyebrow, to the white line through it, and stay there. “And that. What’s the story?”"],"journal":[{"kind":"person","id":"lena","title":"The girl on the porch","text":"Back porch of the Lighthouse. Judges a party like a federal appellate court. Gold medal on a chain. Hasn’t told me her name. (The pelican girl? The pelican girl.)"}],"choices":[{"text":"“Jealous husband. Erie, Pennsylvania.”","tag":"Wit","set":{"trait.wit":"+1","rel.lena.heat":"+1","rel.lena.warmth":"+1","scar_told_lena":"husband"},"response":["“*Erie.*” “You know Erie?” “I know it’s not a place anybody’s husband would be jealous *in*.” She’s laughing, a low helpless sound she tries to push back down into the cup, and she is visibly furious about it."],"goto":"s09"},{"text":"“Knife-juggling at the St. Anthony’s pierogi festival. The Ukrainians did it.”","tag":"Charm","set":{"trait.charm":"+1","rel.lena.warmth":"+1","rel.lena.heat":"+1","scar_told_lena":"pierogi"},"response":["“Pierogi aren’t even Italian.” “That’s what makes it a tragedy.” She looks at him the way a cat looks at a laser pointer, and laughs anyway."],"goto":"s09"},{"text":"“I don’t tell that one on a first date.”","tag":"Candor","cue":"Lena noticed.","set":{"trait.candor":"+1","rel.lena.trust":"+1","rel.lena.heat":"+1","scar_told_lena":"refused"},"response":["“This isn’t a date.” “Then I definitely don’t tell it.” She studies him, and for a second she isn’t performing anything either: the appellate judge goes away and there’s just a girl on a railing in a cardigan with holes in the elbows, looking at somebody with a thing he doesn’t say. “Okay,” she says. “Keep it.”"],"goto":"s09"},{"text":"“Honestly? It’s not a good story. Ask me something else.”","tag":"Sincerity","set":{"trait.sincerity":"+1","rel.lena.trust":"+1","rel.lena.warmth":"+1","scar_told_lena":"honest_no"},"response":["She looks at him properly for the first time. Surprise, and then she lets it go, politely, the way you step around somebody praying. “Okay. What are you reading?” “You said you weren’t going to ask.” “I lied. Hand it over.”"],"goto":"s09","cue":"Lena noticed."}]},"s09":{"slug":"SATURDAY · 10:49 PM · THE LIGHTHOUSE, BACK PORCH","set":{"e1_postcard_seen":true},"body":["The Percy ends up in her hands, and later Jack won’t be able to say whether he gave it to her or she took it. He’s on the rail beside her now, a foot of wet wood between them. She turns the book over in the porch light: Walker Percy, *The Moviegoer*, Vintage, the spine cracked white so many times it’s mostly crack, a three-dollar library-sale sticker on the back, every margin crowded with his handwriting.","“Oh, no,” she says. “Oh, no, no. You brought a New Orleans novel to California. That’s either a pickup line or a cry for help, and I need to know which before I decide how to be disappointed.” “It’s a good book.” “I know it’s a good book. I’m *from* New Orleans. I grew up with boys who think they’re in it.” She’s already flipping. “Binx. The search. Everydayness.” She says *everydayness* the way only somebody from Louisiana could, like the word has a screened porch on the back.","She stops on a page and reads his margin aloud in a flat, nasal voice that is apparently supposed to be his: “‘NO. Coward.’” She looks up. “You’re yelling at Binx.” “Binx deserves it.” “Binx sells stocks in *Gentilly*. He has enough problems.” But she’s laughing, and she keeps reading, and Jack has the strange experience of hearing the inside of his own head in somebody else’s accent.","Something slips from between the pages and she traps it against her knee before it can go over the rail. A postcard: a domed building the color of old bread, sun on stone, the Radcliffe Camera, Oxford. She turns it over.","She reads the back. Then she reads it again. Jack doesn’t need to look; he knows the one line on it by heart, and the initials under it. So he watches her face, and something in it goes still. Not blank. Still, the way water goes still before you can see what’s under it. The bass thumps through the wall. She hands the card back between two fingers, lightly, as if it’s nothing she cares about.","“Who’s A.H.?” Her hand goes up to the medal at her throat and closes around it."],"journal":[{"kind":"clue","id":"postcard","title":"The postcard","text":"She read the back of my postcard twice. Asked who A.H. was like she didn’t care. She cared."}],"choices":[{"text":"“My uncle. Andrew Hennessey. He sends postcards from everywhere.”","tag":"Lie","set":{"soul.honesty":"-1","rel.lena.heat":"+1","e1_postcard_lie":true},"response":["“Your uncle,” she says, “has very confident handwriting.” “He was a Jesuit for a while. It never wore off.” “Mm.” He doesn’t believe a word she’s said since he walked out here, and he’d bet she’s returning the favor, and it’s the most fun he’s had in months.",{"if":"e1_met_laney_early","text":"He tucks the card away. Her eyes drop to the St. Michael swinging loose from his shirt. “Nice medal.” “My nonna makes me wear it.” She tips her chin at her own. “My grandmother’s dead and she still makes me wear it.” It takes him half a second to laugh, and her half a second to let him. He has her figured now: a Christmas-and-Easter girl with a grandmother’s necklace. Laney said *Catholic*, but Laney, he suspects, would call anybody with a medal Catholic. From the way she’s eyeing his, he’d bet she’s figured him the same. Neither of them says the word *Mass*.","else":"He tucks the card away. Her eyes drop to the St. Michael swinging loose from his shirt. “Nice medal.” “My nonna makes me wear it.” She tips her chin at her own. “My grandmother’s dead and she still makes me wear it.” It takes him half a second to laugh, and her half a second to let him. He has her figured now: a Christmas-and-Easter girl with a grandmother’s necklace. From the way she’s eyeing his, he’d bet she’s figured him the same. Neither of them says the word *Mass*."}],"goto":"s10"},{"text":"“A man I came here to argue with.”","tag":"Candor","set":{"trait.candor":"+1","soul.honesty":"+1","rel.lena.trust":"+1"},"key":"You told the girl on the porch you came to Marisol to argue with someone.","response":["She looks at him, at him and not the card, with an expression he can’t get to the bottom of. “Huh,” she says. She takes a sip of the beer, finally, and looks out at the fog like it owes her money.",{"if":"e1_met_laney_early","text":"He tucks the card away. Her eyes drop to the St. Michael swinging loose from his shirt. “Nice medal.” “My nonna makes me wear it.” She tips her chin at her own. “My grandmother’s dead and she still makes me wear it.” It takes him half a second to laugh, and her half a second to let him. He has her figured now: a Christmas-and-Easter girl with a grandmother’s necklace. Laney said *Catholic*, but Laney, he suspects, would call anybody with a medal Catholic. From the way she’s eyeing his, he’d bet she’s figured him the same. Neither of them says the word *Mass*.","else":"He tucks the card away. Her eyes drop to the St. Michael swinging loose from his shirt. “Nice medal.” “My nonna makes me wear it.” She tips her chin at her own. “My grandmother’s dead and she still makes me wear it.” It takes him half a second to laugh, and her half a second to let him. He has her figured now: a Christmas-and-Easter girl with a grandmother’s necklace. From the way she’s eyeing his, he’d bet she’s figured him the same. Neither of them says the word *Mass*."}],"goto":"s10"},{"text":"“That’s classified.”","tag":"Wit","set":{"trait.wit":"+1","rel.lena.friction":"+1"},"response":["“Everything about you is classified.” “Not everything. The scar’s public record. It’s just that the record keeps changing.” “That’s called lying, Youngstown.” “In Ohio we call it oral tradition.”",{"if":"e1_met_laney_early","text":"He tucks the card away. Her eyes drop to the St. Michael swinging loose from his shirt. “Nice medal.” “My nonna makes me wear it.” She tips her chin at her own. “My grandmother’s dead and she still makes me wear it.” It takes him half a second to laugh, and her half a second to let him. He has her figured now: a Christmas-and-Easter girl with a grandmother’s necklace. Laney said *Catholic*, but Laney, he suspects, would call anybody with a medal Catholic. From the way she’s eyeing his, he’d bet she’s figured him the same. Neither of them says the word *Mass*.","else":"He tucks the card away. Her eyes drop to the St. Michael swinging loose from his shirt. “Nice medal.” “My nonna makes me wear it.” She tips her chin at her own. “My grandmother’s dead and she still makes me wear it.” It takes him half a second to laugh, and her half a second to let him. He has her figured now: a Christmas-and-Easter girl with a grandmother’s necklace. From the way she’s eyeing his, he’d bet she’s figured him the same. Neither of them says the word *Mass*."}],"goto":"s10"}]},"s10":{"slug":"SATURDAY · 11:14 PM · THE LIGHTHOUSE, BACK PORCH","set":{"e1_knows_lena_name":true,"resolve.jack":"-1","soul.restraint":"+1"},"body":["Around eleven the party gets louder and worse inside and quieter out here, the way it does at the edges of things. Jack’s hand goes into his jacket and finds the Marlboros the way it does when he’s nervous and pretending not to be, and stays there, turning the pack over with his thumb.","At the back of the lot, where one fence post has rotted at the base, there’s a gap in the chain-link you could walk through without turning sideways. Beyond it a dirt path runs pale along the lip of the bluff toward the Point and the dead white light. “Bet you can see the whole coast from out there,” he says. “We should —”","“There’s a path behind the fence.” It comes out too fast, before he’s finished. “Don’t take it at night.” He looks at her. “You moved in this morning. I watched you do it. With a pelican.” “Laney’s sorority friend told me.” Her fingers have found the medal again; she holds it while she says it, then lets it go.",{"if":"e1_met_laney_early","text":"“Laney has a sorority friend already?” “Laney has a sorority *family* already. She’s been here a day.”","else":"“Who’s Laney?” “My roommate. The coffee table. Everybody meets Laney eventually; it’s like jury duty.”"},"Then the porch light clicks off. It’s on a motion sensor, and they’ve been sitting too still, two people on a rail not touching, and the house has decided nobody’s out here. The dark comes down all at once. The only light left is the blue glow through the slider and, to the north, the old lighthouse giving back the moon like a bad mirror.","In the dark she’s closer than she was. He doesn’t know if she moved or he did, or if it’s only that with the light gone there’s nothing to measure by. The rail is cold and wet under his palms. Her cardigan sleeve is an inch from his wrist; he can feel the inch, the way you feel the heat off a burner you haven’t touched. He can smell her: beer, and the jasmine off the fences that has gotten into everything, and under it the sea, and under that something warmer that is just her skin. He can hear her breathing, and that it isn’t quite even.","He wants to kiss her. There’s no better way to say it; it’s the least complicated thing that has happened to him in California. He wants to put his hand over the inch and close it, to know what her mouth tastes like after she’s been right about everything for most of an hour. He knows exactly where her face is without seeing it. And he doesn’t, and it isn’t fear, or not only. It’s that he doesn’t know her name. It’s a stubborn, unfashionable idea his nonna and the Church and a lot of cold Sunday mornings put into him, and he has never managed to get out: that if this is anything, it’s worth too much to spend in the dark on a stranger’s porch like loose change. So he holds still. It’s the hardest thing he’s done all day, and today he watched his father drive away. His hands ache from the rail.","She doesn’t move either. He hears her breath go in, and hold, and go out, and later, lying awake, he’ll wonder whether she was holding still for the same reason he was, or only waiting to see what he would do.","The slider bangs open. The porch light snaps on like a cop’s flashlight. In the doorway, radiant and wrecked, a Jell-O shot in each hand and her pearls on backward, stands the redhead from the coffee table. “MAGDALENA BROUSSARD,” she announces to the porch, the Point and possibly Hawaii, “the Jell-O shots are sentient and they’re asking for you.”","The girl on the rail closes her eyes. “Magdalena,” Jack says. She opens them. “Lena. Only my mother, the Holy Ghost, and Laney when she wants something call me Magdalena.” “Jack.” He watches her take it, turn it over once, and put it away.",{"if":"e1_met_laney_early","t
