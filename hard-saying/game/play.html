ng round down the hall. Then: “Bring her home for Thanksgiving.”",{"if":"e1_heard_boyfriend","text":"“Ma, she has a — ” He stops. “I just met her.” “Thanksgiving,” his mother says, in the voice that signs the tardy slips at St. Brigid’s, and that’s the end of that.","else":"“Ma. I just met her.” “Thanksgiving,” his mother says, in the voice that signs the tardy slips at St. Brigid’s, and that’s the end of that."},"They hang up a little before half past. Two minutes later the RAZR buzzes in his hand.",{"type":"sms","from":"Gina","text":"nonna says go to confession. i said for what. she said he knows","time":"6:31 PM"}],"goto":"s22"},{"text":"“No girls, Ma. Just philosophy.”","tag":"Control","set":{"trait.control":"+1","soul.honesty":"-1"},"response":["“Mm-hm,” his mother says. Down the hall, perfectly audible, Nonna informs the Blessed Mother: “*Sta mentendo.*” He’s lying.","They hang up a little before half past. Two minutes later the RAZR buzzes in his hand.",{"type":"sms","from":"Gina","text":"nonna says go to confession. i said for what. she said he knows","time":"6:31 PM"}],"goto":"s22"},{"text":"“The girls here are tan, Ma, but they’re all Methodists.”","tag":"Wit","set":{"trait.wit":"+1","resolve.jack":"+1"},"response":["His mother laughs — the real one, the one he doesn’t hear much anymore — and then he hears her cross herself: the small rustle of it, her wedding ring clicking against the receiver.","They hang up a little before half past. Two minutes later the RAZR buzzes in his hand.",{"type":"sms","from":"Gina","text":"nonna says go to confession. i said for what. she said he knows","time":"6:31 PM"}],"goto":"s22"}]},"s22":{"slug":"SUNDAY · 8:04 PM · DELGADO HALL, EAST STAIRWELL","set":{"e1_heard_wes":true,"resolve.jack":"-1"},"body":["Laundry. A blue basket on his hip and, on top of the pile, an index card in his mother’s handwriting, dictated by Nonna: *Whites in HOT. Darks in COLD. MEDALS OFF.* Underlined twice, because Nonna has safety-pinned a saint inside the lining of half of what he owns, and the Holy Family does not tumble dry.","He takes the east stairwell down. It’s concrete painted the green of an old hospital, and it carries sound like a church: every footstep comes back a half-second late, a little holier than you sent it. Fog breathes in through the window on each landing.","Coming down past the third floor, he hears a voice he knows, and stops.","Softer than he’s heard it. Below him, on the landing between three and two, she sits on the top step of the next flight with her knees up and her back to him, phone to her ear, her other arm around her shins. No boots tonight. Bare feet on the cold concrete.","“…I know, baby. I miss you too.” A pause. “No. I didn’t read it. Mama said don’t.” Another. “Wes. *Wes.* I’m fine. Tell me about your day. All of it.” She listens for a long time, and laughs once, low, at something he can’t hear. The stairwell waits with him. “I love you too.”",{"if":"e1_asked_lena_out","text":"He knew. She told him last night outside 217, a fact laid on a table. It just didn’t have a name before, or a voice that could make her laugh like that."},{"if":"e1_heard_boyfriend && !e1_asked_lena_out","text":"He knew. Laney said *taken* on Ocean Road last night, loud enough for most of the Central Coast. It just didn’t have a name before, or a voice that could make her laugh like that."},{"if":"e1_diner==\"followed\"","text":"*I’m fine.* He hears the railing at the wharf in it, and *allergies*, in a different key now."},{"if":"soul.restraint<=0","text":"Part of him would like to stay right here and find out what else she sounds like when she thinks nobody’s listening. He isn’t proud of which part."},"Jack stands above her with a basket of dirty laundry and his nonna’s index card, and doesn’t move, because every way out of this stairwell makes a sound."],"journal":[{"kind":"person","id":"lena","title":"Lena Broussard","text":"New Orleans. Two seventeen. Mass at St. Brendan’s, the mantilla, kneels for Communion; Fr. Osei knew her from April. Has a boyfriend. His name is Wes. She calls him ‘baby’ on the east stairwell at eight. She told him she didn’t read something because her mama said not to."}],"choices":[{"text":"Back up the stairs. Quietly.","tag":"Go","set":{"e1_stairwell":"retreat","soul.restraint":"+1"},"key":"You heard Lena tell someone named Wes she loved him, and you went back upstairs.","response":["He goes up on the outside edges of his sneakers, the way he used to come in after curfew on Glenwood Avenue. Behind him, faint, she’s laughing again.","He’ll do the laundry at one in the morning instead, when the machines in the basement are the only things awake."],"goto":"s23"},{"text":"Keep walking down past her.","tag":"Go","cue":"Lena saw you.","set":{"e1_stairwell":"passed","rel.lena.heat":"+1","rel.lena.friction":"+1"},"key":"You walked past Lena on the stairs while she was on the phone with Wes.","response":["He goes down, and the stairwell gives every step back twice. She looks up as he comes around the landing, the phone at her ear, and their eyes meet, and neither of them looks away.","Into the phone, not taking her eyes off him, her free hand finding the medal at her throat: “No, nobody. Just a guy from my building.”","He keeps walking, past her knees and her bare feet, close enough to smell her shampoo. The basement door sighs shut behind him on its arm."],"goto":"s23"},{"text":"Cough. Let her know you’re there.","tag":"Candor","set":{"e1_stairwell":"coughed","trait.candor":"+1","rel.lena.trust":"+1"},"key":"You let Lena know you were on the stairs.","response":["The cough comes back off the concrete like a gunshot in a cathedral. She turns, the phone against her collarbone. “Hi.” “Sorry. Laundry.”","Her eyes drop to the basket, to the index card on top. “Medals off,” she reads, upside down, from three steps below, and almost smiles. Then, into the phone: “It’s a guy from the fourth floor. He’s doing laundry.” And softer, her hand going up to the medal: “No, baby. Nobody.”","He goes down past her. *Nobody* follows him all the way to the basement, and he can’t tell which way she meant it."],"goto":"s23"}]},"s23":{"slug":"SUNDAY · 11:38 PM · DELGADO HALL, ROOM 412","music":"Bon Iver — “Re: Stacks”","set":{"e1_knows_lena_in_seminar":true},"body":["Room 412 is dark except for Jack’s Dell, a secondhand Inspiron from the Cardinal Mooney tech sale, ninety dollars, with a cardinal sticker on the lid he has never managed to scrape off. Across the room Theo lies on his Frette sheets in the blue light of his iPhone, scrolling a map of the fire. His mother’s neighborhood is a gray grid, and the red line is very close to it.","“She’s at the Peninsula with the dogs,” Theo says to the ceiling, unprompted. “The Hockney’s in the car. Everyone’s fine.” He scrolls. “Two firefighters died up there today.” A door bangs down the hall; someone laughs. “Everyone’s always fine,” Theo says.","Jack has nothing equal to that, so he doesn’t try. On Facebook, Theo’s status from the floor meeting is still at the top of the page:",{"type":"fb","name":"Theo Vance","text":"is rooming with a Catholic. Taking bets on who converts whom.","meta":"Saturday at 4:12pm · 9 people like this"},"Then, bolded in his university inbox:",{"type":"doc","title":"From: Adrian Hale · Subject: PHIL 9H — Monday","text":"Hollis 302, 1:00 p.m. Come prepared to prove you have a soul. I will be prepared to be unconvinced. —A.H."},"Hale has not used BCC. Hale, Jack suspects, considers BCC American. Every address in the seminar is sitting in the To: line, so Jack scrolls: a line of strangers at marisol.edu, kids he’ll be across a table from tomorrow afternoon — and then:","*mbroussard@marisol.edu.*","He looks at it. *Oh, no*, he thinks, and then, with the floor tipping a little: *Of course.*","Theo is hanging upside down off the end of his bed, blond hair brushing the carpet, reading over Jack’s elbow. “Who’s M. Broussard?” Jack closes the laptop halfway. Theo’s eyes go wide in his upside-down face. “Oh my *God*.”",{"if":"e1_stairwell==\"passed\"","text":"Somewhere under the noise Theo is making, Jack hears it again, the way she said it on the stairs with her eyes on his: *Just a guy from my building.*"},{"if":"e1_stairwell==\"coughed\"","text":"Somewhere under the noise Theo is making, Jack hears it again, soft, from three steps down: *Nobody.*"},{"if":"e1_stairwell==\"retreat\"","text":"Somewhere under the noise Theo is making, Jack hears the stairwell again, every word a half-second late: *I love you too.*"},"Out the window the fog has the Grove, the eucalyptus going in and out of it like swimmers. Past them, through one clear tear in the gray, the old lighthouse stands on the Point, white and dark, keeping watch over nothing."],"journal":[{"kind":"note","id":"seminar","title":"PHIL 9H","text":"Hale’s seminar. Monday, 1 p.m., Hollis 302. One of the twelve is M. Broussard."}],"choices":[{"text":"Reply to Hale only: “I’ll be there. —J.C.”","set":{"trait.control":"+1","e1_email_reply":"replied"},"response":["He types it, deletes it, types it again exactly the same, and sends it. Then he waits, which is ridiculous; it’s nearly midnight and the man was drinking at lunch.","Four minutes.",{"type":"doc","title":"From: Adrian Hale · Re: PHIL 9H — Monday","text":"Of course you will."},"Theo, upside down: “He’s awake. That’s either very good or very bad for you.”"],"goto":"s24"},{"text":"Let Theo dare you into Reply All: “Looking forward to it. —Jack (Youngstown).”","tag":"Reckless","set":{"trait.reckless":"+1","rel.theo.warmth":"+1","e1_email_reply":"replyall"},"key":"You hit Reply All.","response":["“Reply all,” Theo says. “Do it. Costigan. *Costigan.* Be the man your father raised.” “You’ve met my father once.” “And he would want this.”","His finger hangs over the key long enough for a quick, disreputable Hail Mary. Then he hits it, and Theo screams into a pillow like a girl at a Jonas Brothers concert.","At 11:51 the Dell chimes.",{"type":"doc","title":"From: mbroussard@marisol.edu · Re: PHIL 9H — Monday","text":"Some of us read the syllabus in July. See you at one, Youngstown. —L. Broussard"},"Jack lies back and laughs at the ceiling, helplessly, until Theo throws a cashmere sock at his head."],"goto":"s24"},{"text":"Close the laptop.","set":{"e1_email_reply":"none"},"response":["The room goes dark except for Theo’s phone, and then not even that.","Theo, in the dark: “You’re going to be insufferable about this, aren’t you.” “Yes.” A rustle of very expensive sheets."],"goto":"s24"}]},"s24":{"slug":"MONDAY · 12:04 AM · DELGADO HALL, ROOM 412","body":["The 2:10 freight is still two hours down the coast, somewhere in the dark with all its cars, and the fog has the window now, a soft gray hand laid flat against the glass. Across the room Theo’s breathing evens out, catches, and evens out again. *The Moviegoer* sits on the desk with the postcard in it, Oxford sticking out of the pages like a tongue, and beside it the Dell’s fan winds down to nothing. Jack lies there with his St. Michael in his fist, listening to the building settle, not praying exactly, but not not."],"end":true}}},{"id":"S1E02","season":1,"episode":2,"showTitle":"The Hard Saying","title":"The Examined Life","dates":"Monday, August 31 – Friday, September 4, 2009","logline":"First week of classes: a famous atheist demands proof of a soul, a harbor diner needs a dishwasher, and the girl from the porch turns out to be the other half of the assignment.","previously":[{"text":"Your father drove you 2,400 miles and saw the Pacific for the first time."},{"text":"On the back porch of the Lighthouse, a girl from New Orleans judged a party with you — and then judged you."},{"text":"She took the cigarette out of your mouth and kept it.","if":"e1_lena_took_cig"},{"text":"At Mass she wore a mantilla. Afterward you argued about lip service, and you won.","if":"duel.lipservice.rigor>=3"},{"text":"On the stairwell she told someone named Wes she loved him, and called you nobody. You couldn’t tell which way she meant it.","if":"e1_stairwell==\"coughed\""},{"text":"Adrian Hale emailed the seminar: come prepared to prove you have a soul. You hit Reply All.","if":"e1_email_reply==\"replyall\""}],"cast":[{"id":"lena","name":"Lena Broussard","role":"The girl on the porch","tracked":true},{"id":"theo","name":"Theo Vance","role":"Roommate, Room 412","tracked":true},{"id":"laney","name":"Laney Price","role":"Lena’s roommate","tracked":true},{"id":"margot","name":"Margot Lindqvist","role":"Third floor, Delgado","tracked":true},{"id":"kevin","name":"Kevin Tran","role":"Down the hall, Room 420","tracked":true},{"id":"osei","name":"Fr. Gabriel Osei","role":"Newman Center chaplain","tracked":true},{"id":"hale","name":"Prof. Adrian Hale","role":"Philosophy, Marisol","tracked":true},{"id":"julian","name":"Julian Park-Ellis","role":"A guy with a guitar","tracked":true},{"id":"evan","name":"Evan Marsh","role":"TA, PHIL 1, Thursday section","tracked":true},{"id":"becca","name":"Becca Lindell","role":"Newman regular","tracked":true},{"id":"frank","name":"Frank Costigan","role":"Jack’s father","tracked":false},{"id":"maria","name":"Maria Costigan","role":"Jack’s mother","tracked":false},{"id":"nonna","name":"Carmela Rinaldi","role":"Jack’s grandmother","tracked":false},{"id":"gina","name":"Gina Costigan","role":"Jack’s sister","tracked":false},{"id":"rosie","name":"Rosie Costigan","role":"Jack’s sister","tracked":false},{"id":"priya","name":"Priya Raman","role":"4th-floor RA","tracked":false},{"id":"rafi","name":"Rafi Ochoa","role":"Second floor","tracked":false},{"id":"doug","name":"Doug Pruitt","role":"Room 420","tracked":false},{"id":"joey","name":"Joey Abruzzo","role":"Newman regular","tracked":false},{"id":"tyler","name":"Tyler Brandt","role":"Newman missionary","tracked":false},{"id":"fitch","name":"Dolores Fitch","role":"Newman secretary","tracked":false},{"id":"sloane","name":"Sloane Kittredge","role":"Pi Lambda Chi","tracked":false},{"id":"gloria","name":"Gloria Mendes","role":"The Anchor, nights","tracked":false},{"id":"rudy","name":"Rudy Salcedo","role":"Line cook, the Anchor","tracked":false},{"id":"caleb","name":"Caleb Hargrove","role":"PHIL 9H","tracked":false},{"id":"yusuf","name":"Yusuf Noorzai","role":"PHIL 9H","tracked":false},{"id":"wes","name":"Wes Arceneaux","role":"Lena’s boyfriend, Tulane","tracked":false},{"id":"tess","name":"Tess Fontenot","role":"Lena’s sister","tracked":false}],"duels":{"soul":{"title":"On the Soul","opponent":"hale","topic":"Whether anyone can prove they have a soul — or whether believing in one is just an inheritance."}},"start":"s01","endCard":{"tag":"Cite me.","nextTime":["“Malibu, Costigan. Bring a swimsuit and lowered expectations.”","“My father stays anywhere for six minutes. Time him.”","“Don’t touch the deck chairs. That’s the mountains.”","“You want to explain the dignity of labor to *me*? On Labor Day?”"]},"scenes":{"s01":{"slug":"MONDAY · 3:07 AM · DELGADO HALL, THE LAWN BY THE LAGOON","set":{"resolve.lena":6,"e2_laney_knows_surname":true},"body":["The alarm doesn’t ring so much as happen to the building: a horn like a goose being audited, a strobe stuttering in every hallway, and three hundred and ten freshmen pouring down the stairwells in whatever they sleep in. Out on the lawn, Delgado blinks white over the Lagoon like a ship in trouble. Fog to the knees. The eucalyptus drips on everybody with real commitment, and the grass squeaks.","Jack is barefoot, in basketball shorts and the gray Cardinal Mooney hoodie, the RAZR in his fist out of pure habit. It buzzes.",{"type":"sms","from":"Gina","text":"is the fire near u. nonna saw california on the news. she says st florian is the fire one dont forget","time":"3:09 AM"},"On the lobby steps Priya, in a Fremont High hoodie, uses the air horn for the first time in recorded history — one flat, enormous blast — and three hundred people shut up. A fresh laminate is taped to the glass door behind her, next to the one reminding the fourth floor that she has friend-requested every last one of them and expects to be accepted: COVER YOUR COUGH. H1N1 DOES NOT CARE ABOUT YOUR FEELINGS. “FOURTH FLOOR! PRUITT! TRAN! VANCE! *COSTIGAN!*” Kevin Tran is at her elbow with a second clipboard, quarter-zip zipped to the sternum at three in the morning. Nobody has to tell Jack he volunteered.","“*Costigan*,” says a Texan voice twenty feet off, trying it on. “Like a cop show.”","The floor, in its natural habitat. Margot, fully dressed in black down to the Docs and visibly not cold, writing in her Moleskine by strobe light; she turns the page to show him — ALARM 1., underlined. “I’m establishing a baseline.” Theo in a navy silk robe, carrying the espresso machine like an infant out of a burning village. “I saved what mattered.” And last out of the building, Doug Pruitt: barefoot, out the fire door at the far east end, the wrong end of the hall from 420, with a pillow under his arm like a football.","The cop-show voice is Laney: sleep mask pushed up into her copper hair like a tiara, pearls, a camisole, and over it an oatmeal cardigan with holes at the elbows that Jack last saw on a porch. She throws both arms up. “My *fireman*.”","Beside her, arms crossed hard against the cold, is Lena: a faded black Saints T-shirt, the fleur-de-lis cracked from washing and WHO DAT across the chest, pajama pants, Keds with the laces dragging in the wet, her hair in a knot she clearly did in the dark and hasn’t forgiven.","“Youngstown,” she says.","“Broussard.”","Theo materializes at his shoulder, machine and all. “*Broussard*. *M.* Broussard. In the flesh.” Lena takes in the robe, the machine, the hair. “And you are?” “The roommate. The one he abandoned at the Lighthouse. I dared him anyway; I’m a forgiving man.” “Then I blame you.” Theo turns to Jack and doesn’t lower his voice at all. “I like her. She’s mean.”"],"journal":[{"kind":"note","id":"alarm","title":"Fire alarm, 3:07 a.m.","text":"Everybody on the lawn in what they sleep in. Theo saved the espresso machine. Margot wrote ‘ALARM 1’ like it was a case number."}],"choices":[{"text":"“Some of us read the syllabus in July.”","tag":"Wit","set":{"e2_alarm":"syllabus","trait.wit":"+1"},"response":["She doesn’t miss a step. “Some of us read it *twice*. Bring a pen, Youngstown. I’ve seen your margins.” She has, on the porch, for most of an hour. Laney leans in like she’s passing a stock tip. “She has a highlighter system. It’s color-coded by *sin*.”","At 3:31 the strobes die and three hundred and ten people squeak back inside. Lena takes the east stairs two at a time, her wet Keds printing the concrete; at the second-floor landing the prints turn off toward 217."],"goto":"s02","if":"e1_email_reply==\"replyall\""},{"text":"Pull off the Mooney hoodie and hold it out to her.","tag":"Sincerity","set":{"e2_alarm":"hoodie","trait.sincerity":"+1","rel.lena.warmth":"+1","rel.laney.warmth":"+1"},"response":["He’s out of it before he’s thought about it. Lena doesn’t take it. “I’ve got a cardigan. Laney’s wearing it.” Laney takes the hoodie instead and is inside it before anybody can object. It comes to her knees. She reads CARDINAL MOONEY upside down off her own chest and declares herself a cardinal. Jack stands there in a Browns T-shirt, getting rained on by a tree. Lena watches him be cold and says nothing about it, and the nothing carries.","At 3:31 the strobes die and three hundred and ten people squeak back inside, Jack in his T-shirt with his arms wrapped around himself. Lena takes the east stairs two at a time, her wet Keds printing the concrete; at the second-floor landing the prints turn off toward 217."],"goto":"s02"},{"text":"“How were the red beans?”","tag":"Candor","set":{"e2_alarm":"beans","trait.candor":"+1","rel.laney.warmth":"+1"},"response":["For half a second she’s slower than he has ever seen her, and he’d bet she’s finding the Anchor in it. Then: “Somebody had to feed this building.” Laney groans into the cardigan collar. “She made a *vat*. At eleven p.m. On a *Sunday*. The whole second floor smells like a Baptist potluck.”","At 3:31 the strobes die and three hundred and ten people squeak back inside. Lena takes the east stairs two at a time, her wet Keds printing the concrete; at the second-floor landing the prints turn off toward 217."],"goto":"s02"},{"text":"“How’s Archbishop?”","tag":"Charm","if":"trait.charm>=2 && scar_told_lena_2==\"archbishop\"","set":{"e2_alarm":"archbishop","trait.charm":"+1","rel.lena.warmth":"+1"},"response":["She laughs outright, a short undignified honk into the fog, and doesn’t bother taking it back; she aims it at him instead. “Pray for him. He confirmed a child.” Theo looks from one to the other. “Who’s Archbishop?” “Nobody,” they say together. Theo looks like a man who has found a conspiracy and means to be inside it by breakfast.","At 3:31 the strobes die and three hundred and ten people squeak back inside. Lena takes the east stairs two at a time, her wet Keds printing the concrete; at the second-floor landing the prints turn off toward 217."],"goto":"s02"}]},"s02":{"slug":"MONDAY · 12:51 PM · HOLLIS HALL, ROOM 302","set":{"resolve.lena":7},"body":["By noon the fog has gone back wherever it spends the day, and the cloister walk along Hollis is red tile and arches, the bougainvillea dropping magenta faster than anybody could sweep it. Room 302: a long oak table scarred with other people’s initials, fourteen chairs, a radiator that knocks in September for no reason anyone has found, and a window full of sea.","Jack is in the navy Goodwill blazer — a lifeguard at a funeral, per Theo. In his back pocket: Benedict XVI, *Spe Salvi*, the Ignatius edition, thin as a parish pamphlet, two dollars off the sidewalk cart outside Driftwood Books on Sunday evening, while he waited for the 11. For a bookmark, a holy card of the man himself, white cassock, both hands raised, a grandfather who has read everything you have and remembers it better.","Lena is already there. Of course she is: the chair at the head’s right hand, a faded green sundress, brown Justins crossed at the ankle, the syllabus annotated in three colors of ink, a fountain pen uncapped beside it like a drawn weapon. Jack takes the chair directly across from her. There is no other chair. There are eleven other chairs.",{"type":"doc","title":"PHIL 9H · THE EXAMINED LIFE · Prof. A. C. Hale","text":"Week 1. Is anybody in there? Descartes, *Meditations* II; Ryle, *The Concept of Mind*, ch. 1; Aquinas, *Summa Theologiae* I, qq. 75–76.\nAttendance is compulsory. Agreement is not."},"A boy with a Central Valley twang drops in beside Jack with a Darwin-fish laptop and a copy of *The Consolations of Disbelief* so stuffed with Post-its it looks like it’s molting. “Caleb. Visalia. I’ve read it six times. I’m not proud.” He looks proud.","Jack sets *Spe Salvi* on the oak and the holy card slides half out. Lena’s eyes go straight to it. “You carry the Pope in your back pocket. Like a ticket stub.”","“I carry *this* Pope.” He means to stop there, and doesn’t. “Smartest man alive who’s also in charge of anything. Regensburg — best lecture anybody’s given in a university in fifty years, and nobody read past the part they were angry about. And this.” He taps it. “Section two. ‘The one who has hope lives differently.’ He put my whole religion in a sentence and then wrote forty-eight more sections to be polite.”","“I’d follow him into a burning building,” Lena says. “I just wouldn’t put him on my wall. In January he lifted the excommunication on a bishop who went on Swedish television to say the gas chambers never happened, and then wrote that somebody at the Vatican could have caught it by looking on the internet.” She caps the pen and uncaps it. “Brilliant man. Somebody should be telling him things.” “He wrote every bishop on earth in March and owned up to it. Name me one other head of anything who’s done that in writing.” “I read it. It’s a beautiful letter.” She doesn’t give an inch. “I’d still have somebody open his mail.” Beside him Caleb murmurs “Selah” — by reflex, where another kid would say *touché* — and looks appalled at himself.","The rest come too fast to learn. A lean kid in a Mission San Jose sweatshirt, no water bottle on a warm day — “Yusuf. Fremont. Aerospace. It’s Ramadan, so if I pass out, put me on my side” — takes in the holy card and the fountain pen and says to nobody, “Oh, good. The Catholics are here.” A Palo Alto girl who has read the whole syllabus and resents everyone who hasn’t. A quiet kid hiding a chemistry textbook. Two lanky boys from San Diego with the same surname, haircut and hoodie, who are not related and are tired of saying so. And four more he won’t sort out till October.","At 1:07 Adrian Hale comes in without hurrying, which is louder than hurrying. The linen jacket; the wine on the cuff, the same stain as yesterday, Jack would swear; reading glasses pushed up into the silver hair and forgotten. He sits at the head of the table, sets down one sheet of paper, the roster, and looks at no one.","“Prove to me you have a soul. You have ninety minutes and I’ve had lunch.”","Then he looks round the table, slowly, chair by chair. “Which of you is Youngstown?” Jack’s chin comes up before he can stop it. “— there you are. The nine pages. And you replied to *all*, Mr. Costigan. Brave or careless; we’ll find out. Miss Broussard replied to all of us to correct you, which I enjoyed rather more.”","He laces his fingers over his stomach. “We’ve met, the three of us, after a fashion. Yesterday, at the Anchor. A girl who left as though I’d set fire to her coffee, and a boy who went after her like a spaniel. I do love a roster.”","“I’d left something on the stove,” Lena says evenly, and her thumb goes to the gold medal at her throat and stays there.","Hale lets it go, with open pleasure, like a man letting a fish run when he’s in no hurry at all. Under the window, the radiator knocks once."],"journal":[{"kind":"person","id":"hale","title":"Prof. Adrian Hale","text":"Wrote *The Consolations of Disbelief*. Wrote me a postcard. Walked into Hollis 302 at 1:07 with wine on his cuff and asked us to prove we have souls. Knew my face from the Anchor before he knew my name. Called me a spaniel."},{"kind":"person","id":"caleb","title":"Caleb (PHIL 9H)","text":"Visalia. Has Hale’s book so full of Post-its it’s molting. Says ‘Selah’ when he means ‘touché.’"},{"kind":"person","id":"yusuf","title":"Yusuf (PHIL 9H)","text":"Fremont. Engineer. Fasting for Ramadan through a ninety-minute seminar and funnier than all of us."}],"next":"s03"},"s03":{"slug":"MONDAY · 1:12 PM · HOLLIS HALL, ROOM 302","duel":"soul","set":{"duel.soul.lena":"+1"},"body":["Hale doesn’t lecture; he gossips about the dead. “Descartes shut himself in a stove-heated room in Germany one winter and came out with two kinds of stuff: the body, which is a machine, and the mind, which is a ghost inside it pulling the levers. Very tidy. Nobody since has explained how a ghost pulls a lever.”","“Then Ryle, 1949. *The Concept of Mind*. ‘The dogma of the Ghost in the Machine.’ A visitor to Oxford is shown the colleges, the libraries, the playing fields, the laboratories, and at the end of the day he asks: yes, lovely, but where is the *University*?” He spreads his hands. “I spent a decade being the University and never once ran into it. That’s a category mistake, and you make it every time you say *soul*. So. Show me where it’s kept.”","Caleb goes first, Post-its fluttering. “Dennett. *Consciousness Explained*. There’s no theater in the head, no little guy watching the screen —” “Or explained *away*,” Hale murmurs, approving, as if a retriever had come back proudly with the wrong stick.","Yusuf, hands folded on the oak: “I’m fasting, Professor. My soul is the only part of me that isn’t hungry.” The table laughs, and Hale laughs with it, head back, a real laugh with Yorkshire somewhere under the Oxford, and writes it down.","“Nobody at this table believes in your ghost, Professor,” Lena says. “Aquinas says the soul is the *form* of the body. Not a passenger — the shape matter takes because it’s alive. Ryle spent a whole book beating up a Frenchman.”","Hale regards her over the glasses he isn’t wearing. Then he turns, unhurried. “And Youngstown? A ghost man or a form man?”"],"choices":[{"text":"Side with her and push further: the intellect holds *triangle* and *justice*, which no organ can. Aquinas, *ST* I q.75 a.2.","tag":"Press","set":{"duel.soul.rigor":"+1","rel.lena.warmth":"+1","rel.hale.friction":"+1"},"response":["“Form,” Jack says. “And she’s underselling it. I can hold *triangle* in my head — not this one or that one — and *justice*, which nobody’s ever weighed. No organ holds a universal. Aquinas, question seventy-five: the intellect has an act of its own. Call it what you like. It isn’t a ghost.”","“Two Thomists,” Hale says. “*Christ*.” Lena doesn’t look at Jack; her pen taps the table twice, which might be applause. “Universals are a grammar, Mr. Costigan, not a ghost. But it was nicely parsed.”"],"goto":"s04"},{"text":"“You asked where it’s kept. Same place as your manners, Professor.”","tag":"Riposte","set":{"duel.soul.wit":"+1","rel.hale.warmth":"+1"},"response":["“Nobody’s ever seen them,” Jack says, “but we’re assured they exist.” The room goes off like a dropped tray; Caleb laughs and then looks betrayed by it. Hale inclines his head a quarter inch, a fencer conceding the touch. “Ten minutes in and he’s gone for the man. Good. It saves time.”"],"goto":"s04"},{"text":"Augustine, *Confessions* X: he went looking inside his own memory and found palaces too big for his head.","tag":"Reframe","set":{"duel.soul.rigor":"+1","rel.lena.friction":"+1","e2_soul_interior":true},"response":["“Neither. Augustine, *Confessions*, book ten. He goes looking for God in his own memory and gets lost in there — fields, caves, ‘spacious palaces,’ more rooms than any skull could hold. ‘I have become a question to myself.’ You want to know where it’s kept? It’s an inside with no floor plan.”","Hale’s eyebrows rise against what looks like his better judgment. “Rooms. How very Protestant of a Catholic.” Across the table Lena’s head has turned. It isn’t her answer. He watches her draw a neat line through something on her syllabus, in green."],"goto":"s04"},{"text":"“I can’t show you where it’s kept. I can tell you I’ve felt it go missing.”","tag":"Concede","set":{"duel.soul.heart":"+1","rel.hale.trust":"+1","e2_soul_missing":true},"response":["Hale stops. It lasts about one second, which in Hale is a long time. “I can’t do a thing with that, Mr. Costigan.” The radiator knocks. “But it’s the first true thing anybody’s said today.” Lena looks at Jack across the table, a short straight look, and she’s the one who ends it."],"goto":"s04"}]},"s04":{"slug":"MONDAY · 1:31 PM · HOLLIS HALL, ROOM 302","duel":"soul","body":["Hale goes to the window and tells the next part to the Pacific, low and confiding, the way you’d tell a ghost story to children you were fond of.","“Vermont. September 1848. The Rutland and Burlington Railroad is blasting a cut through rock near Cavendish, and the foreman is a capable, well-liked young man named Phineas Gage. He’s tamping powder into a drill hole with an iron bar — three feet seven inches, thirteen and a quarter pounds. The powder goes off.” He turns around. “The bar goes in under his left cheekbone, out through the top of his skull, and lands in the dirt yards behind him, greasy with what used to be the front of his brain.”","The Palo Alto girl makes a small noise. “He sits up in the oxcart. He *talks*. He greets the doctor: ‘Doctor, here is business enough for you.’ He lives. And afterwards —” He comes back to his chair and folds his hands. “His doctor wrote that his friends said he was ‘no longer Gage.’ Fitful. Profane. Impossible. Damage the brain, change the man. A soul that can be knocked out of a man with a railroad spike is not much of a soul.”","Jack’s hand has gone to his left eyebrow. He finds it there, his thumb on the white line, and takes it down and lays it flat on the oak.","The table has gone quiet in a different way. Across from him Lena is looking at his hand, not his face.","When he answers, he hasn’t decided which Jack is going to do it."],"choices":[{"text":"Smash the piano and you haven’t disproved the pianist. Aquinas got there first: injure the organ and understanding is *impeded*.","tag":"Press","set":{"duel.soul.rigor":"+1"},"response":["“You break the piano, you haven’t disproved the pianist. You just don’t get music.” He keeps going. “And Aquinas beat your railroad to it. In this life the intellect works through images, and if the organ of the imagination is hurt, understanding is impeded. He names frenzy. Impeded isn’t gone.”","Hale looks delighted to be handed Aquinas against himself. “A soul that survives every injury by declining to do anything. Marvelous. The perfect civil servant.” Jack’s answer is hanging on by one hand. “Question eighty-four,” Lena says quietly, before he can find it. “Article seven.” He lets her."],"goto":"s05"},{"text":"“Then somebody still had to love whoever Gage was afterward.”","tag":"Heart","set":{"duel.soul.heart":"+1","rel.lena.trust":"+1","e2_gage_mother":true},"response":["It comes out quiet and plain, in a voice he hasn’t used at this table. “Then whoever Gage was afterward, somebody still had to love that guy. His mother didn’t stop. If there was nothing left of him, what was she loving?”","Hale looks at him a while. “Her memory, Mr. Costigan.” And then, unexpectedly: “She didn’t stop, as it happens. He died in her house.” It doesn’t sound like a point for either of them."],"goto":"s05"},{"text":"Afterward Gage drove six-horse stagecoaches over the mountains in Chile. “I’ve seen Browns quarterbacks take less and retire.”","tag":"Riposte","set":{"duel.soul.wit":"+1","rel.hale.warmth":"+1"},"response":["“He went to Chile. Drove a six-horse coach over the mountains for years. I’ve seen Browns quarterbacks take less and retire.” The room laughs, glad to. “There’s a man in Melbourne who’s written an entire book agreeing with you about Chile,” Hale says, “which I find irritating. The Browns I’ll take on faith.”"],"goto":"s05"},{"text":"“You were drinking a Bloody Mary at one-thirty on Sunday. When you order the second one, is that you or the vodka?”","tag":"Personal","cue":"Hale will remember that.","set":{"duel.soul.wit":"+1","rel.hale.warmth":"+1","rel.hale.trust":"-1","e2_hale_jab":true},"response":["Jack hears how cold it is only after it’s out. Hale’s smile arrives and stays, delighted and freezing at once. “Both, Mr. Costigan. And the second is always better company.”","Caleb appears to have stopped breathing. Lena, under her breath, to the oak: “Lord.” Hale writes something in the margin of the roster, beside what Jack has to assume is his name, and doesn’t say what."],"goto":"s05"}]},"s05":{"slug":"MONDAY · 1:52 PM · HOLLIS HALL, ROOM 302","duel":"soul","set":{"duel.soul.lena":"+1"},"body":["Hale pours himself water from a carafe nobody saw him bring, regards it with disappointment, and drinks it anyway. Then he sets the two of them on each other.",{"if":"e2_soul_interior","text":"“Miss Broussard says the soul is the body’s form. Mr. Costigan has rooms in his. A tenant, then, in a house too big for it.”"},{"if":"e2_soul_missing && !e2_soul_interior","text":"“Miss Broussard says the soul is the body’s form. But Mr. Costigan’s goes missing. A thing that can leave is a tenant.”"},{"if":"!e2_soul_interior && !e2_soul_missing","text":"“Mr. Costigan either agrees with Miss Broussard, which is cowardice, or has been too busy being charming to say, which is worse. Let me help. Mr. Costigan, you’ll defend the tenant — Aquinas lets the soul outlive its body; there’s your lease. Miss Broussard, evict him.” Lena lights up like somebody has tossed her a ball she’s been catching since grade school."},"“You can’t both be right,” Hale says. “Settle it. I’ll hold your coats. And pick a weapon and keep hold of it: I mark commitment, not variety.”","Lena turns to face Jack square, and he can see the rematch arrive in her at last. She reaches for cardigan sleeves she isn’t wearing and settles for squaring her syllabus against the oak.","“If the soul’s a tenant, the body’s a rental. And you know what people do with rentals. That’s how you get a whole culture that treats bodies like hotel rooms: check in, trash it, leave the key on the dresser.” This to Hale as much as to Jack. “I have nothing against anybody having a good time in a hotel, Professor. I’m against pretending nobody lives there. If I *am* my body, then what happens to it happens to *me*. Every time.” Back to Jack. “Your tenant’s a Cartesian, Costigan. Evict him or I will.”"],"choices":[{"text":"“Then what survives death? Aquinas needs the soul to subsist on its own. He’s half on my side.”","tag":"Press","set":{"duel.soul.rigor":"+1","rel.lena.friction":"+1"},"response":["“Then what survives death? Aquinas needs the soul to subsist without the body, or there’s nobody home after the funeral. He’s half on my side.”","She doesn’t let him land. “Subsists *incomplete*. It wants the body back — it’s ‘naturally apt’ for it, his phrase. That’s why it’s the resurrection of the *body*, Costigan. We say so every time we start a rosary.” “Point to the lady,” Hale says. “Rigor to the gentleman. I’m enjoying this far more than my doctor would like.”"],"goto":"s06"},{"text":"“She’s right. My side gets you Descartes, and Descartes gets you a body you can rent out.”","tag":"Concede","set":{"duel.soul.heart":"+1","rel.lena.trust":"+1","rel.lena.warmth":"+1","rel.lena.friction":"-1"},"response":["Lena stops mid-breath. She had three more paragraphs loaded; he could see them stacked behind her teeth. She looks at him as though he’s slid something across the table that she now has to decide whether to keep. “Disappointing,” Hale says. “Do go on, Miss Broussard. He’s given you the floor.” She doesn’t use it right away."],"goto":"s06"},{"text":"“We’re both right, and he’s counting on us not to notice.” Turn on Hale together.","tag":"Alliance","set":{"duel.soul.heart":"+1","rel.lena.warmth":"+1","rel.hale.warmth":"+1","e2_union":true},"response":["“Augustine’s rooms are in Aquinas’s house.” Lena takes it without a hitch — “The interior *is* the form, seen from inside” — and for ninety seconds they don’t fight each other at all: she hands him the *Summa*, he hands her book ten, she finishes his Augustine and he finishes her Aristotle, and Hale watches, chin on his fist, as two freshmen build something at him. “Oh, they’ve formed a *union*.”","Jack thinks of his father’s Local 1112 jacket on the hook by the back door."],"goto":"s06"},{"text":"“Says the girl who walked out of the Anchor the second she saw a magazine. Was that your soul leaving, or just your body?”","tag":"Personal","cue":"Lena will remember that.","key":"You used the Anchor against Lena in front of Hale.","set":{"duel.soul.wit":"+1","duel.soul.lena":"+1","rel.lena.friction":"+2","rel.lena.trust":"-2","resolve.jack":"-1","e2_lena_jab":true,"soul.grace":"-1"},"response":["Lena goes still, and then polite. “I’d left something on the stove, Mr. Costigan,” she says pleasantly, and she takes hold of the medal like a railing.","The room’s sympathy comes about and fills on her side of the table like a sail. Hale, very softly: “Ah.” In the quiet Jack hears his own line again and wants it back more than he has wanted most things."],"goto":"s06"}]},"s06":{"slug":"MONDAY · 2:09 PM · HOLLIS HALL, ROOM 302","duel":"soul","set":{"duel.soul.lena":"+1"},"body":["Hale takes the glasses down off his head at last and pockets them, and somehow that’s how they know this is the one he came to make. His voice drops. It isn’t unkind.","“Every one of you who believes in a soul was told to by somebody who loved you before you could read. Your mother. Your grandmother. A nun with a felt board. Nobody reasoned you into it. It was left to you, like the good china: an inheritance. Born in Thebes, you’d be on your knees to Zeus. Born in Riyadh — forgive me, Mr. Noorzai —” “You’re forgiven, Professor. It’s Fremont.” “— you’d face east.” “West, Professor,” Yusuf says. “From Riyadh it’s west. From Fremont it’s nearly due north. I have a compass.” “Forgive me twice, then,” Hale says, delighted. “Your souls are *addresses*. I don’t say it to be cruel. I say it because not one of you chose, and you’re old enough now to notice.”",{"if":"e2_lena_jab","text":"Lena answers him without once looking down the table toward Jack."},"“That’s the genetic fallacy, Professor,” Lena says. “Where a belief comes from says nothing about whether it’s true. They teach it in Lincoln–Douglas. I was thirteen.” “And yet,” Hale says gently, “it’s true of you.” “So is the multiplication table, Professor. My mother taught me that one too.” “Your mother,” Hale says, “could show her working.” “It’s true of *me*,” Caleb says, too loud, red to the ears. “I got out.”","Nobody answers that. Then, one by one, as rooms do, they look at Jack."],"choices":[{"text":"Newman: how a belief got into you says nothing about whether it’s true. And Hale got his from somebody too.","tag":"Press","key":"You told Hale he’d inherited his atheism too.","set":{"duel.soul.rigor":"+1","rel.hale.friction":"+1","e2_soul_final":"press"},"response":["“Newman, *Grammar of Assent*. We believe most things the way you know there’s a coastline in the fog: a thousand small signs converging, not one proof. None of that cares where you first heard it.” Then, because it’s sitting right there: “I’d bet you got yours from somebody too, Professor. Most of us do. You just got it by kicking.”","Hale stops. He looks at the window for exactly as long as it takes the radiator to knock twice. Then he’s brisk, all at once, a man gathering papers he hasn’t got. “The genetic fallacy cuts both ways. Well done. We’ll bleed it out on Wednesday.”"],"goto":"s06v"},{"text":"Tell him the truth: at sixteen, after his book, you tried to put it down.","tag":"Heart","cue":"Lena heard that.","key":"You told Hale that when you tried to leave, there was nowhere to go.","set":{"duel.soul.heart":"+2","soul.grace":"+1","soul.honesty":"+1","rel.lena.trust":"+1","e2_john668":true,"e2_soul_final":"heart"},"response":["Jack doesn’t make it clever. He hasn’t got clever in him right now.","“I didn’t get it from my parents,” he says. “I mean, I did. And at sixteen, after your book, I tried to put it down. A whole summer. I did everything right. I stopped going. I read you twice. And there was nowhere to go. Not a feeling — I’m not telling you about a feeling. I looked around for somewhere else to stand, and there wasn’t anywhere.”","Nobody moves. Out the window a gull hangs in the updraft off the cliff without flapping, as if it’s waiting too. When Hale speaks it’s quietly, and not to the room. “‘Lord, to whom shall we go.’ Yes. I know it. I was made to learn it.”"],"goto":"s06v"},{"text":"“I was born in Youngstown, Professor. If I picked gods by geography, I’d have picked one with weather.”","tag":"Riposte","key":"You answered Hale’s best argument with a joke about the weather in Youngstown.","set":{"duel.soul.wit":"+1","rel.hale.warmth":"+1","e2_soul_final":"wit","soul.honesty":"-1"},"response":["The biggest laugh of the afternoon. Yusuf actually applauds, two flat claps, and the San Diego boys high-five across the Palo Alto girl. Hale smiles the book-jacket smile, devastating and unhurried, and says nothing at all, and it takes Jack a second too long to understand that he’s just lost the round."],"goto":"s06v"},{"text":"“That’s the best argument you’ve made. I don’t have an answer today.”","tag":"Concede","key":"You admitted Hale had made an argument you couldn’t answer — yet.","set":{"duel.soul.heart":"+1","rel.hale.trust":"+2","soul.honesty":"+1","e2_soul_final":"concede","rel.lena.warmth":"+1","soul.grace":"+1"},"response":["Hale considers him. “Honesty. How disappointing. Wednesday, then.” But for the rest of the hour there’s something new in how he looks at Jack: the look of a man who has just been handed a real opponent. Under the table Lena’s boot finds his and kicks it, once. A reprimand or a salute; he can’t tell. From her face, she hasn’t decided either."],"goto":"s06v"}]},"s06v":{"slug":"MONDAY · 2:24 PM · HOLLIS HALL, ROOM 302","duel":"soul","body":[{"if":"duel.soul.heart>=3","text":"Hale looks out at the sea until the quiet in the room starts to belong to it. Then he caps his pen. “Go away,” he says. “All of you. In a minute. First, your homework.”"},{"if":"duel.soul.rigor>=3 && duel.soul.heart<=2","text":"“Mr. Costigan,” Hale says, “that was very nearly an argument.” From Hale it lands like a medal pinned on with a thumbtack. Across the table Lena’s chin comes up and stays up. She writes something in red across the top of her syllabus and underlines it twice, hard enough that he hears the nib. She came for her rematch and didn’t get it, and the set of her mouth says she’s rescheduled, not cancelled."},{"if":"duel.soul.wit>=3 && duel.soul.rigor<=2 && duel.soul.heart<=2","text":"“Mr. Costigan has won the room and lost the point,” Hale says. “He’ll go into politics.” The room laughs again — at Jack this time, which is a different sound. Lena doesn’t laugh."},{"if":"duel.soul.rigor<=1 && duel.soul.heart<=1 && duel.soul.wit<=2 || duel.soul.rigor<=1 && duel.soul.wit<=1 && duel.soul.heart<=2 || duel.soul.heart<=1 && duel.soul.wit<=1 && duel.soul.rigor<=2","text":"“Miss Broussard has won,” Hale says. “Mr. Costigan has *attended*.” Lena doesn’t smile. She caps her fountain pen with one small precise click, like a woman who expected exactly this and was raised too well to enjoy it in public. Jack finds he doesn’t mind losing to her nearly as much as he ought to."},{"if":"duel.soul.rigor>=2 && duel.soul.rigor<=2 && duel.soul.heart>=2 && duel.soul.heart<=2 && duel.soul.wit<=2 || duel.soul.rigor>=2 && duel.soul.rigor<=2 && duel.soul.wit>=2 && duel.soul.wit<=2 && duel.soul.heart<=1 || duel.soul.heart>=2 && duel.soul.heart<=2 && duel.soul.wit>=2 && duel.soul.wit<=2 && duel.soul.rigor<=1","text":"“A split decision,” Hale says, “and I resent it. Neither of you is allowed to be certain.” Lena caps her fountain pen, considers Jack across the oak, and uncaps it again, like a woman who has decided the matter is still open and intends to be the one who closes it."},"Hale stands, which is apparently the only warning they’ll ever get, and writes on the whiteboard in a hand like barbed wire.",{"type":"doc","title":"PHIL 9H — the whiteboard","text":"TWO PAGES. EVERY WEEK.\nProve the thing you least believe you can prove.\nSwap with your appointed enemy. Annotate each other in RED.\nI grade the annotations.\nDue at the start of class. Wednesday."},"“The papers themselves,” he says, capping the marker, “I mostly use to level the dog’s bowl.” He pairs them off without looking at the roster. The Palo Alto girl with the chemistry kid. “Mr. Hargrove, Mr. Noorzai. Heaven help you both.” A deconvert with a molting paperback and a man nine hours into a fast regard each other across the oak. Two more pairs, names he hasn’t learned. The San Diego boys with each other, “as a mercy.” “We’re not —” “I know.”","He doesn’t turn his head for the last one. “Mr. Costigan. Miss Broussard. You’ve already found each other.”",{"if":"e2_lena_jab","text":"“I’m sure Mr. Costigan will be thorough,” Lena says — to Hale, not to Jack."},{"if":"duel.soul.heart>=3","text":"Nobody moves until Yusuf does. Then it’s chairs and bags and the door, early, and the room empties out around the oak. Lena stays in her seat a second longer than anyone, looking at the table."}],"journal":[{"kind":"note","id":"assignment","title":"Designated antagonists","text":"Hale paired us. Two pages a week, swapped, bled on in red. For the whole semester. I’m going to need more pens."}],"next":"s07"},"s07":{"slug":"MONDAY · 2:31 PM · HOLLIS HALL, CLOISTER WALK","body":["On the cloister walk the heat comes up off the red tile as if it has been saving it. Across the Commons the Ferrer Tower’s carillon stumbles through the half hour, off-key, with the confidence of a man singing in the shower.","Caleb catches him at the arches, his book clutched to his chest. “He *remembered* yours. The nine pages. Did he — did he write back?” “One line,” Jack says. “Mostly a dare.” “I wrote him four letters. *Four.* I used a thesaurus on the third one. He never —” He laughs, to show it’s funny. It doesn’t come off. Jack’s answer was true, and no help, and he watches it not help.","Lena is two steps away under the next arch, her syllabus against her chest. She says nothing. Her hands are still. She’s watching a bee work the bougainvillea, and the carillon finishes, and nobody fills the space after it.","Yusuf saves them, passing with his backpack on one shoulder. “Costigan. Iftar at the Islamic Center on Mission, any night this month. You Catholics like a long meal. We start at sunset and end when the dates run out.” Then, dry as a forecast: “My dad’s plant is closing, by the way. NUMMI. Toyota announced it last Thursday. Load-bearing wall of the house, that job.” He goes off toward a quiet stairwell — to pray, Jack guesses, now that Hale has let him go. Two sons of auto workers at one oak table: Jack notices it like a face from his own parish in an airport.","Caleb trails after him. Then it’s the two of them.",{"if":"e2_lena_jab","text":"“Mr. Costigan,” Lena says. Formal, a nod. She waits for whatever he’s going to say like a bus she didn’t want to catch."},{"if":"e2_john668 && !e2_lena_jab","text":"“You said that like you meant it,” Lena says. “I did.” “Good.” Her hands stay where they are, folded over the syllabus. She looks at him a second longer than she has to, and then, brisk, as if somebody might be grading her on it: “Wednesday, Costigan.”"},{"if":"!e2_lena_jab && !e2_john668 && duel.soul.rigor>=3 || !e2_lena_jab && !e2_john668 && duel.soul.heart>=3 || !e2_lena_jab && !e2_john668 && duel.soul.wit>=3","text":"Lena turns to him with her syllabus held like a shield she intends to hit him with. “I owe you a Sunday, Costigan. And I pay my debts.”"},{"if":"!e2_lena_jab && !e2_john668 && duel.soul.rigor<=1 && duel.soul.heart<=1 && duel.soul.wit<=2 || !e2_lena_jab && !e2_john668 && duel.soul.rigor<=1 && duel.soul.wit<=1 && duel.soul.heart<=2 || !e2_lena_jab && !e2_john668 && duel.soul.heart<=1 && duel.soul.wit<=1 && duel.soul.rigor<=2","text":"Lena turns to him with her syllabus held like a shield she intends to hit him with. “That’s one apiece, Costigan. I’d like it noted that I was gracious.”"},{"if":"!e2_lena_jab && !e2_john668 && duel.soul.rigor>=2 && duel.soul.rigor<=2 && duel.soul.heart>=2 && duel.soul.heart<=2 && duel.soul.wit<=2 || !e2_lena_jab && !e2_john668 && duel.soul.rigor>=2 && duel.soul.rigor<=2 && duel.soul.wit>=2 && duel.soul.wit<=2 && duel.soul.heart<=1 || !e2_lena_jab && !e2_john668 && duel.soul.heart>=2 && duel.soul.heart<=2 && duel.soul.wit>=2 && duel.soul.wit<=2 && duel.soul.rigor<=1","text":"Lena turns to him with her syllabus held like a shield she intends to hit him with. “He called it a split. I’d like it noted that I didn’t.”"}],"choices":[{"text":"“I’ll go easy on your margins.”","tag":"Wit","set":{"e2_pairing":"wit","trait.wit":"+1","rel.lena.warmth":"+1"},"response":[{"if":"!e2_lena_jab","text":"“Don’t you *dare*.” She says it like a blessing with a knife in it and goes off under the arches, and he can hear her boots on the tile all the way to the stairs.","else":"“Please don’t, Mr. Costigan. I’d hate to have to grade you for mercy.” She goes off under the arches without hurrying."}],"goto":"s08"},{"text":"“Bleed on mine. I can take it.”","tag":"Candor","set":{"e2_pairing":"candor","trait.candor":"+1","rel.lena.trust":"+1","rel.lena.friction":"+1"},"response":[{"if":"!e2_lena_jab","text":"“Oh, I know you can.” She’s said the next part to him before, on a wharf, and from her look she knows it and says it anyway. “That’s what worries me.”","else":"“I don’t doubt it,” she says, and leaves him standing in the bougainvillea with that."}],"goto":"s08"},{"text":"“I’m glad it’s you.”","tag":"Sincerity","key":"You told Lena you were glad Hale paired you with her.","set":{"e2_pairing":"sincere","trait.sincerity":"+1","rel.lena.trust":"+1","rel.lena.friction":"-1"},"response":[{"if":"!e2_lena_jab","text":"He means respect, and he watches her hear it that way. “Me too,” she says. Then, before it can turn into anything else: “Now stop being nice to me, Costigan. I can’t sharpen anything on it.”","else":"A pause, long enough for the carillon to strike again if it were going to. “Noted,” she says: not forgiveness, an entry in a ledger."}],"goto":"s08"},{"text":"Just nod. “Wednesday, then.”","tag":"Control","set":{"e2_pairing":"nod","trait.control":"+1"},"response":[{"if":"!e2_lena_jab","text":"She nods back, the same nod, returned in its original packaging, and walks off under the arches with her syllabus against her chest. He watches her go. Then he makes himself stop.","else":"She nods back, a degree shallower than his, and walks off under the arches with her syllabus against her chest. He watches her go. Then he makes himself stop."}],"goto":"s08"}]},"s08":{"slug":"TUESDAY · 4:10 AM · DELGADO HALL, ROOM 412","music":"Passion Pit — “Sleepyhead”","body":["Jack wakes because the room is blue: a cold laptop glow from Theo’s side of 412, the Grove still black in the window. Theo is sitting up against the headboard in sheets that cost more than the Silverado’s last transmission, earbuds in, a Criterion case open on the blanket: *The 400 Blows*. On the screen, small and black-and-white, a boy is running.","He runs along a fence, down through scrub, across a gray beach and into the edge of the sea, where there’s nowhere left to go. He turns in the shallows and looks straight into the camera, and the picture stops on his face and stays there, looking at Jack across eleven feet of dorm room and fifty years.","Theo thumbs out an earbud. “Couldn’t sleep.” “Is it for a class?” “It’s for a class. French cinema. Very rigorous. There’s a midterm.” “You’re undeclared.” “The way Switzerland is undeclared.” The RAZR says 4:10. Jack rolls toward the wall. The trackpad clicks, and somewhere in France the boy begins to run again.",{"type":"break"},"At 8:40 Theo is fresh as a commercial for himself, hair wet, no sign on him that he has ever seen four in the morning. Passion Pit pours out of the iPhone dock — a falsetto chopped into bright pieces, a music box having the best day of its life — and Jack is at the sink with his good flannel, scrubbing. The Jell-O shot he tucked in the pocket “for later” on Saturday went through Sunday’s wash. Later has arrived: a lime-green stain over the pocket in the shape of a heart, if you’re generous, and the soap is making it more generous.","“That’s not a stain, Costigan,” Theo says. “That’s a corsage.” He tilts his head. “Or did the swan come back for the other eyebrow? Has the family released a statement?”",{"type":"sms","from":"Gina","text":"mom told nonna ur bringing a nun home 4 thanksgiving. nonna lit a candle","time":"8:44 AM"},"Lunch period at Ursuline. Gina has never typed a word she didn’t enjoy.","The receipt is still on his desk, which is the trouble with receipts. Monday after Hale he carried a stack to the UCen register — the PHIL 1 reader, the Plato, a calculus text heavy enough to prop a fire door — and watched the total come up green: $186.40. He said he’d be back. The cashier printed it anyway, a souvenir of the books he couldn’t afford. The St. Brigid’s envelope had $340 in it on Saturday. Shower shoes, an extension cord and two packs of the Marlboros he’s quitting have been at it since.","Theo doesn’t look up from the espresso machine. “Put it on the Meridian card. My father will think I’m reading.”"],"choices":[{"text":"Take the card. “Tell your father I’m enjoying Boethius.”","tag":"Charm","set":{"e2_books":"theo","trait.charm":"+1","rel.theo.warmth":"+1"},"key":"You let Theo put your books on his father’s card.","response":["Theo is genuinely pleased. He holds out a black card between two fingers, like a valet ticket, without turning around. “See? Painless. Money’s just a rumor my father started.”"],"goto":"s08b"},{"text":"“I’ll find them used.”","tag":"Control","set":{"e2_books":"used","trait.control":"+1"},"key":"You told Theo you’d buy your books used.","response":["Theo shrugs, mildly wounded and mildly impressed. Jack already knows where: Driftwood Books on Mission, where *Spe Salvi* came off the sidewalk cart, with a hand-lettered sign in the window — BOETHIUS AND MRS. DANVERS ARE NOT FOR SALE. THE BOOKS ARE. Two to four dollars a spine. “You’re going to smell like a library sale for four years,” Theo says. “It suits you.”"],"goto":"s08b"},{"text":"“A loan. With interest. I’ll pay you in pie.”","tag":"Candor","set":{"e2_books":"loan","soul.honesty":"+1","trait.candor":"+1","rel.theo.trust":"+1"},"key":"You took Theo’s money as a loan, payable in pie.","response":["“I’ve never been owed pie,” Theo says, with something like wonder. “I accept the terms.” He writes it on a Post-it in a surprisingly neat hand — *IOU 1 PIE (TBD) —J.C.* — and sticks it to the espresso machine, the one place in the room Jack isn’t allowed to touch."],"goto":"s08b"}]},"s08b":{"slug":"TUESDAY · 8:58 AM · DELGADO HALL, ROOM 412","body":["The song runs out under a knock with choreography — shave-and-a-haircut, then two more for emphasis — and Jack opens the door on Laney Price at 8:58 in the morning, fully made up, holding a Tupperware like a pageant bouquet.",{"if":"e2_alarm==\"hoodie\"","text":"She is wearing his Cardinal Mooney hoodie as a dress, sleeves rolled four times, pearls over the drawstrings. “It’s mine now,” she says, before he can so much as look at it. “It’s been adopted. There was paperwork.”","else":"She’s in a Highland Park Lacrosse T-shirt knotted at the hip, and pearls, which is apparently a look."},"She puts the Tupperware in his hands, still faintly warm. “Lena’s red beans. Don’t ask her why she made them. Just eat. Sunday they’re beans; by Tuesday they’re theology.”",{"if":"e2_alarm==\"beans\"","text":"A pink fingernail lands on his chest. “*Now* you can ask how were the red beans.”"},"The emergency is Friday: Pi Lambda Chi opens its doors for recruitment, and Laney needs to practice conversations. “It’s a job interview where the job is being yourself,” she says, “and I have never once done that sober.” She points at Theo, last seen by her rescuing an espresso machine from a fire that wasn’t. “You. You’re Sloane.”","Theo is flawless, and terrifying. He perches on the desk, lets his whole face go bored in an expensive way, and says from an octave down inside his own indifference, “Tell me about your *philanthropy*, Delaney.” “Well, Sloane, I believe every child deserves — ” “That’s what the Kappas say.” Laney sags against the closet door like a debutante told the punch is nonalcoholic. Jack is cast as Whitney, a Kappa legacy from Atherton. “Whitney. Atherton. We summer.” “Where?” “Yes.” Laney points at him with her whole arm. “Oh, she’s *good*. I hate her.”","Sloane wants to know if Delaney knows her odds. Laney doesn’t blink. “A hundred and twenty girls through the door last fall, forty-nine bids. So forty-one percent — well, forty point eight three — ” She hears herself. The smile comes on like stadium lights. “Or whatever. I’m an Aquarius.” For one second Theo stops being Sloane, and the two of them look at each other across 412: two people who perform for a living, catching each other at it, delighted. Then he’s Sloane again, examining a cuticle.","On her way out she takes Jack’s RAZR out of his hand without asking — “This is like holding a clam that gave up” — curses T9 in a very Christian way, texts herself, and hands it back. It buzzes before it reaches his pocket.",{"type":"sms","from":"LANEY (FIREMAN’S FAVORITE)","text":"hiii fireman!! its me. dont lose me ;)","time":"9:04 AM"},"At the door she stops, one hand on the frame, and says it lightly, almost to the hallway. “Be honest, fireman. Would *you* bid me?”"],"journal":[{"kind":"person","id":"laney","title":"Laney Price","text":"Laney Price. Practicing for Pi Lam like it’s the Olympics. Programmed herself into my phone. (Hoodie status: hers.)","if":"e2_alarm==\"hoodie\""},{"kind":"person","id":"laney","title":"Laney Price","text":"Laney Price. Practicing for Pi Lam like it’s the Olympics. Programmed herself into my phone.","if":"e2_alarm!=\"hoodie\""}],"choices":[{"text":"“They’d be lucky.”","tag":"Sincerity","set":{"e2_laney_q":"sincere","trait.sincerity":"+1","rel.laney.trust":"+1"},"response":["Laney gives him the pageant wave, but it comes half a second late, and for that half second she just stands in the doorway of 412 being told something, with nothing ready to do with her face."],"goto":"s09"},{"text":"Stay in character: Whitney from Atherton blackballs her for wearing pearls before Labor Day.","tag":"Wit","set":{"e2_laney_q":"joke","trait.wit":"+1","rel.laney.warmth":"+1"},"response":["Laney laughs — the laugh you can hear across a party, at nine in the morning, in a cinderblock room. Somewhere down the hall Doug pounds on a wall, not necessarily theirs. “Whitney,” Laney says, wiping under her eyes without touching the mascara, “is going to *hell*, and I’m going to sit right next to her.”"],"goto":"s09"},{"text":"“Maybe skip the note on Friday.”","tag":"Candor","if":"trait.candor>=2 && e1_met_laney_early","set":{"e2_laney_q":"pills","e2_laney_pills":true,"trait.candor":"+1","rel.laney.trust":"+1","rel.laney.friction":"+1"},"cue":"Laney will remember that.","key":"You told Laney to skip the pill on Friday.","response":["Her smile stays up, bright and level, a neon sign over a place that has closed for the night. Then: “Sugar, you’re sweet.” She pats his cheek twice, not hard. “Don’t do that again.”","She leaves the Tupperware."],"goto":"s09"}]},"s09":{"slug":"TUESDAY · 9:30 AM · SANDOVAL HALL 1","body":["Sandoval Hall 1 is four hundred orange flip-down seats raked toward a stage, poured in 1971 by somebody who believed in concrete. It smells of coffee and sunscreen. Jack comes in at 9:31 and finds row M by finding her.","Lena has her boots up on the seat in front and a highlighter in her teeth. Her canvas tote — OCTAVIA BOOKS · NEW ORLEANS — is on the seat beside her. She watches him come down the row, looks at the tote, and moves it to the floor, which leaves an empty seat between them that is now nobody’s fault. Folded on top of her books is a square of black lace. The 12:10 at St. Brendan’s, he’d bet.",{"if":"e2_lena_jab","text":"“You’re late, Mr. Costigan.” “I was at a sorority.” She lets that go by without a word and uncaps her highlighter.","else":"“You’re late, Youngstown.” “I was at a sorority.” “At nine in the morning?” “It was a practice sorority.”"},"Onstage, Adrian Hale has no notes and no intention of clipping on the wireless mic; he holds it between two fingers like a cigarette and conducts with it. “Socrates,” he says, “barefoot, unwashed, not long from being put to death by his own city for asking exactly this sort of question, meets a young man named Euthyphro, who is so certain what the gods want that he’s turning in his own father for the death of a hired man. And Socrates — nobody’s fool and everybody’s nuisance — asks him one question. Write it down. Some of you will spend your lives running from it.” Four hundred eighteen-year-olds who came for a general-ed requirement go quiet, most of them looking surprised to be doing it. “Is the good loved by the gods because it is good? Or is it good because the gods love it? Plato says ‘pious.’ I’m saying ‘good,’ because none of you know what pious means, and the ones who do are lying.”","Something black lands in the empty seat: Margot Lindqvist, oxblood boots, a manila folder on her knees labeled in block capitals THE COSTIGAN PROBLEM. PHIL 1 is her gen-ed. “I said I’d destroy you,” she says, at a volume that does not acknowledge the lecture. “I’m methodical.” At the top of the first page, in a small sharp hand, are his own words from the fourth-floor lounge at three in the morning. “‘And every father.’ I’ve been thinking about it for two days.” A look over the black frames. “I resent that.”","Lena leans past her and puts out a hand. “Lena. Broussard. Two-seventeen.” Margot shakes it once, like signing for a package. “Margot. Lindqvist. Three-oh-five. You’re the one who made the beans — your roommate told the entire elevator. The whole stairwell smelled like pork fat and the Counter-Reformation.” Her eyes drop to the folded lace and stay there. “You wear a *mantilla*. In 2009. At a public university.” “You wear all black every day of your life,” Lena says pleasantly. “We’re both telling people how to look at us.” “Mine says *don’t*.” “So does mine. Mine just says it in Spanish.” “Lena, I say this with love,” Margot says, flat as a diagnosis: “you’ve internalized a two-thousand-year-old men’s club and you call it a personality.”","Down on the stage Hale has gone after the other horn and is having a wonderful time. “If the good is good because God commands it, then God could command cruelty on Thursday and you’d all be kicking dogs by Friday. Ethics by tantrum. A toddler with thunderbolts, and the lot of you obliged to call him Father.” Four hundred people laugh. Jack feels it go through the hall like a draft, and past him, and on the far side of Margot, Lena has stopped highlighting.",{"if":"e2_hale_jab","text":"Between horns Hale lifts a coffee mug toward row M without breaking stride. “Mr. Costigan. I’m told I’m good company. Both of me.” Four hundred people laugh without knowing why. Jack knows why."},"She leans across Margot and whispers, fierce, as if the three of them were in a pew and the homily had gone wrong. “It’s a false choice, and he knows it. The good isn’t a rule God has to obey, and it isn’t something He makes up on a Thursday. It’s what He *is*. The commands come out of His nature like light off the sun. Aquinas, first part, question six. Neither horn.” Jack had the same answer half built in his head. She has built it, painted it and moved in.","Margot does not whisper. “Fine. The good is God’s nature. Lovely. And who tells you what God’s nature requires? Men. In Rome. In very good hats. So in practice your third horn is held by a hierarchy that won’t let a woman anywhere near the microphone.” A nod at the stage, where a man is waving one around. “You didn’t escape Euthyphro. You outsourced him.”","Lena opens her mouth, and closes it. Jack has known her since Saturday and has never seen that. She’ll have an answer by tomorrow — a long one, with citations — but she doesn’t have it now, and from her face she knows it.","Margot writes something in the folder and underlines it twice. “You’re useful idiots for Christian nationalism. Both of you. Goldberg, *Kingdom Coming*, 2006 — look it up.” She caps the pen. “It’s actually sweet.” “Margot, I’m a registered Democrat,” Lena says. “My daddy has voted for Mary Landrieu three times and would vote for her dog. The death penalty makes me physically ill. Find yourself a different idiot.” Margot doesn’t look up. “Then you’re a useful idiot for two parties. That’s worse.”"],"journal":[{"kind":"person","id":"margot","title":"Margot Lindqvist","text":"Margot Lindqvist. Has a folder on me. Called Lena and me useful idiots for Christian nationalism in front of four hundred people. Made a point about the Euthyphro I still can’t answer. Possibly my friend."}],"choices":[{"text":"Side with Lena: “The Church made a dyer’s daughter from Siena a Doctor of the Church. She told a pope to go back to Rome, and he went. Try again.”","tag":"Candor","set":{"e2_margot_side":"lena","trait.candor":"+1","rel.lena.warmth":"+1","rel.margot.friction":"+1"},"response":["“Catherine of Siena starved herself to death at thirty-three,” Margot says without looking up. “Rudolph Bell, *Holy Anorexia*, 1985. Your exemplar is an eating disorder with a feast day.”","Lena turns in her seat with her whole body, thrilled to be fighting on two fronts before ten in the morning. “Bynum. *Holy Feast and Holy Fast*, 1987. She took Bell apart. Those women fasted to take hold of the one thing nobody else could touch, and Catherine used it to boss a pope. Your feminist reading is the one a man wrote, Margot.” Margot’s pen stops. Then she writes *Bynum* in the folder and underlines it, and Lena says, “Oh, *Margot*,” delighted, like a cousin at a wedding who has finally found somebody worth fighting. Jack sits between their elbows and watches a friendship begin in the form of a war."],"goto":"s10"},{"text":"Give Margot the point she earned: “That’s a real problem. I don’t have an answer this morning.”","tag":"Sincerity","set":{"e2_margot_side":"margot","trait.sincerity":"+1","rel.margot.trust":"+1","rel.lena.friction":"+1"},"response":[{"if":"!e2_lena_jab","text":"“*Traitor*,” Lena hisses across the folder — and from the way she says it, she’s pleased. He has the distinct impression there is red ink in his future and she is looking forward to spending it.","else":"“Noted,” Lena says across the folder, clipped, and goes back to her highlighter."},"Margot writes something down. Then for a second she just sits there with the pen above the page, as though she’d brought an argument for a different answer."],"goto":"s10"},{"text":"Defuse it: “Can we be useful idiots for something with better snacks?”","tag":"Wit","set":{"e2_margot_side":"joke","trait.wit":"+1","rel.margot.warmth":"+1"},"response":["“You’re a useful idiot *twice*,” Margot says. “Once for the patriarchy and once for comic relief.” She writes that down too.","From the stage, without looking up, Hale says into the mic, “The three of you in row M will stop flirting or start charging admission,” and four hundred heads turn around."],"goto":"s10"}]},"s10":{"slug":"TUESDAY · 6:50 PM · THE ANCHOR, MARISOL HARBOR","music":"Otis Redding — “(Sittin’ On) The Dock of the Bay”","body":["The 11 bus runs down Mission to the water, and Jack rides it with a résumé on his knee, printed on the good paper he bought for college applications: Cardinal Mooney ’09. Latin Club. Point guard. *Summer: St. Brigid’s grounds crew.* Under SKILLS, after a long war with himself, *Hardworking.* He would like to die.","The harbor at seven is sea lions barking off the floats like a bad night at the union hall, diesel and frying oil, the sun going down orange behind the breakwater. Inside the Anchor somebody feeds the jukebox a quarter and Otis Redding is sitting on the dock of the bay, which down here is less a song than a job description.","The chalkboard by the register says PIE OF THE DAY: BOYSENBERRY. Beside it hangs a second board, new, the chalk still bright: JACK’S RATINGS: MARIONBERRY 4/10. Gloria is counting the drawer, pencil through the gray bun, and doesn’t look up. “Four out of ten. Your redhead friend said your name was Jack and you were leaving. Then you left. After her.” The drawer shuts. “What do you want, Jack?” He puts the résumé on the counter. She doesn’t look at that either."],"choices":[{"text":"“I need the money.”","tag":"Candor","set":{"e2_anchor_ask":"money","trait.candor":"+1","soul.honesty":"+1"},"response":["That gets her to look up — a long gray look at the hair that needs cutting and the good paper and the plain fact of him standing there saying it. “Plain,” she says, as if it were the name of a pie.","“Four out of ten?” She slides the résumé back to him unread. “Hon, you’re hired. Dishwasher quit at six. Apron’s on the hook.”"],"goto":"s10b"},{"text":"“I’m your quality control.”","tag":"Charm","set":{"e2_anchor_ask":"qc","trait.charm":"+1"},"response":["“I’ve heard better lines from men who smelled like bait,” Gloria says, still counting. “I married one.”","“Four out of ten?” She slides the résumé back to him unread. “Hon, you’re hired. Dishwasher quit at six. Apron’s on the hook.”"],"goto":"s10b"},{"text":"“I’ve seen your marionberry. You need me.”","tag":"Wit","set":{"e2_anchor_ask":"marionberry","trait.wit":"+1"},"response":["Gloria very nearly smiles. It gets as far as the pencil: out of the bun, a look at the point, back in.","“Four out of ten?” She slides the résumé back to him unread. “Hon, you’re hired. Dishwasher quit at six. Apron’s on the hook.”"],"goto":"s10b"}]},"s10b":{"slug":"TUESDAY · 9:40 PM · THE ANCHOR, KITCHEN","body":["Eight dollars an hour, Tuesdays, Thursdays and Saturdays, seven to one, a share of tips. Saturdays start the twelfth, Gloria said, already walking away: this weekend her nephew Hector is home from Fresno State, “and he owes me.”","By 9:40 the dish pit has taught Jack everything it knows, which is steam. The Hobart is a steel box with a hood that drops like a guillotine and a cycle that shakes the duckboards under his shoes; the spray nozzle bucks on its spring over the slop sink like something alive; his fingers have pruned to the second knuckle. Through the pass-through, from the jukebox, Patsy Cline is heartbroken in a key the Hobart keeps interrupting.","The man on the line said “Rudy” at seven and offered a wrist instead of a greasy hand. He’s somewhere in his forties and does everything slowly, which turns out not to be the same as slow: three tickets on the flattop at once and none of them burning. A rosary is tattooed around his left wrist, the beads gone soft and blue. A transistor over the grill has a ballgame on low, and a Louis L’Amour — *Flint*, its spine mended with masking tape — rides in Rudy’s apron pocket. He introduced the machine before anything else — “Hobart. Older than you, meaner than Gloria” — and by the second rack Jack was *mijo*.","Gloria sweeps through with an armload of plates, sets them in Jack’s window, and says to Rudy, as though Jack were something in the pie case: “Lattice-top. Pretty on top. Everything’s leaking underneath.” Rudy considers him over the grill. “Hm.” “I’m standing right here,” Jack says. “I know where you’re standing, hon,” Gloria says, leaving. “I hired you.”","He loads the next rack wrong. Rudy leans over without a word, turns two plates with two fingers so the water can get at them, and goes back to his burgers. “First time I washed dishes was at Soledad,” he says, the way you’d say where you went to high school. “Six years. Best job in the building — it’s warm, and nobody bothers the dish man.” He flips a patty. Nothing in his face asks Jack to do anything with that. Nothing in it is hiding, either."],"journal":[{"kind":"person","id":"rudy","title":"Rudy (the Anchor)","text":"Line cook. Rosary on his wrist, a ballgame on the radio, Louis L’Amour in his apron. Did six years at Soledad. Says the dish pit is the best job in any building."},{"kind":"person","id":"gloria","title":"Gloria (the Anchor)","text":"Hired me for rating her pie a four. Rated me a lattice-top. I’m not going to ask."},{"kind":"note","id":"pie","title":"The Anchor","text":"Marionberry: 4/10 (now on a board by the register). I work here now. Tue/Thu/Sat, seven to one, $8 an hour."}],"choices":[{"text":"“Who stuck by you? After?”","tag":"Sincerity","set":{"e2_rudy_q":"visit","e2_rudy_visit":true,"trait.sincerity":"+1"},"response":["Rudy flips a burger without looking at it. “My mother. Every other Sunday for six years. Three buses from Oxnard, to sit across a table bolted to the floor.”","Jack turns the spray on the next rack harder than any rack has ever needed. Water drums off the plates onto his apron and his shoes and the rubber mat. Out of the corner of his eye he sees Rudy look at the rack, and then at him, and then back down at the grill. Rudy doesn’t say anything. On the radio somebody gets a hit, and the crowd sounds like it’s a beautiful night for baseball, and somewhere it probably is."],"goto":"s10c"},{"text":"“So I’m in good company.”","tag":"Wit","set":{"e2_rudy_q":"company","trait.wit":"+1"},"response":["Rudy laughs from somewhere low down, like it had to climb a ladder to get out. “Best company in California, mijo. Ask Gloria.” From the floor, without breaking stride: “*Don’t* ask Gloria.”"],"goto":"s10c"},{"text":"Say nothing. Work.","tag":"Control","set":{"e2_rudy_q":"silent","trait.control":"+1"},"response":["Jack says nothing and works: two hours of racks and steam and the slop sink, which he will not describe to anyone as long as he lives. At eleven a grilled cheese comes across the pass on a plate he washed himself, cut corner to corner, unasked for. “You’ll do,” Rudy says, and turns the radio up a notch."],"goto":"s10c"}]},"s10c":{"slug":"WEDNESDAY · 1:15 AM · THE ANCHOR, THE WHARF","set":{"e2_has_bike":true},"body":["He comes out the back door at 1:15 smelling of Hobart steam and boysenberry, his hands white and ridged as a washboard, eleven dollars of tip-share folded in his jeans, and reads the schedule in the bus shelter twice. The last 11 left at 12:30. Under the planks the sea lions are still arguing.","A rusted single-speed beach cruiser comes ticking up the wharf out of the dark, a dented wire basket on the front. Its rider is sun-dark and salt-haired, with a laundry bag over one shoulder and a skateboard strapped to the bag, and Jack knows him before he knows from where: the other end of Saturday’s mini-fridge.","“Boss.” One flip-flop comes down. “Bus quit at twelve-thirty. Nobody told you?” “Nobody told me.” “Nobody tells anybody. Rafi. Two-oh-four. I had you as fridge guy.” “Jack.” Rafi is on his way to his dad’s place, two blocks up, to do laundry — “dorm machines eat quarters and socks; my dad’s only eat socks.”","He takes in Jack’s pruned hands, gets off the bike and holds it out by the handlebars. “Take her. Till Christmas.” Jack starts to say he can’t. Rafi talks over him, courteous and final. “She’s called La Flaca. Not stolen. Abandoned. My abuela says there’s about a week’s difference.” Coaster brakes — pedal backward; he demonstrates — and a seat that tilts like a barber’s chair. Then he drops the skateboard on the planks and rolls off up the wharf, wheels rumbling over the boards. “No stress, boss,” floats back: the same thing he said on Saturday over the fridge.","So Jack rides three miles home along the harbor road on a bicycle named for being skinny. The water is on his left, black and breathing, and the moon hangs over it three nights short of full, lopsided and bright enough to throw his shadow across the road beside him, a long thin Jack on a long thin bike. The chain clanks. The basket rattles at every seam in the asphalt. Nobody is asking him to prove anything — not his soul, not his pie, not his margins — and at the Grove he stands on the pedals up the last hill and comes down the far side with his feet off them, the way he used to come down Glenwood Avenue at eleven, all the way to the bottom, not braking once."],"journal":[{"kind":"note","id":"la_flaca","title":"La Flaca","text":"Rafi’s bike, lent till Christmas. Not stolen. Abandoned. (A week’s difference, per his abuela.)"},{"kind":"person","id":"rafi","title":"Rafi (204)","text":"Second floor. Carried my fridge up four flights on Saturday and was gone before Dad could tip him. Calls everybody boss. Lent me his bike on the wharf at one in the morning like it was nothing."}],"next":"s11"},"s11":{"slug":"WEDNESDAY · 6:15 PM · DELGADO HALL, EAST STAIRWELL, 4TH FLOOR LANDING","body":["The padded envelope in his mailbox is Priority Mail, postmarked Monday, in his mother’s careful Palmer loops. Inside, between two pieces of shirt cardboard: Rosie. Jack in crayon on a yellow beach under a palm tree the size of a skyscraper. Beside him Hannah Montana, in a bikini drawn with great modesty — it reaches her knees and has sleeves. In th
