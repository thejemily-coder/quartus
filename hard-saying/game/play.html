 his face.","else":"She settles the mantilla over her arm. “What did you yell at Him about at halftime?” “The Browns.” “Nobody yells at an empty room, Costigan. Goodnight, Jack.” Then it’s the olive tree and Jack under the courtyard light, scrubbing at his cheekbone with a licked thumb and getting none of the gold off his face."}],"goto":"s04"},{"text":"“Yeah. It helped.”","tag":"Sincerity","set":{"e5_mass":"sincere","trait.sincerity":"+1","soul.grace":"+1","resolve.jack":"+1"},"response":["She looks at him a while under the olive tree. He leaves her room for a joke, and she doesn’t take it. “Good,” she says.",{"if":"e4_walk==\"empty_room\"","text":"She settles the mantilla over her arm. “What did you yell at Him about at halftime?” “The Browns.” “Nobody yells at an empty room, Costigan.” His own line from Ocean Road. “Goodnight, Jack.” Then it’s the olive tree and Jack under the courtyard light, scrubbing at his cheekbone with a licked thumb and getting none of the gold off his face.","else":"She settles the mantilla over her arm. “What did you yell at Him about at halftime?” “The Browns.” “Nobody yells at an empty room, Costigan. Goodnight, Jack.” Then it’s the olive tree and Jack under the courtyard light, scrubbing at his cheekbone with a licked thumb and getting none of the gold off his face."}],"goto":"s04"},{"text":"“Allegedly.”","tag":"Wit","set":{"e5_mass":"wit","trait.wit":"+1"},"response":["“Your grandmother doesn’t think it’s alleged, Costigan. Your grandmother’s called long-distance.”",{"if":"e4_walk==\"empty_room\"","text":"She settles the mantilla over her arm. “What did you yell at Him about at halftime?” “The Browns.” “Nobody yells at an empty room, Costigan.” His own line from Ocean Road. “Goodnight, Jack.” Then it’s the olive tree and Jack under the courtyard light, scrubbing at his cheekbone with a licked thumb and getting none of the gold off his face.","else":"She settles the mantilla over her arm. “What did you yell at Him about at halftime?” “The Browns.” “Nobody yells at an empty room, Costigan. Goodnight, Jack.” Then it’s the olive tree and Jack under the courtyard light, scrubbing at his cheekbone with a licked thumb and getting none of the gold off his face."}],"goto":"s04"}]},"s04":{"slug":"MONDAY · 12:58 PM · HOLLIS 302","duel":"luck","set":{"resolve.lena":7},"body":["The marine layer burned off at eleven, and Hollis 302 has its window back: hard blue sea all the way up the glass, one container ship pinned to the horizon, a pelican going by at desk height. The radiator knocks anyway; Yusuf says it’s load-bearing.","Jack is early, in the navy blazer, with the Williams and the Nagel stapled together out of the course packet and Flannery O’Connor riding in his back pocket. There is gold in his left eyebrow. Theo’s face soap got most of the fleur-de-lis off last night; the rest went down into the scar, a fleck of Sully’s that catches when he turns his head.","Yusuf comes in with his water bottle empty on principle, twenty-four days into the fast, and drops into the chair beside him. Before anything else he says, “He called. Yesterday.” Tariq, from Helmand: four minutes on a line that sounded like it was coming through a box fan. “He complained about the food the whole time. Which means he’s fine. When he says the food’s good, I worry.” “Good,” Jack says, and Yusuf nods at the table like they’ve agreed on a measurement.","At 1:01 Lena comes in from the 12:10 with the mantilla still in her hand, folding it down into the OCTAVIA tote on top of the Greek grammar as she sits across the oak from him. Keds. One strand of gold Sully’s beads still on under the cardigan, against the chain. She settles, and skips hello. “God’s cure for snakebite was to make them look at the snake.” “Good afternoon, Broussard.” “Numbers twenty-one. The bronze serpent on the pole. Father Osei in red — very dramatic, you’d have hated how much you liked it. Where were you?” “Reading Nagel.” She takes her own copy out, flattened and flagged in three colors. “Then you looked at the snake too.”","At 1:07 Hale comes in and sets down the roster and nothing else. The linen jacket, and the wine is back on the cuff; whatever happened to last Wednesday’s clean sleeve, it didn’t last the weekend. He stands at the sea window with his hands in his pockets, and there’s a color in his face that isn’t only the broken veins — a man walking into his own house.","“Week three,” he says. “Williams, ‘Moral Luck.’ Nagel, ‘Moral Luck.’ Two very clever men and one very good title between them.” Caleb, who has the Post-its out already and is glowing like a kid in the front pew, can’t hold it. “He wrote his doctorate on this.” “Under the long shadow of a better man,” Hale says, not turning around. “Mr. Hargrove has read my jacket copy.” Caleb glows anyway.",{"if":"e4_seminar==\"same\"","text":"Then Hale does turn, and finds Jack. “Last week Mr. Costigan informed us that you don’t get out of a thing by forgetting it. This week we find out whether you can get *into* one by accident.” He lets the room wait for it. “Two men drive home from the same party. Only one of them hits anybody.”","else":"Then Hale does turn, and finds Jack. “Last week we asked whether you get out of a thing by forgetting it. This week we find out whether you can get *into* one by accident.” He lets the room wait for it. “Two men drive home from the same party. Only one of them hits anybody.”"},"He gives them the rest of it slowly. The same party. The same number of drinks — four, let’s say; large men, long party. The same road home, the same bend in it, the same dark, the same bad half-second where the wheel goes soft in the hands. In front of the first car there is nothing but road. In front of the second car a child runs out after a ball. “Same men,” Hale says. “Same choices. Same everything, up to a small boy and a red ball, which neither of them ordered. Is the second man worse?”","Jack has the Nagel open to the paragraph and doesn’t need it.","Caleb goes first, because he always goes first. “It’s luck all the way down. Time and chance happeneth to them all. Neither of them’s anything. *Selah*.” Yusuf lifts his head off his arms. “In Islam there’s a word for this,” he says. “*Diya*. You kill somebody by mistake, you owe the family. Blood money. And if you can’t pay it, you fast two months straight.” He considers the empty bottle. “So the second driver owes something the first one doesn’t. I’m on month one by accident.” The table laughs. Yusuf glances down the oak at Jack — the same look he gave him across the lounge on Wednesday night, over *in that room* — and puts his head back down on his arms.","Lena doesn’t raise her hand; she never has. “The same,” she says. “Same sin. Same will, same act, same four drinks. The child is the second man’s grief. It isn’t his sin.”","“Mr. Costigan,” Hale says, “you’re making a face.”","“He’s worse.” He hears the weight on it only once it’s across the table — harder than anything he decided to say, hard enough that the chemistry kid looks up from the highlighter. Lena’s eyes come to him and hold.","Hale looks from one of them to the other, and the pleasure on him is undisguised. “Designated antagonists,” he says. “Ten minutes a round. Win me something.”"],"next":"s05a"},"s05a":{"slug":"MONDAY · 1:24 PM · HOLLIS 302","duel":"luck","set":{"duel.luck.lena":1},"body":["She pushes her sleeves up. Both of them, to the elbow, one and then the other.","“Kant,” Lena says, “and I want it in the minutes that I hate agreeing with a Prussian. Even if a stepmotherly nature leaves the good will nothing to work with — even if it never gets a single thing done — *like a jewel, it would still shine by itself, as something that has its full worth in itself*.” She turns a page she doesn’t need to look at. “And if y’all prefer a Dominican: an act gets its moral species from its object, its end and its circumstances. *Prima secundae*, question eighteen. Not from what a four-year-old does next. The second man’s will is exactly as rotten as the first man’s will. Nothing that runs into the road changes what he chose at the bar.” She looks down the oak, past Jack, to Hale. “If a gust of wind can make you a murderer, Professor, then ‘murderer’ is a weather report.”","Caleb says “*Dude*” under his breath, reverently. Hale makes a small mark on the roster.","Jack has the Nagel open and doesn’t look at it. She’s right about the will. He’s known it since her first sentence, and it doesn’t help: the second man still has to drive home past the place where it happened, every day, for the rest of his life, and the first man doesn’t."],"choices":[{"text":"Every legal system ever gives the second driver years and the first one a fine. All of them wrong?","tag":"Press","set":{"duel.luck.rigor":"+1","rel.lena.friction":"+1"},"response":["“Hammurabi. Rome. Ohio,” Jack says. “Nobody’s ever been charged with vehicular almost. All of them wrong?”","“All of them *afraid*,” she says, and then — he watches her decide to pay for it — she grants it. The law has to count bodies. It can’t see wills; it only sees what’s lying in the road. “So it punishes what it can find. Put that down as the law’s confession, Costigan, and leave the man out of it.” Behind her Hale uncaps a marker, writes LAW on the whiteboard in letters a foot high, and underlines it twice.","“The man’s the only one in the road,” Jack says. “Nobody in Youngstown ever got sentenced for his will, Broussard. They sentence what he did.” Something crosses her face at *sentenced* and is gone, and she takes the point standing up."],"goto":"s05b"},{"text":"“In Youngstown ‘murderer’ is a weather report. Lake-effect.”","tag":"Riposte","set":{"duel.luck.wit":"+1","rel.lena.warmth":"+1"},"response":["The table goes up. The San Diego boys laugh in harmony; Yusuf laughs into his sleeve. Lena laughs too, out loud and without apology, and keeps her jewel exactly where it was. “Cute,” she says. “Hold that thought, put a coat on it. Then move, Costigan.” “I am moving. Your jewel’s got no light switch, Broussard. Nobody can see it shine.” “God can,” she says. “He’s the only audience Kant ever needed, and Kant would hate that too.”"],"goto":"s05b"},{"text":"“I’ll give you the act. Same act.”","tag":"Concede","set":{"duel.luck.heart":"+1","rel.lena.warmth":"+1"},"response":["She wasn’t ready for it. She had the next thing ready — he can see her put it away — and she takes what he’s given her without a flourish. “Well,” she says. “Look at you.” Then, because she can’t entirely help herself: “The act was always mine.”"],"goto":"s05b"},{"text":"Williams’s lorry driver. Ask him if he feels like a bystander.","tag":"Reframe","set":{"duel.luck.rigor":"+1","rel.hale.warmth":"+1"},"response":["“Williams,” Jack says. “Ask the lorry driver if he feels like a bystander. He doesn’t, and he shouldn’t. The driver who runs over a kid through no fault of his own feels different from anybody standing on the curb, even the guy in the passenger seat, and Williams says something would be wrong with him if he didn’t. He had his hands on the wheel. That’s a fact about him.”","Hale turns from the window, pleased against his will and not bothering to hide it. “*Agent-regret*. He’s read the footnotes.” Lena: “Regret isn’t guilt.” Jack: “Tell the lorry driver.”"],"goto":"s05b"}]},"s05b":{"slug":"MONDAY · 1:36 PM · HOLLIS 302","duel":"luck","body":["Round two she brings Thomas, and she brings him from memory. “*Prima secundae*, question twenty, article five,” she says. “Whether the consequences of an act add to its goodness or its malice.” Her pen taps the oak once per clause. “If they’re foreseen, yes. If they aren’t foreseen — then only if they follow from the act of itself, and in most cases. What follows by accident, and seldom, adds nothing. Not a feather.” She folds her hands. “The child is *per accidens*, Professor.”","Hale, from the window, without turning: “And the drunk who gets home safe? Thomas lets him off?” “Thomas convicts him on the spot,” Lena says. “Same sin, same weight, the minute he takes the keys. The will was bad when he chose it. That’s my whole case, Professor: nobody gets luckier into heaven and nobody gets unluckier into hell. You get there by what you chose.” Her pen taps once more, for the period.","Hale turns his head and raises his eyebrows at Jack: *well?*"],"choices":[{"text":"Read the rest: *per se and in most cases*. It’s what drunk cars do.","tag":"Press","set":{"duel.luck.rigor":"+1","rel.lena.friction":"+1","duel.luck.lena":"+1"},"response":["“*Ut in pluribus*,” Jack says. “A drunk car hitting somebody isn’t an accident. It’s what drunk cars do. Four drinks and a dark bend — you don’t get to call that *seldom*, Broussard. Ask anybody who drives Market Street on a Friday.”","Her eyebrows go up — the best Thomist move he’s made all season, and from the Augustinian side of the table — and for a second she looks like she might actually applaud. Then she turns it around in her hands. “Then the first driver’s a murderer who got lucky.”","“Then he is,” Jack says. “And he ought to lose some sleep over it.”"],"goto":"s05c"},{"text":"“Aquinas never drove Market Street at closing time.”","tag":"Riposte","set":{"duel.luck.wit":"+1","duel.luck.lena":"+1"},"response":["A laugh around the table, and she rides it. “Aquinas walked from Naples to Paris, Costigan. On foot. In a habit. More than once. He was a big man, and nobody ever offered him a lift.” She waits for the second laugh and gets it. “He knew what roads do to people.”"],"goto":"s05c"},{"text":"“Miss Broussard walks out of things. Songs. Diners. Maybe if you’re not in the room, it didn’t happen.”","if":"e4_followed==\"now\"","tag":"Personal","cue":"Lena will remember that.","set":{"duel.luck.rigor":"+1","rel.lena.trust":"-2","rel.lena.friction":"+2","resolve.lena":"-1","trait.reckless":"+1","e5_duel_personal":true,"resolve.jack":"-1"},"key":"In Hale’s seminar you told Lena she walks out of things.","response":["It wins the point. He knows it as it leaves him: it’s the kind of sentence that wins rooms. Hale laughs — one bark, delighted with nobody but himself — and says, “Oh, there it is. Somebody’s been keeping notes,” and half the table looks at Lena, because all of them were here the first Monday, when Hale told them about the Anchor.","Lena squares the pages of the Williams against the oak, so the edges agree. Then she squares them again. They already agree. She keeps squaring them. “That’s a fair hit, Mr. Costigan,” she says, very pleasantly, without looking up from the stack."],"goto":"s05c"},{"text":"“He didn’t choose the kid.”","tag":"Concede","set":{"duel.luck.heart":"+1","rel.lena.warmth":"+1"},"response":["She leaves his concession where he put it and takes nothing extra off the table on the way past. “He chose the four drinks,” she says. “That’s all he owns. Not the dark, not the bend, not the ball.” A breath. “No. He didn’t choose the kid. Neither did the kid.”"],"goto":"s05c"}]},"s05c":{"slug":"MONDAY · 1:49 PM · HOLLIS 302","duel":"luck","body":["Then she stops.","Not the round — she’s still in the round. But the pen goes down on the table, and her sleeves come down to her wrists, and her hand goes up to the medal and holds it, the thin gold oval worn soft between her finger and thumb. She’s looking at him. Not at Hale, not at the table.",{"if":"e5_duel_personal && !e5_apologized","text":"“Then what does he owe, Mr. Costigan?” The formal name stays on, and everything else about the question is gentler than anything she’s said all hour. “If he’s worse. What does he owe, and to whom, and for how long?”","else":"“Then what does he owe, Costigan?” Quieter. The theater gone out of it. “If he’s worse. What does he owe, and to whom, and for how long?”"},"Caleb’s pen stops over his Post-it. Somewhere down the hall a door shuts, and the whole table hears it."],"choices":[{"text":"“Everything. He stands up and says ‘I did that.’ Nobody takes it for him.”","tag":"Press","set":{"duel.luck.rigor":"+1","e5_ferocity":true,"resolve.jack":"-1","soul.honesty":"+1","trait.candor":"+1"},"key":"You said the unlucky driver owes everything — that nobody gets to take it for him.","response":["He says it to her and it goes to the whole room. He means every word, and he puts every word of it down on the oak one at a time, brick on brick: he stands up, he says *I did that*, he doesn’t get to go home, nobody — nobody — gets to take it for him.","Nobody laughs. Caleb has stopped writing altogether. Lena’s hand is still at her collar; the point goes past her untouched, and after a moment she looks down at her own pages. Hale has turned all the way around from the window. He looks at Jack without any wit in his face at all, the way he looked at the sea window the first afternoon. Jack finds his palms flat on the oak, pressing, and makes himself lift them."],"goto":"s05d"},{"text":"“He owes the mother the truth. The rest isn’t his to pay.”","tag":"Concede","set":{"duel.luck.heart":"+2","rel.lena.trust":"+1","e5_luck_mercy":true,"rel.lena.warmth":"+1"},"key":"You said the driver owes the child’s mother the truth — and the rest isn’t his to pay.","response":["He gives it to her plainly, no flourish. Lena lets go of the medal. She looks at him across the oak, and keeps looking. At the window Hale says, “Hm,” and makes no mark at all.","“That’s the first thing you’ve said all hour I believe,” she says."],"goto":"s05d","cue":"Lena will remember that."},{"text":"“Five to ten. Less with good behavior.”","tag":"Riposte","set":{"duel.luck.wit":"+1","rel.lena.warmth":"-1","duel.luck.lena":"+1"},"key":"You answered Lena’s question with a sentencing joke.","response":["The room laughs — the San Diego boys, the Palo Alto girl, Caleb slapping the oak — and it’s a good laugh; it’s timed. Lena lets go of the medal and says, to the table and not to him, “The child doesn’t get good behavior.”","The laugh runs on around her for a while and runs out, and when it has run out she is still looking at him, and he would give a good deal to have the sentence back in his mouth."],"goto":"s05d"},{"text":"The Misfit: it never fits. He pays anyway.","if":"trait.wit>=14","tag":"Reframe","set":{"duel.luck.rigor":"+1","trait.wit":"+1","rel.lena.friction":"+1"},"key":"You answered Lena with the Misfit: it never fits, and he pays anyway.","response":["He has it by heart; it’s been riding in his back pocket since Sunday morning. “*I call myself The Misfit because I can’t make what all I done wrong fit what all I gone through in punishment.*” He sets the paperback on the oak. “It never fits. Not for anybody. Too much or too little. He pays anyway, because paying is the only thing he can still do with his hands.”","Hale puts a hand over his eyes. “Flannery O’Connor,” he says, “in my seminar. Someone open a window.” One of the San Diego boys actually gets up and does it, and the room fills with the sound of the surf and the smell of kelp and somebody’s mower down on the Commons.","Lena lets go of the medal. “The Misfit shoots a grandmother,” she says quietly. “Pick a better saint.”"],"goto":"s05d"}]},"s05d":{"slug":"MONDAY · 2:03 PM · HOLLIS 302","duel":"luck","set":{"duel.luck.lena":"+1"},"body":["Her last move, and the sleeves go back up. She puts both hands flat on her pages and leans into it, and her voice gets that long Gulf roll it gets when she’s building to the end of something.","“Y’all keep saying *luck* like it’s a thing in the world — a fifth guest at the party, with a chair and a name card.” She looks at Caleb, kindly, and then at Hale, not. “There’s no luck, Professor. There’s providence, and there’s mercy, and both drivers need the second one.”","It should be the end of the round. It isn’t, because Hale isn’t refereeing anymore. He comes off the window and stands at the head of the table with his fingertips on the oak, and when he speaks it is very soft and very clear, every consonant cut.","“Forgiven by whom, Miss Broussard? The child is dead. The only one with standing to forgive is the one who can’t.”","The radiator knocks. Lena’s face doesn’t move. Only the color does, high on her cheekbones, and Jack has seen that once before, at the end of the harbor pier, when she said *four days*.","“That’s why it has to be God, Professor,” she says. “He’s the only one who can speak for the dead.”","Hale doesn’t answer. He looks past her, out the sea window, at the ship that hasn’t moved and the water that hasn’t stopped, and the room waits for him, and he goes on looking. Then, without turning his head: “Mr. Costigan. Last word.”"],"choices":[{"text":"“Then why’d He let the kid run out?”","tag":"Press","set":{"duel.luck.rigor":"+1","rel.lena.friction":"+1"},"response":["“If He’s providence,” Jack says, “He was on that road. Able and not willing, or willing and not able. Pick one.” It’s Hale’s own Tuesday, Epicurus by way of Hume, handed back to him with the bow still on it, and Hale’s mouth moves at one corner.","“Ask Job,” Lena says. “I already beat you with him once, on Ocean Road, and he hasn’t changed his story.” And she gives him the whirlwind like she’s reading it off the inside of her eyelids: “*Where were you when I laid the foundations of the earth? Have you commanded the morning since your days began?*”","“Job got an answer,” Jack says. “The kid’s mother gets a whirlwind.” “She gets the same one Job got,” Lena says. “It’s the only one there is.” She sits back."],"goto":"s05v"},{"text":"“Both need it. Yeah.”","tag":"Concede","set":{"duel.luck.heart":"+1","rel.lena.warmth":"+1"},"response":["She nods once — the nod she gives the end of the Creed, *and the life of the world to come*, settled. Caleb looks back and forth between them as if he’s walked in on a family. Yusuf murmurs, “Factor of safety,” and nobody asks him what he means. Lena says “Amen” to it anyway."],"goto":"s05v"},{"text":"“Then the lucky one owes God a thank-you note.”","tag":"Riposte","set":{"duel.luck.wit":"+1"},"response":["Yusuf, from inside his folded arms: “Certified mail. Return receipt requested.” The table breaks up, and even Hale’s shoulders move once. Lena waits it out without giving an inch. “He owes Him a *life*,” she says. “The note’s extra.”"],"goto":"s05v"},{"text":"“Is your God the theologian — or the one who pays?”","tag":"Reframe","set":{"duel.luck.rigor":"+1","rel.lena.friction":"+1"},"response":["“Last Tuesday,” Jack says, “in Sandoval, the Professor told four hundred people the problem of evil is a bill, and it’s never the theologian who pays it. So which is your God, Broussard? The theologian or the one who pays?”","Hale turns from the window to watch her answer. She doesn’t need long. “He’s the one who pays,” she says. “You wrote it. Page one.” She doesn’t have to look it up. She’s the one who bled on it."],"goto":"s05v"}]},"s05v":{"slug":"MONDAY · 2:24 PM · HOLLIS 302","duel":"luck","body":[{"if":"!e5_duel_personal && duel.luck.rigor>=3","text":"Hale gives it to Jack, and makes a production of it. “Mr. Costigan has dragged Thomas Aquinas onto Market Street by his habit.” Caleb claps, three times, alone. Three–one on the season, if anybody’s counting, and Jack is. Across the oak Lena packs her pages into the tote without hurrying, and as she stands she says, low, just for him, “You argued that like it was yours.”"},{"if":"!e5_duel_personal && duel.luck.rigor>=3 && e5_luck_mercy","text":"He gave her the mother first. The rest of the hour he took off her by force, but not that one, and she slides her chair in without a sound."},{"if":"!e5_duel_personal && duel.luck.heart>=3 && e5_luck_mercy","text":"There’s no winner. Hale tries to give it to Lena on the last move, and Lena won’t take it. “No,” she says. “He gave me the mother. That was the right one to give me.” Hale throws up his hands. “Two Catholics agreeing about mercy. I’ve lost the room.” Two–one on the season, and a draw, and it feels like more than either."},{"if":"!e5_duel_personal && duel.luck.heart>=3 && !e5_luck_mercy","text":"There’s no winner. Hale tries to give it to Lena on the last move, and Lena won’t take it. “No,” she says. “He gave me every point I was owed and one I wasn’t. I’m not taking a round off that.” Hale throws up his hands. “Two Catholics agreeing about mercy. I’ve lost the room.” Two–one on the season, and a draw, and it feels like more than either."},{"if":"!e5_duel_personal && duel.luck.rigor<=2 && duel.luck.heart<=2 && duel.luck.wit>=2","text":"The room had a lovely time. Caleb is still laughing at something from round two. Hale declines to score it at all. “That wasn’t a disputation,” he says. “That was a revue. I’ll send you both a bill for the hall.” No decision; two–one on the season, still. Lena caps her pen and gives Jack a look that says *next Monday*."},{"if":"!e5_duel_personal && duel.luck.rigor<=2 && duel.luck.heart<=2 && duel.luck.wit<=1","text":"Hale doesn’t make them wait. “Miss Broussard,” he says, “by a weather report.” Lena accepts it with a small nod, no fuss. Two–two on the season. She packs up humming “When the Saints Go Marching In,” under her breath, in the wrong key on purpose."},{"if":"e5_duel_personal","text":"Hale gives it to Lena. “I enjoyed that more than anything this term,” he says, “and it doesn’t count. A point taken off the person and not the argument goes to the other side. House rules.” Lena takes it, and thanks him, and is courteous to Mr. Costigan in a voice you could chill a bottle in. Two–two on the season, and it doesn’t feel like two of anything. Hale surveys the table with real satisfaction. “Blood on the floor,” he says. “Somebody fetch the spaniel a mop.”"},"“Wednesday,” Hale says to all of them. “Two pages. Prove the thing you least believe you can prove.” He’s back at the window already, his back to the room. Caleb writes it on a Post-it and sticks it to the inside of his *Consolations*. Yusuf says he could prove he’s hungry, and is told that isn’t what the Professor meant.",{"if":"e5_duel_personal","text":"Chairs scrape. The San Diego boys go out arguing about tonight’s Chargers game. Lena is gone before Jack has the Nagel in his bag.","else":"Chairs scrape. The San Diego boys go out arguing about tonight’s Chargers game. Lena goes out ahead, tote on her shoulder, while Jack is still getting the Nagel into his bag."},"The O’Connor has slid under his chair. By the time he’s fished it out, the room is empty except for him and the radiator and the man at the window. Hale hasn’t turned around. His hands are in his pockets, and the wine on the cuff is the color of an old scab in the afternoon light.","“Do you think the lucky one sleeps, Mr. Costigan?”"],"choices":[{"text":"“No.”","tag":"Sincerity","set":{"e5_sleep":"no","rel.hale.warmth":"+1","trait.sincerity":"+1"},"response":["“No,” Jack says.","Hale stands there with it. Down on the water the ship has finally started to move, so slowly you can only tell by the gap behind it. “No,” Hale says, to the glass."],"goto":"s06"},{"text":"“I think he counts trains.”","tag":"Wit","set":{"e5_sleep":"trains","trait.wit":"+1"},"response":["It’s meant as a joke, and it leaves his mouth as something else.","Hale turns around. He looks at Jack over the top of the empty table — the blazer, the paperback, the gold in the eyebrow — and for a moment he looks his age, and then older than that. “Do you,” he says."],"goto":"s06"},{"text":"“Do you?”","tag":"Candor","set":{"e5_sleep":"you","rel.hale.warmth":"+1","rel.hale.friction":"+1","trait.candor":"+1"},"response":["Hale laughs, short and real. “Like a baby, as the senator said, Mr. Costigan. Up every two hours, crying.”","He doesn’t turn around. He lifts one hand off his pocket and moves it, a small Oxford flick toward the door, a waiter dismissed with affection. Jack goes."],"goto":"s06"}],"journal":[{"kind":"note","id":"record","title":"Duels with Lena","if":"!e5_duel_personal && duel.luck.rigor>=3","text":"Two–one after Labor Day; she paid her Sunday. Now three–one. Moral luck: mine. She said I argued it like it was mine."},{"kind":"note","id":"record","title":"Duels with Lena","if":"!e5_duel_personal && duel.luck.heart>=3","text":"Two–one after Labor Day; she paid her Sunday. Moral luck: a draw. I gave her the right points. She wouldn’t take the round."},{"kind":"note","id":"record","title":"Duels with Lena","if":"!e5_duel_personal && duel.luck.rigor<=2 && duel.luck.heart<=2 && duel.luck.wit>=2","text":"Two–one after Labor Day; she paid her Sunday. Moral luck: no decision. Hale called it a revue."},{"kind":"note","id":"record","title":"Duels with Lena","if":"!e5_duel_personal && duel.luck.rigor<=2 && duel.luck.heart<=2 && duel.luck.wit<=1","text":"Two–one after Labor Day; she paid her Sunday. Now two–two. Moral luck: hers, by a weather report."},{"kind":"note","id":"record","title":"Duels with Lena","if":"e5_duel_personal","text":"Two–one after Labor Day; she paid her Sunday. Now two–two. Moral luck: hers. I won a point I shouldn’t have, and Hale gave it to her."},{"kind":"person","id":"hale","title":"Prof. Adrian Hale","text":"Wrote *The Consolations of Disbelief*. Wrote me a postcard. Walked into Hollis 302 at 1:07 with wine on his cuff and asked us to prove we have souls. Saw my face at the Anchor before he could put it to the nine pages. Called me a spaniel. Some nights he drinks alone in the Anchor’s back booth after midnight and says Housman to the window. Tips like he’s apologizing. Wrote his doctorate on moral luck. Asked me if the lucky one sleeps."}]},"s06":{"slug":"MONDAY · 2:31 PM · HOLLIS HALL, THE CLOISTER WALK","body":["The Hollis cloister is all red tile and shadow and bougainvillea, the magenta kind with the paper petals, drifting onto the walk and lying there like confetti after somebody else’s wedding. Up on Ferrer Tower the carillon is finishing the half hour, off-key, the Westminster chimes with one bell flat for as long as anyone at Marisol can remember. The stone gives back the heat of the day.",{"if":"!e5_duel_personal","text":"Lena has waited. She’s at the far end of the walk, under the last arch, the tote on one shoulder and one Ked up on the base of a pillar, and she watches him come the whole length of it.","else":"Lena hasn’t waited. She’s ahead of him, walking fast in the Keds, and he has to lengthen his stride to catch her halfway down the walk. She lets him catch her, and keeps her pace."},{"if":"e5_duel_personal","text":"“You argued that like it was yours, Mr. Costigan,” she says, as if she were reading it off a form."},{"if":"!e5_duel_personal && duel.luck.rigor>=3","text":"“I meant it,” she says, first. “In there. That wasn’t a seminar answer, Costigan.”"},{"if":"!e5_duel_personal && duel.luck.rigor<=2 && duel.luck.heart<=2","text":"“You argued that like it was yours,” she says, first."},{"if":"!e5_duel_personal && duel.luck.heart>=3 && e5_luck_mercy","text":"“You gave me the mother,” she says, first. Then, because the cloister is empty and it’s true: “I wasn’t arguing for the driver in there, Costigan. I was arguing for everybody I love who’s ever going to need the second one.” She looks at him from under the arch. “What were you arguing for?”"},{"if":"!e5_duel_personal && duel.luck.heart>=3 && !e5_luck_mercy","text":"“You kept giving me points,” she says, first. “Nobody does that in there.” Then, because the cloister is empty and it’s true: “I wasn’t arguing for the driver, Costigan. I was arguing for everybody I love who’s ever going to need the second one.” She looks at him from under the arch. “What were you arguing for?”"},"A gardener’s blower starts up somewhere past the arch and stops again. Two girls go by with their arms full of rush flyers, and one of them says *Bid Day* like a holy day of obligation. Lena waits for his answer the way she waits for the Gospel, standing."],"choices":[{"text":"“It’s about my brother.”","tag":"Sincerity","set":{"e5_cloister":"brother","rel.lena.warmth":"+1","soul.honesty":"+1","trait.sincerity":"+1"},"key":"You told Lena the argument was about your brother.","response":[{"if":"e5_duel_personal && !e5_apologized","text":"“I figured,” she says. “I was watching you.” She adjusts the strap of the tote. “Mr. Costigan.”","else":"“I figured,” she says. “I was watching you.” Then she falls in beside him, close enough that the tote bumps his elbow every third step, and they walk out from under the last arch into the sun."},{"if":"e5_duel_personal && !e5_apologized","text":"He looks at her, and she has the answer ready before he’s opened his mouth. “I’m perfectly fine, Mr. Costigan.” Her hand goes to the medal at her throat and closes on it. They walk the rest of the cloister like two people who happen to have the same class next."}],"goto":"s06b"},{"text":"“It’s about me.”","tag":"Candor","set":{"e5_cloister":"me","rel.lena.trust":"+1","soul.honesty":"+1","trait.candor":"+1"},"key":"You told Lena the argument was about you.","response":["She looks at him under the arch, with the bougainvillea coming down between them. Then she nods, slowly, as if he’s confirmed something she’d already written in the margin. “Because you got out,” she says, “and he didn’t.”",{"if":"e5_duel_personal && !e5_apologized","text":"Even cold, she gives him the rest of it. “The one who got out doesn’t owe the one who didn’t his whole life, Mr. Costigan. He owes him letters.”","else":"“The one who got out doesn’t owe the one who didn’t his whole life, Jack,” she says. “He owes him letters.”"},"Jack looks at a petal on the tile. “Letters,” he says. “Okay.”",{"if":"e5_duel_personal && !e5_apologized","text":"He looks at her, and she has the answer ready before he’s opened his mouth. “I’m perfectly fine, Mr. Costigan.” Her hand goes to the medal at her throat and closes on it. They walk the rest of the cloister like two people who happen to have the same class next."}],"goto":"s06b"},{"text":"“I like winning.”","tag":"Wit","set":{"e5_cloister":"winning","soul.honesty":"-1","trait.wit":"+1","resolve.jack":"-1"},"key":"You told Lena you just like winning.","response":["“Sure,” she says. “Who doesn’t.” She says it the way she says *amen* to a homily she disagrees with.",{"if":"e5_duel_personal && !e5_apologized","text":"He looks at her, and she has the answer ready before he’s opened his mouth. “I’m perfectly fine, Mr. Costigan.” Her hand goes to the medal at her throat and closes on it. They walk the rest of the cloister like two people who happen to have the same class next."}],"goto":"s06b"},{"text":"“What I said in there. I’m sorry.”","if":"e5_duel_personal","tag":"Sincerity","set":{"e5_cloister":"sorry","e5_apologized":true,"rel.lena.trust":"+1","resolve.lena":"+1","trait.sincerity":"+1","resolve.jack":"+1"},"key":"You apologized to Lena for what you said in the seminar.","response":["She makes him wait. She makes him wait the whole length of the cloister, back the way they came, past every arch and every drift of petals and the drinking fountain that hasn’t worked since the Nixon administration, him a half step behind her the entire way. At the far end she stops and turns.","“Apology noted, Costigan.”","Plain Costigan, no mister. She hitches the tote higher on her shoulder and starts back toward the sun, and this time she slows down enough for him."],"goto":"s06b"}]},"s06b":{"slug":"MONDAY · 2:39 PM · HOLLIS HALL, THE CLOISTER WALK","body":["His hip buzzes. He gets the RAZR open and tips the cracked screen until it finds the one angle where it still lights. It’s 5:39 in Youngstown. School let out two hours ago.",{"type":"sms","from":"Gina","text":"a girl in religion said im the class expert on visiting the imprisoned. bc of danny. everybody laughed. mrs d said ladies and kept going","time":"2:39 PM"},"He reads it. He reads *bc of danny* again by itself. Somewhere on the Commons a frisbee lands and somebody cheers, and the bougainvillea keeps coming down, and his thumb is on the hinge, pressing the crack.",{"if":"e5_duel_personal && !e5_apologized","text":"He must look like something, because Lena stops. The chill is still in her voice. It isn’t anywhere else. “What happened, Mr. Costigan?”","else":"He must look like something, because Lena stops. “Jack. What happened?”"}],"choices":[{"text":"Hand her the phone.","tag":"Sincerity","set":{"e5_gina_text":"show","e5_gina_lena":true,"rel.lena.trust":"+1","trait.sincerity":"+1"},"key":"You showed Lena your sister’s text.","response":["He holds it out. She takes it and tilts it until the screen lights for her, and reads it. “Gina,” she says, from the top of the screen. “Your sister.” “Fifteen. Ursuline.” She closes the phone gently and gives it back to him, and her chin comes up the way it does across the oak, right before she takes him apart.","“When they go personal, you don’t defend. You name it. Tell her to say his name — just his name, *Danny* — and then look at that girl until she looks away. Don’t explain. Don’t argue. Make her hear it’s a person.”",{"if":"e5_duel_personal && !e5_apologized","text":"When she gets to *personal*, she’s looking at the phone in his hand, not at him."}],"goto":"s07"},{"text":"“My sister. Some girl called her the convict’s sister.”","tag":"Candor","set":{"e5_gina_text":"tell","e5_gina_lena":true,"rel.lena.warmth":"+1","trait.candor":"+1"},"key":"You told Lena what they’re calling your sister.","response":["“What’s her name?” “Gina.” “And the girl’s?” “Don’t know.” “Find out,” Lena says. “So you can pray for her. And then so Gina can destroy her.”","Then her chin comes up the way it does across the oak, right before she takes him apart. “When they go personal, you don’t defend. You name it. Tell her to say his name — just his name, *Danny* — and then look at that girl until she looks away. Don’t explain. Don’t argue. Make her hear it’s a person.”",{"if":"e5_duel_personal && !e5_apologized","text":"When she gets to *personal*, she’s looking past him."}],"goto":"s07"},{"text":"Close the phone. “Family stuff.”","tag":"Control","set":{"e5_gina_text":"later","trait.control":"+1"},"response":["He folds the RAZR shut. “Family stuff.”",{"if":"e3_lena_monday==\"family\"","text":"Lena looks at the closed phone and then at him. “I took ‘mostly’ back off you on a pier,” she says. “Don’t make me start a collection.”","else":"Lena looks at the closed phone and then at him. “Family stuff is the only kind there is,” she says."},"He breathes in. “…Later.”","She weighs it. “Okay,” she says. “Later.” She walks with him out to the Commons and asks nothing more, and the whole way there the phone is a hard square against his hip."],"goto":"s07"}]},"s07":{"slug":"MONDAY · 7:40 PM · DELGADO HALL, EAST STAIRWELL, 4TH-FLOOR LANDING","set":{"resolve.jack":"-1","gina_bullied":true},"body":["The fourth-floor lounge is empty at twenty to eight, the Zenith dark on its cart. Priya has struck back since Sunday. Taped to the frame of the whiteboard, at an angle that suggests a struggle, is a new laminate: THIS WHITEBOARD IS THE PROPERTY OF RESIDENTIAL LIFE. (IT IS NOT A NEWSPAPER.) Under it, in Margot’s capitals, the weekend has gone up anyway.",{"if":"e5_outfit==\"margot\"","type":"doc","title":"The 4th-floor whiteboard","text":"USEFUL IDIOTS FOR CHRISTIAN NATIONALISM\nCOSTIGAN | BROUSSARD\nC — “And every father.” (8/30, 3 a.m., this lounge) · 1\nB — Mantilla, in a public lecture hall (9/1) · 1\nB — “Neither horn.” (Aquinas, borrowed) · 1\nC — Took Broussard’s side against me (9/1). Chivalry is a tell. · 1\nB — Taught five Yankees and a Texan a chant to a football team. Called it worship. · 1\nC — “He’s the one who pays.” Substitutionary atonement at a dinner party. · 1\nC — Sister Mary Clement, a ruler. Corporal punishment. Predictable. · 1\nB — Bailout: “I’m *for* it.” Deduction for compassion. · −1\nB — “She’s right.” (US-101 N, 9/7.) Deduction. Witnessed. Unrepeatable. · −1\nB — “He just picked the wrong one.” (Joint session, 9/9) · 1\nB — Three hours of liturgical football, kickoff 10 a.m. Incense: nachos. · 1\nB — Painted a fleur-de-lis on a man in public. Idolatry. · 1\nC — Wore my shirt to it. Riot grrrl, appropriated. · 1\nTOTAL — C 5 · B 4"},{"if":"e5_outfit==\"theo\"","type":"doc","title":"The 4th-floor whiteboard","text":"USEFUL IDIOTS FOR CHRISTIAN NATIONALISM\nCOSTIGAN | BROUSSARD\nC — “And every father.” (8/30, 3 a.m., this lounge) · 1\nB — Mantilla, in a public lecture hall (9/1) · 1\nB — “Neither horn.” (Aquinas, borrowed) · 1\nC — Took Broussard’s side against me (9/1). Chivalry is a tell. · 1\nB — Taught five Yankees and a Texan a chant to a football team. Called it worship. · 1\nC — “He’s the one who pays.” Substitutionary atonement at a dinner party. · 1\nC — Sister Mary Clement, a ruler. Corporal punishment. Predictable. · 1\nB — Bailout: “I’m *for* it.” Deduction for compassion. · −1\nB — “She’s right.” (US-101 N, 9/7.) Deduction. Witnessed. Unrepeatable. · −1\nB — “He just picked the wrong one.” (Joint session, 9/9) · 1\nB — Three hours of liturgical football, kickoff 10 a.m. Incense: nachos. · 1\nB — Painted a fleur-de-lis on a man in public. Idolatry. · 1\nC — Wore three hundred dollars of Vance to it. · 1\nTOTAL — C 5 · B 4"},{"if":"e5_outfit==\"flannel\"","type":"doc","title":"The 4th-floor whiteboard","text":"USEFUL IDIOTS FOR CHRISTIAN NATIONALISM\nCOSTIGAN | BROUSSARD\nC — “And every father.” (8/30, 3 a.m., this lounge) · 1\nB — Mantilla, in a public lecture hall (9/1) · 1\nB — “Neither horn.” (Aquinas, borrowed) · 1\nC — Took Broussard’s side against me (9/1). Chivalry is a tell. · 1\nB — Taught five Yankees and a Texan a chant to a football team. Called it worship. · 1\nC — “He’s the one who pays.” Substitutionary atonement at a dinner party. · 1\nC — Sister Mary Clement, a ruler. Corporal punishment. Predictable. · 1\nB — Bailout: “I’m *for* it.” Deduction for compassion. · −1\nB — “She’s right.” (US-101 N, 9/7.) Deduction. Witnessed. Unrepeatable. · −1\nB — “He just picked the wrong one.” (Joint session, 9/9) · 1\nB — Three hours of liturgical football, kickoff 10 a.m. Incense: nachos. · 1\nB — Painted a fleur-de-lis on a man in public. Idolatry. · 1\nC — Flannel, under protest, then sequins under duress. Coerced; no points. · 0\nTOTAL — C 4 · B 4"},"He reads it top to bottom for a line he could argue with and comes away empty-handed.","The east stairwell smells of cold concrete and other people’s cigarettes. On the fourth-floor landing the window opens its six inches onto the Lagoon going navy, and if he holds the RAZR up into the top corner of the frame, it finds its bar. Lena’s call is at 8:04, two floors down, every night; he has twenty minutes of stairwell before it’s hers. On Glenwood Avenue it’s twenty to eleven.","Gina answers in a whisper, from under something. He can hear the covers. She whispers the way she texts, all lowercase, and she has clearly been crying earlier and is finished with that and would like that noted.","“it was religion,” she says. “mrs d is doing the corporal works of mercy. she put them on the board like a grocery list. feed the hungry. clothe the naked. visit the imprisoned. and ashley vrabel goes, oh, gina’s the class expert on that one.” A breath under the blanket. “and everybody laughed. even kelsey. kelsey laughed and then looked at me like *sorry* and then laughed again. and mrs d said *ladies*. just ladies. and kept going. we did bury the dead next.”","“Who’s Ashley Vrabel?” “nobody. she does color guard.” The whisper goes hot. “and her dad got a dui last christmas, it was all over st brigid’s, and SHE’S calling ME.” The capitals come through the whisper somehow. Jack has his free hand flat on the cold window frame.","Then, because she’s Gina, she changes the subject in the direction of worse. “dad turned it back on. low. like you said.” The garage arrives whole: the space heater ticking, the radio on the shelf over the Stroh’s fridge, his father in the folding chair with the volume down where nobody could accuse him of listening. “and nonna told the whole altar society you went to confession. she said it like *in california*. like it was fatima. mrs iannucci cried.”","The covers shift. “is the nun real.” “Go to sleep, Gina.” “that’s not a no.” It isn’t. Under the covers, at eleven at night, two thousand four hundred miles east, his sister waits for him to tell her what to do at eight in the morning."],"choices":[{"text":"Give her Lena’s advice.","if":"e5_gina_lena","tag":"Sincerity","set":{"e5_gina_advice":"nun","trait.sincerity":"+1"},"key":"You gave Gina the nun’s advice: say his name.","response":["“Say his name. Just ‘Danny.’ Then look at her till she looks away. Don’t explain and don’t defend. Make her hear it’s a person.” Silence under the covers while she turns it over. “who told you that.” “The nun.”","A much longer silence. Then, out loud, far too loud for eleven o’clock on a school night, loud enough that somewhere on Glenwood Avenue a bedroom door opens: “The nun is *real*?”"],"goto":"s07b"},{"text":"“Say his name. Just ‘Danny.’ Then look at her.”","if":"!e5_gina_lena","tag":"Sincerity","set":{"e5_gina_advice":"name","trait.sincerity":"+1"},"key":"You told Gina to say Danny’s name.","response":["“that’s it?” “That’s it. Look at her till she looks away. Make her hear it’s a person.” Gina breathes in the dark awhile, deciding whether he’s an idiot. “ok.”"],"goto":"s07b"},{"text":"“Ask her how her dad’s DUI is going.”","if":"trait.reckless>=6","tag":"Reckless","set":{"e5_gina_advice":"dui","e5_gina_dui":true,"trait.reckless":"+1"},"key":"You told Gina to ask Ashley about her father’s DUI.","response":["“oh my *god*. jack.” He hears her sit straight up in bed. She is delighted. He can hear her composing it already, the timing, the face she’ll make, and he thinks of Ashley Vrabel in a color-guard jacket and his little sister with a rock in her hand. “Gina — ” “no. that’s good. that’s *really* good.”"],"goto":"s07b"},{"text":"“He is in prison. So what. You get to be his sister anyway.”","tag":"Candor","set":{"e5_gina_advice":"sowhat","trait.candor":"+1"},"key":"You told Gina she gets to be Danny’s sister anyway.","response":["Nothing comes back for so long that he checks the bar. Then, small: “ok.” And smaller, from further under the blanket: “you sound like dad. when he had a job.”"],"goto":"s07b"},{"text":"“Tell Mom. Tonight.”","tag":"Control","set":{"e5_gina_advice":"mom","trait.control":"+1"},"key":"You told Gina to tell your mother.","response":["“you’re such a narc.” “Tonight, Gina.” A sigh with all of Ursuline in it. Then, before she hangs up, so fast he nearly misses it: “fine.”"],"goto":"s07b"}],"journal":[{"kind":"person","id":"gina","title":"Gina","text":"My sister. Fifteen, a sophomore at Ursuline. Texts in lowercase like punctuation costs extra. A girl in religion class called her the class expert on visiting the imprisoned. Dad turned the radio back on. Nonna told the altar society I went to confession. Gina wants to know if the nun is real."},{"kind":"note","id":"whiteboard","title":"The whiteboard","text":"Margot’s, by annexation: USEFUL IDIOTS FOR CHRISTIAN NATIONALISM, COSTIGAN | BROUSSARD. Sully’s made the board: liturgical football, idolatry, my outfit. Margot wasn’t even there when I read it. She didn’t need to be."}]},"s07b":{"slug":"TUESDAY · 2:52 AM · DELGADO HALL, ROOM 412","body":["At 12:41 the Dell chimed on Jack’s desk with the only thing on the internet tonight that isn’t Patrick Swayze.",{"type":"fb","name":"Becca Lindell ▸ Jack Costigan","text":"BBQ + beach cleanup SATURDAY!! bring gloves :)","meta":"Tuesday at 12:41am · Comment · Like"},"He owns gloves. Somewhere. Possibly in Ohio.","Swayze died yesterday — pancreatic cancer, fifty-seven — and the floor found out the way the floor finds out everything, laptop to laptop and door to door; at nine somebody down the hall had *Ghost* on with the volume up for the pottery wheel. Now it’s 2:52, and on Theo’s side of 412 it’s a different movie.","Theo is sitting up against the headboard in the Frette sheets with the MacBook on his knees and *Point Break* on the screen, sound low, no earbuds, because Jack is awake anyway and they both know it. Jack has been awake since a little after one. At 2:10 the freight came along the bluff and he counted it, and afterward he was still awake, on his back, listening across eleven feet of dark to Keanu Reeves learn to surf.","Theo’s lips move with half the lines and he says none of them. Once, without looking over, he reaches across the gap between the beds and holds out the iPhone, screen first. It’s more than Theo has ever handed him.",{"type":"sms","from":"Pops","text":"i never saw it but im sad bc ur sad. is that dumb","time":"12:02 AM"},"“She’s fourteen,” Theo says. “I told her it was the least dumb thing anybody’s said to me this year and to go to sleep.” He takes the phone back. “She sent a frowny face and went to sleep. Fourteen is a wonderful age. Everything is either dumb or a frowny face.”","On the screen it’s the end of the world, or Australia: Bells Beach under a sky like wet slate, the fifty-year storm come in at last, waves standing up out of the sea like whole buildings making up their minds to fall. Swayze is soaked and bearded and older than he was an hour ago, and he wants to paddle out into it, and Keanu has hold of him.","“Everybody thinks the end is sad,” Theo says. His eyes don’t leave the screen. “Utah lets him go. That’s the nicest thing anybody does in the whole movie.”"],"choices":[{"text":"“I told Lena. About Danny.”","tag":"Sincerity","cue":"Theo will remember that.","set":{"e5_theo":"told","theo_knows_lena_knows":true,"rel.theo.trust":"+1","resolve.jack":"+1","trait.sincerity":"+1"},"key":"You told Theo that Lena knows about Danny.","response":["Theo’s hand stops on the trackpad. “Good.” The screen. “Good for you, Costigan.” Then his thumb starts moving again, back and forth across the same inch of the trackpad, clicking nothing.","Utah unlocks the cuff. Swayze paddles out into the storm, and Utah throws his badge into the sea and walks back up the beach. The credits come up white on black. Theo shuts the MacBook on them and sets it on the floor, and for once 412 is properly dark: the standby light, the line under the door, nothing else."],"goto":"s08"},{"text":"“Utah, get me two.”","tag":"Wit","set":{"e5_theo":"bit","rel.theo.warmth":"+2","trait.wit":"+1"},"response":["Theo turns his head on the pillow and looks at him with real love. Then he does the rest of Pappas — the stakeout, the meatball sandwiches, the whole Busey jaw going at a sandwich in a parked car — perfectly, in a whisper, for a floor that isn’t asleep, and for a minute it’s just a dorm room at three in the morning, two guys and a movie.","Then Utah unlocks the cuff, and Swayze paddles out, and the badge goes into the sea. The credits come up white on black. Theo shuts the MacBook on them and sets it on the floor, and for once 412 is properly dark: the standby light, the line under the door, nothing else."],"goto":"s08"},{"text":"Watch the end with him. Say nothing.","tag":"Control","set":{"e5_theo":"watch","rel.theo.trust":"+1","trait.control":"+1","soul.restraint":"+1"},"response":["They watch it out. Utah unlocks the cuff. Swayze paddles out into the storm. Utah throws the badge into the sea, and across the room Theo’s breathing changes once, right there, and then goes back to what it was.","The credits come up white on black. Theo shuts the MacBook on them and sets it on the floor, and for once 412 is properly dark: the standby light, the line under the door, nothing else."],"goto":"s08"}],"journal":[{"kind":"person","id":"theo","title":"Theo Vance","text":"Roommate. Drives his grandfather’s car like a getaway. His father calls him Teddy and stays six minutes. Heard my brother’s voice and didn’t ask. Loves *Point Break* with no irony at all. Poppy texts him at midnight."}]},"s08":{"slug":"TUESDAY · 3:40 PM · U.S. POST OFFICE, MISSION STREET","body":["The flag out front is back at the top of the pole, snapping in the wind off the harbor as though Friday never happened.","La Flaca came down Mission on the rack on the front of the 11, and on the bus Jack counted the tip share in his lap, behind his backpack: singles, a five gone soft as cloth, quarters out of the jar by the register. He counted it twice. It came out the same both times.","There’s a line of four. Jack waits behind a kid with a cello case who looks like he’s the one being mailed.","The clerk has reading glasses on a cord and a Marisol Little League pin on her vest. “Money order,” he says. “Twenty dollars.” She keys it in. “Twenty-one ten.” He pays in singles and quarters, and she counts it again after him without comment, and the machine prints a United States Postal Service money order for $20.00.","He fills it out at the side counter with the pen on the bead chain. PAY TO: D. KOSTELNIK, in capitals. The address line he does without looking anything up, a street and a number his hand already knows, and then STRUTHERS, OH. On the line that says FROM he writes nothing at all.","The customer stub goes into his wallet, behind his Cardinal Mooney ID. The money order goes into an envelope, the envelope gets a stamp, and it goes through the brass slot marked OUT OF TOWN with a small flat sound.","Later La Flaca carries him down Mission to the wharf, to half-price chowder and the Hobart, and around ten the little TV over the Anchor’s counter shows the replay of the House voting to rebuke the congressman who yelled. Gloria turns it up. Rudy calls an order. Gloria turns it back down. On the steel by the Hobart, Rudy has left him a plate of fries with a fork standing up in them."],"next":"s09"},"s09":{"slug":"WEDNESDAY · 1:00 PM · HOLLIS 302","body":["On Wednesday the marine layer sits on Hollis all day, and the sea window in 302 is a white sheet with a foghorn somewhere behind it. Yusuf is slumped low in his chair, four days from Eid and conserving. Caleb has his *Consolations* out, more Post-it than book now, and under it, badly hidden, a brand-new hardback of *The Lost Symbol*, out yesterday. He sees Jack see it. “For research,” Caleb says.",{"if":"e5_duel_personal && !e5_apologized","text":"Lena is already in her chair. She slides her two pages across the oak without looking up and holds out her hand, palm up, for his. “Mr. Costigan.” He puts his paper in it. It goes into the OCTAVIA tote, and she opens the Williams and is gone into it.","else":"Lena is already in her chair, sleeves pushed to the elbow at five to one. “Give,” she says, and takes his two pages out of his hand before he’s sat down, and slides hers across the oak in the same motion."},{"type":"doc","title":"PHIL 9H · Costigan","text":"That the Lucky Man Owes Nothing\n\nA debt is a relation between two persons, and luck is not a person. Whatever the lucky man has, he borrowed from no one; and what was never lent cannot be owed."},{"type":"doc","title":"PHIL 9H · Broussard","text":"That There Is Such a Thing as Luck\n\nProvidence does not abolish chance; it makes room for it. Aquinas says it would be contrary to providence if nothing in the world happened by chance (*SCG* III.74), because a world without accidents would be a world without secondary causes — no wind, no weather, no free men — and God did not make a clock."},"Hale is at the sea window when the clock gets to 1:07, as if he’s been there all along. “Williams’s Gauguin,” he says, without turning. “Abandons a wife and five children for Tahiti and paints masterpieces. Williams says he is justified, if he is justified at all, only by succeeding — and he can’t know whether he will succeed until he’s already gone. Had the paintings been bad, he’d merely be a shit with a steamer ticket. Discuss. Mr. Hargrove, I see you’re already vibrating.”","Lena gets there first anyway. “He left a wife and five children, Professor, and gave Tahiti syphilis.” “Miss Broussard has located the clap,” Hale says. “Bravo. And if the paintings are good?” “Then they’re good paintings by a man who owes a woman in Copenhagen five children’s worth of letters.” Caleb comes in for Gauguin fast and a little flushed — the work outlasts the man, the man was never the point, some things are bigger than a family — and keeps going a while after the argument has stopped needing him. Yusuf surfaces long enough to say that right now he would leave his family for a sandwich, and sinks back down.","Jack reads her paper under the edge of the oak while Caleb defends the steamer ticket. It’s very good. By the bottom of page two the providence girl has proved there’s such a thing as luck, cleanly, with Aquinas holding the door for her, and he goes back over it twice looking for the seam and can’t find one. The red pen can wait for tonight.","At the end of the hour the papers go home in each other’s bags, the way they do every Wednesday, to come back bled on by section.","Out on the Hollis steps, in the fog, the RAZR goes twice.",{"type":"sms","from":"LANEY (FIREMAN’S FAVORITE)","text":"pref is TONIGHT. if i dont get pi lam im joining a convent. 217 at 11. bring lupes. lena says ok. FIREMAN","time":"2:31 PM"},{"type":"sms","from":"Kevin","text":"Orgo quiz Fri. Brick 8th floor 10pm? I’ll bring Red Bull and shame","time":"2:33 PM"}],"choices":[{"text":"217, with Lupe’s.","tag":"Go","set":{"e5_wed":"pref"},"key":"You spent Pref Night on the floor of 217 with Laney and Lena.","goto":"s10a"},{"text":"The Brick, with Kevin.","tag":"Go","set":{"e5_wed":"brick","rel.laney.warmth":"-1"},"key":"You spent Wednesday night on the eighth floor of the Brick with Kevin.","goto":"s10b"}]},"s10a":{"slug":"WEDNESDAY · 11:04 PM · DELGADO HALL, ROOM 217","set":{"resolve.jack":"+1"},"body":["Lupe’s is where it always is, at the Las Olas end of Seacliff: a white truck under a string of chile lights and a line of people being honest with themselves at eleven at night. Two orders of carnitas and a horchata. The woman in the window says six dollars, and he has six dollars. After that the wallet folds flat around two IDs and a receipt.","On the door of 217 the whiteboard still says LANEY ♥ LENA and, under it, *ora pro nobis*. Inside, “You Belong with Me” on Laney’s iPod dock, on repeat, “in solidarity,” Laney says from the floor, “with a sister.” Jack knows the song personally. It was sung into the back of his neck by this same girl the whole way down Seacliff, his first night.","She’s on the carpet between the beds in her pref dress — white eyelet, a pageant habit, she has explained, because white photographs — with her legs straight out, her shoes under Lena’s desk, and her mascara cried off down to the freckles. Behind her on the bed Lena has a hairbrush and is taking the pins out of Laney’s hair one at a time and dropping them into a Café du Monde mug, each with its own small tick.",{"if":"e5_duel_personal && !e5_apologized","text":"Lena looks up from the pins. “Mr. Costigan. You brought carnitas.” The address is still Monday’s. The look she gives the bag isn’t.","else":"Lena looks up from the pins. “Costigan brought carnitas,” she tells Laney. “Say thank you.”"},"“I can’t eat,” Laney says. “I’m in mourning.” She eats. Pref Night, it emerges between bites, was the most beautiful thing that has ever happened to anybody — candles, the actives in a circle in white, a senior who cried so hard a contact came out — and Laney ruined it. “I *laughed*. A girl gets up and does a speech about her grandmother’s ring, very moving, and she holds it up, and y’all. It is a *mood ring*. It’s *purple*. And I laughed out loud in a room full of candles, and Sloane Kittredge looked at me like I’d brought a gun to a christening.”","She holds up the pink BlackBerry and plays a voicemail on speaker. A woman’s voice, bright as a stage: “Delaney Rose, it’s your mother. Posture, sweetheart. Posture. Call me after.” Laney lowers the phone. “Four-oh-two this afternoon. That’s the whole message. I’ve played it nine times. It doesn’t get any longer.”","Then the little silver pillbox comes out of her clutch, DRP on the lid, and she thumbs it open and takes one, dry, head back, the way you’d take a vitamin you’ve stopped believing in. “Doctor’s orders. I have a note.” Lena’s hands keep on with the pins. The pins go on ticking into the mug.","By half past twelve the carnitas are gone and the horchata is gone, Taylor has started over more times than anybody has said out loud, and the mug is full. Laney’s hair is down, copper all over the white. She’s lying flat on the carpet now, looking at the ceiling, where somebody before them stuck glow-in-the-dark stars in the shape of no constellation at all.","“What if tomorrow,” she says, “they look at me, and they see.” On the bed, Lena’s brush stops."],"choices":[{"text":"“They’d be lucky.”","tag":"Sincerity","cue":"Laney will remember that.","set":{"e5_laney":"lucky","rel.laney.warmth":"+1","rel.laney.trust":"+1","trait.sincerity":"+1"},"response":["Laney turns her head on the carpet. “You said that before.” “Still true.” She looks at him, and then back up at the stars, and lets him see her smile about it.","Later, when he shifts to get up, a hand comes out of all that white eyelet and takes his ankle. “Don’t leave. I’m not anything. But don’t.” He stays. By one she’s asleep on the carpet under Lena’s cardigan, and Jack and Lena sit against the two beds with the empty Lupe’s bag between them, whispering about nothing for five minutes — whether there’s a real Lupe (there is; gold tooth; Lena has met her), whether the Eagles know what’s coming Sunday. Then Lena pulls the cardigan up over Laney’s shoulder. “Cher,” she says, low, and reaches over and stops Taylor mid-chorus."],"goto":"s11","key":"You told Laney they’d be lucky to have her."},{"text":"“And our next contestant…”","tag":"Wit","set":{"e5_laney":"bit","rel.laney.warmth":"+1","trait.wit":"+1"},"response":["He gives her the full host: the invisible microphone, the teeth. “From Highland Park, Texas — five feet and one inch of copper and spite — her talent is the Jell-O shot, and her platform is *y’all* — ” Laney laughs, wet, the laugh you can hear across a party turned down to fit a dorm room, and points at him from the floor. “Shoulders, fireman. You’re hosting, not confessing.” He fixes his shoulders. She approves.","Later, when he shifts to get up, a hand comes out of all that white eyelet and takes his ankle. “Don’t leave. I’m not anything. But don’t.” He stays. By one she’s asleep on the carpet under Lena’s cardigan, and Jack and Lena sit against the two beds with the empty Lupe’s bag between them, whispering about nothing for five minutes — whether there’s a real Lupe (there is; gold tooth; Lena has met her), whether the Eagles know what’s coming Sunday. Then Lena pulls the cardigan up over Laney’s shoulder. “Cher,” she says, low, and reaches over and stops Taylor mid-chorus."],"goto":"s11"},{"text":"“What’s the pill for, Laney?”","if":"trait.candor>=12","tag":"Candor","set":{"e5_laney":"pill","rel.laney.trust":"-1","rel.lena.trust":"+1","trait.candor":"+1"},"response":["Laney’s smile stays exactly where it is, and her eyes leave it. “Flying.” “You’re on the floor.” Over Laney’s head Lena looks at him — not angry; careful, like somebody watching a man wade out past where the bottom drops. Laney rolls toward the bed and puts her face against the dust ruffle. “It’s a figure of speech, fireman.”","Later, when he shifts to get up, a hand comes out of all that white eyelet and takes his ankle. “Don’t leave. I’m not anything. But don’t.” He stays. By one she’s asleep on the carpet under Lena’s cardigan, and Jack and Lena sit against the two beds with the empty Lupe’s bag between them, whispering about nothing for five minutes — whether there’s a real Lupe (there is; gold tooth; Lena has met her), whether the Eagles know what’s coming Sunday. Then Lena pulls the cardigan up over Laney’s shoulder. “Cher,” she says, low, and reaches over and stops Taylor mid-chorus."],"goto":"s11"},{"text":"Sit down against the bed. Stay till she sleeps.","tag":"Control","set":{"e5_laney":"stay","rel.laney.trust":"+1","trait.control":"+1"},"response":["He sits down on the carpet with his back against Laney’s bed, and after a while, as if it had been settled somewhere, she shifts over and puts her head against his knee. Her hair smells of hairspray and Lupe’s. Lena goes back to the brush.","Later, when he shifts to get up, a hand comes out of all that white eyelet and takes his ankle. “Don’t leave. I’m not anything. But don’t.” He stays. By one she’s asleep on the carpet under Lena’s cardigan, and Jack and Lena sit against the two beds with the empty Lupe’s bag between them, whispering about nothing for five minutes — whether there’s a real Lupe (there is; gold tooth; Lena has met her), whether the Eagles know what’s coming Sunday. Then Lena pulls the cardigan up over Laney’s shoulder. “Cher,” she says, low, and reaches over and stops Taylor mid-chorus."],"goto":"s11"}]},"s10b":{"slug":"WEDNESDAY · 10:20 PM · PACIFICA LIBRARY, 8TH FLOOR","set":{"resolve.jack":"+1","rel.kevin.warmth":"+1"},"body":["The eighth floor of the Brick is the silent floor, which means everybody on it whispers at the volume of normal conversation. A couple is breaking up by the photocopier in hisses. Somebody’s earbuds are leaking the new Muse. The windows look west at the Channel Islands, which are out there in the dark somewhere with no moon to find them by.","Kevin has a table by the glass: flashcards in four colors, rubber-banded by chapter, two Red Bulls sweating rings onto a napkin he brought for the purpose, and the maroon quarter-zip with BELLARMINE over the heart. He slides a can across. “Red Bull and shame. The shame’s mine. I got a B-plus on the first one.” He says *B-plus* like a diagnosis.","He warms up with dad jokes, as is his custom. “Why can’t you trust atoms?” “Kevin.” “They make up everything.” Jack puts his forehead on the table. “I had a chemistry joke,” Kevin says, “but all the good ones argon.” “It’s ten-twenty at night.” “That’s why I’m warming up. You don’t go into orgo cold. That’s how people get hurt.” He has a highlighter for every functional group, and he has named the green one Gregory.","Then the cards: nomenclature, chirality, R and S. Jack reads them out in a Youngstown accent that makes Markovnikov sound like a guy with a body shop on Market Street, and Kevin answers every one before he’s finished. Somewhere around stereoisomers, between chapters, Kevin talks about his summer: a Stanford program for pre-meds, and part of it was nights shadowing in a county ER in San Jose with a badge that said OBSERVER, so nobody would hand him anything sharp. Once, for eleven seconds, a resident let him hold a retractor, and he tells it like his First Communion.","“Saturday nights are the worst,” he says, sunny, squaring a stack. “There was one in July. Two cars on Story Road. A minivan, a family, the dad driving, and a guy in a pickup who’d been at a barbecue since noon.” He snaps a rubber band around the stack. “They worked on the dad a long time. The little girl was okay. The guy in the pickup came in walking and sat in a chair in the hall and kept asking the nurses was he in trouble.” He looks out at the dark where the islands are.","Jack finds his own thumb on the scar through his eyebrow. Kevin, who is going to be a doctor, notices, and the smile comes back on. “What happened there, anyway?”"],"choices":[{"text":"A hockey puck. Youngstown Phantoms game.","tag":"Wit","set":{"scar_told_kevin":"puck","trait.wit":"+1"},"response":["“Hockey puck. Phantoms game, front row. They tell you to watch the puck, and I took it literally.” Kevin, clinically: “Pucks don’t cut like that. Pucks blunt.” “This one did. It was a playoff puck.” Kevin weighs it and decides to believe it.","At 11:58 the BlackBerry buzzes on the table, and the smile changes stations. Kevin answers in Vietnamese, fast and warm, and Jack catches nothing but the shape of it until the end: “Dạ, con đi ngủ rồi, Mẹ.” He hangs up and puts the phone in his pocket. “She thinks I’m asleep. She thinks a lot of things.” Then he cracks the second Red Bull.",{"type":"sms","from":"Lena","text":"Laney asleep on the floor in her pref dress. 31 pins. Ask me about the mood ring tomorrow. —L.","time":"12:47 AM"}],"goto":"s11","journal":[{"kind":"person","id":"kevin","title":"Kevin Tran","text":"Kevin Tran. Goes to daily Mass, saves you a seat with a Bible. Has a sister, Tina, in dental school, who flossed in the womb. Lies to his mom about orgo in Vietnamese. Drives his mother’s Odyssey at sixty-five, not sixty-six. His dad has two nail-salon supply stores in San Jose and has never had a Labor Day. Shadowed in an ER this summer. Tells his mother he’s asleep."}]},{"text":"A Franciscan who plays dirty in pickup.","if":"trait.charm>=8","tag":"Charm","set":{"scar_told_kevin":"franciscan","trait.charm":"+1"},"response":["“There’s a Franciscan back home who plays pickup at the Y on Tuesdays. Brown habit, high-tops, rosary tucked in so it won’t swing. Elbows like original sin.” Kevin laughs — the real one, short and surprised, no team captain in it — and a girl two tables over shushes the whole eighth floor. “I’d believe that about a Franciscan.”","At 11:58 the BlackBerry buzzes on the table, and the smile changes stations. Kevin answers in Vietnamese, fast and warm, and Jack catches nothing but the shape of it until the end: “Dạ, con đi ngủ rồi, Mẹ.” He hangs up and puts the phone in his pocket. “She thinks I’m asleep. She thinks a lot of things.” Then he cracks the second Red Bull.",{"type":"sms","from":"Lena","text":"Laney asleep on the floor in her pref dress. 31 pins. Ask me about the mood ring tomorrow. —L.","time":"12:47 AM"}],"goto":"s11","journal":[{"kind":"person","id":"kevin","title":"Kevin Tran","text":"Kevin Tran. Goes to daily Mass, saves you a seat with a Bible. Has a sister, Tina, in dental school, who flossed in the womb. Lies to his mom about orgo in Vietnamese. Drives his mother’s Odyssey at sixty-five, not sixty-six. His dad has two nail-salon supply stores in San Jose and has never had a Labor Day. Shadowed in an ER this summer. Tells his mother he’s asleep."}]},{"text":"“A fight. A long time ago.”","tag":"Candor","cue":"Kevin will remember that.","set":{"scar_told_kevin":"fight","rel.kevin.trust":"+1","soul.honesty":"+1","trait.candor":"+1"},"key":"You told Kevin the short, true version of the scar: a fight, a long time ago.","response":["Kevin nods once and picks up the next card. “Cahn–Ingold–Prelog.”","At 11:58 the BlackBerry buzzes on the table, and the smile changes stations. Kevin answers in Vietnamese, fast and warm, and Jack catches nothing but the shape of it until the end: “Dạ, con đi ngủ rồi, Mẹ.” He hangs up and puts the phone in his pocket. “She thinks I’m asleep. She thinks a lot of things.” Then he cracks the second Red Bull.",{"type":"sms","from":"Lena","text":"Laney asleep on the floor in her pref dress. 31 pins. Ask me about the mood ring tomorrow. —L.","time":"12:47 AM"}],"goto":"s11","journal":[{"kind":"person","id":"kevin","title":"Kevin Tran","text":"Kevin Tran. Goes to daily Mass, saves you a seat with a Bible. Has a sister, Tina, in dental school, who flossed in the womb. Lies to his mom about orgo in Vietnamese. Drives his mother’s Odyssey at sixty-five, not sixty-six. His dad has two nail-salon supply stores in San Jose and has never had a Labor Day. Shadowed in an ER this summer. Tells his mother he’s asleep."}]},{"text":"“Long story. Next card.”","tag":"Control","set":{"trait.control":"+1","rel.kevin.trust":"+1"},"response":["Kevin flips the card without a word.","At 11:58 the BlackBerry buzzes on the table, and the smile changes stations. Kevin answers in Vietnamese, fast and warm, and Jack catches nothing but the shape of it until the end: “Dạ, con đi ngủ rồi, Mẹ.” He hangs up and puts the phone in his pocket. “She thinks I’m asleep. She thinks a lot of things.” Then he cracks the second Red Bull.",{"type":"sms","from":"Lena","text":"Laney asleep on the floor in her pref dress. 31 pins. Ask me about the mood ring tomorrow. —L.","time":"12:47 AM"}],"goto":"s11","journal":[{"kind":"person","id":"kevin","title":"Kevin Tran","text":"Kevin Tran. Goes to daily Mass, saves you a seat with a Bible. Has a sister, Tina, in dental school, who flossed in the womb. Lies to his mom about orgo in Vietnamese. Drives his mother’s Odyssey at sixty-five, not sixty-six. His dad has two nail-salon supply stores in San Jose and has never had a Labor Day. Shadowed in an ER this summer. Tells his mother he’s asleep."}]}]},"s11":{"slug":"THURSDAY · 1:10 AM · DELGADO HALL, ROOM 412","set":{"e5_duffel":true},"body":[{"if":"e5_wed==\"pref\"","text":"Two flights up from 217 at ten past one, the Lupe’s bag folded flat in his hand, the fourth-floor hall buzzing under its lights and La Flaca asleep against the radiator pipe.","else":"In from the Brick at ten past one with Kevin’s flashcards still shuffling behind his eyes — chirality, R and S, Markovnikov — the fourth-floor hall buzzing under its lights and La Flaca asleep against the radiator pipe."},"412 is empty, the lamp on. The RAZR, opened, shows one bar of battery, and then while he watches none, and then one again. His charger is plugged in behind the Hobart at the Anchor, where he left it Tuesday night and where it will still be at seven tonight.","Theo comes back from the showers down the hall in a towel, wet hair pushed back, his things in a leather case that has been to more countries than Jack has. “You have anything that fits a RAZR?” “Top shelf. The gray bag.” Theo points with his chin. “It’s in with the camera stuff. The Canon takes the same cable — mini-USB. It’s the only thing your phone and my camera have in common, Costigan. Treasure it.”","There are two bags on the top shelf of the closet. Jack goes up on his toes and pulls the one in front, the black one, because it’s in front: heavier than he expects, the zipper open halfway. He reaches in for a cable and comes out with denim.","A jacket. A women’s Levi’s jacket, small, the cuffs worn soft. He shakes it out to see what it is, and as it unfolds the back swings toward him, and on the back is Our Lady of Guadalupe, embroidered, a hand’s span tall: the blue-green mantle with its stars, the gold rays all around her, roses at her feet. Stitched by hand. He can see where the thread was knotted.","Theo crosses the room — it’s the fastest Jack has seen him move all week — and takes it out of his hands.","“A girl left it.” He’s already folding it, sleeves in, the back turned to the inside. “Brentwood girl. Marymount. She’s in Prague for the semester; she left it in the car, and I keep meaning to mail it to her. Nobody has an address in Prague. Have you ever tried to get an address in Prague? It’s all *ulice* this and *náměstí* that, and the post office is a palace, and the palace is closed.” The jacket goes into the black bag and the bag gets zipped, all the way, and Theo puts it back on the shelf himself, at the back. He takes down the gray one, finds the cable in a side pocket, and hands it over. “There. Mini-USB. A miracle of standardization.”","He gets into bed with the MacBook and his headphones on, and the menu screen of whatever it is lights his face blue and goes on looping, nothing playing."],"choices":[{"text":"Say nothing. Plug in the phone.","tag":"Control","set":{"e5_jacket":"quiet","rel.theo.trust":"+1","trait.control":"+1"},"response":["Theo didn’t ask about the call from Trumbull, that morning in Malibu. Jack plugs the RAZR in at the desk, and the little light by the hinge comes on orange. Across the room the menu goes on looping on Theo’s face."],"goto":"s12"},{"text":"“Hope she’s warm in Prague.”","tag":"Wit","set":{"e5_jacket":"prague","trait.wit":"+1"},"response":["Theo keeps the headphones on. “It’s September,” he says. “Prague is lovely in September.” Jack plugs in the phone, and the little light by the hinge comes on orange."],"goto":"s12"},{"text":"“You should mail it to her.”","tag":"Candor","set":{"e5_jacket":"mail","trait.candor":"+1"},"response":["“I’m going to.” Theo settles the headphones. After a while, on his side of the room, the movie starts."],"goto":"s12"}]},"s12":{"slug":"THURSDAY · 4:02 PM · HOLLIS 108","body":["Hollis 108 comes with its parade at ankle height — rainbow flip-flops, a skateboard, somebody’s golden retriever — and Evan Marsh is back. Last Thursday the door had a note on it. Today he’s on the front edge of the desk with the stained Carhartt over his chair and a bike clip still around the cuff of his jeans, grayer at the temples than Jack remembers, holding *Works of Love* in a library binding with the plastic jacket crackling.",{"if":"e5_duel_personal && !e5_apologized","text":"Lena takes the desk two over from Jack’s, not the one beside it, and passes his paper across the empty desk between them without looking.","else":"Lena takes the desk beside Jack’s and has his paper on it before he’s sat down."},{"if":"e5_duel_personal && !e5_apologized","text":"His page one has her red on it in exactly one place, top margin, dead center: *“Fine.”* Nothing else on either page. Not a circle, not a NO, not a single *cite me*. He turns the page over to be sure.","else":"On his page one, top margin, in her red: *“You don’t believe a word of this. It’s your best paper.”* Underneath, smaller, an arrow to his first sentence and the word *coward*, which in her red ink is affectionate, he’s almost sure."},"His own red went on the bottom of her page two at half past one this morning: *You proved it. I don’t think you were trying to.* He hands it across. She reads it with her pen in her teeth, and then folds it into the Greek grammar.","Before Evan can open the book, Lena says it. “We read it. ‘Our Duty to Love the People We See.’ It was good.” Evan looks at her as if she’d spoken in a language he grew up in and hasn’t heard in years. He takes a moment before he nods. Then he closes the book on the desk.","They talk about Hale instead, because everyone does. This morning in Sandoval 1 Hale gave the four hundred the two drivers, slower and meaner than he gave them to the seminar, and finished on a line Jack wrote on the back flyleaf of the O’Connor: *The bill arrives at the wrong address. It always has.* The girl in the Marisol Surf hoodie wants to know if that means the one who hit the kid is worse or just, like, sadder. The Sigma Rho kid, visor backward, says it’s all luck, bro, you get pulled over or you don’t, and then hears himself and adds, “I mean morally.” Somebody asks whether Evan is going to tell them what Kierkegaard thinks, and Evan says Kierkegaard thinks they should stop asking what Kierkegaard thinks. Lena says the one who hit the kid is worse *off*, not worse, and that those are different words for a reason; the Marisol Surf girl writes *worse off* on the back of her hand. Evan lets them go around twice.","Then, looking at the window rather than at any of them: “You’ve left out a driver. The one who stops, looks, sees nothing, and drives home.”","The room waits for the rest of it. Out the ankle-height window a pair of sandals goes by, and the shadow of a bike, and the clock over the door gets from 4:29 to 4:30 with a clunk. At 4:31 Evan picks the book back up. “Go love the people you see,” he says, and lets them out."],"choices":[{"text":"“You okay, Evan?”","tag":"Sincerity","set":{"e5_evan":"okay","rel.evan.warmth":"+1","trait.sincerity":"+1"},"response":["Evan is working the bike clip down over his other cuff. He keeps his eyes on it. “Section’s over, Mr. Costigan.” He says it kindly.",{"if":"e5_duel_personal && !e5_apologized","text":"Lena and Jack climb out into the four-thirty light. At the top of the steps she hitches up the tote and looks west, toward Seacliff and Bid Day. “Somebody has to be across the street, Mr. Costigan.”","else":"Lena and Jack climb out into the four-thirty light. At the top of the steps
