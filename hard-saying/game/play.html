ext":"“Oh my *God*, you found her!” Laney shrieks. “Sad Irish Poem found you!” Lena turns her head very slowly. “*Sad Irish Poem?*” “Well, look at him. Lena, Sloane’s here, my future big, she’s a *goddess*, she’s in the hot tub.” Lena looks at the blue tarp. “*That* hot tub?” “The front one, sugar. It’s a kiddie pool. Sloane makes it work.”","else":"Laney looks from Jack to Lena and back, and her eyebrows go up. “Well, *hello*. Lena, who’s your friend? Never mind. I’ll find out.”"},"She backs inside, aiming a Jell-O shot at them like a derringer. “Two minutes, Magdalena, or I’m drinking yours.” The slider rumbles shut. The light stays on now. Whatever was about to happen in the dark goes back to being a porch.",{"if":"e1_route==\"living\"","text":"“Also,” Lena says, not looking at him, “you’ve had my roommate’s mouth on your face since you walked out here.” His hand comes away from his cheek with a smear of red. “You let me sit here for an hour with —” “I was judging you. That’s what the porch is for.”"},"A minute left, maybe two. The fog has come up over the lip of the bluff and filled in the path behind the fence as if it was never there."],"journal":[{"kind":"person","id":"lena","title":"Lena Broussard","text":"New Orleans. *Magdalena* only to her mother, the Holy Ghost, and Laney when Laney wants something. Knows Walker Percy cold. Warned me off the path behind the fence like she’d been told twice. Roommate: Laney."},{"kind":"note","id":"fence","title":"The path","text":"A gap in the fence behind the Lighthouse; a path along the bluff to the Point. Two people today told me not to go there. Neither would say why."},{"kind":"person","id":"laney","title":"Laney","if":"!e1_met_laney_early","text":"Lena’s roommate. Copper hair, pearls on backward, a Jell-O shot in each hand. Calls her *Magdalena* when she wants something. Makes announcements to Hawaii."}],"choices":[{"text":"Light a Marlboro. Offer her one.","tag":"Reckless","set":{"trait.reckless":"+1","jack_cigs":"+1","rel.lena.heat":"+1","rel.lena.friction":"+1","e1_lit_cig_porch":true,"e1_lena_took_cig":true,"reliquary":"+1"},"key":"Lena took the cigarette out of your mouth.","journal":[{"kind":"note","id":"cigarette","title":"The first cigarette","text":"She took it out of my mouth and put it in her pocket. Who keeps a cigarette butt?"}],"response":["He lights one off a Bic cupped against the wind and holds the pack out to her. She ignores the pack. Before he can get a second drag she reaches over and takes the cigarette out of his mouth, two fingers, the way you’d take a pencil from behind somebody’s ear, stubs it out on the rail with a neat little twist, and drops the butt into her cardigan pocket.","“Those’ll kill you.” “That’s the plan. Slowly. Like a Catholic.” “Littering’s a sin, Jack.” She says his name like she’s checking whether it will hold her weight, and then pats the pocket once, as if there’s something in it worth keeping."],"goto":"s11"},{"text":"Don’t light it. Put the pack away.","tag":"Control","set":{"trait.control":"+1","soul.restraint":"+1","rel.lena.trust":"+1"},"key":"You put the cigarettes away in front of Lena.","response":["His hand comes out of his jacket empty. She saw it: the pack, and then no pack. “Quitting?” “Tapering. Like a saint, but with Marlboros.” She laughs, and doesn’t bother hiding it. “Lord have mercy,” she says. “You’re going to be a problem, Jack.”"],"goto":"s11"},{"text":"“What’s out there? At the end of the path.”","tag":"Sincerity","set":{"trait.sincerity":"+1","rel.lena.friction":"+1"},"key":"You asked Lena what was at the end of the path.","response":["She looks at the fence. “A cliff,” she says. “A lighthouse that doesn’t work.” Then, too brightly, in a tour-guide voice: “Rocks. Seals. Fog. California.” She slides down off the rail and brushes off the back of her dress.","That’s twice today somebody has answered that question with *a cliff*: the RA at the floor meeting, and now her. Then Laney is drumming on the glass with both palms and the two minutes are up."],"goto":"s11"}]},"s11":{"slug":"SATURDAY · 11:52 PM · THE LIGHTHOUSE, FRONT HALL","body":["By midnight the Lighthouse has stopped being a party and become a weather system. The laptop on the coat rack has died in the middle of Miley Cyrus, and on the third stair from the bottom Laney is crying about it. “It’s about *leaving home*,” she explains to a stranger’s knees. Then she’s laughing. Then she’s very still. Then she begins to lean, slowly, in a way Jack recognizes from every wedding reception ever held in the St. Brigid’s parish hall.","Lena gets there first, and Jack watches her change. The girl from the porch is gone; in her place is somebody he knows from his mother at wakes — brisk, tender, absolutely in charge, and not for the first time, from the look of her hands. A Solo cup under Laney’s chin before Laney knows she needs one, copper hair in one fist, the other hand circling slowly between her shoulder blades. “There you go, cher. That’s the vodka leaving, not you.” Laney apologizes to the cup. “Don’t apologize to the cup. The cup’s seen worse.”",{"if":"e1_route==\"living\"","text":"Up on the landing the guy with the guitar is still there, playing for nobody now — “Skinny Love” again, slower, softer — and with the laptop dead it carries all the way down the stairs.","else":"Up on the landing a guy in a gray cardigan — warm brown skin, short dark hair — is playing for nobody, calm-faced, slower and softer than anything the laptop managed all night: “Skinny Love,” the Bon Iver song Gina played until the CD skipped. With the laptop dead it carries all the way down the stairs."},"Lena stops, Laney halfway up off the step, and listens, her face turned up toward the landing. Jack can’t read it. It isn’t the look girls give guys with guitars. The guy glances down, nods politely, and keeps playing. Then Laney says, “Lena, the floor’s *moving*,” and Lena says, “The floor’s fine, baby, it’s you,” and whatever it was is gone.","Theo arrives like a parade, a bottle of Grey Goose held by the neck like a prize fish and a blonde on his other arm — older, cool, beautiful in a way that looks negotiated by agents. “Costigan. This is Sloane. She runs Pi Lam. She’s going to destroy us all.” From somewhere inside her own hair, Laney says weakly, “My *big*.” “Hi, Laney,” says Sloane. “Drink water.” Theo takes Jack by the front of the Carhartt with both hands. “Bonfire. Shipwreck Cove. Costigan — the *ocean*. At *night*. You came here for this.”","Behind him Lena has Laney upright and moving, steering for the front door the way a tugboat steers a cruise ship. She doesn’t look at Jack. She doesn’t ask for help. Everything in the set of her shoulders says she isn’t going to."],"choices":[{"text":"Take Laney’s other arm. Walk them home.","tag":"Go","set":{"e1_after":"walked","rel.lena.trust":"+1","rel.laney.warmth":"+1","rel.theo.friction":"+1"},"cue":"Theo will remember that.","key":"You walked Lena and Laney home.","response":["Theo puts a hand over his heart as if he’s been shot through it. “Abandoned. On my first night. By a *Catholic*.” Then he winks — a slow movie-star wink that seems to come with its own lighting — and steers Sloane toward the back of the house and the bluff stairs, and the Grey Goose goes with them."],"goto":"s12a"},{"text":"Go down to the cove with Theo.","tag":"Go","set":{"e1_after":"cove","rel.theo.trust":"+1","rel.theo.warmth":"+1"},"key":"You followed Theo down to the bonfire.","response":["Lena is already at the door. She doesn’t look back. Laney does, over Lena’s shoulder, through a curtain of copper hair, and gives him a pageant wave — slow and sloppy and sweet, wrist, wrist, elbow, elbow — and then the fog takes them both."],"goto":"s12b"}]},"s12a":{"slug":"SUNDAY · 12:18 AM · OCEAN ROAD, BETWEEN LAS OLAS AND THE GROVE","music":"Taylor Swift — “You Belong with Me”","set":{"e1_knows_same_dorm":true,"resolve.jack":"+1","e1_heard_boyfriend":true},"body":["At the last stop sign in Las Olas, Laney’s legs resign, effective immediately, and she climbs onto Jack’s back. She weighs about as much as a bag of mulch and is much louder, and she has found the chain of his medal and is holding it like reins.","She is singing Taylor Swift at Lena with full pageant commitment and no relationship to the melody whatsoever. At the T-shirt part she lets go of a rein to point. “*I wear T-shirts* — that’s *you*, Lena. You’re the T-shirt.” “I’m wearing a dress, Delaney.” “Spiritually.”","Lena walks beside them on the shoulder of Ocean Road, which has no sidewalk, because nobody in California has ever walked anywhere on purpose. She carries Laney’s flats and an empty Dasani bottle and has been hunting a recycling bin for a quarter mile, because she was raised right and California can meet her halfway. The streetlights wear the fog like halos.","At the edge of the Grove Laney says, “Put me down,” in a different voice, and throws up into a concrete planter of baby eucalyptus with real dignity. Lena is there before her knees touch the curb, hair in one fist. Jack holds Laney’s quilted purse at arm’s length, like something that might wake up. It buzzes. A pink BlackBerry lights up inside: SLOANE K. “Your phone’s ringing,” he tells the planter. “Tell it I died,” says the planter.","Back aboard, Laney rallies with the loudest stage whisper in the history of the Central Coast. “She’s *taken*, sugar. Don’t even. She’s got a — ” “Delaney. Shh.” “I’m being *supportive*.” The word *taken* walks along beside them for a while, a fourth person on the shoulder of the road.","Near the Lagoon she goes heavy all at once, like a kid in a back seat, her cheek against his neck. “Kaylee used to — ” she says, to nobody, and stops. Jack waits for the rest. It doesn’t come. Lena’s hand comes up to Laney’s back and stays there. She doesn’t ask, so he doesn’t either.","At the fork in the Anacapa path, where he means to hand Laney over and go home, Jack turns toward Delgado. So does Lena. They both stop. “You’re in *Delgado*?” “You’re kidding.” “Two seventeen,” she says. “Four twelve.” Laney snores gently between them. “Don’t get ideas. It’s a big building.” It is five floors of concrete and one elevator.","The desk attendant — MARCUS, says his name tag — is asleep sitting up under an open calculus textbook. The elevator smells like Febreze and regret. On two, Lena takes her. The door of 217 has a whiteboard on it, LANEY ♥ LENA in pink marker and under it, in a small sharp hand, *ora pro nobis*. Laney opens her eyes. “He carried me, Lena,” she says, with enormous feeling. “Like a fireman. Like a *Catholic* fireman.”","Lena holds the door with her hip and looks at him over Laney’s head, waiting, apparently, to see what he’ll say."],"choices":[{"text":"“Tell her to drink water. And — goodnight, Lena.”","tag":"Sincerity","set":{"trait.sincerity":"+1","rel.lena.warmth":"+1","e1_carried_laney":true},"response":["She looks at him a second longer than she needs to, Laney’s whole weight on her shoulder. “Goodnight, Jack.” Not tested, not tossed off: set down plainly, like something she’s decided to keep in the house. The door shuts, and he stands in the hall a little longer than a man with business there would."],"goto":"s13"},{"text":"“If she asks, I was a Kennedy.”","tag":"Wit","set":{"trait.wit":"+1","rel.lena.heat":"+1","e1_carried_laney":true},"response":["“Too soon,” Lena says. “They only buried him tonight.” Then she laughs anyway, a short, startled sound she aims at the ceiling, and Laney lifts her head and demands, “What? What’s funny? Was it me?” and the door closes on the two of them laughing."],"goto":"s13"},{"text":"“Same time next Saturday?”","tag":"Charm","set":{"trait.charm":"+1","rel.lena.friction":"+1","e1_carried_laney":true,"e1_asked_lena_out":true},"response":["“I have a boyfriend,” she says. Not sharp, not sorry. Plainly: a fact set down on a table between them, where they can both get a good look at it. “Of course you do,” Jack says. She almost smiles at that. “Goodnight, Jack.” The door closes, and he stands reading *ora pro nobis* until he hears the lock turn."],"goto":"s13"},{"text":"“Are *you* okay? Not her. You.”","tag":"Candor","if":"trait.candor>=1","set":{"trait.candor":"+1","rel.lena.trust":"+1","rel.lena.friction":"+1","e1_carried_laney":true},"response":["For half a second she almost answers him; he can see it get as far as her mouth. Then Laney sags, and Lena shifts to take the weight, and the half second is over. “I’m the one holding the hair, Jack. The one holding the hair is always okay.” She shuts the door as gently as if there were a sleeping kid behind it."],"goto":"s13"}]},"s12b":{"slug":"SUNDAY · 12:18 AM · SHIPWRECK COVE, LAS OLAS","music":"Fleet Foxes — “White Winter Hymnal”","body":["The stairs down to Shipwreck Cove are warped and older than anyone on them, wound with Christmas lights that work on every third step. At the bottom a driftwood bonfire the size of a sedan throws sparks into the fog. Surfers in hoodies; girls in the surfers’ hoodies; a guy who cannot play the guitar, playing it. A phone on a cooler does better: voices stacked on voices, going round like a choir raised in the woods. Past the firelight the ribs of an old wooden ship stick up black out of the wet sand, as if something enormous died here long ago and nobody had the heart to move it.","Sloane has taken a driftwood log like a throne she finds a little disappointing. “Sloane,” Theo says, “Costigan’s Catholic. Be gentle.” She looks Jack over without hurry. “That’s fine,” she says. “Everybody’s Catholic eventually. Usually around three in the morning, on a bathroom floor.”","Theo walks him down to the waterline, away from the fire. The Pacific comes up over Jack’s bare feet, colder than Lake Erie in June, and he yelps, and Theo laughs at him — and then stops laughing and looks north, to where the bluff climbs into the fog and becomes the Point, the old lighthouse on top of it, a pale stub in the gray. He looks at it for a while. Jack watches him look.","“You believe in hell, Costigan?” Theo says, still facing north. “Like, actually.” Jack has a joke loaded. He puts it back. “Yeah. Actually.” Theo nods, as if he was braced for that one. “What about forgiveness. What’s the exchange rate. Like if somebody did something — ” He stops. Starts again. “Something really bad. Does it — ”","The water comes in and goes out. When Theo speaks again it’s in the other voice, the one from the floor-meeting carpet. “Never mind. I’m drunk. I get theological. It’s a medical condition.” He pours a long slug of Grey Goose into the red cup Jack forgot he was holding. “For the cold.”"],"choices":[{"text":"Answer him straight: there’s nothing mercy can’t cover, but you have to ask for it.","tag":"Sincerity","set":{"trait.sincerity":"+1","soul.grace":"+1","rel.theo.trust":"+2","resolve.jack":"-1","e1_theo_forgiveness_talk":"mercy","e1_vodka":true},"key":"You told Theo nothing is too big to be forgiven.","response":["So Jack tells him, straight, no bit on it: there’s nothing a man can do that’s bigger than mercy, and there’s no exchange rate. But you have to ask — out loud, to somebody’s face — and that’s the part that kills people. “That’s a hell of a policy,” Theo says. “It’s not a policy,” Jack says. “It’s a person.”","Theo turns and looks at him, the firelight on one side of his face, as if Jack has said something in a language Theo spoke when he was small and has mostly forgotten. Up the beach Sloane calls his name, and he goes. A wave comes in higher than the rest and soaks Jack to the knees. He drinks the vodka. It tastes like a cold coming on."],"goto":"s12c"},{"text":"“You want to tell me something, Theo?”","tag":"Candor","set":{"trait.candor":"+1","rel.theo.trust":"+1","rel.theo.friction":"+1","e1_theo_forgiveness_talk":"pressed"},"response":["The laugh comes instantly: big, practiced, perfect, a laugh you could cut into a trailer. “God, no. I want to tell you *everything*, Costigan. I’m an open book. I’m a *pop-up* book.” He plants both hands on Jack’s chest and shoves, and Jack goes over backward into the surf to the knees, and Theo is already sprinting up the beach toward the fire, whooping, the bottle held high like a torch. Jack stands in the Pacific, soaked, still holding the cup, and pours the vodka into the ocean. It seems like the least he can do for it."],"goto":"s12c"},{"text":"“Exchange rate’s great. Catholic Church is the only bank that never got a bailout.”","tag":"Wit","set":{"trait.wit":"+1","rel.theo.warmth":"+1","resolve.jack":"-1","e1_theo_forgiveness_talk":"joked","e1_vodka":true},"response":["Theo laughs — really laughs, bent over, hands on his knees. “That’s going on a T-shirt. I’m having it made. I’m having *several* made.” He doesn’t ask again. A wave comes in past their rolled cuffs and soaks them both to the knees, and Theo shrieks like a kid at a public pool, and Jack drinks the vodka, and whatever Theo was about to say has gone back out with the tide."],"goto":"s12c"}]},"s12c":{"slug":"SUNDAY · 1:40 AM · SHIPWRECK COVE, LAS OLAS","body":["At 1:40 Theo and Sloane go up the wooden stairs together, her hand in his back pocket. On the third step he turns, lit red and green by the Christmas lights. “Don’t wait up, roomie.” He reconsiders. “Actually — don’t go *home* for a bit.” Then the fog has them. Jack eats carnitas from the taco truck on Seacliff standing up in wet jeans and walks back alone through the Grove, and at ten past two the freight train on the bluff leans on its horn, and he counts the cars until he loses track."],"next":"s13"},"s13":{"slug":"SUNDAY · 2:51 AM · DELGADO HALL, 4TH FLOOR LOUNGE","set":{"resolve.jack":"-1"},"body":[{"if":"e1_after==\"walked\"","text":"He got up to an empty 412 a little after half past twelve and lay with *The Moviegoer* open on his chest, not reading, thinking about an inch of cold railing and the word *taken*. Around two he gave up and walked the Lagoon path in the fog, twice around, like a man trying to wear something out. Halfway round his phone buzzed. Theo, it turns out, programmed himself into the RAZR today, under a name of his own choosing."},{"if":"e1_after==\"walked\"","type":"sms","from":"THEO VANCE (IMPORTANT)","text":"Sock protocol in effect. Do not come home. I owe you a kidney, which is more than you deserve, Abandoner. —T.","time":"2:14 AM"},{"if":"e1_after==\"cove\"","text":"He comes up the stairwell at ten to three, jeans stiff with salt to the knee, smelling of woodsmoke and carnitas."},"And there is a sock on the doorknob of 412.",{"if":"e1_after==\"cove\"","text":"Gray cashmere: the kind of sock that costs forty dollars and has never been inside a shoe. He watched Sloane go up the cove stairs with her hand in Theo’s back pocket. He doesn’t need a detective."},{"if":"e1_after==\"walked\"","text":"Through the door a girl laughs, low, and Theo says something, and she laughs again. The last time Jack saw Theo, Sloane was on his arm. He can guess."},"Jack regards the sock the way Nonna regards a Protestant at a wake: suspicion, perfect manners. He is fairly confident the Catechism is silent on the sock. He has been awake since a gravel turnout on Highway 1. He walks down to the lounge.","At three in the morning the fourth-floor lounge is a different room: the blank whiteboard, a couch with a long dent in it like a grave, a vending machine humming one steady note his choir director at Mooney would have called a B-flat. In the corner armchair, under the one lamp, a girl in black is writing in a Moleskine.",{"if":"e1_met_margot_early","text":"She doesn’t look up. “Data point. You’re back. How was the porch? I sent you, so technically I have a stake.” “It was a porch.” “That’s a deflection with a roof on it.” Now she looks up, over the black frames. “Fine. Keep it. You’ve become relevant. Name.” “Jack Costigan.” “Margot Lindqvist.” She spells it once, flatly, the way a cop reads you your rights. “L-I-N-D-Q-V-I-S-T. There’s no *u* after the *q*. People who put a *u* after the *q* don’t get a second chance.”","else":"Her eyes go straight to his medal. “St. Michael. Patron saint of what, bouncers?” “He threw the devil out of heaven.” “So, bouncers.” “You smell like a kegger and you’re wearing a saint. Eventually you’ll have to pick one. Margot Lindqvist. Portland. Third floor. I don’t sleep.” She spells the surname once, flatly, the way a cop reads you your rights — L-I-N-D-Q-V-I-S-T — and waits. “Jack Costigan.” “That one I can spell.”"},"“Why are you on four?” “The lounge on three,” Margot says, “is occupied by a couple conducting an experiment in heteronormativity on the couch. Forty minutes so far. The methodology is extremely repetitive.” She tips her pen at the door. “Sock?” “Sock.” “Welcome to the diaspora.”","So he sits, and they talk the way you only can at three in the morning with somebody you have no reason yet to impress. Why would anybody be Catholic on purpose? Chesterton says the Church is a house with a hundred gates, he tells her, and he came in through the one with the smoking section. Youngstown? Springsteen, the mills, Nonna’s gravy, fast and funny. His father? “Built Chevy Cobalts. Now he builds a very detailed case against General Motors in the garage.”","Margot caps her pen. “You know you do that. Every time a question gets near anything load-bearing, you do a bit. It’s like watching a man put up drywall while he talks to you over it.” He laughs, which proves her point.","When he lies back on the couch, shivering in Delgado’s morgue-grade air-conditioning, she drops her black cardigan on his chest. “This is not a kindness. It’s a sociological gesture. Three-oh-five, by noon, or it’s a hostage situation.” Without it she seems exactly as warm as before, which is to say not very.","Then she caps the pen again, which he is learning means she’s serious. “You’ve quoted Chesterton and Bruce Springsteen at me inside of ten minutes, which is either a disorder or an education.” No joke anywhere in her face. “So explain to me how somebody who can talk like you believes in a cosmic patriarch with a documented animus against homosexuals.” She seems to mean it. From the look of her there are people standing behind the question, and she wants an answer good enough to take back to them."],"choices":[{"text":"“He doesn’t hate anybody. That’s the problem — He loves everybody and expects things from them.”","tag":"Candor","set":{"trait.candor":"+1","rel.margot.friction":"+1","rel.margot.trust":"+1","e1_margot_q":"loves"},"journal":[{"kind":"person","id":"margot","title":"Margot Lindqvist","text":"Portland. Third floor. Doesn’t sleep. Lent me her cardigan “as a sociological gesture.” Says she’s going to destroy me over the next four years. I believe her."}],"response":["“That’s what every abuser says.” “Yeah,” Jack says. “And every father.” She studies him. Then she writes it down, carefully, like somebody pinning a moth. “I’m going to destroy you over the next four years,” she says pleasantly. “I’m counting on it.”"],"goto":"s13b"},{"text":"“‘Cosmic patriarch’ is a little formal. At home we call Him ‘Dad’s Dad.’”","tag":"Wit","set":{"trait.wit":"+1","rel.margot.warmth":"+1","e1_margot_q":"joke"},"journal":[{"kind":"person","id":"margot","title":"Margot Lindqvist","text":"Portland. Third floor. Doesn’t sleep. Lent me her cardigan “as a sociological gesture.” Asked me a real question, then a follow-up. I had a bit for the question. I didn’t have one for the follow-up."}],"response":["She doesn’t laugh. She does write it down. Then she looks up. “Okay. Dad’s Dad. Last fall his people put Proposition 8 in parish bulletins all over this state. A friend of my mother’s flew down from Portland that summer to get married in San Francisco, and then spent six months waiting for a court to tell her whether it still counted.” She caps the pen. “Is that informal too?” He opens his mouth. Nothing in it is good enough, and they both watch him find that out. Margot nods once, a hypothesis confirmed, and goes back to her notebook."],"goto":"s13b"},{"text":"“I don’t know how to answer that at three in the morning without lying. Ask me again when I’ve slept.”","tag":"Sincerity","set":{"trait.sincerity":"+1","soul.honesty":"+1","rel.margot.trust":"+2","e1_margot_q":"later"},"journal":[{"kind":"person","id":"margot","title":"Margot Lindqvist","text":"Portland. Third floor. Doesn’t sleep. Lent me her cardigan “as a sociological gesture.” Asked me the one question I couldn’t joke my way past, so I didn’t try. She says she’ll ask again. I believe her."}],"response":["She looks at him over her glasses long enough for the vending machine to cycle off and on again. “That’s the first honest thing a Christian has said to me since Easter.” “Was Easter good?” “My father brought his girlfriend.” She turns a page, and that’s all of that, apparently. “Go to sleep, Costigan. I’ll ask again. I’m very persistent. It’s in my file.”"],"goto":"s13b"}]},"s13b":{"slug":"SUNDAY · 5:20 AM · DELGADO HALL, 4TH FLOOR LOUNGE","set":{"e1_saw_theo_dawn":true},"body":["He means to stay awake until she leaves. He doesn’t make it. At 5:20 by the RAZR the armchair is empty and the window is the gray of dishwater, and the stairwell door clanks, and Theo comes up the hall barefoot, boots in hand, sand to the ankles, jeans wet to the shin, smelling of salt and kelp and jasmine, like the fences in Las Olas. He sees Jack and stops. “Couldn’t sleep,” he says. “Went to look at the ocean.” “There’s a girl in our room.” “Is there?” Theo considers this. “God, I’m a good host.” He slips into 412 so quietly the door barely clicks.","At 7:02 Priya is standing over him with the air horn, which she does not use, and a freshly laminated sign, which she tapes above his head: LOUNGE FURNITURE IS NOT A SLEEPING SURFACE. Then she gets a look at his face and comes back with a paper cup of coffee from the RA office, which is terrible, and which he will remember for years. “Per the handbook,” Priya says, “I didn’t see you.”"],"journal":[{"kind":"note","id":"theo_dawn","title":"Theo, 5:20 a.m.","text":"Came in barefoot at 5:20, sand and wet jeans. “Couldn’t sleep.” There was a girl in our room."}],"next":"s14"},"s14":{"slug":"SUNDAY · 11:02 AM · ST. BRENDAN THE NAVIGATOR NEWMAN CENTER, COURTYARD","body":["By nine the sock was gone, and so was the girl, and Theo was asleep face-down across his white sheets like he’d been dropped from a plane. Now Jack crosses Ocean Road in the navy Goodwill blazer, hair still wet, stubble already coming in, two hours of sleep in him in installments, Margot’s cardigan left folded outside 305.","St. Brendan the Navigator sits at the edge of the Grove like a boat dragged up from the beach and flipped over to keep the rain off: a steep A-frame roofed almost to the grass, a band of blue glass, a courtyard with an olive tree gnarled as a grandfather’s hand.","Under the tree a priest in a black clerical shirt, sleeves rolled, rubber boots, is kneeling in the flower bed with a pipe wrench, losing a fight with a sprinkler; every time he tightens something it spits a fan of water across his collar. A wooden rosary swings from his belt. He says something to the sprinkler in a language Jack doesn’t know, in a tone Jack knows perfectly.","He looks up. Thin, a graying beard, laugh lines deep enough to hold rain. “You’re early,” he says, in an English that grew up somewhere hot and takes its time, “which means you’re new, or you’re in trouble. Hold this.” Jack is holding the wrench before he can decide which. “Both.” “Ah. Then hold it with both hands.”","The priest gets to his feet with a hitch in the left leg that he doesn’t mention, and Jack was raised not to. “Gabriel Osei. Kumasi, in Ghana, by way of a great many hospitals. I am the chaplain here, and the plumber, badly.” “Jack Costigan. Youngstown, Ohio.” Fr. Osei’s whole face lights. “Youngstown! I know Youngstown only from the Springsteen song. Is it as sad as he says?” “Sadder,” Jack says. “Better pierogi.” The laugh comes up from the belly, and a crow leaves the olive tree in protest.","The door of the parish hall opens on a small old woman in a lavender cardigan with an armful of bulletins. “Fr. Gabriel, you’re *wet*.” “I am aware, Mrs. Fitch.” She turns the full beam of her attention on Jack. “Young man. Are you the new tenor? Please say you sing.” She doesn’t wait for an answer. “We lost our best soprano last spring.”","Fr. Osei’s face doesn’t change at all. He takes the wrench back and returns to the sprinkler. Mrs. Fitch gives Jack a bulletin and a lemon bar in a napkin, the way his nonna hands out holy cards.",{"type":"doc","title":"St. Brendan the Navigator · Twenty-Second Sunday in Ordinary Time · August 30, 2009","text":"Confession: Sat 3:30–4:45 PM · Wed 8:00 PM · or whenever you knock (Fr. Gabriel)\nYEAR FOR PRIESTS: Please pray for our priests. St. John Vianney, pray for us.\nCOFFEE & DONUTS in the courtyard after the 9:30 and 11:30. The sprinkler is being addressed."},"A man the size of a vending machine crosses the courtyard in a polo with VERITAS stitched over the heart. “Tyler Brandt. Missionary. New guy?” “Jack Costigan. Youngstown.” Tyler’s face splits open. “*Ohio?* Brother. Cincinnati. St. X. Linebacker at Miami.” “Mooney.” “*Mooney.* We’d have killed you.” “You’d have tried.” The fist bump is like being fist-bumped by a door. “Brother. *Brother.* Coffee this week. Let’s talk about your prayer life.”",{"if":"e1_route==\"kitchen\"","text":"At the church doors Joey Abruzzo waves with both arms like he’s landing a plane, and Kevin Tran, in a maroon BELLARMINE quarter-zip, holds up a missalette: *saved*.","else":"At the church doors a kid in a Yankees cap waves at him with both arms like he’s landing a plane — “Joey Abruzzo! Staten Island!” — the way, Jack suspects, he waves at everybody. Beside him Kevin Tran, in a maroon BELLARMINE quarter-zip, holds up a missalette: *saved*."},"The courtyard is filling. Fr. Osei gets up out of the flower bed and looks at Jack’s eyebrow — not a glance; the frank, unhurried look a mechanic gives a dent, as if he can’t help it. “That was stitched in an emergency room by someone in a hurry,” he says quietly. “I was a doctor.” He tilts his head. “That’s a ring. Or a tooth.”","Jack has a story ready. He has a dozen."],"choices":[{"text":"“Nun with a ruler.”","tag":"Lie","set":{"soul.honesty":"-1","rel.osei.warmth":"+1","scar_told_osei":"nun"},"response":["“Ah.” Fr. Osei nods gravely. “The Sisters are very strong in Ohio.” Jack gets the distinct impression he doesn’t believe a word of it, and that he means Jack to see that; then he lets it go, which is somehow worse. “Confession is Saturday at three-thirty. Or whenever you knock. I am used to being woken.” Overhead the bell begins to ring, and he limps off to vest."],"goto":"s15"},{"text":"“A fight. A long time ago. Long story.”","tag":"Candor","set":{"trait.candor":"+1","soul.honesty":"+1","rel.osei.trust":"+2","scar_told_osei":"fight","e1_scar_osei_honest":true},"cue":"Fr. Osei noticed.","key":"You gave Fr. Osei a straight answer about the scar, and he didn’t push.","response":["Fr. Osei nods slowly, as though Jack has put something heavy in his hands and he is checking the weight. He doesn’t ask a single question, and Jack feels every one he doesn’t ask. “Long stories are the only kind worth telling,” he says. “Saturday at three-thirty. Or whenever you knock.” Then the bell starts, and he touches Jack’s shoulder once on his way past, the way you touch a doorframe in a house you know."],"goto":"s15"},{"text":"“You should see the other guy.”","tag":"Wit","set":{"trait.wit":"+1","rel.osei.warmth":"+1","scar_told_osei":"deflect"},"response":["Fr. Osei laughs, the whole belly laugh again. “I would like to,” he says. “Professionally. I’m curious what you did to him.” The laugh is real. So is the question folded inside it, and they both hear it, standing in the wet grass while the bell starts to ring."],"goto":"s15"}],"journal":[{"kind":"person","id":"osei","title":"Fr. Gabriel Osei","text":"Newman chaplain. From Kumasi, in Ghana. Used to be a doctor. Fixes his own sprinkler (badly). Limps and doesn’t mention it. Took one look at my eyebrow and knew more than I’ve told anybody."},{"kind":"note","id":"soprano","title":"Mrs. Fitch","text":"Parish hall, bulletins, lemon bars. “We lost our best soprano last spring.”"}]},"s15":{"slug":"SUNDAY · 11:30 AM · ST. BRENDAN THE NAVIGATOR NEWMAN CENTER, NAVE","set":{"resolve.lena":8,"resolve.jack":"+1"},"body":["Inside, St. Brendan’s is the inside of a boat: Douglas-fir ribs curving up out of the floor to meet in a long keel overhead, blue light through the glass like light through water, and over the altar a crucifix carved from driftwood, split along the grain — a Christ the sea gave back. Jack has been in a hundred churches. He has never been in one that looked like it might float.","The 11:30 is the grown-up Mass: families from town, grad students, freshmen pretending they meant to come. Kevin has saved him the end of a pew, Joey on his far side, and when the organ opens up — “Praise to the Lord, the Almighty” — Joey sings it a third too loud and half a measure ahead, as if there’s a prize for finishing first. “The Lord be with you.” “And also with you.” Jack’s mouth knows the words the way his hand knows the light switch in his room on Glenwood.","“Peter Haddad,” Kevin murmurs, as a junior with perfect hair goes up to the ambo. “Newman president. His Facebook says ‘future congressman.’ He wrote it himself.” Peter reads Deuteronomy like a stump speech and leaves a little room after it, in case of applause. The cantor sings the psalm — *The one who does justice will live in the presence of the Lord* — in a voice that could make a rock cry. “Kenzie Rourke,” Kevin whispers. “His girlfriend. It’s all on the Newman Facebook page; Joey printed it. They give a chastity talk in a few weeks. There’s a PowerPoint.” His face stays devout. “It has clip art.” Then St. James: *Be doers of the word and not hearers only.*","They stand for the Gospel. As the Alleluia starts up in the loft, a girl three pews ahead across the aisle turns to look up at the choir. She is wearing a black lace mantilla, the kind of veil that draws looks even here. Under it, honey-brown hair. At her throat, a gold medal on a thin chain.","It’s Lena.","His whole body does something at once — stomach, face, the back of his neck — like missing a stair in the dark. *Oh, no.* The Christmas-and-Easter girl. He had her figured. Beside him Kevin follows his look across the aisle, then goes back to his missalette. She hasn’t seen him.","Fr. Osei reads the Gospel himself, green vestments over the shirt the sprinkler got. *This people honors me with their lips, but their hearts are far from me.* Then he preaches without notes, down at the front of the aisle with his hands folded, like a doctor at the foot of a bed. “I was a doctor for eight years. Doctors know what Jesus is saying today. What kills you is rarely what goes in. It is what is already inside — quietly, for a long time — and we are very good at not looking.”","A baby fusses somewhere behind Jack; Fr. Osei waits for it, as if the baby has a point. “Yesterday in Boston the Church sang a funeral Mass for a man some of you think was a lion and some of you think was a scandal. I am told a priest must have an opinion. Here is mine. I am very glad I am not his judge.” He lets the church be quiet. “I am less glad that I have the same one.”","“Out there” — a nod at the doors, at Ocean Road and the whole bright campus beyond it — “they will tell you the rules are lip service. In here, some people will tell you the rules are everything. Jesus disappoints both. He wants your hands clean *and* your heart. He will settle for your heart first.” A pause. “He will not settle for your lips.”","He ends with St. James — in a university, the widows and orphans are the ones sitting alone in the dining hall; you know who they are; go — and sits down. The homily is shorter than the announcements will be.","Then everyone kneels, and the church goes as quiet as a church can get with a baby in it. Fr. Osei lifts the host over the altar in both hands, small and white against the driftwood, and the bells ring. Three pews up across the aisle, a black lace veil bows. Jack bows his head too. He has about as long as the bells last."],"choices":[{"text":"Pray for Dad, somewhere in New Mexico, asleep in the truck at a rest stop or driving on four hours of it.","set":{"soul.grace":"+1","resolve.jack":"+1","e1_mass_prayer":"dad"},"key":"At Mass you prayed for your father on the road home.","response":["*Keep him awake on the road*, Jack prays. *Keep him asleep when he pulls over.* He can see it: the Silverado in a rest area outside some New Mexico town with one exit, the pillow from the hall closet, the St. Christopher on the visor doing the job Frank took it back for. *He gave me the forty. You saw. Get him home.*","It isn’t eloquent. It’s how he’d talk to somebody in the next room. And something in his chest loosens a notch, the way it does sometimes, for no reason he could defend to a philosophy department."],"goto":"s15b"},{"text":"Pray for Danny.","set":{"soul.grace":"+1","e1_mass_prayer":"danny","resolve.jack":"+1"},"key":"At Mass you prayed for Danny.","response":["There’s only one prayer for Danny, and it’s short. *Keep him.* Jack says it into his folded hands, and when it runs out he says it again, the same words, like leaning on a door that keeps trying to swing shut. *Keep him. Keep him.*","That’s all there is of it. He doesn’t go any further in than that."],"goto":"s15b"},{"text":"Pray for the girl three pews up — and then for yourself, since you’ve clearly lost your mind.","set":{"soul.grace":"+1","rel.lena.heat":"+1","e1_mass_prayer":"lena","resolve.jack":"+1"},"key":"At Mass you prayed for the girl three pews up.","response":["*Lord*, he begins, *whoever keeps calling that phone she won’t answer* — and stops, because he has no idea; for all he knows it’s her dentist. *Whatever it is. Bless her. Keep her.*","And then, because it’s the elevation and lying now would be extremely poor form: *And me. Since I’ve clearly lost my mind. I had her down for Christmas and Easter. She’s wearing a mantilla, Lord. You must have enjoyed that.* Kneeling there, he’s nearly sure Somebody did."],"goto":"s15b"},{"text":"Let your mind drift back to the porch.","set":{"soul.grace":"-1","soul.restraint":"-1","e1_mass_prayer":"drift"},"key":"At Mass your mind went back to the porch.","response":["He means to pray. He gets as far as bowing his head, and then he’s back on the porch: the light clicking off, the wet rail under his hands, her sleeve an inch from his wrist, jasmine, the sound of her breath going in and holding. He stays there a while. It is very vivid.","Somewhere a long way off the second bell rings for the chalice, and he hears it the way you hear a phone ringing in somebody else’s apartment, and doesn’t look up."],"goto":"s15b"}]},"s15b":{"slug":"SUNDAY · 12:16 PM · ST. BRENDAN THE NAVIGATOR NEWMAN CENTER, NAVE","body":["“Let us offer each other the sign of peace.” There’s a memo from the diocese about the flu that says to bow instead, and nobody at the 11:30 has read it. Jack shakes Kevin’s hand, and Joey’s, which is like being greeted by a golden retriever, and the hand of the woman behind him, who smells like Jergens and says *Peace be with you, honey* exactly the way his nonna does. When he turns back around, Lena is looking straight at him across the aisle, over Kevin’s shoulder. Her mouth makes the exact shape of *oh, no*. She turns, very correctly, and offers peace to the old man beside her, his hand in both of hers. She does not look back.","She looks back.",{"if":"e1_mass_prayer==\"drift\"","text":"She catches him at it. He hasn’t stopped looking since the Peace, and all through the Lamb of God he doesn’t get much further than the back of her veil."},"At Communion the choir sings “I Am the Bread of Life,” John 6 and the promise about the last day, and by some failure of planning, or none, Jack ends up in the aisle directly behind her: close enough to see roses in the lace, and a thread pulled loose at the edge. At the front she kneels on the floor in her sundress and receives on the tongue, the old way, and he can feel the looks it draws — curious, a few of them not kind. Then it’s his turn, and he receives standing, in his hand, the way he has since second grade at St. Brigid’s. Two ways of doing the same thing. He notices both.","“Lift High the Cross,” and Joey going for the high note with real violence. In the slow shuffle toward the doors Lena slips out of line into the side aisle, the mantilla off now and folded over her wrist, and goes to the Marian shrine: a plaster Our Lady in a chipped blue mantle above a rack of red votives. She lights one, kneels about as long as a Hail Mary takes, and slides back into line just ahead of him without once looking at him, which takes some doing.","As the line carries him past the shrine he sees, under the votive rack, a small brass plate screwed into the wood, the kind parishes put on pews and windows for their dead: NORA GRACE CALLOWAY · 1989–2009 · “LORD, TO WHOM SHALL WE GO?” A student, then. Somebody’s daughter, not much older than he is. Lena’s candle burns right above it, the newest flame in the rack. Then the line moves, and he’s past it.","Fr. Osei is at the doors in his green vestments, shaking hands, a pump bottle of Purell behind him on a card table, new since the flu. When Lena reaches him he takes her hand in both of his, warmly, as if picking up a conversation in the middle. “Magdalena. You came back.” “I told you I would, Father.” Jack is right behind her. He hears every word. Then she’s out into the courtyard sunlight, and Fr. Osei has Jack’s hand. “The sprinkler thanks you,” he says, and passes him along into the light."],"next":"s16","journal":[{"kind":"person","id":"lena","title":"Lena Broussard","text":"New Orleans. Magdalena to her mother, the Holy Ghost and Laney. Mass at St. Brendan’s, 11:30. Black lace mantilla. Kneels for Communion. Fr. Osei knew her name: “You came back.” So she’s been here before. So she’s not a cultural Catholic. So I’m an idiot."},{"kind":"clue","id":"plaque","title":"A plaque at the shrine","text":"Small brass plate under the candles: NORA GRACE CALLOWAY, 1989–2009. “Lord, to whom shall we go?” Somebody’s daughter."},{"kind":"note","id":"newman","title":"St. Brendan’s","text":"The roof is an upside-down boat. The lector reads Deuteronomy like he’s running for Congress. The cantor could make a rock cry."}]},"s16":{"slug":"SUNDAY · 12:41 PM · ST. BRENDAN THE NAVIGATOR NEWMAN CENTER, COURTYARD","duel":"lipservice","set":{"duel.lipservice.lena":"+1","e1_lena_knows_surname":true,"e1_knows_same_dorm":true},"body":["Coffee and Donuts happens in the courtyard whether anybody wants it or not: folding tables under the olive tree, Costco donuts sweating in their clamshells, an urn that has been burning the same coffee since the 9:30. The sprinkler Jack held the wrench for is still broken, hissing at the flower bed, and a toddler in a clip-on tie is trying to catch it with his mouth.","She’s by the olive tree: navy dress with small white flowers, the oatmeal cardigan, the brown boots, the black lace folded over her wrist like a waiter’s towel. She sees him coming and doesn’t pretend she hasn’t.",{"if":"rel.lena.friction>=2","text":"Whatever she decided about him last night, she hasn’t undecided it. Her chin comes up a quarter inch as he crosses the flagstones."},{"if":"rel.lena.friction<=1 && rel.lena.warmth>=2","text":"Something at the corner of her mouth gets there before the rest of her face can stop it."},"“Sweet suffering Saint Sebastian,” she says. “You’re real.” “You’re *Catholic*.” “*You’re* Catholic.” “I wear a medal.” “*I* wear a medal.” They point their coffees at each other’s throats, a standoff in a very small Western.","Joey Abruzzo drifts toward them with a maple bar — “Jack! Who’s your —” — and Kevin, without breaking stride or smile, steers him back to the donuts by the elbow.","Across the courtyard Tyler Brandt cups his hands to his mouth. “COSTIGAN! *OHIO!*” Jack lifts a hand. “Costigan,” she says, reading it off him like the name on a summons.","“At the door,” he says. “Father Osei. ‘You came back.’” “Preview weekend. In April.” Brisk, a fact handed across a counter, and nothing after it.",{"if":"e1_after==\"cove\"","text":"“Where are they keeping you?” she asks. “Delgado.” She stares at him. “You’re *kidding*.” “Four twelve.” “Two seventeen.” She narrows her eyes as though he arranged it with Housing. “Don’t get ideas. It’s a big building.” It is not a big building."},{"if":"e1_after==\"walked\"","text":"“Laney says thank you,” she tells him. “Laney also says you smell like eucalyptus, but she was horizontal at the time, so it doesn’t count.”"},"“You were rolling your eyes at the homily.” “I was not —” “I don’t care if you were. Y’all love Mark 7. Every boy who ever slept through a holy day of obligation loves Mark 7.” She sets the coffee on a folding table and pushes the cardigan sleeves up to her elbows. It’s twelve-forty on a Sunday and she’s rolling up her sleeves.","“Jesus isn’t against washing your hands, Costigan. He’s against confusing washed hands with a clean heart. Read verse eight. They *disregard* God’s commandment and *cling to* human tradition. The problem isn’t the form. It’s the swap.” She ticks it off on her fingers. “Aristotle, *Ethics*, book two: we become just by doing just things. You don’t feel your way into virtue, you *practice* your way. The heart’s a muscle. It does what it’s trained to do. Your move, Youngstown.”"],"choices":[{"text":"Isaiah, which Jesus is quoting: “Their hearts are far from me.” He’s worried about people who do the forms perfectly and feel nothing.","tag":"Press","set":{"duel.lipservice.rigor":"+1","rel.lena.friction":"+1"},"response":["“He’s quoting Isaiah,” Jack says. “*This people honors me with their lips, but their hearts are far from me.* He’s not worried about people who skip the forms. He’s worried about people who do them perfectly and feel nothing.” A nod at the blazers, the pearls, a man checking a ball score on his BlackBerry. “That’s most of this courtyard.”","She gives him the citation with a tip of the cup and takes the ground out from under it. “Sure. And the cure for a cold heart is *more* lips, not fewer. You keep praying until the prayer prays you.”"],"goto":"s17"},{"text":"“Says the girl in the veil.”","tag":"Riposte","set":{"duel.lipservice.wit":"+1","rel.lena.heat":"+1","rel.lena.friction":"+1"},"response":["She doesn’t blink. She holds up the wrist with the lace folded over it, as if showing him a badge. “Yes. Says the girl in the veil. Is that your argument, or your opening position on my accessories?”"],"goto":"s17"},{"text":"“Aristotle’s right. I’d be a worse man without Sunday obligation. I know because I’ve tested it.”","tag":"Concede","set":{"duel.lipservice.heart":"+1","rel.lena.trust":"+1","rel.lena.warmth":"+1"},"response":["He isn’t supposed to give her a point in the first minute. She stops with the cup halfway to her mouth, like a fencer whose opponent has lowered his sword to ask her the time. “Okay,” she says, recalibrating. “Okay, Youngstown.”"],"goto":"s17"},{"text":"Augustine: *Dilige, et quod vis fac.* Love, and do what you will. Get the love right and the forms follow.","tag":"Reframe","set":{"duel.lipservice.rigor":"+1","rel.lena.warmth":"+1","duel.lipservice.lena":"+1"},"response":["“*Dilige, et quod vis fac.* Love, and do what you will. Get the love right and the forms follow.” He’s pleased with the Latin. He shouldn’t be.","“Augustine said that about *correcting* people,” she says, delighted, “in a homily on First John. It’s about discipline. It is not a permission slip, and you know it.” She leans in an inch. “I can *see* you know it.” He does. She can."],"goto":"s17"}]},"s17":{"slug":"SUNDAY · 12:49 PM · ST. BRENDAN THE NAVIGATOR NEWMAN CENTER, COURTYARD","duel":"lipservice","set":{"duel.lipservice.lena":"+1"},"body":["She doesn’t wait for the coffee to cool. “Pascal,” she says. “You know Pascal.” “I know Pascal.” “Then you know what he tells the man who wants to believe and can’t. Go and do what the believers do. Take the holy water. Have Masses said. *Cela vous abêtira.*” The French comes out in a New Orleans accent, which is unfair. “It’ll make you stupid. The good stupid. The body leads; the soul follows.”","She points the cup at his face. “You came to Mass this morning on no sleep — don’t argue, your eyes look like a pair of bruised peaches —” “Two hours.” “— on two hours of sleep, thank you for the testimony, and your heart was not in that building. I watched you from the sign of peace on. You looked like a man waiting on a bus.”",{"if":"e1_mass_prayer==\"drift\"","text":"“And all through the Lamb of God you were looking at the back of my veil, not the altar. I looked back. I saw.” He opens his mouth. He can’t deny it, and she watches him not be able to.","else":"“But your knees were there. I saw them. That counts.”"},"“That’s not hypocrisy,” she says. “That’s *showing up*. Half of faith is showing up hungover.”",{"if":"!e1_flask && !e1_beerpong && !e1_vodka","text":"“I’m not hungover.” “Then you have no excuse for those eyes at all, and I’m counting it double.”"}],"choices":[{"text":"Kierkegaard: a whole nation baptized and nobody a Christian. “When the form is all you’ve got, you end up with Denmark. Or Boston yesterday.”","tag":"Press","set":{"duel.lipservice.rigor":"+1"},"response":["“Kierkegaard. A whole country baptized, married and buried in church, and he can’t find one Christian in it. When the form is all you’ve got, you end up with Denmark.” He lets it sit. “Or Boston yesterday.”","Her eyes light up like he’s handed her a match. “Oh, you want to do the funeral? Let’s do the funeral.”"],"goto":"s18"},{"text":"“So my hangover’s a sacramental now.”","tag":"Riposte","set":{"duel.lipservice.wit":"+1","rel.lena.warmth":"+1"},"response":["“Your hangover is a *penance*, Costigan. Offer it up.” A passing grandmother nods. Then Lena brings up Boston herself, the way you’d bring a bigger knife to the table."],"goto":"s18"},{"text":"“Fine. I showed up because my body knew the way when I didn’t. That’s — yeah. That’s real.”","tag":"Concede","set":{"duel.lipservice.heart":"+1","rel.lena.trust":"+1"},"response":["He doesn’t take it back. Some mornings in Youngstown his feet walked him to the 6:30 at St. Brigid’s while the rest of him was still arguing.","When she answers it’s in a different voice, lower, with no performance in it. “That’s the whole thing. That’s all it is, most days.” Then she smooths her face over like a tablecloth. “Anyway,” she says. “Boston.”"],"goto":"s18"},{"text":"“You wear that veil so people will look at you.”","tag":"Personal","cue":"Lena will remember that.","set":{"duel.lipservice.wit":"+1","duel.lipservice.lena":"+1","rel.lena.friction":"+2","rel.lena.trust":"-1","e1_duel_personal":true},"response":["He knows it’s a good shot while it’s still leaving his mouth, and a half second later he knows what kind.","She doesn’t look wounded; that’s the frightening part. She looks at him, very level. “People look either way, Jack. This way I decide what they’re looking at.”","*Jack*, not *Costigan*. She folds the mantilla once, twice, and puts it in her bag."],"goto":"s18"}]},"s18":{"slug":"SUNDAY · 12:56 PM · ST. BRENDAN THE NAVIGATOR NEWMAN CENTER, COURTYARD, BY THE OLIVE TREE","duel":"lipservice","set":{"duel.lipservice.lena":"+1"},"body":["So they do the funeral, under the olive tree, with the courtyard emptying around them like a theater after the lights come up.",{"if":"e1_duel_personal","text":"She argues now with her sleeves still pushed up and none of the fun left in her face. “Costigan,” when she uses it, is flat as a tabletop."},"“Here’s my problem with yesterday,” Jack says, and finds out as he says it how much he has one. “A cardinal in the sanctuary. A president at the ambo. Every honor the Church can give a public man, on live television, for a man who voted for decades against what she teaches about the unborn and never took it back where anyone could hear. And we’re told that’s mercy.” His hands are going now, his father’s kitchen-table hands. “Aquinas: scandal is giving somebody the occasion to fall. Canon law even has a line for it — you can refuse a church funeral to a manifest sinner if you can’t give him one without public scandal. It’s in the book. Nobody opened the book. Mercy isn’t a red carpet.”","She lets him finish. That’s how he knows he’s in trouble.","“The Church buries sinners, Costigan,” she says. “That’s the *job*. It’s the only club on earth that throws the funeral for the members who failed. The rite isn’t an award. It’s the Church on her knees asking God to do what she can’t.” She turns the cup in her fingers. “We don’t know his heart. He wrote to the Pope.” She leaves that exactly where it is. “My grandmother would’ve said you bury everybody, and you bury them in the good dress.”","She says the last part plainly, to the coffee, which has gone cold. She drinks it anyway.","Then he hears it. The forms girl, the practice-your-way-to-virtue girl, arguing that only God can see a heart — and under it, worse, his own voice, the heart man, asking for a bouncer at a funeral. Her eyes narrow at nothing; from her face, she’s heard it too. They’ve swapped sides of the courtyard."],"choices":[{"text":"Spring it first. “You just argued the heart over the form. Welcome to my side of the courtyard.”","tag":"Press","set":{"duel.lipservice.rigor":"+2","rel.lena.friction":"+1"},"response":["She opens her mouth. She closes it. He watches her run the argument back twice, looking for the hole, and not find one. “Oh, you *jagoff*,” she says, delighted, his own word coming back from the porch with a Louisiana accent and interest."],"goto":"s19"},{"text":"Give her the funeral. “You bury everybody. My nonna would say the same — and then say one rosary for him and one for the cardinal.”","tag":"Concede","set":{"duel.lipservice.heart":"+2","rel.lena.warmth":"+1","rel.lena.trust":"+1"},"response":["“And she’d make the cardinal’s longer,” Jack adds.","He can see her holding the trap, spring wound; she could spring it. Instead she sets it down on the flagstones and steps over it, and he sees her do it, and from her face she knows he saw."],"goto":"s19"},{"text":"“So your position is mercy for senators and holy water for my hangover.”","tag":"Riposte","set":{"duel.lipservice.wit":"+1","rel.lena.heat":"+1"},"response":["“My position,” she says, pushing off the olive tree, “is that you’re *both* sinners, and I’m only obligated to pray for one of you.” She lets him wonder which one all the way to the gate."],"goto":"s19"},{"text":"Mark 7:21: what comes *out* of a man defiles him. Judge the public act, not the soul. “We’re both right, and we’re both being Pharisees about it.”","tag":"Reframe","set":{"duel.lipservice.rigor":"+1","duel.lipservice.heart":"+1"},"response":["She gives him a long look, like a painting she walked past twice without noticing. “That’s annoyingly good. Who taught you that?” “My nonna. And Aquinas.” “In that order?” “She’s scarier.”"],"goto":"s19"},{"text":"Tell her what your father said in the truck yesterday.","tag":"Sincerity","if":"trait.sincerity>=2","set":{"duel.lipservice.rigor":"+1","duel.lipservice.heart":"+1","rel.lena.warmth":"+1","rel.lena.trust":"+1"},"response":["“Yesterday morning the radio was doing the funeral,” Jack says, “and my dad drove a mile and said, ‘He was our guy.’ Another mile. ‘And he was wrong about the babies.’ That was the whole eulogy.”","She laughs, and then she doesn’t. “That’s the argument,” she says. “Your daddy did it from the driver’s seat.” “He’d hate that you said *daddy*.” “Tell him a girl from New Orleans says he’s right *and* wrong.” She means it to be delivered, and Jack can already hear himself delivering it."],"goto":"s19"}]},"s19":{"slug":"SUNDAY · 1:04 PM · OCEAN ROAD, THE 11 BUS TO THE HARBOR","duel":"lipservice","music":"Regina Spektor — “Laughing With”","body":["Somehow they’re out the gate and at the bus shelter on Ocean Road with the argument still running, like a car neither of them remembered to turn off. Jack coughs, the morning rasp, and she’s on it before it’s finished.","“That’s a smoker’s cough, Mr. Heart,” she says. “My daddy’s whole kitchen sounds like that by Friday. Physician, heal thyself.”","Her phone buzzes. She reads, closes her eyes long enough to ask God for patience, and holds it out.",{"type":"sms","from":"Laney","text":"bring me grease or bury me. the anchor. sloane dropped me. im wearing sunglasses indoors like a celebrity","time":"1:02 PM"},"The 11 sighs up to the curb. “Where’s the Anchor?” “The harbor. Three miles. Laney says the pancakes raise the dead.” She climbs on. They’re not done, so he climbs on after her and holds out a twenty, which is all he has; the driver looks at it like a dead fish. Lena drops coins in the box for him without turning around. “You owe me bus fare, Youngstown.”","They take the back bench. Across the aisle a woman with a mesh bag of oranges gives up pretending to look out the window and settles in to listen, like they’re her program.",{"if":"duel.lipservice.rigor>=3","text":"Lena watches the road for two stops. Then: “Okay. That was good.” She doesn’t look at him. “Don’t let it go to your head. It’s crowded in there.” Her eyes go back to the glass like she’s already rereading Aquinas on scandal, hunting for the place he cheated, and he’d bet the twenty she’ll be up until two doing it."},{"if":"duel.lipservice.heart>=3","text":"“Draw,” she says. “I’m calling it a draw, and if you argue with me I’ll take it back.” He doesn’t argue. The bus stops; nobody gets on. Then, plainly, looking at the oranges and not at him, she says: “My grandmother died in the storm. In ’05.” Her hands are in her lap. He doesn’t push. The woman across the aisle, to her eternal credit, looks out the window."},{"if":"duel.lipservice.wit>=2 && duel.lipservice.rigor<=2 && duel.lipservice.heart<=2","text":"“You argue like a man who’s going to lose a lot of money at cards,” she says. “I argue like a man who’s going to win it back.” “That’s what they all say in New Orleans, Costigan. Right before they sell their car.” The woman with the oranges laughs out loud."},{"if":"duel.lipservice.rigor>=2 && duel.lipservice.rigor<=2 && duel.lipservice.heart>=2 && duel.lipservice.heart<=2 && duel.lipservice.wit<=1","text":"Lena studies the seat back in front of her for a stop and a half. “Even,” she says at last, to the window. “Don’t smile. I don’t say *even*. I haven’t said *even* since an eighth-grade speech tournament, and I said it to a Jesuit.” The woman with the oranges looks from one of them to the other like she’s at a tennis match. “Next Sunday,” Lena says, “we break the tie.” For one unguarded second she sounds like she’s looking forward to it."},{"if":"duel.lipservice.rigor<=1 && duel.lipservice.heart<=2 && duel.lipservice.wit<=1 || duel.lipservice.rigor<=2 && duel.lipservice.heart<=1 && duel.lipservice.wit<=1","text":"Gracious and merciless: “Better luck next Sunday, Youngstown.” She says it like next Sunday is already written down somewhere. It is, he realizes. It’s written down on his."},{"if":"e1_duel_personal && duel.lipservice.rigor>=3","text":"Then, still to the window: “Part of it was also cheap. And you know which part I’ll remember.”"},{"if":"e1_duel_personal","text":"She sits an inch farther away than the bench requires. The mantilla stays folded in her bag."}],"choices":[{"text":"Let the argument rest. Ask her about Laney.","response":["“How long have you known her?” “About a day and a half.” Lena watches Mission Street go by: palms, a shoe store with EVERYTHING MUST GO soaped across the glass. “I’d walk into traffic for her. Don’t tell her. She’d want it in writing.” At the harbor stop he can hear the sea lions before the doors open, like a chorus of old men who’ve all been shortchanged at once."],"goto":"s20","set":{"rel.lena.warmth":"+1"}},{"text":"Give her the last word anyway.","tag":"Gracious","if":"duel.lipservice.rigor>=3","set":{"rel.lena.warmth":"+1","rel.lena.trust":"+1"},"response":["“Fine,” he says. “You were right about Pascal.” “I’m right about everything, Costigan.” She stands as the bus brakes at the harbor. “You were right about *one* thing.” She says it to the door, but she says it."],"goto":"s20"},{"text":"Don’t say anything. Just sit with it until the harbor.","tag":"Quiet","if":"duel.lipservice.heart>=3","set":{"rel.lena.trust":"+1","soul.restraint":"+1"},"key":"Lena told you her grandmother died in the storm, and you let it be.","response":["He doesn’t say *I’m sorry*, or *What happened*, or anything with a joke folded into it. He sits with his hands on his knees and lets it be the size it is. Two stops of quiet, and it isn’t empty; it has her in it.","At the harbor she stands, and at the top of the steps she says, “Thank you,” and doesn’t say for what."],"goto":"s20"},{"text":"“Rematch. Best of seven. Loser buys the pancakes.”","tag":"Riposte","if":"duel.lipservice.wit>=2 && duel.lipservice.rigor<=2 && duel.lipservice.heart<=2","set":{"rel.lena.heat":"+1"},"response":["“Best of seven?” She looks at him the way you’d look at a man proposing to swim to Catalina. “You’ll be dead by four.” “I’ll offer it up.” The orange lady pats his arm on her way off, like he’s going to need it."],"goto":"s20"},{"text":"Tip an imaginary hat. “Next Sunday, Broussard.”","tag":"Concede","if":"duel.lipservice.rigor<=1 && duel.lipservice.heart<=2 && duel.lipservice.wit<=1 || duel.lipservice.rigor<=2 && duel.lipservice.heart<=1 && duel.lipservice.wit<=1","set":{"rel.lena.warmth":"+1","rel.lena.heat":"+1"},"response":["She tries not to smile at *Broussard*, and fails at one corner, and turns to the window so he won’t see."],"goto":"s20"},{"text":"“Even. I’ll take even.”","tag":"Concede","if":"duel.lipservice.rigor>=2 && duel.lipservice.rigor<=2 && duel.lipservice.heart>=2 && duel.lipservice.heart<=2 && duel.lipservice.wit<=1","set":{"rel.lena.warmth":"+1","rel.lena.trust":"+1"},"response":["“Don’t take it,” she says. “Earn it back.” But she doesn’t look at the window this time. She looks at him, and holds it a second longer than the argument needs."],"goto":"s20"},{"text":"Offer to buy Laney’s pancakes “as reparations for Erie.”","tag":"Charm","if":"trait.charm>=1","set":{"rel.lena.warmth":"+1","rel.laney.warmth":"+1"},"response":["“I’ll get Laney’s pancakes,” he says. “As reparations for Erie.”",{"if":"scar_told_lena==\"husband\"","text":"“Erie owes *me*,” she says. “I sat through that husband.” But the corner of her mouth gives her away for a block.","else":"“What happened in Erie?” “Long story.” He considers. “Possibly a husband.” She lets it go, and looks like she’d rather keep wondering."}],"goto":"s20"}]},"s20":{"slug":"SUNDAY · 1:31 PM · THE ANCHOR, MARISOL HARBOR","set":{"resolve.lena":6},"body":["The Anchor sits at the end of the wharf past the fish market, a long low diner with windows it has been breathing on for forty years. Red vinyl booths patched with red tape, Formica, chrome stools that spin, a pie case lit up like a jewelry counter. The jukebox is Sinatra, Otis, Patsy Cline, the Eagles and, for no reason anyone has explained, one Mariah Carey. Under the floor the sea lions keep up their complaint.","The waitress has a pencil in a gray bun, a name tag that says GLORIA, and the look of somebody who’s been on her feet since yesterday. “Sit anywhere, hon.”","Laney is in a booth near the back in sunglasses the size of hubcaps, copper hair in a knot that has given up. “Don’t look at me,” she says. “I’m a cautionary tale.” She presents herself with one limp hand, like a pageant host bringing out a contestant. “Delaney Price, eighteen, Highland Park. Enjoys Jell-O and regret.”",{"if":"e1_carried_laney","text":"Then she sees who’s behind Lena and throws both arms in the air. “My *fireman!*”"},{"if":"!e1_carried_laney && e1_met_laney_early","text":"Then she lowers the sunglasses an inch. “Sad Irish Poem! You found her *again*?”"},{"if":"!e1_carried_laney && !e1_met_laney_early","text":"Then she lowers the sunglasses an inch and looks Jack up and down. “Lena, who *is* this? Is this the porch one?”"},"“This is Jack,” Lena says. “He’s from Ohio. He’s leaving.” He doesn’t leave.","The chalkboard by the register says PIE OF THE DAY: MARIONBERRY. Jack studies the slice in the case, the sunken filling, the pale, apologetic crust. “Four out of ten,” he says. “My dad would complain.” Gloria, passing with the coffeepot, looks at him again, and writes something on her pad that is clearly not an order.","And then he sees the back booth, and stops.","A tall man alone with the Sunday *New York Times* spread across the table in sections, like a campaign map. Silver hair swept back and too long. A linen jacket with wine on the cuff. Reading glasses pushed up on his head and forgotten. Eggs, half eaten; a Bloody Mary, mostly not. The face is ruddy and broken-veined and still handsome the way a ruined church is still a church, and Jack knows it, because at sixteen he stared at it on the back flap of *The Consolations of Disbelief* for most of an hour, trying to work out how a face could be that sure. Adrian Hale is eating eggs in a diner like anybody else. Jack’s heart vaults the counter.","Laney’s booth is the one next to his. Lena slides in across from her, facing the back. Jack is still standing in the aisle with a menu, close enough to Hale’s table to read it.","On the near corner the magazine lies folded back on itself, open to a long article. Lena sees it. She stops moving. All of her stops at once, like a held note cut off. Her hand comes up and finds the medal at her throat and closes around it.","Jack follows her eyes and catches a word of the headline upside down: MEMORIAL.","“I’m going to —” Lena says, perfectly normally, and stands. “Laney, I’ll see you at home.” She puts a five on the table for a coffee she never touched and walks out through the jangle of the door into the bright wharf. She doesn’t hurry. That’s the strange part. She walks like someone going to get the mail.","“Lena?” Laney half stands, sunglasses sliding. “*Lena.*” The door has finished swinging. Laney sits back down. “She told me she does this. Said if she ever walks out of somewhere, she’ll come home in a mood and make red beans.” She picks up her fork. “I thought it was a figure of speech.”"],"journal":[{"kind":"person","id":"hale","title":"Prof. Adrian Hale","text":"Wrote *The Consolations of Disbelief*. Wrote me a postcard. Was eating eggs at the Anchor on a Sunday afternoon with a Bloody Mary and the *Times*. Haven’t said a word to him yet."},{"kind":"note","id":"pie","title":"The Anchor","text":"Marionberry: four out of ten. Dad would complain."}],"choices":[{"text":"Follow her out.","tag":"Go","set":{"e1_diner":"followed","rel.lena.trust":"+1"},"key":"You followed Lena out of the Anchor.","goto":"s20a"},{"text":"Go introduce yourself to Adrian Hale.","tag":"Go","set":{"e1_diner":"hale","trait.sincerity":"+1","rel.hale.trust":"+1"},"key":"You walked up to Adrian Hale’s booth.","goto":"s20b"},{"text":"Stay. Eat. Laney needs a witness.","tag":"Stay","set":{"e1_diner":"stayed","rel.laney.warmth":"+1","rel.laney.trust":"+1"},"key":"You stayed at the Anchor with Laney.","goto":"s20b"}]},"s20a":{"slug":"SUNDAY · 1:38 PM · MARISOL HARBOR, THE WHARF","body":["He finds her halfway down the wharf at the railing over the float, where the sea lions are piled up like tourists on a cruise deck, one big bull with his head thrown back, bellowing at the boats. The wind off the water is cold even in the sun. She has her arms crossed over the cardigan, and she doesn’t turn when his footsteps stop beside her.","“Allergies,” she says, before he can ask anything. “Eucalyptus.” Her fingers go to the medal and hold it, then let it go.","The wharf smells like diesel and fish scales and wet sea lion. A fishing boat is coming in past the breakwater, gulls hanging off its stern like a bad idea. She watches it all the way in. It’s the quietest he’s seen her, and he has known her less than a day, and he’s already sure it isn’t like her."],"choices":[{"text":"Don’t ask. Stand next to her. Take out a cigarette — and don’t light it.","tag":"Control","set":{"trait.control":"+1","soul.restraint":"+1","rel.lena.trust":"+2","reliquary":"+1"},"journal":[{"kind":"note","id":"cigarette","title":"The cigarettes","text":"She keeps them. The ones she takes off me. She took this one and didn’t light it."}],"response":["He leans on the rail beside her, not too close, shakes out a Marlboro and holds it unlit, the way a man holds a pen he isn’t going to sign with. Neither of them says anything. The boat ties up. Somebody starts hosing down a cooler.",{"if":"e1_lena_took_cig","text":"After a while she reaches over without looking and takes the cigarette from between his fingers and drops it into her cardigan pocket, with the other one. He realizes she never emptied the pocket.","else":"After a while she reaches over without looking and takes the cigarette from between his fingers and drops it into her cardigan pocket, all by itself, as if that’s where it was always going."},"“I’m fine, Jack,” she says to the water. “I’m from New Orleans. Fine is what we do.”"],"goto":"s21"},{"text":"“What did you see on that table?”","tag":"Candor","set":{"trait.candor":"+1","rel.lena.friction":"+1","rel.lena.trust":"-1","e1_asked_about_table":true},"response":["She turns, and her face is pleasant, attentive, completely closed: a girl at a cotillion being asked to dance by somebody’s cousin.","“I don’t know what you mean,” she says. “Thank you for walking me out. I’ll see you around the building.” And she goes, at the same unhurried pace, and he understands that polite is the most frightening thing she does."],"goto":"s21"},{"text":"Tell her a brand-new, ridiculous scar story to make her laugh.","tag":"Wit","set":{"trait.wit":"+1","rel.lena.warmth":"+1","scar_told_lena_2":"archbishop"},"response":["“My aunt had a cat named Archbishop,” he says to the sea lions. “Twenty-two pounds. Hated men. Hated Protestants. Hated the Steelers, which was the one thing we had in common. Christmas, 1999, I tried to put a Santa hat on him —” He touches the eyebrow. “He confirmed me. With prejudice.”",{"if":"scar_told_lena==\"refused\" || scar_told_lena==\"honest_no\"","text":"She laughs against her will, a wet, surprised sound, and wipes her eye with the heel of her hand. “Is that the real one?” “No.” “Good. It’s terrible.” She looks at him sideways, still smiling a little, not all the way. “You’ve got a hundred of those, don’t you.” “Hundreds.” “That’s what worries me.”","else":"She laughs against her will, a wet, surprised sound, and wipes her eye with the heel of her hand. “That’s the worst one yet.” “I’ve got hundreds.” “I know.” She looks at him sideways, still smiling a little, not all the way. “That’s what worries me.”"}],"goto":"s21"}]},"s20b":{"slug":"SUNDAY · 1:40 PM · THE ANCHOR, BACK BOOTH","body":[{"if":"e1_diner==\"hale\"","text":"Jack crosses the gap before he can think of a reason not to and stands at the end of the back booth like a kid sent to the principal. “Professor Hale.” Hale doesn’t look up from the Week in Review. “That depends who’s asking and how much they want.” The voice from the cable debates: cut glass, with something flatter and northern underneath. “Jack Costigan.” Hale looks up, takes the glasses off his head, and then, slowly, with what looks like real pleasure, smiles. “Youngstown. The nine pages. You came.”","else":"Laney makes him cut her pancakes — “into squares, sugar, I’m fragile” — and he does it the way he does for Rosie at home. “What’s your last name, Jack? I need it for when I write to the Pope about you.” “Costigan.” A tall shadow falls across the table: the man from the back booth, reaching for their Tabasco. “Jack Costigan,” Laney announces, “you are a *gentleman*.” The hand on the Tabasco stops. “Costigan?” Adrian Hale says. “*Youngstown?* The nine pages?”"},"“Your Chesterton was good,” Hale says, as though they’re resuming a conversation from last week. “Your Aquinas was borrowed. Your anger was the only original thing in it. Bring that on Monday, Mr. Costigan, and leave the rest of the bollocks at home.”","His eyes go past Jack to the front door. “Your friend left in a hurry. Was it my face or the *Times*?” He folds the magazine closed and tucks it under his arm."],"choices":[{"text":"“I came to say it to your face.”","tag":"Candor","set":{"trait.candor":"+1","rel.hale.warmth":"+2","e1_met_hale":true},"journal":[{"kind":"person","id":"hale","title":"Prof. Adrian Hale","text":"Wrote *The Consolations of Disbelief*. Wrote me a postcard. Was eating eggs at the Anchor on a Sunday afternoon with a Bloody Mary and the *Times*. Remembered my letter. Says my anger was the only original thing in it."}],"response":["It’s the one line on the postcard, turned around and handed back.","Hale hears it; Jack watches him hear it. He looks delighted and doesn’t smile, which is more alarming than the smile. “Then you’ll need a better face,” he says. “Monday. Hollis 302. Bring the anger.”",{"if":"e1_diner==\"hale\"","text":"Hale gathers up the rest of the *Times* and goes. At the register he puts down money for Laney’s pancakes — “For the cautionary tale,” he tells Gloria, with a nod at the next booth — and through the steamed glass Jack watches him walk off down the wharf into the sun, a little unsteady, well before two in the afternoon.","else":"He lays two twenties on the Formica by Laney’s plate. “For the cautionary tale.” Then he walks off down the wharf into the sun, a little unsteady, well before two in the afternoon."}],"goto":"s21"},{"text":"“You look exactly like your jacket photo. Older. Like it’s been left out in the rain.”","tag":"Wit","set":{"trait.wit":"+1","rel.hale.warmth":"+1","rel.hale.friction":"+1","e1_met_hale":true},"journal":[{"kind":"person","id":"hale","title":"Prof. Adrian Hale","text":"Wrote *The Consolations of Disbelief*. Wrote me a postcard. Was eating eggs at the Anchor on a Sunday afternoon with a Bloody Mary and the *Times*. Remembered my letter. Says my anger was the only original thing in it."}],"response":["Hale laughs, a bark that turns heads at the counter, and the smile that must once have been devastating turns out to still be. “Left out in the rain,” he says. “Larkin would have liked you, Mr. Costigan. He liked nobody. Monday.”",{"if":"e1_diner==\"hale\"","text":"Hale gathers up the rest of the *Times* and goes. At the register he puts down money for Laney’s pancakes — “For the cautionary tale,” he tells Gloria, with a nod at the next booth — and through the steamed glass Jack watches him walk off down the wharf into the sun, a little unsteady, well before two in the afternoon.","else":"He lays two twenties on the Formica by Laney’s plate. “For the cautionary tale.” Then he walks off down the wharf into the sun, a little unsteady, well before two in the afternoon."}],"goto":"s21"},{"text":"“Your book nearly took my faith away. I’m here to thank you for the workout.”","tag":"Charm","set":{"trait.charm":"+1","rel.hale.warmth":"+1","e1_met_hale":true},"journal":[{"kind":"person","id":"hale","title":"Prof. Adrian Hale","text":"Wrote *The Consolations of Disbelief*. Wrote me a postcard. Was eating eggs at the Anchor on a Sunday afternoon with a Bloody Mary and the *Times*. Remembered my letter. Says my anger was the only original thing in it."}],"response":["Something crosses Hale’s face and is gone, too quick to name, like a bird past a window. “Nearly,” he says. “How disappointing. We’ll try harder.”",{"if":"e1_diner==\"hale\"","text":"Hale gathers up the rest of the *Times* and goes. At the register he puts down money for Laney’s pancakes — “For the cautionary tale,” he tells Gloria, with a nod at the next booth — and through the steamed glass Jack watches him walk off down the wharf into the sun, a little unsteady, well before two in the afternoon.","else":"He lays two twenties on the Formica by Laney’s plate. “For the cautionary tale.” Then he walks off down the wharf into the sun, a little unsteady, well before two in the afternoon."}],"goto":"s21"}]},"s21":{"slug":"SUNDAY · 6:15 PM · DELGADO HALL, EAST STAIRWELL, 4TH FLOOR LANDING","body":["The east stairwell is the only place in Delgado where the RAZR gets more than one bar, which is why it smells like cigarettes and other people’s arguments. The window on the landing opens six inches and not one more; through the gap the fog is coming in over the Grove like a slow white tide. It’s 6:15 here. On Glenwood Avenue it’s 9:15, the dishes done, his mother sitting near the phone and pretending she isn’t.",{"if":"e1_diner==\"followed\"","text":"Part of him is still down at the wharf: the sea lions heaped on the float, her arms crossed over the cardigan, the way she stood at that railing like somebody waiting on a boat that’s late."},{"if":"e1_met_hale","text":"And Hale’s *Monday* is still going round in his head like a song off the radio he can’t shake."},"He tilts the phone to the one angle where the screen lights and dials home. It doesn’t finish the first ring. “Did you eat?” his mother says. No hello. “Don’t lie to me. I can hear it in your voice when you haven’t eaten.” “I ate, Ma.” “What did you eat.” “Food. California food. It had avocado on it.” She makes the noise she makes at the *Vindicator*.",{"if":"e1_hugged_dad","text":"“Your father said you hugged him,” she says. “In public. He told me twice.” She leaves that on the line between them, pleased with both of them."},{"if":"e1_asked_about_danny","text":"“Your father was quiet on the phone,” she says, carefully. Jack doesn’t ask why."},"Frank called from a truck stop outside Amarillo. “He’s making time. He says the truck’s making the noise again.” Jack knows the noise. He knows where his father is sleeping tonight, too — the pillow from the hall closet, the boots up on the dash — and he lets his mother keep the guy in Flagstaff. “And I’m seeing your brother next Sunday,” she says. “He wants to know if the girls in California are as pretty as on TV.”","Then there’s a clatter and a click and a long confused rustling, which is Nonna picking up the extension by her bed. It takes her three tries; he hears every one. Behind her, small and tinny, her TV is going, EWTN, a priest talking softly about something, and under it her own beads clicking: the Glorious Mysteries, because it’s Sunday. “Giacomino.” Her voice is thin and fierce as a wire. “Sei andato a messa?” “Sì, Nonna.” “Bravo.” Then, slyly: “E la ragazza?” “What girl, Nonna?” “There is always a girl. I hear it in your voice.” Under her breath, between sentences, she keeps her place: *Holy Mary, Mother of God*. “Your nonno had the same voice.”","Then the line goes thick with breathing, and his sister has wrestled the kitchen phone away from their mother. “Are they all tan?” Gina demands. “Is it true they don’t have winter? I hate you.” And she’s gone, and his mother is back, saying *Regina, give me that* to the kitchen, and then, to him, in the voice of a woman who would also like to know about a girl: “Your nonna asked you something.”"],"choices":[{"text":"Tell Mom about the girl. A little.","tag":"Sincerity","set":{"trait.sincerity":"+1","e1_told_mom_girl":true,"resolve.jack":"+1","soul.honesty":"+1"},"response":["“There’s a girl,” he says. “Maybe. I met somebody.” Instantly: “Is she Catholic?” “She wears a veil to Mass, Ma.” A silence so complete he can hear Nonna’s rosary goi
