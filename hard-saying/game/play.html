e’s apologizing.”"],"goto":"s04","journal":[{"kind":"person","id":"hale","title":"Prof. Adrian Hale","text":"Wrote *The Consolations of Disbelief*. Wrote me a postcard. Walked into Hollis 302 at 1:07 with wine on his cuff and asked us to prove we have souls. Knew my face from the Anchor before he knew my name. Called me a spaniel. Some nights he drinks alone in the Anchor’s back booth after midnight and says Housman to the window. Tips like he’s apologizing."}]},{"text":"Set the water down. Go.","tag":"Control","set":{"e4_hale":"water","trait.control":"+1"},"response":["Jack sets the water down on the Formica beside the pie. It leaves a ring. He turns and goes, and he is almost to the swinging door when it follows him down the aisle in the cut-glass voice again, perfectly clear, every consonant paid for: “Go home, Mr. Costigan. You’re sober and you’re boring me.”","He doesn’t go home; it’s twenty to one and there’s a rack in the Hobart. When the kitchen is clean he looks out once. The booth is empty, the meringue untouched, a fifty under the plate for an eleven-dollar check, and out the window a cab’s taillights going away up the wharf. Gloria rings it up and pockets the difference for the jar. “He tips like he’s apologizing,” she says, and shuts the drawer."],"goto":"s04","journal":[{"kind":"person","id":"hale","title":"Prof. Adrian Hale","text":"Wrote *The Consolations of Disbelief*. Wrote me a postcard. Walked into Hollis 302 at 1:07 with wine on his cuff and asked us to prove we have souls. Knew my face from the Anchor before he knew my name. Called me a spaniel. Some nights he drinks alone in the Anchor’s back booth after midnight and says Housman to the window. Tips like he’s apologizing."}]}]},"s04":{"slug":"WEDNESDAY · 1:46 AM · DELGADO HALL, 4TH-FLOOR LOUNGE","set":{"resolve.jack":"-1","knows_nora":true},"body":["Jack carries La Flaca up the east stairwell on his shoulder at a quarter to two, the coaster brake knocking his ear on every landing and Priya’s laminate still swinging from the handlebars on its loop of yarn: BICYCLES ARE NOT RESIDENTS. He smells like the Hobart — bleach, wet bread, lemon — and three miles of Ocean Road in the fog haven’t touched it. On four, the lounge light is on.","Priya is in there alone, sitting on the arm of the couch in her Fremont High hoodie with the sleeves pulled down over her hands. No binder. No laminator. On the coffee table, on a square of paper towel, is a Safeway cupcake — yellow cake, a swirl of pink frosting gone glossy under the fluorescent tubes — with one white candle stuck in it, unlit. A mylar balloon is tied by a curl of ribbon to the back of a lounge chair, HAPPY BIRTHDAY in silver script, turning slowly in the draft from the heater: the words, then blank silver, then the words.","Priya sees him see it. “They were two for one,” she says. “The other one’s at the cross. At the Point. I tied it on before my eight a.m. orgo lab.” She says it briskly. “In daylight. The rule’s about after dark.”","She meant to light the candle before midnight. Then there were duty rounds, and a girl on three locked out of her room in a towel, and by the time Priya got back up here it was midnight. “And then it wasn’t her birthday anymore,” she says, “and I couldn’t decide if that meant I still could. It’s not in the Handbook.” It’s nearly a joke; she doesn’t finish it.","Jack leans La Flaca against the wall under the whiteboard. “Whose birthday?”","“Nora Calloway.” Priya pulls the sleeves down further. “My freshman roommate. Two-twenty-two, this building — it’s a nursing major and a girl from Sacramento now. She was from Selma. Raisins. Her dad grows them. She brought me a five-pound bag after Thanksgiving, like that was a normal amount of raisins for one person to own.” Philosophy major. Soprano in the Newman choir. “She sang in the shower. Every morning. The Memorare, out loud, the whole thing, with the water running.” Priya looks at the balloon. “I’m Hindu and I know the Memorare by heart.” And then, because apparently it has to be proved: “*Remember, O most gracious Virgin Mary, that never was it known that anyone who fled to thy protection* — ” She stops. “Anyway.”","“She fell,” she says. “At the Point. Last spring — end of April.” Fast, to get it said. “Tuesday would have been twenty.” They weren’t close by then; Nora moved to Serra sophomore year. “She got busy. We drifted. That’s a thing that happens, it’s in the orientation materials.” Her voice thins and goes hard. “They said she fell. People say other things. People are disgusting.”","And then: “It’s my fault she keeps showing up. On Facebook. I friend-requested the whole floor so I’d know your faces, and now it suggests her to all of you. People You May Know. I’ve reported it three times. You can’t make it stop.”","“It suggested her to me,” Jack says. He never clicked. He didn’t have to; he knew the name. “There’s a plate at St. Brendan’s. Under the candles, at the Marian shrine. It has her name on it.” Priya nods slowly. “I’ve never been inside,” she says. “I’m Hindu. I’d just stand there.”","It’s ten to two. Jack has been up since seven, has been sent home by a drunk professor, has a brother in a cell outside Warren who asked him to describe the ocean, and in the corner the balloon keeps turning — the words, then the silver, then the words."],"choices":[{"text":"Sit down. “What was she like?”","tag":"Sincerity","cue":"Priya will remember that.","key":"You sat with Priya on Nora’s birthday.","set":{"e4_priya":"what","trait.sincerity":"+1"},"response":["He sits on the other end of the couch, close enough to the cupcake to count as a guest. Priya looks at him, and then she tells him. Nora argued with professors in office hours and came back to two-twenty-two glowing, pacing, needing to tell someone, and Priya was the someone. Nora could not fold a fitted sheet and said it was a theological problem: the corners were proof of the Fall. At every birthday on the floor she sang the harmony on “Happy Birthday,” whether anybody wanted harmony or not, and nobody did, and it was beautiful anyway.","Priya laughs — once, wet, out of nowhere — and is furious at it, and presses the hoodie cuff hard against her mouth until it goes away. The balloon turns. Jack stays where he is."],"goto":"s05","journal":[{"kind":"person","id":"nora","title":"Nora Calloway","text":"The name on the plaque. Priya’s freshman roommate, Delgado 222. From Selma — raisins. Sang soprano; sang the Memorare in the shower. Philosophy. Fell at the Point at the end of April. Tuesday would have been her twentieth birthday. Facebook won’t stop suggesting her."},{"kind":"note","id":"the_point","title":"The Point","text":"A cliff, according to Priya. Nobody goes there after dark. Her rule, not the school’s. Now I know whose rule it is."},{"kind":"person","id":"priya","title":"Priya (RA)","text":"Laminates things. Owns an air horn. Her freshman roommate was Nora Calloway. The one rule she doesn’t laminate is for her."}]},{"text":"“How did she fall?”","tag":"Candor","key":"You asked Priya how Nora fell.","set":{"e4_priya":"how","trait.candor":"+1"},"response":["Priya is quiet so long he thinks he’s lost her. “She sat on the wrong side of that wall a hundred times,” she says. “The ocean side. Legs over. Seventy feet down to the rocks, and she’d sit there with her feet hanging like it was a dock. She said it was where she went to argue.” She pulls a thread loose from the hoodie cuff and winds it around her finger until the tip goes white. “The police closed it in a week.” Flat: “Accidental. That’s the word on the form.”"],"goto":"s05","journal":[{"kind":"person","id":"nora","title":"Nora Calloway","text":"The name on the plaque. Priya’s freshman roommate, Delgado 222. From Selma — raisins. Sang soprano; sang the Memorare in the shower. Philosophy. Fell at the Point at the end of April. Tuesday would have been her twentieth birthday. Facebook won’t stop suggesting her."},{"kind":"note","id":"the_point","title":"The Point","text":"A cliff, according to Priya. Nobody goes there after dark. Her rule, not the school’s. Now I know whose rule it is."},{"kind":"person","id":"priya","title":"Priya (RA)","text":"Laminates things. Owns an air horn. Her freshman roommate was Nora Calloway. The one rule she doesn’t laminate is for her."}]},{"text":"Light the candle for her.","tag":"Control","key":"You lit Priya’s candle for Nora.","set":{"e4_priya":"candle","trait.control":"+1","soul.grace":"+1"},"response":["Jack takes the Marlboro lighter out of his flannel pocket. Candles are a violation of Residential Life policy; so, arguably, is the lighter. Priya looks at both. The wick catches on the second strike. Under the fluorescent tubes the flame is small and nearly colorless, and it leans in the heater’s draft, and holds.","“Happy birthday, Nora,” Priya says, at ten to two, on the wrong day. She blows it out herself. Then she stands up, pulls the hoodie straight at the hem, and laminates herself back together in front of him. “I’m going to need you to not tell anyone about the cupcake.”"],"goto":"s05","journal":[{"kind":"person","id":"nora","title":"Nora Calloway","text":"The name on the plaque. Priya’s freshman roommate, Delgado 222. From Selma — raisins. Sang soprano; sang the Memorare in the shower. Philosophy. Fell at the Point at the end of April. Tuesday would have been her twentieth birthday. Facebook won’t stop suggesting her."},{"kind":"note","id":"the_point","title":"The Point","text":"A cliff, according to Priya. Nobody goes there after dark. Her rule, not the school’s. Now I know whose rule it is."},{"kind":"person","id":"priya","title":"Priya (RA)","text":"Laminates things. Owns an air horn. Her freshman roommate was Nora Calloway. The one rule she doesn’t laminate is for her."}]}]},"s05":{"slug":"WEDNESDAY · 12:58 PM · HOLLIS 302","set":{"resolve.lena":5},"body":["Hollis 302 at two minutes to one: the long oak table and the fourteen chairs, the radiator knocking on a seventy-degree day, the sea window full of white sky. Caleb is unpacking his copy of *The Consolations of Disbelief*, which has acquired more Post-its since last week and now looks like a bird in the middle of a molt. Yusuf has his head down on his folded arms, fasting, conserving.","Lena is already in her chair. She’s here, which yesterday morning in Sandoval she wasn’t, and she’s perfect: hair up, the OCTAVIA tote at her feet, the oatmeal cardigan with its sleeves pulled all the way down to her knuckles. She pushes those sleeves up when she’s about to win. They stay down.","She has his paper out before he’s sat, and hers. She slides “That a Broken Statue Is Still Herakles” across the oak to him and takes “That God Is the One Who Pays” out of his hand. She glances at the title, and for one second the sleeves almost go up. “‘The One Who Pays,’” she says, low, just for him. “Bold. I’ll be cruel about it by Thursday.” Then it goes into the tote, and her face goes back to being perfect.",{"if":"e4_text==\"notes\"","text":"He has Tuesday’s notes too, folded in thirds: two pages of Hume in the cursive the Sisters at St. Brigid’s beat into him, Epicurus boxed. He lays them on top of her tote. She looks down at them a while — the closed loops, the tall capitals, the box. “You took notes for me.” Then the pages go into the tote flat, between the books, where they won’t crease."},"Page two. He finds it before Caleb has finished with his Post-its.",{"type":"doc","title":"“That a Broken Statue Is Still Herakles,” page two","text":"Objection: *A statue doesn’t feel the arm go.* (Costigan)\n\nReply: Correct, and it is the best objection I have been given. But the argument was never that Herakles feels nothing. It is that what can be lost is not what makes him Herakles. Gage felt the bar go through. He was still the one feeling it. Pain is not proof that you have become someone else. It is proof that someone is still there to mind."},"He reads it twice. Then he looks up, and she’s looking hard at the sea window.","At 1:07 Hale comes in, sets down the roster and nothing else, and sits. He’s wearing the linen jacket, and there’s no wine on the cuff. He’s quieter than Tuesday’s man in Sandoval, the voice pitched for the table instead of the back of a hall, and when Caleb starts in on psychological continuity and won’t stop, Hale lets him go on, and on, and only lifts one finger when Caleb gets to a third example.","Week two: personal identity. Locke’s prince and cobbler — the soul of a prince, carrying all its memories, wakes up in a cobbler’s body, and Locke says it’s the prince, accountable only for the prince’s actions; memory makes the man. Then Reid, against Locke: the brave officer. A boy flogged at school for robbing an orchard. The young officer who takes an enemy standard in his first campaign, and remembers the flogging. The old general who remembers the standard and has forgotten the orchard entirely. By Locke, the general is the officer and the officer is the boy, and the general is not the boy. Hale writes it on the board in his barbed-wire hand, three names and two arrows and a gap.","Yusuf lifts his head for the Ship of Theseus. “Replace every plank, it’s the same ship,” he says. “Replace every rivet on a 747 and it’s a maintenance violation.” The room laughs. Caleb says, “Amen,” with feeling, and the San Diego boys look at each other.","“The faithful are very quiet today,” Hale says, and then to Yusuf: “Mr. Noorzai, I expect it of you; you’re fasting.”","Lena speaks then — first time all hour, without putting up a hand, without pushing up a sleeve. “Memory’s a bad criterion. You can forget a thing you did, and it’s still done.”","Hale doesn’t answer. He looks at her down the length of the oak, and the radiator knocks twice, and somebody’s pen rolls off the table and nobody picks it up. Then he turns back to the board and taps the gap between the boy and the general.","“Mr. Costigan. Is the general the boy?”"],"choices":[{"text":"“Yes. He doesn’t remember it and he did it anyway. You don’t get out of a thing by forgetting it.”","tag":"Press","set":{"e4_seminar":"same","trait.candor":"+1","rel.lena.trust":"+1"},"response":["He hears how hard he’s said it only after it’s out. Lena looks at him across the oak — not her winning look, not her red-pen look; the look of somebody who has just heard her own sentence come back from a long way off.","Hale takes in the pair of them. “Two Catholics agreeing about guilt,” he says. “Somebody fetch a priest; it’s practically a sacrament.” The room laughs. Lena doesn’t, and neither does Jack, and Hale notices that, and moves on to Parfit."],"goto":"s06","journal":[{"kind":"note","id":"assignment","title":"Designated antagonists","text":"Two pages a week, bled on in red. Hers: “That a Broken Statue Is Still Herakles.” My sentence is on page two with my name after it. Mine: “That God Is the One Who Pays.” She has it now."}]},{"text":"“Only on weekends.”","tag":"Riposte","set":{"e4_seminar":"weekends","trait.wit":"+1","rel.lena.warmth":"-1"},"response":["The room goes up — Caleb loudest, slapping the oak, the San Diego boys half a second behind him. Even Yusuf grins into his arms. Hale gives it a small dry nod, a point for form.","Lena doesn’t laugh. She doesn’t frown either. She looks at the gap on the whiteboard between the boy and the general, and Jack notices, and the laugh in the room goes on a little past where he’d like it to stop."],"goto":"s06","journal":[{"kind":"note","id":"assignment","title":"Designated antagonists","text":"Two pages a week, bled on in red. Hers: “That a Broken Statue Is Still Herakles.” My sentence is on page two with my name after it. Mine: “That God Is the One Who Pays.” She has it now."}]},{"text":"“Ask Gage.”","tag":"Candor","set":{"e4_seminar":"gage","trait.candor":"+1","rel.hale.warmth":"+1"},"response":["“Gage is unavailable for comment,” Hale says. “That was rather the point.” Something of the man from the first day crosses his face — the pleasure of being fought — and goes again, and he’s back at the board.","Across the oak, Lena pulls her sleeves down further over her hands."],"goto":"s06","journal":[{"kind":"note","id":"assignment","title":"Designated antagonists","text":"Two pages a week, bled on in red. Hers: “That a Broken Statue Is Still Herakles.” My sentence is on page two with my name after it. Mine: “That God Is the One Who Pays.” She has it now."}]}]},"s06":{"slug":"WEDNESDAY · 5:24 PM · DELGADO HALL, 4TH-FLOOR LOUNGE","body":["Priya’s newest laminate is taped to the lounge door at eye level: THE LOUNGE CLOSES AT 2 A.M. (THIS MEANS YOU.) (THIS ALSO MEANS ME.) Inside, the balloon is gone from the chair, and so is the paper towel with its one unlit candle. It’s five-twenty-four in Marisol and eight-twenty-four in the Capitol, and the light coming in low off the Lagoon is so gold that the President of the United States, on the boxy Zenith on its rolling cart, is addressing a joint session of Congress through a glare.","Margot has annexed the whiteboard. COVER YOUR COUGH is gone — wiped, though the ghost of H1N1 still shows gray through the white if you tilt your head — and in its place, in black capitals so even they look typeset, the season to date, transcribed out of the Moleskine:",{"type":"doc","title":"The 4th-floor whiteboard","text":"USEFUL IDIOTS FOR CHRISTIAN NATIONALISM\nCOSTIGAN | BROUSSARD\nC — “And every father.” (8/30, 3 a.m., this lounge) · 1\nB — Mantilla, in a public lecture hall (9/1) · 1\nB — “Neither horn.” (Aquinas, borrowed) · 1\nC — Took Broussard’s side against me (9/1). Chivalry is a tell. · 1\nB — Taught five Yankees and a Texan a chant to a football team. Liturgical. · 1\nC — “He’s the one who pays.” Substitutionary atonement at a dinner party. · 1\nC — Sister Mary Clement, a ruler. Corporal punishment. Predictable. · 1\nB — Bailout: “I’m *for* it.” Deduction for compassion. · −1\nB — “She’s right.” (US-101 N, 9/7.) Deduction. Witnessed. Unrepeatable. · −1\nTOTAL — C 4 · B 1"},"Jack reads it top to bottom. It is accurate in every particular, which is the most upsetting thing about it. “She loses points for agreeing with *you*?” “Broussard is penalized for lapses into reason. It’s a handicap system. Like golf, or the Senate.” Margot caps the marker, uncaps it, and regards him over the black frames with something that on a warmer person would be pride. “It’s a whiteboard, Costigan. I’ll be updating it hourly.”","The lounge has filled up. Kevin is perched on the arm of the couch in the navy quarter-zip with a Costco bag of baby carrots, which he offers around like a host. Doug Pruitt is at the table with World of Warcraft open on his laptop and a headset around his neck, keeping one eye on a raid and the other on the leader of the free world. Yusuf came over from Cabrillo because Jack, after seminar, promised him a television and an argument; he has the good armchair and a single date in his shirt pocket, which he pats when he catches Jack looking. “For seven-twelve.” He hasn’t eaten or drunk since before dawn, and he looks more rested than anybody in the room.","Theo arrives with a wooden board from the cheese place on Mission that sells eleven-dollar crackers — figs, a wedge of something with a rind like an old church door — and takes the middle of the couch as if the couch had been holding it for him. “I’m here for the catering.” He holds the board out to Yusuf first. “I’ll take a rain check,” Yusuf says. “At seven-twelve.” “I’ll guard the manchego with my life.”",{"if":"e2_alarm==\"hoodie\"","text":"Laney comes in last, in Jack’s gray Mooney hoodie — hers now, by every law but the written one; there’s foundation on the cuffs — with her knees pulled up inside it so she’s a hood and a fall of copper hair. She drops onto the couch on Theo’s other side and takes a fig off his board without asking. “I’m here for the cheese and Theodore. Not in that order.”","else":"Laney comes in last, in a Pi Lam rush T-shirt knotted at the hip, and drops onto the couch on Theo’s other side and takes a fig off his board without asking. “I’m here for the cheese and Theodore. Not in that order.”"},"On the screen the President has been at it for twenty minutes, Biden and Pelosi behind him at the rostrum like bookends. Around five-thirty he gets to the claim that it would insure people who are in the country illegally, and says it wouldn’t — the reforms wouldn’t apply to anyone here illegally — and from the floor, from the Republican side, a man’s voice cuts across him, high and furious and perfectly clear.","“You lie!”","The chamber groans, and there are boos under the groan. The President stops, looks toward the sound, and goes on. In the lounge Doug takes off his headset. “Duuude.” Laney has a fig halfway to her mouth. Theo leans back into the couch with the expression of a man watching dailies. “He just made the most-watched mistake of his life,” he says. “I’d cast him.”","Kevin laughs, because Kevin laughs, and takes a carrot. “My mom’s a pharmacist,” he says, sunny. “Walgreens, in San Jose. There’s a guy who comes in every week, gets to the counter, sees what his insulin costs, and puts it back.” He crunches the carrot. “Then he buys Doritos up front.” He smiles at everybody, and for a second nobody can find anything to do with their face.","In the good armchair Yusuf hasn’t moved. “Funny,” he says quietly, eyes on the screen, “who gets called a liar to his face.”","Jack grew up in a house where men yelled at the television every night of the week, and on the bill he’d have yelled right along with them — but under this shout there is something else, in who it was thrown at and how sure the man was that he could throw it there, that Jack doesn’t like and can’t argue his way out of."],"choices":[{"text":"“He can disagree all he wants. He doesn’t get to call that man a liar in that room.”","tag":"Candor","set":{"e4_lounge":"manners","trait.candor":"+1"},"key":"You told the lounge the congressman had no right to call that man a liar.","response":["He hears where the weight falls — *that man* — and he hears himself mean more by it than manners, and he leaves it where it fell. In the armchair Yusuf looks over at him, once, and then back at the screen.","Margot’s marker goes up to the board over COSTIGAN and hovers through a whole paragraph of the speech. Then she caps it without writing anything. Theo passes Jack the cheese board without a word."],"goto":"s06b"},{"text":"“He’s wrong about the immigrants. Wait for the abortion line — that’s the one I don’t believe.”","tag":"Press","set":{"e4_lounge":"policy","trait.candor":"+1"},"response":["It comes inside a minute, as if he’d cued it: no federal dollars for abortion, the President says, more or less, and the conscience laws stay where they are. “There,” Jack says. “That one.”","The marker squeaks. COSTIGAN +1. “Fact-checks the Republican, disbelieves the Democrat,” Margot says, still writing. “The Catholic position: everybody’s lying, but differently.” “The bishops have a letter about this,” Kevin offers, helpfully, around a carrot. “The bishops always have a letter.”"],"goto":"s06b"},{"text":"“Somewhere in South Carolina a nun is reaching for a ruler.”","if":"trait.wit>=10 && scar_told_margot==\"nun\"","tag":"Wit","set":{"e4_lounge":"nun","trait.wit":"+1","rel.margot.warmth":"+1"},"response":["Margot doesn’t turn around. “Sister Mary Clement,” she says flatly. “I have her on file.” She taps the board, third line from the bottom, without looking.",{"if":"e2_alarm==\"hoodie\"","text":"Laney snorts into the hoodie’s sleeve and has to pull the hood all the way up. Theo looks from face to face. “Who?” Nobody explains. Theo settles back, wounded.","else":"Laney snorts into her fist and has to turn her face into the couch. Theo looks from face to face. “Who?” Nobody explains. Theo settles back, wounded."}],"goto":"s06b"}],"journal":[{"kind":"note","id":"whiteboard","title":"The whiteboard","text":"Margot annexed Priya’s whiteboard: USEFUL IDIOTS FOR CHRISTIAN NATIONALISM, COSTIGAN | BROUSSARD, season to date out of her Moleskine. It’s a whiteboard, she says. She’ll be updating it hourly."}]},"s06b":{"slug":"WEDNESDAY · 6:01 PM · DELGADO HALL, 4TH-FLOOR LOUNGE","body":["The speech runs on past the shout — no federal money for abortions, a public option, not a dime added to the deficit — while the light in the window goes from gold to orange. He ends on a letter Ted Kennedy wrote him in the spring, to be delivered after he died. The chamber stands. In the lounge Kevin says, quietly, not sunny at all: “His funeral was move-in day.”","When Jack looks up, Lena is in the doorway. The OCTAVIA tote on her shoulder; the oatmeal cardigan with the sleeves pulled down over her wrists; the Justins, not the Keds. From the look of her she watched it somewhere else, alone. Laney has her key; eventually Laney has everybody’s key. Lena looks composed in a way that has been ironed.","“Broussard.” Margot turns from the board with the marker up like a microphone. “Weigh in. Your party, your president, your abortion.” Lena considers the television, where the senators are still on their feet. “He’s right that it’s a lie,” she says. “He just picked the wrong one.”","BROUSSARD +1 goes up with a squeak, and Margot lays out the rest of the fight like a table setting, every fork where Lena likes it: when the bishops sink the whole bill over one line, will Broussard cheer, or call them cowards? Lena takes her key out of Laney’s hand. “Put me down for whatever you want, Margot,” she says. “I’m too tired to argue with a whiteboard.” She’s gone before anybody thinks of an answer. The fight she didn’t have stays in the lounge, louder than the television, and Margot, the marker still in the air, looks from the empty doorway to Jack and watches him see it.","Laney follows Jack into the hall with the hoodie sleeves pulled over her hands, and when the lounge door sighs shut she sets the pageant down like a tray. “Okay. Fireman. Serious face.” It’s alarming on her. Lena’s been weird since Monday night. In bed by ten. Praying more — “which for Lena is like saying the ocean got wetter.” Her phone face-down on the desk, ringing, and Lena letting it. And she won’t say why, and Laney has asked nice and asked not nice. “She tells me everything except the things she doesn’t.” Her chin comes up the way it must have come up on a hundred stages, and her eyes don’t go with it. “Somebody has to be her person this week. And she won’t let it be me.”",{"if":"e2_curb==\"friend\"","text":"It lands somewhere under his ribs: the curb outside Pi Lam last Friday, Lena watching Laney go inside — *Somebody out here has to be her person.* Laney was through the door by then. She can’t have heard it."},"“Okay,” Jack says. Laney nods as if they’ve both signed something, pushes the sleeves up, becomes Laney again, and goes back in for the cheese.","Margot comes out a minute later, capping the marker. “Open mic’s Thursday. Café Bastille. I’m reviewing it for the *Tide*. Bring a pen.”","At six-twenty-five Yusuf comes out with his bag on his shoulder. “Iftar,” he says. “The Islamic Center, on Mission. My mother sent food with a cousin. There’s too much. There’s always too much.” He asked once already, the first week. He doesn’t say *again*. He waits.","Out past the Grove is the Point, and on the Point, since yesterday morning, a balloon tied to a cross. Priya’s rule is about after dark. There’s an hour of light left."],"choices":[{"text":"Ride out to the Point before the light goes.","tag":"Go","set":{"e4_wed":"point"},"key":"You rode out to the Point to see the cross.","response":["La Flaca comes off the radiator pipe with a clank that brings Priya’s door open an inch and closed again; then the east stairwell, three flights, the bike on his shoulder; then the lot, and the sun already low and orange over the eucalyptus."],"goto":"s07a"},{"text":"Break the fast with Yusuf.","tag":"Go","set":{"e4_wed":"iftar"},"key":"You broke the fast with Yusuf.","response":["Yusuf nods as if he’d calculated the odds and they’d held. “Bring nothing,” he says, starting down the stairs. “If you bring potato salad I’ll know.”"],"goto":"s07b"}]},"s07a":{"slug":"WEDNESDAY · 6:48 PM · MARISOL POINT","music":"The Antlers — “Kettering”","set":{"e4_julian_met":true},"body":["La Flaca rattles west through Las Olas with the sun full in Jack’s face: past Lupe’s truck, shuttered till ten; past the surf rentals with wetsuits drying on the fences; along Seacliff, where the Greek houses are getting ready for the weekend with a garden hose and a keg dolly. The Lighthouse is the last house on the road. He sees the gap in its back fence, and the bluff path through it that Lena told him not to take at night, and it isn’t night, and he takes the road around to the dirt lot anyway.","Then there’s nothing but the Point. Golden hour, and wind enough to lean on; ice plant gone red at the tips; below, out of sight on the rocks, sea lions barking. The old light stands at the end of it all, squat and white, a county sign on its locked door — dark since 1967. And the wall: knee-high on the side where Jack is standing, the kind of wall you sit on to tie a shoe. On the other side, nothing. Air, seventy feet of it, and then the water.","The cross is plain white wood set into the dirt at the wall, and somebody has burned NORA into the crossbar, carefully, in capitals. At its foot a bundle of jasmine gone brown, tied with kitchen string. And Priya’s balloon. He’d know it anywhere now, the lounge balloon’s twin, HAPPY BIRTHDAY in pink and silver, half its helium gone, bowing in the wind and coming back up and bowing again. A square of index card hangs from its ribbon. It is, of course, laminated. *N. — P.*","He isn’t alone. On the land side of the wall a guy is sitting with a guitar case at his feet that he hasn’t opened: warm brown skin, short dark hair, a gray cardigan too warm for the afternoon and right for the wind, a cheap steel Timex. An old Peugeot ten-speed lies in the grass behind him with its back wheel still ticking round. He looks at Jack, and keeps looking, as if he’s trying to remember the key something was in. “You’re the guy from the Lighthouse stairs,” he says. “You were with the girl who listened.”","And Jack places him: the party, the stairs, a boy in a cardigan on the landing, playing “Skinny Love” again after the laptop died, and Lena with Laney’s hair in her fist, gone very quiet. “Julian,” the guy says. “Jack.” Julian tips his head at the balloon. “Priya’s?” “My RA.” “She still has the rule?” “Laminated.” That gets something out of him. “She would.”","Jack doesn’t know how else to stand there, so he asks if he knew her. Julian looks at the wall instead of at him. Nora sat there, he says. On the wrong side. Legs over the drop, heels against the stone, like it was the end of a dock. “Yelling at God, she said.” And Julian sat where he’s sitting now, on the right side, and played whatever she asked for. Hymns, then Neil Young, then hymns. She sang harmony on everything, including songs that didn’t want any. He says all of it plainly, as if giving directions. “I play Bastille Thursdays,” he says, after a while. “There’s one I only do once a month.”"],"choices":[{"text":"“Did He ever yell back?”","tag":"Sincerity","set":{"e4_point":"yell","trait.sincerity":"+1","rel.julian.warmth":"+1"},"response":["Julian looks at the wall. “That’s the song.”","The sun touches the water, flattens, and goes, all at once, the way it does out here, and the cold comes up off the sea before the light has even finished leaving. Julian stands and picks up the case. “Priya’s rule,” he says. They walk the bikes out across the dirt lot to the road together, the Peugeot ticking, La Flaca squealing, neither of them in any hurry."],"goto":"s08","journal":[{"kind":"person","id":"julian","title":"Julian","text":"The guitar guy from the Lighthouse stairs. Used to sit at the wall with Nora — she sat on the wrong side and yelled at God, he sat on the right side and played whatever she asked. Plays Bastille Thursdays. One song only once a month."}]},{"text":"Stand there with him till the sun’s down. Don’t talk.","tag":"Control","set":{"e4_point":"silent","trait.control":"+1","rel.julian.trust":"+1"},"response":["Jack puts his hands in the Carhartt pockets and stands. Julian leaves the case shut. Below them the sea lions keep up their argument; the balloon bows and rights itself; the sun goes into the water red, then orange, then a line, then nothing, and neither of them says anything through any of it.","When it’s over Julian looks up at him and nods once, as though something has been settled that neither of them brought up. “Priya’s rule.” They walk the bikes out to the road side by side in the blue dark, and at Seacliff Julian lifts a hand and rides east without looking back."],"goto":"s08","journal":[{"kind":"person","id":"julian","title":"Julian","text":"The guitar guy from the Lighthouse stairs. Used to sit at the wall with Nora — she sat on the wrong side and yelled at God, he sat on the right side and played whatever she asked. Plays Bastille Thursdays. One song only once a month."}]},{"text":"“I didn’t know her. My RA did.”","tag":"Candor","set":{"e4_point":"priya","trait.candor":"+1","rel.julian.trust":"+1"},"response":["“Most people who come out here didn’t know her,” Julian says. “They come anyway.” He watches the balloon dip and recover. “Tell Priya the balloon’s holding up.”","The last of the sun goes under while Jack is still deciding whether he will. Julian gets up, brushes off the cardigan, and hoists the case. “Priya’s rule,” he says, and they walk the bikes out to the road together with the wind at their backs and the light fading out of the ice plant."],"goto":"s08","journal":[{"kind":"person","id":"julian","title":"Julian","text":"The guitar guy from the Lighthouse stairs. Used to sit at the wall with Nora — she sat on the wrong side and yelled at God, he sat on the right side and played whatever she asked. Plays Bastille Thursdays. One song only once a month."}]}]},"s07b":{"slug":"WEDNESDAY · 7:12 PM · ISLAMIC CENTER OF MARISOL, MISSION STREET","body":["The Islamic Center of Marisol is a converted storefront on Mission Street between a laundromat and a vacuum-repair shop, with a green awning and the old tenant’s name still ghosted in gold on the transom: KESSLER SHOES. Inside the door, wire racks of shoes — sneakers, loafers, a pair of tiny pink sandals that light up — and Jack unlaces his boots and discovers a hole over his left big toe, which nobody notices except Yusuf, who notices everything. “It’s fine,” Yusuf says. “God has seen your feet.”","Carpet patterned in rows, folding tables along the back wall under butcher paper, a whiteboard with the Ramadan timetable in a careful hand. Forty people, maybe: engineering grad students, a Pakistani pediatrician still in scrubs, small kids running laps between the tables, an uncle — everybody’s uncle — in a Raiders cap. At seven-twelve somebody presses play on a CD player by the window, and the call to prayer comes out of two speakers into the room, one man’s voice going up and up and holding there, and the room goes still under it.","Dates and water first. Yusuf puts a date in Jack’s palm — fat, dark, sticky — “Medjool; my mother doesn’t trust the dates down here” — eats his own with his eyes shut, drinks a whole bottle of water without stopping, and opens his eyes with his color back. Then the men line up on the carpet for the sunset prayer, shoulder to shoulder, and Jack, who was told *sit, stand, whatever*, sits on a folding chair by the wall with his hands on his knees and prays his own way, silently. What comes is what his hands know at a table: *Bless us, O Lord, and these thy gifts.* Across the room forty foreheads go to the carpet together. The only sounds are the ceiling fan and somebody’s baby, and he couldn’t say what the stillness is, only that he has stood in it before, at the 12:10, under the hull.","Then lentil soup in Styrofoam cups. Then the foil pans from Fremont, carried in two at a time by a cousin in a Cal hoodie: qabili palau, the rice dark with stock and heaped with carrots cut fine as matchsticks and fat golden raisins, lamb underneath; bolani; a yogurt sauce with mint in it. The pediatrician asks Jack where he’s from and, told, says he did a rotation in Cleveland in 1998 and hasn’t been warm since.","Yusuf eats like an engineer, methodically, and talks between bites. His father has been on the line at NUMMI since ’85, by way of Peshawar — twenty-four years of Corollas — and in August Toyota announced the plant closes in the spring. “He says he’s going to retire. He’s fifty-four. He says it like a man announcing he’s going to take up the cello.” His brother Tariq is twenty-four, a contract interpreter with the Army in Helmand, the villages’ Pashto into the lieutenants’ English and back again, all day in the heat. “He calls Sundays. If he doesn’t call Sunday, my mother doesn’t sleep till Monday.” He says it lightly, and then he takes a second helping of rice he plainly doesn’t want, and Jack knows the move. He has made it at his own mother’s table.","Then, wiping his hands, Yusuf delivers the bit he has clearly been holding since the cloister walk. He went to a First Communion party in Fremont in third grade; he counted. “This is a real potluck. You people bring nine kinds of potato salad and call it a sacrament.”"],"choices":[{"text":"Ask about Tariq.","tag":"Sincerity","set":{"e4_iftar":"tariq","trait.sincerity":"+1"},"response":["Jack asks what he’s like, not what he does, and Yusuf thinks about it honestly, which is how he thinks about everything. Tariq was the funny one. Tariq taught him cricket with a tennis ball in the Safeway lot. Tariq signed up in ’07 because he could do the job and most people couldn’t, and their mother cried for a month and then ironed his shirts for the flight.","“People ask if I’m angry at God,” Yusuf says. “I’m angrier at the Taliban than at God. And at America, for leaving the first time.” He tears a piece of bolani in half and gives Jack the bigger piece. “Don’t tell Hale. He’ll make it a seminar.”"],"goto":"s08","journal":[{"kind":"person","id":"yusuf","title":"Yusuf (PHIL 9H)","text":"Fremont. Engineer. Fasting for Ramadan through a ninety-minute seminar and funnier than all of us. Broke the fast with his people on Mission Street and fed me till I couldn’t stand. Father on the NUMMI line since ’85. Brother Tariq interprets for the Army in Helmand and calls on Sundays."}]},{"text":"“Potato salad is a sacramental, not a sacrament. Get it right.”","tag":"Wit","set":{"e4_iftar":"potluck","trait.wit":"+1"},"response":["The corner of Yusuf’s mouth goes. He leans across the table and translates for the uncle in the Raiders cap — Pashto, fast, with a hand gesture for *sacramental* Jack would pay money to have explained — and the uncle listens gravely, nods, and then points a plastic fork at Jack and demands a ruling on JaMarcus Russell instead.","“He’s going to make you pick one,” Yusuf says. “Pick wrong; it’s a mercy. Then he gets to be right all season.”"],"goto":"s08","journal":[{"kind":"person","id":"yusuf","title":"Yusuf (PHIL 9H)","text":"Fremont. Engineer. Fasting for Ramadan through a ninety-minute seminar and funnier than all of us. Broke the fast with his people on Mission Street and fed me till I couldn’t stand. Father on the NUMMI line since ’85. Brother Tariq interprets for the Army in Helmand and calls on Sundays."}]},{"text":"Tell him about your father. Lordstown. June.","tag":"Candor","set":{"e4_iftar":"frank","trait.candor":"+1"},"response":["Jack tells him: Lordstown, twenty-six years, the letter in June, the Silverado parked in the drive with nowhere to drive it. Yusuf doesn’t interrupt. When it’s done he lifts his water bottle an inch off the butcher paper. It could be a toast. It could be the other thing.","“Two sons of autoworkers at Hale’s table,” he says. “He’d hate that we’re a demographic.”"],"goto":"s08","journal":[{"kind":"person","id":"yusuf","title":"Yusuf (PHIL 9H)","text":"Fremont. Engineer. Fasting for Ramadan through a ninety-minute seminar and funnier than all of us. Broke the fast with his people on Mission Street and fed me till I couldn’t stand. Father on the NUMMI line since ’85. Brother Tariq interprets for the Army in Helmand and calls on Sundays."}]}]},"s08":{"slug":"THURSDAY · 4:02 PM · HOLLIS 108","body":["Hollis 108 is the basement, and the basement door has a note on it: one typed sheet, one strip of Scotch tape across the top, the bottom corners lifting in the draft from the stairwell.",{"type":"doc","title":"Taped to the door of Hollis 108","text":"SECTION CANCELLED TODAY — PERSONAL.\nRead Kierkegaard, *Works of Love*, “Our Duty to Love the People We See.”\n—E. Marsh"},"The girl in the Marisol Surf hoodie reads it, says “Oh my God, *yes*,” and takes the stairs back up two at a time with a free hour in her hands like a twenty found in last winter’s coat.","Lena comes down behind Jack in the brown Justins and the cardigan, the tote on her shoulder. She reads the note. “Must be nice,” she says, to the door.","Then she turns, and they climb back up into the light together, and it’s the worst small talk of Jack’s life. The Kierkegaard: she’s read it; of course she has. The fog: late today. The Saints: she doesn’t bring them up, and that’s how he knows how bad it is. At the top of the stairs she shifts the tote and he sees his own paper inside it, “That God Is the One Who Pays,” the corner curled, red showing faintly through the back of page two — not much red. “I’m not done bleeding on it,” she says, as though he’d asked. He doesn’t mention Bastille. She doesn’t ask what he’s doing tonight. “Costigan,” she says, and turns left toward the Brick, and he goes right.",{"type":"sms","from":"Gina","text":"they wouldnt let us watch obama at school tues. sr said parents called. we watched a movie about plate tectonics","time":"4:09 PM"},"He thumbs a reply on the steps of Hollis with the RAZR tipped against the glare, T9 fighting him for every word.",{"type":"sms","from":"Jack","text":"sr is right. tectonics on the test. obama isnt. hows dad","time":"4:13 PM"},"No answer. He closes the phone. Across the quad the sprinklers on the Commons come on all at once, and a dozen people on the grass get up shrieking and gather their books, and the water goes on swinging back and forth over the empty grass."],"next":"s09"},"s09":{"slug":"THURSDAY · 8:31 PM · CAFÉ BASTILLE, MISSION STREET","body":["Thursday is supposed to be a shift. A few blocks downhill, at the bottom of Mission Street, the Anchor’s kitchen is dark tonight and belongs to the hood guys, and the forty-eight dollars Jack isn’t making is sitting in his chest like a stone he swallowed on Tuesday. So he and Margot came in on the 8:10 bus, La Flaca left chained to the radiator pipe at Delgado, and he is about to spend a dollar fifty of Tuesday’s tip share on a cup of drip coffee.","Margot isn’t spending anything. Pinned to her black wool, on a safety pin, is a press badge she made herself on a Dymo labeler: MARISOL TIDE · PRESS, raised white letters on red tape. She shows it to the barista. The barista looks at it for a long time, and then at her, and then gives her a coffee. “The *Tide* wants eight column inches on the local scene,” she tells Jack, uncapping her pen. “There is no local scene. I’m going to describe its absence.”","Café Bastille is a room that has decided to be in Paris: mismatched chairs, every one from a different decade, a tin ceiling painted the color of a smoker’s teeth, French posters curling at the corners. One is *Les Quatre Cents Coups*, the boy on the beach at the end — Jack has seen that boy run toward the sea on Theo’s laptop at four in the morning. At the front, a mic on a stand, a PA with two mics and a lot of tape, a pickle jar for tips. By the register, the sign-up.",{"type":"doc","title":"Chalkboard by the register","text":"OPEN MIC — THURSDAYS — 8:30\n3 SONGS OR 5 MINUTES. TIP YOUR BARISTA.\nNO “WONDERWALL.” WE MEAN IT.\n1. Dana R. — poems\n2. Caleb H. — ???\n3. Julian\n4. Ted & Ted"},"Jack’s eyes go past the chalkboard to the back of the room, and stop. The barista follows them. He has a Che Guevara tattooed on the inside of his forearm, the famous one, beret and star, and a grievance in his face. “The Saints girl,” he says. “She with you?”","“Sort of.”","“She didn’t fight me about Che.” He sets down the drip. “Last week she comes in here and tells me he shot people in a fortress and I’m wearing a war criminal on my arm like a Hello Kitty. Tonight she paid and said thank you.” He looks at the back of the room again. “Is she sick?”","Lena is alone at the back table under the Truffaut poster, in the Justins and the cardigan, a pot of tea in front of her gone cold enough that the bag is still in it. She has his paper flat under her left hand and a red pen in her right, uncapped, not moving. She looks up and sees him, and for a second she has the face of somebody caught somewhere she didn’t tell anyone she’d be. Beside Jack, Margot, who knows the floor’s movements to the quarter hour and logs them, stops with the free coffee halfway to her mouth. “Broussard,” she says, very quietly, as if she’d seen a fox in the quad."],"choices":[{"text":"Sit with her.","tag":"Go","set":{"e4_bastille":"lena","rel.lena.warmth":"+1","rel.lena.trust":"+1"},"response":["He goes back between the tables with the coffee. She watches him the whole way, and when he gets there she lifts the OCTAVIA tote off the chair beside her and puts it on the floor between her boots. Then she turns his paper face down, and caps the pen, and sets it on top.","He sits. She pours herself a cup of the cold tea and drinks it as if it were hot."],"goto":"s09b"},{"text":"Sit with Margot. Leave her the table.","tag":"Control","set":{"e4_bastille":"margot","trait.control":"+1","rel.lena.trust":"+1","rel.margot.warmth":"+1"},"response":["He lifts a hand across the room. Lena looks at it, and at him, and lifts the red pen an inch off his paper, which is as much of a wave as she has in her tonight. Then she goes back to not writing anything.","He takes the chair at Margot’s table near the PA. “Restraint,” Margot says. “I’ll allow it.”"],"goto":"s09b"},{"text":"Bring her a cortado she didn’t order.","if":"trait.charm>=8","tag":"Charm","set":{"e4_bastille":"coffee","trait.charm":"+1","rel.lena.warmth":"+1"},"response":["He leaves the drip on the counter and spends another two-seventy-five he was saving for postage on a cortado, the little glass one, the way Theo makes them at nine in the morning as if he were doing you a favor, and carries it back between the tables and sets it down beside the cold tea.","Lena looks at the glass. Then at him. “That’s a Theo move.” “I learned from the best.” She looks at it a moment more, and then she picks it up in both hands and drinks, and moves the tote off the other chair with her boot. He sits."],"goto":"s09b"}]},"s09b":{"slug":"THURSDAY · 9:14 PM · CAFÉ BASTILLE","music":"Elliott Smith — “Between the Bars”","set":{"resolve.lena":4},"body":["Dana R. is a sophomore in a beret, and her poem is about the patriarchy, and somewhere in the second stanza she rhymes *patriarchy* with *malarkey* and goes on as if nothing has happened. Margot writes it down. Jack, from where he is, can see her face as she does it: it is the happiest he has seen Margot Lindqvist all week, possibly ever, the pen moving fast and the corners of her mouth fighting a losing war.","Then Caleb H., in his Darwin-fish T-shirt, does four minutes of Assemblies of God — the Visalia twang dropped an octave, the King James, a whole Wednesday-night service in miniature — and then tongues, a rolling torrent of it, eyes shut, one hand up, and the room loses its mind. Ted, of Ted & Ted, is slapping a table. Caleb takes it all the way out, says “*Selah*,” bows, and goes and sits down in the corner by the bathroom with his hands between his knees and his face the color of putty, and doesn’t look up for the next act. Everybody stops clapping. Lena doesn’t, not for a while; she claps for him alone, steadily, after everyone else is done, until he lifts his head and finds out who it is.",{"if":"e4_wed==\"point\"","text":"The barista with the Che tattoo leans into the mic. “Julian.” And it’s him, the cardigan, the Timex, the case he didn’t open at the wall; he sits on the stool and tunes, and his eyes come up and find Jack once across the room, and go back to the strings.","else":"The barista with the Che tattoo leans into the mic like a man introducing a prizefighter. “Ladies and gentlemen, Julian Park-Ellis.” And Jack knows him: the gray cardigan, the warm brown face, the boy on the Lighthouse landing in August, playing “Skinny Love” again after the laptop died, while Lena held Laney’s hair and went very quiet. He sits on the stool and tunes, and doesn’t look at anybody."},"He does a cover first, Elliott Smith, “Between the Bars,” almost in a whisper, and Bastille does a thing Jack didn’t think a room on Mission Street could do: it shuts up. The espresso machine stops. A girl at the window puts her phone face down. It’s a song about loving somebody at the bottom of a glass, and Julian sings it as if he’s sorry for both of them.","Then he retunes a string, slowly, and says into the mic, “This one’s called ‘Fresno.’” Behind the counter the barista picks up a rag and starts wiping down the steam wand, though it’s clean. “He only plays that one once a month,” he says.","There is no lyric sheet; there’s only what comes through the PA. A girl from a town where the raisins dry on paper in the rows. *You sang the high part in a borrowed robe.* A choir; a five-pound bag of something at Thanksgiving, or maybe Jack only hears that because Priya said it at a quarter to two on Wednesday morning. Then the chorus, and Julian’s voice opening up for it, plain as a hand:","*You said the wall was where you yelled at God / I never heard Him yell back.*",{"if":"e4_bastille==\"margot\"","text":"Across the room, at the back table, Lena goes still. Not a flinch. The opposite, as if somebody had told her not to move and she meant to be very good about it.","else":"Beside him, Lena goes still. Not a flinch. The opposite, as if somebody had told her not to move and she meant to be very good about it. He can feel it through the arm of the chair."},{"if":"e4_wed==\"point\"","text":"The second verse is the Point. Jack would know it with his eyes shut now: the dirt lot, the low wall, the drop on the other side, a voice going out over the water at night with nothing to stop it.","else":"The second verse is the Point. Jack has only ever seen it from the Lighthouse porch, a dark headland with a dead light on it, but the song puts him there: a wall, the drop on the other side, a voice going out over the water at night with nothing to stop it."},"The second chorus comes round. *You said the wall —* and Lena gets up. Tote, cardigan, quietly, the chair lifted back so it won’t scrape. She goes between the tables with her head down, and she’s out. His paper is still on the table, face down, the red pen lying on it.",{"if":"e4_bastille==\"margot\"","text":"From across the room he has watched all of it, and hasn’t moved.","else":"Her chair is still warm beside him."},{"if":"e4_bastille==\"margot\"","text":"Margot doesn’t look up from the Moleskine. “Go,” she says. “I’ll review the absence.”","else":"Across the room by the PA, Margot catches his eye over the Moleskine and points her pen at the door."}],"choices":[{"text":"Grab the paper and go after her now.","tag":"Go","key":"You went after Lena in the middle of the song.","set":{"e4_followed":"now","trait.sincerity":"+1"},"response":["He takes the paper and the pen and goes, between the tables, Julian still singing at his back, and the bell over the door rings behind him."],"journal":[{"kind":"clue","id":"fresno","title":"“Fresno”","text":"Julian’s song. He only plays it once a month. “You said the wall was where you yelled at God / I never heard Him yell back.” Lena left in the second chorus. So did I."},{"kind":"person","id":"julian","title":"Julian","text":"The guitar guy from the Lighthouse stairs. Plays Bastille Thursdays. Wrote a song called “Fresno.” Plays it once a month.","if":"e4_wed==\"iftar\""},{"kind":"person","id":"julian","title":"Julian","text":"The guitar guy from the Lighthouse stairs. Used to sit at the wall with Nora — she sat on the wrong side and yelled at God, he sat on the right side and played whatever she asked. Wrote a song about it called “Fresno.” Plays it once a month.","if":"e4_wed==\"point\""}],"goto":"s10"},{"text":"Stay till he stops. Then go.","tag":"Go","key":"You stayed till Julian stopped, then went after Lena.","set":{"e4_followed":"stayed","trait.control":"+1","rel.julian.warmth":"+1"},"response":["He stays. Julian gets through the chorus, and the bridge, and starts the third verse, and his voice goes on the first line — just goes, the note breaking up like a radio losing the station. He stops. The guitar rings on alone a moment and he puts his palm flat on the strings. “That’s —” He looks at the floor. “That’s as far as that one goes.”","The room claps for a song that didn’t end. Jack claps too."],"journal":[{"kind":"clue","id":"fresno","title":"“Fresno”","text":"Julian’s song. He only plays it once a month. “You said the wall was where you yelled at God / I never heard Him yell back.” His voice went before the last verse. Lena left in the second chorus."},{"kind":"person","id":"julian","title":"Julian","text":"The guitar guy from the Lighthouse stairs. Plays Bastille Thursdays. Wrote a song called “Fresno.” Couldn’t finish it.","if":"e4_wed==\"iftar\""},{"kind":"person","id":"julian","title":"Julian","text":"The guitar guy from the Lighthouse stairs. Used to sit at the wall with Nora — she sat on the wrong side and yelled at God, he sat on the right side and played whatever she asked. Wrote a song about it called “Fresno.” Can’t finish it.","if":"e4_wed==\"point\""}],"goto":"s09c"}]},"s09c":{"slug":"THURSDAY · 9:52 PM · CAFÉ BASTILLE, THE BAR","set":{"e4_julian_met":true},"body":["Ted & Ted are doing something to a Decemberists song that the Decemberists will never have to know about. Jack collects his paper and the red pen from the back table — the teapot cold, the cup still half full — and on the way to the door he passes the end of the bar, where Julian is sitting by himself with a glass of water and the guitar case standing between his feet.","Julian sees him, and sees the paper. “Your friend left in the second chorus,” he says. “People do.” He taps the rim of the glass with a fingertip, like checking a string. “I think it’s the chorus.”",{"if":"e4_wed==\"point\"","text":"Then, as if it had only now reached him: “You came.” “Margot’s reviewing the local scene.” “Is there one?” “She says no.” Julian smiles at the water glass.","else":"“You were on the Lighthouse stairs,” he says. “In August. With her.” He holds out a hand with calluses on the fingertips like a row of small coins. “Julian.” “Jack.”"},{"if":"e4_wed==\"point\" && e4_point==\"priya\"","text":"“Did you tell Priya the balloon’s holding up?” Jack hasn’t. Julian nods as if he’d expected that."},"“Lena,” Jack says, to give her a name in the room after the way she went out of it. Julian takes it the way he took the barista’s introduction — politely, a word without any music in it yet — and nods.","“Is she okay?”","Jack opens his mouth and finds out he doesn’t know. “I don’t know.”","Julian looks at the door, at the dark glass with Mission Street sliding down beyond it toward the water. “From here people go to the harbor,” he says. “When they’ve got a song in them they didn’t ask for.” He picks up the water. “It’s downhill. That’s most of the reason.”","Jack rolls the paper in his fist, red side in, and the bell rings over the door, and Mission Street takes him downhill."],"journal":[{"kind":"person","id":"julian","title":"Julian","text":"The guitar guy from the Lighthouse stairs. Plays Bastille Thursdays. Wrote a song called “Fresno” and can’t finish it. Told me where people go after it.","if":"e4_wed==\"iftar\""}],"next":"s10s"},"s10":{"slug":"THURSDAY · 9:36 PM · MISSION STREET, DOWNHILL TO THE HARBOR","body":["Mission Street runs downhill to the water the whole way, and at half past nine on a Thursday it belongs to the palms and the Spanish tile and two kids sharing one skateboard. The Borders is dark, a cardboard Dan Brown in the window promising *The Lost Symbol* on Tuesday. The Blockbuster is still open, lit like an aquarium, one clerk inside drifting along the New Releases with a pricing gun. Below it all the harbor lights are strung out on the black, and the air coming up the hill smells of diesel and kelp and the fryer at the fish-and-chips place that closed an hour ago.","She’s a block and a half ahead of him in the brown Justins, walking like she argues, fast and downhill and certain of the ground. The tote bangs on her hip. The cardigan’s on, sleeves pulled down over her hands. Jack has his paper rolled in his fist, red side in. He hasn’t looked at the last page. He hasn’t looked at any of it.","He catches her at Anacapa Street. There isn’t a car in either direction, and she’s standing at the curb waiting for the walk sign — Lena Broussard, who has never in her life waited for a walk sign — with her arms crossed and her face turned toward the harbor.","“You forgot your homework.”","She turns. Her face is wet, all of it, cheekbones to jaw, and she doesn’t wipe it. She looks at the paper in his hand as if she’s never seen it before, and doesn’t take it.","“Bastille was hot,” she says. “I needed air.” Her hand goes to the medal at her throat.","The walk sign comes on, white, ticking, and neither of them crosses."],"choices":[{"text":"“Okay. Can I walk with you?”","tag":"Sincerity","set":{"e4_air":"okay","trait.sincerity":"+1","rel.lena.trust":"+1"},"response":["She doesn’t answer. She crosses, and on the far side of Anacapa she slows to the speed of somebody who expects company, and that’s the answer. They go down the hill side by side past the Spanish tile and the shut bakery, not talking, and she lets him take the tote off her shoulder."],"goto":"s10b"},{"text":"“It’s sixty degrees.”","tag":"Candor","set":{"e4_air":"sixty","trait.candor":"+1","rel.lena.friction":"+1"},"response":["“Then I needed sixty degrees, Costigan.” There’s the edge, the first he’s heard on her all week, and for a second her whole face is almost grateful to have something to put it into. She steps off the curb. He steps off after her."],"goto":"s10b"},{"text":"“I hear the harbor’s nice this time of night. Sea lions. Terrible singers. No choruses.”","tag":"Wit","set":{"e4_air":"sealions","trait.wit":"+1","rel.lena.warmth":"+1"},"response":["One corner of her mouth gives way, and the laugh gets that far and no farther. “You are a terrible person,” she says, wet-faced, and crosses, and he crosses with her. Down at the bottom of the hill, faint and hoarse, the sea lions are already at it."],"goto":"s10b"}]},"s10s":{"slug":"THURSDAY · 10:09 PM · MARISOL HARBOR, THE PIER","body":["Mission Street runs downhill to the water the whole way, and Jack goes down it alone with his paper rolled in his fist: past the Borders, dark, a cardboard Dan Brown in the window promising *The Lost Symbol* on Tuesday; past the Blockbuster, lit like an aquarium, one clerk drifting along the New Releases with a pricing gun; past the fish-and-chips place, shut, still breathing fryer oil into the street. Two kids are sharing one skateboard down the middle of the empty road, one riding and one running alongside, trading off at every corner. He walks behind them for three blocks and doesn’t look at the last page. Below it all the harbor lights are strung out on the black. Julian was right. It’s downhill.","The pier starts at the bottom of the hill where Mission runs out of road: wet boards, a chain-link gate propped open with a bait bucket, a hand-lettered sign about not feeding the sea lions that somebody has corrected in marker to NOT FEEDING THEM ENOUGH. He walks out it slower than he walked down the hill. He doesn’t know what he’s going to say, and the pier is long enough to find out he still doesn’t.","He finds her at the very end, past the bait shack with its grille pulled down over a hand-painted squid and the fish market’s dark windows, out where the railing stops at a chain, under the one lamp. She’s standing with her arms crossed and her face to the breakwater. When the boards tell her somebody’s coming she turns around, and her face is wet, all of it, cheekbones to jaw, and she doesn’t wipe it.","She looks at the paper in his hand as if she’s never seen it before. “Bastille was hot,” she says, before he’s asked her anything. “I needed air.” Her hand goes to the medal at her throat, and she looks at him as if waiting to see whether he’ll buy it."],"choices":[{"text":"Stand next to her at the chain. Don’t ask.","tag":"Sincerity","set":{"e4_air":"stood","trait.sincerity":"+1","rel.lena.trust":"+1"},"response":["He comes and stands beside her at the chain, close enough to count, not close enough to be a question. She looks at him sidelong, once, and then back out at the breakwater, and after a while her shoulder settles an inch his way."],"goto":"s10b"},{"text":"“You forgot your homework.”","tag":"Wit","set":{"e4_air":"homework","trait.wit":"+1","rel.lena.warmth":"+1"},"response":["“I didn’t forget it,” she says. “I abandoned it. There’s a difference, and it’s moral.” It’s the first thing all week that sounds like her. She takes the paper out of his hand, looks at it, and gives it straight back."],"goto":"s10b"},{"text":"“Julian said this is where people come.”","tag":"Candor","set":{"e4_air":"julian","trait.candor":"+1","rel.lena.friction":"+1"},"response":["“Julian should mind his business,” she says. “Julian should finish his song.” She hears it land, and her mouth twists. “That was mean. He’s good. He’s very good.” She turns back to the water. “That’s the problem.”"],"goto":"s10b"}]},"s10b":{"slug":"THURSDAY · 10:18 PM · MARISOL HARBOR, THE END OF THE PIER","body":[{"if":"e4_followed==\"now\"","text":"They walk out the pier together, past the bait shack with its grille pulled down over a hand-painted squid, past the fish market’s dark windows and a hose coiled on the wet boards, out to where the planks go gray and soft underfoot and the railing stops at a chain. She stays half a step ahead, as she has all the way down Mission, but not so far ahead that it counts.","else":"So they stand at the chain a while, side by side, the planks shifting under them on the swell."},"Down on the float the sea lions are stacked three deep, barking at something nobody else can see; every so often one slides off with a slap and swims a lap and hauls itself back up into the pile and gets barked at for its trouble. Out past the breakwater a bell buoy rings now and then on the swell.","Across the harbor the Anchor sits on its wharf with the counter lit and the kitchen dark. From here Jack can see the glow of the pie case and a shape at the register that’s Gloria, and a sheet of paper taped inside the door that he can’t read at this distance and doesn’t need to: CLOSED FOR CLEANING — PIE & COFFEE ONLY. Once a year the hood men come with their tarps and their degreaser, and the Hobart sits cold, and six hours at eight dollars go wherever money goes when you don’t make it.","“That’s my night off,” he says, and points.",{"if":"e4_followed==\"now\"","text":"She looks across the water at his dark kitchen. “Your night off,” she says, “and you spent it at an open mic and then chasing a girl down Mission Street. Costigan, that is the saddest thing I have ever heard, and I’ve been to a Vigil Mass in Metairie with a guitar choir.”","else":"She looks across the water at his dark kitchen. “Your night off,” she says, “and you spent it at an open mic and then hunting a girl down to the end of a pier. Costigan, that is the saddest thing I have ever heard, and I’ve been to a Vigil Mass in Metairie with a guitar choir.”"},"“How much is a night off?” “Forty-eight dollars. Plus the tip share.” She does the arithmetic with her eyes on the far side of the harbor; he can watch her do it. “What were you going to do with forty-eight dollars, Costigan?” “Books,” he says. It’s true as far as it goes. She looks at him sidelong, and lets it go exactly that far. “Books,” she says. “Lord. You’re worse than me.”","Then she sits down on the very end of the pier, where there’s no rail, and pulls off the Justins one and then the other and sets them side by side on the planks behind her, toes even. She puts her legs over the drop. Her bare feet hang over black water, fifteen feet of nothing under her heels, and the swell comes in under the pier and lifts and sucks at the pilings, and she swings her feet once, as if it’s her daddy’s porch.","Jack sits down beside her with his own legs over the edge, because it would be stranger not to. He wants her six inches farther back. He wants it badly and all at once — fifteen feet, the tide running under the boards, and he’s a Mill Creek Park kid who grew up on stories about Lake Glacier taking somebody’s cousin every March. He doesn’t say it. She isn’t his to say it to.","She catches him looking at the drop anyway. “I can swim, Costigan,” she says. “I grew up below sea level. We learn before we walk.”","His hands want a cigarette. They’ve wanted one since the second chorus. The pack is in the inside pocket of the Carhartt, against his ribs, and his hands know exactly where."],"choices":[{"text":"Light one.","tag":"Reckless","set":{"e4_pier_cig":"lit","reliquary":"+1","jack_cigs":"+1","trait.reckless":"+1","rel.lena.heat":"+1","soul.restraint":"-1","resolve.jack":"-1"},"key":"Lena smoked half of your cigarette, then put it in the tin.","response":["He lights it with his back to the wind and gets one pull before she reaches over without looking and takes it out of his mouth, as she has every time since a porch on Seacliff Road. He waits for the stub on the planks. Instead she looks at it, and then she puts it to her own mouth, where his just was, and drags.","She coughs like a girl from a Catholic school — bent over her knees, eyes streaming, a hand flat on the wet boards. “Lord have *mercy*. You pay money for this.” Then she takes a second one, slow, better, looking across the water at the Anchor, and lets the smoke go out over the harbor. The coal lights her face orange from underneath. The filter’s damp from his mouth and then from hers. Jack watches her mouth on his cigarette and wants her, plainly. There’s a grain of tobacco on her lower lip that she doesn’t know about. She takes a third drag, short, and looks at the coal as if it has told her something.","She stubs it out on the plank between them, carefully, and blows on it to be sure, and takes the tin out of her cardigan pocket. She tears a corner off the Bastille receipt in her tote and writes on her knee.",{"type":"doc","title":"A slip of paper, folded into the tin","text":"No. 3 · 9/10/09 · the harbor · confiscated and partially consumed by the Reliquarian. Do not ask."},{"if":"e3_tin==\"class\"","text":"“Fourth-class,” she says, and snaps the lid. “I founded it. I can amend it.”"}],"journal":[{"kind":"note","id":"cigarette","title":"The Reliquary","text":"An Altoids tin from a pea-soup restaurant in Buellton. RELIQUARY on the lid. No. 1: the Lighthouse. No. 2: Malibu, before breakfast. No. 3: the harbor — she smoked half of it first. Do not ask."}],"goto":"s10c"},{"text":"Sit on your hands.","tag":"Control","set":{"e4_pier_cig":"sat","trait.control":"+1","resolve.jack":"+1","soul.restraint":"+1","rel.lena.friction":"-1"},"key":"You didn’t smoke at the end of the pier.","response":["He sits on them — actually sits on them, palms down on the wet planks under his thighs, like an altar boy who’s been warned. The pack stays where it is. She notices. She notices anything that has his hands in it.","“You’re not smoking.” “Not tonight.” She’s quiet a while, her feet going over the dark. Then she knocks his boot with her bare heel, once. “Good.”"],"goto":"s10c"},{"text":"Hand her the pack. “Hold these. I’m weak tonight.”","tag":"Sincerity","set":{"e4_pier_cig":"held","trait.sincerity":"+1","rel.lena.trust":"+1"},"key":"You gave Lena your cigarettes to hold.","response":["She weighs the pack in her palm, unimpressed. “That’s not how this works, Costigan. I collect them one at a time, off your face.” Then she tucks it into her cardigan pocket anyway, where it knocks once against the tin, and keeps her hand over the pocket."],"goto":"s10c"}]},"s10c":{"slug":"THURSDAY · 10:41 PM · MARISOL HARBOR, THE END OF THE PIER","music":"Sufjan Stevens — “Casimir Pulaski Day”","body":["She takes the Hopkins out of his back pocket as if it were hers. He’s caught her reading his margins since the first week, upside down across the seminar table, and tonight she doesn’t bother waiting for him to look away. She just reaches behind him and takes it, and the book falls open where it falls open now, at the Benedict holy card, at the sonnet he’s read so many times the page has gone soft as a dish towel.","Under the lamp he can see what she sees. The Latin from Jeremiah at the top. The poem. And in the margin beside the first line, small, in his own pencil, from a night last week he would very much like back: *Show Lena.*","She looks at her own name. Then she tilts the page to the lamp and reads it aloud, in the voice she uses at Hale’s table, the one that makes Caleb sit up, every stress where Hopkins hammered it in:","*“Thou art indeed just, Lord, if I contend / With thee; but, sir, so what I plead is just. / Why do sinners’ ways prosper? and why must / Disappointment all I endeavour end?”*","Her voice holds through the sinners. It goes, a little, on *friend*:","*“Wert thou my enemy, O thou my friend, / How wouldst thou worse, I wonder, than thou dost / Defeat, thwart me?”*","She stops there. The sea lions start up and quit. She reads the rest to herself with her lips moving — the banks and brakes, the birds building, *Time’s eunuch* — and then, after a silence long enough that he thinks she’s finished, the last line out loud, quieter, as though it belongs to her now:","*“Mine, O thou lord of life, send my roots rain.”*","She closes the book on her thumb and turns it over and finds the purple stamp along the edges of the pages, CARDINAL MOONEY H.S. LIBRARY — DISCARD. “They threw out Hopkins.” “They threw out a lot. I got Augustine for a dime and Hopkins for a quarter.” “Hopkins cost more than Augustine?” “Hopkins was in better shape.” That gets the corner of her mouth, a little. Then she opens the book again to the holy card and the pencil in the margin. “*Show Lena*,” she reads. “Well.” She puts the book back in his hands. “You did.”",{"if":"e4_pier_cig==\"held\"","text":"In her cardigan pocket his pack of Reds rides against the tin."},"“Do you ever yell at Him?” she asks. She’s looking at the dark kitchen across the water, not at him.","Jack thinks about saying no."],"choices":[{"text":"“Once. When I was sixteen.”","tag":"Sincerity","set":{"e4_yell":"once","rel.lena.trust":"+1","soul.honesty":"+1","trait.sincerity":"+1"},"response":["“Once,” he says. “Sixteen.” The swell goes in under the pier and comes back out. “It wasn’t yelling, really. It was more like finding out somebody was in the room.” That’s where the sentence ends, and he lets it. She doesn’t ask him for the rest. She nods, slowly, and turns it over, and gives him back the quiet."],"goto":"s10c2"},{"text":"“Only during Browns games. He knows what He did.”","tag":"Wit","set":{"e4_yell":"browns","rel.lena.warmth":"+1","soul.honesty":"-1","trait.wit":"+1"},"response":["She snorts — actually snorts, Lena Broussard, at the end of a pier — and she lets him have the dodge. He watches her decide to. She looks back across the harbor, and the swell goes in under the pier and comes back out."],"goto":"s10c2"},{"text":"“Do you?”","tag":"Candor","set":{"e4_yell":"you","trait.candor":"+1"},"response":["She takes that as fair. She takes it, he thinks, as permission. “Yes,” she says."],"goto":"s10c2"}]},"s10c2":{"slug":"THURSDAY · 10:49 PM · MARISOL HARBOR, THE END OF THE PIER","body":["Then she tells him.","“My grandmother died in the storm,” she says. “In ’05. Grandmère. Lucille Guidry. Five foot nothing in her church shoes. She taught me gumbo standing on a step stool at her stove, and she had hands like an oyster shucker’s, all knuckle, and she said the rosary in Cajun French so fast you’d think she was mad at the Blessed Mother. She wasn’t. She just wanted to get to the end and start over.” She draws a breath, and it shakes, and she flattens it. “Water. Heat. Four days.”","He opens his mouth — he doesn’t know for what — and she gets there first.","“It doesn’t matter how.” She says it fast and level, worn smooth, a sentence she has said to herself more often than to anyone else. “We didn’t get to bury her till November. In the good dress.” A flicker, there and gone, of the girl who wins: “She’d have killed us otherwise.” He heard her say it once before, on the first Sunday, about a senator — *you bury everybody, and you bury them in the good dress* — and he took it for a figure of speech.","“The medal came back to my mother in a plastic bag,” she says. “In February. And my mother put it in my hand when I turned fifteen and didn’t say a word. She closed my fingers on it and went back in the kitchen. And I have never asked her one question. Not one.” She shakes her head. “I argue with *everybody*, Costigan. I argued a parking officer out of a ticket the day I got here.” He knows. He watched her do it from across the Commons Lawn, a pelican lamp under her arm, before he knew her name. “And I have never asked my mother one question.” Her hand finds the medal and holds it.","“The year after, I yelled at Him. I was fourteen. I went to Mass every single morning for a year — wherever we were living, whatever church had its roof back, with the old ladies and their plastic rain bonnets — so He’d have to look at me. I’d kneel there and think, *look at me. Look at what You did.*” She lifts one shoulder. “And somewhere in there — I couldn’t tell you what month — it stopped being a fight. And I kept going anyway.”"],"choices":[{"text":"Say nothing. Let the quiet be hers.","tag":"Control","set":{"e4_grief":"quiet","rel.lena.trust":"+1","soul.restraint":"+1","trait.control":"+1"},"response":["He lets the quiet be hers. The sea lions sort something out among themselves on the float; a halyard pings against a mast somewhere in the dark. After a while she breathes out, long, and swings her feet once over the water, and her shoulders come down an inch."],"journal":[{"kind":"person","id":"lena","title":"Lena Broussard","text":"New Orleans. Two seventeen. Classics. Hale paired us for the semester. Makes a roux like she’s taking a vow and expects you to keep up. Her father sells Gulf shrimp — Broussard’s Seafood, Banks Street. Boyfriend: Wes Arceneaux — Tulane, civil engineering, the boat at sixteen. Calls at 8:04 on the dot. Her grandmother, Lucille Guidry, died in the storm in ’05; they buried her in November, in the good dress. The medal came back to her mother in a plastic bag. She has never asked her mother one question. The year after, she went to Mass every morning to yell at God, and somewhere in there it stopped being a fight."}],"goto":"s10c3"},{"text":"“Tell me about the gumbo.”","tag":"Sincerity","set":{"e4_grief":"gumbo","rel.lena.warmth":"+1","trait.sincerity":"+1"},"response":["She turns her head and looks at him as if he’s asked the one question she has an answer ready for. “Dark roux. Darker than you’re comfortable with. Okra in the summer, filé when there’s no okra, never both, and never, *ever* tomatoes. Tomatoes are for Creoles and Yankees.” The Banks Street speed comes back into it for a sentence, and he’s so glad to hear it he could put his head down on the planks. “She’d smack your hand with the spoon.” She wipes her face with the cardigan cuff, finally. “I make it. I make it wrong. Every time, it’s wrong in the same place.”"],"journal":[{"kind":"person","id":"lena","title":"Lena Broussard","text":"New Orleans. Two seventeen. Classics. Hale paired us for the semester. Makes a roux like she’s taking a vow and expects you to keep up. Her father sells Gulf shrimp — Broussard’s Seafood, Banks Street. Boyfriend: Wes Arceneaux — Tulane, civil engineering, the boat at sixteen. Calls at 8:04 on the dot. Her grandmother, Lucille Guidry, died in the storm in ’05; they buried her in November, in the good dress. The medal came back to her mother in a plastic bag. She has never asked her mother one question. The year after, she went to Mass every morning to yell at God, and somewhere in there it stopped being a fight."}],"goto":"s10c3"},{"text":"“I’m sorry, Lena.”","tag":"Candor","set":{"e4_grief":"sorry","rel.lena.trust":"+1","trait.candor":"+1"},"response":["He says it plain, her name and all. She nods, once. “Everybody was sorry,” she says. “The whole country was sorry for about a month.” It isn’t aimed at him. She looks at him to make sure he knows that, and then back at the water, and lets him stay sorry next to her."],"journal":[{"kind":"person","id":"lena","title":"Lena Broussard","text":"New Orleans. Two seventeen. Classics. Hale paired us for the semester. Makes a roux like she’s taking a vow and expects you to keep up. Her father sells Gulf shrimp — Broussard’s Seafood, Banks Street. Boyfriend: Wes Arceneaux — Tulane, civil engineering, the boat at sixteen. Calls at 8:04 on the dot. Her grandmother, Lucille Guidry, died in the storm in ’05; they buried her in November, in the good dress. The medal came back to her mother in a plastic bag. She has never asked her mother one question. The year after, she went to Mass every morning to yell at God, and somewhere in there it stopped being a fight."}],"goto":"s10c3"}]},"s10c3":{"slug":"THURSDAY · 10:58 PM · MARISOL HARBOR, THE END OF THE PIER","body":["She holds her hand out for his paper. He gives it to her, and the red pen with it. She pages past her own few marks — a single *No.* on the first page, a bracketed *source?* on the second, not much else, not this week — to the last page, and holds it under the lamp for him.",{"type":"doc","title":"Red ink, last page","text":"*You keep writing “we” when you mean “I.” Who are you paying for, Costigan?*"},{"if":"e3_lena_monday==\"family\"","text":"“Monday, on the beach, you said ‘family stuff. Mostly.’ I let you have ‘mostly.’” She taps the page with the cap of the red pen. “I want it back.”"},{"if":"e3_told_lena_frank && !e3_duel_personal","text":"And then, gentler: “You told me your daddy’s good. Is he?”"},"She waits. Her bare feet hang over the water. Across the harbor the pie case glows in the dark diner like a votive rack."],"choices":[{"text":"Tell her about Danny.","tag":"Sincerity","cue":"Lena will remember that.","set":{"e4_lena_danny":"told","lena_knows_danny":true,"rel.lena.trust":"+2","rel.lena.warmth":"+1","soul.honesty":"+1","resolve.jack":"+1","trait.sincerity":"+1"},"key":"You told Lena your brother is in prison.","response":["“My brother,” he says. He gives her the sentences he gave Theo on Monday morning, in the same order, because they’re the ones he has. Trumbull Correctional, a state prison outside Warren, half an hour from the house. Five years. A fight; a guy got hurt bad. He pleaded. Three more to go, maybe less. “He gets one book a month. From me. Used. I erase the margins first, because they can’t have writing in them, and I
