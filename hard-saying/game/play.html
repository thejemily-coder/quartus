 send what I wrote on a separate sheet.”","She doesn’t ask what the fight was. Of everyone he’s ever met, she might be the one who knows best how not to ask a thing. What she asks is, “What’s his name?” “Danny.” “Danny,” she says, once, carefully, as if she means to bring it to Mass in the morning.","Then she does the thing she does, which is make it an argument, and the argument is mercy. She puts his paper back in his hands, last page up. “Then you can love him. You can’t pay for anybody, Costigan. You wrote it yourself, in twelve-point Times: there’s one who pays, and it isn’t you. Read your own paper.”",{"if":"e3_told_lena_frank && !e3_duel_personal","text":"He looks at the dark kitchen across the water. “He’s not good,” he says. “My dad. He’s in the garage. He goes out there after supper and sits with the radio on, and the truck’s in the driveway with nowhere to be.” She leans over until her shoulder is against his arm, and leaves it there."}],"goto":"s10d"},{"text":"“My brother. I can’t yet.”","tag":"Candor","set":{"e4_lena_danny":"partial","rel.lena.trust":"+1","soul.honesty":"+1","trait.candor":"+1"},"key":"You told Lena there’s a brother you can’t talk about yet.","response":["“My brother,” he says, and gets that far, and finds the rest of it isn’t there to say. “I can’t yet.” She studies him under the lamp. Then she nods. “Okay. When you can.” She folds the paper with the red page inside and puts it back in his hands.",{"if":"e3_told_lena_frank && !e3_duel_personal && e3_lena_monday==\"family\"","text":"“He’s — ” He hears it coming and can’t get out of its way. “Mostly.” She laughs at that — at the word she just took back from him, thrown back at her across a pier at eleven at night — and finally wipes her face with the heel of her hand."},{"if":"e3_told_lena_frank && !e3_duel_personal && e3_lena_monday!=\"family\"","text":"“He’s okay,” Jack says, which isn’t an answer, and she lets it not be one."}],"goto":"s10d"},{"text":"Tell her a Danny story instead — the funny one.","tag":"Wit","set":{"e4_lena_danny":"story","rel.lena.warmth":"+1","trait.wit":"+1"},"key":"You told Lena about Danny and the frozen lake, and not the rest.","response":["So he tells her about Danny without telling her about Danny. The winter Danny was eighteen and Jack was fourteen, Danny took the Silverado down to Lake Glacier in Mill Creek Park when the ice was a foot thick, put Jack behind the wheel, told him the brake was more of a suggestion, and the two of them did doughnuts in the dark until the trees went around them in the headlights like a carousel. Frank found out on Monday because a park ranger knew the truck — forest green, rust over the wheel wells, St. Christopher on the visor, the only one like it in Mahoning County. Frank stood in the garage and said, “God help the both of you,” and grounded Danny, who was eighteen and technically couldn’t be grounded, and Danny stayed grounded anyway, for a month, out of respect.","She laughs, finally, all the way, out over the water, one hand flat on the boards to keep herself on the pier. Then she looks at him, and the laugh goes quiet without going away. “You love him.” “Yeah.” She can tell there’s more. It’s right there in her face that she can tell. She lets it be.",{"if":"e3_told_lena_frank && !e3_duel_personal","text":"“Don’t ask me about my dad tonight,” he says, and she nods, and wipes her face with the heel of her hand."}],"goto":"s10d"},{"text":"“Everybody. That’s the joke.”","tag":"Control","set":{"e4_lena_danny":"everybody","trait.control":"+1","soul.honesty":"-1","resolve.jack":"-1","rel.lena.friction":"+1"},"key":"You told Lena you were paying for everybody.","response":["“Everybody,” he says. “That’s the joke. I’m Catholic, Broussard. We pay for everybody. It’s in the brochure.” She looks at him under the lamp, long enough that he has to look at the water instead. Then she allows it, and folds the page closed.",{"if":"e3_told_lena_frank && !e3_duel_personal","text":"“And my dad’s good,” he says. She leaves him that word, too, the second time she’s had to, and hands him back his paper."}],"goto":"s10d"}]},"s10d":{"slug":"FRIDAY · 12:29 AM · THE WHARF BUS STOP, THEN OCEAN ROAD","body":["At 12:29 the last 11 is idling at the wharf stop with its windows lit and its doors folded open and one passenger asleep against the glass, a man in a fish-plant apron with his cap over his eyes. The driver looks at them. Jack has a foot on the step.","Lena stands on the curb with her boots in one hand and looks at the bus: the bright aisle, the yellow grab bars, the placard for a personal-injury lawyer running the length of the windows. “I don’t want to be in a lit box with people,” she says. The driver gives them a polite few seconds more. Jack takes his foot back off the step. The doors fold shut and the 11 pulls away up Mission with its one sleeper, and the wharf is very quiet. He would have gotten on.","So it’s three miles. Ocean Road climbs out of town along the bluff, and while they were on the pier the fog came in off the water and filled the road to the tops of the streetlights, so each one stands in its own gray room. Eucalyptus on the inland side, dripping: the menthol smell, and under it, rain that hasn’t happened yet. A sprinkler ticking on somebody’s lawn at a quarter to one. The taquería at the edge of town shut, its chairs upside down on its tables. A raccoon walks the top of a fence beside them for half a block and drops off the far side.","She walks the first mile barefoot on the sidewalk with the Justins hooked in one hand. “Your feet,” he says, at a broken bottle glittering under a streetlight. “Are from Louisiana,” she says, stepping around it. “They’ve been through worse than California.” Where the sidewalk gives out to gravel shoulder she sits on the guardrail and pulls them back on and stamps her heels down into them, and they go on.","She’s cold. Her arms are crossed, her hands up inside the cardigan sleeves, and out on the open stretch, where the wind comes straight up the bluff off the water, her shoulders rise toward her ears. Jack takes off the Carhartt and puts it around her.","It’s enormous on her. It comes down to the middle of her thighs, and it smells of cigarettes and the Hobart’s steam and him, and the collar has folded under at the back. He fixes it, his hands at her neck in the fog for exactly as long as it takes to fix a collar, his knuckles against the warm skin under her jaw, and then he takes his hands back and puts them in the pockets of his jeans, and it is the most expensive thing he’s done all night.",{"if":"e4_lena_danny==\"told\"","text":"“It’s his,” Jack says. She pulls it closed in front of her with both fists and is quiet for a hundred yards.","else":"“You know this is too big on you, too,” she says, from somewhere inside it. He knows."},"For a while the road is only the road. Then, out of nowhere: “What would you be doing right now? If you weren’t off.” “Racks,” he says. “The late rush. Fishermen and drunks. Rudy does eggs for people who won’t remember eating them, and I wash the plates.” “And the waitress with the pencil in her hair. From August.” “Gloria.” So he tells her about Gloria: the bus tub on her hip, the pie case, the two chalkboards by the register, and what it says on the second one. Lena stops dead on the gravel shoulder. “She makes you rate the pie.” “In public.” “What did you give the marionberry?” “Four.” “*Four.*” She says it the way a nun says *divorce*. “A woman bakes you a pie with her own two hands and you give her a four. In *chalk*.” “It was a four.” “There is no such thing as a four. A pie is a seven or it’s a declaration of war.” “Then it was a declaration of war.” She walks on, shaking her head inside his collar, and he has the feeling he’s going to hear about the four again.","Farther on, where the bluff drops away and the surf is right there under the guardrail, he asks her about home. “Dupre Street,” she says. “Mid-City. A shotgun my daddy and his brothers put back together with their own hands, two years of weekends.” Four and a half feet of water; the line’s still on the shed, she says, because her daddy won’t paint over it. The whole season the Saints had no home — San Antonio, Baton Rouge, the Meadowlands — her daddy, who has had season tickets since 1981, drove in every Sunday from wherever they were living and sat on the porch of the gutted house on a folding chair with a radio, because the living room was studs and wet sheetrock, and listened to them lose. “Three and thirteen,” she says. She pulls the jacket tighter. “He says it was the best season he ever had.”","Half a mile on she says, “He called early. Before Bastille. I told him I was fine.” A car comes by slow in the fog, headlights first and then a red smear and then nothing. “I’m extremely good at fine.”","There it is, standing open in the middle of Ocean Road: *Are you, though. Does he know. What does he say when you tell him that.*"],"choices":[{"text":"Say nothing. Keep walking.","tag":"Control","set":{"e4_wes":"silent","soul.restraint":"+1","trait.control":"+1"},"response":["Jack walks right past it. He keeps his hands in his pockets and his eyes on the white line and his mouth shut, and the silence is so loud to him he’s sure she can hear it over the surf."],"goto":"s10d2"},{"text":"“Does he know you’re not?”","tag":"Candor","set":{"e4_wes":"asked","trait.candor":"+1","rel.lena.trust":"+1","rel.lena.friction":"+1"},"response":["She takes three steps before she answers. “He knows what I tell him,” she says. “That’s how it works from two thousand miles. You tell each other the parts that travel.” She pulls the jacket tighter. “He’s good, Costigan. He’s a good man. Don’t.”"],"goto":"s10d2"},{"text":"“You don’t have to be fine with me.”","tag":"Sincerity","set":{"e4_wes":"fine","trait.sincerity":"+1","rel.lena.warmth":"+1"},"response":["She walks ten steps before she answers. “I know,” she says, with her chin down. Then, because she’s Lena and it’s one in the morning: “Don’t let it go to your head, Youngstown.”"],"goto":"s10d2"}]},"s10d2":{"slug":"FRIDAY · 1:04 AM · OCEAN ROAD, THE OPEN STRETCH","body":["So they argue instead, because they can, and the argument runs backward. It’s one in the morning and the fog is beading in her hair. “Aquinas didn’t get me to the early Mass, Costigan. Being furious did. If I’d been reasonable I’d have stayed in bed.” And Jack, of all people, hears himself defending reason — defending Job’s friends.","“They came and sat on the ground with him,” he says. “Seven days and seven nights, and nobody said a word, because they saw his grief was very great. That’s the best part of the book. They were perfect. They were perfect right up until they opened their mouths.” “So your argument for reason is three men who should have stayed quiet.” “My argument is that showing up is reason. Sitting in the dirt with a guy is — ”","“And you skipped the ending.” She doesn’t let him have the dash. “Forty-two, verse seven. God finally shows up, and He tells the friends they were *wrong*. Job yelled at Him for most of the book, and Job’s the one who spoke rightly. The yeller wins, Costigan. Aquinas wrote a whole commentary on it — he reads it like a disputation, and God *likes* the argument.” The road bends, and the campus lights show through the fog far ahead, smeared and orange. He doesn’t have the rest of his sentence, and he isn’t going to get it now. She walks along beside him with her fists in his jacket, having won, and waits to see what he’ll do about it."],"choices":[{"text":"“Job got a whirlwind. You got a school bus from Minnesota.”","tag":"Wit","set":{"e4_walk":"whirlwind","trait.wit":"+1","rel.lena.warmth":"+1"},"response":["It reaches her a step late. Then she laughs out loud on Ocean Road at one in the morning, a big helpless Gulf Coast honk of a laugh that stops her in her tracks — she has to bend over with her hands on her knees in the middle of the empty road, in his jacket, to get to the end of it — and he stands there in the fog in his flannel and gets to hear the whole thing. “Oh, that’s *awful*,” she says, straightening up, wiping her eyes with his sleeve. “That’s sacrilege. They were *Catholics*, Costigan. They had a priest who’d never seen a crawfish.” She starts walking again. “He held one up like a relic.”"],"goto":"s10e"},{"text":"“Nobody yells at an empty room.”","tag":"Sincerity","set":{"e4_walk":"empty_room","trait.sincerity":"+1","rel.lena.trust":"+1"},"response":["She stops walking. In the fog, in his jacket, in the middle of Ocean Road, she turns around and looks at him. “Say that again.” He says it again. She stands there with it. Then she starts walking, a little faster than before, with her hands jammed deep in his jacket pockets."],"goto":"s10e"},{"text":"“Ask her one question. Your mother. Just one.”","tag":"Candor","if":"trait.candor>=12","set":{"e4_walk":"mother","e4_ask_mother":true,"trait.candor":"+1","rel.lena.trust":"+1","rel.lena.friction":"+1"},"key":"You told Lena to ask her mother one question.","response":["Her chin comes up, and for a second he thinks he’s about to get the full Broussard, three subpoints and a rebuttal. “Not tonight, Costigan.” They walk. There are no blocks out here, only guardrail and eucalyptus and the surf down below, but they go about a block’s worth of fog before she says, mostly into his collar, “…Maybe at Thanksgiving.”"],"goto":"s10e","cue":"Lena will remember that."}]},"s10e":{"slug":"FRIDAY · 2:08 AM · DELGADO HALL, THE FRONT STEPS","set":{"resolve.lena":5},"body":["Delgado at 2:08 is a concrete grid in the fog with a dozen windows lit for no good reason. Through the lobby glass Marcus is asleep at the front desk, head tipped back, mouth open, a calculus textbook face down on his chest going up and down. Neither of them goes in. Lena sits on the front steps in the jacket, and Jack sits beside her with a foot of cold concrete between them.","At 2:10 a horn sounds down on the bluff — two long, one short, one long — and then the freight itself, more a feeling in the steps than a sound. Jack starts counting under his breath. He’s counted trains since he was six, lying awake on Glenwood Avenue with the window cracked, listening to the freights cross the South Side in the dark.","“What are you doing?” “Counting.” “Counting what?” “Cars. I do it when I can’t sleep.” “You’re not trying to sleep. You’re on a step.” “I’m not really trying to count, either.” She listens. Then she counts too, out loud, a half beat behind him and then not behind him at all, the two of them going up through the thirties and the forties in whispers on the front steps of Delgado Hall while Marcus sleeps on the other side of the glass.","The last car goes by and the sound pulls away up the coast, and the bluff is quiet again. “Sixty-three,” Jack says. “Sixty-five.” “It was sixty-three.” “Sixty-five, Costigan. There were two engines.” “Engines aren’t cars.” “They *pull* the cars. They’re the most important cars.” “That’s like counting the priest in the attendance.” “He *is* in the attendance. He’s the first one there. Without him it’s just people in a room.”","“Why do you count?” He thinks about the window on Glenwood Avenue, cracked an inch in every weather. “When I was six my dad worked second shift. Home around one. There was a freight across the South Side at about a quarter to, and when I got to the end of it, his truck would be in the drive.” “And if it wasn’t?” “Then I counted the next one.” She’s quiet after that.","“My daddy gets up at three,” she says. “For the boats. The screen door, and then the truck. I used to lie there and wait for the truck to start so I could go back to sleep.” She looks off down the dark toward the tracks. “We’re a very boring kind of people, Costigan. People who listen for trucks.”","She tucks her chin down inside the Carhartt’s collar. “I’ll bring it back,” she says. “I’m warm for the first time since Monday.”",{"if":"e4_bastille==\"lena\"","text":"“And you sat down at Bastille and didn’t ask what I was marking,” she says. “I noticed.”"},{"if":"e4_bastille==\"margot\"","text":"“And you let me have my table tonight,” she says. “At Bastille. I noticed.”"},{"if":"e4_bastille==\"coffee\"","text":"“And the cortado,” she says. “I noticed.”"},"Then she turns her head and looks at him, and all the New Orleans goes out of her voice — the speed and the theater and the saints — and what’s left is a girl on a step at two in the morning who means it. “Thank you, Jack.”","She’s said his name before. Not like that."],"choices":[{"text":"“Goodnight, Magdalena.”","tag":"Sincerity","if":"trait.sincerity>=9 && soul.restraint>=0","cue":"Lena will remember that.","set":{"e4_goodnight":"magdalena","rel.lena.heat":"+1","rel.lena.trust":"+1"},"key":"You called her Magdalena, and she let you.","response":["Her mother, the Holy Ghost, and Laney when she wants something: she told him the rule on a porch the first night, and he hasn’t used the name since. She doesn’t correct him. She looks at him in the fog with her chin in his collar, and then she stands up and brushes off the back of his jacket and goes up the last step."],"goto":"s10f"},{"text":"“Text me when you get upstairs.”","tag":"Sincerity","set":{"e4_goodnight":"text","rel.lena.warmth":"+1","trait.sincerity":"+1"},"response":["“It’s one flight, Costigan.” “Text me.” She looks at him as if he’s said something in a language she almost speaks. He doesn’t explain what it means where he comes from. She doesn’t ask. She stands up and brushes off the back of his jacket."],"goto":"s10f"},{"text":"“Goodnight, Broussard.” Let her go in first.","tag":"Control","set":{"e4_goodnight":"broussard","trait.control":"+1","rel.lena.trust":"+1"},"response":["“Goodnight, Costigan.” The old names, handed back and forth across a step at two in the morning like a tool that still works. She stands. He stays where he is and lets her have the door."],"goto":"s10f"}]},"s10f":{"slug":"FRIDAY · 2:16 AM · DELGADO HALL, THE FRONT STEPS","body":["Through the glass she crosses the lobby in Danny’s jacket, the hem swinging at her thighs, her boots quiet on the linoleum, past Marcus and his calculus rising and falling. At the elevator she pushes the button and stands with her back to the glass, small inside the Carhartt. The doors open on their yellow light. She gets in. The doors close, and the numbers over them go to 2 and stay there.","Jack sits on the steps in his flannel. The fog has gotten into it; when he rubs his arms his palms come away damp. Without the Carhartt the cold finds every place it used to be, and he lets it.",{"type":"sms","if":"e4_goodnight==\"text\"","from":"Lena","text":"I’m there. Go to sleep, Youngstown. —L.","time":"2:17 AM"},{"type":"sms","from":"LANEY (FIREMAN’S FAVORITE)","text":"she just walked in wearing ur jacket. not asking. thank u FIREMAN. xo","time":"2:19 AM"},"He doesn’t go up. He sits on the step while the fog comes down over the lawn and puts out the path lamps one after another, until the Lagoon is gone and the Grove is gone and there’s only the lit lobby at his back and Marcus breathing over his calculus, and somewhere up the coast, too far off now to hear, the freight going on north with nobody counting it."],"next":"s11"},"s11":{"slug":"FRIDAY · 2:30 PM · DRIFTWOOD BOOKS, MISSION STREET","body":["At two on Friday the sun has burned through, and the Anacapa lot is glare and gull droppings and hot asphalt. Jack stops behind Kevin’s Odyssey because there’s no way not to. Across the back glass, in the white polish, it says WHO DAT, and then the 6 has been wiped out with a thumb, and then a 5, a 4 and a 3, each one written and each one struck through with a single hard white line, and then, big and fresh, 2 DAYS. Caught up all at once, sometime this morning, by somebody in a hurry to be current again.","Theo is leaning on the SL two spaces down with the keys hooked on one finger. “She came down at seven with the shoe polish,” he says. “In your jacket.” He was out here at seven moving the car ahead of the parking people. He doesn’t ask about the jacket. He never asks.","The SL goes down Mission with the top down and *Brideshead* in Jack’s lap, every margin of it blank. He did it Wednesday night with a Pink Pearl, one page at a time, until his whole running fight with Evelyn Waugh lay on the desk in gray crumbs. Danny can’t have writing. Danny gets the book clean, and the notes on a separate sheet.","Driftwood smells of old paper and cat. Boethius and Mrs. Danvers are asleep on the register in one heap, and it’s impossible to say where either cat stops. The owner looks up over the reading glasses on her beaded chain, and when Jack tells her where the book is going she doesn’t blink. She ships books to prisons as the seller, “because the prisons only take books from sellers” — said like someone who has won that argument with a mailroom — and has for years, for a woman whose son is at Soledad. She slides the *Brideshead* into a mailer of her own, copies the Trumbull address off Jack’s index card in square capitals, and sets it on a scale with a brass pan. Media mail. “Two thirty-eight.” “And the mailer?” “The mailer’s on me.” He counts it out of the last of Tuesday’s tips, two singles and change, onto the counter between the cats.","Theo comes out of the back with a book and puts it in Jack’s hands: Everyman’s Library, *Brideshead Revisited*, bound in cloth, a ribbon marker sewn into the spine, an edition made to outlast whoever reads it. He pays with a bill folded in half and doesn’t wait for change. “Not on the tab,” he says. At home the Post-it is still on the espresso machine in Theo’s neat hand, *+ 1 MALIBU —T.V.*, open. Jack doesn’t argue.","The post office is across the street, and the flag out front is at half-staff, hanging straight down in the windless afternoon. Nobody has to tell him why. Inside he buys a forty-four-cent stamp for the letter he wrote this morning at four, after he gave up on sleep.",{"if":"e4_rudy==\"asked\"","text":"*Write him. Even when there’s nothing to say.* The letter is mostly nothing to say. He wrote it anyway, because a man with a rosary on his wrist told him to over a flattop on Tuesday night."},{"type":"doc","title":"Folded in thirds, to Trumbull","if":"e4_lena_danny==\"told\"","text":"Danny —\n\nDescribe it, you said. Okay. Sixty-six degrees. Green at the top of the waves and gray underneath. It sounds like a truck going by that never finishes going by. The fog comes in at night like it’s got somewhere to be.\n\nI told the veil girl about you. She didn’t ask what. She asked your name.\n\nNext month you get Hopkins. He yells at God in sonnets. You’ll like him.\n\n—the Professor"},{"type":"doc","title":"Folded in thirds, to Trumbull","if":"e4_lena_danny!=\"told\"","text":"Danny —\n\nDescribe it, you said. Okay. Sixty-six degrees. Green at the top of the waves and gray underneath. It sounds like a truck going by that never finishes going by. The fog comes in at night like it’s got somewhere to be.\n\nYour jacket walked a girl home Thursday. Three miles. Don’t make it a thing.\n\nNext month you get Hopkins. He yells at God in sonnets. You’ll like him.\n\n—the Professor"},"Back in the SL, Theo doesn’t start the car. He’s looking at the flag. “Where were you?” he says. “Eight years ago.”","“Fifth grade. St. Brigid’s.” Sister Rose wheeled the TV cart in after the second plane and didn’t turn it off, and nobody did fractions that day. Jack’s mother came down from the school office and stood at the back of the room with her hand on the radiator, a month from Rosie. “When we got home my dad’s truck was in the driveway. Nobody sent him home from Lordstown. He just came home, at noon, and sat in the truck with the radio on. He was still sitting there at three.”","Theo nods. “My parents were still married,” he says, as if giving a date. “My father was at the Toronto film festival. They grounded everything. He and two other producers rented a Lincoln and drove home to Los Angeles. Four days.” He puts the key in the ignition and doesn’t turn it. “Longest he’s ever stayed anywhere.”"],"choices":[{"text":"“Thanks for not asking. About the jacket. About any of it.”","tag":"Sincerity","cue":"Theo will remember that.","set":{"e4_driftwood":"thanks","trait.sincerity":"+1","rel.theo.trust":"+1"},"response":["Theo looks at the flag a little longer, and then at the cloth book in Jack’s lap, and not at Jack. When he talks it’s short. “I’m not good at much, Costigan. I’m good at not asking.” He starts the car."],"goto":"s12","key":"You thanked Theo for not asking.","journal":[{"kind":"person","id":"danny","title":"Danny","if":"e4_lena_danny==\"told\"","text":"My brother. Trumbull Correctional. Calls me Professor. Ma brought him the good socks. *Brideshead* went to him Friday, media mail through Driftwood, margins erased; the ocean went in a letter. Lena knows. She asked his name."},{"kind":"person","id":"danny","title":"Danny","if":"e4_lena_danny!=\"told\"","text":"My brother. Trumbull Correctional. Calls me Professor. Ma brought him the good socks. *Brideshead* went to him Friday, media mail through Driftwood, margins erased; the ocean went in a letter."},{"kind":"note","id":"ledger","title":"The ledger","text":"Pie: paid. Bus fare: paid, with compliments. Richard Vance’s hundred: Theo’s, for the gas. A new *Brideshead*, cloth, with a ribbon: “Not on the tab.” Postage to Trumbull: $2.38, out of tips."}]},{"text":"“Four days in a Lincoln with two producers. That’s a war crime.”","tag":"Wit","set":{"e4_driftwood":"joke","trait.wit":"+1","rel.theo.warmth":"+1"},"response":["Theo laughs into the steering wheel. “He called it the best meeting he ever had,” he says. “They came out of Nebraska with two pictures and a lawsuit.”"],"goto":"s12","journal":[{"kind":"person","id":"danny","title":"Danny","if":"e4_lena_danny==\"told\"","text":"My brother. Trumbull Correctional. Calls me Professor. Ma brought him the good socks. *Brideshead* went to him Friday, media mail through Driftwood, margins erased; the ocean went in a letter. Lena knows. She asked his name."},{"kind":"person","id":"danny","title":"Danny","if":"e4_lena_danny!=\"told\"","text":"My brother. Trumbull Correctional. Calls me Professor. Ma brought him the good socks. *Brideshead* went to him Friday, media mail through Driftwood, margins erased; the ocean went in a letter."},{"kind":"note","id":"ledger","title":"The ledger","text":"Pie: paid. Bus fare: paid, with compliments. Richard Vance’s hundred: Theo’s, for the gas. A new *Brideshead*, cloth, with a ribbon: “Not on the tab.” Postage to Trumbull: $2.38, out of tips."}]},{"text":"“Where were you, though? Not him. You.”","tag":"Candor","set":{"e4_driftwood":"where","trait.candor":"+1","rel.theo.trust":"+1"},"response":["For a moment it looks like Theo won’t answer. Then, short: “In the kitchen. Poppy was six. I turned off the TV so she wouldn’t see.” He turns the key. “My mother turned it back on.”","He pulls out onto Mission under the flag, and neither of them looks back at it."],"goto":"s12","journal":[{"kind":"person","id":"danny","title":"Danny","if":"e4_lena_danny==\"told\"","text":"My brother. Trumbull Correctional. Calls me Professor. Ma brought him the good socks. *Brideshead* went to him Friday, media mail through Driftwood, margins erased; the ocean went in a letter. Lena knows. She asked his name."},{"kind":"person","id":"danny","title":"Danny","if":"e4_lena_danny!=\"told\"","text":"My brother. Trumbull Correctional. Calls me Professor. Ma brought him the good socks. *Brideshead* went to him Friday, media mail through Driftwood, margins erased; the ocean went in a letter."},{"kind":"note","id":"ledger","title":"The ledger","text":"Pie: paid. Bus fare: paid, with compliments. Richard Vance’s hundred: Theo’s, for the gas. A new *Brideshead*, cloth, with a ribbon: “Not on the tab.” Postage to Trumbull: $2.38, out of tips."}]}]},"s12":{"slug":"SATURDAY · 3:25 PM · ST. BRENDAN’S COURTYARD","music":"E.T. Mensah & the Tempos — “All for You”","body":["St. Brendan’s courtyard at three-twenty-five on a Saturday is empty except for the olive tree and Fr. Osei, who is on his knees in the flower bed in a black clerical shirt with the sleeves rolled and a pair of rubber boots, losing to the sprinkler. Out of his office window comes his father’s record, the one Jack heard over the chessboard, loud enough to carry across the courtyard. The sprinkler head is hissing sideways. Osei has a wrench on it. Every time he tightens it, it finds a new direction, and the newest direction is his face.","On the board by the Newman house door, in Mrs. Fitch’s hand: CONFESSIONS SATURDAY 3:30–4:45 · WEDNESDAY 8:00 · OR WHENEVER YOU KNOCK.","Jack is here because an eighty-four-year-old woman on Glenwood Avenue, with EWTN on in the next room, told him *Go next week*. He walked the long way around the Grove to leave room to change his mind, changed it twice, and came anyway.","Osei sits back on his heels, wipes his face with his sleeve, and looks up with water in his beard and the pleasure of an excuse. “Jack. You have come to knock?” He gestures with the wrench at the sprinkler, which hisses at both of them. “Or to watch a doctor lose to a sprinkler?” Last time it was the box or the board, and Jack took the board and was mated in four. Osei remembers; it’s in his face.","“My nonna said go next week,” Jack says. “It’s next week.” Osei’s eyebrows climb, slowly, all the way. “A grandmother,” he says, “is not an opinion. She is a diagnosis.” He checks the watch on his wet wrist. “I open at three-thirty. You have five minutes to decide if you are a penitent or a plumber.”"],"choices":[{"text":"Knock.","tag":"Go","set":{"e4_confession":"box","resolve.jack":"+1","soul.grace":"+1","rel.osei.trust":"+1"},"key":"You went to confession, like Nonna said.","response":["Osei gets up with the olive tree for a handrail, the left leg brought along after, and squelches across the flagstones to the converted coat closet with KNOCK (gently) on the door. After a minute: “Come.” Lemon polish over old wool; a kneeler and a folding chair, so you can choose; a linen screen with a lamp behind it. Jack takes the kneeler. On the other side the rubber boots creak.","“Bless me, Father, for I have sinned.” He says how long it’s been. He says what he came to say. It takes longer than he planned.","When he’s finished, Osei is quiet a while. Then he says — and it could be said to anyone who ever knelt there — “In the hospital, the patients who would not let the nurses lift them were always the ones who tore something.” The lamp hums behind the linen. “Letting yourself be lifted is also humility.” For a penance: “Call your grandmother and tell her you went. And a decade.” Jack says the Act of Contrition. On the linen the shadow of a hand lifts. “God, the Father of mercies, through the death and resurrection of his Son has reconciled the world to himself and sent the Holy Spirit among us for the forgiveness of sins; through the ministry of the Church may God give you pardon and peace, and I absolve you from your sins in the name of the Father, and of the Son, and of the Holy Spirit.” “Amen.”","Outside, Jack sits on the bench under the olive tree, damp from the sprinkler, and opens the RAZR. It’s ten to seven on Glenwood Avenue. Nonna picks up with EWTN going behind her, and he tells her he went. The line is quiet, full of her breathing. “Bravo, Giacomino,” she says. “*Bravo.*” Thirty seconds, start to finish, and she hangs up on herself, the receiver clattering into its cradle on the nightstand. He sits with the closed phone in his hand and the decade still to say, and starts it."],"goto":"s13","cue":"Nonna will remember that."},{"text":"Help him with the sprinkler instead.","tag":"Control","set":{"e4_confession":"sprinkler","trait.control":"+1","rel.osei.warmth":"+1"},"key":"You helped Fr. Osei lose to his sprinkler instead of going to confession.","response":["“Give me the wrench.” Jack kneels in the wet bed beside him, and for five minutes they bring a medical degree and a third of a philosophy education to bear on a brass sprinkler head from 1962 and fix nothing. It gets Jack in the ear and Osei down the collar. At one point it stops dead, and they both sit back in triumph, and it comes on again full blast and soaks them to the skin. Osei ends up flat on his back on the flagstones under the olive tree, boots in the marigolds, laughing from the belly. “The box will keep,” he says, without lifting his head. “Grandmothers do not.”","Then he gets up, wrings out his sleeve, limps off to the closet at three-thirty on the dot, and leaves the door ajar. Jack stays with the sprinkler. A grad student knocks, goes in, and comes out walking differently. Mrs. Fitch sets a lemon bar on a napkin by his knee and goes back inside. At a quarter to five the closet door closes, gently, from the inside, and Jack is still kneeling in the mud with the wrench in his hand."],"goto":"s13"},{"text":"Ask about the limp.","tag":"Candor","set":{"e4_confession":"limp","trait.candor":"+1"},"key":"You asked Fr. Osei about his limp, and didn’t knock.","response":["“Does it hurt? The leg.” Osei doesn’t answer right away. His eyes go, not to Jack’s face, but to Jack’s left eyebrow, to the scar, friendly and professional, the look of the man who once told him it was a ring, or a tooth. “You tell me yours, one day,” he says, “and I’ll tell you mine.” He hands Jack the wrench and squelches off toward the closet. At the door he turns. “The door is open till quarter to five.”","At four o’clock Jack sets the wrench on the bench and goes and stands at the closet door. KNOCK (gently). He lifts his hand. He stands there with it up, close enough to see the brush marks in the varnish, and on the other side a man is waiting, as patiently as he waited at the chessboard. Jack puts the hand in his pocket. He walks out to Ocean Road with rust from the wrench still on his fingers and waits for the bus, and when it comes he gets on."],"journal":[{"kind":"person","id":"osei","title":"Fr. Gabriel Osei","text":"Newman chaplain. Kumasi, Ghana. Used to be a doctor. Limps and doesn’t mention it. Plays chess like he’s got all night and highlife like the neighbors owe him money. Told me a proverb about funerals. I laughed. That was apparently the point. Asked about the leg: “You tell me yours, one day, and I’ll tell you mine.”"}],"goto":"s13"}]},"s13":{"slug":"SATURDAY · 11:48 PM · THE ANCHOR","music":"Patsy Cline — “Walkin’ After Midnight”","set":{"resolve.lena":5},"body":["Jack’s first Saturday at the Anchor is a different animal from a Tuesday. By eleven the booths are full of Las Olas kids sobering up on hash browns, two fishermen at the counter are eating pie with the slow seriousness of men who get up at four, and Rudy is on the line flipping eggs for people who will not remember eating them. Somebody keeps feeding the jukebox Patsy Cline, and Gloria keeps letting them.","At a quarter to nine the RAZR went in his apron pocket, and he read it with wet hands at the back door.",{"type":"sms","from":"Gina","text":"18-15 usc. dad turned the radio OFF. he never turns it off","time":"8:44 PM"},"He stood a minute in the smell of the dumpster and thumbed back the only thing he could think of.",{"type":"sms","from":"Jack","text":"turn it back on. low. he wont say anything","time":"8:47 PM"},"Nothing since. Out front the chalkboard says PIE OF THE DAY: OLALLIEBERRY, and at half past eleven Gloria comes through the swinging door with a fork and a sliver on a saucer and holds both out at him until he dries his hands. “Hon. You rated my marionberry a four in front of God and the register. You’re gonna rate this one.”","He eats it standing at the Hobart: nearly black, tart and then not, the crust shattering the right way. He takes a second bite to be sure, which is a mistake, because now he’s sure. “Nine.” Gloria waits. “Dad would eat two pieces and complain about the second.” Gloria nods as if that is precisely the kind of thing a person should say about a pie, and goes out and chalks it on the board under the marionberry.",{"type":"doc","title":"The board by the register","text":"PIE OF THE DAY: OLALLIEBERRY\nJACK’S RATINGS:\nMARIONBERRY 4/10\nOLALLIEBERRY 9/10"},"At 11:48 the last-but-one 11 bus sighs at the wharf stop, and through the window over the Hobart he sees who gets off it. Then the bell over the front door, and Gloria’s voice: “Dish man. You got a visitor.”","Lena is just inside the door in Keds and a sundress and the cardigan, his jacket folded over her arm — Danny’s Carhartt, the canvas pale at the seams. She’s looking at the back booth, where in August she saw a magazine on a table and walked out. Then she stops looking at it, and looks at him coming out of the kitchen with his sleeves wet to the elbow.","“Laney said if I didn’t bring it back she’d wear it to rush.” She holds the jacket out. He takes it. It’s warm from her arm.",{"if":"e4_lena_danny==\"told\"","text":"“Tell your brother his jacket walked a girl home,” she says, quieter, just for him. He hangs it on the hook by the walk-in, where he can see it.","else":"“It did three miles in the fog,” she says. “It’s earned a night off.” He hangs it on the hook by the walk-in, where he can see it."},{"if":"e4_pier_cig==\"lit\"","text":"There’s a weight in the inside pocket when he hangs it: the Reds, one short."},{"if":"e4_pier_cig==\"sat\"","text":"The Reds are still in the inside pocket when he hangs it, the pack exactly the way he left it at the end of the pier."},{"if":"e4_pier_cig==\"held\"","text":"Then she takes his pack of Reds out of her cardigan pocket and sets it on the counter by the register and slides it across to him with one finger. “Held,” she says. “Every one. Count them.”"},"She takes a stool at the counter. Gloria comes down the counter with the coffee pot and stops in front of her and looks her over, top to bottom, the gray bun tilted, the pencil in it like a pin through a butterfly. “You walked out on me in August. Left a five on a two-dollar coffee.” Lena opens her mouth, all New Orleans manners, to apologize. “You’re the one he went after.” Gloria pours without looking at the cup. “Pecan,” she says. “Sweet all the way through, and it’ll break your teeth if you’re not careful.”","One of the fishermen laughs into his pie. Lena takes this in, and decides — he can watch her decide it — to be flattered. Then she sees the board by the register, the four still up there in chalk, and she pounces on it. “*Nine?* Costigan gave something a *nine*?” She swings round to the fishermen. “Y’all. Does the diocese know? Has anybody called Rome?” She turns back on the stool. “Ma’am, I’ll have whatever made Youngstown give out a nine.”","Gloria brings it. Lena eats it the way she does everything, all the way, and points her fork at him through the pass. “Eight. I’m taking one off for you being right.” And then, with a mouthful, dead serious: “WHO DAT. One day. Ten a.m., Sully’s. Black and gold or don’t come.” He doesn’t own anything black and gold, and she has to know it. She’s smiling at him like that’s his problem to solve, and it’s the first time all week the smile has been close enough to touch.","At 12:04 the LG goes off on the counter by her saucer. She looks at the screen, and something comes up in her face that has been missing since Monday, and she says, “Excuse me,” to Gloria, and takes it out through the front door onto the wharf. Midnight here. Two in the morning in New Orleans.","Jack goes back to the Hobart, because there are racks. Through the window over the machine he can see her at the railing under the sodium light, the harbor black behind her — one arm wrapped around herself, the phone at her ear, laughing. Then not laughing. Then laughing again. He sends a rack through, and the steam fogs the glass, and when it clears she’s still listening.","She comes back in at 12:19 with the phone folded in her hand and sits back down on the stool. Jack is drying his hands in the pass. “Wes,” she says. “He’s at a party. He wanted to tell me the Saints are going to win today.” She tucks a five under the saucer, square. “He sounded happy.”"],"choices":[{"text":"“Good. I’m glad.”","tag":"Sincerity","set":{"e4_wes_happy":"glad","trait.sincerity":"+1","rel.lena.trust":"+1"},"response":["He means it, mostly, and she can see the mostly and lets him keep it. “Me too,” she says, and drinks her coffee."],"goto":"s13b"},{"text":"“Tell him a Browns fan says good luck. He’ll know it’s a curse.”","tag":"Wit","set":{"e4_wes_happy":"joke","trait.wit":"+1","rel.lena.warmth":"+1","soul.honesty":"-1"},"response":["She laughs. “I am not carrying a hex across the Rockies, Costigan. Not this week.”"],"goto":"s13b"},{"text":"Lift a wet hand from the pass. Go back to the racks.","tag":"Control","set":{"e4_wes_happy":"racks","trait.control":"+1"},"response":["He lifts a hand, wet to the wrist, and goes back to the machine. When the steam clears she has turned back to her coffee, both hands around the cup."],"goto":"s13b"}]},"s13b":{"slug":"SUNDAY · 12:20 AM · THE ANCHOR","body":["Gloria refills her coffee and, for once, doesn’t rate anything.",{"if":"e4_goodnight==\"magdalena\"","text":"At 12:28 the last 11 shows its lights at the end of the wharf and she’s off the stool at a run, the cardigan flying. “Goodnight, Jack,” she calls from the door, and he’s back at the Hobart before the bell stops.","else":"At 12:28 the last 11 shows its lights at the end of the wharf and she’s off the stool at a run, the cardigan flying. “Goodnight, Costigan,” she calls from the door, and he’s back at the Hobart before the bell stops."},"When he goes past the hook by the walk-in with a bus tub on his hip, the jacket smells of the harbor, and of the fog on Ocean Road, and faintly of somebody else’s shampoo. Rudy, without looking up, slides a plate of eggs onto the pass: dish man eats. Patsy Cline starts over. Jack sets the tub down by the Hobart and pulls the door, and the steam comes up."],"journal":[{"kind":"note","id":"pie","title":"The Anchor","text":"Marionberry: 4/10. Olallieberry: 9/10 — Dad would eat two pieces and complain about the second. Gloria rated Lena: pecan. I work here Tue/Thu/Sat, seven to one. Once a year the kitchen goes dark on a Thursday."}],"end":true}}},{"id":"S1E05","season":1,"episode":5,"showTitle":"The Hard Saying","title":"Moral Luck","dates":"Sunday, September 13 – Friday, September 18, 2009","logline":"Sunday the Saints open at ten in the morning, Monday Hale asks whether luck can make a man guilty, and Thursday is Bid Day — wear something you can cry in.","previously":[{"text":"In Hale’s seminar you said the old general is still the boy who robbed the orchard. “You don’t get out of a thing by forgetting it.”","if":"e4_seminar==\"same\""},{"text":"Lena walked out of Café Bastille in the middle of a song called “Fresno.” You went after her.","if":"e4_followed==\"now\""},{"text":"At the end of the harbor pier she told you about her grandmother: the storm, four days, a medal that came back in a plastic bag."},{"text":"You told her your brother is in prison. She didn’t ask what for. She asked his name.","if":"lena_knows_danny"},{"text":"She walked home three miles in your brother’s jacket. On the steps you counted the freight together, and she said, “Thank you, Jack.”"},{"text":"Saturday night at the Anchor: “WHO DAT. One day. Ten a.m., Sully’s. Black and gold or don’t come.”"}],"cast":[{"id":"lena","name":"Lena Broussard","role":"The girl on the porch","tracked":true},{"id":"theo","name":"Theo Vance","role":"Roommate, Room 412","tracked":true},{"id":"laney","name":"Laney Price","role":"Lena’s roommate","tracked":true},{"id":"margot","name":"Margot Lindqvist","role":"Third floor, Delgado","tracked":true},{"id":"kevin","name":"Kevin Tran","role":"Down the hall, Room 420","tracked":true},{"id":"osei","name":"Fr. Gabriel Osei","role":"Newman Center chaplain","tracked":true},{"id":"hale","name":"Prof. Adrian Hale","role":"Philosophy, Marisol","tracked":true},{"id":"julian","name":"Julian Park-Ellis","role":"A guy with a guitar","tracked":true},{"id":"evan","name":"Evan Marsh","role":"TA, PHIL 1, Thursday section","tracked":true},{"id":"becca","name":"Becca Lindell","role":"Newman regular","tracked":true},{"id":"frank","name":"Frank Costigan","role":"Jack’s father","tracked":false},{"id":"maria","name":"Maria Costigan","role":"Jack’s mother","tracked":false},{"id":"nonna","name":"Carmela Rinaldi","role":"Jack’s grandmother","tracked":false},{"id":"gina","name":"Gina Costigan","role":"Jack’s sister","tracked":false},{"id":"rosie","name":"Rosie Costigan","role":"Jack’s sister","tracked":false},{"id":"priya","name":"Priya Raman","role":"4th-floor RA","tracked":false},{"id":"rafi","name":"Rafi Ochoa","role":"Second floor","tracked":false},{"id":"doug","name":"Doug Pruitt","role":"Room 420","tracked":false},{"id":"joey","name":"Joey Abruzzo","role":"Newman regular","tracked":false},{"id":"tyler","name":"Tyler Brandt","role":"Newman missionary","tracked":false},{"id":"fitch","name":"Dolores Fitch","role":"Newman secretary","tracked":false},{"id":"sloane","name":"Sloane Kittredge","role":"Pi Lambda Chi","tracked":false},{"id":"gloria","name":"Gloria Mendes","role":"The Anchor, nights","tracked":false},{"id":"rudy","name":"Rudy Salcedo","role":"Line cook, the Anchor","tracked":false},{"id":"caleb","name":"Caleb Hargrove","role":"PHIL 9H","tracked":false},{"id":"yusuf","name":"Yusuf Noorzai","role":"PHIL 9H","tracked":false},{"id":"wes","name":"Wes Arceneaux","role":"Lena’s boyfriend, Tulane","tracked":false},{"id":"tess","name":"Tess Fontenot","role":"Lena’s sister","tracked":false},{"id":"richard","name":"Richard Vance","role":"Theo’s father","tracked":false},{"id":"brynn","name":"Brynn Vance","role":"Richard’s wife","tracked":false},{"id":"caroline","name":"Caroline Ashby Vance","role":"Theo’s mother","tracked":false},{"id":"poppy","name":"Poppy Vance","role":"Theo’s sister","tracked":false},{"id":"danny","name":"Danny Costigan","role":"Jack’s brother","tracked":false},{"id":"remy","name":"Remy Broussard","role":"Lena’s brother","tracked":false},{"id":"nora","name":"Nora Calloway","role":"Name on a brass plate","tracked":false},{"id":"dale","name":"Dale Wisniewski","role":"A Lions fan at Sully’s","tracked":false}],"duels":{"luck":{"title":"On Moral Luck","opponent":"lena","topic":"Whether the driver who hits the child is worse than the driver who doesn’t."}},"start":"s01","endCard":{"tag":"Do you think the lucky one sleeps?","nextTime":["“Love Is Patient: Our Chastity Story.”","“License and registration.”","“It’s a beach cleanup, Jack. It is not a date. Bring gloves.”","“Walk me home, Costigan. The long way.”"]},"scenes":{"s01":{"slug":"SUNDAY · 9:21 AM · DELGADO HALL, ROOM 412","body":["By twenty past nine the fog over the Lagoon has gone thin, a gauze the sun is working on from the far side. Theo is at the espresso machine in a black cashmere sweater with the sleeves shoved up. The machine woke Jack at five, and Theo has been at it since. The Post-it on its flank is torn down to its bottom half, which still says, in Theo’s neat hand, *+ 1 MALIBU —T.V.*","Jack takes inventory of his half of the closet against Lena’s instructions. Three flannels: red, green, and a blue so faded it’s more of a rumor. No Mooney hoodie; the hoodie lives in 217 now. One navy blazer from the Goodwill on Market Street, for Mass and for Hale. Danny’s Carhartt on the door hook, the Reds moved out of its inside pocket and into his back one. Nothing black. Nothing gold. Nobody in Youngstown has ever dressed for somebody else’s team.","Down in the Anacapa lot, Kevin’s Odyssey is nosed in by the dumpsters, and across its back glass, in white La Vang car-wash polish, it says WHO DAT · TODAY. “She did that at one,” Theo says, without turning around. “I was coming in from the lot. She had a flashlight in her teeth and she was spelling it out loud.”","The Hopkins is squared up on the corner of the desk, where it will stay till October and a mailer. Into the back pocket goes Flannery O’Connor, *A Good Man Is Hard to Find and Other Stories*, a Harvest paperback with a spine still white: a Mooney senior-English castoff out of the milk crate. He moves the Benedict holy card over into the first story, where the grandmother is already arguing about the route.","Theo puts an espresso in his hand that he didn’t ask for and looks at the flannel he’s wearing. “Ten a.m. Black and gold. You told me so last night with your coat still on, Costigan, and she wrote it on a minivan with a flashlight in her teeth. In Louisiana that’s a sacrament.”"],"choices":[{"text":"Knock on 305.","tag":"Go","set":{"e5_outfit":"margot","rel.margot.warmth":"+1"},"response":["Margot opens on the first knock, dressed, the Moleskine already in her hand; as far as Jack can establish, she doesn’t sleep so much as pause. She takes in the flannel, the stubble, the whole regional problem of him, and comes back from inside with the only thing she owns that isn’t technically a color: black. A Sleater-Kinney T-shirt, washed soft, that fits him across the shoulders like a dare. “It’s from Portland. Return it unwashed and I’ll know.” She picks up her keys. “I’m coming. As an anthropologist.”","Kevin has the Odyssey running in the lot, the La Vang rosary swinging from the mirror. Laney and Lena went ahead at nine to hold a booth."],"goto":"s02"},{"text":"Raid Theo’s side of the closet.","if":"trait.charm>=8","tag":"Charm","set":{"e5_outfit":"theo","rel.theo.warmth":"+1","trait.charm":"+1"},"response":["Theo lights up like Christmas. He puts Jack in a plain black T-shirt that cost more than La Flaca, then pins his grandfather’s gold cufflinks through the short sleeves, one each side, like a general’s. “I own one gold thing. Two. They’re cuffs.” For himself: the black cashmere, gray jeans, nothing gold anywhere.","Margot is already in the way-back of the Odyssey when they get down to the lot, Moleskine open, observing. Laney and Lena went ahead at nine to hold a booth."],"goto":"s02"},{"text":"Go as you are. Flannel. Take what’s coming at the door.","tag":"Candor","set":{"e5_outfit":"flannel","trait.candor":"+1"},"response":["Theo looks at the flannel and says nothing, so loudly that Jack can still hear it on the stairs.","Margot is already in the way-back of the Odyssey when they get down to the lot, Moleskine open, observing. Laney and Lena went ahead at nine to hold a booth."],"goto":"s02"}]},"s02":{"slug":"SUNDAY · 9:58 AM · SULLY’S, MISSION STREET","music":"Rebirth Brass Band — “Feel Like Funkin’ It Up”","set":{"resolve.lena":6},"body":[{"type":"sms","from":"LANEY (FIREMAN’S FAVORITE)","text":"booth secured. lena is handing out beads at the door like a bishop. BLACK AND GOLD fireman i mean it. xo","time":"9:46 AM"},"Sully’s is Mission Street’s idea of a sports bar: a green awning, a neon shamrock with one leaf out, a chalkboard on the sidewalk that says NFL SUNDAY TICKET · DOORS 9 AM · BLOODY MARY BAR. A brass band is coming out of it at two minutes to ten in the morning, tuba first, Bourbon Street dropped on a California sidewalk. And on the door, where a bouncer would be if Sully’s ran to one, is Lena Broussard with a fistful of gold beads.","She’s in the black WHO DAT shirt from the fire drill, black jeans and white Keds, hair up off her neck, checking everybody who comes through like the door of a second line. She packed the beads in July, she tells Kevin, “because I am a planner, and the Lord rewards planning.” The music is hers too: her iPod, the owner’s aux cord, a deal she negotiated “until kickoff, and then we’ll see.”",{"if":"e5_outfit==\"margot\"","text":"She stops Jack with one hand flat on his chest and reads the shirt. “That is a riot grrrl band.” “It’s black.” “It’s *Portland*.” She weighs his soul for a second. Then two strands of gold go over his head, and behind him Margot looks pleased in a way she will deny to the grave."},{"if":"e5_outfit==\"theo\"","text":"She stops Jack with a fingertip on one cufflink, turns it to the light, turns the other one, looks up at Theo, who is in black cashmere and visibly expecting to be beaded. She doesn’t bead him. “Gold is gold,” she allows, and puts two strands over Jack’s head instead."},{"if":"e5_outfit==\"flannel\"","text":"She looks at the flannel. Then she puts four strands of beads around his neck, one after another, unhurried, and out of the tote — Laney packed it “for emergencies” — comes a gold sequin shrug, which she works up his arms and settles on his shoulders. “Black and gold, I said. That’s the first quarter. You can earn the flannel back.”"},"Inside it’s one big projection screen and five tube TVs bolted up in the corners, and the room has sorted itself by exile: a Packers table in foam cheese, a Steelers table whose team played Thursday and who came anyway, on principle, and two Raiders guys at the rail who have been arguing with each other since the doors opened. There’s a Bloody Mary bar with a forest of celery. Lena asks the bartender for an Abita root beer. He considers it honestly. “Is that a cheese?” She takes a Coke with lime and a look that means somebody will be getting a letter. Jack gets a Coke, because he’s eighteen and broke and it’s ten in the morning.","Laney has the big corner booth under the projection screen and is dressed for it: gold sequins from collarbone to hip at 10:02 a.m., copper hair tied up in a black ribbon. “Game day in Texas, sugar. This is *daywear*.” Margot slides in across from her in black — “I’m always in uniform” — and opens the Moleskine to a clean page. “I’m here to observe a cult with nachos.” She glances at the bar. “Ritualized masculinity, mediated by a Bloody Mary bar. Hegemonic, but with celery.” She writes that down, and underlines *nachos*.","Kevin, who drove, is in a 49ers cap with the Odyssey key on a carabiner at his belt, ordering fries and waters for the table before anyone can stop him. “Designated adult.” Theo takes the end of the booth. Lena, in off the door to bead the table, points out that he is wearing black. “It’s cashmere,” Theo says. “Cashmere doesn’t take sides. I’m here as a neutral party. Like Switzerland, or Kevin.”","Laney catches Lena by the wrist as she goes by. “Bid Day, sugar. Wear something you can cry in.” “I’m not rushing.” “You’re not rushing. You’re *supporting*.”","At the far end of the bar, alone under the corner TV, a heavy man in his fifties in a Honolulu-blue Barry Sanders jersey is making a plate of eggs last. Lena beaded him at the door. “He’s the enemy,” she tells the booth, “and he’s by himself. Those are two different questions.” She walks Jack down the bar to meet him. “Mr. Dale, this one’s from Ohio. Be gentle, he’s a Browns fan.” The man wipes his hand on a napkin and puts it out, and it’s a hand that has spent a long time on a line. “Dale Wisniewski. Warren.” Jack opens his mouth. “Michigan,” Dale says. “Not the other one.”",{"if":"lena_knows_danny","text":"Jack knows the other one. Half an hour up the road from Glenwood Avenue, two fences, a county road. Lena knows it now too. She glances at him, and away, and asks Dale whether he wants hot sauce on those eggs, which he doesn’t, which she takes personally.","else":"Jack knows the other one. Half an hour up the road from Glenwood Avenue, two fences, a county road. Lena glances at him, and away, and asks Dale whether he wants hot sauce on those eggs, which he doesn’t, which she takes personally."},"Over Dale’s head the corner TV has the Browns at home against Brett Favre in a purple jersey, which the Packers table is treating as a death in the family. Then the big screen kicks off, the brass band stops mid-phrase — the owner, keeping his end of the deal — and the room turns into Superdome noise. Brees walks the Saints down the field like it’s his own driveway, and when they score, the owner, a big pink man in a Sully’s polo, rings the brass ship’s bell over the register, once, a little shyly. Lena is up on the booth seat before it stops swinging. “Sir. That is a *touchdown*.” He rings it again, properly. It is going to be a long morning for that bell."],"choices":[{"text":"Step outside for a smoke. The Browns are the Browns.","tag":"Reckless","set":{"e5_sullys":"smoke","reliquary":"+1","jack_cigs":"+1","soul.restraint":"-1","trait.reckless":"+1"},"key":"Lena confiscated a fourth relic, outside Sully’s.","response":["Mission Street is bright and Sunday-empty. He has a Red out of the pack in his back pocket and the lighter going when the door opens behind him and Lena takes it from between his lips before it’s properly caught and puts it out on Sully’s brick. Then she produces a napkin and a pen, turns him around by the shoulder, and writes against his back.",{"type":"doc","title":"A Sully’s napkin","text":"No. 4 · 9/13/09 · Sully’s · in mourning for Cleveland"},"The napkin goes around the cigarette, and both go into the tin. “At this rate I need a reliquary for the reliquary.” Inside, the bell goes for the second touchdown, and she’s through the door before it’s done. When he gets back to the booth her eyes are on the screen and her lips are moving with every snap, and it could be the down and distance and it could be a Hail Mary."],"journal":[{"kind":"note","id":"cigarette","title":"The Reliquary","text":"An Altoids tin from a pea-soup restaurant in Buellton. RELIQUARY on the lid. No. 1: the Lighthouse. No. 2: Malibu, before breakfast. No. 3: the harbor — she smoked half of it first. Do not ask. No. 4: Sully’s, on a napkin, in mourning for Cleveland."}],"goto":"s02b"},{"text":"Take the stool next to the Lions fan.","tag":"Sincerity","set":{"e5_sullys":"dale","trait.sincerity":"+1","rel.lena.warmth":"+1"},"response":["Dale moves his plate over. Twenty-seven years at Warren Truck, Dodge Rams; laid off in the spring when Chrysler went under; his daughter’s spare room out here since July. “Lions went oh and sixteen last year,” he says, “so this is a recovery program.”",{"if":"e3_told_lena_frank","text":"Jack means to say Lordstown and can’t find the place to put it, and Lena, who has been back with the hot sauce long enough to hear ‘Warren Truck,’ says it for him. “His daddy’s Lordstown. Twenty-six years.”","else":"Jack means to say Lordstown, and after a while he does. “My dad’s GM. Lordstown. Twenty-six years, till June.” Lena, back with the hot sauce in time to hear it, sets the bottle down by Dale’s plate very gently."},"Dale looks at Jack and nods slowly, the nod of a man hearing his own town’s name in a foreign country. Lena hooks her arm through his. “Mr. Dale, the Lions are the Aints of the North, and you are welcome in this booth.” He brings his eggs. All through the first quarter her eyes stay on the screen and her lips move with every snap, and it could be the down and distance and it could be a Hail Mary."],"goto":"s02b","key":"You took the stool next to Dale from Warren, and Lena adopted him."},{"text":"Heckle Favre for the Packers table.","if":"trait.wit>=12","tag":"Wit","set":{"e5_sullys":"heckle","trait.wit":"+1"},"response":["He gives the Packers table three lines about Brett Favre: that the man retires as often as other people sneeze; that Minnesota caught him like a cold, from a stranger, in August; and that somewhere in Green Bay a grown man is crying into a jersey he can’t return. The Packers table adopts him on the spot. A woman in a foam cheese buys him a Coke. Down the bar Dale lifts his coffee an inch in Jack’s direction: a Lions man has opinions about Brett Favre too.","Lena doesn’t look away from the big screen. “Don’t make friends during the Saints, Costigan.” Then, still watching: “The sneezing one was good.” Her lips are moving with every snap, and it could be the down and distance and it could be a Hail Mary."],"goto":"s02b"}]},"s02b":{"slug":"SUNDAY · 11:31 AM · SULLY’S, THE BOOTH","body":["Halftime. The big screen says SAINTS 28 · LIONS 10 in numbers taller than Kevin, and all of Sully’s sits down at once and orders more fries. The owner has rung the bell four times and is rolling his shoulder like a relief pitcher. On the corner TV Adrian Peterson goes through the middle of the Browns again, untouched, and Jack puts his head back against the booth and asks God, out loud and with real feeling, what exactly Cleveland ever did to Him. The Steelers table applauds.","Laney is redoing her face for the second half. Out of a gold clutch the size of a sandwich come a compact, a lip gloss and a gold eyeliner pencil, which she uncaps and aims at her own eyelid. Lena reaches across Kevin and takes it out of her hand. “Laney Price. That is a thirty-dollar pencil.” “Then it’s going to a good cause.” And Lena turns on the booth seat, one knee up on the red vinyl, to face Jack.","“Hold still, Youngstown.” She puts her left hand flat along his jaw to keep his face where she wants it, her fingers still cool from her glass, and sets the pencil on his left cheekbone just under the place where the scar runs out of his eyebrow. It’s cold, and then it isn’t. She works close. Her thumb rests at the corner of his mouth to steady the stroke. She frowns at his face the way she frowns at a Greek participle, and her breath smells of Coke and lime. A stem. A band across it. The curl of one petal, out and down.","Her LG goes off on the table beside the Coke and keeps going, buzz after buzz, walking itself toward the edge. She flips it open with her free hand without taking the other off his jaw, and because his face is exactly where she’s put it, the screen is right under his eyes.",{"type":"sms","from":"Wes","text":"WHO DATTT. BREES IS THE TRUTH AND THE LIGHT. LUC SAYS WHERE YATT","time":"11:32 AM"},"Another lands under it before she can close it, all capitals, missing the same letters. Somewhere behind them is the Superdome at half past one, seventy thousand people in black and gold, somebody called Luc, and the boy who held the stepladder in her Mardi Gras pictures, a phone in his fist. Something comes up into her face, quick and bright, and goes. “He’s spelling like Laney,” she says. Laney, who has an opinion about everything, lets that one go by. Lena shuts the phone with her thumb and drops it into the tote, under the beads.","Then she’s back on his face, and finds him looking at her, and her eyes come up off the pencil to meet his from four inches away. “I’m not fine, Costigan,” she says. “I’m *ecstatic*. Note the difference.”","Margot is studying the halftime show with professional interest. Kevin is reading the fries. Theo has his chin on his fist and an expression of total serenity, which is how Jack knows he will be hearing about this until Easter. Laney’s pink BlackBerry comes up over the top of a menu and says it for all of them: a soft fake shutter, no flash.","Lena goes back to the petal. Jack keeps still, and keeping still turns out to be harder physical work than anything the Hobart has asked of him at one in the morning: her palm along his jaw, her thumb at the corner of his mouth, the pencil going round in small cold strokes, her lips parted in concentration a hand’s width from his, and every muscle he owns asking leave to turn his face one inch into her hand, and every one of them told no. Her eyes are on her work. Then, for the space of a breath, they aren’t."],"choices":[{"text":"Hold still.","tag":"Control","set":{"e5_paint":"still","rel.lena.heat":"+1","soul.restraint":"+1","trait.control":"+1"},"response":["He holds through the second petal and the third, and through one more stroke on the left one, which it didn’t need. The corner of her mouth says she knows it. Then she sits back with her head on one side and considers what she’s made. “There,” she says. “Now you’re ours.” She’s turned back to the screen before the teams are even out of the tunnel, the pencil crosswise in her teeth, and his cheekbone is cold where the gold is and warm everywhere else."],"goto":"s02c"},{"text":"“Do I get the other cheek?”","tag":"Wit","set":{"e5_paint":"cheek","rel.lena.friction":"+1","trait.wit":"+1"},"response":["Her mouth goes flat with the effort of not rewarding that. “That’s Matthew five,” she says, “and no.” She caps the pencil on the *no* with a click, presses the last curl in with the pad of her thumb, and hands the pencil back across the table to Laney without looking at either of them. The fleur-de-lis is finished whether he likes it or not. He likes it."],"goto":"s02c"},{"text":"“What does it mean?”","tag":"Sincerity","set":{"e5_paint":"meaning","rel.lena.warmth":"+1","trait.sincerity":"+1","soul.grace":"+1"},"response":["She tells him while she finishes it, not looking up. Louis, the saint and the king, and the lilies on the old French flags. Joan of Arc in gold leaf on her horse on Decatur Street. The city flag. The helmets. And after the storm, on every blue-tarp roof and every FEMA trailer parked in front of a house with the waterline still on it: painted on plywood, stuck on bumpers, sprayed on the boards by people who came home to see what was left. She sets the last curl and blows on it once, a cool breath across his cheekbone. “It means home, Costigan,” she says. “It means we came back.”"],"goto":"s02c"}]},"s02c":{"slug":"SUNDAY · 12:58 PM · SULLY’S, MISSION STREET","music":"Louis Armstrong — “When the Saints Go Marching In”","set":{"resolve.lena":7},"body":["The fleur-de-lis is still on his cheekbone, and he has stopped knowing it’s there except when somebody looks at it, which in Sully’s is everybody. The second half is the Saints doing whatever they like. Brees throws and throws. Shockey catches his second and does something in the end zone the Steelers table calls excessive. Mike Bell runs over the same three Lions all afternoon. By the fourth quarter the owner rings the bell with his whole shoulder and has stopped smiling while he does it.",{"if":"e5_outfit==\"flannel\"","text":"Jack earned the flannel back at the end of the first quarter. Laney has her shrug. The beads stayed."},"The Lions get some back — a fumble picked up by a rookie safety and run sixty-five yards the other way, a couple of late scores — and the rookie quarterback throws his third interception. Dale watches the kid walk off with his helmet in his hand. “The kid’s going to be good,” he says, and goes back to his coffee.","Then the last one: a little screen pass out to the fullback, Heath Evans, who looks honestly surprised to be included and walks it in. Six touchdowns. Lena is standing on the booth seat in her Keds with both arms over her head and the beads swinging.","The corner TV is a different country. Adrian Peterson has spent the morning going through the Browns like a screen door, and at the end it says VIKINGS 34 · BROWNS 20. Somewhere on Glenwood Avenue the radio in the garage is saying the same numbers, low, or it’s off. From here Jack can’t tell which.","Final, forty-five to twenty-seven. The owner puts on his record, Louis Armstrong, scratchy, and Lena lets it play. Then it starts in the booth. Margot does the chant deadpan, every syllable at the same pitch, like a hostage reading a prepared statement. Kevin puts his fingers in his mouth and whistles, perfectly. Theo has the iPhone up, filming: “Week one.” Laney is up on the table in her sequins, against every rule Sully’s has.","Lena turns on the booth seat with the beads still swinging and points at him. “Who dat, Costigan. Say it like you mean it.”"],"choices":[{"text":"Full Mooney gym voice.","tag":"Reckless","set":{"e5_whodat":"loud","rel.lena.friction":"-1","trait.reckless":"+1"},"response":["He gives it the whole Mooney student section, the voice that used to carry from the top row of the bleachers to the far baseline — *WHO DAT SAY DEY GONNA BEAT DEM SAINTS* — and at the rail the two Raiders guys stop fighting each other for the first time all day to join in. The owner rings the bell on his own. Lena comes in on the second *who dat* like a choir.","Dale goes out past the booth, leaves a column of quarters on the bar, and raps the table on his way by. “Next week, kid.” Theo has already handed the waitress a black card with his father’s name on it for all of it — nachos, fries, Laney’s orange juice, six Cokes — and is writing it on the Post-it in his head, out loud: “Plus Sully’s.” Jack starts to object. “Meridian laid off two hundred and twelve people this year, Costigan. It can buy six Cokes.”","In the lot Lena wipes TODAY off the Odyssey’s back glass with the heel of her hand and the hem of her shirt, digs the polish out of her tote, and writes, big: 1–0. Kevin, keys out: “That’s my mom’s car.” Lena caps the bottle. “It’s the Lord’s car today.”"],"goto":"s03","journal":[{"kind":"person","id":"dale","title":"Dale (Sully’s)","if":"e5_sullys==\"dale\"","text":"Dale Wisniewski. Warren, Michigan — not the other one. Twenty-seven years at Warren Truck, laid off in the spring. Barry Sanders jersey; tips in quarters. He knows about Dad now. She says the Lions are the Aints of the North and he’s welcome in the booth."},{"kind":"person","id":"dale","title":"Dale (Sully’s)","if":"e5_sullys!=\"dale\"","text":"Dale Wisniewski. A Lions fan alone at the end of Sully’s bar in a Barry Sanders jersey. Warren, Michigan — not the other one. Tips in quarters. Said the rookie’s going to be good."},{"kind":"note","id":"ledger","title":"The ledger","text":"Pie: paid. Bus fare: paid, with compliments. Richard Vance’s hundred: Theo’s, for the gas. A new *Brideshead*, cloth, with a ribbon: “Not on the tab.” Postage to Trumbull: $2.38, out of tips. Sully’s: a booth’s worth of nachos and my Cokes, on Meridian Pictures. Theo says Meridian can afford it."}]},{"text":"In Latin.","tag":"Wit","set":{"e5_whodat":"latin","rel.lena.friction":"+1","trait.wit":"+1"},"response":["Four years of Mooney Latin Club rise up in him. “*Quis dat dicit se Sanctos victurum?*” Margot sets down her water. Her mother teaches Classics at Reed, and it shows. “That’s not even grammatical. You have two verbs. *Dat* means *gives*.” Lena, from the booth seat, with total authority: “It’s *liturgical*.”","Margot laughs into her ice water, once, hard, and comes up furious about it, and spends the rest of the chant glaring at the ice.","Dale goes out past the booth, leaves a column of quarters on the bar, and raps the table on his way by. “Next week, kid.” Theo has already handed the waitress a black card with his father’s name on it for all of it — nachos, fries, Laney’s orange juice, six Cokes — and is writing it on the Post-it in his head, out loud: “Plus Sully’s.” Jack starts to object. “Meridian laid off two hundred and twelve people this year, Costigan. It can buy six Cokes.”","In the lot Lena wipes TODAY off the Odyssey’s back glass with the heel of her hand and the hem of her shirt, digs the polish out of her tote, and writes, big: 1–0. Kevin, keys out: “That’s my mom’s car.” Lena caps the bottle. “It’s the Lord’s car today.”"],"goto":"s03","journal":[{"kind":"person","id":"dale","title":"Dale (Sully’s)","if":"e5_sullys==\"dale\"","text":"Dale Wisniewski. Warren, Michigan — not the other one. Twenty-seven years at Warren Truck, laid off in the spring. Barry Sanders jersey; tips in quarters. He knows about Dad now. She says the Lions are the Aints of the North and he’s welcome in the booth."},{"kind":"person","id":"dale","title":"Dale (Sully’s)","if":"e5_sullys!=\"dale\"","text":"Dale Wisniewski. A Lions fan alone at the end of Sully’s bar in a Barry Sanders jersey. Warren, Michigan — not the other one. Tips in quarters. Said the rookie’s going to be good."},{"kind":"note","id":"ledger","title":"The ledger","text":"Pie: paid. Bus fare: paid, with compliments. Richard Vance’s hundred: Theo’s, for the gas. A new *Brideshead*, cloth, with a ribbon: “Not on the tab.” Postage to Trumbull: $2.38, out of tips. Sully’s: a booth’s worth of nachos and my Cokes, on Meridian Pictures. Theo says Meridian can afford it."}]},{"text":"Quietly. Just to her. Like you mean it.","tag":"Sincerity","set":{"e5_whodat":"quiet","rel.lena.heat":"+1","trait.sincerity":"+1"},"key":"You said Who Dat quietly, just to her, like you meant it.","response":["He leans in under the noise and says it to her, just to her, low, the whole ridiculous sentence, like he means it, which he does. She stops shouting to hear it. Then she starts again, louder, for both of them.","Dale goes out past the booth, leaves a column of quarters on the bar, and raps the table on his way by. “Next week, kid.” Theo has already handed the waitress a black card with his father’s name on it for all of it — nachos, fries, Laney’s orange juice, six Cokes — and is writing it on the Post-it in his head, out loud: “Plus Sully’s.” Jack starts to object. “Meridian laid off two hundred and twelve people this year, Costigan. It can buy six Cokes.”","In the lot Lena wipes TODAY off the Odyssey’s back glass with the heel of her hand and the hem of her shirt, digs the polish out of her tote, and writes, big: 1–0. Kevin, keys out: “That’s my mom’s car.” Lena caps the bottle. “It’s the Lord’s car today.”"],"goto":"s03","journal":[{"kind":"person","id":"dale","title":"Dale (Sully’s)","if":"e5_sullys==\"dale\"","text":"Dale Wisniewski. Warren, Michigan — not the other one. Twenty-seven years at Warren Truck, laid off in the spring. Barry Sanders jersey; tips in quarters. He knows about Dad now. She says the Lions are the Aints of the North and he’s welcome in the booth."},{"kind":"person","id":"dale","title":"Dale (Sully’s)","if":"e5_sullys!=\"dale\"","text":"Dale Wisniewski. A Lions fan alone at the end of Sully’s bar in a Barry Sanders jersey. Warren, Michigan — not the other one. Tips in quarters. Said the rookie’s going to be good."},{"kind":"note","id":"ledger","title":"The ledger","text":"Pie: paid. Bus fare: paid, with compliments. Richard Vance’s hundred: Theo’s, for the gas. A new *Brideshead*, cloth, with a ribbon: “Not on the tab.” Postage to Trumbull: $2.38, out of tips. Sully’s: a booth’s worth of nachos and my Cokes, on Meridian Pictures. Theo says Meridian can afford it."}]}]},"s03":{"slug":"SUNDAY · 9:00 PM · ST. BRENDAN’S, THE COLLEGE MASS","set":{"resolve.lena":8,"soul.grace":"+1"},"body":["At twenty to nine, on his way out, Jack makes the mistake of opening the Dell. Delgado’s wireless brings Facebook in a piece at a time, and every piece is the VMAs, which he did not watch and is now going to know everything about.",{"type":"fb","name":"Laney Price","text":"kanye west I will END u and I will look fabulous at ur funeral","meta":"Sunday at 6:48pm · 14 people like this"},{"type":"fb","name":"Doug Pruitt","text":"imma let u finish but","meta":"Sunday at 7:02pm"},{"type":"fb","name":"Laney Price","text":"taylor i sang ur song on a man’s back on a bluff. we r with u","meta":"Sunday at 8:21pm · Lena Broussard likes this"},"He closes the laptop. On the far bed Theo looks up from the MacBook, studies Jack’s face for a while with something like tenderness, and wishes him a very holy Mass.","The nine o’clock is the college Mass, and the college has come to it: standing room under the overturned hull of the ceiling, kids on the side-aisle steps with their knees up, the overheads off and the candles lit, so the blue glass has gone black and the driftwood Christ hangs over the altar in a light that won’t keep still. Three guitars and a cajón. Kenzie Rourke cantors the psalm in a trained soprano that makes the freshmen look up — *I will walk before the Lord, in the land of the living* — and Peter Haddad reads Isaiah from the ambo like a man rehearsing for C-SPAN. *I gave my back to those who beat me, my cheeks to those who plucked my beard; my face I did not shield from buffets and spitting.* Then James: faith without works is dead. Then Mark, and the road to Caesarea Philippi. *But who do you say that I am?*","Lena is two rows up on the aisle in the black mantilla. From where Jack stands at the end of his pew he can see the scalloped edge of the lace and, under it at the nape of her neck, the thin gold chain.","Osei preaches from the step, reading glasses hanging on their cord, and doesn’t take long. “Peter gets the answer right,” he says. “Four verses later, Jesus calls him Satan.” He lets the four verses go by in the quiet. “Same man. Same afternoon. He did not trade him in.” He takes the glasses off. “So bring whichever Peter you brought tonight; that is the one He asked for.” And he sits, and two hundred college students who came braced for twenty minutes are left holding the rest of their attention.","At the sign of peace Lena turns to give it behind her — her hand to a girl in a Sigma Rho sweatshirt, her hand to the boy beside the girl — and her eyes go on past them, back two rows, and find Jack. Then they drop to his left cheekbone, and stop. Her mouth goes in hard at both corners. “Peace be with you,” she tells the Sigma Rho girl with enormous dignity, and faces front.","Through the Lamb of God her shoulders go. She gets the edge of the mantilla up against her mouth and holds it there, and her shoulders keep going, and the boy beside her looks over in real concern, and she nods to him over the lace that she is absolutely fine, *grant us peace*. Jack kneels with everybody else and has no idea what’s wrong with her, and is a little hurt.","Afterward the courtyard empties into the dark of the Grove in twos and threes. The broken sprinkler by the olive tree hisses away in the dark, still broken. Lena is waiting under the olive with the mantilla folded over her arm. Without a word she touches her own cheekbone. Jack puts his hand up to his face, and his fingertips come away gold.","“You received the Body of Christ,” she says, “in my fleur-de-lis.” “All day?” “Since halftime, Costigan. Through Sully’s, the parking lot, Kevin’s mother’s van and the Communion line.” He thinks about the far bed in 412, and the very holy Mass. “Theo watched me walk out the door with it.” “Your roommate,” Lena says, “is a serpent, and I respect him.”","Mrs. Fitch comes across the flagstones in her lavender cardigan with a pink slip held out in front of her: WHILE YOU WERE OUT. “Mr. Costigan. Good. Your grandmother telephoned the rectory this afternoon. From Ohio.” She reads it off the slip, every word, in the voice of a woman reading the parish bulletin. “*Mrs. Carmela Rinaldi, Youngstown. One Mass in thanksgiving for my grandson’s good confession. Ten dollars to follow by mail.*” She looks at him over it. “She asked me to underline *good*. I have underlined it. She also wished to know whether you are eating.”","Osei is coming past toward the rectory with his stole over his arm, the limp a little longer at the end of a Sunday. Mrs. Fitch hands him the slip for the Mass book. He reads it. He looks at Jack over the top of it, perfectly grave. “I can neither confirm nor deny that you have ever been in my confessional, Jack. Your grandmother can confirm it to the state of Ohio.” He folds the slip into his shirt pocket and goes on, and from the dark by the rectory door comes his laugh, once, from the belly, not hidden at all.","Lena was close enough for every word of it. She stands under the olive tree with the mantilla over her arm and looks at him for as long as it takes the broken sprinkler to get through one whole hiss."],"choices":[{"text":"“Saturday. Nonna told me to.”","tag":"Candor","set":{"e5_mass":"candor","trait.candor":"+1"},"response":["“Then God bless Nonna,” Lena says.",{"if":"e4_walk==\"empty_room\"","text":"She settles the mantilla over her arm. “What did you yell at Him about at halftime?” “The Browns.” “Nobody yells at an empty room, Costigan.” His own line from Ocean Road. “Goodnight, Jack.” Then it’s the olive tree and Jack under the courtyard light, scrubbing at his cheekbone with a licked thumb and getting none of the gold off
