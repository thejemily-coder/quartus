says, “and I’ll do the windows.” The kitchen goes very still. Richard turns in the doorway with his eyebrows up, and then he laughs, pointing at Jack with the BlackBerry. “This one I like.” He comes back, peels a second hundred off the clip, and tucks it in on top of the first. Jack has two hundred dollars in his shirt pocket and a problem, and the problem is standing at the island holding half an orange and not looking at him."],"goto":"s10b"}]},"s10b":{"slug":"SUNDAY · 5:58 PM · THE VANCE HOUSE, THE DECK","body":["They all end up out on the deck to see him off, as if he were a relative. The Range Rover backs up the drive with Steely Dan coming out of it again. Brynn waves from the passenger side with her whole arm, a real wave, and Lena waves back. Richard doesn’t look up from the BlackBerry. The hedge closes behind them. The dinner is in the Colony.","Margot looks at the Nokia. “Six minutes, fourteen seconds.” Theo nods, his hands in his pockets, his eyes on the empty drive. “He’s slipping.”",{"type":"doc","title":"Margot’s Moleskine, open on the rail","text":"R. VANCE. Arr. 5:52. Dep. 5:58.\n6:14.\nCalls son: Teddy.\nGuests’ names learned: 4 of 5. Used: 4.\nOne (1) attempt to tip a guest.\nDenise Okafor, Story Dept., 19 yrs."},"Then Laney walks up behind Theo, puts both hands flat between his shoulder blades, and shoves him into the pool in his four-hundred-dollar T-shirt.",{"if":"e3_hundred==\"theo\"","text":"He goes in sideways and enormous, and Richard Vance’s hundred goes in with him, in the front pocket of his jeans.","else":"He goes in sideways and enormous, sunglasses and all."},"He comes up laughing — a real laugh, all the way out, water streaming off his hair — and then he stops swimming and turns over and floats on his back in the middle of the pool with his arms out, in his clothes, looking straight up at the sky, smoke-yellow, one plane crossing it very high. He stays there. Nobody calls to him. The pump hums.","“Somebody had to,” Laney says, to no one, and sits down on the edge with her feet in the water.","Kevin goes inside and comes back with a towel, a big one, white, and folds it once and leaves it on the coping at the shallow end, where Theo will find it when he wants it, and goes back in."],"journal":[{"kind":"person","id":"richard","title":"Richard Vance","text":"Theo’s father. Learned everybody’s name in one pass but mine; thought I came with the caterer. Calls him Teddy. Stayed six minutes, fourteen seconds. Margot timed it."}],"next":"s11"},"s11":{"slug":"SUNDAY · 9:10 PM · THE VANCE HOUSE, THE DECK","duel":"labor","set":{"duel.labor.lena":3},"body":["The fire pit on Richard’s deck burns gas up through blue glass, which Lena calls a sin against firewood and sits beside anyway, knees up under the cardigan, last night’s pie on the arm of her chair. A waning moon is coming up over the shoulder of the Santa Monica Mountains, orange with smoke, a day or two past full. Below the boards the Pacific is black and loud, all sound and no sight.","She sets the plate down. “Costigan.” Talk around the fire dies in stages. “I owe you a Sunday.” She looks at the moon, then back at him. “It’s Sunday.” Laney wants to know the score. “He’s up two–nothing on the season,” Lena says, pushing her sleeves to the elbow, “and I don’t care for it.”","Margot appoints herself moderator, Nokia stopwatch up. “Four rounds. Ninety seconds. I’m grading for coherence and complicity.” Laney is ring girl, with a pool noodle over one shoulder and the cardboard flap off Kevin’s case of Arrowhead, ROUND 1 in Sharpie. Kevin keeps score on his BlackBerry. Theo is still in the jeans he went into the pool in three hours ago, his hair gone stiff with chlorine. “Changing would be a concession,” he says, and rises to make a presentation.",{"if":"e3_hundred==\"kept\"","text":"He plucks the folded bill out of the *Brideshead* on the arm of Jack’s chair, flattens it on the teak with the side of his hand, and weights it with a citronella glass. “Exhibit A.”"},{"if":"e3_hundred==\"returned\"","text":"He holds an empty palm up to the firelight. “Exhibit A has left the building. It’s back in my father’s pocket. He was thrilled.”"},{"if":"e3_hundred==\"theo\"","text":"He peels a sodden hundred out of the front pocket of the jeans and lays it on the teak beside the fire, where it begins, faintly, to steam. “Exhibit A. It’s been through the pool.”"},{"if":"e3_hundred==\"two\"","text":"He holds out his hand until Jack surrenders the money, then fans the two hundreds on the teak like a hand of cards he intends to win with. “Exhibit A. And its little brother.”"},"Lena leans forward into the blue light, elbows on her knees, and opens.","“You were *tipped*, Costigan. How does it feel to be labor?”"],"next":"s11a"},"s11a":{"slug":"SUNDAY · 9:14 PM · THE VANCE HOUSE, THE FIRE PIT","duel":"labor","body":["Laney walks the cardboard once around the fire pit in a slow pageant circuit, noodle on her shoulder like a parasol. Margot says “Go.”","Lena doesn’t need notes. She pushes her sleeves the rest of the way up and goes. “Leo the Thirteenth, *Rerum Novarum*, 1891, section forty-five. A tip is a gift. A wage is a debt. You can’t owe a man a gift, and you can’t gift him what you owe him. Leo says there’s a law older than any bargain two men can make: a wage has to be enough to keep a frugal, decent worker alive. And if need or fear makes a man take worse, he is — and I’m quoting a pope — *the victim of force and injustice*.” She points at his shirt pocket, where the money was. “Go stand at the Anchor at closing and watch the waitresses count the jar. Every dollar in it is a decision somebody made over pie about whether she’s a person tonight.”",{"if":"e3_hundred==\"two\"","text":"“Two hundred dollars isn’t a wage, Costigan. It isn’t even a gift. He tipped you before he looked at you. Mr. Vance paid you like weather.”","else":"“A hundred dollars isn’t a wage, Costigan. It isn’t even a gift. He tipped you before he looked at you. Mr. Vance paid you like weather.”"}],"choices":[{"text":"Leo says the worker owes a fair day’s work and keeps his hands off the boss’s property. Section twenty. Justice runs both ways.","tag":"Press","set":{"duel.labor.rigor":"+1"},"response":["“You want to explain the dignity of labor to *me*? On Labor Day?” “It’s Sunday.” “It’s Labor Day *weekend*, Costigan, and I’m counting it.” She doesn’t break stride. “Granted. The Anchor’d fire you for a chipped cup and be right. Both ways, yes. It just never seems to run *uphill* on its own.” She takes the point and keeps walking with it, as if he’d handed her his coat."],"goto":"s11b"},{"text":"“It was the best-paid pot in the history of pots.”","tag":"Riposte","set":{"duel.labor.wit":"+1","rel.lena.warmth":"+1"},"response":["She laughs, caught clean, and points at him across the blue glass with the laugh still on her face. “Which is my *point*. A hundred dollars for one pot is a crazy man’s number. Nobody can feed a family on crazy.” Laney applauds with the noodle."],"goto":"s11b","if":"e3_hundred!=\"returned\" && e3_hundred!=\"two\""},{"text":"“It was the best-paid pot in the history of pots. Twice.”","if":"e3_hundred==\"two\"","tag":"Riposte","set":{"duel.labor.wit":"+1","rel.lena.warmth":"+1"},"response":["She laughs, caught clean, and points at him across the blue glass with the laugh still on her face. “Which is my *point*. Two hundred dollars for one pot is a crazy man’s number. Nobody can feed a family on crazy.” Laney applauds with the noodle."],"goto":"s11b"},{"text":"“I was the best-paid pot in the history of pots for about four seconds.”","if":"e3_hundred==\"returned\"","tag":"Riposte","set":{"duel.labor.wit":"+1","rel.lena.warmth":"+1"},"response":["She laughs, caught clean, and points at him across the blue glass with the laugh still on her face. “And then you handed it back, which is my *point*. You could afford four seconds of pride because somebody pays you on Tuesday. The man who can’t has to say *thank you, sir*.” Laney applauds with the noodle."],"goto":"s11b"},{"text":"“He paid me like furniture. You’re right.”","tag":"Concede","set":{"duel.labor.heart":"+1","rel.lena.trust":"+1"},"response":["She has the next paragraph loaded — he can see it lined up behind her teeth — and suddenly there’s nobody standing where she meant to hit. She closes her mouth. She looks at him differently, a half-second’s worth. Margot, unblinking, consults the Nokia. “Concession at forty-one seconds,” she says."],"goto":"s11b"},{"text":"Benedict wants gift *inside* the economy — gratuitousness. *Caritas in Veritate*, thirty-six. A tip is the gift.","tag":"Reframe","set":{"duel.labor.rigor":"+1","rel.lena.friction":"+1","duel.labor.lena":"+1"},"response":["“Your own pope, Broussard. July. Gratuitousness and the logic of gift have to find their place *within* normal economic activity. A tip is the gift.”","Kevin is typing a point for Broussard before she opens her mouth. “*Inside* it, Costigan.” She’s had this one loaded since July. “Not *instead* of it. Section six of the same letter: you can’t *give* a man what’s yours until you’ve given him what’s his. You don’t get to tip your way out of a wage.”"],"goto":"s11b"}]},"s11b":{"slug":"SUNDAY · 9:19 PM · THE VANCE HOUSE, THE FIRE PIT","duel":"labor","body":["ROUND 2, says the Arrowhead box, going by at knee height.","Lena turns her chair to face him square. “*Caritas in Veritate*, section twenty-five. Your pope, Costigan, your favorite, your theologian with the nice shoes — not some Jesuit in Berkeley. He says the calls the Church has made since *Rerum Novarum* for workers’ associations that can defend their rights *must therefore be honoured today even more than in the past*. Even more. In July. With the whole world falling down.” She holds up one hand. “There’s a man on Banks Street named Mr. Alcide who shucked oysters for forty-one years at a place with tablecloths. No union. When his hands went, they gave him a ham at Christmas and his stool to somebody’s nephew in January. That’s what *honoured* looks like when nobody at the table has the standing to say the word.”",{"if":"e2_union","text":"She smiles, which is never good news. “And Hale called it Monday, in front of God and Yusuf. We formed a union. Are you going to bust it?”"}],"choices":[{"text":"The Jobs Bank: men on full wages doing crosswords in a room, suspended last winter because even the UAW couldn’t defend it to Congress.","tag":"Press","set":{"duel.labor.rigor":"+1","rel.lena.friction":"+1"},"response":["“It’s bingo with a pension,” Jack adds, because it’s right there. Theo, from the end of the deck: “*Ooh*.”","Lena gives him the program in one breath — indefensible, she says, and they knew it, which is why they let it go — and refuses the rest in the next. “One bad parish doesn’t refute the Church, Costigan. You of all people know that.”"],"goto":"s11c"},{"text":"“Does Broussard’s Seafood have a union?”","tag":"Riposte","set":{"duel.labor.wit":"+1","duel.labor.lena":"+1"},"response":["Lena laughs so hard she has to put her pie down. “Lord, *no*. Daddy would sooner unionize the crawfish. He pays his shuckers over scale and they eat at our table on Christmas Eve, and you can quit a union.” She lets it sit, wiping her eye with a knuckle. Kevin is already scoring it. “Nobody quits a Broussard. That’s all a union is, Costigan: a family for men whose boss won’t set them a place.”"],"goto":"s11c"},{"text":"Subsidiarity. *Quadragesimo Anno*, seventy-nine: don’t hand to the big what the small can do. The national union is the big.","tag":"Reframe","set":{"duel.labor.rigor":"+1"},"response":["She grants the principle with one nod. “Pius is right. So go small. A man alone on an assembly line can’t sit across a table from General Motors; that’s the small thing failing, so you go up exactly one step. The local. The local’s a *parish*, Costigan. Your argument’s with headquarters.” She has taken his premise and walked it somewhere he didn’t send it, and Margot makes a small appreciative noise she will later deny."],"goto":"s11c"},{"text":"“My father would kiss you on the mouth for that paragraph.”","tag":"Concede","set":{"duel.labor.heart":"+1","rel.lena.warmth":"+1"},"response":["“Tell him to get in line behind Dorothy Day.” It’s quick and it gets its laugh. But her eyes stay on him across the fire a little after the laugh is over."],"goto":"s11c"}]},"s11c":{"slug":"SUNDAY · 9:25 PM · THE VANCE HOUSE, THE FIRE PIT","duel":"labor","body":["ROUND 3. Laney holds the cardboard over her head this time, like a girl at a prizefight in a movie.","Lena doesn’t get up. “Four years ago last week my city went under, and the federal government took days to find it. Days. People on roofs writing on the shingles with house paint. The first people on Banks Street with gloves and bleach were a youth group from a parish in Minnesota, in a school bus, with a priest who’d never seen a crawfish. Not the government. *Minnesota*.” Her voice stays even; that’s how Jack knows to listen. “Then last winter Washington found — Kevin?” “Seventeen billion in December,” Kevin says, eyes on the BlackBerry. “A lot more since.” “Tens of billions for two car companies inside six months. I’m *for* it, Costigan. I’m just noting where they keep their compassion.”","Margot, unasked: “Observation. Both your parties read the encyclicals the way Theo reads a menu, for the parts they already wanted. The right takes the paragraphs on property, the left takes the paragraphs on the wage, and nobody reads the one where the Pope says they’re both wrong. Carry on.”","Jack has spent the night arguing with the part of his head that goes to Mass. The bailout isn’t in an encyclical. It’s on the kitchen table on Glenwood Avenue, and it’s been there since June."],"choices":[{"text":"“The bailout saved GM, not the men. The CEOs flew in on jets. My father got a letter. Twenty-six years at Lordstown.”","tag":"Press","set":{"duel.labor.rigor":"+1","e3_told_lena_frank":true},"response":["“Laid off since June,” he says. For one breath the deck goes quiet. Margot says nothing and lets the clock run.","Lena doesn’t make it a moment. She makes it an argument. “Then you agree with me,” she says, level. “They saved the company and not the men. You just got there by way of the jets.”"],"goto":"s11d","key":"You told Lena your father’s been laid off since June."},{"text":"“My dad’s been laid off since June. He drove me twenty-four hundred miles to see the Pacific once.”","tag":"Open up","set":{"duel.labor.heart":"+1","rel.lena.trust":"+1","e3_told_lena_frank":true},"response":["For one breath the deck goes quiet, and there’s only the ocean his father came all that way to look at, going over in the dark. Margot, who has had *Cobalts* in a Moleskine since the first night, stops the clock.","Lena doesn’t make it a moment. She makes it an argument. “Then he knows exactly what it’s worth,” she says, “and so do you. So argue like it.” And she waits for him — Lena Broussard, in a duel, waits."],"goto":"s11d","key":"You told Lena your father’s been laid off since June."},{"text":"“The Cobalt was a bad car. I say that with love. My father built it with love too. Until June.”","tag":"Riposte","set":{"duel.labor.wit":"+1","e3_told_lena_frank":true},"response":["Theo laughs, then hears *until June* and stops. Margot thumbs the Nokia off.","Lena doesn’t laugh. She makes it an argument. “Then don’t let anybody tell you it was the car,” she says. “It was never the car.”"],"goto":"s11d","key":"You told Lena your father’s been laid off since June."},{"text":"“Next round.” Keep him out of it.","tag":"Control","set":{"trait.control":"+1","e3_told_lena_frank":false,"duel.labor.lena":"+1"},"response":["Lena looks at him over the fire, a long look, and then goes around him like water around a piling. “Fine. Yusuf’s father, then.” She was on the cloister walk; she heard it. “GM and Toyota built cars together in Fremont for twenty-five years. The bailout saved GM, and this summer GM walked out on Fremont, and on the twenty-seventh of August Toyota said they’re closing it. Yusuf called that job the load-bearing wall of the house. Nobody bailed out *that* wall.” She takes the round on someone else’s father, and Jack lets her have it."],"goto":"s11d"}]},"s11d":{"slug":"SUNDAY · 9:31 PM · THE VANCE HOUSE, THE FIRE PIT","duel":"labor","body":["ROUND 4, and Laney, sensing the room, walks it around without a word.","Lena is quiet, which is new. Her hand goes to the gold medal at her throat and turns it once on its chain while she looks into the fire, and when she speaks she has slowed down. “John Paul. *Laborem Exercens*, section six. Work is for man, not man for work. The dignity of work lives in the one doing it, not in the job. You can’t lay that off. Mr. Alcide still has a shucker’s hands. Nobody gets to fire *those*.” She lets go of the medal.",{"if":"e3_told_lena_frank","text":"“Your father didn’t lose his dignity in June, Costigan. General Motors lost *him*.” Then, plainly, as if she actually wants to know: “What did he make?”","else":"“Yusuf’s father didn’t lose his dignity at NUMMI. NUMMI lost *him*.” She tilts her head. “And yours, Costigan? You’re from Youngstown, and you just skipped a round you were winning.”"}],"choices":[{"text":"“Twenty-six years of cars. Sunday gravy. A garage you could eat off of.”","tag":"Concede","if":"e3_told_lena_frank","set":{"duel.labor.heart":"+2","rel.lena.trust":"+1"},"response":["He hears himself say it and doesn’t take any of it back. Lena doesn’t make a joke. After a second she says, “That’s what I mean,” very quietly, and nods at Margot to call it, and wins the round looking as though she would rather have lost it."],"goto":"s11v","cue":"Lena will remember that."},{"text":"“Cobalts. Twenty-six years. Laid off in June. You win.”","tag":"Concede","if":"!e3_told_lena_frank","key":"You told Lena about your father, and gave her the round.","set":{"duel.labor.heart":"+2","rel.lena.trust":"+1","e3_told_lena_frank":true},"response":["He gives it to her flat, all of it at once, like a man emptying his pockets at a desk. Lena takes the round and doesn’t pick it up. “I didn’t want it like that,” she says. Then, honest to the last: “I’ll take it. I didn’t want it like that.”"],"goto":"s11v","cue":"Lena will remember that."},{"text":"“Dignity doesn’t make the mortgage. A job does.”","tag":"Press","key":"You lost the labor duel to Lena on her Sunday.","set":{"duel.labor.rigor":"+1","duel.labor.lena":"+1"},"response":["“John Paul again,” he says. “*Centesimus Annus*, forty-eight. When the State takes over what people owe each other, you get more offices and less human energy. A union can turn into that too: a pension office with a parking lot. The contract that priced Lordstown out of building cars was signed by the men you’re canonizing.” Kevin, very quietly, gives him the point.","“No. *Justice* makes the mortgage.” She’s on her feet now, the cardigan off one shoulder, the Pacific going off under the deck like applause. “And John Paul wrote that after ten years of standing behind a union with ten million members in Gdańsk, Costigan. Read the whole paragraph.” Laney thumps the noodle on the boards three times. “That’s why I’m for the union, and so are you. You’ll just vote like you’re not.”"],"goto":"s11v"},{"text":"“If you’re done canonizing the working man, he’d like his dignity back by Thursday.”","tag":"Riposte","key":"You lost the labor duel to Lena, and made her laugh doing it.","set":{"duel.labor.wit":"+1","rel.lena.warmth":"+1"},"response":["She laughs into her sleeve and points at him with the other hand until she can talk, and wins the round anyway. “Thursday’s fine. Tell him he can pick it up at the union hall. They’re open late.”"],"goto":"s11v"},{"text":"“Easy to preach labor from a family business.”","tag":"Personal","cue":"Lena will remember that.","key":"You told Lena it was easy to preach labor from a family business.","set":{"duel.labor.wit":"+1","rel.lena.trust":"-1","rel.lena.friction":"+2","resolve.jack":"-1","e3_duel_personal":true},"response":["The fire hisses. Lena sets her plate down on the deck carefully, so that it makes no sound at all. She is polite. Every consonant is in its place.","“Broussard’s took five feet of water, Mr. Costigan. My daddy and his brothers rebuilt it with their hands. The house too.”","Nothing more."],"goto":"s11v","if":"!e3_told_lena_frank"},{"text":"“Easy to preach labor from a family business.”","tag":"Personal","cue":"Lena will remember that.","key":"You told Lena it was easy to preach labor from a family business.","set":{"duel.labor.wit":"+1","rel.lena.trust":"-2","rel.lena.friction":"+2","resolve.jack":"-1","e3_duel_personal":true},"response":["The fire hisses. Lena sets her plate down on the deck carefully, so that it makes no sound at all. She is polite. Every consonant is in its place.","“I asked you a real question, Mr. Costigan.” A pause. “Broussard’s took five feet of water. My daddy and his brothers rebuilt it with their hands. The house too.”","Nothing more."],"goto":"s11v","if":"e3_told_lena_frank"}]},"s11v":{"slug":"SUNDAY · 9:38 PM · THE VANCE HOUSE, THE DECK","duel":"labor","set":{"resolve.lena":8},"body":["Margot stops the Nokia. Kevin reads off the BlackBerry like a man announcing a birth: “Broussard. That’s two–one on the season.”",{"if":"e3_duel_personal","text":"She wins, and she is gracious about it. She thanks the moderator and the ring girl, and she is perfectly pleasant to Mr. Costigan for two more hours, which he wouldn’t wish on anyone. At midnight, crossing behind his chair on her way in, she drops a dry towel on his head without breaking stride. It’s as close to forgiveness as tonight is going to get."},{"if":"!e3_duel_personal && duel.labor.heart>=3","text":"She wins and won’t take it. “We’re even, Youngstown,” she says, which by Kevin’s count they are not, and nobody corrects her. Later she cuts the last slice of the peach pie, sets it on the arm of his chair without a word, and goes back around to her side of the fire."},{"if":"!e3_duel_personal && duel.labor.rigor>=3 && duel.labor.heart<=2","text":"She wins on points. She stands, rolls her sleeves back down one at a time, and steals Hale’s line with the boredom and the cut glass both: “That was very nearly an argument, Costigan.” Margot, consulting the Nokia: “Broussard, by a minute forty.” Kevin, consulting his columns: “You took every point, Costigan. She took the room.”"},{"if":"!e3_duel_personal && duel.labor.wit>=2 && duel.labor.rigor<=2 && duel.labor.heart<=2","text":"She wins, and Laney rises from her chaise and crowns her Miss Congeniality, bending the pool noodle into a hoop on her head, and teaches her the pageant wave on the spot. “Wrist, wrist, elbow, elbow. Smile like your daddy’s in the front row, sugar.” Lena does it at the Pacific, perfectly, to a standing ovation from Theo, who stays seated. “The judges liked your jokes,” Margot tells Jack, “and her logic.”"},{"if":"!e3_duel_personal && duel.labor.wit<=1 && duel.labor.rigor<=2 && duel.labor.heart<=2","text":"Margot calls it for Broussard, on coherence. Lena accepts with a magnanimous hand. “Put it on the board, Kevin.” “There’s no board.” “There will be,” says Margot."},{"if":"e3_told_lena_frank && !e3_duel_personal","text":"Later, when the others have gone in, Lena asks him one plain question across the fire. “Is he okay?” “He’s good.” She looks at him over the blue glass as if she’s weighing the word. Then she lets him keep it."},"The moon clears the mountains and goes white, and down on the sand the tide comes in under it, up to the foot of the stairs."],"next":"s12"},"s12":{"slug":"MONDAY · 7:12 AM · THE VANCE HOUSE, KITCHEN","set":{"resolve.jack":"-1","knows_danny_theo":true},"body":["Labor Day comes in gray. The marine layer has the beach again, pressed to the glass, and the house is quiet enough that Jack can hear the refrigerator’s compressor and, under it, the surf. He’s at the sink with last night’s glasses, because there are glasses and there is a sink: wine glasses from the fire pit with a red line dried in the bottom of each, a coffee mug of Margot’s, two Arrowhead bottles.","Theo is at the island in the navy silk robe from the fire alarm, with an espresso and his hair flattened on one side. He has picked up a dish towel from somewhere and is drying one wine glass, slowly, turning it in the towel as if he’s read about this. “I slept,” he says, though Jack hasn’t asked. “Eleven-forty to six-fifty. Left side. I dreamed about Rossellini.” Jack doesn’t say anything. Theo turns the glass.","The RAZR buzzes on the counter by the coffee, rattling against the marble. A number Jack doesn’t have saved, long, out of state. The screen only lights when he tips it. He dries his hand on his jeans and opens it to a recording, a woman’s voice, flat and loud in the quiet kitchen: “This is a prepaid call from — ” and then a gap, and into the gap a voice Jack knows better than his own, saying its own name: “*Danny.*” And the woman again: “ — an inmate at Trumbull Correctional Institution. This call is from a correctional facility and is subject to monitoring and recording. To accept this call, press — ”","Theo is three feet away with the towel in one hand and the glass in the other. Jack presses the key.","“*Professor.*” There it is: Glenwood Avenue in a voice, gravel and laughing, a little out of breath like he just came in from somewhere. “You up? It’s ten o’clock. Ma put money on it, so don’t make me talk to myself.” Jack says, “I’m up,” and his voice works. Behind Danny there’s a room full of other men’s voices and a television and a door that buzzes and bangs. “Ma came yesterday. Brought the good socks. The gray ones, the wool. Spent ten minutes at the desk telling the C.O. they’re not contraband, they’re *socks*. She won.” A laugh. “She says there’s a veil girl.” “There’s a girl in my class who wears a veil to Mass.” “That’s what I said, Professor. A veil girl.”",{"if":"e2_told_dad_job","text":"“And you wash dishes. Dad told her. *Dad* told her.” Danny lets that sit, so Jack can hear how big it is. “Dad don’t tell her nothing. So he’s proud. So don’t be a pussy about it.”"},{"if":"e2_wrote_danny","text":"“Dad says you wrote. It ain’t come.” “Thursday. I mailed it Thursday.” “Mail’s slow in here. They read it first. Some guy in the mailroom’s gonna know your business before me.”"},"The tap is still running. Jack doesn’t turn it off. His free hand has found the St. Michael medal through his T-shirt and is holding it, the edge of it pressing into his thumb. “Where are you?” Danny says. “It sounds like money.” Jack looks at the kitchen: the steel, the glass, the Carrara, the gray ocean past the glass, Theo standing in all of it in a silk robe drying one glass forever. “Malibu.” “Get *out*.” A whoop, and somebody on Danny’s end tells him to keep it down, and he says something back Jack can’t hear. Then he’s close to the phone again, and quieter. “Describe it.”"],"choices":[{"text":"Describe the ocean, plainly.","tag":"Sincerity","set":{"trait.sincerity":"+1","soul.grace":"+1","e3_danny":"ocean"},"response":["So he does. He turns to the glass and tells his brother what’s there. It’s gray right now, with fog lying on it low. Under the fog it’s green close in and blue farther out, and there’s a line where it meets the sky that you can’t find, you keep looking and you can’t. It’s cold, colder than Lake Glacier in May. The house is right on top of it, and all night you can hear it under the floor, coming in and going out, like somebody breathing in the next room.","On the other end nobody says anything. The television, the door buzzing. Then Danny, quiet: “Okay. Okay.” A breath. “Keep that one.”"],"goto":"s12b"},{"text":"Describe Malibu as a crime scene: the labeled fridge, the Oscar by the toilet.","tag":"Wit","set":{"trait.wit":"+1","e3_danny":"funny"},"response":["“Okay. Victim’s a refrigerator. Every container in it labeled, same handwriting: R.V., Monday, Do Not. Do not *what*, Danny. It doesn’t say. We have no suspects. Then you go down the hall to take a leak, and there’s an Academy Award on the shelf next to the hand towels. A real one. I picked it up. It weighs about what a kid’s bowling ball weighs.”","And Danny is laughing — the big one, from the stomach, the one that used to come up the stairs on Glenwood at two in the morning when he thought everybody was asleep, the one Jack hasn’t heard since — and Jack keeps talking so it won’t stop. The Oscar has a little gold sword. The man who owns the Oscar has a hedge cut with a ruler. Danny laughs until somebody on his end tells him to shut up, and he tells them to shut up, and keeps laughing."],"goto":"s12b"},{"text":"Hand the phone to Theo: “Say hi to my brother.”","tag":"Charm","key":"You let Theo talk to Danny.","set":{"trait.charm":"+1","rel.theo.trust":"+1","rel.theo.warmth":"+1","e3_danny":"theo_hi"},"response":["Jack holds the RAZR out across the counter. “Say hi to my brother.” Theo looks at the phone. Then he puts the glass down and takes it, dish towel and all, and puts it to his ear, and the earpiece is loud enough in the quiet kitchen that Jack hears both halves.","“Who’s this?” “The roommate.” “He any good?” Theo looks at Jack over the phone for a second. “He’s a menace.” Danny laughs, low. “Yeah. He is.” Then, in a different voice, the one he used to use at the top of the driveway when Jack was nine and going somewhere on a bike: “Look out for him.” Theo doesn’t say anything clever. He hands the phone back."],"goto":"s12b"}]},"s12b":{"slug":"MONDAY · 7:31 AM · THE VANCE HOUSE, KITCHEN","body":["The recorded woman cuts in over whatever Danny is saying: “You have one minute remaining.” Danny talks faster. “Go to Mass. Eat something. Don’t be a pussy, Professor. Tell the veil girl I said — ”","And then it’s a dial tone, steady and stupid, in a kitchen in Malibu. Jack holds the RAZR to his ear until the dial tone becomes the other noise, the one that tells you to hang up, and then he closes it. He reaches over and turns off the tap.","Theo hasn’t moved. Jack has watched Theo fill every silence on the fourth floor of Delgado Hall for a week — with a pitch, a logline, a story about a director, a bottle — and he doesn’t fill this one. He doesn’t ask what Danny did. He stands at the island in the silk robe with the gray light on him and waits, which Jack has never once seen him do.",{"if":"e3_danny==\"theo_hi\"","text":"He’s still holding the dish towel he took the phone with."}],"choices":[{"text":"Tell it plain: “He’s in Trumbull. Five years. A fight — a guy got hurt bad. Three more to go, maybe less.”","tag":"Candor","key":"You told Theo where your brother is.","set":{"trait.candor":"+1","soul.honesty":"+1","rel.theo.trust":"+1","e3_danny_told":"plain"},"response":["“He’s in Trumbull,” Jack says. “It’s a state prison, outside Warren. Five years. A fight — a guy got hurt bad. He pleaded. Three more to go, maybe less.” It’s what his mother says at St. Brigid’s when anybody asks, and he says it the same way she does, and stops.","Theo asks one question. “What does he read?” “Whatever I send.” Theo nods, as if that answers something he’d been wondering about for a while, and folds the dish towel in thirds and lays it on the counter."],"goto":"s12c"},{"text":"“He’s at a very exclusive school in Ohio.”","tag":"Wit","key":"You told Theo your brother was at a very exclusive school in Ohio.","set":{"trait.wit":"+1","e3_danny_told":"joke"},"response":["“He’s at a very exclusive school in Ohio,” Jack says. “Hard to get into. Harder to get out of.” Theo leaves the joke where it is. “Then I’ll send an application fee.” And then, short, with nothing on it: “I heard the recording, Costigan. It’s okay. I’m nobody.”"],"goto":"s12c"},{"text":"“Don’t tell anybody. Not yet.”","tag":"Sincerity","cue":"Theo will remember that.","key":"You asked Theo to keep it.","set":{"trait.sincerity":"+1","rel.theo.trust":"+2","e3_danny_told":"keep"},"response":["“Don’t tell anybody,” Jack says. “Not yet.” Theo looks at him across the island. “I’m good at that.” A pause. “Better than you’d think.” He picks up his espresso, finds it cold, and drinks it."],"goto":"s12c"}],"journal":[{"kind":"person","id":"danny","title":"Danny","text":"My brother. Trumbull Correctional. Calls me Professor. Ma brought him the good socks."}]},"s12c":{"slug":"MONDAY · 7:40 AM · THE VANCE HOUSE, KITCHEN","body":["Theo goes to the machine on the back counter, the big steel one with two dials and a pressure gauge, the one in his father’s kitchen, and makes an espresso the way he does everything with his hands: fast, exact, without looking. Grind, tamp, the hiss. He sets the cup down in front of Jack on its saucer. “You can touch this one,” he says. “It’s my father’s.”",{"if":"e2_alarm==\"hoodie\"","text":"Laney yawns into the kitchen in the Mooney hoodie and bare feet, a pink satin sleep mask pushed up on her forehead, her hair in a copper knot. “Who called so early, fireman? I heard a phone. I was *dreaming*.”","else":"Laney yawns into the kitchen in a camisole and bare feet, a pink satin sleep mask pushed up on her forehead, her hair in a copper knot. “Who called so early, fireman? I heard a phone. I was *dreaming*.”"},"Theo answers before Jack can open his mouth. “His bookie. The Browns are a long-term investment.” “Aw,” says Laney, with real sympathy. “Sugar.” She pats Jack’s arm on her way past, opens the refrigerator, considers the R.V. containers, closes it, and takes a peach from the bowl instead, satisfied in every particular.","Jack takes the cup. He takes the Marlboros out of the Carhartt on the back of the stool. He goes out through the glass door and across the deck, past the pool with the towel still folded on the coping, to the top of the beach stairs, where the fog is starting to come apart."],"journal":[{"kind":"person","id":"theo","title":"Theo Vance","text":"Roommate. Drives his grandfather’s car like a getaway. His father calls him Teddy and stays six minutes. Heard my brother’s voice and didn’t ask."}],"next":"s13"},"s13":{"slug":"MONDAY · 8:05 AM · THE VANCE HOUSE, THE BEACH STAIRS","body":["By eight the marine layer is lifting off Broad Beach in pieces, and the light coming through it has no shadows in it, like the inside of a shell. Jack sits on the weathered stairs below the deck with Theo’s espresso on the step beside him and the Marlboros open on his knee. He has been not lighting one for the life of an espresso. The RAZR is in his pocket, folded shut.","*Describe it*, Danny said. It’s gray this morning. He’d have to start there.","Behind him the screen door slides, and Lena comes down the stairs: a navy one-piece that has clearly had a life before her, the oatmeal cardigan over it, unbuttoned, a striped towel over one shoulder, her Keds hooked on one finger. The tin is in the cardigan pocket. She is soft and gold and entirely at ease in her own skin at eight in the morning, and Jack, who was raised right and is not made of wood, looks at the ocean.","She stops two steps above him and looks at the pack, the cup, his face. She doesn’t ask. Whatever she sees there, she stands on the step with it a moment."],"choices":[{"text":"Light it anyway.","tag":"Reckless","key":"You gave Lena’s reliquary its second relic.","set":{"trait.reckless":"+1","soul.restraint":"-1","reliquary":"+1","jack_cigs":"+1","e3_stairs":"lit","resolve.jack":"-1"},"response":["He lights it. He gets the first drag, the one that goes all the way down to the place it’s for, and then her hand is there and the cigarette isn’t, and she’s stubbing it out on the step between his feet as if she’s done it all her life. The tin comes out of the cardigan with a little hinge-click, the Lighthouse cigarette lying in it on its bed of paper, and she lays No. 2 beside it, uncaps a pen with her teeth, and writes the slip against her bare knee.",{"type":"doc","title":"A slip of paper, folded into the tin","text":"No. 2 · 9/7/09 · Malibu · before breakfast, on a holiday."},"She snaps the lid and looks at him longer than confiscation takes. “At this rate I’m going to need a bigger tin,” she says, “and they only sell this size in *Buellton*.”"],"goto":"s13b"},{"text":"Put the pack away before she reaches him.","tag":"Control","key":"You put the pack away before Lena reached you.","set":{"trait.control":"+1","soul.restraint":"+1","resolve.jack":"+1","e3_stairs":"pocketed"},"response":["He closes the lid and puts the pack in his back pocket, behind the *Brideshead*, before she’s off the last step. She sees it go. She sits down beside him with a thump, digs the tin out of her cardigan and shakes it at him, one lonely cigarette sliding end to end inside like a bead in a rattle. “I brought the tin and *everything*.”"],"goto":"s13b"},{"text":"Hold one out to her, unlit: “For the collection.”","tag":"Sincerity","key":"You offered Lena a cigarette for her collection, and she turned it down.","set":{"trait.sincerity":"+1","rel.lena.warmth":"+1","e3_stairs":"offered"},"response":["He shakes one out and holds it up to her, filter first. “For the collection.” She looks at it, and at him, and doesn’t take it. “Donations aren’t relics, Costigan. They’re *tithes*.” Then her own line from the Hollis steps, in mint condition: “Where’s the sport?” She takes his wrist instead — the hand with the cigarette in it — and pulls him down the last step onto the cold sand."],"goto":"s13b"}]},"s13b":{"slug":"MONDAY · 8:20 AM · BROAD BEACH, THE WATER’S EDGE","body":["Down at the water the sand is packed hard and cold under their feet, and the beach belongs to them, a man with a golden retriever a quarter mile east, and the gulls. Lena drops the towel, folds the cardigan on top of it with the tin inside, and stands with her toes on the line where the foam gives up.","“Sixty-six degrees,” she says. “Kevin looked it up for me this morning, on his BlackBerry, and then he looked at *me* like I’d asked him to look up my obituary.” She regards the Pacific with deep personal suspicion. “This is the Gulf’s mean cousin. The one who went off to boarding school and came back talking funny.”",{"if":"e3_duel_personal","text":"She hasn’t called him anything yet this morning: not Costigan, not Youngstown, not Mr. anything. Whatever she’s saving it for, she’s still saving it."},"Then she looks at him instead, properly, with her red-pen face on. “You look like somebody’s Monday.”"],"choices":[{"text":"“Family stuff. It’s good, actually. Mostly.”","tag":"Candor","set":{"trait.candor":"+1","rel.lena.trust":"+1","e3_lena_monday":"family"},"response":["She doesn’t push. She looks at him a second more and lets it be exactly what he said it was. “Okay.” Then she nods at the water. “Then you need the Pacific. It’s a sacrament for Protestants.”"],"goto":"s13c"},{"text":"“The Browns.”","tag":"Wit","set":{"trait.wit":"+1","rel.lena.warmth":"+1","e3_lena_monday":"browns"},"response":["“Lord.” She puts a hand on his arm in sympathy, briefly, as at a wake. “That’s a *grief*. Get in the water.”"],"goto":"s13c"},{"text":"“Race you.” And go.","tag":"Reckless","set":{"trait.reckless":"+1","rel.lena.heat":"+1","e3_lena_monday":"race"},"response":["He’s off before the words are out, and she’s past him by the second stride, because she has put a hand in the middle of his back going by and shoved. “*Cheater*.” “*Catholic*,” she yells, and hits the water first."],"goto":"s13c"},{"text":"“I was out of line last night. About your father. Your family.”","if":"e3_duel_personal","tag":"Candor","cue":"Lena will remember that.","key":"You apologized to Lena for what you said about her family.","set":{"trait.candor":"+1","soul.honesty":"+1","rel.lena.trust":"+1","rel.lena.friction":"-1","e3_apologized_personal":true},"response":["She looks at him for a long moment with the Pacific going over behind her. “Apology noted, Mr. Costigan.” Then she turns to the water and wades in to the knee, and says over her shoulder, without looking back, “Costigan. Get in. It’s worse if you wait.”"],"goto":"s13c"}]},"s13c":{"slug":"MONDAY · 8:24 AM · BROAD BEACH, THE WATER","body":["The cold takes his breath at the knees and the rest of it at the waist. Lena goes under once and comes up shrieking, hair streaming, swearing by saints she invents on the spot — Saint Frigidaire, abbot; Blessed Somebody of the Icebox — and Jack laughs so hard he takes in a mouthful of the Pacific.","Then a wave stands up out of nowhere, green and glassy along the top, and breaks across both of them, and she comes off her feet straight into him. He catches her by the elbows. For a second they’re chest-deep in the Pacific holding on, her hands flat on his forearms, salt caught in her eyelashes, his St. Michael gone cold against his sternum, both of them laughing too hard to stand up properly. He can feel the whole cold ocean except for the few inches where she is. He knows exactly what the next second is. He has known since a porch light went out on Seacliff Road.","He lets go first.","His hands keep the shape of her elbows for a while under the water, and the ocean is very cold, and he minds both of those things a great deal. Then she ducks under and comes up streaming and yells at the sky about it, and he’s laughing again, and the laughing is the realest thing that has happened to him since the phone buzzed on the marble. She lies back and floats with her arms out and her hair fanned on the swell, and gives the gray sky the Who Dat at full volume, *who dat say dey gonna beat dem Saints*, to an audience of one golden retriever, who barks back.","Jack treads water and starts the letter in his head. *Sixty-six degrees. Green at the top of the waves, gray underneath. It sounds like a truck going by that never finishes going by. A girl from New Orleans hates it.*","Out of the water she wraps herself in the cardigan, teeth going, wet wool and salt, and stands over him where he’s collapsed on the towel, and delivers her review of the Pacific Ocean. “Four out of ten. Like your marionberry.” “My dad would complain.” “About the ocean?” “About the rating. He’d give it a three. He gives everything a three.” “Your daddy,” Lena says, dripping on him, “would be *right*.”",{"if":"e3_told_lena_frank && !e3_duel_personal || e3_told_lena_frank && e3_apologized_personal","text":"She sits down beside him on the towel, knees up, and adds, lightly, to the water, that she’d like to meet a man who’d give the whole Pacific Ocean a three. She leaves it there. So does he."},"Up on the deck Kevin appears at the rail waving a spatula over his head, which means breakfast. The marine layer is burning off from the east. Neither of them moves yet."],"next":"s14"},"s14":{"slug":"MONDAY · 1:10 PM · US-101 NORTH, THE ODYSSEY","music":"Bruce Springsteen — “Factory”","body":["They left Broad Beach at noon. Everyone is in the van except Theo, who is in the SL, and Laney, who at the bottom of the drive handed Kevin her three suitcases one by one and climbed into the two-seater beside Theo. “A girl can arrive in a minivan, sugar,” she told Kevin, tying a scarf over her hair. “She *leaves* in somebody’s car.” On the back glass of the Odyssey, in shoe polish, the countdown says 6 DAYS. Lena did it in the drive this morning with her wet hair dripping on the bumper.","At one o’clock Kevin switched over to KNX for the news, and they all heard it: the President in Cincinnati this morning, at the AFL-CIO’s Labor Day picnic, talking about health care and the unions and the dignity of work, and a crowd behind him that sounded, through the static on the Oxnard plain, like a parish festival when the band comes on. Then Kevin plugged in his iPod and put on Springsteen: the early-morning whistle, the men walking out in the morning light. “My dad likes the Boss,” Kevin says now, eyes on the road, ten and two. “He thinks he’s a Republican.”","Jack laughs, and Kevin looks pleased, and then, still watching the road: “My dad’s stores are open today. He has two. Nail-salon supply, in San Jose — polish, acetone, the chairs. He’s never had a Labor Day.” Kevin shrugs with one shoulder. “He says Labor Day is for people with bosses.” It’s the most Kevin has ever said about his father, and he says it the way he says everything, sunny, at sixty-five miles an hour, and then he changes lanes.",{"type":"sms","from":"LANEY (FIREMAN’S FAVORITE)","text":"FIREMAN!!! there is a CASSETTE in this car. theodore says its an adapter. i am being kidnapped by 1985 ;) tell kevin i love him xoxo","time":"1:14 PM"},"Margot rides shotgun with the Moleskine on her knee and *Nickel and Dimed* face-down on the dash. She has been quiet since Malibu, which for Margot is a kind of buildup. Somewhere past Oxnard she turns around in her seat. “Here’s what I can’t get past. Your Church loves unions in its encyclicals. Leo, Pius, John Paul, now Benedict — workers’ associations are a natural right, to be honoured even more than in the past, very moving. And then it fights them in its own hospitals and its own schools. Nurses. Teachers. Janitors. In writing it’s Dorothy Day. In the parking lot it’s management.”","Jack opens his mouth. Across the aisle, Lena, who has been half asleep against the window with her cardigan pulled up to her chin, doesn’t open her eyes. “She’s right,” Lena says. “Write that down, Margot. It’ll never happen again.” Margot uncaps the pen and then, for once, doesn’t use it. Lena is asleep before Margot has put the cap back on, her head against the glass, the tin making its small dry sound in her cardigan pocket every time Kevin takes a curve, her Keds crossed on the back of Margot’s seat.",{"type":"sms","from":"Gina","text":"obama was on the radio from cincinnati. dad yelled at it but nicely. hes still in the garage. happy labor day i guess","time":"11:02 AM"},"He reads it now, two hours late, with the screen tipped to catch the light. It’s after four on Glenwood Avenue, and Jack can see it from here: the Silverado is in the drive because there’s nowhere to drive it. The garage door is up, the radio on the workbench, his father on the stool with his hands empty. Kevin’s iPod has gone around and started the song over. Springsteen is singing about his father walking through the factory gates in the rain."],"choices":[{"text":"Call Dad.","tag":"Sincerity","cue":"Your father will remember that.","key":"You called your father on Labor Day.","set":{"trait.sincerity":"+1","resolve.jack":"+1","e3_labor_call":"called","rel.kevin.warmth":"+1"},"response":["Frank picks up on the fourth ring. Jack can hear the garage before he hears his father: the radio low, a ballgame, the scrape of the stool. “Yeah.” “Happy Labor Day, Dad.” “Don’t.” A pause with the radio in it, a long one, the length of an at-bat. Jack waits it out. He learned that in the cab of the Silverado, across twenty-four hundred miles.","“You working tomorrow?” his father says finally. “Tuesday. Seven to one.” “Good.” And Frank hangs up first, the way he always does, as though long distance were still a dollar a minute. Jack holds the phone in his lap with the screen gone dark and the Boss still going, and doesn’t mind."],"goto":"s15"},{"text":"Text Gina: tell him happy Labor Day.","tag":"Candor","set":{"trait.candor":"+1","e3_labor_call":"texted"},"response":["T9 fights him for every word. *tell dad happy labor day. from me.* He sends it and closes the phone and watches the last of the Oxnard plain go by, the strawberry fields in their long rows with the pickers bent over them, out in the sun on the holiday.",{"type":"sms","from":"Gina","text":"he said dont. then he said tell him good","time":"1:31 PM"}],"goto":"s15"},{"text":"Put the phone away and watch the coast.","tag":"Control","set":{"trait.control":"+1","e3_labor_call":"none"},"response":["He closes the RAZR and puts it in the Carhartt and watches the coast come back to them: Ventura, the Rincon, Santa Barbara in its haze. At Gaviota they go into the tunnel the other direction and come out into gold hills, and in the middle row Lena sleeps through all of it."],"goto":"s15"}],"journal":[{"kind":"person","id":"kevin","title":"Kevin Tran","text":"Kevin Tran. Goes to daily Mass, saves you a seat with a Bible. Has a sister, Tina, in dental school, who flossed in the womb. Lies to his mom about orgo in Vietnamese. Drives his mother’s Odyssey at sixty-five, not sixty-six. His dad has two nail-salon supply stores in San Jose and has never had a Labor Day."}]},"s15":{"slug":"MONDAY · 11:52 PM · DELGADO HALL, ROOM 412","body":["412 smells like itself again: espresso, Theo’s cologne, eucalyptus coming in through the cracked window, and under all of it, faintly, a weekend of chlorine and woodsmoke in their clothes on the floor. The fog is back. The radiator ticks.",{"if":"e2_has_bike","text":"La Flaca is chained to the radiator pipe in the fourth-floor hall where Jack left her, and in their absence she has been served. A fresh laminate hangs from her handlebars on a loop of yarn: BICYCLES ARE NOT RESIDENTS. (THIS MEANS YOU, 412.) Priya has drawn a small, furious bicycle in the corner, with eyebrows."},{"if":"e2_books==\"loan\" && e3_terms==\"tab\"","text":"Before bed Theo goes to the espresso machine and takes the Post-it down slowly, like a man lowering a flag. He tears it carefully along the line between them, folds the top half — *IOU 1 PIE (TBD) —J.C.* — and puts it in his wallet. The bottom half goes back on the machine, smoothed down: *+ 1 MALIBU —T.V.* “Paid,” he says, tapping his wallet. Then, tapping the machine: “Open.”"},{"if":"e2_books==\"loan\" && e3_terms!=\"tab\"","text":"Before bed Theo goes to the espresso machine and takes the Post-it down slowly, like a man lowering a flag — *IOU 1 PIE (TBD) —J.C.* — and folds it once and puts it in his wallet, behind the black card, in the slot where most men keep a photo. “Paid,” he says."},"The Dell is open on Jack’s desk, fan whining, the browser on Facebook because that’s where the browser always is.",{"if":"e2_becca==\"yes\"","type":"fb","name":"Becca Lindell","text":"Becca Lindell wants to be friends on Facebook. SEE YOU THE 19TH!!","meta":"Friend Requests · Confirm · Not Now"},{"if":"!e3_duel_personal && e3_sunday==\"getty\"","type":"sms","from":"Lena","text":"Two–one. On Wednesday it’s Herakles against Gage, so bring something red you can afford to lose. —L.","time":"11:40 PM"},{"if":"!e3_duel_personal && e3_sunday!=\"getty\"","type":"sms","from":"Lena","text":"Two–one. On Wednesday I bleed on Gage, so bring something red you can afford to lose. —L.","time":"11:40 PM"},{"if":"e3_duel_personal","type":"sms","from":"Lena","text":"Two–one. Wednesday, as assigned. —L.","time":"11:40 PM"},{"if":"e3_roux==\"stirred\" && !e3_duel_personal || e3_roux==\"stirred\" && e3_apologized_personal","type":"sms","from":"Lena","text":"Also: thank you for stirring.","time":"11:41 PM"},"Complete sentences. Punctuation. An em-dash, which on an LG keyboard she has to go looking for. He reads it with the RAZR’s screen tipped to the one angle where it lights, and closes the phone, and opens it and reads it again, and doesn’t answer yet, because anything he can type on T9 tonight will lose.","Theo turns off the lamp. The dark in 412 is never really dark: the laptop’s standby light, the hall light under the door, the Grove gone blue-black in the window. Nobody says anything for a while, and Jack thinks Theo’s asleep, until Theo says, to the ceiling —",{"if":"e3_danny_told==\"joke\"","text":"“Costigan. The exclusive school in Ohio.” A pause. “Do they let them have books?”","else":"“Costigan.” A pause. “What’s he reading?”"},"Jack looks at the ceiling too. “Whatever I send. One a month. Used. They won’t let him have anything with writing in it, so I erase the margins and put my notes on a separate sheet.” It’s more than he’s said about it out loud to anybody at Marisol, and he gets through it without stopping, and Theo lets him finish.","“Send him the Waugh,” Theo says. “It’s mine,” Jack says. “I’ll buy you another,” says Theo.",{"if":"e3_hundred==\"kept\"","text":"Richard Vance’s hundred is still folded in it, at the place where the holy card isn’t. Jack doesn’t mention that, and Theo, who watched it go in, doesn’t either."},"The sheets rustle across the room and Theo turns over toward the wall. Down on the bluff the Surfliner went through hours ago. At 2:10 the freight horn comes up off the tracks, long and low and two-toned, and Jack, home, lies on his back in the dark and counts the cars."],"journal":[{"kind":"note","id":"ledger","title":"The ledger","text":"Pie: paid. Bus fare: paid, with compliments. Richard Vance’s hundred: in *Brideshead*.","if":"e3_hundred==\"kept\""},{"kind":"note","id":"ledger","title":"The ledger","text":"Pie: paid. Bus fare: paid, with compliments. Two hundred of Richard Vance’s dollars, and a problem.","if":"e3_hundred==\"two\""},{"kind":"note","id":"ledger","title":"The ledger","text":"Pie: paid. Bus fare: paid, with compliments. Richard Vance’s hundred: returned.","if":"e3_hundred==\"returned\""},{"kind":"note","id":"ledger","title":"The ledger","text":"Pie: paid. Bus fare: paid, with compliments. Richard Vance’s hundred: Theo’s, for the gas. It’s been through the pool.","if":"e3_hundred==\"theo\""},{"kind":"note","id":"malibu","title":"+ 1 Malibu","text":"The bottom half of the pie Post-it, still on the espresso machine in Theo’s hand. Theo says it’s open. I believe him.","if":"e2_books==\"loan\" && e3_terms==\"tab\""},{"kind":"note","id":"record","title":"Duels with Lena","text":"Two–one. She paid her Sunday."}],"end":true}}},{"id":"S1E04","season":1,"episode":4,"showTitle":"The Hard Saying","title":"Nativity","dates":"Tuesday, September 8 – Saturday, September 12, 2009","logline":"Tuesday is the Blessed Mother’s birthday, Wednesday a congressman calls the President a liar, and Thursday a boy with a guitar plays the one song he saves for once a month — and Jack walks Lena home the long way.","previously":[{"text":"Under the candles at St. Brendan’s, a small brass plate: NORA GRACE CALLOWAY · 1989–2009."},{"text":"Lena bought an Altoids tin in Buellton and wrote RELIQUARY on the lid. By Labor Day it held two of your cigarettes.","if":"reliquary>=2"},{"text":"At the Getty she wrote your objection into her own paper, in her own hand, with your name after it.","if":"e3_getty==\"press\""},{"text":"By the fire she won the argument — and you told her your father’s been laid off since June.","if":"e3_told_lena_frank"},{"text":"Labor Day morning your brother called from Trumbull Correctional, Theo three feet away. You told Theo where Danny is. He asked one question: what does he read?","if":"e3_danny_told==\"plain\""},{"text":"You told Nonna you’d played chess instead of going to confession. She said: go next week.","if":"e3_nonna==\"truth\""}],"cast":[{"id":"lena","name":"Lena Broussard","role":"The girl on the porch","tracked":true},{"id":"theo","name":"Theo Vance","role":"Roommate, Room 412","tracked":true},{"id":"laney","name":"Laney Price","role":"Lena’s roommate","tracked":true},{"id":"margot","name":"Margot Lindqvist","role":"Third floor, Delgado","tracked":true},{"id":"kevin","name":"Kevin Tran","role":"Down the hall, Room 420","tracked":true},{"id":"osei","name":"Fr. Gabriel Osei","role":"Newman Center chaplain","tracked":true},{"id":"hale","name":"Prof. Adrian Hale","role":"Philosophy, Marisol","tracked":true},{"id":"julian","name":"Julian Park-Ellis","role":"A guy with a guitar","tracked":true},{"id":"evan","name":"Evan Marsh","role":"TA, PHIL 1, Thursday section","tracked":true},{"id":"becca","name":"Becca Lindell","role":"Newman regular","tracked":true},{"id":"frank","name":"Frank Costigan","role":"Jack’s father","tracked":false},{"id":"maria","name":"Maria Costigan","role":"Jack’s mother","tracked":false},{"id":"nonna","name":"Carmela Rinaldi","role":"Jack’s grandmother","tracked":false},{"id":"gina","name":"Gina Costigan","role":"Jack’s sister","tracked":false},{"id":"rosie","name":"Rosie Costigan","role":"Jack’s sister","tracked":false},{"id":"priya","name":"Priya Raman","role":"4th-floor RA","tracked":false},{"id":"rafi","name":"Rafi Ochoa","role":"Second floor","tracked":false},{"id":"doug","name":"Doug Pruitt","role":"Room 420","tracked":false},{"id":"joey","name":"Joey Abruzzo","role":"Newman regular","tracked":false},{"id":"tyler","name":"Tyler Brandt","role":"Newman missionary","tracked":false},{"id":"fitch","name":"Dolores Fitch","role":"Newman secretary","tracked":false},{"id":"sloane","name":"Sloane Kittredge","role":"Pi Lambda Chi","tracked":false},{"id":"gloria","name":"Gloria Mendes","role":"The Anchor, nights","tracked":false},{"id":"rudy","name":"Rudy Salcedo","role":"Line cook, the Anchor","tracked":false},{"id":"caleb","name":"Caleb Hargrove","role":"PHIL 9H","tracked":false},{"id":"yusuf","name":"Yusuf Noorzai","role":"PHIL 9H","tracked":false},{"id":"wes","name":"Wes Arceneaux","role":"Lena’s boyfriend, Tulane","tracked":false},{"id":"tess","name":"Tess Fontenot","role":"Lena’s sister","tracked":false},{"id":"richard","name":"Richard Vance","role":"Theo’s father","tracked":false},{"id":"brynn","name":"Brynn Vance","role":"Richard’s wife","tracked":false},{"id":"caroline","name":"Caroline Ashby Vance","role":"Theo’s mother","tracked":false},{"id":"poppy","name":"Poppy Vance","role":"Theo’s sister","tracked":false},{"id":"danny","name":"Danny Costigan","role":"Jack’s brother","tracked":false},{"id":"remy","name":"Remy Broussard","role":"Lena’s brother","tracked":false},{"id":"nora","name":"Nora Calloway","role":"Name on a brass plate","tracked":false}],"duels":{},"start":"s01","endCard":{"tag":"Wert thou my enemy, O thou my friend.","nextTime":["“Ten a.m. Sully’s. Black and gold or don’t come.”","“Two men drive home from the same party. Only one of them hits anybody.”","“Who dat, Costigan. Say it like you mean it.”","“Bid Day, sugar. Wear something you can cry in.”"]},"scenes":{"s01":{"slug":"TUESDAY · 9:41 AM · SANDOVAL HALL 1, ROW M","body":["The fog came up off the Lagoon in the night and has stayed for class. It beads on the windshields in the Anacapa lot and on the wool of Jack’s flannel, and it smells of kelp and wet eucalyptus. Kevin’s Odyssey is nosed in by the dumpsters where it lives, and across its back glass, in white car-wash polish, it still says WHO DAT · 6 DAYS.","In his back pocket, new this week, is Gerard Manley Hopkins: *Poems and Prose*, Penguin Classics, edited by W. H. Gardner, the black spine gone gray at the creases and CARDINAL MOONEY H.S. LIBRARY — DISCARD stamped in purple ink across the edge of the pages. A quarter off the discard cart, junior spring; it rode to California in the milk crate with the rest of them. Last night *Brideshead* went on the corner of his desk, squared up and ready to go to Danny, and the Hopkins went into the pocket *Brideshead* had worn to its shape, and the Benedict holy card moved over with it, the way it moves with everything.","Sandoval Hall 1 at 9:41 is four hundred orange seats and the sound of four hundred backpacks being unzipped at once. Margot is already in Row M, all in black, oxblood Docs up on the seatback in front of her, the Moleskine open on her knee to a page she has dated in the corner and nothing else. Jack sits down beside her. The seat on her other side, the aisle seat, is empty: no OCTAVIA BOOKS tote, no highlighter, no square of black lace folded on top of a Greek grammar. Just orange plastic, flipped up.","Margot doesn’t look up. “Row M. Her seat’s empty.” “I see it.” “She has occupied that aisle at both lectures to date, highlighter in her teeth, defending it from the general public.” Margot turns to a fresh page she has no plans for. “I’m not concerned. I’m noting a departure from baseline.”","At 9:42 Adrian Hale comes out from the wings in the linen jacket with the wine on the cuff, his silver hair still wet from some emergency shower, his face the color of a man who was up very late with a bottle and believes he won. A TA hurries after him holding out the clip-on mic. Hale looks at it, and then at the TA, and takes the handheld off its stand instead, and never once lifts it to his mouth. The hall goes quiet from the front rows up.","“Good morning. At nine o’clock this morning the President of the United States addressed the nation’s schoolchildren on the importance of working hard and staying in school,” he says, “and several thousand American parents kept their children home in case industry is contagious.” The laugh comes up the rake in a wave. Hale doesn’t wait for the end of it. “Today: evil. Not yours. You’re eighteen; you haven’t had time.”","He gives them Hume, the *Dialogues*, Part Ten: Philo the skeptic doing the heavy lifting and enjoying it, Philo handing the job to Epicurus, Hale handing it to them from memory, one question at a time, pacing the lip of the stage. “*Is he willing to prevent evil, but not able? then is he impotent. Is he able, but not willing? then is he malevolent. Is he both able and willing? whence then is evil?*” He lets the last one go up into the dark at the back of the hall. Then, quieter — the first quiet thing he’s said, and four hundred people lean toward it — “The problem of evil is a bill, ladies and gentlemen. Someone always pays it, and it is never the theologian.”","Jack doesn’t write it down. He won’t need to. Under the fold-down desk the RAZR is warm in his hand. He has had her number since Saturday, off the back of Kevin’s laminated itinerary, and the cracked screen lights only at one angle, and he tips it to the angle."],"choices":[{"text":"“hale is doing evil. epicurus. u wd hate it. saving u a seat”","tag":"Wit","set":{"e4_text":"wit","trait.wit":"+1"},"response":[{"type":"sms","from":"Jack","text":"hale is doing evil. epicurus. u wd hate it. saving u a seat","time":"9:44 AM"},"T9 fights him on *epicurus* and loses. He snaps the phone shut and puts it face down on his thigh. Margot has read the whole thing upside down without moving her head. “You text like a ransom note.” Onstage Hale has moved on to Leibniz and the best of all possible worlds, which he pronounces like the name of a hotel he was thrown out of. The phone stays dark through all of it."],"goto":"s02"},{"text":"“u ok”","tag":"Sincerity","set":{"e4_text":"plain","trait.sincerity":"+1","rel.lena.trust":"+1"},"response":["He sends it plain. Then he sits with the phone tipped to its angle and looks at what he sent, which doesn’t take long, and goes on looking at it anyway, as if it might get longer. Nothing comes back. Hale gets through Leibniz and starts on Voltaire. Margot, still not looking: “Brevity. The soul of a worried man.”"],"goto":"s02"},{"text":"Don’t text. Take her notes instead, in your best Mooney cursive.","tag":"Control","set":{"e4_text":"notes","trait.control":"+1","rel.lena.warmth":"+1"},"response":["He puts the phone away and takes out a legal pad and writes Hume down the way the Sisters at St. Brigid’s drilled it into him, the loops closed, the capitals tall: Philo, Part Ten; Epicurus’s three questions, boxed; *a bill — never the theologian*, underlined once. By the end of the hour there are two pages, and Margot has been watching the second one fill. “You’re taking notes for two.” “I’m taking notes.” “Mm,” says Margot, and turns back to Hale."],"goto":"s02"}]},"s02":{"slug":"TUESDAY · 12:10 PM · ST. BRENDAN’S, THE MARIAN SHRINE","set":{"resolve.lena":5,"resolve.jack":"+1"},"body":[{"if":"e4_text==\"wit\" || e4_text==\"plain\"","text":"At 11:58, halfway across Ocean Road with the Grove still dripping from the morning fog, the RAZR goes off in his pocket. He gets it open on the median, tipped to the one angle where the cracked screen will light, while a Prius waits.","else":"At 11:58 Jack crosses Ocean Road with the Grove still dripping from the morning fog and two pages of Hume folded in his flannel pocket for somebody who wasn’t there to take them."},{"type":"sms","from":"Lena","text":"I’m fine. —L.","time":"11:58 AM","if":"e4_text==\"wit\" || e4_text==\"plain\""},{"if":"e4_text==\"wit\" || e4_text==\"plain\"","text":"A period after *fine*, set down like a cup on its saucer."},"St. Brendan’s at ten past noon on a Tuesday is the overturned hull, the blue glass, and about twenty-five people scattered under the ribs: grad students on their lunch, two old women in cardigans, a man in a FedEx uniform, Mrs. Fitch. White vestments for the feast. The Nativity of the Blessed Virgin Mary — the bulletin board says so, in somebody’s bubble capitals, with a cake drawn on it.","Lena is in the back row. Alone, at the end of the pew by the side aisle, in the black lace mantilla, a missal shut on her knee. Not in Row M this morning, and not, from the look of her, saying why. She doesn’t look up when he passes. He doesn’t make her.","Kevin is halfway up on the left in a gray quarter-zip, and there’s a Bible on the seat beside him holding Jack’s place like a towel on a deck chair. “Saved you a seat,” Kevin whispers. “Full service. I even opened it to Micah.”","Before the bell, Mrs. Fitch gets up out of her pew in her lavender cardigan and goes up the side aisle carrying a bud vase with one white rose in it, the stem cut on a slant. She sets it on the ledge of the Marian shrine, beside the small brass plate under the votive rack. She moves it a quarter of an inch. She goes back to her pew and kneels. Then the bell goes, and everybody stands.","It’s a feast, so there’s a Gloria, the organist hauling it out of the pipes in a foghorn baritone. A grad-student lector reads Micah — *But you, Bethlehem-Ephrathah, too small to be among the clans of Judah* — and comes apart on *Ephrathah*, and goes back, and gets it, and the old women nod at her as if she’s done something brave. *With delight I rejoice in the Lord.* Then Osei takes the long Gospel, the whole genealogy, and doesn’t hurry a single name. He reads Amminadab and Shealtiel and Zerubbabel as if each had been introduced to him personally and turned out to be good company.","The homily is short, the way his are. “Matthew had an editor’s choice,” Osei says. “Every family has relatives it leaves off the Christmas card. He could have left them off. Tamar. Rahab. Ruth, who was a foreigner.” He waits. “And the wife of Uriah.” He doesn’t say her name. He says whose wife she was, and lets twenty-five people work out the rest for themselves. “He put them in on purpose. God is not ashamed of his family.”","At Communion the last of the line is Lena. She goes down on both knees on the bare floor in front of Osei, the scalloped edge of the lace sliding forward along her cheek, and receives on the tongue, and goes back to her pew without looking at anyone. The organist plays them out on “Immaculate Mary,” the *Ave, Ave* coming round and round, and the noon takes the congregation one and two at a time.","Lena doesn’t go. She takes a taper at the Marian shrine and lights a candle in the top row of the rack, above the brass plate and Mrs. Fitch’s rose, and stands with the taper burning in her fingers until she remembers to shake it out. Osei comes past on his way to the sacristy, the limp a little worse at the end of a feast. “Magdalena,” he says, and nods, and keeps going.","Jack comes up beside her at the rack. Red glass, two dozen small flames leaning one way in the draft from the door. Our Lady above them in plaster and blue, holding out her hands. He means it the way it sounds. “Happy birthday to her.”","The lace at her cheek stops moving. “To who?” Her hand has gone to the medal at her throat and closed on it.","“Our Lady,” he says. “It’s the Nativity.”","“Right. Yes. It is.” She lets go of the medal. She smiles at him beautifully, from about a mile away — the smile, he’d bet, that the nuns in New Orleans teach girls for visiting monsignors. “Costigan.” She picks up the OCTAVIA tote from the end of the pew. “I’ll see you Wednesday. Bring yours.”"],"choices":[{"text":"Light a candle beside hers. Say nothing.","tag":"Sincerity","set":{"e4_shrine":"candle","trait.sincerity":"+1","rel.lena.trust":"+1"},"response":["He leans a taper into her flame and carries it down one row and lights his own. He puts a dollar in the brass slot, which is all he has in that pocket.","She looks at his candle. Then she looks at him, and keeps looking, until the new wick has stopped guttering and stands up straight on its own. “Thank you,” she says — low, careful, as if it cost exactly what she had on her. Then she puts the tote on her shoulder and goes out the side door into the courtyard, and he stays with the two candles, one above the other, until the draft from the door settles."],"goto":"s03"},{"text":"Kneel at the rail beside her a minute.","tag":"Control","set":{"e4_shrine":"kneel","soul.grace":"+1","trait.control":"+1","rel.lena.warmth":"+1"},"response":["He goes down on the kneeler at the shrine rail and folds his hands. After a moment she sets the tote back down and kneels at the other end of it, an arm’s length of worn red vinyl between them.",{"if":"e1_mass_prayer==\"lena\"","text":"The first Sunday, at the 11:30, three pews behind a mantilla, he prayed for a girl whose name he didn’t know. He knows it now. It doesn’t make it easier to know what to ask for. He says a Hail Mary, plain, the one Nonna taught him before he could tie his shoes, and means every word of it for the girl at the other end of the rail.","else":"He doesn’t know what to ask for, so he says a Hail Mary, plain, the one Nonna taught him before he could tie his shoes, and means every word of it for the girl at the other end of the rail."},"When he gets up, she’s still kneeling, her forehead almost on her folded hands, the lace gone still. He leaves her there."],"goto":"s03"},{"text":"“She doesn’t look a day over two thousand.”","tag":"Wit","set":{"e4_shrine":"joke","trait.wit":"+1","rel.lena.warmth":"-1"},"response":["He watches her try. The corner of her mouth goes, the way it does a half second before she takes a man apart for sport — and then nothing comes after it. The laugh doesn’t arrive. She looks almost puzzled that it hasn’t.","“Not today, Youngstown.” She says it kindly. She touches his sleeve once on her way past, barely, with the back of her hand, and goes out the side door into the courtyard with the mantilla still on."],"goto":"s03"}]},"s03":{"slug":"TUESDAY · 9:20 PM · THE ANCHOR, THE DISH PIT","music":"Otis Redding — “(Sittin’ On) The Dock of the Bay”","body":["By 9:20 the dish pit is the whole world, and the world is steam. The Hobart slams its hood down and shakes the duckboards under his shoes; the sprayer kicks in his fist over the slop sink; racks come through the window faster than he can clear them, because Tuesday is half-price chowder and the boats are in. On the transistor over the grill a ballgame goes on low, Vin Scully telling somebody’s grandmother’s life story between pitches as if he has all night, which on the radio he does.","It’s his first shift since Monday’s call — since a recorded woman said *Trumbull Correctional Institution* into a kitchen in Malibu and then his brother said *Professor* — and Jack finds he can’t look at Rudy. He looks at everything else. He looks at the Hobart’s temperature gauge and at the egg dried on the plates and at Rudy’s hands: the spatula going under a patty and over, the rosary inked around the left wrist with its beads gone soft and blue, the Louis L’Amour riding in the apron pocket with its spine taped. He knows those hands pretty well by now. He keeps his eyes off the face above them, and if Rudy has noticed, Rudy hasn’t said.","Gloria comes through the swinging door with a bus tub on her hip and the pencil through her gray bun. “Thursday we’re dark in the kitchen, hon. Hood guys, once a year. Pie and coffee up front. No dishes, no dish man.” She’s gone again before he can answer, which is how Gloria tells you things that are already true. Six hours at eight dollars is forty-eight, plus whatever the tip share comes to on a Thursday, which is next month’s book for Danny and the stamps to send it — and there’s nothing under that to land on, because the one windfall he’s had in California, a hundred of Richard Vance’s dollars, went into a swimming pool in Theo’s jeans.","Through the window he can see a slice of the front: the counter, the pie case, the two chalkboards by the register. PIE OF THE DAY: LEMON MERINGUE. JACK’S RATINGS: MARIONBERRY 4/10. Somebody at the counter feeds the jukebox, and Otis Redding comes on, and toward the end he starts whistling out over the water. Frank told him about that whistle once, in the garage, with the space heater ticking: Otis whistled the fade because he hadn’t worked out what to sing there yet and meant to come back for it, and three days later his plane went into a lake in Wisconsin, and they put the record out with the whistling in. Frank told it like it was a thing a man ought to know about the world, and then he didn’t say anything else for a while.","Rudy slides a ticket down the rail. “Slow for a Tuesday,” he says, with the racks stacked to the window. Rudy holds a door open like that about twice a shift, and Jack has a question in his mouth he can’t put down."],"choices":[{"text":"“Did anybody come see you? At Soledad.”","tag":"Sincerity","cue":"Rudy will remember that.","key":"You asked Rudy who came to see him inside.","set":{"e4_rudy":"asked","trait.sincerity":"+1"},"response":["Rudy keeps turning the burger. He doesn’t look over, and that makes it easier, and Jack has the feeling Rudy knows it does. “My mother. Every other Sunday, six years. Three buses from Oxnard, and three back.” The spatula scrapes the flattop clean. “She brought Louis L’Amour, because they let you have westerns. I guess nobody ever dug a tunnel over a western.” He plates the burger and hits the bell. Then, still not looking up: “Whoever you got — write him. Even when there’s nothing to say. Especially then.”","Jack pulls the spray arm down and goes at the next rack with both hands, and the water drums off the plates and onto his apron, and the steam comes up between the two of them like a curtain somebody had the decency to draw. Rudy goes back to his tickets."],"journal":[{"kind":"person","id":"rudy","title":"Rudy (the Anchor)","text":"Line cook. Rosary on his wrist, a ballgame on the radio, Louis L’Amour in his apron. Did six years at Soledad. His mother came every other Sunday — three buses from Oxnard. Says: write him, even when there’s nothing to say."}],"goto":"s03b"},{"text":"“Was the Soledad dish machine meaner than the Hobart?”","tag":"Wit","set":{"e4_rudy":"hobart","trait.wit":"+1"},"response":["Rudy actually stops, spatula in the air, and gives the Hobart the consideration it’s owed. “Older,” he says. “Hobart’s older.” He flips the patty. “Soledad’s was meaner.” And a laugh comes up out of him from somewhere around his belt, low and unhurried, the laugh of a man who has had a long time to find things funny.","Around eleven a paper boat of fries turns up on the steel by Jack’s station, salted, too hot to touch, on nobody’s ticket. “Dish man eats,” Rudy says, and goes back to Vin Scully."],"goto":"s03b"},{"text":"Keep your head down. Wash.","tag":"Control","set":{"e4_rudy":"head_down","trait.control":"+1"},"response":["So he keeps his head down and washes. An hour of racks: chowder bowls, coffee cups ringed brown, a platter some genius has put a cigarette out on, a high chair’s worth of Cheerios cemented to a tray. The steam does his thinking for him, which is the point of steam.","At midnight Rudy sets a plate at his station — two eggs over easy and rye toast, cut on the diagonal — and taps the steel beside it once with a knuckle. “Dish man eats first,” he says. “Soledad rule.” Jack eats standing up, over the slop sink, and it’s the best thing he’s had since Malibu, and Rudy is back at the flattop before he can say so."],"goto":"s03b"}]},"s03b":{"slug":"WEDNESDAY · 12:38 AM · THE ANCHOR, THE BACK BOOTH","body":["At 12:38 the front of the Anchor is a trucker asleep over his coffee at the counter, the jukebox dark for once, and the back booth. Gloria pushes through the swinging door with a glass of ice water already sweating and puts it in Jack’s wet hand. “Professor from up the hill. He comes in some nights. Take him water. Don’t take his order, he’ll give you a speech.”","Hale is alone in the back booth with the harbor black in the window behind him: the linen jacket, the wine on the cuff, a fresh glass of something brown, and a slice of lemon meringue he hasn’t touched, the meringue weeping little beads of sugar in the warm air. He has gone past drunk into precision: everything he does is slow and complete, a man setting type. He watches Jack come down the aisle in the wet apron with the water glass and identifies him in stages. “Mr. Costigan.” A pause, to enjoy it. “The spaniel washes dishes.”","He lifts his glass an inch off the Formica, an offer. Jack says he’s on till one. “Pity,” says Hale, and seems to mean it for both of them.","Then he turns his head to the window, to the black water and the one red light out on the breakwater, and says it to the glass, not to Jack, in a voice from farther north, coming up underneath:","*With rue my heart is laden / For golden friends I had, / For many a rose-lipt maiden / And many a lightfoot lad.*","He doesn’t go on. The red light on the breakwater blinks, and blinks."],"choices":[{"text":"Finish it: “By brooks too broad for leaping / The lightfoot boys are laid…”","if":"trait.wit>=10","tag":"Wit","set":{"e4_hale":"housman","trait.wit":"+1","rel.hale.warmth":"+1"},"response":["“*By brooks too broad for leaping,*” Jack says, “*the lightfoot boys are laid.*” Hale turns from the window and looks at him — all the way, for the first time tonight. “Who taught a Youngstown boy Housman, darling?” “Mooney. Junior English. Mrs. Pagliarulo.” “God bless Mrs. Pagliarulo.” Then he says the last two lines himself, quietly and exactly, to Jack this time and not the glass: “*The rose-lipt girls are sleeping / In fields where roses fade.*” He holds Jack’s eyes over the rim of his drink until, out at the counter, the trucker wakes up and asks for his check. Then he drinks. “Go home, Mr. Costigan. You’re sober and you’re boring me.”","Jack sets the water down and goes. By the time he comes back out with the bus tub the booth is empty, the meringue is untouched, and there’s a fifty folded under the plate for an eleven-dollar check. Gloria has already walked Hale out to a Marisol Yellow cab idling on the wharf in the fog. She tucks the fifty into her apron without looking at it. “He tips like he’s apologizing,” she says."],"goto":"s04","journal":[{"kind":"person","id":"hale","title":"Prof. Adrian Hale","text":"Wrote *The Consolations of Disbelief*. Wrote me a postcard. Walked into Hollis 302 at 1:07 with wine on his cuff and asked us to prove we have souls. Knew my face from the Anchor before he knew my name. Called me a spaniel. Some nights he drinks alone in the Anchor’s back booth after midnight and says Housman to the window. Tips like he’s apologizing."}]},{"text":"“You should go home, Professor.”","tag":"Candor","set":{"e4_hale":"home","trait.candor":"+1","rel.hale.friction":"+1"},"response":["Hale laughs at that — at *home* — once, and turns his glass a quarter turn on its napkin. “Should I.” It isn’t a question, and he doesn’t wait to see whether Jack will answer it. He drinks. “Go home, Mr. Costigan. You’re sober and you’re boring me.”","Twenty minutes later a Marisol Yellow cab is idling on the wharf with its wipers going against the fog, and Gloria is walking Hale out to it with one hand flat between his shoulder blades, the way you’d walk a tall child to the car. She comes back in holding up a fifty for an eleven-dollar check so Jack can see it through the window. “Every time,” she says. “Tips like h
