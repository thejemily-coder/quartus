s. Fitch says *how lovely*. Across the table Lena looks down at her lemon bar and cuts it into very small pieces. Becca, her back to Jack the whole time, is already asking who wants the corner piece.",{"if":"e6_asked_fall","text":"He takes his plate to the low wall by the olive tree. A minute later Kenzie Rourke sits down at the other end of it and sets a second plate beside him — a burger, potato salad from the dry side. She looks at the courtyard, not at him. “Good question,” she says quietly. “Nobody asks that one.” Then she gets up and goes back to the cake table. Across the courtyard Peter is in a circle of juniors, laughing a little longer than the joke.","else":"He takes his plate to the low wall by the olive tree. Peter Haddad comes by on his way to the cake, humming along with the guitar — *all are welcome, all are welcome* — and claps Jack on the shoulder going past. At the cake table a junior says something, and Peter laughs, and keeps laughing a little after the junior has stopped."},"When the line thins, Osei waves him over to the grill. He turns burgers without saying anything, the fat spitting, the reading glasses down on their cord. “Your grandmother’s Mass is Tuesday at twelve-ten,” he says. “I will say it myself.” He flips one. Then he puts the glasses on and looks at Jack over them, a doctor’s look, unhurried, the look that goes straight past the patient’s account of himself to the chart. “You are carrying something heavier than a trash bag this week.”"],"choices":[{"text":"“My sister. She won a fight this week.”","tag":"Sincerity","set":{"e6_osei":"gina","rel.osei.warmth":"+1","rel.osei.trust":"+1","trait.sincerity":"+1"},"response":["Osei sets the spatula down. “How?”","So Jack tells him, with the grill hissing: a girl at Gina’s school who said something about his brother, in front of the class; and Gina, fifteen, saying his name back to her; and the other girl looking away first. Osei listens as if there were nothing else on the grill.","“Ɛyɛ,” he says at last. “It is well.” He picks up the spatula. “Then we will pray for the other girl too. She will need it more.”"],"goto":"s06b"},{"text":"“Becca’s clipboard.”","tag":"Wit","set":{"e6_osei":"wit","trait.wit":"+1"},"response":["Osei laughs, the tongs held up out of the way. Two of the nursing girls look over from Mrs. Fitch’s table to see what’s funny.","“Ah,” he says, wiping his eye with his wrist. “That too.” And he goes back to the burgers, still smiling at them, and asks Jack whether Ohio people put ketchup on a hot dog, because he has heard terrible things."],"goto":"s06b"},{"text":"“I’m good, Father.”","tag":"Control","set":{"e6_osei":"good","trait.control":"+1"},"response":["“Good,” Osei says. He flips a burger. It lands right where it was. “Tuesday, twelve-ten.”","He slides a cheeseburger onto Jack’s empty plate without asking whether he wants one, and turns to the next person in line."],"goto":"s06b"}]},"s06b":{"slug":"SATURDAY · 3:50 PM · ST. BRENDAN’S COURTYARD, THE OLIVE TREE","body":["The cleanup of the cleanup. The courtyard is down to paper plates in the hedges and a Costco cake with one corner left. The coat-closet door in the church has been shut since three-thirty, a line of four on the bench outside it. Jack and Becca fold the last tables in the shade of the olive tree, his end and her end, the legs snapping in with a sound like a staple gun.","She leans the table against the trunk. Then she says it, with no lead-in, to his face. “I told my mother this was a date. She’s very happy.” She wipes her hands on her jeans. “Was it?”"],"journal":[{"kind":"person","id":"becca","title":"Becca Lindell","text":"Coeur d’Alene. Seven siblings; wants seven or nine kids, odd numbers, for the tiebreaker. Can butcher a deer; has pulled a calf, and it shows. Ran the beach cleanup like a cattle drive and put me on her team. Asked about the scar in the water. Told her mother the cleanup was a date, then asked me if it was. Wants a second. Wrote FRIDAY? on her clipboard."}],"choices":[{"text":"“Yeah. It was.”","tag":"Sincerity","cue":"Becca will remember that.","set":{"e6_becca":"date","rel.becca.heat":"+1","trait.sincerity":"+1"},"key":"Becca asked if the cleanup was a date. You said yes.","response":["Becca smiles, all at once, the sunburn going pinker at the cheekbones. “Good,” she says. “Then I’d like a second one.” And before he can answer: “You can think about it. I’m patient. We had a whole talk.”","He tells her he can’t do Saturday nights; he washes dishes at the Anchor, seven to one. She didn’t know. She turns the clipboard over and writes on the back of it, in big rancher capitals, FRIDAY? — and goes back and adds the question mark again, darker, so he can see it’s a real question. At 4:45 he leaves her stacking chairs, to shower before work, with a paper plate of cake she insisted on."],"goto":"s07"},{"text":"“It was a beach cleanup *and* a date. I’m efficient.”","tag":"Charm","set":{"e6_becca":"both","rel.becca.warmth":"+1","trait.charm":"+1"},"key":"Becca asked if the cleanup was a date. You said it was both.","response":["Becca laughs, surprised into it, one hand on the folded table. “Efficient,” she says. “My dad would like you. My mom would like you more.” Then, still smiling: “I’d like a second one. You can think about it. I’m patient. We had a whole talk.”","He tells her he can’t do Saturday nights; he washes dishes at the Anchor, seven to one. She didn’t know. She turns the clipboard over and writes on the back of it, in big rancher capitals, FRIDAY? — and goes back and adds the question mark again, darker, so he can see it’s a real question. At 4:45 he leaves her stacking chairs, to shower before work, with a paper plate of cake she insisted on."],"goto":"s07"},{"text":"“I don’t know yet.”","tag":"Candor","set":{"e6_becca":"dontknow","rel.becca.trust":"+1","trait.candor":"+1"},"key":"Becca asked if the cleanup was a date. You said you didn’t know yet.","response":["Becca takes that in without flinching, the way she took the condom. “That’s fair,” she says. “Find out. I’ll ask again.” A second. “Actually, I’ll ask now. I’d like a second one. You can think about it. I’m patient. We had a whole talk.”","He tells her he can’t do Saturday nights; he washes dishes at the Anchor, seven to one. She didn’t know. She turns the clipboard over and writes on the back of it, in big rancher capitals, FRIDAY? — and goes back and adds the question mark again, darker, so he can see it’s a real question. At 4:45 he leaves her stacking chairs, to shower before work, with a paper plate of cake she insisted on."],"goto":"s07"},{"text":"“I thought it was a beach cleanup.”","tag":"Control","set":{"e6_becca":"no","rel.becca.trust":"+1","trait.control":"+1"},"key":"Becca asked if the cleanup was a date. You told her you’d thought it was a beach cleanup.","response":["Becca takes it the way she took the condom: without flinching, and with something to do with her hands. She squares the folded table against the trunk. “Okay,” she says. “That’s fair. It *was* a beach cleanup. I just had a nice time at it.” She looks at him, sunburned and entirely unembarrassed. “Then I’ll ask you on a real one sometime, properly, so there’s no confusion. I’m patient. We had a whole talk.”","He tells her he can’t do Saturday nights anyway; he washes dishes at the Anchor, seven to one. She didn’t know. She turns the clipboard over and writes on the back of it, in big rancher capitals, FRIDAY? — and holds it up so he can see. “Hypothetically,” she says. At 4:45 he leaves her stacking chairs, to shower before work, with a paper plate of cake she insisted on."],"goto":"s07"}]},"s07":{"slug":"SATURDAY · 5:10 PM · DELGADO HALL, THE MAILBOXES","body":["The lobby at ten past five smells like the basement laundry has been coming up the elevator shaft all afternoon, sweet and chemical. Marcus is at the front desk behind a yellow highlighter and the organic chemistry book, and he has highlighted so much of the open page that it has gone back to meaning nothing. Jack’s hair is still wet from the fourth-floor shower, and there’s sand in the cuffs of his jeans he’ll be finding till Tuesday. Box 412: a Sigma Rho car-wash flyer, a credit-card offer that calls Theodore A. Vance a valued customer, and an envelope addressed in pencil, block capitals, pressed so hard the letters stand up on the back. In the corner, smaller, the same hand:",{"type":"doc","title":"Envelope, top left corner","text":"DANIEL F. COSTIGAN\nA555218\nTRUMBULL CORRECTIONAL INSTITUTION\nLEAVITTSBURG, OHIO 44430"},"He doesn’t open it in the lobby. He takes the east stairs instead of the elevator, two at a time to four, where the concrete repeats every footstep half a second late, and sits on the top step of the landing under the window that opens six inches. The Lagoon in the slot. One bar on the RAZR. Nobody. He opens the envelope with his thumb.",{"type":"doc","title":"Lined paper, pencil, both sides","text":"Professor —\nYour ocean letter got here Tuesday. Sixty-six degrees, green on top and gray underneath. I read it to Reggie twice. Reggie’s from Portsmouth, he’s seen the Ohio River, he says same thing. Reggie wants to know does the Pacific smell. Find out and report back, that’s an order.\nBrideshead is still in the mailroom. I think a C.O. is reading it. Good for him honestly.\nI called the house tonight and Gina picked up and said everything’s fine. Everything’s fine, Danny. She’s been saying fine since she was four years old, that’s how I know it ain’t. You know what it is. Don’t tell me. Tell Gina it ain’t hers to carry. I got it.\nTell the veil girl thanks for asking my name. Nobody out there asks it anymore. They ask Ma how I’m doing like I’m the weather.\nSend the Hopkins. Ma says it’s poems. Send it anyway.\nMa says you sound skinny on the phone. Eat something.\n—D."},"Maybe that’s what it was. Thursday on the bluff bench the recorded woman came in over his brother at *tell Gina —* and took the rest of the sentence back to Leavittsburg with her. Danny called the house Wednesday night. This was already in the mail.","Out through the six inches of open window the Lagoon is going pewter. Something small and dark — a coot, a grebe; he’s from Youngstown, it’s a duck — draws a line across the water that closes up behind it. Jack keeps his thumb on the fold until the line is gone. Then he folds the letter along Danny’s creases and puts it in his back pocket, flat against Hale’s Williams.","At twenty to six he wedges the RAZR into the top corner of the window frame, where the bar lives, and calls home. Twenty to nine on Glenwood Avenue. His mother picks up on the second ring, the dishwasher going behind her. “Did you eat? Don’t lie, I can hear it.” “Two hot dogs. A priest grilled them.” “A priest,” she repeats, impressed and suspicious at once. Nonna told Father Bruno about the rectory Mass, she reports, in the vestibule after the eight o’clock, where the Iannuccis could hear; Father Bruno says tell him good. Ohio State won. “Your father yelled at the TV, Jackie. In a good way.” Then, in a different voice: “It’s the nineteenth. She lit the candle for Nonno this morning.”","Jack knows what the nineteenth is. Nineteen seventy-seven, a Monday: Sheet & Tube shut the Campbell Works, and Nonno came home before ten with his lunch still in the pail.","A click, the extension in the front room, and the post-game show comes in behind it, two men in sport coats laughing. “Thirty-eight nothing,” his father says. “In Cleveland. You see that?” “I saw it.” He didn’t; he was at a church barbecue with a sprinkler. His father breathes into the phone. “Good. Don’t waste it.” Click.","Then a scuffle at the kitchen end, a chair leg, his mother saying *Regina*, and Gina has the phone. “is the nun’s name a secret —” And his mother has it back. “Nonna wants you.”","The extension in Nonna’s room, three tries, EWTN behind her and a rosary in progress. “Giacomino.” Thin and fierce as a wire. “E la ragazza? The nun?”","So he tells her. The nun painted a fleur-de-lis on his face for the football, and he wore it to Communion by accident. The nun’s team hasn’t lost. The nun said hi to Danny on the telephone, and Danny laughed. Nonna laughs at all of it, the old laugh with the cough on the end, and at the last one she stops and says, “She talk to Danny,” not asking. Then: “Brava. Brava la monaca.”","Then Rosie, thirty seconds, breathless, about the drawing she mailed Tuesday: it’s him at the beach, the orange part is the sun and the other orange part is a crab, and he has to put it on his wall *today*. He promises. Then his mother again — the Iannuccis’ new dog, which is the size of a loaf of bread and hates Frank — and a rustle on the line, and the extension lifting in Nonna’s room. Three tries. The rosary going behind her.","“Giacomino.” The same voice. The same words. “E la ragazza? The nun?”","She’s asking it new. On the kitchen end, his mother has gone quiet."],"journal":[{"kind":"person","id":"danny","title":"Danny","text":"My brother. Trumbull Correctional. Calls me Professor. Ma brought him the good socks. *Brideshead* went to him through Driftwood, margins erased; a C.O. is reading it first. The ocean letter got there; he read it to Reggie, from Portsmouth, who wants to know if the Pacific smells. Lena knows. She asked his name. On the bluff bench she said hi to him and told him she’s going to be defense, and he laughed like he used to. The system cut him off at ‘tell Gina — .’ He wrote the rest down Wednesday night: tell Gina it ain’t hers to carry. He’s got it. Thanked the veil girl for asking his name."}],"choices":[{"text":"Answer her again. The same, like it’s the first time.","tag":"Sincerity","set":{"e6_nonna":"same","soul.grace":"+1","trait.sincerity":"+1"},"key":"When Nonna asked about the girl a second time, you answered her like it was the first.","response":["So he tells it again. The fleur-de-lis, the Communion line, the team that hasn’t lost, Danny laughing — the same jokes in the same order, with the same pauses where she laughed the first time. She laughs in the same places. At the end she says, “Brava. Brava la monaca,” exactly as before, and he says, “I’ll tell her, Nonna,” as if he hadn’t said it five minutes ago.","Then the rustle, and his mother’s voice, close: “She’s tired, honey.”"],"goto":"s07b"},{"text":"“Nonna, you asked me.”","tag":"Candor","set":{"e6_nonna":"asked","trait.candor":"+1"},"response":["A pause with EWTN in it. “So I ask again,” Nonna says. “I’m old, I’m allowed.” She says it fondly, the way she says everything to him, and he can hear in it that she has no idea why he said what he said. Then she wants to know about the girl.","Then the rustle, and his mother’s voice, close: “She’s tired, honey.”"],"goto":"s07b"},{"text":"“Put Ma on.”","tag":"Control","set":{"e6_nonna":"ma","trait.control":"+1"},"response":["He says it gently. It doesn’t take any doing; his mother is already reaching for the phone, he can hear her crossing the kitchen. “She’s tired, honey.”"],"goto":"s07b"}]},"s07b":{"slug":"SATURDAY · 6:02 PM · DELGADO HALL, EAST STAIRWELL, 4TH-FLOOR LANDING","set":{"resolve.jack":"-1"},"body":["He stays on the landing after. The RAZR is warm from his ear and the window frame is cold under his hand, and two floors down somebody has the Black Eyed Peas going behind a door, the song the whole building has been playing for a month, the bass coming up the stairwell a step at a time. He’s due at the Anchor at seven. The Lagoon has gone dark at the edges.","At 6:02 the phone goes again.",{"type":"sms","from":"Gina","text":"whats the nuns name. srsly. nonna says the nun and ma says the veil girl and danny says the veil girl and i need to know what to CALL her","time":"6:02 PM"}],"journal":[{"kind":"note","id":"nonna","title":"Nonna, 8:40 Eastern","text":"Asked me about the girl. Laughed. Five minutes later she asked me again, the same words, like it was the first time. Ma says she’s tired. It’s the nineteenth."}],"choices":[{"text":"Text back: Lena.","tag":"Sincerity","set":{"e6_gina":"lena","e6_gina_name":true,"trait.sincerity":"+1"},"response":[{"type":"sms","from":"Jack","text":"lena","time":"6:03 PM"},{"type":"sms","from":"Gina","text":"lena. ok. tell lena she looks away first too probably","time":"6:04 PM"}],"goto":"s07c"},{"text":"Text back: Sister Magdalena of the Holy Fleur-de-lis.","tag":"Wit","set":{"e6_gina":"sister","trait.wit":"+1"},"response":[{"type":"sms","from":"Jack","text":"sister magdalena of the holy fleur de lis","time":"6:04 PM"},{"type":"sms","from":"Gina","text":"ur so annoying. fine. sister fleur de lis it is","time":"6:04 PM"}],"goto":"s07c"},{"text":"Text back: go do your homework","tag":"Control","set":{"e6_gina":"homework","trait.control":"+1"},"response":[{"type":"sms","from":"Jack","text":"go do ur homework","time":"6:03 PM"},{"type":"sms","from":"Gina","text":"its SATURDAY. ur so old","time":"6:03 PM"}],"goto":"s07c"}]},"s07c":{"slug":"SATURDAY · 11:52 PM · THE ANCHOR","body":["Saturday at the Anchor runs on a different engine from Tuesday. By midnight every booth is Las Olas kids sobering up on hash browns, the Hobart slams its hood every ninety seconds, and the steam has made a weather system of the dish pit that Jack lives inside with his sleeves shoved past the elbow. Somebody in booth six has found the jukebox’s one Mariah Carey and paid to hear it three times.","PIE OF THE DAY, says the chalkboard: KEY LIME. Gloria stops at the pass with the coffee pot and looks back out at booth four, where a boy and a girl in matching Sigma Rho sweatshirts are sharing one slice with two forks and not looking at each other. “Key lime,” she tells Jack, about them. “Looks like a good time, and it’ll make your face do that.” She does the face. It is exactly the face. Then she’s through the door again with the pot.","Rudy has the transistor off tonight — Saturday is too loud for Vin Scully — and a Louis L’Amour in his apron with the spine taped. At ten to twelve, flipping eggs for a table of surfers, he says without turning around, “You wrote him?” “He wrote back.” Rudy nods at the flattop as though the eggs had told him something good. He slides two of them, over easy, onto a plate with rye toast, cut on the diagonal, and sets it on the steel by the Hobart. “Dish man eats.”","At 12:40 the bell over the door, and Rafi Ochoa, skateboard under one arm and a backpack on both shoulders, his hair stiff with salt. He takes a stool at the counter, orders the key lime, and counts exact change onto the Formica. When Jack comes out with a rack of clean mugs, Rafi lifts his fork. “Boss.” His family’s place is two blocks up the hill from the wharf; his abuela’s asleep, and what she doesn’t know about pie can’t hurt her. He looks at the clock over the register. “You off at one? I’ll skate you out as far as Las Olas. I got deliveries on Seacliff.”","At 1:12, mopping under the Hobart, Jack feels the RAZR go off in his apron pocket.",{"type":"sms","from":"Lena","text":"Are you off at one? I’m on the Pi Lam steps. Laney’s staying. I’m sober and I’m the only one. —L.","time":"1:12 AM"}],"choices":[{"text":"Text back: on my way","tag":"Sincerity","set":{"e6_reply":"way","rel.lena.warmth":"+1","trait.sincerity":"+1"},"response":[{"type":"sms","from":"Jack","text":"on my way","time":"1:13 AM"},"He hangs the apron on the hook by the walk-in. Out on the wharf Rafi is already on the board, rolling slow circles under the sodium light with one hand out for La Flaca’s basket."],"goto":"s08"},{"text":"Text back: is this a rescue","tag":"Wit","set":{"e6_reply":"rescue","trait.wit":"+1"},"response":[{"type":"sms","from":"Jack","text":"is this a rescue","time":"1:13 AM"},{"type":"sms","from":"Lena","text":"It’s a request. —L.","time":"1:13 AM"},"Capital letter, period, initial. He hangs up the apron."],"goto":"s08"},{"text":"Don’t text. Ride.","tag":"Control","set":{"e6_reply":"ride","trait.control":"+1"},"response":["He folds the phone and hangs up the apron and has La Flaca off the wharf rail before Gloria can rate his exit. Rafi drops the board, catches the wire basket with one hand going by, and they’re moving."],"goto":"s08"}]},"s08":{"slug":"SUNDAY · 1:26 AM · OCEAN ROAD","body":["La Flaca has no light. She came to him the first week of September with a basket and a chain and a seat that tilts and no light, and for two and a half weeks Jack has ridden Ocean Road home at one in the morning by the white line and memory. Tonight Rafi is behind him on the skateboard with one hand on the wire basket, getting towed, his wheels ticking over every seam in the asphalt. The fog is down to the road. Past the turnoff for St. Brendan’s the Grove starts on the right, the eucalyptus creaking in it and letting go of long strips of bark onto the shoulder.","Headlights come up behind them, slow, and stay slow. Then a light starts turning on the inside of a windshield, red and blue in the fog, and a gray Crown Victoria with no markings and a long antenna eases up level with La Flaca’s back wheel and keeps pace.","The driver’s window comes down. A man in a navy windbreaker leans an elbow out — fifties, by the face; gray in the mustache; a gold badge clipped to his belt that the dome light finds. He holds a badge wallet out the window, open, at reading distance: the shield, and under a photo with more hair, DETECTIVE SERGEANT. “Ray Ochoa. Marisol Police.” He gives Jack time to read it. “License and registration.”","To a bicycle.","Jack stops La Flaca on the coaster brake and puts a foot down. Then, because something has to be done and nothing else occurs to him, he works his wallet out of his back pocket from behind the Williams and Danny’s letter and hands over his Ohio driver’s license. The man takes it. He holds it up into the dome light and reads it like the Gospel. “John Anthony Costigan,” he says. “Youngstown.”","“Pop,” says Rafi, coasting up into the light on the board.","The man doesn’t look at his son. He’s still looking at the license. “I know that board from a quarter mile back, Rafael. I paid for that board.” He’s on call, it turns out, westbound, a car break-in on Del Playa. “It’ll keep. That car’s been getting broken into since 1987.” Then something to Rafi in Spanish, fast and low, of which Jack catches *la luz* and *tu abuela* and nothing else, and Rafi answers in Spanish with both palms up.","Ray turns back. “California Vehicle Code, twenty-one two-oh-one, subsection d. A bicycle operated during darkness shall be equipped with a lamp emitting a white light visible from a distance of three hundred feet in front.” More or less; he recites it flat, in one breath. He looks at La Flaca, at the rust and the basket and the tilted seat. “This bicycle was reported abandoned at the harbor in 2007.”","“Not stolen,” Rafi says. “Abandoned. Abuela says there’s a week’s difference.”","“Your abuela is not a court.” Ray hands the license back through the window, and on the way he takes a better look at Jack’s face. “You’re Gloria’s dish man. Rudy’s kitchen.”","And Jack has him, then: Tuesdays, the far end of the counter, meatloaf and black coffee, a man who nods to Rudy through the pass and never says a word to him."],"choices":[{"text":"“Evening, Officer. It’s a loaner.”","tag":"Charm","if":"trait.charm>=9","set":{"e6_ray":"charm","trait.charm":"+1"},"response":["“Detective,” Ray says, correcting him, warm, almost pleased, and for the first time something in the tired face moves — the mustache, mostly. Rafi, behind Jack, makes a small noise of professional admiration."],"goto":"s08b"},{"text":"“It’s his bike. I don’t have a light. That’s on me.”","tag":"Candor","set":{"e6_ray":"candor","soul.honesty":"+1","trait.candor":"+1"},"response":["Ray looks at him through the window with the dome light on both of them, and keeps looking, until Jack starts to wonder if there’s a form. “Huh,” Ray says finally. Rafi looks at Jack as if he’s done something illegal and beautiful."],"goto":"s08b"},{"text":"“Is this about the light or the bike?”","tag":"Reckless","if":"trait.reckless>=8","set":{"e6_ray":"mouth","trait.reckless":"+1"},"response":["“It’s about your mouth, Mr. Costigan,” Ray says, without heat, as though it were subsection e. Behind Jack, Rafi is delighted and says absolutely nothing, which is its own kind of noise."],"goto":"s08b"},{"text":"Hands on the bars. Say nothing.","tag":"Control","set":{"e6_ray":"quiet","trait.control":"+1"},"response":["Jack keeps his hands on the bars where they can be seen and his mouth shut. Ray considers this. Then, to Rafi, in English: “See that? He knows how to get pulled over. You could learn.”"],"goto":"s08b"}]},"s08b":{"slug":"SUNDAY · 1:34 AM · OCEAN ROAD","set":{"knows_ray":true,"knows_rafi_deals":true},"body":["Ray looks past him, at Rafi, at the backpack on Rafi’s shoulders. “What’s in the bag, Rafael?”","“Vitamins, Pop.”","Ray looks at his son. It goes on long enough for the dash light to come around four or five times on the side of Rafi’s face, red, blue, red. Then he looks away from the bag.","He puts the car in park and gets out, a hand on the door frame for his knees, and walks back to the trunk, and comes back with a clip-on bike light still on its cardboard. “Found property,” he says. “It’s been found.” He bends over La Flaca’s handlebar and clips it on himself, tests the clamp, and clicks it on, and a cone of white light goes out ahead of them into the fog and gives them twenty feet of Ocean Road they didn’t have before.","Back at the car he leans on the roof and looks at Jack. “He selling you anything?” “No, sir.” It’s the truth. Ray nods. Then he looks off down Ocean Road toward the Grove, toward the dark where the road bends. “I’ve picked enough kids up off this road.”","He gets in. The dash light goes off. The Crown Vic pulls ahead, unhurried, toward Del Playa and the car that’s been getting broken into since 1987, and its taillights go small and red in the fog, and then there’s only the fog.","They roll again. Rafi on the board with one hand on the basket, the new light swinging a little on the bars and laying a white path down for them to ride on. After a hundred yards: “Thanks, boss.” And then, though Jack hasn’t asked and wasn’t going to — Rafi is straight about anything that costs money, whatever it is — “Weed. Adderall around midterms. Not bars, though. I don’t do bars anymore.”"],"journal":[{"kind":"person","id":"rafi","title":"Rafi Ochoa (204)","text":"Rafi Ochoa. Second floor. Carried my fridge up four flights and was gone before Dad could tip him. Calls everybody boss. Lent me his bike on the wharf at one in the morning like it was nothing, till Christmas. His father’s a detective. He sells weed, and Adderall around midterms. Not bars, he says."},{"kind":"person","id":"ray","title":"Ray Ochoa (Marisol PD)","text":"Detective Sergeant, per the badge wallet. Rafi’s father. Gray Crown Vic, a windbreaker, the Vehicle Code by heart. Knows my face from the Anchor counter: Tuesdays, meatloaf, a nod to Rudy. Did the bit: ‘License and registration.’ Asked what was in the bag and took ‘vitamins’ for an answer. Gave me a light out of his trunk. Found property."}],"choices":[{"text":"“Your dad’s a cop, Rafi.”","tag":"Candor","set":{"e6_rafi":"cop","trait.candor":"+1"},"response":["“Yeah,” Rafi says. He rides on that, the board humming. “He’s a good one. That’s the problem.”","At the top of Seacliff he lets go of the basket with a little push and peels off west toward the surf rentals and his deliveries. The new light carries Jack the last two blocks to Pi Lam alone."],"goto":"s09"},{"text":"“Is the vitamin a multivitamin.”","tag":"Wit","set":{"e6_rafi":"multi","trait.wit":"+1"},"response":["Rafi grins at the fog. “My abuela says the devil’s patient, so be faster.”","At the top of Seacliff he lets go of the basket with a little push and peels off west toward the surf rentals and his deliveries. The new light carries Jack the last two blocks to Pi Lam alone."],"goto":"s09"},{"text":"Say nothing. Ride.","tag":"Control","set":{"e6_rafi":"quiet","trait.control":"+1"},"response":["Jack rides. A block goes by under the light, then most of another. “Appreciate you, boss,” Rafi says.","At the top of Seacliff he lets go of the basket with a little push and peels off west toward the surf rentals and his deliveries. The new light carries Jack the last two blocks to Pi Lam alone."],"goto":"s09"}]},"s09":{"slug":"SUNDAY · 1:52 AM · SEACLIFF ROAD, PI LAMBDA CHI, THE PORCH STEPS","music":"Kid Cudi — “Day ’n’ Nite”","set":{"resolve.lena":6},"body":["Pi Lambda Chi at ten to two in the morning: the white colonial with the black shutters and the best porch on Seacliff Road, the porch strung with Christmas lights and stacked with hay bales, a bedsheet banner — PI LAM RODEO — sagging off the second-floor rail. Kid Cudi is coming out the open front door, and the bass comes with him, down through the porch boards and the steps and up through the soles of Jack’s shoes. Two Sigma Rho boys in borrowed straw hats are trying to rope a plastic lawn flamingo with a phone charger. The whole house smells of hay, Natty Light and the jasmine on the neighbor’s fence. Jack locks La Flaca to the porch rail and clicks Ray’s light off to save the battery.","Lena is on the bottom step in a blue cotton dress and the oatmeal cardigan, barefoot, the brown Justins standing side by side on the step beside her like two people waiting for a ride. She has a red Solo cup, and when she sees him she lifts it an inch. Water. Proof, or a toast.","Through the doorway he can see the stairs. Laney is going up them, more or less, steered at each elbow by a sister in a bandana, with Sloane Kittredge one step behind, a hand flat between her shoulder blades. The pink hat is gone. There’s hay in Laney’s hair and her mascara has started south and she has never looked more like herself. She finds Jack over the banister. “*FIREMAN.*” The sisters keep steering. “And our next contestant,” Laney informs the stairwell, “is being *carried*, y’all. Miss Congeniality. Hold your applause.” Nobody holds it; two girls on the landing clap. “I’m not a mess, sugar,” she calls down. “I’m a *destination*.” Then her arm comes over the banister, and one finger, aimed at the bottom step. “Take her home, fireman. She’s being a *mother*.” She says it laughing. It comes down the stairs anyway and lands on the step, and Lena looks at the water in her cup. Sloane leans over the rail, kind and entirely final. “We’ve got her,” she tells Lena. “She’s ours now.” Then the landing takes the three of them, and a door upstairs shuts on the music.","Theo is leaning in the doorway in black cashmere with hay all over it. Sloane’s hand was on his arm until she went up the stairs, and then it wasn’t. He looks up the stairwell after them. “I’ll stay,” he says. Then, to Lena, easily, as if it were nothing: “I’m up anyway.”","Lena is on her feet. She gives it to him fast and exact, one item at a time, the way she reads out a citation. “On her side. Not her back — her *side*. Water by the bed, and make her drink half of it before she sleeps. She had one of her pills at eleven — *one*, she says — and vodka after. If her breathing — ”","“I know what to look for,” Theo says. He goes in and takes the stairs two at a time.","Then it’s just the porch light and the hay and the bass in the boards. Lena stands on the step and looks at the empty doorway until the song changes.",{"if":"e6_reply==\"rescue\"","text":"Then she turns around and looks at him. “I said *request*.”"},"She bends and picks the boots up by their pull-straps and doesn’t put them on. “Walk me home, Costigan,” she says. “The long way.” And she turns east."],"choices":[{"text":"Take her boots.","tag":"Sincerity","set":{"e6_porch":"boots","rel.lena.warmth":"+1","trait.sincerity":"+1"},"response":["He holds out his hand. She looks at it, and at him, and gives them over: two old brown Justins, resoled twice, warm from the step and heavier than they look. He hooks both pull-straps over his fingers, and that’s how he carries them, from here on, all the way."],"goto":"s09b"},{"text":"“The long way’s west.”","tag":"Wit","set":{"e6_porch":"west","trait.wit":"+1"},"response":["“Not tonight it isn’t,” Lena says. She is already walking east, the boots swinging from one hand, and he goes after her."],"goto":"s09b"},{"text":"Just walk.","tag":"Control","set":{"e6_porch":"walk","trait.control":"+1"},"response":["He falls in beside her. She swings the boots by their straps as she walks, in time with the bass until the bass is a block behind them, and then in time with the surf coming up at the end of the street."],"goto":"s09b"}]},"s09b":{"slug":"SUNDAY · 2:06 AM · THE BEACH BELOW LAS OLAS","music":"The National — “Slow Show”","body":["The bluff stairs go down from Seacliff below the bench where she said hi to his brother on Thursday: wooden treads with sand on every one, a handrail furred with salt, a hundred-odd steps into the dark. At the bench she puts her hand on the back slat going by. “Hi, bench,” she says, and goes on down. Then the beach. The fog that sat on Ocean Road has pulled back offshore while they weren’t looking. It’s two nights past the new moon and there is no moon at all. The stars go clear down to the water, more of them than Youngstown has ever been allowed, and out past the kelp the whole glow of the town lies smeared orange across the fog bank, which hasn’t made up its mind to come back in. The sand at the wash line is packed hard and cold enough to ache. Lena walks down in the wash, where it’s wettest, and lets the Pacific come up as far as it likes.","At ten past two the train comes along the top of the bluff, right over them, so close the wash shivers around Lena’s ankles. The first number shows up in him on its own, the way it always has. He lets it go by without saying it. Lena’s mouth doesn’t move either. It’s a long train. When the last of it has gone north the surf is suddenly loud, as if somebody turned it back up.","“She has sisters now,” Lena says.","She walks a few more yards. “Thursday she ran across Seacliff to me first. Across the whole street, in a hat, through sixty girls screaming. I watched her pick me out. She’s done my eyeliner every morning since August that I let her. She says I hold a pencil like a nun.” The wash runs up white and slides back. “Tonight she didn’t need anybody to run to. Which is good. Which is what she wanted, and it’s good.” She kicks at the foam. “I’m not her mother.”"],"choices":[{"text":"“She ran to you first. That’s not a Thursday thing.”","tag":"Sincerity","set":{"e6_laney_lena":"first","rel.lena.trust":"+1","trait.sincerity":"+1"},"response":["Lena walks on that for the length of three waves, and when she does say something, it’s about the water. “It’s colder than the Gulf,” she says. “The Gulf in September is a bathtub somebody forgot to drain.” But she’s walking nearer to him than she was."],"goto":"s09c"},{"text":"“She called you a mother because hers is the one she’s scared of.”","tag":"Candor","set":{"e6_laney_lena":"mother","rel.lena.friction":"+1","rel.lena.trust":"+1","trait.candor":"+1"},"response":["Lena stops in the wash. The water goes out around her and pulls the sand from under her, and she lets it. She heard the voicemail too, on Wednesday, on the floor of 217: *Delaney Rose. Posture, sweetheart.* “I know,” she says. “That’s why it worked.” She starts walking again, a step ahead of him. “Don’t be smart about her. Not tonight.”"],"goto":"s09c"},{"text":"“I was adored, sugar. Professionally.”","tag":"Wit","set":{"e6_laney_lena":"adored","rel.lena.warmth":"+1","trait.wit":"+1"},"response":["He does Laney: the Dallas vowels, the hip, one hand on top of a hat that isn’t there. Lena laughs out loud, a bark that goes off down the empty beach and startles something in the kelp, and she points at him. “*Don’t* do her,” she says. “You do her better than I do.”"],"goto":"s09c"}]},"s09c":{"slug":"SUNDAY · 2:18 AM · THE CREEK MOUTH, BELOW THE GROVE","body":["They hear it before they see it: a low, steady tearing in the dark ahead, louder than the surf and nothing like it. Then it’s at their feet — the Lagoon’s outlet coming out from under the Grove, black and moving and full of broken starlight, spread across the beach in a sheet that braids and unbraids on its way to the sea. The air off it is ten degrees colder and smells of eucalyptus and mud. In daylight it’s a creek you’d step over. At a quarter past two with the tide coming in, it’s twenty feet of black water nobody has measured. The noise of it takes over from talking.",{"if":"e6_porch==\"boots\"","text":"Her boots hang from his left hand by their straps.","else":"She has the boots hanging from one wrist by their straps."},"He doesn’t bother with his shoes. They’re Anchor shoes; they’ve been wetter. He rolls his jeans to the shin, and she gathers the blue dress up at the knee in one hand, and the two of them stand on the edge and look at the water. “My daddy says never cross water you can’t see the bottom of,” Lena says. “Then he crosses it. Every time. He has a whole speech about it.” She considers the black water going by. “Mine’s shorter.”"],"choices":[{"text":"Offer your arm.","tag":"Sincerity","set":{"e6_creek":"arm","rel.lena.heat":"+1","resolve.jack":"-1","trait.sincerity":"+1"},"key":"At the creek mouth you offered Lena your arm, and she took it.","response":["He crooks his right arm and holds it out, an usher at a wedding. She looks at it. Then she puts her hand on his forearm, and they go in.","The cold takes him at the shins like a dropped wrench. Her fingers close through the flannel on the first step and don’t let go, and she tests every stone before she trusts it, and halfway over one rolls under her and her grip goes hard, and for two steps all her weight is on his arm and the whole warm side of her is against him — hay, salt, her hair at his jaw — and keeping his arm an arm, not a hand at her waist, is the hardest thing he has done with his body since August. Then the far bank. She lets go. She shakes the creek off one leg like a cat and walks on up the sand."],"goto":"s10"},{"text":"Go first. Don’t look back.","tag":"Control","set":{"e6_creek":"first","soul.restraint":"+1","trait.control":"+1"},"key":"At the creek mouth you went first and didn’t look back. She took your sleeve anyway.","response":["He goes in first. The cold takes him at the shins and climbs. He doesn’t look back; he listens to her come in behind him — the splash, the hiss through her teeth, a word in French that no nun ever taught anybody — and keeps his eyes on the far bank.","Halfway, her fingers close on his sleeve from behind, a fistful of flannel at the elbow, and hold on. Not turning around is harder than the water: to keep facing the dark bank with her hand knotted in his sleeve and her breath at his shoulder blade, and walk, and keep walking. On the far bank she lets go of the sleeve as though she never had it."],"goto":"s10"},{"text":"Offer to carry her across.","if":"trait.reckless>=8","tag":"Reckless","set":{"e6_creek":"carry","rel.lena.friction":"+1","trait.reckless":"+1","resolve.jack":"-1"},"key":"You offered to carry Lena across the creek. She declined, with threats.","response":["“Costigan,” she says, “I *will* drown you in eleven inches of water.”","She wades. He goes in a yard downstream of her to make a point, and the channel shelves off under him and takes him to the knee, and the cold goes up the denim like bad news. On the far bank she reaches out and steadies herself on his shoulder for the one step up out of the soft sand, her whole palm flat on him through the flannel, and he stands as still as a fence post and lets himself be a fence post, and it costs him more than the water did. Then she gets a look at his jeans, black to the knee and streaming, and laughs at them all the way up the beach."],"goto":"s10"}]},"s10":{"slug":"SUNDAY · 2:31 AM · CAMPUS POINT, THE LIFEGUARD TOWER","body":["The lifeguard tower at Campus Point has been closed since Labor Day. It stands up on the sand on its pilings like a shed somebody forgot to take home: a plywood shutter chained across the window, a sun-bleached sign — NO LIFEGUARD ON DUTY — and a wooden ramp down to the beach, where they sit on the splintered gray boards, not touching. The wind off the water works at the shutter, and the chain lets it go an inch and catches it, over and over, a small dry knock behind their heads. Out past the sand the beginner break folds over in the dark, pale where it breaks, and then not.",{"if":"e6_creek==\"carry\"","text":"His jeans squeak when he sits. Lena listens to them with enormous interest. “You *squeak*.” She is nowhere near done enjoying it."},"Her feet are sandy to the ankle and blue at the toes. She works one against the other without much hope. “Sloane Kittredge,” she says, “has a clipboard with Laney’s name on it. In a font.” She digs her heels into the cold sand. “I watched them take her up those stairs. Two at the elbows and one behind. They were good at it. They were *kind*. They knew to turn her on her side before I ever said so. I came out here in August with one friend in the whole state, and tonight a girl in a bandana told me, very nicely, that she’s theirs now. And she is. That’s what pledging is. I just thought it would take till October.” “Theo’s with her.” “Theo’s with her,” she agrees, and her shoulders come down an inch. “Lord. The two of them. She’ll wake up with her hair in a French braid and a three-picture deal.”","She pulls the cardigan down over her knees. Then, conversationally, like a girl reading out a box score: “Becca Lindell told my lemon bar she told her mother.” He waits. “She’s lighting a candle in Coeur d’Alene. There is a woman in Idaho on her knees about you.”",{"if":"e6_alarm==\"notdate\"","text":"“I told you at three in the morning it wasn’t a date,” she says, “and you agreed with me. I’d like to know which of us was wrong.”"},"She looks at him. “Was it?”"],"choices":[{"text":"“It seemed like the right thing to want.”","tag":"Candor","set":{"e6_becca_lena":"right","rel.lena.friction":"+1","rel.lena.trust":"+1","trait.candor":"+1"},"response":[{"if":"e6_becca==\"date\"","text":"“I told her it was,” he says. “This afternoon. Folding tables.”"},"“That’s the worst reason I’ve ever heard,” Lena says, “and I’ve heard you defend the Browns.” Then, lower: “She told a whole table the truth on the first date. In front of Mrs. Fitch. Do you know how rare that is? That’s okra in California.” She looks at him straight. “Don’t be careless with her.”"],"goto":"s10w","key":"Lena asked if the cleanup was a date. You said it seemed like the right thing to want."},{"text":"“She’s lovely. I don’t know what I’m doing.”","tag":"Sincerity","set":{"e6_becca_lena":"lovely","rel.lena.warmth":"+1","trait.sincerity":"+1"},"response":[{"if":"e6_becca==\"date\"","text":"“I told her it was,” he says. “This afternoon. Folding tables.”"},"“She *is* lovely,” Lena says, like a fact she’s checked. “She pulled a calf at twelve and told me about it like it was a recipe.” She works a splinter loose from the ramp and flicks it into the dark. “Then find out what you’re doing. Before she does.” And, plainer: “Don’t be careless with her.”"],"goto":"s10w","key":"Lena asked if the cleanup was a date. You said Becca’s lovely and you don’t know what you’re doing."},{"text":"“It was a beach cleanup. I have it from a reliable source. You.”","tag":"Wit","set":{"e6_becca_lena":"writing","rel.lena.friction":"+1","trait.wit":"+1"},"response":["“I said it wasn’t a date,” Lena says. “I didn’t say I was right.” She looks very satisfied with the dark, and he has nothing, and she waits, very politely, while he looks for something, and doesn’t find it."],"goto":"s10w","if":"e6_becca!=\"date\"","key":"Lena asked if the cleanup was a date. You quoted her own words back at her."}]},"s10b":{"slug":"SUNDAY · 3:08 AM · THE MARINE LAB STAIRS","body":["The Marine Lab sits dark at the foot of the bluff with its back to the sea, and the stairs go up beside it: concrete, a pipe rail beaded wet, a caged bulb on every landing. Behind a steel door on the first landing something electric hums, low and steady — the touch-tank pump, moving the ocean around in the dark for the anemones all night.",{"if":"e6_wes==\"told\"","text":"For the first flight she is formal. “Mind the step, Mr. Costigan.” He minds it. Then the second flight is long, and he has a story, and the comedy wins back half of her before the landing."},"He tells her about Ocean Road, for laughs, because it is one. She makes it as far as *License and registration* — to a *bicycle* — before she has to stop on the step and hold the rail. “And I gave it to him.” “You did *not*.” “My Ohio license. He read it out loud. *John Anthony Costigan. Youngstown.*” And then Rafi coasting up out of the fog on the board: *Pop.*",{"if":"e6_ray==\"mouth\"","text":"“And then I asked him if it was about the light or the bike.” “Oh, you *didn’t*.” “He said it was about my mouth.”"},{"if":"e6_ray==\"candor\"","text":"“I told him it was on me. No light. My fault.” “You did,” she says, as if she’d have bet the house on it."},{"if":"e6_ray==\"charm\"","text":"“I said, *Evening, Officer.*” “Oh, no.” “*Detective*,” Jack says, in the man’s voice, flat as a parking ticket."},{"if":"e6_ray==\"quiet\"","text":"“I put my hands on the bars and didn’t say a word. He told Rafi I know how to get pulled over. He said Rafi could learn.”"},"Her laugh comes back to them off the side of the lab. “What *is* he, Highway Patrol?”","“Rafi’s dad. Detective. Ochoa — like Rafi.”","Her hand goes to the medal at her collarbone. Two steps up, her thumb is still on the worn gold. “Was he kind to you?” she says. It’s a practical question, and she asks it like one.","“He gave me a light. Out of his trunk. *Found property*.” He tells her how the man got out and clipped it to the handlebar himself and clicked it on, white on the fog. “Good,” Lena says, and lets go of the medal.","“Luc’s NOPD,” she says, a flight later. “Three years. He says you can tell everything about a cop by what he keeps in his trunk.” “What does Luc keep?” “Gatorade. A tire iron. A rosary of Mémère’s he has never once taken out of the bag.” She climbs. “He’d like your Ray.”","On the next landing, under the caged bulb, she says, “On Monday you argued like he was in the room.” Not Ray. He knows who she means. “Did you ever find out what he was going to tell Gina?”","The letter is in his back pocket, folded in thirds against the Williams."],"choices":[{"text":"Read her the line about Gina, and the one about her.","tag":"Sincerity","set":{"e6_letter":"read","rel.lena.trust":"+1","trait.sincerity":"+1"},"key":"You read Lena your brother’s letter: ‘Tell Gina it ain’t hers to carry. I got it.’","response":["Under the bulb he takes it out and unfolds it — lined paper, pencil, both sides — and finds the place. “*Tell Gina it ain’t hers to carry. I got it.*” And lower down: “*Tell the veil girl thanks for asking my name. Nobody out there asks it anymore. They ask Ma how I’m doing like I’m the weather.*”","The pump hums behind the steel door. Then Lena says, “He sounds like he’s been the grown-up for a long time.” Jack folds the letter back along its creases, thirds, and puts it away. “Tell him he’s welcome,” she says, and they climb, and behind them the pump keeps on."],"goto":"s10n"},{"text":"Tell her what he wrote about her. Keep Gina’s line.","tag":"Candor","set":{"e6_letter":"her","rel.lena.warmth":"+1","trait.candor":"+1"},"key":"You told Lena your brother thanked her for asking his name.","response":["He leaves the letter where it is. He has the line by heart already. “He says to tell the veil girl thanks for asking his name. *Nobody out there asks it anymore. They ask Ma how I’m doing like I’m the weather.*”","Lena is quiet up three steps. Then: “Tell him he’s welcome.”"],"goto":"s10n"},{"text":"“Yeah. He wrote.” Keep it.","tag":"Control","set":{"e6_letter":"kept","trait.control":"+1"},"key":"You kept Danny’s letter to yourself.","response":["“Yeah,” he says. “He wrote.” And leaves it there.","She doesn’t push. A flight later she asks only, “You okay?” and he says, “Yeah,” and she takes it, for now. He can hear the *for now*."],"goto":"s10n"}]},"s10c":{"slug":"SUNDAY · 3:34 AM · THE LAGOON FOOTPATH, THE BENCH","music":"Wilco feat. Feist — “You and I”","body":["The Lagoon smells like the bottom of a vase: salt and rot and something sweet under both. The footpath runs along the water on packed dirt, and out in the reeds something white moves and resettles — an egret asleep on one leg. Across the water Delgado is a grid of dark windows with one or two still lit. Halfway along the path, under a pepper tree, there’s the bench. It faces the Lagoon. People have carved their initials into the back slat, and in a couple of places somebody has carved them out again.","Lena sits down on it. Jack sits at the other end. There’s a whole person’s worth of bench between them, and he keeps it. He wants to put his arm along the back slat. He wants a great deal more than that, and has since a porch in August, and he sits with his elbows on his knees and looks at the egret.",{"if":"e6_creek==\"arm\"","text":"His right forearm still has the shape of her hand on it, through the flannel, from the creek."},{"if":"e6_creek==\"first\"","text":"There’s a crumple in his flannel sleeve at the elbow where she held on."},"“Laney says this is where people come to break up,” Lena says.","“Are we breaking up?”","“We’d have to be something first, Costigan.”","She says it lightly. The egret settles. She’s already on to the next thing. “Have you read it? Tomorrow’s?”","He has. Mark nine. “Seventeen hours and twenty-six minutes,” Lena says, “not that anybody’s counting.” On the road the disciples argue about which of them is the greatest, and when they get to the house He asks them what they were arguing about on the way, and nobody says a word. “Because they were embarrassed,” Jack says. “Because they were *men*,” Lena says. “Twelve grown men, and not one of them would stand up and say, *Me, Lord. I said me.*” *If anyone wishes to be first, he shall be the last of all and the servant of all.*","“They shouldn’t have wanted it in the first place,” Jack says. “That’s the fall. Augustine. Wanting to be first is the first thing that went wrong.” “Augustine had a mistress and a pear tree. He is not a neutral party.” She turns on the bench to face him, one knee up on the slat. “Thomas puts magnanimity in with the virtues. *Greatness of soul.* Wanting great things, and knowing you’re made for them, and it sits right down next to humility and they don’t fight. Christ doesn’t tell them to quit wanting to be great.” She aims a finger across the water at Delgado, the grid of dark windows. “He tells them what great *is*. They weren’t wrong to want it. They were wrong about what it was. They thought it was a chair, and He went and picked up a child.” Jack has the counter ready — *libido dominandi*, the whole City of God — and she is sitting with one knee up on a bench at twenty to four in the morning with her finger aimed at a dormitory, and he keeps it to himself.","“So who’s last this week?” he says instead.","She holds up a finger. “Laney’s first. Laney has *sisters*.” “Becca’s kids are last,” Jack says. “All seven of them.” “Seven?” “Or nine. Odd numbers. So there’s a tiebreaker.” Lena puts her face in her hands. “Lord have mercy. She’s going to run a parish council out of a farmhouse.”","He looks at the water. “Danny’s last.”","Lena takes her face out of her hands and doesn’t make it into anything; she just says it, as though it’s posted on a sign by the door. “Then he’s first.”","He can’t leave that sitting there, so he gives her Rudy instead. “Rudy’s rule. The dish man eats first.”","“Then go eat something, dish man,” Lena says. “You look like a coat on a hanger.”","At 3:52 Delgado’s basement laundry door is propped open with a folded *Marisol Tide*, RITES OF PASSAGE face up under Margot’s byline, the dryers breathing warm detergent out into the cold.",{"if":"e6_porch==\"boots\"","text":"At the door he gives her back the boots. She takes them by the straps and holds them against her hip."},"The elevator is down here by the vending machines, and it smells of somebody’s pizza. She presses 2. He presses 4. The doors close on the two of them and the car goes up, slow, the cables ticking, and neither of them looks at the other except in the scratched steel of the doors, which shows them anyway: a girl in a cardigan holding a pair of boots, a man with sand on his jeans, standing carefully apart.","At two the car stops. The doors open on the dark second-floor hall, the exit sign red at the far end of it. She steps out. Then she turns around."],"journal":[{"kind":"person","id":"lena","title":"Lena Broussard","text":"New Orleans. Two seventeen. Classics. Hale paired us for the semester. Makes a roux like she’s taking a vow and expects you to keep up. Her father sells Gulf shrimp — Broussard’s Seafood, Banks Street. Boyfriend: Wes Arceneaux — Tulane, civil engineering, the boat at sixteen. Calls at 8:04 on the dot. Her grandmother, Lucille Guidry, died in the storm in ’05; they buried her in November, in the good dress. The medal came back to her mother in a plastic bag. She has never asked her mother one question. The year after, she went to Mass every morning to yell at God, and somewhere in there it stopped being a fight. Paints a mean fleur-de-lis. Said hi to Danny. Says she’s going to be defense. Walked her home the long way from Pi Lam: the beach, the creek, the tower, the Commons, the Lagoon bench. Wes calls from somewhere loud lately; her brother Luc is with him. She’s decided not to notice. Came to Marisol for the money, she says — Notre Dame gave her half. Went to Hale’s office to tell him he was wrong about who gets to forgive."}],"choices":[{"text":"“Goodnight, Magdalena.”","if":"e4_goodnight==\"magdalena\" && trait.sincerity>=25","tag":"Sincerity","cue":"Lena will remember that.","set":{"e6_goodnight":"magdalena","rel.lena.heat":"+1","trait.sincerity":"+1"},"key":"At the elevator you said, “Goodnight, Magdalena.” Twice now.","response":["She holds the boots against her and looks at him from the hall. “That’s twice, Youngstown,” Lena says. “I keep a tin for less.” Then the doors come together on her — the cardigan, the boots, her face last, a line of light, gone — and the car goes on up to four with him in it."],"goto":"s11"},{"text":"“Goodnight, Lena.”","set":{"e6_goodnight":"lena","soul.restraint":"+1","trait.control":"+1"},"response":["“Goodnight, Jack,” she says. The doors slide shut, and the last of her he sees is a cardigan sleeve and a hand coming up, and then the car takes him the rest of the way up."],"goto":"s11","tag":"Control"},{"text":"“Same time next fire alarm.”","tag":"Wit","set":{"e6_goodnight":"alarm","rel.lena.warmth":"+1","trait.wit":"+1"},"response":["“Go to sleep,” she says, smiling. The doors close on the smile, and the car goes up with him and whatever’s left of it."],"goto":"s11"}]},"s10n":{"slug":"SUNDAY · 3:19 AM · THE COMMONS LAWN","body":["The Commons at 3:19 is a whole dark field with nobody on it. The sprinklers have been and gone; the lawn is soaked and cold and shines under the path lamps, and every step on it makes a small wet sound. Ferrer Tower stands over the middle of it, dark in the louvers, the clock face lit and every bell shut up for the night. It quit at ten. It won’t say a word till seven.","The RAZR goes off in his pocket. He tips the screen to the angle where it lights.",{"type":"sms","from":"THEO VANCE (IMPORTANT)","text":"Asleep. On her side, per instructions. Breathing like a Vienna choirboy. Sloane has issued me a pillow shaped like a cowboy boot. —T.V.","time":"3:17 AM"},"He holds it out. Lena reads it and shuts her eyes for one step, then opens them, and walks on easier. “If Sloane gives him a second pillow,” she says, “it’s serious.”","Halfway across, he asks the thing he’s wondered since August. “Why Marisol?”","“Money,” she says. “Notre Dame gave me half. Marisol gave me all of it.” They walk. “The Notre Dame letter was on our refrigerator a month, under a Saints magnet. Daddy took a picture of it with a disposable. Then Marisol’s came, and Mama sat down at the kitchen table with both of them and a calculator, and nobody said anything, and in the morning the Notre Dame one was in the drawer with the takeout menus.” Her hand finds the medal. “My daddy sells shrimp.” The hand comes down. “Why’d you?”","“You know why,” he says. “A.H.” “You came three thousand miles to get yelled at by a man with a leash and no dog.” “He lent me a book.” “He lent you a *book*.” She looks honestly impressed. “He made me buy mine.”","“*Come and say it to my face,*” she says. She read his postcard twice on a porch in August. She says it like she’s read it a hundred times.","“He said you were in his office Friday,” Jack says. “At two.”","She walks a few wet steps. “I went to tell him he was wrong about who gets to forgive.” He waits for the rest of it across twenty yards of grass, and there isn’t any. Then she turns it, neatly: “How’s your nonna?”"],"choices":[{"text":"“She asked me the same question twice. Five minutes apart.”","tag":"Sincerity","set":{"e6_nonna_told":true,"e6_nonna_lena":"told","rel.lena.trust":"+1","trait.sincerity":"+1"},"response":[{"if":"e6_nonna==\"same\"","text":"“I answered her again,” he says. “Same jokes. Same order. She laughed in the same places.”"},{"if":"e6_nonna==\"asked\"","text":"“I told her she’d asked,” he says. “I shouldn’t have.”"},{"if":"e6_nonna==\"ma\"","text":"“I asked for my mother,” he says."},"Lena doesn’t tell him she’s sorry. They walk. “My Mémère’s eighty-eight,” she says. “Breaux Bridge. Half the time now she calls me Claudine — that’s my daddy’s sister, who is sixty-one and sells State Farm in Lafayette — and I answer to it.” She shrugs inside the cardigan. “You answer to whatever name they’ve got left.”"],"goto":"s10c","key":"You told Lena that Nonna asked you the same question twice."},{"text":"“She wants to know if you’re a nun. Officially.”","tag":"Wit","set":{"e6_nonna_lena":"nun","rel.lena.warmth":"+1","trait.wit":"+1"},"response":["Lena gives it real consideration, a hand on her chin, walking. “Tell her I’m considering it,” she says. “Tell her it depends on the pension.”"],"goto":"s10c"},{"text":"“She’s good. Everybody’s good. Ohio State won.”","tag":"Control","set":{"e6_nonna_lena":"good","trait.control":"+1"},"response":["Lena looks at him sidelong across the dark. “‘Good,’” she says. “You said that about your daddy in Malibu, and I let you keep it. Then on a pier you took it back.” They walk a little way on the grass. “I’m keeping a list now.” The Lagoon path starts at the far edge of the lawn, and they take it."],"goto":"s10c"}]},"s10w":{"slug":"SUNDAY · 2:44 AM · CAMPUS POINT, THE LIFEGUARD TOWER","set":{"resolve.lena":5},"body":["She turns it herself.","“Wes missed eight-oh-four.”","“My phone was in my tote in a barn with a mechanical bull in it, and at eight-oh-four it didn’t ring. Eight-thirty, nothing. Nine. I went out and stood by the mailbox on Seacliff like a war bride. At nine-forty it rang. From somewhere loud. Music, a lot of people, my brother Luc in the back yelling something about a cab. He asked how the party was. I said I was the only sober girl in a barn, and he laughed like it was the best news he’d had all day. He said he loved me. Twice.” She picks at the hem of the cardigan. “Once for me, and once like he was checking it still worked.”","Out on the break a set comes through, three in a row, with nobody to ride them.","“He calls from somewhere loud a lot,” she says. “Lately.”","Then, being fair to him: “He’s twenty. The Saints are one and oh and about to be two, and everybody in that whole city is somewhere loud on a Saturday night. Luc’s with him. Luc would tell me.”","She sets her chin on her knees and says it like something she settled before she sat down: “I’ve decided not to notice.”","The chain lets the shutter go, and catches it.","Jack has three things. He’s had them for weeks without knowing he was keeping them, and here they are, all three, in his mouth: a wall post liked from New Orleans in the dead middle of the night, a phone call from a party, a text in capitals from the Dome with the letters missing."],"choices":[{"text":"“You don’t have to be fine with me.”","if":"trait.sincerity>=25","tag":"Sincerity","set":{"e6_wes":"fine","rel.lena.trust":"+1","trait.sincerity":"+1"},"key":"When Lena said she’d decided not to notice, you told her she doesn’t have to be fine with you.","response":["It’s his Ocean Road line, and from her face she knows it. “I know,” Lena says. “That’s the problem, Jack.” Then, quieter: “If I stop being fine with you, I don’t know how I’m supposed to — ” She doesn’t finish."],"goto":"s10b"},{"text":"Tell her what you’ve seen.","if":"trait.candor>=18","tag":"Candor","cue":"Lena will remember that.","set":{"e6_wes":"told","e6_told_wes":true,"rel.lena.trust":"+1","rel.lena.friction":"+2","resolve.jack":"-1","soul.honesty":"+1","trait.candor":"+1"},"key":"You told Lena what you’ve noticed about Wes: the four a.m. like, the party call, the spelling.","response":["So he tells her. Not much, and not dressed up. The first week of school, his wall post, liked from New Orleans at four in the morning Wes’s time. The night before the opener, at the Anchor, a call from a party at two in the morning Wes’s time — *He sounded happy*, she said. Last Sunday, from the Dome, the capitals and the missing letters. He lays the three things down on the boards and stops.","Lena is on her feet before he’s finished. “He was *sixteen*.” Her voice carries; there’s nobody out here to hear it but the tower. “His uncle’s boat. Aluminum, flat-bottomed, a motor you start with a rope. Four days. Gentilly, the edge of the Ninth Ward, people on roofs, people on porches with no water. He took my brother and my sister out a second-floor window next door — Jude and Josie, they were *nine* — one and then the other. He was sixteen years old.” She stands over him on the ramp with her arms wrapped around herself in the cardigan. “He’s a good man. Don’t.”","Then she sits back down, not close, and it’s worse, because it’s quiet. “You noticed,” she says. “Of course you noticed. You notice everything you’re not supposed to.”"],"goto":"s10b"},{"text":"“Okay.”","tag":"Control","set":{"e6_wes":"okay","rel.lena.warmth":"+1","trait.control":"+1"},"key":"When Lena said she’d decided not to notice, you said okay, and let her.","response":["“Okay,” he says.","She waits to see if there’s more, and there isn’t. Then she bumps his arm once with her shoulder, and sits back."],"goto":"s10b"},{"text":"Make a joke about the capitals.","tag":"Wit","set":{"e6_wes":"joke","rel.lena.warmth":"+1","trait.wit":"+1"},"key":"You made a joke about Wes, and Lena asked you not to be funny. You stayed.","response":["“Was Luc yelling in capitals too?”","It’s a good line. It lands on nothing. Lena doesn’t laugh. She turns and looks at him, and her voice is very low. “Don’t. Don’t be funny right now. Just stay.”","So he stays. He sits on the ramp beside her with his hands between his knees while the break comes in pale out of the dark, and he says nothing at all, and he stays."],"goto":"s10b","cue":"Lena will remember that you stayed."},{"text":"Light a Red instead of answering.","if":"trait.reckless>=8","tag":"Reckless","set":{"e6_wes":"red","reliquary":"+1","jack_cigs":"+1","trait.reckless":"+1"},"key":"When Lena talked about Wes, you lit a cigarette instead of answering. She took it.","response":["He doesn’t answer. He gets the Reds out of his back pocket, the pack crushed flat, and lights one with his back to the wind. He gets exactly one drag. Lena reaches over without looking, takes it out of his mouth, puts it out in the sand beside the ramp, and has the Altoids tin out of her cardigan pocket and open before the smoke has cleared. She tears a strip off the bottom of a PI LAM RODEO flyer and writes on her knee by the light of her LG.",{"type":"doc","title":"The Reliquary, slip No. 4","text":"No. 4 · 9/20/09 · Campus Point · in lieu of an answer"},"“That’s four.” She snaps the tin shut."],"goto":"s10b"}]},"s11":{"slug":"SUNDAY · 6:10 AM · DELGADO HALL, ROOM 412","set":{"resolve.jack":"-1"},"body":["He never sleeps. He lies on top of the blanket from a little after four with the Williams on his chest, unopened, sand still in his shoes on the floor, and at 5:40 he gives up and goes down the hall for water.","The fourth-floor lounge is gray and empty, the Zenith dark on its cart. Priya’s laminate from last week is still taped to the whiteboard frame at its angle of struggle, and under it Margot’s capitals have gone up again since Friday night, while he was busy.",{"if":"e6_asked_fall","type":"doc","title":"The 4th-floor whiteboard","text":"USEFUL IDIOTS FOR CHRISTIAN NATIONALISM\nCOSTIGAN | BROUSSARD\n…\nC — Wore three hundred dollars of Vance to it. · 1\nC — Attended a chastity talk. On a Friday night. Voluntarily. · 1\nB — Same. Brought a lemon bar. · 1\nC — Asked the only real question in the room. Deduction. Witnessed. · −1\nKENZIE ROURKE — Eph. 5:25. Better than the text deserves. (Not an idiot. Category pending.)\nTOTAL — C 5 · B 5"},{"if":"!e6_asked_fall","type":"doc","title":"The 4th-floor whiteboard","text":"USEFUL IDIOTS FOR CHRISTIAN NATIONALISM\nCOSTIGAN | BROUSSARD\n…\nC — Wore three hundred dollars of Vance to it. · 1\nC — Attended a chastity talk. On a Friday night. Voluntarily. · 1\nB — Same. Brought a lemon bar. · 1\nKENZIE ROURKE — Eph. 5:25. Better than the text deserves. (Not an idiot. Category pending.)\nTOTAL — C 6 · B 5"},"He drinks the water at the lounge window. Gray light is coming up over the Lagoon, and the water lies flat and gray under it. By six he’s back on his bed.","At ten past six the door opens and Theo comes in barefoot, with sand on his feet and the hems of his good jeans dark and wet to the shin, and hay still caught in the cashmere from the barn. He doesn’t turn the light on. He sits on the edge of his bed and starts picking straw off his sleeve one piece at a time.","“She woke up at four,” he says. Laney. “She asked for a waffle and her mother. Sloane produced a waffle.” He flicks a straw at the wastebasket and misses.",{"if":"e6_fri==\"margot\"","text":"Jack reaches over to the desk and finds Theo’s grandfather’s cufflinks in the half dark by feel, and holds them out across the gap between the beds. Theo looks at them in his palm. “Keep them for the Eagles.” “They’re your grandfather’s.” “He’d have liked the Eagles less.” Jack sets them on Theo’s nightstand anyway."},"Jack is looking at the jeans. Theo answers the look. “I run now,” he says, working at a knot of hay in his cuff. “Four miles. Barefoot. It’s very good for the lymphatic system.”"],"journal":[{"kind":"note","id":"theo_dawn","title":"Theo, before light","text":"Came in barefoot at 5:20, sand and wet jeans. ‘Couldn’t sleep.’ There was a girl in our room. Sunday the 20th, 6:10, wet to the shins and hay on his sweater: he says he runs now. Four miles. Barefoot."},{"kind":"note","id":"whiteboard","title":"The whiteboard","text":"Margot’s, by annexation: USEFUL IDIOTS FOR CHRISTIAN NATIONALISM, COSTIGAN | BROUSSARD. Sully’s made the board: liturgical football, idolatry, my outfit. Margot wasn’t even there when I read it. She didn’t need to be. Now the chastity talk is up there too: both of us, voluntarily. Kenzie Rourke got her own line. Margot thinks she might not be an idiot. Category pending."}],"choices":[{"text":"“You don’t run, Theo.”","tag":"Candor","set":{"e6_theo_run":"candor","trait.candor":"+1"},"response":["“I’ve started,” Theo says. “It’s very freeing. You’d hate it.” He lies back on the comforter in the wet jeans and the cashmere, hay and all, and drags one corner of it over himself.","At 6:30 the window is going from gray to white. Jack lies back with the Williams on his chest, meaning to close his eyes for a minute."],"goto":"s11b"},{"text":"“For the lymphatic system.”","tag":"Wit","set":{"e6_theo_run":"wit","trait.wit":"+1"},"response":["“It has to be *encouraged*, Costigan,” Theo says gravely. “It doesn’t have a pump. Nobody tells you that. The heart gets all the press.” He lies down on top of the comforter, sandy feet and all, and falls asleep in the middle of a sentence about lymph nodes.","At 6:30 the window is going from gray to white. Jack lies back with the Williams on his chest, meaning to close his eyes for a minute."],"goto":"s11b"},{"text":"Say nothing.","tag":"Control","set":{"e6_theo_run":"quiet","rel.theo.trust":"+1","trait.control":"+1"},"response":["Jack says nothing. Theo works the hay out of his sleeve, straw by straw, and the light comes up another shade on the wall. “You walked her home,” Theo says. It isn’t a question, and Jack doesn’t answer it like one.","At 6:30 the window is going from gray to white. Jack lies back with the Williams on his chest, meaning to close his eyes for a minute."],"goto":"s11b"}]},"s11b":{"slug":"SUNDAY · 11:41 AM · DELGADO HALL, ROOM 412","body":["He wakes at 11:41 with Bernard Williams open on his chest and the crease of the spine printed in his cheek. The room is bright. Across the gap Theo is asleep in his clothes, one arm over his eyes, sand on the sheets. The RAZR, on the floor where it fell, has two. One is from Yusuf, who typed his own number into it at the iftar and has never used it till now.",{"type":"sms","from":"YUSUF (9H)","text":"Eid Mubarak. Lunch at the center on Mission at noon. The Abrahamic bloc is invited. Margot declined in writing.","time":"8:02 AM"},{"type":"sms","from":"Lena","text":"Halftime. 17–13. Get up. —L.","time":"11:40 AM"}],"choices":[{"text":"Sully’s. Get up.","tag":"Go","set":{"e6_sun":"sullys"},"goto":"s12a"},{"text":"Mission Street. Eid with Yusuf.","tag":"Go","set":{"e6_sun":"eid"},"goto":"s12b"}]},"s12a":{"slug":"SUNDAY · 12:20 PM · SULLY’S, MISSION STREET","set":{"resolve.jack":"+1","rel.kevin.warmth":"+1"},"body":["He walks out to Seacliff for La Flaca, still locked to the Pi Lam porch rail among the hay bales, and makes it down Mission in twenty minutes with Ray’s light still clipped to the bars, burning uselessly at noon. Sully’s smells of Bloody Mary mix and fryer oil. The Saints are on the big screen in white. Third quarter.","Lena is in the booth under it in her Keds, which means she’s happy, nursing a coffee the size of a flowerpot, on what she announces is three hours of sleep. Kevin is across from her in a 49ers cap with a basket of fries arranged by length. “I drove,” he says. “Designated adult. Also designated alarm clock. She answered the door in one shoe.” “I answered the door,” Lena says, “in a state of grace.”",{"if":"e6_wes==\"told\"","text":"She slides over to make room and says, “Mr. Costigan,” and for a quarter-hour passes him the ketchup by its base. Then the bell wins."},"At the end of the bar, Dale Wisniewski in the Barry Sanders jersey turns on his stool, sees Jack, and lifts his coffee an inch. “The loud one.” Last week Dale left a column of quarters and *next week, kid*. It’s next week. Jack lifts a hand back.","The Eagles have a kid at quarterback, first start, because McNabb’s ribs are cracked, and the kid is throwing it all over Philadelphia and throwing it, every so often, to the Saints. He has missed the best of it, and Dale tells it to him anyway: the Eagles’ return man coughed up the kickoff to open the half, and two plays later the Saints were in the end zone, and the owner rang the brass bell with his whole shoulder, and Lena stood up on the booth seat with her coffee held out level so as not to lose any. Kevin confirms the coffee. “The kid’s going to be good,” Dale says of the Eagles quarterback. “You said that about the Lions kid,” Jack says. “I say it about all of them,” says Dale. “One of them’s going to be.”",{"if":"e6_creek==\"carry\"","text":"At a commercial she leans across the table, very serious. “How are your jeans?” “Hanging out the window of 412.” “Like a flag.” “Theo thinks it’s a surrender.” She returns to her coffee, satisfied, and Kevin looks from one of them to the other and eats a fry with enormous discretion.","else":"At a commercial she props her chin on her fist and looks at him across the fries. “I found half the beach in my bed this morning.” “Which half?” “The half with the egrets in it.” She returns to her coffee, satisfied, and Kevin looks from one of them to the other and eats a fry with enormous discretion."},"At 12:30 the RAZR goes in his pocket.",{"type":"sms","from":"YUSUF (9H)","text":"Eid Mubarak to the Catholics. I can eat lunch. I’m going to eat it twice.","time":"12:30 PM"},"In the fourth the Saints are far enough ahead that Lena has started being gracious about Philadelphia, and then Brees fumbles the ball out of his own end zone for a safety, and she takes it personally. She sits down. “Y’all,” she tells Kevin, “I have been betrayed before God and the Commonwealth of Pennsylvania.” Reggie Bush answers for it a few minutes later, nineteen yards, and she stands back up and forgives everybody.","Final, forty-eight to twenty-two. Dale raps the table going out and leaves quarters. In the lot Lena wipes 1–0 off the Odyssey’s back glass with the hem of her cardigan, digs the La Vang car-wash polish out of her tote, and writes it big: 2–0. Kevin, keys out: “Still my mom’s car.” Lena caps the bottle and pats the glass like a horse. “Your mother’s car,” she says, “is undefeated.”"],"next":"s13"},"s12b":{"slug":"SUNDAY · 12:15 PM · ISLAMIC CENTER OF MARISOL, MISSION STREET","set":{"resolve.jack":"+1"},"body":["KESSLER SHOES is still ghosted in gold over the door, but under it the storefront has put on its Eid best: paper garlands in green and gold looped across the window, a hand-lettered EID MUBARAK taped to the glass, and inside, the wire shoe racks overflowing onto the sidewalk — men’s loafers, a pair of patent-leather Mary Janes, small sneakers that light up when a kid runs past them, which is constantly. Jack unlaces his boots. He checked his socks before he left Delgado. No holes. Yusuf, at the door, glances down at them anyway. “Progress,” he says.","He’s in a new kurta, pale gray with white thread at the collar, mailed from Fremont by his mother in a box that also contained, he reports, three pounds of dates and a letter about his hair. The folding tables along the back wall are buried: rice in foil pans, kebabs, bolani, a bowl of chickpeas the size of a birdbath, and a steel pot of sheer khurma, vermicelli in sweet milk with cardamom and dates and slivered pistachio, which a grandmother ladles into a paper cup and puts into Jack’s hands without asking his name. Kids in new clothes do laps between the tables. The uncle in the Raiders cap is here, in a better Raiders cap.","“Twenty-nine days,” Yusuf says, loading a plate. “I can eat lunch.” He adds a second kebab. “I’m going to eat it twice.”","At twenty to one his phone goes, and his whole face changes before he’s even got it to his ear. He takes it out onto the sidewalk among the shoes. Through the window Jack watches him walk up and down past the laundromat in his socks, one hand flat on his head. He comes back in five minutes later, lighter by about a hundred pounds. “Tariq,” he says. “It’s ten past midnight there. It’s tomorrow.” He sits down. “He complained about the food. He’s fine.”","Over the second lunch, he explains zakat al-fitr, because Jack asks what the coffee can by the door with the slot in the lid is for. Before the Eid prayer, every household pays for food for the poor — so much per head, babies included. “You pay the poorest man’s breakfast before you’re allowed to pray for yours,” Yusuf says. “So nobody is hungry on the day.” He tears a piece of bolani in half and hands Jack the bigger piece, which Jack is beginning to understand is not an accident. “Load-bearing. You take it out, the feast falls down.”","At 1:16 the RAZR goes.",{"type":"sms","from":"Lena","text":"2–0. I slept through the first quarter on Dale’s shoulder. Tell no one. —L.","time":"1:16 PM"},"Jack shows Yusuf, because he can’t not. Yusuf reads it and hands the phone back and returns to his chickpeas. “Who’s Dale?” “A Lions fan.” Yusuf nods, as if this explains a great deal about the Catholic Church."],"next":"s13"},"s13":{"slug":"SUNDAY · 9:00 PM · ST. BRENDAN’S, THE COLLEGE MASS","set":{"resolve.lena":7,"resolve.jack":"+1","soul.grace":"+1"},"body":["At ten to nine the courtyard is full of people in hoodies and the broken sprinkler under the olive tree is hissing at the hedge. In the lot beyond it, under the one lamp, the Odyssey’s back glass says 2–0 in big careful white.",{"if":"e6_sun==\"eid\"","text":"It’s the first he’s seen of it. She wrote the dash with a flourish."},"Kevin is at the church door in the navy quarter-zip, handing out worship aids like a maître d’. “Browns lost, man,” he says, by way of hello. “Twenty-seven six.” He gives Jack a worship aid and a consoling squeeze of the shoulder, and Jack takes both.","The college Mass is standing room again: candles, the overheads off, the blue glass black, the hull of the ceiling going up into the dark over everybody. Three guitars and the cajón. Joey Abruzzo gets up to lector for the first time in his life and reads Wisdom loud enough to carry across the Staten Island Ferry in a gale. *Let us see whether his words be true.* In the second pew Kevin sits forward with his elbows on his knees, and his lips are moving along with every word. Then Kenzie Rourke cantors the psalm — *The Lord upholds my life* — and her voice goes up into the ribs of the boat and hangs. Then James, and one line out of it Jack hears and keeps: *You covet but do not possess.*","Then Mark. The road through Galilee, and the Twelve behind Him, arguing.","Osei preaches from the step with the reading glasses on their cord. “On the road they argued about who was the greatest,” he says. “In the house He asked them what they had been talking about, and they were silent.” He looks out at them over the glasses. “Every one of us has been silent in that house.” And he sits.","Laney is between them. She came in at 8:58 hungover and pink, in her new Pi Lam letters under Lena’s oatmeal cardigan, sunglasses pushed up into the copper hair, and sat down in the middle without discussing it, and now she sits through the Eucharistic Prayer with her eyes shut and her hands folded like she’s seen it done. At the Our Father she takes Lena’s hand and squeezes it, and doesn’t let go of it after the Amen.","At the sign of peace she turns to Lena first. “I’m sorry I called you a mother.” Lena looks at her, at the sunglasses and the letters and the cardigan, which is hers. “Cher,” she says. “Somebody has to be.” Then Laney turns and shakes Jack’s hand with both of hers and great dignity, and over the top of her head Lena gives him her hand, too.","At Communion Laney goes up between them with her arms crossed over the Pi Lam letters for the blessing, the way she did at her first, like a Baptist, and comes back with her eyes down and her mouth closed tight on something that isn’t a joke.","During the recessional Becca Lindell turns around, two rows up across the aisle — she did it at the peace, too — and waves at him with her whole hand, the whole arm going, a rancher’s wave across a pasture."],"journal":[{"kind":"person","id":"laney","title":"Laney Price","text":"Laney Price. Pi Lam, as of Thursday: ran back across Seacliff in a pink cowboy hat to Lena first. The night before, on the floor of 217 in a white dress, she asked what happens if they look at her and see. First Cat
