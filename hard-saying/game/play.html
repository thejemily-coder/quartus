e sand a cross, an arrow, and JACKS CHURCH. He’ll tape it over his desk tonight. For now he holds it on his knee on the fourth-floor landing of the east stairwell, where the one bar lives, while somebody a floor down smokes a clove and the stairwell fills with it.","His father answers, which never happens. He made it home last night. The guy in Flagstaff says hello; Jack lets him. Then there’s a pause with the garage in it — the space heater ticking though it’s September, the radio low on the workbench — and Frank says, as if he’s carried it across half the country looking for a place to set it down: “Good grip. Saturday.” The handshake. Jack looks at his own hand. “Thanks, Dad.” “How’s the pelican?”","He remembers. Of course he remembers. “She’s in my philosophy class.” A mile of silence, then two thousand more. “What’d I tell you. Costigans don’t get the easy ones.”","Behind his father the radio says the name before Frank does. WKBN: Jim Traficant walked out of federal prison this morning in Rochester, Minnesota, in a gray T-shirt and white knee socks and folded himself into a cab, and the whole Valley watched him do it. “They’re throwing him a party,” Frank says. “Twenty bucks a ticket. Skinny ties and bell-bottoms.” Not proud, exactly; next door to proud. “A crook. But he was our crook.” “He took bribes, Dad.” “He took them for *us*.” Jack opens his mouth, and Frank says, “Here’s your mother.”","“What did you have for dinner?” “Chicken.” “What kind of chicken?” “Dining hall.” “Jackie. Dining hall is where it happened to the chicken.” She has already told the whole school office he’s coming for Thanksgiving. “And the veil girl?” “Ma.” “I’m allowed to ask. I’m your mother, it’s in the Catechism.”","Then the click and fumble of the extension in Nonna’s room, three tries, EWTN murmuring behind her. “Giacomino.” It’s the voice she uses on saints who are running late. “Primo venerdì. This Friday. You go *and* you go” — which in Nonna means Mass and confession both — and she hangs up on herself by accident.","Gina gets hold of the kitchen phone long enough to say, in exactly the voice she texts in, flat and lowercase with no punctuation anywhere, “nonna thinks california is in mexico i didnt correct her bye,” and is gone.","Then it’s his father again, clearing his throat, which for Frank is the sound of a phone call ending. There’s just room, before he hangs up, to tell him about the Anchor."],"choices":[{"text":"Tell him about the job.","tag":"Sincerity","set":{"e2_dad_call":"told","e2_told_dad_job":true,"trait.sincerity":"+1","soul.honesty":"+1","resolve.jack":"+1"},"key":"You told your father you’d taken a job washing dishes.","response":["“I got a job, Dad. Washing dishes. A diner on the harbor, nights.” A long pause. He can hear the radio in it, and the space heater, and his father breathing. “Good,” Frank says. “Work.” Another pause. “Don’t let it eat the reading.” It’s the most his father has said about his future since the driveway."],"goto":"s11b"},{"text":"Don’t. He’d say you’re there to study — and he’d drive back out to say it.","tag":"Control","set":{"e2_dad_call":"hid","trait.control":"+1","soul.honesty":"-1"},"response":["So Jack doesn’t. He lets his father keep believing whatever lets him sleep, the same way his father keeps the guy in Flagstaff for his mother."],"goto":"s11b"},{"text":"“I’m interning in the restaurant industry.”","tag":"Wit","set":{"e2_dad_call":"joked","trait.wit":"+1","soul.honesty":"-1"},"response":["“Don’t get smart.” Frank lets it go. Jack lets it go. The job stays where it is, unsaid, a pan left in the sink to soak."],"goto":"s11b"}]},"s11b":{"slug":"WEDNESDAY · 6:40 PM · DELGADO HALL, EAST STAIRWELL, 4TH FLOOR LANDING","set":{"e2_wrote_danny":true},"body":["“You write your brother yet?” his father says, at the end. “Doing it now.” “He reads ’em twice.” And the line goes dead the way it always does with Frank, no goodbye, as though goodbye were a waste of long distance. Jack doesn’t go back to the room. He stays on the landing with a yellow pad against his knee, under a fluorescent tube that buzzes and flickers and refuses to die, and writes the way he always writes to Danny: fast, no drafts, before he can turn it into anything.",{"type":"doc","text":"Danny —\n\nThe ocean is real. It’s cold, which nobody tells you.\n\nMy roommate owns a silk robe and an espresso machine and I’m not allowed to touch either. The professor drinks at lunch and is better than his book, which I’m not telling him.\n\nI wash dishes now, Tuesday Thursday Saturday, a machine called Hobart that hates me. The cook’s name is Rudy. He reads Louis L’Amour and calls me mijo.\n\nThere’s a girl from New Orleans in my seminar who argues like a prosecutor and wins like one.\n\nDon’t. I know.\n\n—the Professor"},{"if":"e2_dad_call==\"hid\"","text":"Under the signature, smaller, he adds: *P.S. Dad doesn’t know about the dishes.* He looks at that line for a while and leaves it."},"He addresses the envelope from memory. He doesn’t seal it until he’s read the letter twice, the way Danny will. Then he presses the flap shut with the side of his fist and puts it in the inside pocket of Danny’s jacket, where it crackles when he breathes. Through the six-inch window the fog is coming in over the Grove. It’s nearly seven, and he has somewhere to be at eight."],"next":"s12"},"s12":{"slug":"WEDNESDAY · 8:02 PM · ST. BRENDAN’S, NEWMAN HOUSE LOUNGE","body":["He chains La Flaca to the Newman house railing at 8:01, the letter to Danny crackling in the jacket’s inside pocket; he’ll mail it tomorrow. The lounge smells of burnt coffee: a plaid couch from 1994 that sags like a hammock, a ping-pong table with a dead net, a shelf of donated books — three copies of *Mere Christianity* and one *Da Vinci Code* wearing a Post-it in the looping hand of a woman who has graded a great many spelling tests: *Read CRITICALLY. —D. Fitch.* Fr. Osei’s rubber boots stand by the door, still damp, as if they’ve just stepped out of him.","At a folding table a girl is lettering a poster with her tongue between her teeth — NEWMAN WELCOME BBQ & BEACH CLEANUP — SATURDAY, SEPTEMBER 19 — and the second B is listing badly to port. Sunburn along the part in her hair, a braid as thick as a bell rope, forearms that have done things to hay. She holds out a hand with marker on every knuckle. “Becca. Lindell. Coeur d’Alene, Idaho — it’s a lake, people think it’s a cheese. Homeschooled. Seven siblings. A ranch.” She regards the poster as though it has personally let her down. “I can butcher a deer, but I can’t letter a poster, so this is humbling.”","Joey Abruzzo is helping, which in Joey’s case means a Yankees cap, masking tape worn as a bracelet, and volume. “JACK. Jack, we’re making a *list*.” Becca mentions her roommate is coming, a nursing major from Spokane. Joey lowers the RSVP sheet. “I’m going to be a priest,” he says, with tremendous dignity. “Is she single? I’m asking for the *seating chart*.” “It’s a beach, Joey. There’s no seating chart.” Joey considers this. “Then what am I asking for?”","Becca puts a Sharpie in Jack’s hand. “You letter. You have very Catholic-school handwriting.” “You haven’t seen my handwriting.” “I can tell from how you stand.” So he does the second poster in the Palmer method the sisters put into his wrist, every capital leaning the same way, and Becca watches the S in SEPTEMBER come out right and makes a small sound of grief. Then, bent over the beach umbrella she has been failing to draw for ten minutes, not looking up: “Do you have a girlfriend?” Joey stops taping. Becca adds a stripe to the umbrella. “For the seating chart.”"],"journal":[{"kind":"person","id":"becca","title":"Becca (Newman)","text":"Coeur d’Alene. Seven siblings. Can butcher a deer. Running the Sept 19 BBQ like a cattle drive. Asked if I had a girlfriend. For the seating chart."}],"choices":[{"text":"“Put me down.”","tag":"Charm","set":{"e2_becca":"yes","trait.charm":"+1","rel.becca.warmth":"+1"},"response":["Becca writes JACK C. on the list in letters a little too neat. She adds a smiley face. Then she crosses out the smiley face, twice. Joey says, “*Wow*.”"],"goto":"s12f"},{"text":"“I work Saturday nights. The day, sure.”","tag":"Candor","set":{"e2_becca":"days","trait.candor":"+1","rel.becca.trust":"+1"},"response":["“A working man,” Becca says, and gives him one short nod, a rancher’s nod. “My dad would like you.” She means it as information, not flirtation. He’s almost sure. She writes JACK C. (DAYS) and underlines DAYS."],"goto":"s12f"},{"text":"“Is there a seating chart?”","tag":"Wit","set":{"e2_becca":"maybe","trait.wit":"+1","rel.becca.warmth":"+1"},"response":["“There is now,” Becca says, and draws a rectangle on the back of the RSVP sheet with enormous authority. Joey leans in. “Put me next to anyone with a pulse and a rosary.” She writes JOEY in one corner, very small, as far from everyone as the paper allows."],"goto":"s12f"}]},"s12a":{"slug":"WEDNESDAY · 8:10 PM · ST. BRENDAN’S, THE CONFESSIONAL","set":{"resolve.jack":"+2","soul.grace":"+1","rel.osei.trust":"+1"},"body":["“My nonna sent me,” Jack says at the closet door; it seems only fair to name the responsible party. “First Friday’s this week.” Osei nods gravely. “Then we are both under orders.” He goes in first. After a moment his voice says, “Come.”","It used to be a coat closet, and under the lemon polish there’s still an old smell of wool and mothballs, fifty years of winters Marisol never had. A kneeler with cracked maroon vinyl; a folding chair beside it, so you can choose. A linen screen on a wooden frame with a lamp behind it, so that Osei is a shape and not a face. Jack kneels. He always kneels. The chair creaks; there’s the small business of a man arranging a leg that doesn’t fold the way it used to; then just his breathing, unhurried, the patience of somebody who used to listen to chests for a living.","“Bless me, Father, for I have sinned. It’s been — ” He says how long. Then he talks.","The vinyl is cold through his jeans, and then it isn’t. He holds his own hands the way he has since he was seven, thumbs crossed. The St. Michael medal swings out of his collar when he leans in. On Ocean Road a car goes by with a song in it, and is gone. Behind the linen Osei says nothing; he listens the way the closet does, with the whole room. It takes as long as it takes.","When Jack is finished, the shape behind the screen leans closer. “God is not a customs officer, Jack,” Osei says. “He is not looking for what you failed to declare. He is waiting at the door with the car running.” For a penance, a decade of the rosary — “any decade; I am not particular, and neither is He” — “and call your grandmother. The sisters who taught me arithmetic in Kumasi were Italian. I know who outranks me.”","Jack says the Act of Contrition, every word where he left it. On the linen the shadow of a hand lifts. “God, the Father of mercies, through the death and resurrection of his Son has reconciled the world to himself and sent the Holy Spirit among us for the forgiveness of sins; through the ministry of the Church may God give you pardon and peace, and I absolve you from your sins in the name of the Father, and of the Son, and of the Holy Spirit.” “Amen.” “Give thanks to the Lord, for he is good.” “His mercy endures forever.”",{"type":"break"},"In the courtyard the sprinkler is still hissing at the flower bed. Jack stands under the olive tree with his hands in his brother’s pockets and feels — *light* is the only word, and it’s the wrong word, and it’s the one there is. Hale would have it in pieces in four minutes, and Lena would supply the article number. He doesn’t try. He stands in it a while.","He says the decade on La Flaca on the way home, a Hail Mary every few dozen turns of the pedals. On the eighth, by the Grove, a skunk walks out onto the bike path as if it has an appointment, and Jack swerves into the ice plant — *Holy Mary, Mother of God* — and the skunk, unbothered, finishes crossing at the stately pace of a monsignor in a procession. Jack picks up where he left off. He doesn’t lose count."],"next":"s13"},"s12b":{"slug":"WEDNESDAY · 8:10 PM · ST. BRENDAN’S, FR. OSEI’S OFFICE","music":"E.T. Mensah & the Tempos — “All for You”","set":{"resolve.jack":"+1"},"body":["Fr. Osei’s office is the size of a parking space, and he has filled it with sound: a silver stereo on the filing cabinet plays highlife at a volume the neighbors would have opinions about, horns as bright as new doorknobs, a guitar circling one figure like a man dancing with somebody’s aunt at a wedding. Books stacked sideways on books. A stethoscope on a hook, as though he might still be paged. One desk drawer stands open, and in it a framed photograph lies face down, felt backing to the ceiling. The chessboard sits on the blotter: an old wooden set, the white queen’s bishop chipped at the miter.","“E.T. Mensah and the Tempos,” Osei says, easing into his chair and the left leg out under the desk. “The king of highlife. My father played this record until you could read the newspaper through it.” He turns the board so the white pieces face Jack. “White moves first. I like to see what a man does with an advantage.” What Jack does with it is bring his queen out on the fourth move, like a guy starting something in a parking lot. “Ah,” says Osei, pleased. “Youngstown.” He plays slowly and wins slowly, and Jack has the strong impression he is being allowed to think it’s close.","Osei nods at the *Spe Salvi* in Jack’s back pocket, the holy card sticking out of it, so Jack tells him between moves: the theologian-pope, Regensburg, a man who writes as if you can keep up and won’t slow down if you can’t. Osei listens with his chin on his fist. “A shy man,” he says, “made to stand on a balcony. I like him for that.” He takes a knight. “And Youngstown. You told me it was sadder than Springsteen says. Better pierogi. I have been thinking about these pierogi since Sunday.” “Potato and cheese. Old ladies in church basements make nine thousand of them every Lent.” “And they are good?” “They’re the only reason the Valley still has a population.” Osei writes something on an envelope. Jack is fairly sure it says *pierogi*.","Osei moves a pawn and nods at the Carhartt hanging off the back of Jack’s chair, too big in the shoulders even with nobody in it. “That is a serious coat, for a place that isn’t cold.” “It’s my brother’s.” “He let you take it?” “He’s not using it right now.”","Jack takes the pawn. Then he’s talking: about Hale, who called him a spaniel in front of the whole seminar; about Theo’s espresso machine, which has its own typed sign and better health insurance than Frank; about the Hobart, which is possessed, and could Osei look into that, professionally; about Gloria, who rates human beings like pie. Osei laughs at the Hobart and the pie. After the fourth thing he turns a knight in his fingers a while, sets it down on a square that ends something, and says, mildly, without looking up: “In Kumasi we say the man laughing loudest at a funeral is usually one of the ones carrying the coffin.” On the stereo the trumpet climbs and climbs and doesn’t come down."],"journal":[{"kind":"person","id":"osei","title":"Fr. Gabriel Osei","text":"Newman chaplain. Kumasi, Ghana. Used to be a doctor. Limps and doesn’t mention it. Plays chess like he’s got all night and highlife like the neighbors owe him money. Told me a proverb about funerals. I laughed. That was apparently the point."}],"choices":[{"text":"One more joke. “Is that a real proverb, or did you make it up just now?”","tag":"Wit","set":{"e2_osei_q":"joke","trait.wit":"+1","rel.osei.warmth":"+1"},"response":["Osei laughs from the belly, the glasses jumping on their cord. “In Kumasi we say a proverb is only a joke that has paid its taxes.” He moves his bishop. Mate in four. He folds his hands on his stomach and lets Jack find it."],"goto":"s13"},{"text":"“Yeah.” Just that.","tag":"Sincerity","set":{"e2_osei_q":"yeah","trait.sincerity":"+1","rel.osei.trust":"+1","soul.honesty":"+1"},"response":["Osei doesn’t push. He resets the board, piece by piece. “Next Wednesday, then,” he says. “Bring your brother’s jacket. It plays better chess than you do.” And then, to the board or to Jack: “Ɛyɛ.”"],"goto":"s13"},{"text":"Turn it around: “What happened to your leg, Father?”","tag":"Candor","if":"trait.candor>=4","set":{"e2_osei_q":"limp","e2_asked_limp":true,"trait.candor":"+1","rel.osei.trust":"+1","rel.osei.warmth":"+1"},"cue":"Fr. Osei will remember that.","response":["Osei smiles, not offended in the least, as if Jack has finally made a move worth the board. “A long story,” he says. “You tell me yours, one day, and I’ll tell you mine.” Without looking, he closes the open drawer with his knee."],"goto":"s13"}]},"s12f":{"slug":"WEDNESDAY · 8:09 PM · ST. BRENDAN’S, NEWMAN HOUSE HALLWAY","body":["At the end of the hallway a door stands half open on a highlife guitar going around and around like it has nowhere better to be. Across from it, printer paper is taped to the coat-closet door: CONFESSIONS WED 8:00 — KNOCK. Underneath, in pencil, somebody has added *(gently)*.","Jack came because an eighty-four-year-old woman in Ohio told him to. Fr. Osei leans in his doorway, reading glasses on their cord, sleeves rolled, as if he has been expecting the next person and it happens to be Jack. “Mr. Costigan.” He tips his head at the closet door. Then, over his shoulder, at the chessboard on his desk, the pieces set up and waiting. “The box, or the board?”"],"choices":[{"text":"“The box.”","tag":"Go","set":{"e2_osei":"box"},"key":"You went to confession on Wednesday night.","goto":"s12a"},{"text":"“The board.”","tag":"Go","set":{"e2_osei":"board"},"key":"You played chess with Fr. Osei instead of going to confession.","goto":"s12b"}]},"s13":{"slug":"THURSDAY · 12:10 PM · ST. BRENDAN’S","set":{"resolve.lena":8,"resolve.jack":"+1"},"body":["Danny’s letter goes into the blue mailbox on Ocean Road with a tin clank, and Jack goes in out of the noon glare. St. Brendan’s is cool and smells of beeswax. Fifteen people in a church built for six hundred, scattered under the upside-down hull of the roof like survivors of a wreck who’d rather not crowd each other.","Mrs. Fitch, with a Tupperware of lemon bars on the pew beside her like a guest she brought. An old man with a cane, praying or asleep; at his age it may be the same skill. Becca from last night, fingers still blue from poster marker. And Kevin Tran in a navy quarter-zip, who has saved Jack a seat by laying his Bible on it, the spine gone soft, tabbed in four colors. “Saw you on the steps. Figured.”","Three rows up is Lena: the oatmeal cardigan over a yellow sundress, bare-headed today, her hair twisted up with a pencil through it. Jack spends the entrance antiphon not looking at the back of her neck, and does about as well at it as he does at most things he attempts in church.",{"if":"e2_osei==\"box\"","text":"Last night is still on him. He keeps expecting it to wear off. It keeps not.","else":"Through the open sacristy door Fr. Osei, halfway into a white chasuble, catches Jack’s eye and moves an invisible knight."},"White, for Gregory the Great. Mrs. Fitch reads Colossians in a voice meant for a much fuller church: “…giving thanks to the Father, who has made you fit to share in the inheritance of the holy ones in light.” *Inheritance.* Jack hears it in Yorkshire-under-Oxford and has to look at his shoes.","Then Luke, and the boats. *Master, we have worked hard all night and have caught nothing* — a working man’s line, tired and put out and doing it anyway. The nets fill and tear. And Simon Peter goes down on his knees in all that thrashing silver and says: *Depart from me, Lord, for I am a sinful man.*","For the homily Osei comes down into the aisle with his weight on the good leg, like a man at a bus stop who has news. “Peter tells Jesus to go away because he is a sinner. Jesus does not argue with him. He gives him a job.” He lets it sit in the cool air. “And Gregory, whose day it is, did not want his job either. He begged the emperor to let him off. The emperor said no.” The laugh lines deepen. “In my experience, God also usually says no.” He sits. The homily was shorter than the Gospel.","Jack is still turning *He gives him a job* over through the offertory and the bells.","Lena goes before the recessional with a Greek grammar under her arm, genuflecting fast, the cardigan sliding off one shoulder, and is out the side door into the glare. “Greek at one,” Kevin murmurs. “My lab partner’s in it. She sits in front and corrects the TA.”",{"type":"break"},"At Anacapa Commons Kevin goes through the salad bar like a pharmacist filling a prescription — grilled chicken, egg whites, spinach — and sighs at the waffle line. He takes a paper boat of fries “for morale” and doesn’t touch them.","His BlackBerry buzzes face-up on the tray: MẸ. He sits up straighter for a woman two hundred miles north. “Dạ, Mẹ. Dạ… dạ… dạ.” Then, smooth as a hotel front desk: “Con học rồi.” He hangs up. “Told her I already studied. Gen chem. AP credit — she thinks it covers orgo.” He spears an egg white. “The book’s still in the shrink-wrap. My sister’s at UOP, dental school. Tina. Four-point-oh. Flossed in the womb.” “A dentist,” Jack says. Kevin grins, the big floor-meeting grin. “Told you she’d kill me.”","Then he points a forkful of egg white across the table. “Respectfully, bro. You stared at her through the whole Gospel on Sunday. Today you stared at her through *Colossians*, which nobody does. She has a boyfriend. It’s on her Facebook. Everybody checked.” “Everybody?” “Doug checked.” He chews. “I’m just saying. As your designated adult.”","Behind them Theo drifts past with a tray holding a single espresso and half a grapefruit, a man between engagements. “Tran.” “Vance.” Theo lifts the grapefruit to Jack in salute and keeps walking, and Kevin goes back to his chicken."],"journal":[{"kind":"person","id":"kevin","title":"Kevin Tran","text":"Kevin Tran. Goes to daily Mass, saves you a seat with a Bible. Has a sister, Tina, in dental school, who flossed in the womb. Lies to his mom about orgo in Vietnamese."}],"choices":[{"text":"Ask about his family.","tag":"Sincerity","set":{"e2_kevin_q":"family","trait.sincerity":"+1","rel.kevin.trust":"+1"},"response":["“What are they like? Your parents.” Kevin sets his fork down and for a second doesn’t pick it back up. “My parents came on a boat,” he says. “I don’t get to have a bad semester.”","Then it’s folded up and put away, and he’s leaning across the table with real urgency. “Wait. Does Ohio have In-N-Out?” “No.” “Then what do you people *eat*?” “Pierogi. Sorrow.” “Bro,” Kevin says, “that’s a cry for help.”"],"goto":"s14"},{"text":"Match his dad jokes: “Why did the pre-med cross the road?”","tag":"Wit","set":{"e2_kevin_q":"jokes","trait.wit":"+1","rel.kevin.warmth":"+1"},"response":["Kevin doesn’t blink. “To shadow a surgeon on the other side.” He lights up like a scoreboard. “What do you call a philosophy major in four years?” “Go on.” “*Waiter.*” “How many Thomists does it take to change a lightbulb?” “How many?” “*Distinguo.*” Kevin has no idea what it means and wheezes anyway, openly, both palms flat on the table.","They keep it up, two grown men being terrible on purpose, until the girl at the next table picks up her tray and her calculus and relocates to another zip code."],"goto":"s14"},{"text":"“What’s with you and Theo?”","tag":"Candor","if":"trait.candor>=4","set":{"e2_kevin_q":"theo","e2_asked_kevin_theo":true,"trait.candor":"+1","rel.kevin.friction":"+1"},"response":["“Nothing,” Kevin says, before Jack has finished asking. “Met him at the floor meeting. Same as you.” He pushes the paper boat of fries across the table. “You want these? I only take them for morale.”"],"goto":"s14"}]},"s14":{"slug":"THURSDAY · 4:00 PM · HOLLIS HALL, ROOM 108","body":["Hollis 108 is a basement with one window, at exactly ankle height to the world, so the hour comes with a parade of feet: Keds, flip-flops, a dog that stops, considers the window, and moves on. Eighteen desks. Dry-erase marker and somebody’s orange.","The TA writes his name on the board in square capitals — EVAN MARSH — and under it, smaller: *office hours: when I’m not finishing.* He’s lanky and gray at the temples, though he can’t be much past thirty, with wire glasses and a stained tan Carhartt over the back of his chair. On the desk, a bike helmet and a pack of American Spirits, the yellow kind.","Jack knows him. It takes a second, and then it doesn’t take anything: the glasses, the gray, the bike. The man at the end of the Lighthouse driveway on Saturday night, smoking in the dark, watching the house and not going in. Evan Marsh takes attendance with his eyes, and they go over Jack the way they go over everybody: once, and on.",{"if":"e2_lena_jab","text":"At 4:01 Lena stops dead in the doorway with a Greek grammar against her chest. Her face finds him and goes polite. “Mr. Costigan. You’re in *this* section.” A breath. “Of course you are.”","else":"At 4:01 Lena stops dead in the doorway with a Greek grammar against her chest. “You’re in *this* section?” She shuts her eyes briefly, a woman taking up her schedule with a higher power. “Of course you’re in this section.”"},"She sits one desk away from him, which in a room of eighteen is a kind of diplomacy.","Evan sits on the front edge of the desk. “Professor Hale asks his freshmen to prove they have a soul.” Somewhere up near Canada, flat and exact. “I want something harder. Suppose you found out tonight that you don’t. Kierkegaard says purity of heart is to will one thing — so tell me what your one thing is. What would it cost you?”","A girl by the window in a Marisol Surf hoodie says, going red, that she thinks she’d be relieved. Nobody keeping score. Evan doesn’t smile and doesn’t correct her. “That’s honest. Kierkegaard would say you just told me what you’re afraid of. Keep it.” She looks like somebody handed her a coat.","A Sigma Rho kid with his visor on backwards tips his chair onto two legs. “Nothing, bro. I’d still be me.” “Then nothing you’ve ever done was done by anybody,” Evan says pleasantly. “Your mother raised a complicated puddle. Serious people believe that. They don’t say *bro* while they believe it. They lose sleep.” The kid turns it over. “Thanks, man,” he says, and means it.","Lena doesn’t raise her hand. She waits until the room is quiet enough to deserve it, and then she answers like a closing argument, each sentence laid on the one before. “Everything I love would turn into chemistry. My mother’s kitchen. My brothers. The Saints. Receptors and salt. And here’s the problem: I’d still love it, exactly the same. Only it would be a fact about *me*, not about any of them. Love would be a climate I have, with nobody on the other end of it.” She sits back. “That’s what it would cost. Everybody.”","Evan’s eyes come to Jack. Jack hadn’t planned to say anything, and then he does, quietly, with no time to make it funny. “Everything I’ve done since I was sixteen would just be stuff a body did. Nobody to answer for it.” He hears it land in the low room and keeps going. “That sounds like relief. It isn’t.”","Evan looks at the two of them a second longer than he has looked at anybody, then turns back to the window girl and asks what exactly she meant by *score*.",{"type":"break"},"At ten to five the Hollis steps are warm as a griddle and empty except for Evan, lighting an American Spirit off a Bic with his hand cupped against the wind off the Commons. Lena has gone back in for her pen."],"journal":[{"kind":"person","id":"evan","title":"Evan Marsh (TA)","text":"Thursday section, Hollis 108. Kierkegaard. Kind to the scared ones, murder on the lazy ones. Smokes American Spirits. Rides a bike."},{"kind":"note","id":"driveway","title":"The guy at the end of the driveway","text":"The guy at the end of the driveway is my TA."}],"choices":[{"text":"“I saw you Saturday. End of the driveway at the Lighthouse.”","tag":"Candor","key":"You told Evan you’d seen him at the end of the Lighthouse driveway.","set":{"e2_evan_q":"lighthouse","e2_evan_lighthouse":true,"trait.candor":"+1","rel.evan.friction":"+1"},"response":["Evan doesn’t look at him right away. He takes a pull on the cigarette and lets the smoke go — a pause long enough to smoke in, and he smokes in it. “I ride out that way,” he says. “I don’t go to parties. I’m twenty-nine.” Then, still to the Commons: “Who’d you go with?”","“My roommate dragged me.”","Evan nods. He asks nothing else. He grinds the cigarette out under his heel, clips on the helmet, and goes down to the rack, and Jack watches him ride off across the grass, upright and unhurried."],"journal":[{"kind":"note","id":"driveway","title":"The guy at the end of the driveway","text":"The guy at the end of the driveway is my TA. Says he doesn’t go to parties. Asked who I went with. Nothing else."}],"goto":"s15"},{"text":"Keep it to yourself.","tag":"Control","set":{"e2_evan_q":"quiet","trait.control":"+1"},"response":["Jack says nothing. Evan finishes the cigarette in no hurry at all. “Good answer in there,” he says — about the section, not looking at him. “Don’t get used to it.” He goes down to the rack and unlocks his bike."],"goto":"s15"},{"text":"Bum a cigarette: “American Spirit. You *are* a grad student.”","tag":"Wit","if":"trait.wit>=4","set":{"e2_evan_q":"cigarette","jack_cigs":"+1","trait.wit":"+1","rel.evan.warmth":"+1"},"response":["Evan shakes one out without comment and lights it for him, the Bic cupped between both their hands against the wind. It burns slower than a Marlboro and tastes like burnt toast and good intentions. The two of them stand on the steps of a philosophy building smoking and saying nothing, which seems to be how Evan likes his company. “They’re not better for you,” he says finally. “People think they are.” Then he clips on the helmet and rides off across the grass."],"goto":"s15"}]},"s15":{"slug":"THURSDAY · 4:58 PM · HOLLIS HALL, FRONT STEPS","music":"Dirty Projectors — “Two Doves”","set":{"resolve.lena":7},"body":["By five the light over the Commons has gone long and gold, and past the lawn the sea has gone to hammered brass. The bougainvillea has been letting go on the Hollis steps all afternoon, so Jack sits in a drift of magenta like somebody a flower girl gave up on.","Lena comes out with her pen and sits two steps above him, because she likes the height. Yesterday, across Hale’s oak, they slid their pages at each other without eye contact, like a hostage exchange. This is the first he’s seen of what she did to his.",{"if":"e2_lena_jab","text":"“Mr. Costigan.” She holds it out between two fingers. “Your paper.”","else":"“Costigan.” She holds it out between two fingers. “Your paper. Brace yourself.”"},{"type":"doc","title":"“That Faith Is Not an Inheritance” — J. Costigan","text":"Professor Hale says my faith is an address. Fine: I was baptized at St. Brigid’s before I could object. But an inheritance is something you can refuse, and nobody refuses a thing they’ve never had to pick back up. Pascal tells the man who can’t believe to do what believers do — holy water, Masses — and belief will come: *cela vous abêtira*. Hale reads that as proof that faith is a habit. I read it as proof that faith is a decision you keep making with your knees until your head catches up. I didn’t stay because I was told to. I stayed because I tried the door.\n\nIN RED, IN THE MARGINS —\nbeside “nobody refuses a thing they’ve never had to pick back up”: NO.\nbeside the Pascal: You quoted Pascal at me. I taught you Pascal on Sunday. *Cite me.*\nunder the last line: This sentence is lying and you know it."},"He laughs out loud. “You quoted Pascal at me *once*.” “On the Lord’s Day, in front of God and a coffee urn. That’s a lecture. I’ll expect a footnote.” He reads his last line again, the one with the door in it, and finds he doesn’t want to fight her on it, and can’t decide whether that counts as losing. From the way she watches him read, she knows it too.","He hands hers back.",{"type":"doc","title":"“That the Body Is Not a Rental” — M. Broussard","text":"Descartes parked the body at the curb with the keys in it, and we act surprised that nobody brings it back with a full tank. Aquinas won’t let us off so easy: the soul is the form of the body, so there is no *me* standing safely behind my skin, lending it out. What is done to the body is done to the person, every time. That is why the Creed says the resurrection of the *body* and not of some tasteful vapor. The objection from injury — that a body can be broken and the person goes on — I will take up next week. For now: a thing that can be wounded is *someone*. Hotels don’t bleed.\n\nIN RED, IN THE MARGINS, HIS HAND —\nacross the top: This is the best paragraph I’ve read this year. I hate it.\nbeside “I will take up next week”: Coward.\nunder “Hotels don’t bleed”: Okay, fine."},{"if":"e2_lena_jab","text":"She reads his red aloud, perfectly courteous, like a hostess reading out a toast somebody else wrote.","else":"She reads his red aloud in her Ohio voice, the flat one she’s been working on since Saturday."},"“‘This is the best paragraph I’ve read this year. I hate it.’ It’s the third of September.” “It’s been a long year.” “And *coward*? Next to my deferral?” “It was a deferral.” “It was a *promise*. I keep mine.” She finds *Okay, fine* under her last line and doesn’t read that one aloud. She looks at it for a while, though, with the pen between her teeth.","Down on the Commons a dog goes after a Frisbee with its entire life. Lena folds her paper in half, creases it with a thumbnail, and says, to the sea more than to him: “You heard me Sunday. On the stairs.”","“Medals off,” Jack says.","She almost smiles. “I don’t like a thing sitting on a table between two people where nobody will touch it. It goes bad.” She holds the folded paper flat on her knees against the breeze. “His name is Wes. Wesley Arceneaux. Tulane, civil engineering. He wants to build the walls right.” She says *the walls* the way Jack’s father says *the plant*, as if there has only ever been the one.","“In the storm he took his uncle’s boat out. He was sixteen. Four days, back and forth, pulling people off roofs.” She tells it like a tide table: the age, the days, the boat. Then she looks out at the Commons with her chin up and lets him have it.",{"if":"e2_lena_jab","text":"Even for this, she doesn’t take the *Mister* off him."}],"choices":[{"text":"“He sounds like a good man.”","tag":"Control","key":"You told Lena her boyfriend sounded like a good man.","set":{"e2_wes_reply":"generous","trait.control":"+1","rel.lena.trust":"+1","rel.lena.heat":"-1"},"response":["She looks at him like she’s revising a grade upward and resents having to. “He is,” she says. Then, quieter, to the paper on her knees: “He is.”"],"goto":"s15b"},{"text":"“So I’m up against a man with a boat.”","tag":"Wit","key":"You told Lena you were up against a man with a boat.","set":{"e2_wes_reply":"wry","trait.wit":"+1","rel.lena.heat":"+1","rel.lena.friction":"+1"},"response":[{"if":"e2_lena_jab","text":"“You’re not up against anybody, Mr. Costigan.”","else":"“You’re not up against anybody, Youngstown.”"},"“I know,” he says, lightly. Then he finds the dog on the Commons very interesting."],"goto":"s15b"},{"text":"“Good. I was starting to worry you had bad taste.”","tag":"Candor","key":"You told Lena you’d been worried she had bad taste.","set":{"e2_wes_reply":"honest","trait.candor":"+1","rel.lena.trust":"+1","rel.lena.friction":"+1"},"response":[{"if":"e2_lena_jab","text":"“My taste is impeccable, Mr. Costigan. Ask anyone. Ask the boots.”","else":"“My taste is impeccable. Ask anyone. Ask the boots.”"},"She stretches one brown Justin down onto his step for inspection: resoled twice, scuffed pale at the toe, a boot that has been to Mass and to Jazz Fest and possibly to war."],"goto":"s15b"},{"text":"“What I said Monday was cheap. I’m sorry.”","tag":"Sincerity","if":"e2_lena_jab","key":"You apologized to Lena for what you said in Hale’s seminar.","set":{"e2_wes_reply":"apology","e2_apologized":true,"trait.sincerity":"+1","soul.honesty":"+1","rel.lena.trust":"+1","rel.lena.friction":"-1"},"response":["He says it and stops there, and she takes it the way she’d take a correction to a citation: looks at it, checks it, accepts it. “Noted.”","Above them the carillon works through the quarter hour. A minute goes by with nothing in it but gulls. Then, to the sea: “It *was* cheap, Costigan.” The surname is back. The formality is gone."],"goto":"s15b"}]},"s15b":{"slug":"THURSDAY · 5:41 PM · HOLLIS HALL, FRONT STEPS","body":["The carillon fumbles the three-quarter chime, and Jack finds the Marlboros in his hand, the pack turning over under his thumb.",{"if":"e2_evan_q==\"cigarette\"","text":"Lena leans down from her step and sniffs at his collar without apology. “You smell like a barn.” She sits back, appalled. “You’re cheating on Marlboro *already*?”","else":"Lena watches the pack. She doesn’t say anything. She has a pocket for this."}],"choices":[{"text":"Light it.","tag":"Reckless","set":{"e2_cig_lena":"lit","reliquary":"+1","jack_cigs":"+1","trait.reckless":"+1","soul.restraint":"-1"},"response":["He gets one drag, the good one that goes all the way down, before she leans from her step and takes it out of his mouth with two fingers. Second time; she’s practiced now. She stubs it out on the stone beside her boot, reaches into the cardigan pocket, and comes out with the first one: Saturday’s, bent and a little flattened, still there. Laney wore this cardigan to a fire alarm; if she felt the lump in the pocket, she didn’t say. Lena holds the two of them together on her open palm like a pair of relics. “I’m going to need a container.”","At six she stands. Laney needs her for Friday: “She’s ironing a dress that cost more than my first car, and she has never ironed *anything*.”",{"if":"e2_lena_jab && !e2_apologized","text":"“Mr. Costigan,” she says, by way of goodbye, with a nod you could level a shelf by.","else":"“Wednesday,” she says, by way of goodbye. “Bring a red pen you’re not afraid of.”"},"Then she’s out across the Commons with her shadow going on ahead of her. He wants her. He says it to himself plainly, because she’d know if he dressed it up. She has someone, a good someone with a boat, and Jack is going to sit here until the wanting is something he can carry three miles on a bicycle. Halfway across she pulls the cardigan closed against a wind that isn’t there yet. By the far edge of the lawn the gold has her."],"goto":"s16"},{"text":"Put it back unlit.","tag":"Control","set":{"e2_cig_lena":"pocketed","trait.control":"+1","soul.restraint":"+1","resolve.jack":"+1"},"response":["He puts the pack back in his jacket and zips the pocket shut for good measure. “Tapering?” she says. “Like a saint.” She pats the cardigan pocket anyway, twice; he can see the small bent shape of Saturday’s through the knit. “When you slip — and you will — I’m going to need a container.”","At six she stands. Laney needs her for Friday: “She’s ironing a dress that cost more than my first car, and she has never ironed *anything*.”",{"if":"e2_lena_jab && !e2_apologized","text":"“Mr. Costigan,” she says, by way of goodbye, with a nod you could level a shelf by.","else":"“Wednesday,” she says, by way of goodbye. “Bring a red pen you’re not afraid of.”"},"Then she’s out across the Commons with her shadow going on ahead of her. He wants her. He says it to himself plainly, because she’d know if he dressed it up. She has someone, a good someone with a boat, and Jack is going to sit here until the wanting is something he can carry three miles on a bicycle. Halfway across she pulls the cardigan closed against a wind that isn’t there yet. By the far edge of the lawn the gold has her."],"goto":"s16"},{"text":"Hold out the whole pack: “Save us both the trouble.”","tag":"Charm","set":{"e2_cig_lena":"offered","trait.charm":"+1","rel.lena.warmth":"+1"},"response":["She pushes it back at him, flat against his chest, and lets go so he has to catch it. “Oh, no. I collect them one at a time, off your face. Where’s the sport?” Then she looks down at her cardigan pocket, where Saturday’s is still riding, and does some arithmetic. “Although at this rate I’m going to need a container.”","At six she stands. Laney needs her for Friday: “She’s ironing a dress that cost more than my first car, and she has never ironed *anything*.”",{"if":"e2_lena_jab && !e2_apologized","text":"“Mr. Costigan,” she says, by way of goodbye, with a nod you could level a shelf by.","else":"“Wednesday,” she says, by way of goodbye. “Bring a red pen you’re not afraid of.”"},"Then she’s out across the Commons with her shadow going on ahead of her. He wants her. He says it to himself plainly, because she’d know if he dressed it up. She has someone, a good someone with a boat, and Jack is going to sit here until the wanting is something he can carry three miles on a bicycle. Halfway across she pulls the cardigan closed against a wind that isn’t there yet. By the far edge of the lawn the gold has her."],"goto":"s16"}]},"s16":{"slug":"FRIDAY · 1:52 AM · DELGADO HALL, ROOM 412","body":["By 1:52 La Flaca is chained to the radiator pipe in the fourth-floor hall, where Priya will have something to say about it in laminate by breakfast, and Jack is at his desk in the dark with his hands still pruned from the Hobart and boysenberry under his nails that no soap in Delgado is going to reach. The secondhand Dell’s fan whines.","He friend-requested her on Tuesday. She accepted at 1:37 Wednesday morning, because of course she was up. He hasn’t looked at her page since. He looks now. It loads the way everything loads on the Dell, in installments, as if it has to be talked into each part.",{"type":"fb","name":"Magdalena Broussard","text":"In a Relationship with Wesley Arceneaux","meta":"Marisol · Classics ’13 · New Orleans, LA"},"Her photos. He tells himself this is research. February, St. Charles Avenue, a wall of people under a sky of thrown beads: Lena on a stepladder above the crowd, purple and gold to the elbows, both arms up and her mouth open on a shout. Holding the ladder steady with both hands and laughing up at her, a tall sunburned guy in a number nine Brees jersey, who isn’t watching the parade at all.","Her wall. Laney, inevitably:",{"type":"fb","name":"Laney Price","text":"MAGDALENA. THE JELLO SHOTS ARE STILL SENTIENT.","meta":"Wednesday at 2:14am · 4 people like this"},"And somebody named Tess Fontenot, who writes *mama* like a job title:",{"type":"fb","name":"Tess Fontenot","text":"call mama she says u didnt call","meta":"Thursday at 6:02pm"},"The name in the relationship line is a link. He clicks it, and Wes Arceneaux’s page assembles itself: the same sunburned guy, squinting into some other sun, and under his name the latest thing he’s told the world.",{"type":"fb","name":"Wes Arceneaux","text":"is so tired of reading about the Army Corps of Engineers.","meta":"Thursday at 9:52pm"},"He backs out to his own home page, as if that’s where he lives. In the right-hand column, under PEOPLE YOU MAY KNOW, there’s a candle where a face should be.",{"type":"fb","name":"Nora Calloway","text":"1 mutual friend: Priya Raman","meta":"People You May Know · Add as Friend"},"He knows the name. It’s on the brass plate under the votives at St. Brendan’s.","Across the room Theo is awake too, propped against the headboard with his earbuds in and the MacBook lighting his face from below, watching another film with subtitles. He doesn’t look over. Neither does Jack."],"journal":[{"kind":"person","id":"lena","title":"Lena Broussard","text":"Lena Broussard. New Orleans. Two seventeen. Classics. Hale paired us for the semester. Boyfriend: Wes Arceneaux — Tulane, civil engineering, took a boat out in the storm at sixteen. It’s on Facebook. Everybody checked. I checked."}],"choices":[{"text":"Click the candle.","tag":"Sincerity","set":{"e2_fb":"nora","trait.sincerity":"+1"},"response":["Her page is mostly bare. Selma High School. Marisol. No pictures but the candle. And a wall that runs from April into August, all of it family, plain and unbearable:",{"type":"fb","name":"Mateo Calloway","text":"happy early bday sis. 8 days.","meta":"Monday at 9:40pm"},"And from an aunt, in Spanish:",{"type":"fb","name":"Graciela Gutiérrez","text":"Mija, tu abuelita te prende una vela cada mañana. Te queremos para siempre.","meta":"August 15 at 7:02pm"},"Rafi’s abuela gets him *abuelita*. Four years of Latin get him *siempre*. It’s plenty. He closes the laptop and sits in the dark with his hand flat on the lid."],"journal":[{"kind":"clue","id":"candle","title":"A candle where a face should be","text":"Nora Calloway. One mutual friend: Priya. The name on the plaque under the candles at St. Brendan’s. Her brother wished her an early happy birthday. Eight days."}],"goto":"s17"},{"text":"Go back to Wes. Look at his photos.","tag":"Candor","set":{"e2_fb":"wes","trait.candor":"+1"},"response":["Wes Arceneaux, one photo at a time. A crawfish boil on a folding table in somebody’s driveway, newspaper spread, a red mountain steaming in the middle. A fleur-de-lis inked on a calf. A Jesuit High lacrosse team, rows of boys squinting into the sun, and him in the back row, a head taller than the rest. The same easy grin in every frame, as if a camera were just another friend who’d shown up. Jack looks for something to dislike, can’t find it, and dislikes that."],"journal":[{"kind":"person","id":"wes","title":"Wes Arceneaux","text":"Tulane, civil engineering. Took his uncle’s boat out in the storm at sixteen. Crawfish, lacrosse, a fleur-de-lis on his calf. I looked for something to hate. Nothing."}],"goto":"s17"},{"text":"Write on her wall: “Bus fare: $1.25. Interest accrues. —Youngstown”","tag":"Reckless","key":"You wrote on Lena’s wall at two in the morning.","set":{"e2_fb":"wall","trait.reckless":"+1","rel.lena.heat":"+1","rel.lena.friction":"+1"},"response":["He types it before the better part of him can get its shoes on.",{"type":"fb","name":"Jack Costigan","text":"Bus fare: $1.25. Interest accrues. —Youngstown","meta":"about a minute ago · Wes Arceneaux likes this."},"The Dell’s clock says 1:58.","At 2:03:",{"type":"fb","name":"Magdalena Broussard","text":"Interest is usury, Mr. Costigan. Look it up. Aquinas.","meta":"2:03am","if":"e2_lena_jab && !e2_apologized"},{"type":"fb","name":"Magdalena Broussard","text":"Interest is usury, Costigan. Look it up. Aquinas.","meta":"2:03am","if":"!e2_lena_jab || e2_apologized"},"He shuts the laptop and lies awake anyway, listening to the fan wind down."],"goto":"s17"},{"text":"Log off.","tag":"Control","set":{"e2_fb":"off","trait.control":"+1"},"response":["He shuts the Dell. The dark comes back, all but Theo’s screen across the room, blue and flickering in somebody else’s language. At 2:10 the freight horn comes up off the bluff, long and low, and Jack lies on his back and counts the cars."],"goto":"s17"}],"set":{"resolve.jack":"-1"}},"s17":{"slug":"FRIDAY · 7:12 PM · DELGADO HALL, 4TH FLOOR","body":["Friday comes in gold. The sun slants through the Grove into 412, and the fourth floor smells of hair spray and hot flat irons; all evening girls have been going down the east stairwell in white, two by two, holding their hems off the concrete like brides late for something. Theo left at six, whistling, spinning a set of keys Jack has never seen. Jack is on his bed with *Spe Salvi* face down on his chest when the RAZR goes off.",{"type":"sms","from":"LANEY (FIREMAN’S FAVORITE)","text":"FIREMAN!!! u r escorting me 2 pi lam @ 730. lena says ur not allowed. so come ;) xoxo","time":"7:12 PM"},"He’s still working out how to type *escort* on T9 without it coming out as something worse when Margot knocks: black peacoat, a thermos, small brass binoculars around her neck. Behind her, in a gray quarter-zip, Kevin wears the expression of a man who has been told what he’s for. “Costigan. I’m doing a piece for the *Tide* on recruitment as a ritual of female commodification. I need male control subjects.” She jerks her chin over her shoulder. “Kevin’s the other one. Bring a jacket.”","“Why do you need — ”","“The jobs report came out this morning,” Margot says. “Unemployment is nine-point-seven percent, the highest since 1983, and two hundred girls just bought white dresses. I need to watch that.” Kevin raises a hand. “She needs a ride. I’ve got my mom’s Odyssey in the Anacapa lot. I’m a subject *and* infrastructure.” “We’re walking,” Margot says. “It’s a mile. I wanted to see if you’d offer.” Jack looks at the phone. He looks at the binoculars."],"choices":[{"text":"Walk Laney to the open house.","tag":"Go","set":{"e2_friday":"laney"},"key":"You walked Laney to Pi Lam with Lena.","goto":"s17a"},{"text":"The stakeout with Margot and Kevin.","tag":"Go","set":{"e2_friday":"margot"},"key":"You went on Margot’s stakeout of Pi Lam with Kevin.","goto":"s17b"}]},"s17a":{"slug":"FRIDAY · 7:31 PM · SEACLIFF ROAD, PI LAMBDA CHI","music":"Lady Gaga — “Paparazzi”","set":{"resolve.lena":6},"body":["Seacliff Road at dusk is jasmine on the fences and the sea loud at the end of every cross street, and behind them, over the brown hills, the moon is coming up full and enormous, the color of a peach left on a windowsill. Laney walks between them in a white strapless dress she and Lena ironed last night, badly, which is why a wide braided belt rides low over the scorched triangle on her left hip. “Nobody look at my hip.” Nobody can stop.",{"if":"e2_alarm==\"hoodie\"","text":"She wears the Mooney hoodie over the dress until the last block, then peels it off without breaking stride and hands it to Jack like a coat check. He carries it over his arm like a butler.","else":"She carries her heels until the last block, then steps into them with a hand on Jack’s shoulder, as though he were a banister that came with the neighborhood."},{"if":"e2_lena_jab && !e2_apologized","text":"Lena walks on Laney’s other side in a green sundress and her boots. Since Delgado she has spoken to Jack exactly twice, and both times he was Mr. Costigan.","else":"Lena walks on Laney’s other side in a green sundress and her boots, narrating Greek row like a parade. “Kappa Alpha Delta. Lovely porch. No soul.” When Jack mentions he was told he wasn’t allowed, she doesn’t look at him. “I said you weren’t *invited*. She heard ‘allowed.’ That’s on her.” At the corner she catches Laney’s elbow. “Chin up, cher. Nobody’s looking at your hip.”"},"A horn — two notes, an old-money chord — and a champagne-gold convertible slides up alongside at walking pace, top down, cracked oxblood leather, Theo at the wheel in sunglasses he has no business wearing at this hour. Jack didn’t know Theo had a car. Jack didn’t know Theo had a car this specific. “Four-fifty SL, 1979. My grandfather’s. Two seats, ladies. Laney sits on the Catholic.” Laney doesn’t turn her head. “A girl *arrives* on foot, Theodore. She *leaves* in somebody’s car.” Theo takes it like a man told the restaurant is full, and pulls away west toward the end of Seacliff and the Point.","Pi Lambda Chi has the best porch on Seacliff and knows it: white colonial, black shutters, “Paparazzi” pouring out of every open window, a row of girls in white clapping a chant with Laney’s name folded into it, all wearing the same smile, a paper-doll chain cut from a single fold. Sloane — the blonde from the Lighthouse — stands on the steps with a clipboard and looks down at Jack with mild, glossy interest. “Theo’s roommate,” she says. “The Catholic.” “Jack.” “Mm.” She doesn’t write it down. Laney gives the porch the pageant wave, wrist, wrist, elbow, elbow, and the porch screams.","At the foot of the walk Laney takes a little silver pillbox engraved *DRP* out of her clutch and dry-swallows a small white pill with a tilt of the chin, like the last beat of a curtsy. She catches Jack watching, and her smile goes up a watt. Beside him, Lena has seen him see it. Then Laney goes up the steps into the white and the noise, passed hand to hand, and is gone.","Lena sits on the curb across the street, boots in the gutter, and Jack sits a body’s width away. The moon clears the roofs. At 8:04 she takes the LG out of her cardigan pocket and opens it. At 8:06 she opens it again. At 8:09 she calls, and Jack can hear it ring, small and far off, and then a recorded woman who belongs to the phone company. Lena closes it. “He’s studying,” she says, brightly, and puts the phone face down on her knee, and leaves her hand flat on top of it."],"choices":[{"text":"“How long have you known her?”","tag":"Sincerity","set":{"e2_curb":"friend","trait.sincerity":"+1","rel.lena.trust":"+1"},"response":["Lena watches a flash of copper go past a lit window. “Since the day before you. Feels longer.” She waits for a car to pass, as if it might be listening. “Somebody out here has to be her person. I volunteered before she asked.”"],"goto":"s18"},{"text":"“The pill.”","tag":"Candor","set":{"e2_curb":"pill","trait.candor":"+1","rel.lena.trust":"+1","rel.lena.friction":"+1"},"response":["She doesn’t pretend not to know what he means. “I saw it,” she says, level, to the porch. “I’m not her mother. And her mother’s the reason.” She says it whole, and closes it in the same breath.",{"if":"e2_laney_pills","text":"Then she does turn. “And don’t you dare say it to her again. She told me what you said Tuesday. She liked you less for an hour.”"}],"goto":"s18"},{"text":"Sororities are cloistered orders with better lighting. Prove it.","tag":"Wit","set":{"e2_curb":"joke","trait.wit":"+1","rel.lena.warmth":"+1"},"response":["“Postulants in white,” Jack says. “A novitiate. A habit, a Rule, a Mother Superior with a clipboard. The Rule of St. Sloane.” Lena laughs out loud and doesn’t bother hiding it. “The Poor Clares would never let her in with that belt.” “She’ll be discalced by eleven.” “Lord, by *nine*.” For a minute they both just breathe, and the phone stays face down on her knee."],"goto":"s18"},{"text":"Say nothing. Stay on the curb.","tag":"Control","set":{"e2_curb":"stayed","trait.control":"+1","rel.lena.trust":"+1","soul.restraint":"+1"},"response":["He doesn’t say anything. He stays where he is, a body’s width away, and lets the quiet belong to her. After a while she seems to notice he isn’t going to fill it, and some of the set goes out of her shoulders. Across the street the porch screams for somebody else’s name. Her hand stays flat on the phone."],"goto":"s18"}]},"s17b":{"slug":"FRIDAY · 7:31 PM · SEACLIFF ROAD, THE BLUFF BENCH ACROSS FROM PI LAMBDA CHI","music":"Lady Gaga — “Paparazzi”","set":{"resolve.lena":6},"body":["The bench sits on the bluff side of Seacliff, square across from Pi Lambda Chi, the sea working at the rocks seventy feet below. Margot lays out her kit like a surgeon: the thermos, the Moleskine, a clove she holds and does not light — rationing until the ban on the twenty-second — and the brass binoculars. “Opera glasses. I’m not a pervert. I’m a journalist.” The moon is coming up over the roofs to the east, full and enormous, and across the road “Paparazzi” spills out of every window, thinned by distance into something tinny, a song in another girl’s room.","Kevin knows everybody on the porch by name, major and hometown, delivered quietly as they come out to clap. “Caroline, communications, Newport Beach. Hadley, econ, Highland Park. Brooke, undeclared, semester at sea.” Margot lowers the binoculars. “How.” “Facebook. Their chapter page is public. Their photos are public.” He shrugs. “Their tagged photos are public. Their *mothers’* photos are public.” “You’re a terrifying man.” Kevin beams. “I’m *thorough*.”","At 7:40 Laney comes down Seacliff on foot, in white, with Lena beside her in a green sundress and boots.",{"if":"e2_alarm==\"hoodie\"","text":"Laney wears the Mooney hoodie over the dress until the last block, then peels it off and slings it at Lena, who catches it without looking."},"At the corner Lena’s eyes find the bench — the binoculars, Margot, Kevin, Jack — and rest on Jack exactly long enough to send him a bill he’ll be paying off in red ink for weeks. She walks Laney to the steps, says something into her hair, and goes back the way she came, alone.","A horn, two notes, and a convertible slides past behind them with the top down, a long gold blur under the streetlights, a blond head at the wheel and one hand raised. Theo. Jack lifts a hand back. The car goes on west toward the end of Seacliff and the Point. Kevin’s head turns with it and stays turned until the taillights are gone. Then he looks down at his BlackBerry.","Margot narrates the porch as though she’s paid by the insult. “The handshake signals confidence without competence. Note the hair. The hair has been negotiated.” Then Laney gives the porch her pageant wave, wrist, wrist, elbow, elbow, and the porch screams, and Margot keeps the glasses on her a while after everybody else has gone back to clapping. When she speaks again it’s in a different voice. “She’s auditioning for a part they cast in June.”","Half an hour later Laney slips out alone onto the side steps, out of the porch light, with a plastic cup of white wine, takes something from her clutch and drinks it down. Kevin watches her a while before he says anything, and when he does there’s no joke anywhere in it. “Something out of the clutch and a cup of white wine. She weighs maybe a hundred and five.”",{"if":"e2_laney_pills","text":"On Tuesday Jack told her to skip it. She doesn’t."}],"choices":[{"text":"Cross the street and sit with Laney on the side steps.","tag":"Sincerity","set":{"e2_stakeout":"laney","e2_sat_with_laney":true,"trait.sincerity":"+1","rel.laney.trust":"+1","rel.laney.warmth":"+1"},"response":["She doesn’t ask what took him so long. Her shoes are off; the cup sweats in her hand. She shows him the brown triangle under the belt — “Lena and I ironed it. *Geometry*.” Up close her words come a half-beat behind her mouth, and when she points at the porch her hand drifts past it and has to come back. For a few minutes she’s just a girl from Dallas with her feet on cold brick, telling him the porch smells like Bath & Body Works and fear. Then: “Don’t tell Lena.” She thinks about it. “I mean tell her.” She thinks some more. “Don’t.”","A sister calls her name from the door, bright as a dinner bell. Laney stands, smooths the scorched triangle under the belt, and puts the pageant smile back on like a crown, straight, before she walks back out."],"goto":"s18"},{"text":"Ask Margot why she’s really here.","tag":"Candor","set":{"e2_stakeout":"why","trait.candor":"+1","rel.margot.trust":"+1"},"response":["Margot doesn’t lower the binoculars. “Somebody should be watching who isn’t grading.” Kevin glances at her, and then, very carefully, at the sea."],"goto":"s18"},{"text":"Narrate the porch like a nature documentary.","tag":"Wit","set":{"e2_stakeout":"nature","trait.wit":"+1","rel.margot.warmth":"+1","rel.kevin.warmth":"+1"},"response":["Jack drops to a hush. “Here, on the coast of California, the young female gathers at dusk — ” and Margot takes it without a flicker, in a reverent BBC murmur: “Not every candidate will survive the night. Those who do will be given a letter, a T-shirt and a new mother.” Jack does the music, strings swelling over the Serengeti.","And Kevin goes — a long, high, helpless sound, nothing like the floor-meeting grin — and lets it run a little before he catches himself and checks the porch across the road, as if somebody over there might have heard."],"goto":"s18"}]},"s18":{"slug":"FRIDAY · 11:40 PM · CAMPUS POINT, THE BEACH BELOW THE BLUFF","music":"Edward Sharpe & the Magnetic Zeros — “Home”","set":{"resolve.lena":6},"body":["By a quarter to midnight the moon has climbed high and gone from peach to bone, and the beach below the bluff is lit like a stage after the audience has gone home. The sand is cold and squeaks. Somebody else built a driftwood fire and abandoned it; they’ve adopted it, and it spits blue where the salt gets in. Theo’s iPhone sits in a red Solo cup on a rock — “for the acoustics; it’s a known technique” — playing a song all stomps and hand claps, a whistled tune over the top like somebody walking home in a good mood.","Laney is barefoot and victorious, the hem of the white dress dark with seawater, informing the moon that Sloane says she’s a *lock*. She has told everyone eleven times. Every time is a premiere.",{"if":"e2_alarm==\"hoodie\"","text":"She’s back in the Mooney hoodie, hood up over the copper hair, a cardinal at a beach party."},"Theo lies flat with his hands behind his head, the gold car parked up top under the lot’s one light, where he can see it. Margot sits bolt upright on a log with the thermos between her boots and no visible need for a blanket. Kevin carried a case of Arrowhead down the bluff stairs by himself and hands out bottles like orange slices at halftime. Doug, in a Bakersfield Drillers blanket, wants to know if the moon is always this big in California. “In Bakersfield it’s, like, half this.” Past the break Rafi is the only one in the water, a black shape rising on the bright swell and dropping out of it, whooping. And last, after the first and longest edition of Laney’s debrief, Lena comes down the bluff stairs barefoot, boots in her hand.",{"if":"e2_friday==\"laney\"","text":"Jack knows about 8:04. For an hour the phone stays in her pocket, and keeping it there looks like work."},{"if":"e2_friday==\"margot\"","text":"She drops the boots by the fire and looks at Jack across it. “Binoculars.” Later, at the waterline, with her back to everyone, she takes the LG out of her cardigan, holds it open in its blue light a while, and closes it. It’s the first Jack knows that anything is off. When he comes down to rinse the sand off his hands she says, without turning around, “Margot’s piece. Am I in it?” “You’re a source.” “Tell her it’s two s’s in Broussard. People always try to save one.” She puts the phone away."},{"if":"e2_sat_with_laney","text":"Laney drops into the sand beside Jack, bumps his shoulder with hers, and says nothing at all, which from Laney is a speech."},"At 11:52 the phone lights up through her cardigan pocket. She reads it. Her face does one thing and then another, neither of them anything Jack has seen it do, and then she closes the phone and slides it down inside one of her boots like a letter into a mailbox and stands the boots upright in the sand.","Then she gets to her feet and dusts off her hands. “Y’all don’t know the chant.” Nobody does. “Magdalena Broussard is not going to stand on a beach in California with five Yankees and a Texan who don’t know the chant. Nine days to Detroit.” Theo opens his mouth. “Yes, we lost to Miami last night, ten to seven, I am *aware*. Brees didn’t play. Preseason doesn’t count. *Nothing* counts till Detroit, and nobody on this beach is going to embarrass me in front of the Lord and the Superdome.” She points at them one by one like a catechist with a class of hard cases. “I say *who dat*. Y’all say *who dat*.” And she teaches it, call and response, the way it was taught to her: *Who dat. Who dat. Who dat say dey gonna beat dem Saints.*","Laney gets it wrong at full volume — *who dat say dey gonna EAT dem Saints* — and refuses correction on the grounds that hers is better. Theo plucks the iPhone out of its cup, killing the song, and films it: “Week one. The Catholics have begun their rituals.” Kevin bellows it like a team captain. Doug does it twice, because he started late. Margot declines on principle. “I don’t chant. Chanting is how fascism warms up.” Lena points at her. Everybody points at her. Margot sighs through her nose, sets down the thermos, and says it exactly once, at a normal speaking volume, with no inflection whatsoever, like a parking ordinance read into a microphone: “Who dat say dey gonna beat dem Saints.” It is the funniest thing that has happened all week. The beach comes apart, and Lena has to sit down in the sand.","Theo puts the song back on. When the whistling part comes around everybody tries it and everybody is bad at it, except Kevin, who whistles like a teakettle with perfect pitch and looks embarrassed. Then Theo produces the flask — silver, *R.V.* on the side, the Macallan inside — and starts it around the fire. Each time it comes back around, Theo sends it on untouched, and Jack notices, because he has never seen Theo turn down anything. Margot takes a mouthful “for the ethnography” and makes the face of a woman insulted in Gaelic. Kevin passes it on without drinking, and smoothly, without a word, right over Laney’s outstretched hand too. “Respectfully, no.” He puts a water in her hand instead, and she lets him. Then the flask is in Jack’s hand, cold."],"choices":[{"text":"Drink.","tag":"Reckless","set":{"e2_beach":"drank","trait.reckless":"+1","resolve.jack":"-1","rel.theo.warmth":"+1","soul.restraint":"-1"},"response":["Smoke and honey and peat, and the taste in scotch of a man Jack knows only as two initials on a flask. It goes down warm and stays there. The moon gets a little louder.","Later, with the fire down to coals, Jack lies back in the cold sand and counts them the way he counts freight cars: seven people around a dying fire, himself included; one surfer out on the moon-road; and Laney, at intervals, still informing the Pacific who dat."],"goto":"s19"},{"text":"Pass.","tag":"Control","set":{"e2_beach":"passed","trait.control":"+1","resolve.jack":"+1","soul.restraint":"+1"},"response":["He hands it back. “My conscience,” Theo says, fondly, and toasts him with it. Across the fire Kevin raises his water bottle in solidarity.","Later, with the fire down to coals, Jack lies back in the cold sand and counts them the way he counts freight cars: seven people around a dying fire, himself included; one surfer out on the moon-road; and Laney, at intervals, still informing the Pacific who dat."],"goto":"s19"},{"text":"Take it, and hand it to Lena without drinking.","tag":"Charm","set":{"e2_beach":"lena","trait.charm":"+1","rel.lena.warmth":"+1"},"response":["She looks at the flask, and at him. Then she takes one swallow, shivers once, and hands it back.",{"if":"e2_lena_jab && !e2_apologized","text":"“Thank you, Mr. Costigan.” The *Mister* is still there. Something under it has thawed a degree.","else":"“Thank you, Costigan.” Not heat — nothing in it you could hold up to the light. Just one friend passing another the salt."},"Later, with the fire down to coals, Jack lies back in the cold sand and counts them the way he counts freight cars: seven people around a dying fire, himself included; one surfer out on the moon-road; and Laney, at intervals, still informing the Pacific who dat."],"goto":"s19"}]},"s19":{"slug":"SATURDAY · 12:22 AM · CAMPUS POINT, THE BLUFF-TOP LOT","music":"Phoenix — “Lisztomania”","body":["A little after midnight the party breaks the way beach parties do, all at once and without a vote. Lena walks Laney home along the lagoon path, arm in arm. Kevin shoulders the empty case and herds Margot and Doug down the sand toward the campus stairs. Rafi is still out in the water. Theo walks Jack up the bluff stairs to the lot, singing under his breath in no particular language.",{"if":"e2_friday==\"margot\"","text":"Up close, under the moon and the lot’s one sodium lamp, the car is something out of one of Theo’s movies: champagne paint beaded with dew, chrome, oxblood leather cracked as fine as an old man’s hands. Theo lays his wrist along the wheel, his grandfather’s Rolex against the paint, steel on champagne. “He bought them the same week.”","else":"Up close, under the moon and the lot’s one sodium lamp, the car from Seacliff is somehow more: dew on the champagne paint, oxblood leather cracked as fine as an old man’s hands. Theo lays his wrist along the wheel, his grandfather’s Rolex against the paint, steel on champagne. “He bought them the same week.”"},"He turns the key one click, not enough to start it, and the dash comes up amber. A cassette adapter in the tape deck runs a cord to the iPhone, and Phoenix comes out of the old speakers bright and clattering, a song in a hurry. Theo is sober — he hasn’t touched his own flask all night — and he means every word. “Full moon, Costigan. LA is three hours. Get in the car.”","He lays it out like a pitch. His father’s house in Malibu, this weekend: a pool facing the ocean, a refrigerator full of things nobody is allowed to eat. The fire on the ridge behind La Cañada is still burning; his mother called from the Peninsula to say the sky is the color of a Creamsicle. “I want you to see it,” he says, and for once he doesn’t sell it. “I want you to see what it looks like when the mountains are on fire and nobody cancels brunch.” He pats the passenger seat."],"choices":[{"text":"“Get in.”","tag":"Reckless","set":{"e2_la":"tonight","trait.reckless":"+1","resolve.jack":"-2","rel.theo.warmth":"+1","rel.theo.trust":"+1","soul.restraint":"-1","e2_texted_nobody":true},"cue":"Theo will remember that.","key":"You got in Theo’s car at half past midnight and said yes to Los Angeles.","response":["Theo whoops at the moon. The engine catches with a rich old cough, the headlights find the ice plant, and Jack drops into the passenger seat and pulls the door shut. He texts Priya nothing, and Lena nothing, and his mother nothing."],"goto":"s20"},{"text":"“Tomorrow. In daylight. And we bring people.”","tag":"Control","set":{"e2_la":"tomorrow","trait.control":"+1","rel.theo.warmth":"+1"},"key":"You told Theo you’d go to Los Angeles — tomorrow, in daylight, with everybody.","response":["Theo stares at him. Then his whole face opens, delighted, as if Jack has invented something. “A *floor* trip.” “Kevin’s got his mom’s Odyssey in the Anacapa lot,” Jack says. “Tran has a *minivan*?” He’s already pulled the iPhone off the cord, cutting Phoenix off mid-chorus, and is scrolling. “Tran. Tran. How many people fit in an Odyssey? No — *legally*.”"],"goto":"s20"},{"text":"“I can’t afford LA, Theo.”","tag":"Candor","set":{"e2_la":"broke","soul.honesty":"+1","trait.candor":"+1","rel.theo.trust":"+1"},"key":"You told Theo you couldn’t afford Los Angeles.","response":["Theo doesn’t laugh. “Nobody’s asking you to afford it,” he says. “That’s the whole point of my father.” Jack starts in on the thing Frank would say about owing people, and Theo, who has seen the receipt on Jack’s desk, lets him get halfway and doesn’t push. He just says he’s leaving at nine, with or without, and he already bought gas. “And gas is non-refundable.”",{"if":"e2_books==\"loan\"","text":"“Put it on my tab,” he adds. “Under the pie.”"}],"goto":"s20"}]},"s20":{"slug":"SATURDAY · 12:31 AM · CAMPUS POINT","body":[{"if":"e2_la==\"tonight\"","text":"Then the 101, southbound, top down. The Pacific is a black sheet on the right and the moon keeps pace across it, patient, as though it means to see them all the way to Los Angeles. The wind is cold and loud and smells of kelp and then, for a mile, of oranges. “Lisztomania” comes around a second time, and Theo doesn’t skip it. Past Ventura the needle drifts up to eighty-five on the curves and stays there, and Theo is singing, and Jack finds he’s watching the needle more than the moon. He puts his hand out anyway over the door into the cold and opens his fingers and lets the night go through them.","else":"The lot is quiet. The car sits with its top down and its engine off, and below the bluff the moon has laid itself flat on the sea. West, up the coast, past the dark roofs of Seacliff, the old light stands dark on the Point. Theo keeps his hands on the wheel at ten and two, like somebody’s grandfather, and doesn’t start it. He doesn’t say anything, and Jack doesn’t either. They sit there a while, the two of them, in a car that isn’t going anywhere yet, and watch the water."}],"end":true}}},{"id":"S1E03","season":1,"episode":3,"showTitle":"The Hard Saying","title":"Labor","dates":"Saturday, September 5 – Monday, September 7, 2009","logline":"Labor Day weekend: Theo kidnaps half of Delgado Hall to his father’s beach house in Malibu, where the gumbo takes an hour, the father takes six minutes, and somebody has to explain the dignity of labor.","previously":[{"text":"Adrian Hale told the seminar your belief in a soul is just an inheritance. You told him he’d inherited his atheism too.","if":"e2_soul_final==\"press\""},{"text":"Then he paired you with Lena for the semester. Her red ink in your margin: *Cite me.*"},{"text":"She told you about Wes — the boat, the storm, sixteen. You told her you’d been worried she had bad taste.","if":"e2_wes_reply==\"honest\""},{"text":"You offered her the whole pack. She said she collects them one at a time — and that she’d need a container.","if":"e2_cig_lena==\"offered\""},{"text":"You took a job washing dishes on the harbor, and a loan from Theo, payable in pie.","if":"e2_books==\"loan\""},{"text":"Under a full moon, Theo said Los Angeles was three hours away. You told him you couldn’t afford it.","if":"e2_la==\"broke\""}],"cast":[{"id":"lena","name":"Lena Broussard","role":"The girl on the porch","tracked":true},{"id":"theo","name":"Theo Vance","role":"Roommate, Room 412","tracked":true},{"id":"laney","name":"Laney Price","role":"Lena’s roommate","tracked":true},{"id":"margot","name":"Margot Lindqvist","role":"Third floor, Delgado","tracked":true},{"id":"kevin","name":"Kevin Tran","role":"Down the hall, Room 420","tracked":true},{"id":"osei","name":"Fr. Gabriel Osei","role":"Newman Center chaplain","tracked":true},{"id":"hale","name":"Prof. Adrian Hale","role":"Philosophy, Marisol","tracked":true},{"id":"julian","name":"Julian Park-Ellis","role":"A guy with a guitar","tracked":true},{"id":"evan","name":"Evan Marsh","role":"TA, PHIL 1, Thursday section","tracked":true},{"id":"becca","name":"Becca Lindell","role":"Newman regular","tracked":true},{"id":"frank","name":"Frank Costigan","role":"Jack’s father","tracked":false},{"id":"maria","name":"Maria Costigan","role":"Jack’s mother","tracked":false},{"id":"nonna","name":"Carmela Rinaldi","role":"Jack’s grandmother","tracked":false},{"id":"gina","name":"Gina Costigan","role":"Jack’s sister","tracked":false},{"id":"rosie","name":"Rosie Costigan","role":"Jack’s sister","tracked":false},{"id":"priya","name":"Priya Raman","role":"4th-floor RA","tracked":false},{"id":"rafi","name":"Rafi Ochoa","role":"Second floor","tracked":false},{"id":"doug","name":"Doug Pruitt","role":"Room 420","tracked":false},{"id":"joey","name":"Joey Abruzzo","role":"Newman regular","tracked":false},{"id":"tyler","name":"Tyler Brandt","role":"Newman missionary","tracked":false},{"id":"fitch","name":"Dolores Fitch","role":"Newman secretary","tracked":false},{"id":"sloane","name":"Sloane Kittredge","role":"Pi Lambda Chi","tracked":false},{"id":"gloria","name":"Gloria Mendes","role":"The Anchor, nights","tracked":false},{"id":"rudy","name":"Rudy Salcedo","role":"Line cook, the Anchor","tracked":false},{"id":"caleb","name":"Caleb Hargrove","role":"PHIL 9H","tracked":false},{"id":"yusuf","name":"Yusuf Noorzai","role":"PHIL 9H","tracked":false},{"id":"wes","name":"Wes Arceneaux","role":"Lena’s boyfriend, Tulane","tracked":false},{"id":"tess","name":"Tess Fontenot","role":"Lena’s sister","tracked":false},{"id":"richard","name":"Richard Vance","role":"Theo’s father","tracked":false},{"id":"brynn","name":"Brynn Vance","role":"Richard’s wife","tracked":false},{"id":"caroline","name":"Caroline Ashby Vance","role":"Theo’s mother","tracked":false},{"id":"poppy","name":"Poppy Vance","role":"Theo’s sister","tracked":false},{"id":"danny","name":"Danny Costigan","role":"Jack’s brother","tracked":false},{"id":"remy","name":"Remy Broussard","role":"Lena’s brother","tracked":false}],"duels":{"labor":{"title":"On Labor","opponent":"lena","topic":"Whether a worker is owed his work — and whether the unions and the bailout were justice or a racket."}},"start":"s01","endCard":{"tag":"A roux is a vow.","nextTime":["“Row M. Her seat’s empty.”","“You lie!”","“It’s a whiteboard, Costigan. I’ll be updating it hourly.”","“Open mic’s Thursday. Bring a pen.”"]},"scenes":{"s01":{"slug":"SATURDAY · 8:58 AM · DELGADO HALL, ROOM 412","body":["Jack wakes to the smell of espresso, which in 412 means Theo is up and something has been decided without him. Fog lies flat and white against the window. Under it the radiator ticks at its own pace, for its own reasons. Jack is in the Browns T-shirt he sleeps in, the helmet on the chest cracked to a ghost by the Glenwood Avenue dryer, and he is cold the way the Central Coast does cold in September: damp, polite, right through.",{"if":"e2_alarm==\"hoodie\"","text":"The Mooney hoodie is two floors down, being slept in by a redhead.","else":"The Mooney hoodie is on the chair across the room, which at this hour might as well be Akron."},"Theo is standing at the foot of the bed. He is dressed — the gray T-shirt with the hole in it, jeans that cost more than they admit to, sunglasses pushed up into the blond — and he has a cortado in each hand from the machine nobody may touch, and the keys to the SL hooked on one finger. He holds a cup out. “I’m making an exception,” he says. “I’m a forgiving man.” Jack takes it. It is the first thing that has ever come out of that machine and into his hands, and it is very good, which feels like the opening move of a con.","“You told me you couldn’t afford LA,” Theo says. “I listened. I’m a wonderful listener; it’s a curse. So I am not taking you to LA.” He waits exactly long enough for Jack’s shoulders to come down. “I’m taking you to *Malibu*.”","Then he pitches it, pacing the eleven feet of 412 like a producer walking a room of executives toward a yes they don’t know they’ve already said. “Picture it. Eight a.m. I knock on two-seventeen. Price opens the door in a sleep mask and says yes before I finish the word. I got as far as *Mal*. Price calls Margot, because Margot is the only person in Delgado who admits to being up at eight. Margot calls Tran, because Tran has a van and a conscience, and Tran is afraid of her, which I respect. Pruitt the Destroyer has a raid tonight and sends his regrets in Elvish.” He sips. “Your Broussard says she has a paper.” “Then she has a paper.” “Nobody has a paper on Labor Day weekend, Costigan. It’s the one weekend the paper gets off. Bring a swimsuit and lowered expectations.”",{"type":"sms","from":"Gina","text":"ohio st plays navy today. dad says if u dont watch ur not his son. (he said it nice)","time":"8:59 AM"},"Kickoff is noon in Columbus. Frank will be in the garage with the radio on and the little TV off, because the TV guys talk too much, and he will take it personally if Navy completes a pass. Jack thumbs back *watching in spirit*, which T9 fights him on the whole way.","Theo slides the sunglasses down onto his nose. “Also, I already bought the gas, and gas is — ” “Non-refundable.” Theo points at him with the cup, moved. “You *listen*.”"],"choices":[{"text":"“I’m paying my share of the gas.”","tag":"Candor","set":{"trait.candor":"+1","soul.honesty":"+1","rel.theo.trust":"+1","e3_terms":"gas"},"response":["Theo, who has seen the UCen receipt and the face Jack made at it, doesn’t argue, and that’s how Jack knows he planned for it. “Fine. Pay Kevin. It’s his mother’s gas.” He considers this. “Kevin is going to make a spreadsheet. Let him have it. It’s a holiday.”"],"goto":"s01b"},{"text":"“Put it under the pie.”","tag":"Charm","set":{"trait.charm":"+1","rel.theo.warmth":"+1","e3_terms":"tab"},"response":["Theo crosses to the espresso machine, peels off the Post-it — *IOU 1 PIE (TBD) —J.C.* — and writes a second line under it in his unexpectedly neat hand: *+ 1 MALIBU —T.V.* He sticks
