<title>The Event Horizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Bungee&family=IBM+Plex+Mono:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
/* Layout: one reading column printed on newsprint, like a comic script and a prestige pilot sharing a page.
   A sticky masthead carries the clock and pools. The story log grows downward. Choices sit at the foot like
   the last tier of panels. Night scenes print on ink-dark stock. Season looks swap tokens via [data-look]. */
:root{
  --paper:#E8E7E1; --paper-2:#DCDAD2; --paper-3:#F3F2EE; --ink:#15161B; --ink-soft:#4B4C57; --ink-faint:#7C7D88; --rule:#C3C0B6;
  --cyan:#0089BF; --magenta:#C8006A; --yellow:#FFD500; --key:#111216;
  --night:#11131B; --night-2:#1A1D28; --night-ink:#E8E5DC; --night-soft:#9C9AA8; --night-rule:#2C3040;
  --gold:#B88600; --gold-glow:#FFC933; --good:#007E8F; --warn:#B86E00; --bad:#C2002E;
  --cap-bg:#FFE45C; --cap-ink:#15161B;
  --dot:rgba(21,22,27,.10); --dot-cyan:rgba(0,137,191,.16); --dot-mag:rgba(200,0,106,.12);
  --shadow:4px 4px 0 var(--key);
  --c-sam:#0079AA; --c-jules:#B5005F; --c-nik:#2D7A2F; --c-simone:#7B2CA0; --c-vinnie:#C2410C; --c-grace:#00756B;
  --c-rosa:#A3462B; --c-frank:#55606E; --c-nonna:#7A4E1D; --c-mikey:#1F4E8C; --c-gigi:#D0347E; --c-ciro:#8A5A00;
  --c-catherine:#3F4655; --c-whitney:#6B5B2E; --c-hugh:#9A7B00; --c-constance:#4B2E4F; --c-callum:#2E6B8A;
  --c-teddy:#3C6E8F; --c-bree:#8F3C6E; --c-heck:#B5451B; --c-femi:#4C5B3A; --c-dana:#6A3E9E; --c-old_sam:#5C6470; --c-jayden:#B5651D; --c-carmen:#8C3A5A; --c-weisz:#5A6B2E; --c-x:#4B4C57;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Literata","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sfx:"Bungee","Impact","Arial Black",sans-serif;
  --fs:1.075rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15161C; --paper-2:#1D1F27; --paper-3:#1A1B22; --ink:#ECE9E1; --ink-soft:#B3B1BC; --ink-faint:#83828F; --rule:#2F3140;
  --cyan:#38B6EA; --magenta:#FF4FA0; --yellow:#FFDD3D; --key:#000000;
  --night:#0B0C11; --night-2:#14161F; --night-ink:#E8E5DC; --night-soft:#9C9AA8; --night-rule:#262A38;
  --gold:#FFC933; --gold-glow:#FFDD70; --good:#3CC4D4; --warn:#F2A33A; --bad:#FF5470;
  --cap-bg:#FFE45C; --cap-ink:#15161B;
  --dot:rgba(236,233,225,.06); --dot-cyan:rgba(56,182,234,.12); --dot-mag:rgba(255,79,160,.09);
  --c-sam:#4FC0F0; --c-jules:#FF5FAA; --c-nik:#6CCB6E; --c-simone:#C38BE8; --c-vinnie:#FF8A4C; --c-grace:#4FD1C0;
  --c-rosa:#F08A6B; --c-frank:#A9B4C2; --c-nonna:#D9A15E; --c-mikey:#7FA9F0; --c-gigi:#FF7FB8; --c-ciro:#E0B040;
  --c-catherine:#AEB6C7; --c-whitney:#D1BE80; --c-hugh:#E8C845; --c-constance:#C79BCB; --c-callum:#7FC0E0;
  --c-teddy:#86BEE0; --c-bree:#E08FBF; --c-heck:#FF8C5A; --c-femi:#A9C08A; --c-dana:#B994F0; --c-old_sam:#A3ABB8; --c-jayden:#F0A060; --c-carmen:#E08AAE; --c-weisz:#B8C88A; --c-x:#B3B1BC;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15161C; --paper-2:#1D1F27; --paper-3:#1A1B22; --ink:#ECE9E1; --ink-soft:#B3B1BC; --ink-faint:#83828F; --rule:#2F3140;
  --cyan:#38B6EA; --magenta:#FF4FA0; --yellow:#FFDD3D; --key:#000000;
  --night:#0B0C11; --night-2:#14161F; --night-ink:#E8E5DC; --night-soft:#9C9AA8; --night-rule:#262A38;
  --gold:#FFC933; --gold-glow:#FFDD70; --good:#3CC4D4; --warn:#F2A33A; --bad:#FF5470;
  --cap-bg:#FFE45C; --cap-ink:#15161B;
  --dot:rgba(236,233,225,.06); --dot-cyan:rgba(56,182,234,.12); --dot-mag:rgba(255,79,160,.09);
  --c-sam:#4FC0F0; --c-jules:#FF5FAA; --c-nik:#6CCB6E; --c-simone:#C38BE8; --c-vinnie:#FF8A4C; --c-grace:#4FD1C0;
  --c-rosa:#F08A6B; --c-frank:#A9B4C2; --c-nonna:#D9A15E; --c-mikey:#7FA9F0; --c-gigi:#FF7FB8; --c-ciro:#E0B040;
  --c-catherine:#AEB6C7; --c-whitney:#D1BE80; --c-hugh:#E8C845; --c-constance:#C79BCB; --c-callum:#7FC0E0;
  --c-teddy:#86BEE0; --c-bree:#E08FBF; --c-heck:#FF8C5A; --c-femi:#A9C08A; --c-dana:#B994F0; --c-old_sam:#A3ABB8; --c-jayden:#F0A060; --c-carmen:#E08AAE; --c-weisz:#B8C88A; --c-x:#B3B1BC;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.62;margin:0;
  background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.4px);background-size:7px 7px;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Masthead ---------- */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:3px solid var(--key);
  display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.mast .brand{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;cursor:pointer;padding:0}
.mast .orb{width:26px;height:26px;border-radius:50%;background:var(--key);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--magenta),0 0 0 6px var(--cyan);flex:none}
.mast .ep{font-family:var(--display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:1.05rem;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast .ep small{display:block;font-family:var(--mono);font-weight:500;font-size:.68rem;letter-spacing:.08em;color:var(--ink-soft)}
.mast .clock{font-family:var(--mono);font-size:.74rem;letter-spacing:.04em;color:var(--ink-soft);text-transform:uppercase;line-height:1.25;margin-left:auto;text-align:right}
.mast .clock b{color:var(--ink);font-weight:600;display:block;font-size:.82rem}
.mast .pools{display:flex;gap:10px;align-items:center}
.pool{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.pips{display:flex;gap:2px}
.pip{width:7px;height:10px;border:1.5px solid var(--key);background:transparent;transform:skewX(-12deg)}
.pip.on{background:var(--ink)}
.pool.st .pip.on{background:var(--magenta)} .pool.fo .pip.on{background:var(--cyan)} .pool.ne .pip.on{background:var(--yellow)}
.mast .tools{display:flex;gap:6px}
.tbtn{border:2px solid var(--key);background:var(--paper-3);font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;cursor:pointer;line-height:1}
.tbtn:hover{background:var(--yellow);color:var(--cap-ink)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sync{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.sync.ok{color:var(--good)}
@media (max-width:640px){.mast .pools{order:5;width:100%;justify-content:flex-start}.mast .clock{font-size:.66rem}}

/* ---------- Stage ---------- */
.stage{max-width:46rem;margin:0 auto;padding-inline:16px;padding-block:24px 160px}
.log{display:flex;flex-direction:column;gap:22px}
.scene{display:flex;flex-direction:column;gap:14px;min-width:0}
.scene.past{opacity:.78}
.scene.past .choice-made{opacity:1}
.slug{font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:2px solid var(--key);padding-top:8px}
.slug .t{margin-left:auto;color:var(--ink-faint)}
.prose p{margin:0 0 .9em;text-wrap:pretty}
.prose p:last-child{margin-bottom:0}
.prose em{font-style:italic}
.prose strong{font-weight:700}
.panel-night{background:var(--night);color:var(--night-ink);padding:20px 20px 22px;border:3px solid var(--key);box-shadow:var(--shadow);
  background-image:radial-gradient(circle at 1px 1px,rgba(56,182,234,.10) 1px,transparent 1.4px);background-size:6px 6px}
.panel-night .slug{color:var(--night-soft);border-top-color:var(--night-rule)}
.panel-night .slug .t{color:var(--night-soft)}
.panel-night .line .who{filter:brightness(1.35) saturate(1.1)}
.line{display:grid;grid-template-columns:minmax(4.6rem,auto) 1fr;gap:4px 12px;margin:0 0 .8em;align-items:baseline}
.line .who{font-family:var(--display);font-weight:800;font-size:.86rem;letter-spacing:.09em;text-transform:uppercase;color:var(--c-x);text-align:right;line-height:1.3}
.line .say{min-width:0}
@media (max-width:520px){.line{grid-template-columns:1fr;gap:0}.line .who{text-align:left}}
.cap{background:var(--cap-bg);color:var(--cap-ink);border:2px solid var(--key);padding:8px 12px;font-family:var(--mono);font-size:.82rem;line-height:1.45;
  letter-spacing:.02em;text-transform:uppercase;box-shadow:3px 3px 0 var(--key);max-width:34rem;margin:0 0 .9em}
.sfx{font-family:var(--sfx);font-size:clamp(2rem,9vw,3.6rem);line-height:.95;color:var(--yellow);-webkit-text-stroke:2px var(--key);
  text-shadow:4px 4px 0 var(--magenta),7px 7px 0 var(--key);transform:rotate(-4deg);margin:.15em 0 .45em;letter-spacing:.02em;word-break:break-word}
.sfx.cy{color:var(--cyan)}
.beat{border:0;height:10px;margin:.6em 0 1.2em;background:radial-gradient(circle,var(--ink-faint) 1.6px,transparent 2px) center/14px 10px repeat-x;opacity:.7}
.txt{display:flex;flex-direction:column;gap:2px;margin:0 0 .8em;max-width:30rem}
.txt .from{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.txt .bub{align-self:flex-start;background:var(--paper-3);border:2px solid var(--key);border-radius:14px 14px 14px 3px;padding:6px 12px;font-family:var(--body);font-size:.95rem}
.txt.me{align-self:flex-end;align-items:flex-end;margin-left:auto}
.txt.me .bub{background:var(--cyan);color:#fff;border-radius:14px 14px 3px 14px}
.panel-night .txt .bub{background:var(--night-2);color:var(--night-ink);border-color:var(--night-rule)}
.panel-night .txt.me .bub{background:var(--cyan);color:#06121a}

/* notes after choices */
.notes{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--key);padding:3px 7px;background:var(--paper-3);line-height:1.2}
.chip.up{border-color:var(--good);color:var(--good)} .chip.down{border-color:var(--bad);color:var(--bad)}
.chip.fact{background:var(--cap-bg);color:var(--cap-ink)} .chip.heat{border-color:var(--warn);color:var(--warn)}
.choice-made{font-family:var(--mono);font-size:.78rem;letter-spacing:.03em;color:var(--ink-soft);border-left:4px solid var(--magenta);padding:2px 0 2px 10px}
.choice-made b{color:var(--ink)}
.rollrec{font-family:var(--mono);font-size:.74rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--ink-soft)}
.rollrec .tier{font-family:var(--display);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.9rem}
.mini-die{display:inline-grid;place-items:center;width:20px;height:20px;border:1.5px solid var(--key);font-size:.66rem;font-weight:700;background:var(--paper-3);color:var(--ink)}
.mini-die.hit{background:var(--cyan);color:#fff}.mini-die.dbl{background:var(--magenta);color:#fff}.mini-die.one{background:var(--bad);color:#fff}
.mini-die.gold{background:var(--gold-glow);color:#15161B;box-shadow:0 0 6px var(--gold-glow)}

/* ---------- Choices ---------- */
.choices{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.choice{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper-3);border:2.5px solid var(--key);padding:12px 14px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .08s ease,box-shadow .08s ease,background .12s}
.choice:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--key);background:var(--paper)}
.choice:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--key)}
.choice .ct{font-family:var(--body);font-size:1rem;line-height:1.4}
.choice .meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-family:var(--mono);font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1.5px solid var(--key);line-height:1.3}
.tag.pool{background:var(--magenta);color:#fff;border-color:var(--magenta)}
.tag.move{background:var(--cyan);color:#fff;border-color:var(--cyan)}
.tag.d20{background:var(--ink);color:var(--paper)}
.tag.slip{background:var(--yellow);color:var(--cap-ink)}
.tag.cost{background:transparent}
.tag.odds{background:transparent;color:var(--ink-soft)}
.choice[disabled]{cursor:not-allowed;opacity:.5;box-shadow:none;transform:none}
.choice .lock{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--bad)}
.choice.cont{align-items:center;flex-direction:row;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.16em;text-transform:uppercase;background:var(--ink);color:var(--paper)}
.choice.cont:hover{background:var(--magenta);color:#fff}
.panel-night + .choices .choice{}

/* hub */
.hub{border:3px solid var(--key);background:var(--paper-3);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.hub h3{margin:0;font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:1.5rem;line-height:1}
.hub .slots{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.slotpip{width:16px;height:16px;border:2px solid var(--key);border-radius:50%}
.slotpip.on{background:var(--magenta)}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:10px}
.hub-grid .choice{box-shadow:3px 3px 0 var(--key)}

/* ---------- Cards ---------- */
.card{position:relative;border:3px solid var(--key);background:var(--key);color:#F3F1EA;padding:32px 22px;overflow:hidden;box-shadow:var(--shadow);text-align:center}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.10) 1px,transparent 1.5px) 0 0/6px 6px;pointer-events:none}
.card .k{font-family:var(--mono);font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:#B9B7C2;position:relative}
.card .h{font-family:var(--display);font-weight:900;font-size:clamp(2.2rem,8vw,3.6rem);line-height:.92;text-transform:uppercase;letter-spacing:.02em;margin-top:8px;position:relative;
  text-shadow:-3px 0 0 rgba(0,137,191,.85),3px 0 0 rgba(200,0,106,.85);text-wrap:balance}
.card.cold{background:var(--paper-3);color:var(--ink);padding:14px 18px;text-align:left;display:flex;gap:12px;align-items:center}
.card.cold::before{display:none}
.card.cold .k{color:var(--ink-soft)}
.card.cold .rec{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.card.tag-card{background:var(--magenta)}

/* ---------- Title screen ---------- */
.titlescreen{max-width:46rem;margin:0 auto;padding-inline:16px;padding-block:40px 80px;display:flex;flex-direction:column;gap:22px}
.logo{position:relative;border:4px solid var(--key);background:var(--key);color:#F3F1EA;padding:48px 22px 34px;overflow:hidden;box-shadow:8px 8px 0 var(--magenta)}
.logo::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(56,182,234,.22) 1px,transparent 1.6px) 0 0/7px 7px;
  -webkit-mask-image:radial-gradient(circle at 78% 40%,#000 0,#000 18%,transparent 60%);mask-image:radial-gradient(circle at 78% 40%,#000 0,#000 18%,transparent 60%)}
.logo .hole{position:absolute;right:-6%;top:-18%;width:min(62%,330px);aspect-ratio:1;border-radius:50%;background:#000;
  box-shadow:0 0 0 3px rgba(255,213,0,.9),0 0 0 9px rgba(200,0,106,.55),0 0 0 16px rgba(0,137,191,.4),0 0 60px 20px rgba(0,137,191,.25)}
.logo .pre{position:relative;font-family:var(--mono);letter-spacing:.42em;font-size:.78rem;text-transform:uppercase;color:#B9B7C2}
.logo h1{position:relative;margin:.15em 0 0;font-family:var(--display);font-weight:900;font-size:clamp(3.2rem,15vw,7.2rem);line-height:.82;text-transform:uppercase;letter-spacing:-.005em;
  text-shadow:-4px 0 0 rgba(0,137,191,.9),4px 0 0 rgba(200,0,106,.9);text-wrap:balance}
.logo .sub{position:relative;margin-top:18px;font-family:var(--body);font-style:italic;font-size:1.05rem;color:#D9D6CC;max-width:30rem}
.advisory{border:2px solid var(--key);padding:10px 14px;font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;line-height:1.5;background:var(--paper-3)}
.advisory b{letter-spacing:.14em}
.menu{display:flex;flex-direction:column;gap:10px}
.menu .choice .ct{font-family:var(--display);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:1.2rem}
.menu .sub{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase}
.confirm{border:2.5px dashed var(--bad);padding:12px;display:flex;flex-direction:column;gap:10px;font-family:var(--mono);font-size:.8rem}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2.5px solid var(--key);background:var(--paper-3);padding:8px 14px;font-family:var(--mono);font-weight:600;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:3px 3px 0 var(--key)}
.btn.primary{background:var(--ink);color:var(--paper)} .btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:hover{transform:translate(-1px,-1px)}

/* ---------- Main title sequence overlay ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:#000;color:#F3F1EA;display:grid;place-items:center;overflow:hidden}
.seq{position:relative;width:min(92vw,900px);aspect-ratio:16/9;max-height:92vh;display:grid;place-items:center}
.seq .ring{position:absolute;width:38%;aspect-ratio:1;border-radius:50%;background:#000;
  box-shadow:0 0 0 2px rgba(255,213,0,.95),0 0 0 8px rgba(200,0,106,.6),0 0 0 15px rgba(0,137,191,.45),0 0 90px 30px rgba(0,137,191,.3);animation:ring 9s ease-in-out forwards}
@keyframes ring{0%{transform:scale(.02);opacity:0}12%{opacity:1}55%{transform:scale(1)}100%{transform:scale(3.6);opacity:1}}
.seq .dots{position:absolute;inset:-20%;background:radial-gradient(circle at 1px 1px,rgba(56,182,234,.35) 1.2px,transparent 1.8px) 0 0/9px 9px;animation:drift 9s linear forwards;opacity:.5}
@keyframes drift{from{transform:scale(1) rotate(0)}to{transform:scale(1.5) rotate(6deg);opacity:0}}
.seq .credit{position:absolute;bottom:14%;left:0;right:0;text-align:center;font-family:var(--mono);letter-spacing:.38em;text-transform:uppercase;font-size:clamp(.7rem,2vw,.95rem);opacity:0}
.seq .credit b{display:block;font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:clamp(1.3rem,4.4vw,2.4rem);margin-top:6px}
.seq .ttl{position:absolute;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(2.6rem,10vw,6.4rem);line-height:.85;text-align:center;opacity:0;

grace: Okay. Fire exits are there and there. Quiet hours start at eleven on weeknights. I'm not your mom, I'm not your cop, and I'm not your therapist, but I am the person who'll find you if you choke on your own vomit, so please, for my sake, sleep on your side. Okay. Icebreaker. Two truths and a lie. I'll go first.

grace: I've seen a man's spleen in a Wawa parking lot. I'm allergic to cats. I've never been on academic probation.

/* S1 · E1 · PILOT, part 3 of 4: Act Three ("The Hitch"). */
EH.scenes('s01e01', {

  a3_day: {
    card: { kind: 'act', label: 'Act Three', title: 'The Hitch' },
    loc: 'CIRO\'S PIZZA · CECIL B. MOORE AVE',
    clock: { day: 'Sat', date: 'Aug 22', time: '4:58 PM' },
    enter: g => { if (!g.met('ciro')) { g.meet('ciro'); g.flag('met_ciro'); } },
    text: g => `Saturday is ninety-four degrees, with humidity like a wet wool blanket. Everybody on the ninth floor is going to the Welcome Week concert on Liacouras Walk tonight: free, outdoors, some Philly rapper you're pretty sure went to Central with Mikey. Simone is going with Jules. She mentions this to you three separate times in the hallway, unprompted, each time watching your face like a nature documentarian.

You have a shift.

${g.f('met_ciro') && g.f('did_ciro') ? 'Ciro sees you come in and points at the clock with a meat-cleaver hand.\n\nciro: Two minutes early. Who are you trying to impress? Go. Saturday is a war.' : 'Ciro\'s Pizza is a narrow storefront between a phone repair shop and a church that used to be a bank, and Ciro Bianchi is sixty-something and Neapolitan, with forearms like hams and an apron that has seen the fall of empires. He looks you up and down exactly once.\n\nciro: You\'re Rosa\'s boy. She called me. Twice. Once to say you\'re a good boy, once to say if anything happens to you, she burns my store down. Fourteen an hour plus tips. You deliver like a funeral, I fire you. Go. Saturday is a war.'}

He isn't exaggerating. Saturday of Welcome Week is a war. You run pies until your thighs are screaming: up and down Broad, through the medical campus, into rowhouse living rooms where whole families are watching the Phillies with the sound off and salsa music on. A girl on Norris Street tips you in Rita's gift cards. A man on 16th tips you in advice (*"Never trust a guy who says 'trust me'"*), and then says *"Trust me"* about something else.

At eleven-eighteen p.m., the phone on the wall rings, and Ciro answers it and frowns.

ciro: Halcyon. Spring Garden. The battery people, the ones in the old locomotive works. Two large plain, one buffalo chicken. Loading dock, ask for Marco.

He hangs up and looks at the slip like it smells funny.

ciro: They tip like Protestants. Go anyway.

Out the back door, Ciro's old windbreaker hangs on the hook, the green one with *CIRO'S* across the back in cracked white letters. It's ninety degrees outside. The air sits on the street like a hand.

*Saturday, you wear a jacket. Near midnight. The clocks.*${g.f('did_home') ? '\n\n*You don\'t be on Broad Street.*' : ''}`,
    choices: [
      { text: 'Take the windbreaker. You don\'t believe it. You take it anyway. Nonna said.', tag: 'Jacket',
        fx: g => { g.flag('jacket'); g.bond('nonna', { trust: 1 }); }, go: 'a3_ride' },
      { text: 'It\'s ninety degrees. Leave it. Nonna also thinks the microwave gives you thoughts.', tag: 'No jacket',
        fx: g => g.flag('jacket', false), go: 'a3_ride' }
    ]
  },

  a3_ride: {
    loc: 'BROAD STREET · SOUTHBOUND',
    night: true,
    clock: { time: '11:41 PM' },
    text: g => `Broad Street at night is the best road in the world, and nobody can tell you otherwise.

You ride south with the bag warm on your back${g.f('jacket') ? ' and the windbreaker tied around your waist like a dad at a barbecue' : ''}, and the whole city is lit up for you. The Divine Lorraine's sign burns red against the haze. The old Uptown Theater stands dark, with its terra-cotta face. There are rowhouses with every window open and every fan on, bodega cats in doorways, a kid doing wheelies on a dirt bike down the center line with a dozen more behind him, riding like a flock of birds. Heat lightning flickers silently out over Jersey. It's drizzling, barely. Steam comes up off the asphalt.

South of Girard, the rowhouses give way to warehouses and new glass. At Spring Garden there's the Baldwin Locomotive Works, a huge brick machine shop from the 1800s with windows twenty feet tall, restored so perfectly it looks fake. A sign on the lawn says **HALCYON DYNAMICS** in thin silver letters, under a logo of a bird made out of a circle.

Every window is lit. At ten to midnight. On a Saturday.

The loading dock is around back. A security guard is waiting under a caged bulb: fifties, Puerto Rican, a gray mustache, a lanyard, the tired, kind face of a man who's worked every overnight shift God ever made.

MARCO: Ciro's? God bless. They got us here all night. Some big test. Nobody tells me nothing.

He takes the pies. He's fishing out his wallet, and the steel door behind him is propped open on a fire extinguisher, and through the gap you can see a long white corridor, a glass wall, and beyond it a room full of people in lab coats who aren't moving. They're all standing very still and looking up at one big screen.

The screen says:

> APERTURE · T−00:00:58`,
    choices: [
      { text: 'Lean. Look past Marco. What *is* that?',
        check: { kind: 'd20', attr: 'wits', skill: 'investigate', dc: 14, label: 'Look inside', on: { crit: 'a3_look_in_good', success: 'a3_look_in_good', fail: 'a3_look_in_bad', fumble: 'a3_look_in_bad' } } },
      { text: 'Take the tip. Don\'t be nosy. Get back on the bike.', tag: 'Leave',
        fx: g => g.flag('halcyon_peek', false), go: 'a3_tip' }

  a3_look_in_good: {
    night: true,
    enter: g => { g.hidden('halcyon_heat', 1); g.flag('halcyon_peek', 'full'); g.know('halcyon_aperture', ['sam'], 'Inside Halcyon, a screen read APERTURE, counting down to 11:51. Below it: SUBJECT FIELD 1.9 MI · CONTAINMENT NOMINAL.'); },
    text: `You lean a half step. You see more than you should.

The countdown takes up the whole top of the screen. Below it, smaller lines are scrolling:

> CONTAINMENT · NOMINAL
> SUBJECT FIELD · 1.9 MI
> SEAM COHERENCE · 0.997

And down at the front of the room, right up against the glass, a woman with silver hair cut short as a man's, in a gray cardigan, stands with her palms pressed together in front of her mouth. It's the way Nonna holds her hands at Mass, during the part where the bread becomes something else.

A man beside her (gray polo, no lab coat, a tablet in his hand) turns his head and looks straight down the corridor. Through the glass, through the gap in the door, he looks right at you.

He doesn't look angry. He looks like he's memorizing you.

Marco steps sideways into your view, smooth as a church usher.

  a3_look_in_bad: {

    text: `You lean. Marco leans with you, easily, a big friendly body filling the doorway, and all you get is the word one more time, huge and white, before the steel door swings shut on its own:

Above the dock, a camera in a black dome turns, slowly, to look at you.

MARCO: Okay, papa. Here. Twenty. Go home. Go home, okay?`,

  a3_tip: {
    night: true,
    enter: g => { g.money(20); if (!g.f('halcyon_peek')) g.hidden('halcyon_heat', 0.5); },
    text: g => `He presses a twenty into your hand. Protestants, Ciro said. Ciro was wrong.

You coast back out to Broad Street and stop at the light at Spring Garden. One foot down. The e-bike hums under you. It's 11:50 by the bank clock on the corner. Your phone says the same.

Northbound, a SEPTA bus, the 16, is coming down Broad way too fast on the wet asphalt.

In the crosswalk, a little boy in a Spider-Man backpack holds his grandmother's hand. She's looking at her phone.

${g.f('jacket') ? 'For no reason you can name, you untie the windbreaker from your waist and put it on. It\'s ninety degrees. You zip it to your chin.' : 'A drop of sweat runs down your spine. It\'s ninety degrees. You think, for no reason, of your grandmother\'s hands on your face.'}

  a3_light: {

    enter: g => {
      g.recap('At 11:51:04 on Saturday night, every clock in North Philadelphia stopped. You didn\'t.');

    },
    text: g => `The light. The silence. The rain hanging in the air like beads on a curtain.

It's colder than anything you've ever felt, colder than the walk-in at Dolores', colder than the January the pipes burst on Mifflin Street. ${g.f('jacket') ? 'Ciro\'s windbreaker crackles with frost across your shoulders, and inside it you\'re okay, you\'re *okay*. Nonna. Nonna, how did you know.' : 'Your bare arms go white, then red, then numb. Your fingers won\'t close all the way around anything. Nonna. *Nonna.*'}

You're off the bike. You're running into the rain that isn't falling, and each drop breaks against you like a tiny bulb of ice.

The bus is moving. That's the thing. It isn't stopped like everything else. It's *slow*, slow as the minute hand on a clock, but it's coming, a wall of white metal with an ad for a personal-injury lawyer on the side, its front tire already skidding sideways on the wet. The driver is frozen behind the windshield with her mouth open in a perfect O.

The boy is in the middle of the crosswalk, one sneaker lifted. The grandmother is a step behind him, her thumb paused mid-scroll on her phone screen, which shows a photo of the boy, blowing out candles.

You have no idea how long this lasts. You have no idea what this is. You only know one thing, with total certainty, the way you know your own name:

*Somebody has to.*`,
    choices: [
      { text: 'The kid. Go for the kid. *Now.*',
        check: { kind: 'pool', attr: 'reflex', skill: 'athletics', diff: 3, label: 'Reach him', forceRewind: true, on: { crit: 'a3_out_clean', success: 'a3_out_clean', partial: 'a3_out_partial', fail: 'a3_out_fail', botch: 'a3_out_fail' } },
        fx: g => { g.flag('hitch_choice', 'kid'); g.hidden('revenant_drift', 0.3); } },
      { text: 'The bus. Get to the driver. Get the wheel.',
        check: { kind: 'pool', attr: 'body', skill: 'athletics', diff: 3, label: 'Turn the bus', forceRewind: true, on: { crit: 'a3_out_clean', success: 'a3_out_clean', partial: 'a3_out_partial', fail: 'a3_out_fail', botch: 'a3_out_fail' } },
        fx: g => { g.flag('hitch_choice', 'wheel'); g.hidden('revenant_drift', 0.3); } },
      { text: 'Stop. Breathe. *Look at the whole street first.* You\'ve got time. Maybe. Use it.',
        check: { kind: 'd20', attr: 'wits', skill: 'investigate', dc: 12, label: 'See it all', on: { crit: 'a3_look_good', success: 'a3_look_good', fail: 'a3_look_bad', fumble: 'a3_look_bad' } },

    text: `You stop.

It's the hardest thing your body has ever done. Every muscle is screaming *go*, and you stand in the frozen rain and make yourself *look*, the way Coach used to make you read the batter before the pitch.

The bus's front wheel is skidding left. The grandmother is a half step behind the boy, out of the bus's line if she stays where she is. The boy isn't. And on the far curb, there's a parked white van with its hazards frozen mid-blink: a big, empty, unbreakable thing.

    text: `You stop, and you look, and the street is too big. Your brain can't hold it. It's like trying to read a page while someone's ripping it out of your hands. The bus. The kid. The grandmother. The van. The frost crawling up a lamppost. Everything is important, and nothing makes sense.

    text: g => `${g.last && g.last.rewound ? 'For a second you *fail*. You feel it happen. You\'re a step short and the bus is there, it\'s *there*. Then the world tears down the middle like a page, and everything runs backward. The frozen rain falls *up*. Your footsteps un-happen behind you. You\'re back at the curb with your heart going like a jackhammer, and something in the back of your skull says, in a voice that sounds a lot like yours, *No. Again.*\n\nAgain.\n\n' : ''}${g.f('hitch_choice') === 'wheel' ? 'You hit the bus door at a dead run. It\'s locked, folded shut, but the driver\'s side window is open a crack for air, and you get your arm through the gap up to the shoulder and get your hand on the wheel, and you *pull*. It turns. It turns like moving a car with your bare hands through wet cement. The front of the bus swings slowly away from the crosswalk, toward the parked van, and you let go and drop and roll.' : 'You get to the boy. You scoop him up, backpack and all, like a grounder you were always going to get, and keep going. Your feet barely touch. Three steps, four, then the curb. You set him down on the far sidewalk under the bank clock and turn around.\n\nThe grandmother is still a half step back, out of the bus\'s line. ' + (g.f('hitch_choice') === 'look' ? 'And you\'re already moving again. Back across. Up onto the bus\'s bumper. Your arm through the driver\'s cracked-open window to the wheel. You *pull*, and it turns like cement, and the bus swings away from her toward the empty van, and you drop and roll.' : 'You were right. The line of the bus misses her by a foot. It\'s going to miss her by a foot. You stand there and shake.')}

And then.

${g.f('hitch_choice') === 'wheel' ? 'You get your arm through the driver\'s window and haul the wheel, and the bus turns, but not enough. You feel something in your side go *pop* against the window frame. The bumper clips the grandmother\'s outstretched arm as it swings past.' : 'You get the boy. You scoop him up and run, and the bus comes through the crosswalk where he was standing. But the grandmother has stepped forward after him. Of course she has. Its side mirror catches her arm as it goes past.'}

!! ~SLAM

Sound comes back like a slammed door: the engine, the rain, the crunch of metal as the bus hits the parked van, a car alarm. The grandmother is on her knees on the wet asphalt holding her wrist, which is bent in a way wrists don't bend. She's not screaming for herself. She's screaming for the boy, *¡Jayden! ¡JAYDEN!*, until she sees him on the sidewalk, holding your hand, and then she just sobs.

She's hurt. She's alive. He's alive.

Your nose is pouring blood down your chin. ${g.f('hitch_choice') === 'wheel' ? 'Every breath stabs you in the ribs. ' : ''}You're so hungry you're shaking.

jayden: You were the cold man.`,

    text: g => `You fail.

${g.f('hitch_choice') === 'wheel' ? 'You get your arm through the window and haul, and the bus barely turns, and you\'re thrown off the bumper into the side of the van hard enough to hear something in your chest crack.' : 'You get the boy. You get him, you\'ve got him in your arms and you\'re running, but your shoulder clips the bus\'s front corner and you\'re spun into the side of the van hard enough to hear something in your chest crack.'} The bus comes on through the crosswalk.

Sound comes back all at once. Metal. A car alarm. Glass. Then, worst of all, a silence where the grandmother's voice should be.

She's lying in the street, crumpled at the hip, ten feet from where she was standing. She's breathing. You can see her breathing. She's looking at the sky, and her lips are moving, and when you crawl over to her on your hands and knees, you hear what she's saying. She's praying, in Spanish, for the boy.

jayden: You were the cold man.

  a3_after: {
    night: true,
    loc: 'BROAD & SPRING GARDEN · 11:51:05 PM',
    enter: g => {
      g.know('jayden_cold_man', ['sam'], 'The boy, Jayden, called you "the cold man."');

      g.recap('You pulled a little boy named Jayden out from in front of the 16 bus. He called you "the cold man."');

    text: g => `North Philadelphia is dark.

Not *dim*: dark. Every streetlight on Broad is out, every window, every traffic signal, all the way up to the Divine Lorraine, whose red sign is gone like somebody blew out a candle. The only light comes from car headlights, and from the Halcyon building, which is still blazing, every window white, like it's the only thing in the city that got the memo.

And from above. There's something in the sky over the city: a slow ripple of color, green and violet, folding over itself like a curtain in a draft. Like the Northern Lights, if they'd never heard of the North.

    text: g => `You take the Broad Street Line south, eleven stops of humming orange seats and a guy selling phone chargers out of a duffel. You come up into South Philly sunlight at Tasker-Morris and walk the four blocks, and Mifflin Street is exactly the same as it was three days ago, which feels impossible. The same stoops, the same plastic chairs, the same Mrs. Iacobucci hosing down the same piece of sidewalk she's been hosing down since 1974.

    text: g => `The roof door has an alarm on it that hasn't worked since 2009, according to a Reddit thread Nik found. The roof itself is gravel and HVAC units and the whole of Philadelphia spread out around you: Center City glittering to the south, the Delaware a black ribbon to the east, the Hitch-sky long gone and only a regular orange city haze left behind.

  a4_monday: {

    enter: g => { g.sleep(g.f('did_nap') ? 7 : 5); g.meet('weisz'); },
    text: g => `Your first college class is a hundred and twenty freshmen in a sloped lecture hall that smells like dry-erase marker. It's taught by a small, rumpled man in a corduroy jacket in August, with a beard like a startled bird's nest.

DR. WEISZ: Philadelphia is not a city. It is a *stack* of cities. Lenape, Swedish, Quaker, industrial, ruined, renewed. They lie on top of one another like pages in a book someone keeps writing in without erasing. You are walking, every day, on top of all of them at once.

He paces. He doesn't use slides. He doesn't seem to blink.

DR. WEISZ: Here is a fun fact for the drowsy. On May 10th, 1876, at the opening of the Centennial Exposition in Fairmount Park, President Grant and the Emperor of Brazil turned on the Corliss Engine, the largest steam engine in the world, to power the entire fair. And it ran. And at 1:22 p.m., according to three separate newspapers and the diary of a very bored telegraph clerk, it *stopped*. For what one witness called "the length of a heartbeat." Every clock in the hall. Then everything started again, and nobody could explain it, so everyone agreed it hadn't happened.

He stops pacing.

DR. WEISZ: Some of you were in North Philadelphia on Saturday night.

He's looking at the room, but for a second his eyes land on you and *stay*, like a finger stopping on a line of text.

  /* ================= Dice tray ================= */
  function openTray(c, cb) {
    const calc = EH.checkCalc(S, c);
    const g = EH.api(S);
    const state = { push: false, burst: false };
    const wrap = el('div', 'tray-wrap'); wrap.setAttribute('role', 'dialog'); wrap.setAttribute('aria-modal', 'true');
    const kindLbl = c.kind === 'pool' ? 'd10 Pool · Difficulty ' + c.diff : c.kind === 'move' ? '2d6 Move · ' + (c.move || '') : 'd20 Check · DC ' + c.dc;
    wrap.innerHTML = '<div class="tray"><div class="hd"><span class="lbl">' + esc(c.label || 'Roll') + '</span><span class="kind">' + esc(kindLbl) + '</span></div><div class="bd"><div class="calc" id="calc"></div><div id="oddsBox"></div><div class="pushes" id="pushes"></div><div class="dicefield" id="field" aria-live="polite"></div><div id="verdict"></div></div><div class="ft" id="tft"></div></div>';
    document.body.appendChild(wrap);
    const mod = () => {
      let m = calc.base;
      if (state.push) m += c.kind === 'pool' ? 1 : c.kind === 'move' ? 1 : 2;
      if (state.burst) m += 2;
      return c.kind === 'pool' ? Math.max(1, m) : m;
    };
    const drawCalc = () => {
      const rows = calc.rows.slice();
      if (state.push) rows.push(['Push (1 Nerve)', c.kind === 'd20' ? 2 : 1]);
      if (state.burst) rows.push(['Burst (1 Stamina)', 2]);
      const unit = c.kind === 'pool' ? ' dice' : '';
      $('#calc', wrap).innerHTML = rows.map(r => '<div class="r"><span>' + esc(r[0]) + '</span><span class="' + (r[1] < 0 ? 'neg' : 'pos') + '">' + (r[1] >= 0 ? '+' : '') + r[1] + '</span></div>').join('') +
        '<div class="r tot"><span>' + (c.kind === 'pool' ? 'Dice' : 'Modifier') + '</span><span>' + (c.kind === 'pool' ? mod() + unit : (mod() >= 0 ? '+' : '') + mod()) + '</span></div>';
      const o = EH.odds(c, mod());
      const pc = v => Math.round(v * 100);
      let bar, leg;
      if (c.kind === 'move') { bar = '<span class="o-succ" style="width:' + pc(o.success) + '%"></span><span class="o-part" style="width:' + pc(o.partial) + '%"></span>'; leg = '<span><i style="background:var(--cyan)"></i>Strong ' + pc(o.success) + '%</span><span><i style="background:var(--yellow)"></i>Weak ' + pc(o.partial) + '%</span><span><i></i>Miss ' + pc(o.fail) + '%</span>'; }
      else if (c.kind === 'pool') { bar = '<span class="o-crit" style="width:' + pc(o.crit) + '%"></span><span class="o-succ" style="width:' + pc(o.success) + '%"></span><span class="o-part" style="width:' + pc(o.partial) + '%"></span>'; leg = '<span><i style="background:var(--magenta)"></i>Crit ' + pc(o.crit) + '%</span><span><i style="background:var(--cyan)"></i>Success ' + pc(o.success) + '%</span><span><i style="background:var(--yellow)"></i>Partial ' + pc(o.partial) + '%</span><span><i></i>Fail ' + pc(o.fail) + '%</span>'; }
      else { bar = '<span class="o-crit" style="width:' + pc(o.crit) + '%"></span><span class="o-succ" style="width:' + pc(o.success) + '%"></span>'; leg = '<span><i style="background:var(--cyan)"></i>Pass ' + pc(o.crit + o.success) + '%</span><span><i></i>Fail ' + pc(o.fail) + '%</span>'; }
      $('#oddsBox', wrap).innerHTML = '<div class="oddsbar">' + bar + '</div><div class="oddsleg">' + leg + '</div>';
    };
    const pushes = $('#pushes', wrap);
    const mkPush = (key, title, sub, can) => {
      const b = el('button', 'push', esc(title) + '<small>' + esc(sub) + '</small>'); b.setAttribute('aria-pressed', 'false');
      if (!can) b.disabled = true;

    mkPush('push', 'Push', 'Spend 1 Nerve · ' + (c.kind === 'pool' ? '+1 die' : c.kind === 'move' ? '+1' : '+2'), S.pools.nerve >= 1);
    if (c.kind === 'pool' && c.power && g.has('burst')) mkPush('burst', 'Burst', 'Spend 1 Stamina · +2 dice', S.pools.stamina >= 1);

  function dieCls(c, res, v, i) {
    let cls = 'die' + (c.kind === 'move' ? ' d6' : c.kind === 'd20' ? ' d20' : '');

    if (c.kind === 'pool') cls += v === 10 ? ' dbl' : v >= 7 ? ' hit' : v === 1 ? ' one' : '';

  function animateDice(wrap, c, res, done) {
    const field = $('#field', wrap); field.innerHTML = '';

    const nodes = res.dice.map(() => { const n = el('div', 'die roll' + (c.kind === 'move' ? ' d6' : c.kind === 'd20' ? ' d20' : ''), '?'); field.appendChild(n); return n; });

      const d = { trust: b.trust - a.trust, affection: b.affection - a.affection, respect: b.respect - a.respect, tension: b.tension - a.tension };
      if (Object.values(d).some(v => v)) out.bonds.push({ id, d, now: { trust: b.trust, affection: b.affection, respect: b.respect, tension: b.tension } });
    });

        const N = EH.NODES[n];
        const r = el('div', 'r', '<span>Power · ' + esc(N.name) + ': ' + esc(N.desc) + '</span>');
        const b = el('button', 'btn', 'Learn · ' + N.xp + ' XP');
        if (S.xp < N.xp) b.disabled = true;
        b.onclick = () => { S.xp -= N.xp; S.xpSpent += N.xp; S.powers.slip.nodes.push(n); save(); draw(); toast(N.name + ' learned'); };
        r.appendChild(b); box.appendChild(r);
      });
    };
    draw(); sec.appendChild(box); return sec;
  }

  /* ================= Drawer ================= */
  function closeDrawer() { const d = $('.drawer-wrap'); if (d) d.remove(); }
  function openDrawer(tab) {
    closeDrawer();
    const w = el('div', 'drawer-wrap');
    w.innerHTML = '<aside class="drawer" role="dialog" aria-label="Character"><div class="tabs" role="tablist">' +
      ['sheet', 'bonds', 'notes', 'settings'].map(t => '<button role="tab" data-t="' + t + '" aria-selected="' + (t === tab) + '">' + { sheet: 'Sheet', bonds: 'Bonds', notes: 'Notebook', settings: 'Settings' }[t] + '</button>').join('') +
      '<button class="x" aria-label="Close">✕</button></div><div class="body" id="dbody"></div></aside>';
    document.body.appendChild(w);
    w.addEventListener('click', e => { if (e.target === w) closeDrawer(); });
    $('.x', w).onclick = closeDrawer;
    w.querySelectorAll('[data-t]').forEach(b => b.onclick = () => openDrawer(b.dataset.t));
    const body = $('#dbody', w);
    ({ sheet: drawSheet, bonds: drawBonds, notes: drawNotes, settings: drawSettings })[tab](body);
  }
  const dots5 = n => '<div class="dots5">' + [1, 2, 3, 4, 5].map(i => '<i class="' + (i <= n ? 'on' : '') + '"></i>').join('') + '</div>';
  const bar = (v, max, cls) => '<div class="bar ' + (cls || '') + '"><span style="width:' + Math.max(0, Math.min(100, v / max * 100)) + '%"></span></div>';
  function drawSheet(b) {
    b.innerHTML =
      '<div class="sec"><h4>Sam Kearney</h4><div class="mono" style="font-size:.74rem;color:var(--ink-soft)">18 · Temple University, undeclared · Cardone Hall 9-14 · Ciro\'s Pizza, delivery</div></div>' +
      '<div class="sec"><h4>Attributes</h4><div class="attrs">' + EH.ATTRS.map(k => '<div class="attr"><span class="n">' + EH.ATTR_NAMES[k] + '</span><span class="v">' + S.attrs[k] + '</span>' + dots5(S.attrs[k]) + '</div>').join('') + '</div></div>' +
      '<div class="sec"><h4>Pools</h4><div style="display:flex;flex-direction:column;gap:8px">' +
      ['stamina', 'focus', 'nerve'].map((p, i) => '<div class="meter"><div class="row"><span>' + p + '</span><span>' + S.pools[p] + ' / ' + EH.maxPool(S, p) + '</span></div>' + bar(S.pools[p], EH.maxPool(S, p), ['m', 'c', 'y'][i]) + '</div>').join('') +
      '<div class="meter"><div class="row"><span>Sleep Debt</span><span>' + S.sleepDebt + ' / 10</span></div>' + bar(S.sleepDebt, 10, 'r') + '</div>' +
      (S.powers.slip.nodes.length ? '<div class="meter"><div class="row"><span>Drift</span><span>' + S.drift + ' / 10</span></div>' + bar(S.drift, 10, 'c') + '</div>' : '') +
      '</div></div>' +
      '<div class="sec"><h4>Skills</h4><div class="skills">' + Object.keys(EH.SKILLS).map(k => '<div class="s' + (S.skills[k] ? '' : ' zero') + '"><span>' + (S.marked[k] ? '<span class="mk">●</span> ' : '') + EH.SKILLS[k] + '</span><span>' + S.skills[k] + '</span></div>').join('') + '</div>' +
      '<div class="mono" style="font-size:.66rem;color:var(--ink-faint);margin-top:6px">● marked: used this episode, can be raised at episode end.</div></div>' +
      (S.powers.slip.nodes.length ? '<div class="sec"><h4>Powers · the Slip</h4><div style="display:flex;flex-direction:column;gap:6px">' +
        Object.keys(EH.NODES).map(n => { const has = S.powers.slip.nodes.includes(n); const N = EH.NODES[n]; return '<div class="node' + (has ? '' : ' locked') + '"><b>' + (has ? N.name : '???') + '</b><span>' + (has ? N.desc : 'Locked') + '</span></div>'; }).join('') +
        '<div class="meter"><div class="row"><span>Mastery</span><span>' + S.powers.slip.mastery + ' / 100</span></div>' + bar(S.powers.slip.mastery, 100, 'm') + '</div></div></div>' : '') +
      '<div class="sec"><h4>Life</h4><dl class="kv">' +
      '<dt>Cash</dt><dd>$' + S.money.cash + '</dd><dt>Bank</dt><dd>$' + S.money.bank + '</dd>' +
      Object.keys(EH.COURSES).map(k => '<dt>' + esc(EH.COURSES[k].split(' ').slice(0, 2).join(' ')) + '</dt><dd>' + S.grades[k] + '</dd>').join('') +
      '<dt>XP</dt><dd>' + S.xp + '</dd>' +
      '<dt>Injuries</dt><dd>' + (S.injuries.length ? S.injuries.map(i => esc(i.name)).join(', ') : 'None') + '</dd></dl></div>';
  }
  function drawBonds(b) {
    const ids = Object.keys(S.bonds).filter(id => S.bonds[id].met);
    const watchers = Object.keys(S.heat).filter(id => id !== 'halcyon' && S.heat[id] > 0);
    b.innerHTML = '<div class="sec"><h4>Bonds</h4><div class="mono" style="font-size:.7rem;color:var(--ink-soft)">Trust, Affection, and Respect run −10 to +10. Tension (0–10) is unresolved friction, whatever kind it is.</div></div>';
    const list = el('div', '', ''); list.style.cssText = 'display:flex;flex-direction:column;gap:10px';
    ids.forEach(id => {
      const B = S.bonds[id], C = EH.CAST[id] || { full: id, role: '' };
      const row = (k, v, bi) => '<span>' + k + '</span>' + (bi ? '<div class="bar bi ' + (v >= 0 ? 'c' : 'r') + '"><span style="' + (v >= 0 ? 'left:50%;width:' + v * 5 + '%' : 'left:' + (50 + v * 5) + '%;width:' + (-v * 5) + '%') + '"></span></div>' : bar(v, 10, 'm')) + '<span class="num">' + (bi && v > 0 ? '+' : '') + v + '</span>';
      list.appendChild(el('div', 'bondcard', '<div class="nm"><span style="color:var(--c-' + id + ')">' + esc(C.full) + '</span><small>' + esc(C.role) + '</small></div><div class="bgrid">' +
        row('Trust', B.trust, true) + row('Affection', B.affection, true) + row('Respect', B.respect, true) + row('Tension', B.tension, false) +
        (S.heat[id] ? '<span>Suspicion</span>' + bar(S.heat[id], 10, 'y') + '<span class="num">' + S.heat[id] + '</span>' : '') + '</div>'));
    });
    if (!ids.length) list.appendChild(el('div', 'mono', 'You haven\'t met anyone yet.'));
    b.appendChild(list);
    if (watchers.length) {
      const sec = el('div', 'sec', '<h4>Suspicion</h4>');
      sec.appendChild(el('dl', 'kv', watchers.map(w => '<dt>' + esc(EH.WATCHERS[w] || (EH.CAST[w] && EH.CAST[w].full) || w) + '</dt><dd>' + S.heat[w] + ' / 10</dd>').join('')));
      b.appendChild(sec);
    }
  }
  function drawNotes(b) {
    const facts = Object.keys(S.facts).filter(k => S.facts[k].knownBy.includes('sam'));
    const secretFacts = facts.filter(k => S.facts[k].track);
    let h = '';
    if (secretFacts.length) {
      h += '<div class="sec"><h4>Who knows</h4><div class="notelist">' + secretFacts.map(k => { const F = S.facts[k]; const who = F.knownBy.filter(w => w !== 'sam' && (!F.hiddenFrom || !F.hiddenFrom.includes(w))).map(w => EH.CAST[w] ? EH.CAST[w].label : w); return '<div class="it"><small>' + esc(F.text) + '</small>' + (who.length ? esc(who.join(', ')) : 'Nobody. Just you.') + '</div>'; }).join('') + '</div></div>';
    }
    h += '<div class="sec"><h4>What you know</h4><div class="notelist">' + (facts.filter(k => !S.facts[k].track).map(k => '<div class="it">' + esc(S.facts[k].text) + '</div>').join('') || '<div class="mono">Nothing yet.</div>') + '</div></div>';
    const ep = episode();
    h += '<div class="sec"><h4>This episode</h4><div class="notelist">' + (S.epLog.filter(e => e.choice).map(e => '<div class="it"><small>' + esc((ep && ep.scenes[e.scene] && ep.scenes[e.scene].loc) || '') + '</small>' + esc(e.choice) + (e.roll ? ' <span class="mono">[' + esc(EH.TIER_NAMES[e.roll.tier]) + ']</span>' : '') + '</div>').join('') || '<div class="mono">No choices yet.</div>') + '</div></div>';
    if (S.recap.length) h += '<div class="sec"><h4>The story so far</h4><div class="notelist">' + S.recap.map(r => '<div class="it"><small>' + esc(EH.episodes[r.ep] ? epCode(EH.episodes[r.ep]) : r.ep) + '</small>' + EH.inline(r.t) + '</div>').join('') + '</div></div>';
    b.innerHTML = h;
  }
  function drawSettings(b) {
    b.innerHTML = '<div class="sec"><h4>Settings</h4></div>';
    const row = (label, ctl) => { const r = el('div', 'setrow', '<span>' + esc(label) + '</span>'); r.appendChild(ctl); b.appendChild(r); };
    const snd = el('button', 'btn', S.settings.sound ? 'On' : 'Off'); snd.onclick = () => { toggleSound(); openDrawer('settings'); }; row('Sound', snd);
    const mot = el('button', 'btn', S.settings.motion ? 'On' : 'Off'); mot.onclick = () => { S.settings.motion = !S.settings.motion; save(); openDrawer('settings'); }; row('Animation', mot);
    const sz = el('div', 'row'); sz.style.cssText = 'display:flex;gap:6px';
    [['A−', 0.92], ['A', 1], ['A+', 1.1], ['A++', 1.22]].forEach(([l, v]) => { const x = el('button', 'btn', l); if (S.settings.size === v) x.style.background = 'var(--yellow)'; x.onclick = () => { S.settings.size = v; applySize(); save(); openDrawer('settings'); }; sz.appendChild(x); });
    row('Text size', sz);
    row('Save sync', el('span', 'mono', syncState === 'ok' ? 'Synced to your account' : syncState === 'err' ? 'Sync error; saved on this device' : 'Saved on this device'));
    const rs = el('button', 'btn danger', 'Restart episode');
    rs.onclick = () => confirmBox(rs.parentNode, 'Restart this episode from the top? Everything you did in it is undone.', 'Restart', () => {
      const keep = S.settings, start = S.epStart, id = S.ep;
      if (!start) return;
      S = EH.clone(start); S.settings = keep; S.done = S.done.filter(x => x !== id); delete S.eps[id];
      startEpisode(id);
    });
    row('This episode', rs);
    const tt = el('button', 'btn', 'Title screen'); tt.onclick = () => renderTitle(); row('Menu', tt);
  }
  function applySize() { document.documentElement.style.setProperty('--fs', (1.075 * ((S && S.settings.size) || 1)) + 'rem'); }

  /* ================= Boot ================= */
  function start(data) {
    const raw = (data && data.S) ? null : lsGet(LS_KEY);
    if (data && data.S) { S = data.S; TRAIL = data.TRAIL || []; }
    else if (raw) { try { S = JSON.parse(raw); TRAIL = JSON.parse(lsGet(LS_TRAIL) || '[]'); } catch (e) { S = null; TRAIL = []; } }
    if (S && !S.settings) S.settings = { sound: false, size: 1, motion: true };
    if (S) S.settings.sound = false; // audio needs a fresh gesture each session
    applySize();
    renderTitle();
    initDb();
  }
  const H = window.claude && window.claude.hot;
  if (H && typeof H.snapshot === 'function') { try { H.snapshot(() => ({ S, TRAIL })); } catch (e) { } }
  if (H && typeof H.ready === 'function') H.ready(start); else start((H && H.data) || {});
})();

</script>
