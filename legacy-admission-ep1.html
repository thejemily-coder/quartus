<title>Legacy Admission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&family=DM+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow reading column like a script on a nightstand. Sticky header with Notebook,
   a log that grows downward, and a bottom bar holding Continue. Title cards are full-bleed black. */
:root{
  --bg:#f1f2f0; --panel:#ffffff; --fg:#1b1f1d; --muted:#5b6561; --line:#d4d9d6;
  --accent:#b3123f; --accent-ink:#ffffff; --moss:#17665a; --soft:#e7ebe8;
  --ink:#0b0d0c; --ink-fg:#f1ece4; --ink-dim:#a49d95;
  --good:#17665a; --bad:#b3123f;
  --c-theo:#b3123f; --c-coop:#8a5a00; --c-dez:#5a3fb0; --c-josie:#17665a; --c-del:#7a5a2c;
  --c-wren:#b0276f; --c-savannah:#9a7a00; --c-fenn:#3b5f8a; --c-lurleen:#6b2f6b; --c-ladies:#555f5b;
  --c-hunter:#8a3b2c; --c-colt:#a12a2a; --c-graham:#444c49;
  --display:"Bodoni Moda","Didot",Georgia,serif; --body:"Newsreader",Georgia,"Times New Roman",serif; --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1110; --panel:#141b19; --fg:#e8ebe7; --muted:#8e9a96; --line:#26302d;
  --accent:#ff5c8f; --accent-ink:#1a0710; --moss:#4fd1b5; --soft:#1b2421; --good:#4fd1b5; --bad:#ff5c8f;
  --c-theo:#ff5c8f; --c-coop:#e0a93b; --c-dez:#a994ff; --c-josie:#4fd1b5; --c-del:#d1a46b;
  --c-wren:#ff7bbd; --c-savannah:#e8cb4a; --c-fenn:#7fb0e8; --c-lurleen:#d08ad0; --c-ladies:#a3afab;
  --c-hunter:#f0866f; --c-colt:#ff7070; --c-graham:#a3afab; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1110; --panel:#141b19; --fg:#e8ebe7; --muted:#8e9a96; --line:#26302d;
  --accent:#ff5c8f; --accent-ink:#1a0710; --moss:#4fd1b5; --soft:#1b2421; --good:#4fd1b5; --bad:#ff5c8f;
  --c-theo:#ff5c8f; --c-coop:#e0a93b; --c-dez:#a994ff; --c-josie:#4fd1b5; --c-del:#d1a46b;
  --c-wren:#ff7bbd; --c-savannah:#e8cb4a; --c-fenn:#7fb0e8; --c-lurleen:#d08ad0; --c-ladies:#a3afab;
  --c-hunter:#f0866f; --c-colt:#ff7070; --c-graham:#a3afab; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:19px;line-height:1.6;padding-inline:16px;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:700px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.02em;font-size:18px}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

#log{flex:1;padding-block:28px 24px;display:flex;flex-direction:column;gap:18px}
#log>*{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.slug{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-left:3px solid var(--accent);padding-left:12px;margin-top:14px}
.n{margin:0;text-wrap:pretty}
.n.em{font-style:italic}
.s{display:flex;flex-direction:column;gap:2px}
.s .who{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--muted))}
.s .say{margin:0;padding-left:14px;border-left:2px solid var(--c,var(--line))}
.s.me .say{font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted)}
.chip.up{color:var(--good)}.chip.down{color:var(--bad)}
.thread{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:6px;max-width:440px}
.thread .top{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:6px}
.bub{max-width:82%;padding:8px 13px;border-radius:18px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4}
.bub.them{align-self:flex-start;background:var(--soft)}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.bub .nm{display:block;font-size:11px;opacity:.7;margin-bottom:1px}
.choice{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.choice .q{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.picked{border-color:var(--accent);background:var(--soft)}
.opt.gone{opacity:.4}
.opt.locked{opacity:.55;border-style:dashed}
.opt .t{display:block}
.opt .tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--moss);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.tag.lock{color:var(--muted)}
.roll{font-family:var(--mono);font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
.roll b{letter-spacing:.12em;text-transform:uppercase;font-size:12px}
.roll .res{font-size:15px}
.roll .res.pass{color:var(--good)}.roll .res.fail{color:var(--bad)}

.dock{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;justify-content:center;min-height:66px}
.dock .go{width:100%;max-width:700px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:13px;font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.dock .hint{align-self:center;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* title cards: black like a broadcast, in both themes */
.card{position:fixed;inset:0;z-index:20;background:var(--ink);color:var(--ink-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;gap:14px;animation:fade .7s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card .k{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-dim)}
.card h1{font-family:var(--display);font-weight:700;font-size:clamp(38px,9vw,76px);line-height:1.04;margin:0;text-wrap:balance;max-width:14ch}
.card h1 em{color:var(--accent);font-style:italic;font-weight:500}
.card p{margin:0;font-style:italic;color:var(--ink-dim);max-width:34ch}
.card .btn{margin-top:22px;background:transparent;color:var(--ink-fg);border-color:#4a4540}
.card .btn:hover{border-color:var(--accent)}
.card .fine{font-family:var(--mono);font-size:11px;font-style:normal;letter-spacing:.04em;line-height:1.6;max-width:46ch;color:var(--ink-dim)}
.card .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* notebook drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:31;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.drawer h2{font-family:var(--display);font-size:26px;margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .btn[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panelrow{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.panelrow h3{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--fg))}
.panelrow p{margin:0;font-size:16px;color:var(--muted);line-height:1.45}
.meter{display:grid;grid-template-columns:70px 1fr 28px;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meter i{display:block;height:6px;background:var(--soft);border-radius:3px;position:relative;overflow:hidden}
.meter i b{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--accent))}
.meter span{font-variant-numeric:tabular-nums;text-align:right;color:var(--fg)}
.ledger li{margin:0 0 10px;font-size:16px}
.ledger{padding-left:18px;margin:0}
.empty{font-style:italic;color:var(--muted);font-size:16px}
.gossip{font-family:var(--mono);font-size:13px;letter-spacing:.02em;line-height:1.55;border-top:1px solid var(--ink-dim);padding-top:10px;text-align:left;color:var(--ink-fg)}
.gossip li{margin-bottom:8px}
@media (prefers-reduced-motion:reduce){#log>*,.card{animation:none}}
@media (max-width:420px){body{font-size:18px}}
</style>

<div class="app" id="app">
  <header class="bar">
    <div class="brand">Legacy Admission<small id="actLabel">Season 1 &middot; Episode 1</small></div>
    <button class="btn" id="nbBtn" type="button">Notebook</button>
  </header>
  <main id="log" aria-live="polite"></main>
  <div class="dock" id="dock"><span class="hint">Loading</span></div>
</div>
<div id="overlay"></div>

<script>
/* ---------- state ---------- */
const KEY='legacy-admission-s1-v1';
const PEOPLE=['josie','wren','coop','dez','savannah','del','lurleen','fenn','colt'];
const NAMES={theo:'You',coop:'Coop',dez:'Dez',josie:'Josie',del:'Del',wren:'Wren',savannah:'Savannah-Claire',fenn:'Dr. Fenn',lurleen:'Mayor Lurleen',birdie:'Birdie',mavis:'Mavis',ladies:'The Gazebo Ladies',hunter:'Hunter',colt:'Colt',graham:'Dad',odell:'Ms. Odell'};
const BLURB={
 josie:'Pre-med on scholarship. Works the Blue Plate counter. Allergic to rich-kid nonsense.',
 wren:'Sophomore transfer. Theatre. The funniest person at any party and the saddest at the end of it.',
 coop:'Your roommate. Lacrosse recruit. Sweet as pie, dense as a brick, hitting his head a lot.',
 dez:'Your RA. Smarter than everybody. Will not lie to you and expects the same.',
 savannah:'President of Delta Magnolia Pi. Runs her chapter like a small government.',
 del:'Josie’s mother. Owns the Blue Plate. Sees through you in about ten seconds.',
 lurleen:'Mayor. Funeral director. Notary. Knows what you did before you do.',
 fenn:'Poetry professor. Brilliant. Often horizontal.',
 colt:'Your oldest friend from St. Aldric’s. Now, somehow, here.'};
const fresh=()=>({stats:{charm:3,nerve:1,wit:2,heart:1},rep:{campus:0,town:0},dep:0,buzz:0,
  rel:Object.fromEntries(PEOPLE.map(p=>[p,{trust:0,desire:0,loyalty:0}])),flags:{},ledger:[],scene:'cold'});
let G=fresh();
let stack=[],busy=false,waitFn=null;
const $=id=>document.getElementById(id);
const log=$('log'),dock=$('dock');
const cap=s=>s[0].toUpperCase()+s.slice(1);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function save(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function wipe(){try{localStorage.removeItem(KEY)}catch(e){}}

/* effective stat, with a temporary buzz modifier */
function eff(st){let v=G.stats[st];if(G.buzz>=1&&st==='nerve')v+=1;if(G.buzz>=2&&st==='wit')v-=1;return v}

function apply(fx){
  const chips=[];
  for(const k in fx){const v=fx[k];
    if(v===0)continue;
    if(k.startsWith('flag:')){G.flags[k.slice(5)]=v;continue}
    if(k==='dep'){G.dep+=v;continue}
    if(k==='buzz'){G.buzz=Math.max(0,G.buzz+v);continue}
    if(k in G.stats){G.stats[k]+=v;chips.push([cap(k)+' '+(v>0?'+':'')+v,v>0]);continue}
    if(k.startsWith('rep.')){const r=k.slice(4);G.rep[r]+=v;chips.push([(v>0?'▲ ':'▼ ')+(r==='campus'?'Campus':'Town')+' reputation',v>0]);continue}
    if(k.startsWith('rel.')){const [,p,m]=k.split('.');G.rel[p][m]+=v;chips.push([(v>0?'▲ ':'▼ ')+NAMES[p].replace('Mayor ','')+' · '+cap(m),v>0])}
  }
  if(chips.length){const c=el('div','chips');chips.forEach(([t,up])=>c.append(el('span','chip '+(up?'up':'down'),esc(t))));log.append(c)}
}

/* ---------- rendering ---------- */
function scroll(){const last=log.lastElementChild;if(last)last.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'end'})}
function setDock(label,fn){
  dock.innerHTML='';waitFn=fn||null;
  if(!label){dock.append(el('span','hint','Choose'));return}
  const b=el('button','go',esc(label));b.type='button';b.onclick=()=>{if(waitFn)waitFn()};dock.append(b);
}
function say(who,text){
  if(who!=='theo'&&PEOPLE.includes(who))G.flags['met:'+who]=true;
  const d=el('div','s'+(who==='theo'?' me':''));d.style.setProperty('--c','var(--c-'+(who==='birdie'||who==='mavis'||who==='odell'?'ladies':who)+')');
  d.append(el('div','who',esc(NAMES[who]||who)));d.append(el('p','say',text));log.append(d);
}
function thread(title,msgs){
  const t=el('div','thread');t.append(el('div','top',esc(title)));
  msgs.forEach(([from,txt])=>{const b=el('div','bub '+(from==='me'?'me':'them'));
    if(from!=='me'&&from!=='them')b.append(el('span','nm',esc(NAMES[from]||from)));
    b.append(document.createTextNode(txt));t.append(b)});
  log.append(t);
}
function card(kicker,title,sub,after,extra){
  const o=el('div','card');
  o.append(el('div','k',esc(kicker)));o.append(el('h1','',title));if(sub)o.append(el('p','',esc(sub)));
  if(extra)o.append(extra);
  const b=el('button','btn','Continue');b.type='button';
  b.onclick=()=>{o.remove();document.body.style.overflow='';after()};o.append(b);
  $('overlay').append(o);document.body.style.overflow='hidden';b.focus();
}

/* ---------- engine ---------- */
function runScene(id){
  G.scene=id;save();stack=[{steps:SC[id],i:0}];next();
}
function next(){
  setDock(null);
  while(stack.length){
    const f=stack[stack.length-1];
    if(f.i>=f.steps.length){stack.pop();continue}
    const st=f.steps[f.i++];
    if(exec(st,f))return;
  }
  setDock('');
}
function pause(){scroll();setDock('Continue ▸',()=>next())}
function exec(st,f){
  const [t,a,b,c,d]=st;
  switch(t){
    case 'slug':log.append(el('div','slug',esc(a)));return false;
    case 'n':{log.append(el('p','n'+(b?' em':''),a));const nx=f.steps[f.i];if(nx&&nx[0]==='n')return false;pause();return true}
    case 's':say(a,b);pause();return true;
    case 't':thread(a,b);pause();return true;
    case 'fx':apply(a);if(b)G.ledger.push(b);return false;
    case 'led':G.ledger.push(a);return false;
    case 'act':$('actLabel').textContent=a;return false;
    case 'if':{const br=a()?b:(c||[]);if(br.length)stack.push({steps:br,i:0});return false}
    case 'go':runScene(a);return true;
    case 'card':card(a,b,c,()=>next());return true;
    case 'chk':return check(a,b,c,d);
    case 'c':return choice(a,b);
    case 'end':finish();return true;
  }
  return false;
}
function check(stat,dc,label,[pass,fail]){
  const e=eff(stat);const r1=1+Math.floor(Math.random()*6),r2=1+Math.floor(Math.random()*6);const tot=r1+r2+e;const ok=tot>=dc;
  const box=el('div','roll');box.append(el('b','',esc(cap(stat))+' check · '+esc(label)));
  const line=el('span','',`Rolling 2d6 + ${cap(stat)} ${e} against ${dc}…`);box.append(line);log.append(box);scroll();
  setDock(null);
  setTimeout(()=>{
    line.textContent=`${r1} + ${r2} + ${e} = ${tot} vs ${dc}`;
    box.append(el('span','res '+(ok?'pass':'fail'),ok?'Success':'Not this time'));
    G.flags['last:'+stat]=ok;
    stack.push({steps:ok?pass:fail,i:0});pause();
  },matchMedia('(prefers-reduced-motion:reduce)').matches?0:650);
  return true;
}
function choice(q,opts){
  const box=el('div','choice');box.append(el('div','q',esc(q)));
  const vis=opts.filter(o=>!o.show||o.show());
  const btns=[];
  vis.forEach((o,i)=>{
    const lock=o.req&&eff(o.req[0])<o.req[1];
    const bt=el('button','opt'+(lock?' locked':''));bt.type='button';bt.disabled=!!lock;
    bt.append(el('span','t',`${i+1}. ${o.t}`));
    const tg=el('span','tags');
    (o.tag||[]).forEach(x=>tg.append(el('span','tag',esc(x))));
    if(lock)tg.append(el('span','tag lock',`needs ${cap(o.req[0])} ${o.req[1]}`));
    if(tg.children.length)bt.append(tg);
    bt.onclick=()=>pick(o,bt,btns);
    btns.push(bt);box.append(bt);
  });
  box._keys=btns;log.append(box);window._ch={btns,vis,opts:vis};scroll();setDock(null);return true;
}
function pick(o,bt,btns){
  window._ch=null;
  btns.forEach(b=>{b.disabled=true;if(b!==bt)b.classList.add('gone')});bt.classList.add('picked');
  if(o.led)G.ledger.push(o.led);
  if(o.fx)apply(o.fx);
  save();
  if(o.then)stack.push({steps:o.then,i:0});
  next();
}
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('.drawer'))return;
  if(window._ch&&/^[1-9]$/.test(e.key)){const i=+e.key-1;const b=window._ch.btns[i];if(b&&!b.disabled){b.click();e.preventDefault()}return}
  if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight')&&waitFn&&document.activeElement===document.body){e.preventDefault();waitFn()}
});

/* ---------- notebook ---------- */
function openNotebook(tab='people'){
  const old=document.querySelector('.drawer');if(old){old.remove();document.querySelector('.scrim')?.remove()}
  const sc=el('div','scrim');const dr=el('aside','drawer');dr.setAttribute('role','dialog');dr.setAttribute('aria-label','Notebook');
  const close=()=>{sc.remove();dr.remove()};sc.onclick=close;
  const head=el('div','');head.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:10px';
  head.append(el('h2','','Notebook'));const x=el('button','btn','Close');x.type='button';x.onclick=close;head.append(x);dr.append(head);
  const tabs=el('div','tabs');tabs.setAttribute('role','tablist');
  const body=el('div','');body.style.cssText='display:flex;flex-direction:column;gap:12px';
  const defs=[['people','People'],['you','You'],['town','Town'],['prev','Previously']];
  const draw=k=>{
    [...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));body.innerHTML='';
    if(k==='people'){
      const met=PEOPLE.filter(p=>G.flags['met:'+p]);
      if(!met.length)body.append(el('p','empty','You haven’t met anyone yet.'));
      met.forEach(p=>{const r=el('div','panelrow');r.style.setProperty('--c','var(--c-'+(p==='lurleen'?'lurleen':p)+')');
        r.append(el('h3','',esc(NAMES[p])));r.append(el('p','',esc(BLURB[p])));
        ['trust','desire','loyalty'].forEach(m=>{const v=G.rel[p][m];const pct=Math.max(0,Math.min(100,(v+3)/10*100));
          const mm=el('div','meter',`<em style="font-style:normal">${m}</em><i><b style="width:${pct}%"></b></i><span>${v>0?'+':''}${v}</span>`);r.append(mm)});
        body.append(r)});
    }
    if(k==='you'){

  wrap.firstChild.style.cssText='font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);text-align:center';
  const row=el('div','row');
  const nb=el('button','btn','Open notebook');nb.type='button';nb.onclick=()=>openNotebook('prev');
  const again=el('button','btn','Play again');again.type='button';again.onclick=()=>{wipe();location.reload()};
  row.append(nb,again);
  wipe();
  const o2=el('div','card');
  o2.append(el('div','k','End of Episode One'));
  const h=el('h1','','The Whitlock <em>boy</em>');o2.append(h);
  o2.append(el('p','','Your choices are recorded. Episode Two, “Rush,” is built from them.'));
  o2.append(wrap);o2.append(row);
  $('overlay').append(o2);document.body.style.overflow='hidden';
  window._ep1done=true;
}

/* ---------- boot ---------- */
function intro(){
  const saved=load();
  const o=el('div','card');
  o.append(el('div','k','A Prestige Drama in Text'));
  o.append(el('h1','','Legacy <em>Admission</em>'));
  o.append(el('p','','Season One · Episode One. You are Theo Whitlock. Everybody here already knows your name.'));
  o.append(el('p','fine','Mature audiences. Contains frank sex, drinking and drug use, depictions of the aftermath of sexual assault, and bigotry. All characters are adults. Your choices are saved automatically in this browser.'));
  const row=el('div','row');
  const b=el('button','btn primary','Begin');b.type='button';
  b.onclick=()=>{o.remove();document.body.style.overflow='';G=fresh();runScene('cold')};row.append(b);
  if(saved&&saved.scene){
    const c=el('button','btn','Continue');c.type='button';
    c.onclick=()=>{o.remove();document.body.style.overflow='';G=saved;if(!G.flags)G.flags={};runScene(G.scene)};row.append(c);
  }
  o.append(row);$('overlay').append(o);document.body.style.overflow='hidden';b.focus();
}
intro();
</script>
