/* ---- Thursday night: Savannah ---- */
SC.savannah4=[
 slug('INT. THE DELTA MAGNOLIA PI HOUSE — THE PRESIDENT’S OFFICE — 10:40 P.M.'),
 n(`The sewing room is exactly as it was: a desk, a lamp, a filing cabinet marked RECIPES. Savannah-Claire sits behind the desk in a white robe, her hair in a plain braid, her face scrubbed bare. She looks, without the dress, a year younger and ten years more tired.`),
 s('savannah',`You opened it.`),
 n(`It isn’t a question. You put the notebook on the desk. She doesn’t touch it.`),
 s('savannah',`Four pages. You read the first and then stopped. Did I get that right?`),
 s('theo',`I read the first one a lot.`),
 s('savannah',`114 Lake Ellison Road.`),
 s('theo',`It’s my family’s house.`),
 s('savannah',`I know. I’ve known since the first day. I wrote the address down when I was a freshman and didn’t know what it meant. It took me three years to understand that it wasn’t one night. It was a place.`),
 s('savannah',`Ms. K. Her name’s Katie. She was a Delta Mag pledge, class of ’21. She went to the Tau Spring Retreat in 2019 as a guest of a junior she trusted. She didn’t report. She left school at the end of that year and transferred to a state school two hours south. She wrote me a letter two years ago. It’s in the binder. I’ve never shown it to anyone.`),
 s('savannah',`She’d talk, if someone from inside would stand with her. Someone with a name. Someone who could say, “That house. I’ve seen that house. I know what it does.”`),
 s('savannah',`That’s the ask.`),
 n(`The lamp ticks. The filing cabinet hums. It’s been five minutes since she last blinked.`),
 s('savannah',`Monday. The Dean. You’re going to say a lot of things. I’m asking you to include an address.`),
 ch('Savannah is asking you to say a street number out loud.',[
  o(`“Yes. I’ll say it.”`,{tag:['Heart 12'],req:['heart',12],fx:{heart:2,'rel.savannah.trust':3,'flag:promisedSavannah':true},led:`Promised Savannah-Claire you would give the Dean the address: 114 Lake Ellison Road.`,then:[
    n(`She closes her eyes. When she opens them, there’s something in her face you’ve never seen there, something unguarded and young.`),
    s('savannah',`Thank you. I didn’t think you would.`),s('theo',`Neither did I.`),
    s('savannah',`That’s generally how it works.`)]}),
  o(`“I need to think. It’s my family’s house.”`,{tag:['Charm'],fx:{'rel.savannah.trust':-1},then:[
    s('savannah',`Of course. It’s your family’s house.`),n(`She says it neutrally. She says it like a person writing a number in a ledger.`)]}),
  o(`“Why me?”`,{tag:['Wit'],fx:{wit:1,'rel.savannah.trust':1},then:[
    s('savannah',`Because I have a sister in Poetry 101. She cried for an hour after class. “The boy at the bottom, holding a cup.” It took me about a minute to put it together. I’m sorry. It’s a very good poem.`),n(`You didn’t know a line could leave a room and travel. You didn’t know it could be carried to someone who’d been waiting for it.`)]}),
 ]),
 s('savannah',`One more thing. Wren Calder.`),
 n(`The name lands in the room like a pebble in a still pond.`),
 s('savannah',`I looked her up. It’s a habit. Wren Calder, sophomore, theatre. Her transfer file says she’s from Ohio. And she was in Ohio last year. But she wasn’t born there. She was born in Gwinnett County, Georgia. Eleven miles from St. Aldric’s.`),
 n(`The room tilts. A very small, very specific part of you decides not to hear it.`),
 s('savannah',`I’m not telling you what it means. I’m telling you what it says. Be careful what you tell her. That’s all I’ve got.`),
 fx({'flag:savannahWarned':true},`Savannah-Claire told you Wren Calder was born in Gwinnett County, Georgia, eleven miles from St. Aldric's. Her file says Ohio.`),
 ['go','bonfire4'],
];

/* ---- Friday: the bonfire, Coop, Josie ---- */
SC.bonfire4=[
 ['day','Friday','Homecoming Eve',4],
 slug('EXT. THE QUAD — HOMECOMING BONFIRE — FRIDAY — 8:00 P.M.'),
 n(`The Homecoming bonfire is a stack of pallets and furniture roughly the size of a one-story house, built by the pledges under the supervision of a campus fire marshal who looks as if he’s aged a decade since lunch. Four hundred students ring it in a loose, cheerful, flammable crowd.`),
 n(`Chip stands on a milk crate with a megaphone. He’s giving a speech about the sanctity of the bonfire. No one is listening. They’re looking at the road.`),
 n(`A pickup truck is rolling slowly across the quad against all regulations, with a TILLMAN’S PACKAGE & SPIRITS sign wired to the roof and a hand-lettered banner in the bed that says WELCOME HOME COOP. A cheer goes up like a swell on the sea. The truck stops at the edge of the crowd. Earl Tillman, in his cap, gets out of the driver’s seat and goes around to the passenger door.`),
 n(`Coop gets out slowly. He’s thinner. His head has been shaved on one side, with a long pink line along the scalp. He’s wearing the I’M FINE shirt, and he’s leaning on a cane with a rubber duck tied to the handle.`),
 s('coop',`HEY, EVERYBODY.`),
 n(`The sound four hundred people make is hard to describe. It’s a roar and a sob. It’s the sound of something being pulled out of the water.`),
 n(`He sees you. He starts across the grass, faster than he should. Earl makes a noise and reaches for his elbow, and Coop shakes him off with a quiet, firm gentleness, a man who’s been told he’s fragile one too many times, and then he’s in front of you, and he’s hugging you, and it lasts a very long time.`),
 s('coop',`Eleven seconds. I counted. I’m still the first Cooper.`),
 s('theo',`You counted?`),
 s('coop',`My head’s not good at forgetting. It’s weird. I forgot the Oath. I didn’t forget the hug.`),
 n(`He holds you out at arm’s length and looks you over. It’s the old, sweet, uncomplicated look, and it hurts.`),
 s('coop',`You told me. About the four minutes.`),
 s('theo',`I did.`),
 s('coop',`I’m still mad.`),
 s('theo',`You should be.`),
 s('coop',`And I’m fine.`),
 s('theo',`Both?`),
 s('coop',`Both. Fenn said both can be true. He visited me in the hospital. He brought a poem about a goose. I think he was drunk, but it was a good poem.`),
 n(`You laugh. It comes out cracked. Behind him, Earl Tillman has taken off his cap and is holding it against his chest, watching his son the way you’d watch a candle in a draft.`),
 ch('Coop forgave you. It isn’t clear he knows what he’s forgiven.',[
  o(`“Thank you. I don’t deserve it.”`,{tag:['Heart'],fx:{heart:1,'rel.coop.loyalty':2},then:[
    s('coop',`Nobody deserves anything. That’s why it’s a gift.`),n(`He says it like something he read on a fortune cookie. It might be the wisest sentence you’ve heard all year.`)]}),
  o(`“I’m going to fix it. Monday.”`,{tag:['Heart 12'],req:['heart',12],fx:{heart:1,'rel.coop.loyalty':2,'rel.coop.trust':1,'flag:promisedCoop':true},led:`Told Coop you'd fix your statement on Monday.`,then:[
    s('coop',`Okay. I believe you.`),n(`The simplicity of it takes your breath. He doesn’t ask what you’ll fix. He just believes you. It’s the heaviest thing anyone’s ever handed you.`)]}),
  o(`Hug him again. Say nothing.`,{tag:['Restraint'],fx:{'rel.coop.loyalty':1},then:[n(`Eleven seconds. You count them too.`)]}),
 ]),
 s('coop',`I got you something!`),
 n(`He digs in the pocket of his I’M FINE shirt and produces a tiny plastic goose, about two inches tall, painted with a scowl.`),
 s('coop',`It’s Gerald. Not the keg. The goose. I found him in the hospital gift shop. I’m sorry about the keg. I think it was a bad idea.`),
 n(`You hold the plastic goose in your palm. It’s heavier than it looks.`),
 n(`The fire catches. A cheer goes up like a flock of birds. In the swirl of orange light, with the crowd turning to watch the flames climb the pallets, you feel a hand touch your sleeve.`),
 n(`Josie.`),
 n(`She’s standing a few feet away in a Blue Plate sweatshirt and jeans, holding a foil-covered pan. Behind her, Del waits by the truck, watching the fire. Josie’s hair is in a pencil. She’s watching Coop, and then you, with an expression you can’t read. It’s not anger. It’s something neater, and farther away.`),
 s('josie',`I brought a casserole. For the family. It’s the forty-second.`),
 s('theo',`The Tillmans are going to need a second house.`),
 s('josie',`They have a second house. It’s Birdie’s.`),
 n(`A smile, small, brief, and honest. It’s there and gone.`),
 s('josie',`I heard you told Coop.`),
 s('theo',`I did.`),
 s('josie',`Good.`),
 n(`Her eyes move past your shoulder. You don’t have to turn around to know what she’s looking at. There’s a quality of light that happens when Wren enters a space.`),
 n(`Wren is crossing the quad in a long black coat, her hair loose, her face lit orange by the fire. She isn’t hurrying. She doesn’t have to. She’s looking straight at you, and everything else on the quad has simply gone out of focus.`),
 s('josie',`Go.`),
 s('theo',`Josie—`),
 s('josie',`Go. She’s waiting. You’ve got that look.`),
 s('theo',`What look?`),
 s('josie',`The one you had on my counter the first night. Like a man who’s been told something wonderful and terrible at the same time. It’s okay.`),
 ch('Josie is letting you go. It doesn’t feel like being let off.',[
  o(`“I’m not going anywhere. Not yet.” Stay a minute.`,{tag:['Heart'],fx:{heart:1,'rel.josie.trust':2,'rel.wren.trust':-1},then:[
    n(`Josie looks at you for a long moment. Then she shakes her head, slowly, and smiles.`),
    s('josie',`That’s the sweetest, worst thing you could say. Go. I’m going to hand this casserole to a man named Earl and cry in a pickup truck. I’ll be fine.`)]}),
  o(`“Come to the game tomorrow. Sit with me.”`,{tag:['Charm'],fx:{charm:1,'rel.josie.desire':1},then:[
    s('josie',`I’m working the Blue Plate tent. Del’s doing a pie booth. Don’t make me a plan.`),n(`She says it lightly. The word “plan” hangs between you like smoke.`)]}),
  o(`Say nothing. Let her go.`,{tag:['Avoid'],fx:{'rel.josie.trust':-1},then:[n(`She nods once, as if you’ve answered a question. She turns and walks back toward the truck, with the casserole held in front of her like a shield.`)]}),
 ]),
 n(`Wren reaches you. She doesn’t say anything. She takes the plastic goose out of your hand and looks at it with enormous seriousness, and gives it back.`),
 s('wren',`Is that a promise?`),
 s('theo',`It’s a goose.`),
 s('wren',`That’s what I said.`),
 n(`Across the fire, Josie has handed the casserole to Earl Tillman and is standing next to Del, who puts an arm around her. Neither of them looks over. It would be easier if they did.`),
 n(`You stand at the edge of a bonfire between two women, and you know exactly which one is going to leave a mark.`),
 ['go','game4'],
];


/* ---- Saturday: the game ---- */
SC.game4=[
 ['day','Saturday','Homecoming',4],
 slug('EXT. MEMORIAL FIELD — THE TAILGATE LOT — SATURDAY — 11:00 A.M.'),
 n(`The Ashby College Fighting Geese play the Morrow State Mud Hens at one o’clock, and by eleven the tailgate lot looks like a small, well-armed country. Tents, grills, flags, coolers, a man in a goose costume doing push-ups on a Buick.`),
 n(`That’s Memo, the mascot, short for MEMINIMUS, a six-foot goose in a blazer and a sash, with a permanent expression of bureaucratic hurt. The costume has been worn by the same sophomore for two years, and he does the voice. “HONK,” he says, with an air of precise administrative disapproval.`),
 n(`The Tau tent is the largest in the lot, a white pavilion with a keg bar, a flat-screen, and a banner stretching twenty feet across the back: COOP STRONG. #TAUFORTILLMAN. Beneath it, a plastic donation jar the size of a bathtub. Brothers pass through in blazers, tapping it with the careful pride of men who have never once been told what they’re for.`),
 s('colt',`Whit! Look at this. Forty-one thousand dollars. We’re going to hand Earl the check at halftime.`),
 n(`He’s radiant. He puts a Tau jersey over your head and you let him, because it’s easier than the alternative. It’s navy, with your name on the back: WHITLOCK. Beneath it, the number 1.`),

 s('theo',`Are you sure it isn’t a liability number?`),

 n(`He puts a red cup in your hand. You are, at this point, a person who holds a cup.`),

 s('fenn',`I’m rooting for the opposing team.`),s('savannah',`Alistair, you’re wearing a Mud Hens hat.`),s('fenn',`I’m a patriot of lost causes.`),
 slug('INT. MEMORIAL FIELD — THE STANDS — KICKOFF — 1:00 P.M.'),
 n(`The home stands are a crowd of eleven thousand in navy and gold. The donor box is a glassed-in suite near the fifty-yard line, where the Board of Trustees sits in blazers over folding chairs, holding programs and champagne. The Reverend Josiah Whitfield sits at the front of it, in a black suit, straight as a pulpit.`),
 n(`The student section is on the opposite side. Section G is a quiet, steep, slightly forgotten corner where no one has ever brought a banner. You can see the donor box from there. You can see everything from there.`),

  o(`Split the difference. Sit at the aisle between them.`,{tag:['Charm 15'],req:['charm',15],fx:{charm:1,'flag:satAisle':true},then:[

 ]),
 n(`The first half is a blur of noise and bad football. A Mud Hens linebacker catches a pass and runs the wrong way. Memo the Goose is penalized for something. The marching band plays a medley that has no relationship to any song known to man. At the end of the half the field clears, and the PA announces, in a voice you recognize as Chip Rennick’s:`),
 s('chip',`LADIES AND GENTLEMEN. THE ASHBY COLLEGE HOMECOMING COURT.`),
 n(`A line of golf carts rolls onto the field. On the back of the last one, in a faded Tau polo and a gold paper crown, wearing a rubber duck on the end of his cane and the biggest smile you’ve ever seen on a human face, sits Cooper Tillman.`),
 n(`Eleven thousand people rise to their feet.`),
 ['if',()=>G.flags.backCoop||G.flags.runForCoop,[

   n(`It’s the chant from the party, from the basement, from the Hole. It’s the same sound, and a completely different one. It’s the sound of people trying very hard, all at once, to take something back.`)],
  [n(`You watch from the stands as Coop is helped from the golf cart. His brothers, in COOP STRONG shirts, surround him in a protective, joyous knot. The chant begins, first a few, then a hundred, then all of them: COOP. COOP. COOP. It’s the sound from the party, from the basement, from the Hole. It’s the same sound, and it isn’t.`)]],
 s('chip',`AND YOUR HOMECOMING KING, BY A MARGIN OF 4,112 VOTES TO… THREE… COOPER TILLMAN.`),

 n(`The crowd cheers. The Tau banner unfurls along the end zone. Hunter’s father stands in the stands with his bourbon raised.`),

  o(`Smile and wave. It’s a celebration.`,{tag:['Charm'],fx:{'rel.hunter.trust':1,'rel.coop.trust':-1},then:[n(`You wave. Earl doesn’t. It’s one of the cruelest things you’ve ever done and it required nothing.`)]}),
 ]),

 n(`It isn’t a push alert. It’s a ripple. It starts in the Tau section, a few phones lighting, then a dozen, then a hundred. A girl two rows ahead of you gasps. A boy says, “Oh my God.” The sound spreads across the stands like a rumor learning to fly.`),
 n(`You take out your phone. An account with forty thousand followers called @AshbyWhispers has posted a photograph. It’s a photograph of two men at a picnic table under a string of bulbs, in front of a sign with a pig in sunglasses. One of them wears a gray blazer. One of them wears an apron. Their hands are joined across the table.`),

 s('dez',`I know.`),
