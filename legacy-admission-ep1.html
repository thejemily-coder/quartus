<title>Legacy Admission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&family=DM+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow reading column like a script on a nightstand. Sticky header with Notebook,
   a log that grows downward, and a bottom bar holding Continue. Title cards are full-bleed black. */
:root{
  --bg:#f1f2f0; --panel:#ffffff; --fg:#1b1f1d; --muted:#5b6561; --line:#d4d9d6;
  --accent:#b3123f; --accent-ink:#ffffff; --moss:#17665a; --soft:#e7ebe8;
  --ink:#0b0d0c; --ink-fg:#f1ece4; --ink-dim:#a49d95;
  --good:#17665a; --bad:#b3123f;
  --c-theo:#b3123f; --c-coop:#8a5a00; --c-dez:#5a3fb0; --c-josie:#17665a; --c-del:#7a5a2c;
  --c-wren:#b0276f; --c-savannah:#9a7a00; --c-fenn:#3b5f8a; --c-lurleen:#6b2f6b; --c-ladies:#555f5b;
  --c-hunter:#8a3b2c; --c-colt:#a12a2a; --c-graham:#444c49; --c-haskell:#4a5a52; --c-earl:#8a5a00; --c-doc:#3b5f8a; --c-judge:#6b4a2f; --c-sisters:#9a7a00; --c-pledges:#8a3b2c;
  --display:"Bodoni Moda","Didot",Georgia,serif; --body:"Newsreader",Georgia,"Times New Roman",serif; --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1110; --panel:#141b19; --fg:#e8ebe7; --muted:#8e9a96; --line:#26302d;
  --accent:#ff5c8f; --accent-ink:#1a0710; --moss:#4fd1b5; --soft:#1b2421; --good:#4fd1b5; --bad:#ff5c8f;
  --c-theo:#ff5c8f; --c-coop:#e0a93b; --c-dez:#a994ff; --c-josie:#4fd1b5; --c-del:#d1a46b;
  --c-wren:#ff7bbd; --c-savannah:#e8cb4a; --c-fenn:#7fb0e8; --c-lurleen:#d08ad0; --c-ladies:#a3afab;
  --c-hunter:#f0866f; --c-colt:#ff7070; --c-graham:#a3afab; --c-haskell:#9fb2a8; --c-earl:#e0a93b; --c-doc:#7fb0e8; --c-judge:#d1a46b; --c-sisters:#e8cb4a; --c-pledges:#f0866f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1110; --panel:#141b19; --fg:#e8ebe7; --muted:#8e9a96; --line:#26302d;
  --accent:#ff5c8f; --accent-ink:#1a0710; --moss:#4fd1b5; --soft:#1b2421; --good:#4fd1b5; --bad:#ff5c8f;
  --c-theo:#ff5c8f; --c-coop:#e0a93b; --c-dez:#a994ff; --c-josie:#4fd1b5; --c-del:#d1a46b;
  --c-wren:#ff7bbd; --c-savannah:#e8cb4a; --c-fenn:#7fb0e8; --c-lurleen:#d08ad0; --c-ladies:#a3afab;
  --c-hunter:#f0866f; --c-colt:#ff7070; --c-graham:#a3afab; --c-haskell:#9fb2a8; --c-earl:#e0a93b; --c-doc:#7fb0e8; --c-judge:#d1a46b; --c-sisters:#e8cb4a; --c-pledges:#f0866f; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:19px;line-height:1.6;padding-inline:16px;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:700px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.02em;font-size:18px}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

#log{flex:1;padding-block:28px 24px;display:flex;flex-direction:column;gap:18px}
#log>*{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.slug{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-left:3px solid var(--accent);padding-left:12px;margin-top:14px}
.n{margin:0;text-wrap:pretty;white-space:pre-line}
.day{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:16px;margin-block:10px}
.day span{font-family:var(--display);font-weight:700;font-size:clamp(34px,9vw,52px);line-height:1;color:var(--accent)}
.day small{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.n.em{font-style:italic}
.s{display:flex;flex-direction:column;gap:2px}
.s .who{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--muted))}
.s .say{margin:0;padding-left:14px;border-left:2px solid var(--c,var(--line))}
.s.me .say{font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted)}
.chip.up{color:var(--good)}.chip.down{color:var(--bad)}
.thread{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:6px;max-width:440px}
.thread .top{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:6px}
.bub{max-width:82%;padding:8px 13px;border-radius:18px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4}
.bub.them{align-self:flex-start;background:var(--soft)}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.bub .nm{display:block;font-size:11px;opacity:.7;margin-bottom:1px}
.choice{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.choice .q{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.picked{border-color:var(--accent);background:var(--soft)}
.opt.gone{opacity:.4}
.opt.locked{opacity:.55;border-style:dashed}
.opt .t{display:block}
.opt .tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--moss);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.tag.lock{color:var(--muted)}
.roll{font-family:var(--mono);font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
.roll b{letter-spacing:.12em;text-transform:uppercase;font-size:12px}
.roll .res{font-size:15px}
.roll .res.pass{color:var(--good)}.roll .res.fail{color:var(--bad)}

.dock{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;justify-content:center;min-height:66px}
.dock .go{width:100%;max-width:700px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:13px;font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.dock .hint{align-self:center;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* title cards: black like a broadcast, in both themes */
.card{position:fixed;inset:0;z-index:20;background:var(--ink);color:var(--ink-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;gap:14px;animation:fade .7s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card .k{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-dim)}
.card h1{font-family:var(--display);font-weight:700;font-size:clamp(38px,9vw,76px);line-height:1.04;margin:0;text-wrap:balance;max-width:14ch}
.card h1 em{color:var(--accent);font-style:italic;font-weight:500}
.card p{margin:0;font-style:italic;color:var(--ink-dim);max-width:34ch}
.card .btn{margin-top:22px;background:transparent;color:var(--ink-fg);border-color:#4a4540}
.card .btn:hover{border-color:var(--accent)}
.card .fine{font-family:var(--mono);font-size:11px;font-style:normal;letter-spacing:.04em;line-height:1.6;max-width:46ch;color:var(--ink-dim)}
.card .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* notebook drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:31;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.drawer h2{font-family:var(--display);font-size:26px;margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .btn[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panelrow{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.panelrow h3{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--fg))}
.panelrow p{margin:0;font-size:16px;color:var(--muted);line-height:1.45}
.meter{display:grid;grid-template-columns:70px 1fr 28px;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meter i{display:block;height:6px;background:var(--soft);border-radius:3px;position:relative;overflow:hidden}
.meter i b{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--accent))}
.meter span{font-variant-numeric:tabular-nums;text-align:right;color:var(--fg)}
.ledger li{margin:0 0 10px;font-size:16px}
.ledger{padding-left:18px;margin:0}
.empty{font-style:italic;color:var(--muted);font-size:16px}
.gossip{font-family:var(--mono);font-size:13px;letter-spacing:.02em;line-height:1.55;border-top:1px solid var(--ink-dim);padding-top:10px;text-align:left;color:var(--ink-fg)}
.gossip li{margin-bottom:8px}
@media (prefers-reduced-motion:reduce){#log>*,.card{animation:none}}
@media (max-width:420px){body{font-size:18px}}
</style>

<div class="app" id="app">
  <header class="bar">
    <div class="brand">Legacy Admission<small id="actLabel">Season 1</small></div>
    <button class="btn" id="nbBtn" type="button">Notebook</button>
  </header>
  <main id="log" aria-live="polite"></main>
  <div class="dock" id="dock"><span class="hint">Loading</span></div>
</div>
<div id="overlay"></div>

<script>
/* ---------- state ---------- */
const KEY='legacy-admission-s1-v1';
const PEOPLE=['josie','wren','coop','dez','savannah','del','lurleen','fenn','colt','hunter','haskell','graham','jalen','harlan','chip','immy'];
const NAMES={theo:'You',coop:'Coop',dez:'Dez',josie:'Josie',del:'Del',wren:'Wren',savannah:'Savannah-Claire',fenn:'Dr. Fenn',lurleen:'Mayor Lurleen',birdie:'Birdie',mavis:'Mavis',ladies:'The Gazebo Ladies',hunter:'Hunter',colt:'Colt',graham:'Dad',odell:'Ms. Odell',haskell:'Dean Haskell',earl:'Big Earl Tillman',doc:'Dr. Nguyen',judge:'Judge Crenshaw',rhonda:'Rhonda',sisters:'The Magnolias',preston:'Preston Danvers',chip:'Chip Rennick',immy:'Immy Vale',jalen:'Jalen',harlan:'Harlan Prescott-Lowe',madison:'Madison',marcus:'Marcus Hale',whitfield:'Reverend Whitfield',cletus:'Deputy Cletus',pledges:'The Pledges',student:'Poetry Student'};
const BLURB={
 josie:'Pre-med on scholarship. Works the Blue Plate counter. Allergic to rich-kid nonsense.',
 wren:'Sophomore transfer. Theatre. The funniest person at any party and the saddest at the end of it.',
 coop:'Your roommate. Lacrosse recruit. Sweet as pie, dense as a brick, hitting his head a lot.',
 dez:'Your RA. Smarter than everybody. Will not lie to you and expects the same.',
 savannah:'President of Delta Magnolia Pi. Runs her chapter like a small government.',
 del:'Josie’s mother. Owns the Blue Plate. Sees through you in about ten seconds.',
 lurleen:'Mayor. Funeral director. Notary. Knows what you did before you do.',
 fenn:'Poetry professor. Brilliant. Often horizontal.',
 colt:'Your oldest friend from St. Aldric’s. Now, somehow, here.',
 hunter:'Rush chair of Sigma Alpha Tau. Pottery Barn Gatsby. Very concerned about charters.',
 haskell:'Dean of Students. Exhausted. Not a villain. Part of the system anyway.',
 graham:'Your father. Elegant, distant, financially cornered.',
 jalen:'Line cook and chemistry grad student. Dez’s person. Does not do back doors.',
 harlan:'Hunter’s father. Tau alumni royalty. Has never lost a brother.',
 chip:'Student Government VP. Laser pointer. Binders. Lives for Homecoming.',
 immy:'Marcus Hale\u2019s associate. Reads liars for a living. Gave you her number.'};
const fresh=()=>({stats:{charm:3,nerve:1,wit:2,heart:1},rep:{campus:0,town:0},dep:0,buzz:0,
  rel:Object.fromEntries(PEOPLE.map(p=>[p,{trust:0,desire:0,loyalty:0}])),flags:{},ledger:[],log:[],cps:{},locks:{},scene:'cold'});
let G=fresh();
let stack=[],busy=false,waitFn=null;
const $=id=>document.getElementById(id);
const log=$('log'),dock=$('dock');
const cap=s=>s[0].toUpperCase()+s.slice(1);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* save: browser storage plus the artifact database (cloud save Claude can read) */
const DOC='season1/save';
let DB=null,dbBusy=false,dbDirty=false,dbTimer=null;
function brief(){return{episodesDone:[G.flags.ep1done&&1,G.flags.ep2done&&2,G.flags.ep3done&&3,G.flags.ep4done&&4,G.flags.ep5done&&5].filter(Boolean),scene:G.scene,stats:G.stats,reputation:G.rep,dependence:G.dep,
  flags:Object.keys(G.flags).filter(k=>!/^(met|last):/.test(k)&&G.flags[k]),relationships:G.rel,ledger:G.ledger}}
function snapshotDoc(){return{state:G,brief:brief(),savedAt:G._t||0}}
async function pushDb(){
  if(!DB)return;if(dbBusy){dbDirty=true;return}
  dbBusy=true;try{await DB.doc(DOC).set(snapshotDoc())}catch(e){}
  dbBusy=false;if(dbDirty){dbDirty=false;pushDb()}
}
function save(now){
  G._t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}
  clearTimeout(dbTimer);if(now)pushDb();else dbTimer=setTimeout(pushDb,700);
}
async function loadDb(){
  try{if(!window.claude||!claude.use)return null;DB=await claude.use('db');if(!DB)return null;
    const s=await DB.doc(DOC).get();return s.exists?s.data():null}catch(e){return null}
}
function norm(g){if(!g)return g;if(!g.cps)g.cps={};if(!g.locks)g.locks={};if(!g.flags)g.flags={};if(!g.log)g.log=[];if(!g.ledger)g.ledger=[];
  PEOPLE.forEach(p=>{if(!g.rel[p])g.rel[p]={trust:0,desire:0,loyalty:0}});return g}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function wipe(){try{localStorage.removeItem(KEY)}catch(e){}}

/* effective stat, with a temporary buzz modifier */
function eff(st){let v=G.stats[st];if(G.buzz>=1&&st==='nerve')v+=1;if(G.buzz>=2&&st==='wit')v-=1;return v}

function apply(fx){
  const chips=[];
  for(const k in fx){const v=fx[k];
    if(v===0)continue;
    if(k.startsWith('flag:')){G.flags[k.slice(5)]=v;continue}
    if(k==='dep'){G.dep+=v;continue}
    if(k==='buzz'){G.buzz=Math.max(0,G.buzz+v);continue}
    if(k in G.stats){G.stats[k]+=v;chips.push([cap(k)+' '+(v>0?'+':'')+v,v>0]);continue}
    if(k.startsWith('rep.')){const r=k.slice(4);G.rep[r]+=v;chips.push([(v>0?'▲ ':'▼ ')+(r==='campus'?'Campus':'Town')+' reputation',v>0]);continue}
    if(k.startsWith('rel.')){const [,p,m]=k.split('.');G.rel[p][m]+=v;chips.push([(v>0?'▲ ':'▼ ')+NAMES[p].replace('Mayor ','')+' · '+cap(m),v>0])}
  }
  if(chips.length){const c=el('div','chips');chips.forEach(([t,up])=>c.append(el('span','chip '+(up?'up':'down'),esc(t))));log.append(c)}
}

/* ---------- rendering ---------- */
function scroll(){const last=log.lastElementChild;if(last)last.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'end'})}
function setDock(label,fn){
  dock.innerHTML='';waitFn=fn||null;
  if(!label){dock.append(el('span','hint','Choose'));return}
  const b=el('button','go',esc(label));b.type='button';b.onclick=()=>{if(waitFn)waitFn()};dock.append(b);
}
function say(who,text){
  if(who!=='theo'&&PEOPLE.includes(who))G.flags['met:'+who]=true;
  const d=el('div','s'+(who==='theo'?' me':''));const CM={birdie:'ladies',mavis:'ladies',odell:'ladies',rhonda:'ladies',student:'ladies',doc:'doc',judge:'judge'};d.style.setProperty('--c','var(--c-'+(CM[who]||who)+')');
  d.append(el('div','who',esc(NAMES[who]||who)));d.append(el('p','say',text));log.append(d);
}
function thread(title,msgs){
  const t=el('div','thread');t.append(el('div','top',esc(title)));
  msgs.forEach(([from,txt])=>{const b=el('div','bub '+(from==='me'?'me':'them'));
    if(from!=='me'&&from!=='them')b.append(el('span','nm',esc(NAMES[from]||from)));
    b.append(document.createTextNode(txt));t.append(b)});
  log.append(t);
}
function card(kicker,title,sub,after,extra){
  const o=el('div','card');
  o.append(el('div','k',esc(kicker)));o.append(el('h1','',title));if(sub)o.append(el('p','',esc(sub)));
  if(extra)o.append(extra);
  const b=el('button','btn','Continue');b.type='button';
  b.onclick=()=>{o.remove();document.body.style.overflow='';after()};o.append(b);
  $('overlay').append(o);document.body.style.overflow='hidden';b.focus();
}

/* ---------- engine ---------- */
const locked=n=>!!(G.locks&&G.locks[n]);
async function lockEpisode(n){
  G.locks[n]=true;save(true);
  if(!DB)return;
  try{const ref=DB.doc('season1/ep'+n+'_final');const s=await ref.get();if(!s.exists)await ref.set(snapshotDoc())}catch(e){}
}
function snap(){const {cps,...r}=G;return JSON.parse(JSON.stringify(r))}
const EP_START={1:'cold',2:'cold2',3:'cold3',4:'cold4',5:'cold5'};
function runScene(id){
  if(id==='cold'){G.cps[1]=snap()}
  if(id==='cold2'){G.cps[2]=snap();Object.keys(G.cps).forEach(k=>{if(+k>2)delete G.cps[k]})}
  if(id==='cold3'){G.cps[3]=snap();Object.keys(G.cps).forEach(k=>{if(+k>3)delete G.cps[k]})}
  if(id==='cold4'){G.cps[4]=snap();Object.keys(G.cps).forEach(k=>{if(+k>4)delete G.cps[k]})}
  if(id==='cold5'){G.cps[5]=snap();Object.keys(G.cps).forEach(k=>{if(+k>5)delete G.cps[k]})}
  G.scene=id;save(id==='cold2'||id==='cold3'||id==='cold4'||id==='cold5'||id==='done2'||id==='done3'||id==='done4'||id==='done5');stack=[{steps:SC[id],i:0}];next();
}
function next(){
  setDock(null);
  while(stack.length){
    const f=stack[stack.length-1];
    if(f.i>=f.steps.length){stack.pop();continue}
    const st=f.steps[f.i++];
    if(exec(st,f))return;
  }
  setDock('');
}
function pause(){scroll();setDock('Continue ▸',()=>next())}
function exec(st,f){
  const [t,a,b,c,d]=st;
  switch(t){
    case 'slug':log.append(el('div','slug',esc(a)));return false;
    case 'n':{log.append(el('p','n'+(b?' em':''),a));const nx=f.steps[f.i];if(nx&&nx[0]==='n')return false;pause();return true}
    case 's':say(a,b);pause();return true;
    case 't':thread(a,b);pause();return true;
    case 'fx':apply(a);if(b)G.ledger.push(b);return false;
    case 'led':G.ledger.push(a);return false;
    case 'act':$('actLabel').textContent=a;return false;
    case 'if':{const br=a()?b:(c||[]);if(br.length)stack.push({steps:br,i:0});return false}
    case 'go':runScene(a);return true;
    case 'card':card(a,b,c,()=>next());return true;
    case 'chk':return check(a,b,c,d);
    case 'c':return choice(a,b);
    case 'day':log.append(el('div','day',`<span>${esc(a)}</span><small>${esc(b)}</small>`));$('actLabel').textContent='Episode '+(c||2)+' \u00B7 '+a;return false;
    case 'end':finish(a);return true;
  }
  return false;
}
function check(stat,dc,label,[pass,fail]){
  const e=eff(stat);const r1=1+Math.floor(Math.random()*6),r2=1+Math.floor(Math.random()*6);const tot=r1+r2+e;const ok=tot>=dc;
  const box=el('div','roll');box.append(el('b','',esc(cap(stat))+' check · '+esc(label)));
  const line=el('span','',`Rolling 2d6 + ${cap(stat)} ${e} against ${dc}…`);box.append(line);log.append(box);scroll();
  setDock(null);
  setTimeout(()=>{
    line.textContent=`${r1} + ${r2} + ${e} = ${tot} vs ${dc}`;
    box.append(el('span','res '+(ok?'pass':'fail'),ok?'Success':'Not this time'));
    G.flags['last:'+stat]=ok;G.log.push({s:G.scene,chk:stat+' '+dc+' ('+label+')',ok:ok,roll:tot});
    stack.push({steps:ok?pass:fail,i:0});pause();
  },matchMedia('(prefers-reduced-motion:reduce)').matches?0:650);
  return true;
}
function choice(q,opts){
  const box=el('div','choice');box.append(el('div','q',esc(q)));
  const vis=opts.filter(o=>!o.show||o.show());
  const btns=[];
  vis.forEach((o,i)=>{
    const lock=o.req&&eff(o.req[0])<o.req[1];
    const bt=el('button','opt'+(lock?' locked':''));bt.type='button';bt.disabled=!!lock;
    bt.append(el('span','t',`${i+1}. ${o.t}`));
    const tg=el('span','tags');
    (o.tag||[]).forEach(x=>tg.append(el('span','tag',esc(x))));
    if(lock)tg.append(el('span','tag lock',`needs ${cap(o.req[0])} ${o.req[1]}`));
    if(tg.children.length)bt.append(tg);
    bt.onclick=()=>pick(o,bt,btns,q);
    btns.push(bt);box.append(bt);
  });
  box._keys=btns;log.append(box);window._ch={btns,vis,opts:vis};scroll();setDock(null);return true;
}
function pick(o,bt,btns,q){
  G.log.push({s:G.scene,q:q,c:String(o.t).replace(/<[^>]*>/g,'')});if(G.log.length>800)G.log.shift();
  window._ch=null;
  btns.forEach(b=>{b.disabled=true;if(b!==bt)b.classList.add('gone')});bt.classList.add('picked');
  if(o.led)G.ledger.push(o.led);
  if(o.fx)apply(o.fx);
  save();
  if(o.then)stack.push({steps:o.then,i:0});
  next();
}
document.addEventListener('keydown',e=>{

  if(window._ch&&/^[1-9]$/.test(e.key)){const i=+e.key-1;const b=window._ch.btns[i];if(b&&!b.disabled){b.click();e.preventDefault()}return}
  if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight')&&waitFn&&document.activeElement===document.body){e.preventDefault();waitFn()}
});

function openNotebook(tab='people'){
  const old=document.querySelector('.drawer');if(old){old.remove();document.querySelector('.scrim')?.remove()}
  const sc=el('div','scrim');const dr=el('aside','drawer');dr.setAttribute('role','dialog');dr.setAttribute('aria-label','Notebook');
  const close=()=>{sc.remove();dr.remove()};sc.onclick=close;
  const head=el('div','');head.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:10px';
  head.append(el('h2','','Notebook'));const x=el('button','btn','Close');x.type='button';x.onclick=close;head.append(x);dr.append(head);
  const tabs=el('div','tabs');tabs.setAttribute('role','tablist');
  const body=el('div','');body.style.cssText='display:flex;flex-direction:column;gap:12px';
  const defs=[['people','People'],['you','You'],['town','Town'],['prev','Previously'],['save','Save'],['eps','Episodes']];
  const draw=k=>{
    [...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));body.innerHTML='';
    if(k==='people'){
      const met=PEOPLE.filter(p=>G.flags['met:'+p]);
      if(!met.length)body.append(el('p','empty','You haven’t met anyone yet.'));
      met.forEach(p=>{const r=el('div','panelrow');r.style.setProperty('--c','var(--c-'+(p==='lurleen'?'lurleen':p)+')');
        r.append(el('h3','',esc(NAMES[p])));r.append(el('p','',esc(BLURB[p])));
        ['trust','desire','loyalty'].forEach(m=>{const v=G.rel[p][m];const pct=Math.max(0,Math.min(100,(v+3)/10*100));
          const mm=el('div','meter',`<em style="font-style:normal">${m}</em><i><b style="width:${pct}%"></b></i><span>${v>0?'+':''}${v}</span>`);r.append(mm)});
        body.append(r)});
    }
    if(k==='you'){
      const r=el('div','panelrow');r.append(el('h3','','Theo Whitlock'));r.append(el('p','','18. A last name on a dorm. A night from senior year you aren’t discussing.'));
      ['charm','nerve','wit','heart'].forEach(s=>{const v=G.stats[s];r.append(el('div','meter',`<em style="font-style:normal">${s}</em><i><b style="width:${Math.min(100,v*14)}%"></b></i><span>${v}</span>`))});
      body.append(r);
    }
    if(k==='town'){
      [['campus','Ashby College','What the Greek system, your classmates, and the quad think of you.'],['town','Marlowe Springs','What the diner, the Gazebo, and the mayor’s hearse think of you.']].forEach(([id,t,d])=>{
        const v=G.rep[id];const r=el('div','panelrow');r.append(el('h3','',t));r.append(el('p','',d));
        r.append(el('div','meter',`<em style="font-style:normal">standing</em><i><b style="width:${Math.max(0,Math.min(100,(v+4)/10*100))}%"></b></i><span>${v>0?'+':''}${v}</span>`));body.append(r)});
    }
    if(k==='eps'){
      const lk=[1,2,3,4,5].filter(locked);
      body.append(el('p','empty',lk.length?'Locked episodes: '+lk.join(', ')+'. Finished episodes are canon, so their choices cannot be replayed or changed. The story builds on them.':'Finishing an episode locks it in. Until then you can replay an episode to try different choices. Episode 2 restarts with the exact stats and story flags you had when Episode 1 ended.'));
      const st=el('div','panelrow');st.append(el('h3','','Current stats'));st.append(el('p','',`Charm ${G.stats.charm} \u00B7 Nerve ${G.stats.nerve} \u00B7 Wit ${G.stats.wit} \u00B7 Heart ${G.stats.heart}`));body.append(st);
      body.append(episodeButtons());
    }
    if(k==='save'){
      body.append(el('p','empty','Your game saves itself to this artifact and to this browser, so Claude can build the next episode from your choices. To move it by hand, copy the save below or paste one in.'));
      const ta=el('textarea');ta.id='saveOut';ta.readOnly=true;ta.rows=6;ta.value=JSON.stringify(snapshotDoc());
      ta.style.cssText='width:100%;font-family:var(--mono);font-size:11px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px';
      const cp=el('button','btn','Copy save');cp.type='button';cp.onclick=()=>{ta.select();try{navigator.clipboard.writeText(ta.value).then(()=>{cp.textContent='Copied'},()=>{cp.textContent='Select and copy'})}catch(e){cp.textContent='Select and copy'}};
      const ti=el('textarea');ti.id='saveIn';ti.rows=3;ti.placeholder='Paste a save here to load it';
      ti.style.cssText=ta.style.cssText;
      const im=el('button','btn','Load pasted save');im.type='button';im.onclick=()=>{try{const d=JSON.parse(ti.value);const g=norm(d.state||d);if(!g.stats||!g.rel)throw 0;G=g;save(true);location.reload()}catch(e){im.textContent='That is not a valid save'}};
      body.append(ta,cp,ti,im);
    }
    if(k==='prev'){
      if(!G.ledger.length)body.append(el('p','empty','Nothing on the record yet. That won’t last.'));
      else{const ul=el('ul','ledger');G.ledger.forEach(t=>ul.append(el('li','',esc(t))));body.append(ul)}
    }
  };
  defs.forEach(([k,l])=>{const b=el('button','btn',l);b.type='button';b.dataset.k=k;b.setAttribute('role','tab');b.onclick=()=>draw(k);tabs.append(b)});
  dr.append(tabs);dr.append(body);draw(tab);
  document.body.append(sc,dr);
}

SC.wren=[
 slug('INT. WREN’S APARTMENT — ABOVE THE HOLLIS THEATRE — 2:07 A.M.'),
 n(`Wren lives above the Hollis Theatre in a room that is mostly costume rack: feathers, a cape, a bodice labeled WENCH — DO NOT LEND TO TAU. A ghost light burns on the stage below, and its glow rises through the floor vents as though the building is thinking.`),

 s('wren',`You’re doing great, sweet pea. A surgeon. A craftsman.`),

 n(`She lets go and lifts the slip over her head. In the glow from the vent she is freckles and sharp hips, the long pale scar down her left shin, the breasts you have been thinking about since a table in a frat house, and she lets you look until you’re almost embarrassed. Then she takes your hand and puts it exactly where she wants it.`),

 n(`You aren’t a fast learner, but you are a motivated one. She directs you one word at a time (there, slower, oh, that) in a voice that frays a little more with each, and then she pulls you down by the hair and says, plainly, what she wants your mouth to do. What you do with it earns a sound out of her that you suspect the Hollis Theatre’s acoustics will remember. Her fingers are twisted in your hair, holding you where she needs you. Her thighs shake against your ears. She says your name, “Theo,” not “Whitlock,” and it breaks in the middle, and she comes with her back arched and one heel hooked over your shoulder, her famous breath control gone completely.`),
 n(`For a long moment the only sound is the ghost light humming through the floor.`),

 s('wren',`Hi.`),
 n(`Then she moves. It isn’t smooth. It’s better. She sets a rhythm like a woman who knows exactly how long she can hold a stage, hands braced on your chest, hips rolling, taking her time and then not, until you’re gripping her thighs and can’t remember a single word in English, and she bends and says into your mouth, “Look at me.” You do. You couldn’t stop if you tried. When you come it’s like falling down a staircase you didn’t see in the dark, a long, bright, stupid drop, and she goes with you, laughing and shaking and swearing, collapsing onto your chest with her nails still in your shoulder.`),

  o(`Say nothing. Drink the tea.`,{tag:['Silence'],fx:{'rel.dez.trust':-1},then:[n(`Dez nods slowly. He’s a person who can hear what people don’t say. It’s the most irritating quality in a friend.`),s('dez',`Tea’s on me. The truth’s on you. Whenever.`)]}),

 n(`The Judge is also there. Judge Crenshaw, retired, seventy-one, fifteen years sober, in a suit he’s clearly worn to every anniversary since 2011.`),
 s('judge',`I was late to my own anniversary. Fifteen years. Never once fully on time. It’s the only part of sobriety I’ve failed.`),
 n(`Rhonda, a woman in a cardigan, has brought a casserole. She’s holding it like a newborn.`),
 s('ladies',`It’s a sober casserole. No wine. We checked.`),
 n(`The cake is from the Kroger. The frosting says CONGRATS ON BEING A JUDGMENT-FREE ZONE. Somebody ran out of room for the word “DEL.”`),
 n(`A hearse is parked outside. You don’t have to look to know whose. Mayor Lurleen comes through the door in her sash with a covered dish and a very small, very solemn nod to the Judge.`),
 s('lurleen',`I just came for the cake. I’m not here for the other thing. I did bring the card, in case.`),
 s('theo',`The card?`),s('lurleen',`For my business. It’s a very good business. Nobody’s ever been disappointed.`),
 s('del',`Lurleen drove me home five years ago. Not from a bar. From a ditch. Mama wasn’t talking to me, Josie was twelve, and Lurleen found me asleep in the back of that hearse.`),
 s('lurleen',`It was a slow day.`),
 n(`The room laughs, the good laugh, the kind that holds a lot of weight. Josie, beside you, has gone very quiet. She’s standing against the wall in a dress with a coffee stain, which she’s made peace with. She reaches over, without looking, and takes your hand. Then, when you look at her, she pretends she didn’t.`),
 s('del',`So. I’m going to say something. You can’t stop me. I’ve been practicing in the walk-in.`),
 n(`Her speech is short and not good, in the way the best ones are. She thanks the Judge. She thanks Lurleen. She thanks her daughter, who is, she says, “the only person I ever wanted to be sober for, and I want it on the record that I did it for me, too.” Josie wipes her eyes with her sleeve and mouths, “I hate you.”`),
 s('del',`And I want to thank the new kid. Theo. For not looking away from the coin. It’s a small thing. It’s not.`),
 n(`Every head turns. You are, for the second time in three days, the center of a room you didn’t choose.`),
 ch('Say something?',[
  o(`Stand. Raise your glass of orange juice. “To Del.”`,{tag:['Charm'],fx:{charm:1,'rel.del.trust':1,'rep.town':1},then:[
    s('judge',`To Del!`),n(`The whole room echoes it, an uneven, thundering, folding-chair chorus. It’s the best toast you’ve ever given, and it was two words.`)]}),
  o(`Quiet. “My mother would have loved this place.”`,{tag:['Heart'],fx:{heart:1,'rel.del.trust':2,'rel.josie.trust':1},then:[
    n(`Nobody says anything. Del wipes her hands on her apron, comes around the counter, and hugs you with the force of someone who’s used to holding things together. Over her shoulder, Josie is looking at you like you’ve just rearranged something in her.`)]}),
  o(`Raise your glass. Say nothing. Let the room do it.`,{tag:['Restraint'],fx:{wit:1,'rel.del.trust':1},then:[n(`Sometimes the right thing is just to be part of the furniture.`)]}),
 ]),
 slug('EXT. THE BLUE PLATE — BACK STEPS — 9:50 P.M.'),
 n(`After the last chair is stacked and the last casserole is claimed, you and Josie sit on the back steps of the kitchen, in the glow of a single yellow bulb, with a bowl of leftover cake you’re both pretending not to eat out of the same fork.`),
 s('josie',`She did five years. Five. I used to count her drinks. I was twelve and I could do it by the sound of the ice.`),
 s('josie',`I’m scared I’m just like her. That I’ll be a person who has to be held up by something. You know? I do orgo flashcards at 2 a.m. like it’s a rosary.`),
 ch('Josie, on the back steps.',[
  o(`“You’re not like her. You’re like what she’s turned into.”`,{tag:['Heart'],fx:{heart:1,'rel.josie.trust':2,'rel.josie.desire':1},then:[
    n(`She looks at you with something sharp and fragile in her face. She doesn’t say anything. She puts her head on your shoulder instead and it’s the most intimate thing that’s happened to you in a year.`)]}),
  o(`“You’ve got an exam, a mother, and a diner. You’re allowed to be scared.”`,{tag:['Wit'],fx:{wit:1,'rel.josie.trust':1},then:[s('josie',`That’s the most practical thing anyone’s ever said to me. I’m going to put it on a pillow.`)]}),
  o(`Kiss her.`,{tag:['Charm'],show:()=>true,then:[
    ['if',()=>G.rel.josie.trust>=3,[
      s('josie',`Ask first.`),s('theo',`Can I?`),s('josie',`I thought you’d never.`),
      n(`It starts slow and warm and tastes like cake. Then it isn’t slow anymore. Her hand fists in your shirt and she pulls you down against the step, one knee hooked over yours, and somewhere in the middle of it she makes a small startled sound as if she’s surprised by her own appetite. You break apart because you both need air, foreheads together, and she’s laughing under her breath.`),
      s('josie',`I have an orgo exam in four days.`),s('theo',`I’ll quiz you.`),s('josie',`That is the stupidest, sweetest thing. You’re going to be the end of my GPA.`),
      fx({'rel.josie.desire':3,'rel.josie.trust':1,'flag:josieKiss2':true},`Kissed Josie again on the back steps of the Blue Plate on the night of Del’s five years.`)],
     [s('josie',`Not yet. I want to want it for the right reasons.`),n(`She says it kindly. You nod. You feel, strangely, relieved, which tells you something about yourself you’ll examine later.`),fx({'rel.josie.trust':1})]]]}),
 ]),
 ['go','wed'],
];

/* ---- The mixer ---- */
SC.mixer=[
 slug('INT. THE DELTA MAGNOLIA PI HOUSE — TUESDAY — 6:58 P.M.'),

 n(`The girls are in pearls and identical posture. They have the unnerving unity of a flock. You’re handed a flute of sparkling water by a girl named Libby, who looks at you the way a customs officer looks at a suitcase.`),

 s('savannah',`Walk with me.`),
 slug('INT. DELTA MAG HOUSE — THE PRESIDENT’S OFFICE — CONTINUOUS'),
 n(`Her office is a converted sewing room with a desk, a lamp, and a single filing cabinet labeled RECIPES. She unlocks it with a key from around her neck.`),
 n(`Inside, there are no recipes. There is a row of thick black binders, spine labels in careful block print: HEALTH. TAU. BETA. INCIDENTS (UNOFFICIAL).`),
 s('savannah',`The college keeps what it’s legally required to keep. I keep the rest. Fifty-three years of what nobody wrote down. Girls who didn’t report, boys who got moved to a different house, a dean who was very good at paperwork.`),
 s('savannah',`Tau has three open files. Three. Nothing officially exists. But I know the shape of a thing when it happens twice.`),
 s('theo',`Why are you telling me?`),
 s('savannah',`Because you’re a Whitlock. Your name opens doors. And because on Saturday, I watched you ask a girl for water and hold a red cup you didn’t drink, and I thought: this one might not be a lost cause.`),
 s('savannah',`Thursday night is Tau’s Hell Night. Your roommate is on the pledge list. He’s big and sweet and he doesn’t know how to say no. Bring a phone. Make sure it’s charged.`),
 ch('The binder.',[
  o(`“Can I see the Tau file?”`,{tag:['Nerve'],fx:{nerve:1,'rel.savannah.trust':1,'flag:sawBinder':true},led:`Savannah-Claire let you read the Tau file. You didn’t sleep that night.`,then:[
    n(`You read four pages. A girl’s name, redacted, replaced by “Ms. K.” A chapter president’s signature. An address on Lake Ellison Road. You close it as if it’s hot.`),
    s('savannah',`Now you know what I know. It’s heavier than it looks.`)]}),
  o(`“Why do you keep these?”`,{tag:['Heart'],fx:{heart:1,'rel.savannah.trust':2},then:[
    n(`Her mask doesn’t slip. It just stands very still.`),s('savannah',`I was a freshman once. I didn’t have anyone who kept anything. So I made myself into a place where things could be kept.`)]}),
  o(`“I’ll keep my phone charged.”`,{tag:['Obey'],fx:{'rel.savannah.loyalty':1},then:[s('savannah',`That’s all I ask. That, and that you don’t tell Hunter I said any of this.`)]}),
 ]),
 n(`Back in the front hall, someone has put a sticker on your shirt that says HELLO, I’M PROBABLY FINE. You don’t remember getting it.`),
 ['go','wed'],
];

 ]),
 n(`Coop is on the floor.`),

 n(`The ambulance takes six minutes. It feels like six months. Two paramedics in navy come down the stairs with a gurney, and for the first time all night, nobody in the basement is performing. The disco ball is still turning. Nobody turned it off. It throws small bright circles over everything, over the faces, over the gurney, over the blindfolded pledges standing at attention, because no one has told them they can stop.`),

SC.hospital=[
