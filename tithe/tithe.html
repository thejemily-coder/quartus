<title>TITHE</title>
<meta name="description" content="TITHE: a prestige-drama text RPG. Season One: The Marches.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single candlelit reading column, like a shooting script under a lamp.
   Sticky HUD up top; title cards, recaps and credits are full-bleed black overlays;
   the journal slides in from the right. One deliberate dark world (no light theme). */
:root{
  color-scheme: dark;
  --soot:#0e0c0b; --char:#16130f; --panel:#1c1813; --line:#2e2820; --line2:#3d352a;
  --vellum:#e9dfcc; --dim:#a39684; --faint:#6f6558;
  --brass:#c9a35b; --brass-ink:#1a140c; --blood:#b2402f; --moss:#7f9c6a; --star:#9fb6e8;
  --f-display:'IM Fell English SC', 'IM Fell English', Georgia, serif;
  --f-body:'Spectral', 'Iowan Old Style', Georgia, serif;
  --f-ui:'Spline Sans Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --col: 40rem;
}
html,body{background:var(--soot);color:var(--vellum)}
body{font-family:var(--f-body);font-size:1.08rem;line-height:1.7;margin:0;min-height:100%;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(201,163,91,.10), transparent 60%),
    radial-gradient(80% 50% at 50% 110%, rgba(178,64,47,.06), transparent 70%),
    var(--soot);
  background-attachment: fixed;}
body.jopen{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.muted{color:var(--dim)}
em.stl,.stl{display:block;font-style:normal;font-family:var(--f-ui);font-size:.72rem;color:var(--brass);letter-spacing:.02em;margin-top:.2rem}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(14,12,11,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);font-family:var(--f-ui);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.hud-in{max-width:56rem;margin:0 auto;padding:.55rem 16px;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.wordmark{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.32em;color:var(--brass);text-transform:none}
#hud-ep{color:var(--dim);flex:1;min-width:8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .cell{display:flex;align-items:center;gap:.4rem}
.hud .lbl{color:var(--faint)}
.hud .num{font-variant-numeric:tabular-nums;color:var(--vellum)}
.hud .bar{width:4.5rem}
.hud .dot{width:.45rem;height:.45rem;border-radius:50%;background:var(--brass);box-shadow:0 0 8px var(--brass)}
#hud-j{background:transparent;border:1px solid var(--line2);color:var(--brass);padding:.3rem .7rem;cursor:pointer;letter-spacing:.12em;font-family:var(--f-ui);font-size:.7rem;text-transform:uppercase}
#hud-j:hover{border-color:var(--brass)}
.bar{height:.4rem;background:#2a221b;border-radius:1px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7e2a1f,var(--blood));transition:width .4s}
.bar.foebar i{background:linear-gradient(90deg,#5d4a33,var(--brass))}
.pips{display:inline-flex;gap:3px}
.pips i{width:.5rem;height:.5rem;border:1px solid var(--brass);transform:rotate(45deg);display:inline-block}
.pips i.on{background:var(--brass)}

/* story column */
main{max-width:var(--col);margin:0 auto;padding-inline:16px;padding-block:2rem 40vh}
.beat{margin-block:0 1.4rem;animation:rise .5s ease both}
@keyframes rise{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.beat{animation:none}}
.slug{font-family:var(--f-ui);font-size:.72rem;text-transform:uppercase;letter-spacing:.16em;color:var(--brass);
  border-bottom:1px solid var(--line);padding-bottom:.35rem;margin-bottom:1rem}
.prose .line{margin:0 0 1rem;text-wrap:pretty}
.prose .line.dia .who{display:block;font-family:var(--f-ui);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:.05rem}
.prose .line.dir{font-family:var(--f-ui);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-block:1.3rem}
.prose .line.inner{font-style:italic;color:#cbbfa9;border-left:2px solid var(--line2);padding-left:.9rem}
.prose strong{color:#fff3dc;font-weight:600}
.echo{font-family:var(--f-ui);font-size:.78rem;color:var(--brass);letter-spacing:.04em;margin:-.4rem 0 1.4rem}

/* choices */
.choices{display:flex;flex-direction:column;gap:.5rem;margin:1.2rem 0 1.6rem}
.choices.done .choice:not(.picked){display:none}
.choices.done .choice.picked{display:none}
.choice{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;text-align:left;cursor:pointer;background:var(--char);
  border:1px solid var(--line2);padding:.75rem 1rem;font-family:var(--f-body);font-size:1rem;line-height:1.45;color:var(--vellum);transition:border-color .15s, background .15s}
.choice:hover:not(:disabled){border-color:var(--brass);background:#221c15}
.choice.cont{justify-content:center;font-family:var(--f-ui);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);background:transparent}
.choice.locked{opacity:.45;cursor:not-allowed}
.choice .ct{flex:1;min-width:0}
.tag{font-family:var(--f-ui);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line2);padding:.05rem .4rem;white-space:nowrap}
.tag.chk{color:var(--brass);border-color:#5a4a2c}
.tag.cost{color:var(--moss);border-color:#3c4b33}
.choice.next-ep{justify-content:center;padding:1.1rem;font-family:var(--f-display);font-size:1.35rem;letter-spacing:.06em;border-color:var(--brass)}
.roll{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;font-family:var(--f-ui);font-size:.74rem;color:var(--dim);margin:-.6rem 0 1.4rem;padding:.5rem .7rem;border:1px dashed var(--line2)}
.roll .die{font-family:var(--f-display);font-size:1.3rem;color:var(--vellum);width:2rem;text-align:center}
.roll .res{margin-left:auto;text-transform:uppercase;letter-spacing:.15em}
.roll.pass .res{color:var(--moss)} .roll.fail .res{color:var(--blood)}

/* hub */
.hubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.6rem;margin:1.2rem 0}
.hubcard,.listrow{display:flex;flex-direction:column;gap:.15rem;text-align:left;cursor:pointer;background:var(--char);border:1px solid var(--line2);padding:.8rem 1rem;color:var(--vellum)}
.hubcard b,.listrow b{font-family:var(--f-display);font-size:1.15rem;font-weight:400;letter-spacing:.02em}
.hubcard span,.listrow span{font-size:.92rem;color:var(--dim)}
.listrow i{font-family:var(--f-ui);font-size:.68rem;color:var(--brass);font-style:normal;letter-spacing:.06em}
.listrow b i{margin-left:.4rem}
.hubcard:hover:not(:disabled),.listrow:hover:not(:disabled){border-color:var(--brass)}
.hubcard:disabled,.listrow:disabled{opacity:.42;cursor:not-allowed}
.list{display:flex;flex-direction:column;gap:.5rem;margin:1rem 0}
.subhead{font-family:var(--f-ui);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin-top:1rem}

/* combat */
.combat{border:1px solid var(--line2);background:linear-gradient(180deg,#1a1510,#120f0c);padding:1rem;margin:0 0 1.4rem}
.combat.over{opacity:.7}
.c-head{display:flex;justify-content:space-between;font-family:var(--f-ui);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--blood);margin-bottom:.8rem}
.foes{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:.5rem}
.foe{display:flex;flex-direction:column;gap:.3rem;text-align:left;background:var(--panel);border:1px solid var(--line2);padding:.6rem .7rem;cursor:pointer;min-width:0}
.foe.sel{border-color:var(--blood);box-shadow:inset 0 0 0 1px var(--blood)}
.foe.dead{opacity:.4;cursor:default}
.foe b,.pc b{font-family:var(--f-display);font-weight:400;font-size:1rem}
.foe .bar,.pc .bar{width:100%}
.hpn{font-family:var(--f-ui);font-size:.66rem;color:var(--dim);font-variant-numeric:tabular-nums}
.intent{font-size:.85rem;font-style:italic;color:#d9c9ad;line-height:1.35}
.intent .heavy{font-style:normal;font-family:var(--f-ui);font-size:.62rem;letter-spacing:.12em;color:var(--soot);background:var(--blood);padding:0 .3rem;margin-right:.2rem}
.intent2{font-family:var(--f-ui);font-size:.64rem;color:var(--star)}
.sts{display:flex;gap:.25rem;flex-wrap:wrap}
.st{font-family:var(--f-ui);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:0 .3rem;border:1px solid var(--line2);color:var(--dim)}
.st-bleed,.st-burn{color:var(--blood);border-color:#5a2a22}.st-stun,.st-weaken{color:var(--brass)}.st-fear{color:var(--star)}.st-guard{color:var(--moss)}.st-silvered{color:#dfe6ee}
.party{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.5rem;margin-top:.7rem}
.pc{display:flex;flex-direction:column;gap:.25rem;padding:.5rem .7rem;border:1px solid var(--line);background:#14110d;min-width:0}
.pc.me{border-color:#4a3d29}.pc.dead{opacity:.4}
.clog{margin:.8rem 0;padding:.6rem .8rem;border-left:2px solid var(--line2);font-size:.92rem;min-height:3rem}
.clog p{margin:0 0 .25rem}
.clog .hit{color:var(--vellum)}.clog .bad{color:#e3a093}.clog .miss{color:var(--faint)}.clog .kill{color:var(--brass)}.clog .good{color:#b5cf9f}.clog .cosmic{color:var(--star);font-style:italic}.clog .sys{color:var(--dim)}
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.4rem}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;text-align:left;background:var(--char);border:1px solid var(--line2);padding:.5rem .65rem;cursor:pointer}
.act b{font-family:var(--f-ui);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--vellum)}
.act span{font-size:.78rem;color:var(--dim);line-height:1.3}
.act.skill{border-color:#4a3d29}.act.skill b{color:var(--brass)}
.act:hover:not(:disabled){border-color:var(--brass)}
.act:disabled{opacity:.4;cursor:not-allowed}
.c-result{font-family:var(--f-display);font-size:1.3rem;color:var(--brass);letter-spacing:.1em}
.spoils{font-family:var(--f-ui);font-size:.74rem;color:var(--dim);margin:-.6rem 0 1.4rem}
.spoils b{color:var(--brass);letter-spacing:.14em;text-transform:uppercase;margin-right:.4rem}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:#000;color:var(--vellum);overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:calc(2rem + env(safe-area-inset-top,0px)) 16px calc(2rem + env(safe-area-inset-bottom,0px))}
.overlay[hidden]{display:none!important}
.overlay > div{max-width:36rem;width:100%;text-align:center;animation:fadein 1.2s ease both;margin:auto}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.overlay > div{animation:none}}
.btn{background:var(--brass);color:var(--brass-ink);border:1px solid var(--brass);padding:.7rem 1.6rem;font-family:var(--f-ui);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;margin-top:2rem}
.btn.ghost{background:transparent;color:var(--brass)}
.t-show,.ts-show,.cr-show{font-family:var(--f-display);font-size:clamp(3.5rem,16vw,7.5rem);letter-spacing:.32em;line-height:1;padding-left:.32em;color:var(--vellum);text-shadow:0 0 40px rgba(201,163,91,.25)}
.titles .t-show{animation:breathe 6s ease-in-out both}
@keyframes breathe{0%{letter-spacing:.6em;opacity:0;filter:blur(6px)}40%{opacity:1;filter:none}100%{letter-spacing:.32em}}
@media (prefers-reduced-motion: reduce){.titles .t-show{animation:none}}
.t-rule,.ts-rule{width:5rem;height:1px;background:var(--brass);margin:1.4rem auto}
.t-ep,.ts-sub,.cr-ep,.ts-kicker{font-family:var(--f-ui);font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--brass)}
.ts-kicker{color:var(--dim);margin-bottom:1rem}
.t-name{font-family:var(--f-display);font-size:clamp(1.8rem,6vw,2.8rem);margin-top:.6rem}
.t-sub{color:var(--dim);font-style:italic;margin-top:.6rem}
.ts-log{color:#cdbfa8;font-size:1.05rem;margin:2rem auto 0;max-width:30rem;text-wrap:pretty}
.ts-btns{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.ts-warn{font-family:var(--f-ui);font-size:.66rem;letter-spacing:.06em;color:var(--faint);margin-top:2.4rem;max-width:26rem;margin-inline:auto}
.cardx .c-title{font-family:var(--f-display);font-size:clamp(1.6rem,6vw,2.6rem);letter-spacing:.06em}
.cardx .c-sub{font-family:var(--f-ui);font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin-top:.8rem}
.prevon{text-align:left!important}
.p-head,.nt-head{font-family:var(--f-ui);font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin-bottom:1.4rem;text-align:center}
.p-head span{font-family:var(--f-display);font-size:1.1rem;color:var(--brass);letter-spacing:.3em;text-transform:none}
.p-clip{border-left:2px solid var(--brass);padding-left:1rem;margin:0 0 1rem;color:#d7cab3;animation:fadein .8s ease both}
.p-clip:nth-child(3){animation-delay:.6s}.p-clip:nth-child(4){animation-delay:1.2s}.p-clip:nth-child(5){animation-delay:1.8s}.p-clip:nth-child(6){animation-delay:2.4s}
.credits .cr-show{font-size:clamp(2.6rem,12vw,4.5rem)}
.cr-cast{list-style:none;padding:0;margin:1.6rem 0;font-family:var(--f-ui);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);line-height:2}
.nexttime{margin-top:2rem;text-align:left;border-top:1px solid var(--line);padding-top:1.4rem}
.nexttime p{color:#d7cab3;font-style:italic}
.deathx .d-title{font-family:var(--f-display);font-size:clamp(2.2rem,9vw,3.6rem);color:var(--star);letter-spacing:.1em}
.deathx p{color:#cdbfa8;margin-top:1.4rem}
.d-btns{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}

/* journal */
.journal{position:fixed;inset:0 0 0 auto;width:min(34rem,100%);z-index:40;background:var(--char);border-left:1px solid var(--line2);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-30px 0 60px rgba(0,0,0,.6)}
.journal[hidden]{display:none!important}
.jtop{display:flex;align-items:center;justify-content:space-between;padding:.8rem 16px;border-bottom:1px solid var(--line)}
.jtop .wordmark{font-size:1rem}
#jclose{background:none;border:1px solid var(--line2);color:var(--dim);font-family:var(--f-ui);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;padding:.3rem .7rem;cursor:pointer}
#jtabs{display:flex;flex-wrap:wrap;gap:.25rem;padding:.6rem 16px;border-bottom:1px solid var(--line)}
#jtabs button{background:none;border:1px solid transparent;color:var(--dim);font-family:var(--f-ui);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;padding:.3rem .55rem;cursor:pointer}
#jtabs button.on{color:var(--brass);border-color:var(--line2)}
#jbody{overflow-y:auto;padding:1rem 16px 3rem;flex:1;font-size:.98rem}
#jbody h2{font-family:var(--f-display);font-weight:400;font-size:1.8rem;margin:0}
#jbody h3{font-family:var(--f-ui);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);font-weight:500;margin:1.6rem 0 .6rem;border-bottom:1px solid var(--line);padding-bottom:.3rem}
.pts{color:var(--vellum);font-style:normal;margin-left:.5rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.25rem 1rem;margin-top:.8rem;font-size:.92rem}
.kv span{color:var(--dim)} .kv b{font-weight:500;font-variant-numeric:tabular-nums}
.statrow{display:grid;grid-template-columns:6rem 3.5rem 1fr auto;gap:.5rem;align-items:baseline;padding:.3rem 0;border-bottom:1px solid var(--line)}
.statrow .sv{font-family:var(--f-ui);font-variant-numeric:tabular-nums}
.statrow .sv i{color:var(--faint);font-style:normal}
.statrow .muted{font-size:.85rem}
@media (max-width:30rem){.statrow{grid-template-columns:5.5rem 3rem 1fr auto}.statrow .muted{grid-column:1/-1;grid-row:2}}
.mini{background:transparent;border:1px solid #5a4a2c;color:var(--brass);font-family:var(--f-ui);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;padding:.2rem .5rem;cursor:pointer;margin-left:.3rem}
.mini:hover{background:#2a2117}
.mini.danger{border-color:#5a2a22;color:#e3a093}
.itemrow,.skill,.quest,.person,.beast,.codex,.slot{padding:.6rem 0;border-bottom:1px solid var(--line)}
.itemrow p,.skill p,.quest p,.person p,.beast p{margin:.2rem 0 0;font-size:.9rem}
.skill.have b{color:var(--brass)}
.branch{margin-bottom:1rem}.branch.locked h3{color:var(--star)}
.quest.done b{color:var(--moss)}.quest.failed b{color:var(--blood)}
.person .tag,.beast .tag,.skill .tag,.quest .tag,.itemrow .tag{margin-left:.5rem}
.bondm{font-family:var(--f-ui);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin-top:.3rem}
.codex p{margin:.3rem 0 0}
.slot{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap}
.slot .muted{flex:1;min-width:10rem;font-size:.85rem}
textarea{width:100%;box-sizing:border-box;background:var(--soot);color:var(--vellum);border:1px solid var(--line2);font-family:var(--f-ui);font-size:.7rem;padding:.5rem}
.row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-top:.5rem}

/* toasts */
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:.35rem;align-items:flex-end;pointer-events:none;max-width:calc(100% - 32px)}
.toast{background:#1d1812;border:1px solid var(--line2);border-left:3px solid var(--brass);padding:.45rem .8rem;font-family:var(--f-ui);font-size:.72rem;letter-spacing:.04em;color:var(--vellum);transition:opacity .5s, transform .5s;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.out{opacity:0;transform:translateY(6px)}
.toast.bond{border-left-color:var(--moss);font-style:italic;font-family:var(--f-body);font-size:.88rem}
.toast.bondneg{border-left-color:var(--blood);font-style:italic;font-family:var(--f-body);font-size:.88rem}
.toast.bad{border-left-color:var(--blood)} .toast.codex{border-left-color:var(--star)} .toast.lvl{border-left-color:#fff3dc;color:#fff3dc}
@media (max-width:34rem){
  .hud-in{gap:.55rem .8rem}
  #hud-ep{order:9;flex-basis:100%}
  .hud .bar{width:3rem}
  body{font-size:1.02rem}
}

</style>
<header class="hud" role="banner">
  <div class="hud-in">
    <span class="wordmark" aria-label="Tithe">TITHE</span>
    <span id="hud-ep"></span>
    <span class="cell" id="hud-hp"></span>
    <span class="cell" id="hud-st"></span>
    <span class="cell" id="hud-sv"></span>
    <span class="cell" id="hud-lv"></span>
    <button id="hud-j" type="button">Journal</button>
  </div>
</header>
<main id="story" aria-live="polite"></main>
<aside class="journal" id="journal" hidden aria-label="Journal">
  <div class="jtop"><span class="wordmark">Journal</span><button id="jclose" type="button">Close</button></div>
  <nav id="jtabs"></nav>
  <div id="jbody"></div>
</aside>
<div class="overlay" id="overlay" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script>
/* TITHE — static game data: cast, items, enemies, skills, recipes, regions, codex.
   Episodes register themselves via TITHE.episode({...}) in src/episodes/*.js. */
var TITHE = window.TITHE = window.TITHE || {};
TITHE.EPISODES = TITHE.EPISODES || {};
TITHE.episode = function (def) { TITHE.EPISODES[def.n] = def; };

TITHE.STATS = {
  might:    { name: 'Might',    blurb: 'Force, intimidation, breaking things.' },
  finesse:  { name: 'Finesse',  blurb: 'Speed, stealth, aim, locks, hands.' },
  grit:     { name: 'Grit',     blurb: 'Endurance, willpower, drink, pain, fear.' },
  wits:     { name: 'Wits',     blurb: 'Perception, knowledge, tactics, reading people.' },
  presence: { name: 'Presence', blurb: 'Persuasion, command, seduction, lies.' }
};

/* Cast. color = UI accent for dialogue. bond:true means a bond meter is tracked. */

  lamp:      { title: 'The Lamp', text: 'The church of Aldermere. The stars are the Saints who ascended; the dead rise to sing among them in eternal light. Lamplighters tend the faith; Lampwardens enforce it. Every soul owes the Lamp a tithe of silver, and every body owes it a pyre.' },
  kindling:  { title: 'The Kindling', text: 'The Lamp\'s funeral: the body is burned on a pyre so the smoke may carry the soul up to the Saints. Without the Kindling, the Lamp teaches, the soul is lost in the dark.' },
  earthburial:{ title: 'Earth-Burial', text: 'The oldest heresy in Aldermere: putting the dead in the ground. Punishable by burning. The fen-folk still do it, quietly, and leave a bowl of milk by the water.' },
  corransford:{ title: 'Corran\'s Ford', text: 'A river crossing two days east. Six years ago, the Red Company, four hundred spears, was destroyed there in a crossfire. There is an old standing stone on the near bank, carved with a seven-pointed star, older than the kingdom.' },
  redcompany: { title: 'The Red Company', text: 'A free company of four hundred spears, the best in the March. Captain: Konrad Hask. Sergeant: Ansel Dray. Destroyed at Corran\'s Ford. The survivors could be counted on one hand. The roll is in your saddlebag.' },
  hollowing: { title: 'The Hollowing', text: 'People found alive, breathing, walking, eating — and empty. No speech, no memory, no self. Harrowgate calls it a sickness. It does not spread like one.' },

  starless:  { title: 'The Starless One', text: 'A Lamp prophecy from the Book of Embers: "And in the last days there shall walk one whom Heaven cannot number; and the Lamp shall gutter at his passing." Most Lamplighters think it is a metaphor.' },
  barrows:   { title: 'The Barrows', text: 'The grass-crowned graves of the First Kings, who ruled before the Lamp. Nobody opens them. Grave-robbers who do are found in the morning sitting very still.' },
  compact:   { title: 'The Carvings', text: 'In the Barrow of the Nine Crowns: kings kneeling before seven-pointed stars. The stars have mouths. Beneath the kings, under the floor of the carving, something vast, curled, sleeping, chained.' },
  smalltithe:{ title: 'The Small Tithe', text: 'A rite performed in the crypt of the Lanternhold. The soul is drawn up out of a living body through the mouth, as light. What remains walks, eats and works. The Abbess keeps very careful books.' },
  unreckoned:{ title: 'Unreckoned', text: 'The Tallyman looked for you in his ledger and could not find you. Every soul is written down. Every soul but one.' },

    camp1: {
      loc: 'A shepherd\'s fold on the downs — night',
      text: [
        { if: "f.e1_ashby==='led'", t: 'You make camp in a drystone sheepfold off the road, with the thirty-one sitting in rows against the wall where you put them, like children at chapel. They don\'t sleep. You check. They just sit, eyes open, and the firelight moves in them.' },
        { if: "f.e1_ashby!=='led'", t: 'You make camp in a drystone sheepfold off the road. Odo eats three suppers and falls asleep inside the wagon among his cloth, snoring like a sow.' },
        'The rain stops. The clouds tear open. The stars come out.',
        'You get up from the fire without a word and take your blanket under the wagon, where the boards hide the sky.',
        'Tamsin watches you go. A while later she crawls under too, with her bow and a skin of something, and sits cross-legged with her back to the wheel.',

/* ---------- conditions ---------- */
var condCache = {};

}

function fx(e) {

  }

  if (e.quest) {
